<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier quant</title>
<style>
:root { --fond:#f5f6f8; --carte:#ffffff; --texte:#1f2328; --doux:#646b75; --trait:#e3e6ea; --trait-fort:#cdd2d8; --accent:#2f5bd3; --accent-doux:#eef2fc; --bon:#1f7a4d; --bon-doux:#eaf6ef; --faux:#c0392b; --faux-doux:#fcecea; --alerte:#9a5a08; --alerte-doux:#fdf3e4; --code:#f6f8fa; --ombre:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06); }
@media (prefers-color-scheme: dark) { :root { --fond:#0f1115; --carte:#171a20; --texte:#e6e8eb; --doux:#9aa1ab; --trait:#262b33; --trait-fort:#363c46; --accent:#86a8ff; --accent-doux:#1a2135; --bon:#5cc98f; --bon-doux:#13251c; --faux:#f08479; --faux-doux:#2b1716; --alerte:#e2a54f; --alerte-doux:#2a2013; --code:#12151a; --ombre:none; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--fond); color:var(--texte); font:15.5px/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
a { color:var(--accent); }

/* Barre supérieure */
header { position:sticky; top:0; z-index:10; background:var(--carte); border-bottom:1px solid var(--trait); height:56px; padding:0 20px; display:flex; gap:14px; align-items:center; }
#lienAccueil { display:flex; align-items:center; gap:8px; color:var(--texte); font-weight:650; font-size:15px; text-decoration:none; white-space:nowrap; padding-right:14px; border-right:1px solid var(--trait); }
#lienAccueil::before { content:""; width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #7b4bd6)); }
#lienAccueil[hidden] { display:none; }
header h1 { font-size:14.5px; font-weight:600; margin:0; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#position { font-size:13px; color:var(--doux); white-space:nowrap; }
#progression { position:absolute; left:0; right:0; bottom:-1px; height:2px; background:transparent; }
#progression > span { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
#chrono { font:600 15px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; font-variant-numeric:tabular-nums; background:var(--fond); border:1px solid var(--trait); border-radius:999px; padding:7px 12px; }
#chrono.depasse { color:var(--faux); border-color:var(--faux); }
@media (max-width:720px) { #position { display:none; } header { padding:0 12px; gap:8px; } }

/* Mise en page */
main { padding:28px 24px 96px; }
main > .carte, main > .fiche, main > .tableau-bord { max-width:880px; margin-left:auto; margin-right:auto; }
.cadre { display:grid; grid-template-columns:250px minmax(0, 1fr); gap:32px; max-width:1180px; margin:0 auto; align-items:start; }
main.large .cadre { max-width:none; }
.contenu { min-width:0; max-width:820px; }
main.lecture .contenu { max-width:880px; }
main.large .contenu { max-width:none; }
@media (max-width:1000px) { .cadre { grid-template-columns:1fr; gap:16px; } }

/* Plan de la séance (colonne gauche) */
.plan { scrollbar-width:thin; scrollbar-color:var(--trait-fort) transparent; position:sticky; top:84px; max-height:calc(100vh - 104px); overflow-y:auto; font-size:13.5px; }
.plan .groupe { font-size:11.5px; font-weight:650; letter-spacing:.06em; text-transform:uppercase; color:var(--doux); margin:16px 0 6px 10px; }
.plan .groupe:first-child { margin-top:0; }
#pastilles { display:flex; flex-direction:column; gap:2px; }
.pastille { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; background:none; border-radius:8px; padding:6px 10px; font-size:13.5px; color:var(--texte); }
.pastille:hover:not(:disabled) { background:color-mix(in srgb, var(--doux) 9%, transparent); }
.pastille .etat { flex:none; width:18px; height:18px; border-radius:50%; border:1.5px solid var(--trait-fort); display:grid; place-items:center; font-size:10px; color:#fff; }
.pastille.faite .etat { background:var(--accent); border-color:var(--accent); }
.pastille.faite .etat::after { content:"✓"; }
.pastille .libelle { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pastille.courante { background:var(--accent-doux); color:var(--accent); font-weight:600; }
.pastille.courante .etat { border-color:var(--accent); }
@media (max-width:1000px) { .plan { position:static; max-height:none; } #pastilles { flex-direction:row; flex-wrap:wrap; } .pastille { width:auto; } .pastille .libelle { display:none; } .plan .groupe { display:none; } }

/* Cartes */
.carte { background:var(--carte); border:1px solid var(--trait); border-radius:12px; padding:22px 26px; margin-bottom:18px; box-shadow:var(--ombre); }
h2 { font-size:21px; font-weight:650; letter-spacing:-.01em; margin:0 0 10px; }
h3 { font-size:17px; font-weight:650; margin:20px 0 6px; }
h4 { font-size:15px; font-weight:650; margin:16px 0 4px; }
.meta { color:var(--doux); font-size:13.5px; }
.surtitre { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:14px; font-size:13px; color:var(--doux); }
.surtitre .rang { font-weight:650; color:var(--texte); }
.chip { display:inline-block; max-width:420px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; font-size:12px; font-weight:550; padding:2px 10px; border-radius:999px; background:var(--accent-doux); color:var(--accent); }
.note { background:var(--alerte-doux); border-radius:10px; padding:10px 14px; color:var(--texte); font-size:14px; margin:12px 0; }
.note p { margin:4px 0; }
.consigne { font-size:13px; color:var(--doux); margin:18px 0 8px; }

/* Boutons */
button { font:inherit; font-size:14px; font-weight:550; padding:8px 14px; border-radius:8px; border:1px solid var(--trait-fort); background:var(--carte); color:var(--texte); cursor:pointer; transition:background .15s, border-color .15s; }
button:hover:not(:disabled) { background:color-mix(in srgb, var(--doux) 8%, var(--carte)); }
button.principal { background:var(--accent); border-color:var(--accent); color:#fff; }
button.principal:hover:not(:disabled) { background:color-mix(in srgb, var(--accent) 88%, #000); }
@media (prefers-color-scheme: dark) { button.principal { color:#0d1220; } }
button:disabled { opacity:.45; cursor:default; }
header button { padding:6px 12px; font-size:13px; }
.barre { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:16px; }
.navigation { border-top:1px solid var(--trait); margin-top:26px; padding-top:18px; }
.navigation #prec { margin-right:auto; }
.navigation #finir { order:1; }
.navigation #suiv { order:2; }

/* Options d'une question */
.option { display:flex; gap:14px; align-items:flex-start; border:1px solid var(--trait-fort); border-radius:10px; padding:13px 16px; margin:10px 0; cursor:pointer; background:var(--carte); transition:border-color .12s, background .12s; }
.option:hover { border-color:var(--accent); }
.option .lettre { flex:none; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--trait-fort); display:grid; place-items:center; font-size:12.5px; font-weight:650; color:var(--doux); margin-top:-1px; }
.option .lettre.carre { border-radius:6px; }
.option p { margin:0; }
.option.choisie { border-color:var(--accent); background:var(--accent-doux); }
.option.choisie .lettre { background:var(--accent); border-color:var(--accent); color:#fff; }
.option.juste { border-color:var(--bon); }
.option.fausse { border-color:var(--trait); }
.explication { font-size:14px; color:var(--doux); margin-top:6px; }
.etiquette { font-size:13px; font-weight:600; }
.bon { color:var(--bon); } .faux { color:var(--faux); }

/* Code, tableaux */
pre { background:var(--code); border:1px solid var(--trait); border-radius:8px; padding:12px 14px; overflow-x:auto; font:13px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; }
code { font:13px ui-monospace, "Cascadia Mono", Consolas, monospace; background:var(--code); border:1px solid var(--trait); padding:0 4px; border-radius:4px; }
pre code { background:none; border:0; padding:0; }
.defile { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:14px; margin:10px 0; }
th { font-size:12px; font-weight:650; letter-spacing:.04em; text-transform:uppercase; color:var(--doux); }
th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--trait); vertical-align:top; }
td.nombre, th.nombre { text-align:right; font-variant-numeric:tabular-nums; }
textarea.json { width:100%; min-height:140px; font:12.5px ui-monospace, Consolas, monospace; background:var(--code); color:var(--texte); border:1px solid var(--trait); border-radius:8px; padding:8px; }
details { margin-top:10px; } summary { cursor:pointer; color:var(--accent); font-weight:550; }

/* Question de code : énoncé à gauche, notebook à droite */
.deux { display:grid; grid-template-columns:minmax(300px, 38%) 1fr; gap:18px; align-items:start; }
.deux > .carte { margin:0; }
.deux .enonce { position:sticky; top:76px; max-height:calc(100vh - 96px); overflow-y:auto; }
@media (max-width:1100px) { .deux { grid-template-columns:1fr; } .deux .enonce { position:static; max-height:none; } }
.notebook-barre { display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--trait); padding-bottom:12px; margin-bottom:12px; }
.notebook-barre button { font-size:13px; padding:6px 11px; }
.notebook-barre #versions { margin-left:auto; }
.notebook-barre .meta { font-size:12.5px; }
.cellule { display:grid; grid-template-columns:48px 1fr; gap:6px; margin:12px 0; }
.cellule .numero { font:12px ui-monospace, Consolas, monospace; color:var(--doux); text-align:right; padding-top:9px; }
.cellule .editeur { border:1px solid var(--trait); border-radius:8px; overflow:hidden; background:var(--code); }
.cellule.active .editeur { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-doux); }
.cellule .editeur textarea { border:none; border-radius:0; }
.cellule textarea { width:100%; resize:none; overflow:hidden; min-height:44px; font:13.5px/1.5 ui-monospace, Consolas, monospace; tab-size:4; background:var(--code); color:var(--texte); border:1px solid var(--trait); border-radius:8px; padding:8px 10px; white-space:pre; overflow-x:auto; }
.cellule .actions { display:flex; gap:6px; margin-top:4px; }
.cellule .actions button { font-size:12px; padding:2px 8px; font-weight:500; }
.cellule pre.sortie { margin:4px 0 0; max-height:420px; overflow:auto; }
.cellule pre.sortie:empty { display:none; }
pre .erreur { color:var(--faux); }
.resultats-tests { margin-top:12px; }
#voile { position:fixed; inset:0; z-index:20; background:color-mix(in srgb, var(--fond) 92%, transparent); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:16px; }
#voile[hidden] { display:none; }
#voile .carte { max-width:480px; text-align:center; }
#voile .barre { justify-content:center; }
.deux.lecon { grid-template-columns:minmax(320px, 56%) 1fr; }
.deux.lecon .enonce { max-height:calc(100vh - 96px); }
pre.sortie-lecon { margin-top:-6px; border-style:dashed; color:var(--doux); }

/* Leçons : colonne de lecture, une partie à la fois, onglets */
main.lecture .carte.enonce { padding:26px 40px 30px; }
.lecon-corps { font-size:16px; line-height:1.72; max-width:74ch; margin:0 auto; }
.lecon-corps p { margin:0.75em 0; }
.lecon-corps li { margin:0.4em 0; padding-left:2px; }
.lecon-corps ol, .lecon-corps ul { padding-left:1.4em; }
.lecon-corps ol > li::marker { font-weight:650; color:var(--doux); }
.lecon-corps h3 { font-size:23px; font-weight:700; letter-spacing:-.015em; line-height:1.3; margin:8px 0 16px; }
.lecon-corps table { font-size:14.5px; line-height:1.55; }
.lecon-corps mjx-container { font-size:102% !important; }
.lecon-corps mjx-container[display="true"], .lecon-corps p.formule > mjx-container { display:block; text-align:center; margin:0.7em 0; overflow-x:auto; overflow-y:hidden; }
.sommaire { display:flex; flex-wrap:wrap; gap:0 2px; margin:0 0 24px; border-bottom:1px solid var(--trait); }
.sommaire button { flex:none; font-size:13px; font-weight:550; padding:10px 12px; border:0; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--doux); margin-bottom:-1px; }
.sommaire button:hover:not(:disabled) { background:none; color:var(--texte); }
.sommaire button.active { color:var(--accent); border-bottom-color:var(--accent); }
.partie[hidden] { display:none; }
.pied-partie { display:flex; gap:10px; align-items:center; justify-content:space-between; margin:28px 0 4px; padding-top:18px; border-top:1px solid var(--trait); }
.pied-partie .meta { flex:1; text-align:center; }
.bloc { --teinte:var(--doux); border:1px solid var(--trait); border-radius:10px; padding:6px 20px 10px; margin:18px 0; background:var(--carte); }
.bloc > h4, .bloc > summary { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--teinte); margin:10px 0 2px; }
.bloc.enonce-bloc { --teinte:var(--accent); background:var(--accent-doux); border-color:transparent; }
.bloc.exemple { --teinte:var(--bon); } .bloc.pieges { --teinte:var(--faux); } .bloc.limites { --teinte:var(--alerte); }
.bloc.preuve { background:var(--fond); }
details.bloc > summary { cursor:pointer; list-style:revert; padding:6px 0; }
details.bloc > summary .meta { text-transform:none; letter-spacing:0; font-weight:400; margin-left:6px; }
details.bloc[open] > summary { margin-bottom:6px; }
.controle { border:1px solid var(--trait-fort); border-radius:12px; padding:14px 18px; margin:22px 0; background:var(--fond); }
.controle .titre-controle { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--accent); margin:0 0 6px; }
.controle .option { background:var(--carte); }

/* Fiche de question : débrief et bilan */
.fiche { background:var(--carte); border:1px solid var(--trait); border-radius:12px; margin:0 0 20px; overflow:hidden; font-size:15px; line-height:1.65; box-shadow:var(--ombre); }
.lecon-corps .fiche { margin:24px 0; }
.fiche-tete { display:flex; align-items:center; flex-wrap:wrap; gap:6px 14px; padding:14px 22px; border-bottom:1px solid var(--trait); }
.fiche-tete .num { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--doux); white-space:nowrap; }
.fiche-tete .titre { flex:1; min-width:200px; font-weight:650; font-size:16px; }
.fiche-tete .temps { font-size:12.5px; color:var(--doux); white-space:nowrap; }
.verdict { font-size:12px; font-weight:650; padding:3px 10px; border-radius:999px; white-space:nowrap; color:var(--doux); background:var(--fond); }
.v-juste .verdict { color:var(--bon); background:var(--bon-doux); } .v-fausse .verdict { color:var(--faux); background:var(--faux-doux); } .v-incomplete .verdict { color:var(--alerte); background:var(--alerte-doux); }
.fiche-corps { padding:4px 22px 20px; }
.fiche h5 { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--doux); margin:22px 0 8px; }
.fiche-corps > h5:first-child { margin-top:16px; }
.fiche p { margin:0.6em 0; }
.fiche li { margin:0.35em 0; }
.fiche-reponses { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin:18px 0 6px; }
.fiche-reponses > div { background:var(--fond); border-radius:10px; padding:10px 14px; }
.fiche-reponses .lab { display:block; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--doux); margin-bottom:2px; }
.fiche ul.choix { list-style:none; padding:0; margin:8px 0; }
.fiche ul.choix > li { border:1px solid var(--trait); border-radius:10px; padding:9px 14px; margin:8px 0; }
.fiche ul.choix > li > strong:first-child { display:inline-block; min-width:1.8em; color:var(--doux); }
.fiche .retenir { border-radius:10px; padding:12px 16px; margin-top:20px; background:var(--accent-doux); }
.fiche .retenir h5 { margin:0 0 2px; color:var(--accent); }
.fiche .retenir p { margin:0.3em 0 0; }
.fiche .revoir { font-size:13.5px; color:var(--doux); margin:14px 0 0; }
.fiche .option { cursor:default; }
.fiche .option:hover { border-color:var(--trait); }
.fiche .option p { margin:0; }
.fiche .option .explication p { margin:3px 0 0; }
.fiche .option.juste { border-color:color-mix(in srgb, var(--bon) 45%, var(--trait)); background:var(--bon-doux); }
.fiche .option.choisie:not(.juste) { border-color:color-mix(in srgb, var(--faux) 45%, var(--trait)); background:var(--faux-doux); }
.fiche .option.choisie .lettre { background:none; color:var(--doux); border-color:var(--trait-fort); }
.fiche .option > div { flex:1; }
.puce { float:right; font-size:11px; font-weight:650; padding:2px 9px; border-radius:999px; margin-left:8px; white-space:nowrap; color:var(--doux); background:var(--fond); }
.puce.bon { color:var(--bon); background:var(--carte); } .puce.faux { color:var(--faux); background:var(--carte); }
.fiche details { margin-top:16px; border-top:1px solid var(--trait); padding-top:12px; }
.fiche details > summary { cursor:pointer; font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--doux); }

/* Présentation d'une séance et bilan */
.presentation h2 { font-size:26px; letter-spacing:-.02em; }
.sections-liste { display:grid; gap:8px; margin:18px 0; }
.sections-liste > div { display:flex; justify-content:space-between; gap:12px; background:var(--fond); border-radius:10px; padding:10px 14px; font-size:14px; }
.score-total { display:flex; align-items:baseline; gap:10px; margin:4px 0 14px; }
.score-total strong { font-size:34px; font-weight:700; letter-spacing:-.02em; }
</style>

 métriques et validation\n\nDurée visée : 30 minutes. Quatre parties : la régression logistique, les métriques de classification, les plus proches voisins avec la mise à l'échelle et la malédiction de la dimension, puis la validation (fuites d'information, validation croisée temporelle, purge et embargo). Chaque résultat suit l'ordre : le problème, l'énoncé, la preuve, un exemple chiffré, les cas limites, les pièges. La régression linéaire et la décomposition biais-variance sont supposées connues : leçon de la séance de ML 1 (`outils/lecons_reglin.py`), parties 1 et 6.\n\n**Conventions de notation**, valables pour toute la leçon :\n\n- une majuscule non grasse désigne une variable aléatoire, une minuscule une valeur ou un paramètre fixe ; en gras, une minuscule est un vecteur colonne, une majuscule une matrice fixe ;\n- les données comptent \\(n\\) observations ; l'observation \\(i\\) a un vecteur fixe \\(\\mathbf{x}_i \\in \\mathbb{R}^p\\) de \\(p\\) variables, dont la première vaut 1 quand le modèle a une constante, et une étiquette \\(y_i \\in \\{0, 1\\}\\), valeur observée de la variable aléatoire \\(Y_i\\) ; \\(\\mathbf{X}\\) est la matrice \\(n \\times p\\) de lignes \\(\\mathbf{x}_i^\\top\\), et \\(\\mathbf{y}\\) le vecteur des \\(y_i\\) ;\n- exceptions d'usage, déclarées : les effectifs VP, FP, FN, VN de la matrice de confusion, les taux TVP et TFP, l'AUC et le score de Brier gardent leur nom habituel, et sont des nombres calculés sur des données observées.\n\nTous les nombres hors des sorties de code sont calculés par `verif/seance_ml_3.py`. Le premier bloc prépare les outils ; les suivants réutilisent ses variables.\n\n```python\nimport numpy as np\nfrom scipy.stats import spearmanr\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import roc_auc_score, brier_score_loss, log_loss\nfrom sklearn.tree import DecisionTreeClassifier\nfrom sklearn.model_selection import KFold\nfrom sklearn.feature_selection import SelectKBest, f_classif\nnp.set_printoptions(precision=4, suppress=True)\n\ndef voisins(F_app, y_app, F_test, k):\n    # moyenne des réponses des k plus proches voisins (distance euclidienne) de chaque ligne de F_test\n    d2 = ((F_test[:, None, :] - F_app[None, :, :]) ** 2).sum(axis=2)\n    proches = np.argsort(d2, axis=1, kind=\"stable\")[:, :k]   # égalités départagées par l'ordre des lignes\n    return y_app[proches].mean(axis=1)\n\nprint(\"prêt\")\n```\n\n```sortie\nprêt\n```\n\nLa fonction `voisins` calcule la prédiction des plus proches voisins directement avec numpy : la règle est visible en trois lignes, et le calcul est plus rapide que la classe de scikit-learn dans cet environnement.\n\n## Partie 1 : la régression logistique\n\n### Le problème\n\nOn veut prédire une étiquette binaire et, surtout, sa **probabilité**. Les moindres carrés sur des étiquettes 0 ou 1 peuvent prédire hors de \\([0, 1]\\), et supposent une variance du bruit constante, alors qu'une variable de Bernoulli de paramètre \\(\\pi\\) a pour variance \\(\\pi(1 - \\pi)\\), qui dépend de \\(\\pi\\).\n\n### Notations et modèle\n\n- \\(\\sigma(t) = 1/(1 + e^{-t})\\), pour \\(t\\) réel : la fonction logistique, strictement croissante de \\(\\mathbb{R}\\) dans \\(]0, 1[\\).\n- \\(\\mathbf{b} \\in \\mathbb{R}^p\\) : un vecteur de coefficients candidat ; \\(t_i = \\mathbf{x}_i^\\top \\mathbf{b}\\) : le score linéaire de l'observation \\(i\\) ; \\(\\pi_i(\\mathbf{b}) = \\sigma(t_i)\\) : la probabilité prédite ; \\(\\boldsymbol{\\pi}(\\mathbf{b})\\) : le vecteur des \\(\\pi_i(\\mathbf{b})\\).\n- La **cote** d'une probabilité \\(\\pi \\in ]0, 1[\\) est \\(\\pi/(1 - \\pi)\\) ; son logarithme est le **logit**.\n- **Modèle** : les \\(Y_i\\) sont indépendantes, et \\(Y_i\\) suit la loi de Bernoulli de paramètre \\(\\sigma(\\mathbf{x}_i^\\top \\boldsymbol{\\beta})\\), où \\(\\boldsymbol{\\beta} \\in \\mathbb{R}^p\\) est fixe et inconnu. Comme \\(\\ln\\big(\\sigma(t)/(1 - \\sigma(t))\\big) = t\\), le modèle dit que le logit de la probabilité est linéaire en \\(\\mathbf{x}\\).\n- **Vraisemblance** : \\(\\prod_i \\pi_i(\\mathbf{b})^{y_i} (1 - \\pi_i(\\mathbf{b}))^{1 - y_i}\\). **Log-loss** (entropie croisée), moins le logarithme de la vraisemblance divisé par \\(n\\) : \\(\\displaystyle \\ell(\\mathbf{b}) = -\\frac{1}{n} \\sum_{i=1}^n \\big[y_i \\ln \\pi_i(\\mathbf{b}) + (1 - y_i) \\ln(1 - \\pi_i(\\mathbf{b}))\\big] = \\frac{1}{n} \\sum_{i=1}^n \\big[\\ln(1 + e^{t_i}) - y_i t_i\\big]\\). La seconde forme vient de \\(\\ln \\sigma(t) = t - \\ln(1 + e^t)\\) et \\(\\ln(1 - \\sigma(t)) = -\\ln(1 + e^t)\\). Maximiser la vraisemblance, c'est minimiser \\(\\ell\\).\n- \\(\\mathbf{W}(\\mathbf{b})\\) : la matrice diagonale \\(n \\times n\\) de coefficients \\(\\pi_i(\\mathbf{b})(1 - \\pi_i(\\mathbf{b}))\\).\n\n### L'énoncé\n\n1. **Gradient** : \\(\\nabla \\ell(\\mathbf{b}) = \\tfrac{1}{n} \\mathbf{X}^\\top (\\boldsymbol{\\pi}(\\mathbf{b}) - \\mathbf{y})\\). Même forme que les moindres carrés, avec la probabilité prédite à la place de la valeur ajustée.\n2. **Hessienne** : \\(\\nabla^2 \\ell(\\mathbf{b}) = \\tfrac{1}{n} \\mathbf{X}^\\top \\mathbf{W}(\\mathbf{b}) \\mathbf{X}\\), semi-définie positive : \\(\\ell\\) est **convexe**. Si \\(\\mathbf{X}\\) est de rang \\(p\\), elle est définie positive : \\(\\ell\\) est strictement convexe, a **au plus un** minimiseur, et tout point où le gradient s'annule est ce minimiseur global.\n3. **Pas de forme fermée** : l'équation \\(\\mathbf{X}^\\top (\\boldsymbol{\\pi}(\\mathbf{b}) - \\mathbf{y}) = \\mathbf{0}\\) n'est pas linéaire en \\(\\mathbf{b}\\) (à cause de \\(\\sigma\\)). On la résout par itérations : méthode de Newton \\(\\mathbf{b} \\leftarrow \\mathbf{b} - (\\nabla^2 \\ell)^{-1} \\nabla \\ell\\) (appelée aussi moindres carrés repondérés itérés, IRLS), ou descente de gradient ; leur convergence est admise.\n4. **Avec une constante**, au minimiseur \\(\\hat{\\boldsymbol{\\beta}}\\) : \\(\\sum_i \\pi_i(\\hat{\\boldsymbol{\\beta}}) = \\sum_i y_i\\). La probabilité moyenne prédite sur l'échantillon d'apprentissage égale la fréquence observée.\n5. **Rapport de cotes** : si \\(x_j\\) augmente de 1, les autres variables fixées, la cote prédite est multipliée par \\(e^{\\beta_j}\\), quel que soit le point de départ. La probabilité, elle, change d'une quantité qui dépend du point de départ : sa dérivée par rapport à \\(x_j\\) vaut \\(\\beta_j \\pi (1 - \\pi)\\).\n6. **Séparation parfaite** : s'il existe \\(\\mathbf{b}^\\star\\) tel que \\(\\mathbf{x}_i^\\top \\mathbf{b}^\\star > 0\\) pour tout \\(i\\) avec \\(y_i = 1\\) et \\(\\mathbf{x}_i^\\top \\mathbf{b}^\\star < 0\\) pour tout \\(i\\) avec \\(y_i = 0\\), alors \\(\\ell\\) n'a **pas** de minimiseur : sa borne inférieure est 0, non atteinte, et toute suite \\((\\mathbf{b}_m)\\) telle que \\(\\ell(\\mathbf{b}_m) \\to 0\\) vérifie \\(\\lVert \\mathbf{b}_m \\rVert \\to \\infty\\).\n\n### La preuve\n\n1. **Gradient.** La dérivée de \\(t \\mapsto \\ln(1 + e^t) - y t\\) vaut \\(e^t/(1 + e^t) - y = \\sigma(t) - y\\), et \\(\\partial t_i / \\partial b_j = x_{ij}\\). Par dérivation composée, \\(\\partial \\ell / \\partial b_j = \\tfrac1n \\sum_i (\\pi_i - y_i) x_{ij}\\) : c'est la coordonnée \\(j\\) de \\(\\tfrac1n \\mathbf{X}^\\top (\\boldsymbol{\\pi} - \\mathbf{y})\\).\n2. **Hessienne.** \\(\\sigma'(t) = e^{-t}/(1 + e^{-t})^2 = \\sigma(t)(1 - \\sigma(t))\\). En dérivant l'étape 1 par rapport à \\(b_k\\) : \\(\\partial^2 \\ell / \\partial b_j \\partial b_k = \\tfrac1n \\sum_i \\pi_i (1 - \\pi_i) x_{ij} x_{ik}\\), coefficient \\((j, k)\\) de \\(\\tfrac1n \\mathbf{X}^\\top \\mathbf{W}\\mathbf{X}\\).\n3. **Signe.** Pour \\(\\mathbf{v} \\in \\mathbb{R}^p\\) : \\(\\mathbf{v}^\\top \\mathbf{X}^\\top \\mathbf{W}\\mathbf{X}\\mathbf{v} = \\sum_i \\pi_i (1 - \\pi_i) (\\mathbf{x}_i^\\top \\mathbf{v})^2 \\ge 0\\). Chaque poids \\(\\pi_i(1 - \\pi_i)\\) est strictement positif, car \\(\\sigma\\) prend ses valeurs dans \\(]0, 1[\\) ; la somme est donc nulle si et seulement si \\(\\mathbf{X}\\mathbf{v} = \\mathbf{0}\\), ce qui force \\(\\mathbf{v} = \\mathbf{0}\\) quand \\(\\mathbf{X}\\) est de rang \\(p\\).\n4. **Convexité et minimum global.** Formule de Taylor avec reste intégral, pour \\(\\mathbf{h} \\in \\mathbb{R}^p\\) : \\(\\ell(\\mathbf{b} + \\mathbf{h}) = \\ell(\\mathbf{b}) + \\nabla \\ell(\\mathbf{b})^\\top \\mathbf{h} + \\int_0^1 (1 - u)\\,\\mathbf{h}^\\top \\nabla^2 \\ell(\\mathbf{b} + u\\mathbf{h})\\,\\mathbf{h}\\,du\\). Par l'étape 3, l'intégrale est positive, strictement si \\(\\mathbf{h} \\ne \\mathbf{0}\\) et \\(\\mathbf{X}\\) de rang \\(p\\). Si \\(\\nabla \\ell(\\mathbf{b}) = \\mathbf{0}\\), on obtient \\(\\ell(\\mathbf{b} + \\mathbf{h}) \\ge \\ell(\\mathbf{b})\\) pour tout \\(\\mathbf{h}\\), avec inégalité stricte pour \\(\\mathbf{h} \\ne \\mathbf{0}\\) dans le cas de rang \\(p\\) : minimum global, unique.\n5. **Constante.** La coordonnée du gradient associée à la colonne \\(\\mathbf{1}\\) est \\(\\tfrac1n \\sum_i (\\pi_i - y_i)\\), nulle au minimiseur.\n6. **Cotes.** La cote prédite au point \\(\\mathbf{x}\\) vaut \\(e^{\\mathbf{x}^\\top \\boldsymbol{\\beta}}\\). Remplacer \\(x_j\\) par \\(x_j + 1\\) multiplie l'exposant par \\(e^{\\beta_j}\\). Pour la probabilité : \\(\\partial \\sigma(\\mathbf{x}^\\top \\boldsymbol{\\beta}) / \\partial x_j = \\beta_j\\,\\sigma'(\\mathbf{x}^\\top \\boldsymbol{\\beta}) = \\beta_j \\pi (1 - \\pi)\\).\n7. **Séparation.** On pose \\(\\mathbf{b} = c\\,\\mathbf{b}^\\star\\), \\(c > 0\\), et \\(a_i = \\lvert \\mathbf{x}_i^\\top \\mathbf{b}^\\star \\rvert > 0\\). Si \\(y_i = 1\\), le terme \\(i\\) vaut \\(\\ln(1 + e^{t_i}) - t_i = \\ln(1 + e^{-t_i}) = \\ln(1 + e^{-c a_i})\\) ; si \\(y_i = 0\\), il vaut \\(\\ln(1 + e^{t_i}) = \\ln(1 + e^{-c a_i})\\). Chacun tend vers 0 quand \\(c \\to \\infty\\), donc la borne inférieure de \\(\\ell\\) est 0. Or pour tout \\(\\mathbf{b}\\), chaque terme s'écrit \\(\\ln(1 + e^{\\pm t_i}) > 0\\), donc \\(\\ell(\\mathbf{b}) > 0\\) : la borne n'est pas atteinte. Enfin, si une suite \\((\\mathbf{b}_m)\\) avec \\(\\ell(\\mathbf{b}_m) \\to 0\\) avait une sous-suite bornée, elle aurait une sous-suite convergente (Bolzano-Weierstrass), de limite \\(\\mathbf{b}_\\infty\\) avec \\(\\ell(\\mathbf{b}_\\infty) = 0\\) par continuité : contradiction.\n\n### Exemple chiffré\n\nQuatre observations, une constante et une variable : \\(x = (-1, 0, 1, 2)\\), \\(\\mathbf{y} = (0, 1, 0, 1)\\). Pas de séparation : l'étiquette 1 en \\(x = 0\\) est encadrée par des étiquettes 0.\n\n1. En \\(\\mathbf{b} = \\mathbf{0}\\), toutes les probabilités valent \\(\\tfrac12\\) et \\(\\ell(\\mathbf{0}) = \\ln 2 \\approx 0{,}6931\\).\n2. Gradient : \\(\\tfrac14 \\mathbf{X}^\\top (\\tfrac12 \\mathbf{1} - \\mathbf{y}) = (0{,}00 ; -0{,}25)\\) (constante : deux étiquettes 1 sur quatre, somme nulle ; pente : \\(\\tfrac14 \\big((-1)\\tfrac12 + 0 + 1 \\cdot \\tfrac12 + 2 \\cdot (-\\tfrac12)\\big)\\)). Négatif sur la pente : augmenter la pente fait baisser la perte.\n3. Hessienne : les poids \\(\\pi_i(1 - \\pi_i)\\) valent tous \\(0{,}25\\), donc \\(\\nabla^2 \\ell(\\mathbf{0}) = \\tfrac{1}{16} \\mathbf{X}^\\top \\mathbf{X} = \\begin{pmatrix} 0{,}250 & 0{,}125 \\\\ 0{,}125 & 0{,}375 \\end{pmatrix}\\), avec \\(\\mathbf{X}^\\top \\mathbf{X} = \\begin{pmatrix} 4 & 2 \\\\ 2 & 6 \\end{pmatrix}\\). Premier pas de Newton : \\(\\mathbf{b} = (-0{,}4 ; 0{,}8)\\).\n4. Le minimiseur est \\(\\hat{\\boldsymbol{\\beta}} \\approx (-0{,}454 ; 0{,}908)\\), de log-loss \\(0{,}5869 < \\ln 2\\). Probabilités ajustées \\((0{,}204 ; 0{,}388 ; 0{,}612 ; 0{,}796)\\), de somme \\(2\\), égale au nombre d'étiquettes 1 (énoncé 4). Rapport de cotes de la pente : \\(e^{0{,}908} \\approx 2{,}48\\).\n\n```python\nx = np.array([-1.0, 0.0, 1.0, 2.0])\ny = np.array([0, 1, 0, 1])\nX = np.column_stack([np.ones(4), x])\ndef sigma(t):\n    return 1 / (1 + np.exp(-t))\nb = np.zeros(2)\nfor etape in range(5):\n    pi = sigma(X.dot(b))\n    g = X.T.dot(pi - y) / 4\n    H = X.T.dot(X * (pi * (1 - pi))[:, None]) / 4\n    perte = np.mean(np.logaddexp(0, X.dot(b)) - y * X.dot(b))\n    print(f\"itération {etape} : b = {b}, log-loss = {perte:.6f}, gradient = {g}\")\n    b = b - np.linalg.solve(H, g)\nm = LogisticRegression(penalty=\"none\", tol=1e-10, max_iter=1000).fit(x.reshape(-1, 1), y)\nprint(\"scikit-learn sans pénalité : constante\", m.intercept_, \"pente\", m.coef_[0])\nprint(\"somme des probabilités ajustées :\", round(sigma(X.dot(b)).sum(), 10), \"; somme des y :\", y.sum())\n```\n\n```sortie\nitération 0 : b = [0. 0.], log-loss = 0.693147, gradient = [ 0.   -0.25]\nitération 1 : b = [-0.4  0.8], log-loss = 0.588149, gradient = [ 0.     -0.0239]\nitération 2 : b = [-0.452  0.904], log-loss = 0.586874, gradient = [-0.     -0.0009]\nitération 3 : b = [-0.4541  0.9082], log-loss = 0.586872, gradient = [ 0. -0.]\nitération 4 : b = [-0.4541  0.9082], log-loss = 0.586872, gradient = [-0. -0.]\nscikit-learn sans pénalité : constante [-0.4541] pente [0.9082]\nsomme des probabilités ajustées : 2.0 ; somme des y : 2\n```\n\nRapport de cotes, coefficient \\(\\beta_j = 0{,}7\\), soit un facteur \\(e^{0{,}7} \\approx 2{,}014\\) sur la cote. Depuis \\(\\pi = 0{,}5\\) (cote 1), la cote passe à \\(2{,}014\\) et la probabilité à \\(0{,}668\\), soit \\(+0{,}168\\). Depuis \\(\\pi = 0{,}9\\) (cote \\(9\\)), la cote passe à \\(18{,}12\\) et la probabilité à \\(0{,}948\\), soit \\(+0{,}048\\) seulement : même coefficient, effets différents sur la probabilité.\n\n### Cas limites\n\n- **Séparation** : \\(x = (-2, -1, 1, 2)\\), \\(\\mathbf{y} = (0, 0, 1, 1)\\), \\(\\mathbf{b}^\\star = (0, 1)\\). Le long de \\(c\\,\\mathbf{b}^\\star\\), la log-loss vaut \\(0{,}2201\\) pour \\(c = 1\\), \\(0{,}0034\\) pour \\(c = 5\\), \\(0{,}0000227\\) pour \\(c = 10\\) : elle tend vers 0, et la pente estimée part à l'infini. Quasi-séparation (inégalités larges, avec au moins une égalité) : le minimiseur peut aussi ne pas exister (non démontré ici).\n- **Toutes les étiquettes égales** : c'est une séparation, par la direction de la constante (\\(\\mathbf{b}^\\star = (1, 0, \\dots, 0)\\) si toutes valent 1) ; pas de minimiseur.\n- **Pénalité L2**, qui est le défaut de scikit-learn (vérifié ci-dessous sous scikit-learn 1.1.1 : `penalty=\"l2\"`, `C=1.0`). Notons \\(\\tilde{\\mathbf{x}}_i\\) les variables de l'observation \\(i\\) sans la constante, \\(\\mathbf{w}\\) leurs coefficients et \\(w_0\\) la constante, de sorte que \\(t_i = w_0 + \\tilde{\\mathbf{x}}_i^\\top \\mathbf{w}\\). `LogisticRegression` minimise \\(\\tfrac12 \\lVert \\mathbf{w} \\rVert^2 + C \\sum_i \\big[\\ln(1 + e^{t_i}) - y_i t_i\\big]\\) : la constante n'est pas pénalisée avec le solveur par défaut `lbfgs` (les conditions du premier ordre sont contrôlées ci-dessous). Si les deux classes sont présentes, ce critère a un unique minimiseur, même en cas de séparation. Stricte convexité : dans une direction \\((\\mathbf{v}, v_0)\\), la dérivée seconde vaut \\(\\lVert \\mathbf{v} \\rVert^2 + C \\sum_i \\pi_i(1 - \\pi_i)(v_0 + \\tilde{\\mathbf{x}}_i^\\top \\mathbf{v})^2\\), strictement positive si \\(\\mathbf{v} \\ne \\mathbf{0}\\), et égale à \\(C\\,v_0^2 \\sum_i \\pi_i(1 - \\pi_i) > 0\\) si \\(\\mathbf{v} = \\mathbf{0}\\) et \\(v_0 \\ne 0\\). Existence : le critère tend vers l'infini quand \\((\\mathbf{w}, w_0)\\) s'éloigne (la pénalité contrôle \\(\\mathbf{w}\\) ; à \\(\\mathbf{w}\\) borné, une constante très grande rend infinie la perte des étiquettes 0, une constante très négative celle des étiquettes 1), et une fonction continue qui tend vers l'infini atteint son minimum (admis, comme dans la leçon de ML 1). Les coefficients grandissent avec \\(C\\).\n\n```python\nprint({k: v for k, v in LogisticRegression().get_params().items() if k in (\"penalty\", \"C\", \"solver\")})\nxs = np.array([[-2.0], [-1.0], [1.0], [2.0]])\nys = np.array([0, 0, 1, 1])\nfor C in [1.0, 1e2, 1e4, 1e6]:\n    m = LogisticRegression(C=C, tol=1e-12, max_iter=100000).fit(xs, ys)\n    p = m.predict_proba(xs)[:, 1]\n    cond_w = m.coef_[0, 0] + C * np.sum((p - ys) * xs[:, 0])     # dérivée du critère en w\n    cond_c = C * np.sum(p - ys)                                 # dérivée en la constante\n    print(f\"C = {C:9.0f} : pente = {m.coef_[0, 0]:8.4f} ; conditions du premier ordre : {cond_w: .1e}, {cond_c: .1e}\")\n```\n\n```sortie\n{'C': 1.0, 'penalty': 'l2', 'solver': 'lbfgs'}\nC =         1 : pente =   1.0066 ; conditions du premier ordre : -4.4e-09,  0.0e+00\nC =       100 : pente =   3.9453 ; conditions du premier ordre : -7.3e-09,  8.7e-15\nC =     10000 : pente =   7.8441 ; conditions du premier ordre : -1.5e-05,  1.2e-12\nC =   1000000 : pente =  12.0214 ; conditions du premier ordre : -7.4e-03, -8.4e-12\n```\n\n### Pièges\n\n1. \\(e^{\\beta_j}\\) multiplie la **cote**, pas la probabilité.\n2. Comparer des coefficients n'a de sens qu'à échelles de variables comparables ; avec pénalité, l'échelle change aussi la solution (partie 3).\n3. Des coefficients énormes, ou un avertissement de non-convergence sans pénalité, signalent une séparation : le maximum de vraisemblance n'existe pas, ce n'est pas un modèle « très sûr ».\n4. L'énoncé 4 donne une calibration **en moyenne** sur l'apprentissage, pas une calibration par niveau de probabilité (partie 2), ni hors échantillon.\n\n[[controle:convexite]]\n\n## Partie 2 : les métriques de classification\n\n### Matrice de confusion\n\nUn classifieur produit un score réel \\(s_i\\) par observation (par exemple \\(\\pi_i\\)) ; avec un seuil \\(u\\), il prédit 1 si \\(s_i > u\\). On compte VP (vrais positifs : prédit 1, étiquette 1), FP (prédit 1, étiquette 0), FN (prédit 0, étiquette 1), VN (prédit 0, étiquette 0). Définitions :\n\n- **précision** \\(= \\mathrm{VP}/(\\mathrm{VP} + \\mathrm{FP})\\) : part de vrais positifs parmi les prédictions positives ;\n- **rappel**, ou taux de vrais positifs, \\(\\mathrm{TVP} = \\mathrm{VP}/(\\mathrm{VP} + \\mathrm{FN})\\) : part des positifs détectés ;\n- taux de faux positifs \\(\\mathrm{TFP} = \\mathrm{FP}/(\\mathrm{FP} + \\mathrm{VN})\\) : part des négatifs pris pour des positifs ;\n- **exactitude** (accuracy) \\(= (\\mathrm{VP} + \\mathrm{VN})/n\\) ;\n- **F1**, moyenne harmonique de la précision \\(P\\) et du rappel \\(R\\) : \\(2PR/(P + R) = 2\\mathrm{VP}/(2\\mathrm{VP} + \\mathrm{FP} + \\mathrm{FN})\\). Preuve : en remplaçant \\(P\\) et \\(R\\) par leurs définitions, \\(2PR = 2\\mathrm{VP}^2/\\big((\\mathrm{VP} + \\mathrm{FP})(\\mathrm{VP} + \\mathrm{FN})\\big)\\) et \\(P + R = \\mathrm{VP}(2\\mathrm{VP} + \\mathrm{FP} + \\mathrm{FN})/\\big((\\mathrm{VP} + \\mathrm{FP})(\\mathrm{VP} + \\mathrm{FN})\\big)\\) ; on divise.\n\nExemple : \\(n = 1000\\), dont \\(100\\) positifs ; VP = 60, FN = 40, FP = 90, VN = 810. Précision \\(0{,}40\\), rappel \\(0{,}60\\), F1 \\(0{,}48\\), TFP \\(0{,}10\\), exactitude \\(0{,}87\\). Le classifieur constant « toujours 0 » a une exactitude de \\(0{,}90\\), **meilleure**, avec un rappel nul : sous déséquilibre, l'exactitude récompense l'ignorance de la classe rare. Elle vaut \\(1 - q\\) pour le classifieur constant, où \\(q\\) est la proportion de positifs (la prévalence).\n\n### Pourquoi la précision dépend de la prévalence, et pas la courbe ROC\n\nAu niveau de la population : \\(q = \\mathbb{P}(Y = 1)\\), \\(\\mathrm{TVP} = \\mathbb{P}(\\text{prédit } 1 \\mid Y = 1)\\), \\(\\mathrm{TFP} = \\mathbb{P}(\\text{prédit } 1 \\mid Y = 0)\\). Par la formule de Bayes :\n\n\\(\\displaystyle \\text{précision} = \\mathbb{P}(Y = 1 \\mid \\text{prédit } 1) = \\frac{q\\,\\mathrm{TVP}}{q\\,\\mathrm{TVP} + (1 - q)\\,\\mathrm{TFP}}.\\)\n\nTVP et TFP sont conditionnels à la classe : ils ne dépendent pas de \\(q\\), et la courbe ROC non plus. La précision en dépend. Exemple, TVP = 0,9 et TFP = 0,05 : pour \\(q = 0{,}01\\), précision \\(= 0{,}009/(0{,}009 + 0{,}0495) = \\tfrac{2}{13} \\approx 0{,}154\\) : \\(5{,}5\\) fausses alertes par vraie ; pour \\(q = 0{,}5\\), \\(\\tfrac{18}{19} \\approx 0{,}947\\). Même point ROC, conséquences opposées. La **courbe précision-rappel** (précision en fonction du rappel quand le seuil varie) montre ce que la ROC cache quand les positifs sont rares : le nombre de faux positifs par vrai positif. Sa référence au hasard est la droite horizontale de hauteur \\(q\\), celle de la ROC la diagonale.\n\n### Courbe ROC et AUC\n\nQuand le seuil \\(u\\) descend de \\(+\\infty\\) à \\(-\\infty\\), le point \\((\\mathrm{TFP}(u), \\mathrm{TVP}(u))\\) va de \\((0, 0)\\) à \\((1, 1)\\) ; en joignant les points successifs par des segments, on obtient la **courbe ROC**, et l'**AUC** est l'aire sous cette courbe.\n\n**Énoncé.** On a \\(n_+\\) positifs de scores \\(s_1^+, \\dots, s_{n_+}^+\\) et \\(n_-\\) négatifs de scores \\(s_1^-, \\dots, s_{n_-}^-\\), tous distincts. Alors \\(\\displaystyle \\mathrm{AUC} = \\frac{1}{n_+ n_-} \\#\\{(i, k) : s_i^+ > s_k^-\\} = \\mathbb{P}(S^+ > S^-)\\), où \\(S^+\\) est tiré uniformément parmi les scores positifs et \\(S^-\\), indépendamment, parmi les scores négatifs.\n\n**Preuve.**\n\n1. Les scores étant distincts, chaque fois que \\(u\\) franchit un score, une seule observation passe en « prédit 1 ». Si c'est un positif, TVP augmente de \\(1/n_+\\) : pas vertical. Si c'est un négatif, TFP augmente de \\(1/n_-\\) : pas horizontal. La courbe est un escalier.\n2. L'aire est la somme, sur les pas horizontaux, de la largeur \\(1/n_-\\) multipliée par la hauteur de la courbe à ce moment (les pas verticaux n'ont pas de largeur).\n3. Le pas horizontal du négatif \\(k\\) a lieu quand \\(u\\) franchit \\(s_k^-\\) ; la hauteur vaut alors la part des positifs déjà prédits 1, c'est-à-dire de score supérieur à \\(s_k^-\\) : \\(\\#\\{i : s_i^+ > s_k^-\\}/n_+\\).\n4. En sommant sur \\(k\\) : \\(\\mathrm{AUC} = \\sum_k \\tfrac{1}{n_-} \\cdot \\tfrac{\\#\\{i : s_i^+ > s_k^-\\}}{n_+}\\), la proportion de paires bien ordonnées.\n\n**Ex aequo** entre un positif et un négatif : ils passent ensemble, le pas est un segment diagonal, dont l'aire est la moitié du rectangle : chaque paire ex aequo compte \\(\\tfrac12\\). C'est la convention de `roc_auc_score`, et le script de vérification contrôle l'égalité entre aire et décompte sur 500 cas tirés au hasard.\n\n**Conséquences.** L'AUC ne dépend que de l'**ordre** des scores : elle est invariante par toute transformation strictement croissante, donc aveugle à la calibration. Un score qui ne dépend pas de l'étiquette, à loi continue, donne \\(\\tfrac12\\) en espérance (par symétrie, \\(\\mathbb{P}(S^+ > S^-) = \\mathbb{P}(S^- > S^+)\\)). Le score opposé donne \\(1 - \\mathrm{AUC}\\).\n\nExemple : positifs \\((0{,}9 ; 0{,}5 ; 0{,}3)\\), négatifs \\((0{,}8 ; 0{,}6 ; 0{,}4 ; 0{,}2)\\). Chaque positif bat respectivement \\((4 ; 2 ; 1)\\) négatifs, soit \\(7\\) paires sur \\(12\\) : \\(\\mathrm{AUC} = \\tfrac{7}{12} \\approx 0{,}583\\).\n\n```python\npos = np.array([0.9, 0.5, 0.3]); neg = np.array([0.8, 0.6, 0.4, 0.2])\ns = np.concatenate([pos, neg]); etiquettes = np.r_[np.ones(3), np.zeros(4)]\nprint(\"proportion de paires bien ordonnées :\", np.mean(pos[:, None] > neg[None, :]))\nprint(\"roc_auc_score                       :\", roc_auc_score(etiquettes, s))\nprint(\"après la transformation s -> s**3   :\", roc_auc_score(etiquettes, s**3))\n```\n\n```sortie\nproportion de paires bien ordonnées : 0.5833333333333334\nroc_auc_score                       : 0.5833333333333333\naprès la transformation s -> s**3   : 0.5833333333333333\n```\n\n### Log-loss, score de Brier, calibration\n\nPour des probabilités prédites \\(r_i \\in [0, 1]\\) : log-loss \\(-\\tfrac1n \\sum_i [y_i \\ln r_i + (1 - y_i)\\ln(1 - r_i)]\\) (partie 1), score de Brier \\(\\tfrac1n \\sum_i (r_i - y_i)^2\\).\n\n**Énoncé : ce sont des règles de score propres.** Si \\(Y\\) suit la loi de Bernoulli de paramètre \\(q \\in ]0, 1[\\), l'espérance du score d'une prévision \\(r\\) est minimale en \\(r = q\\), et seulement là.\n\n**Preuve.** Brier : \\(\\mathbb{E}[(r - Y)^2] = q(r - 1)^2 + (1 - q)r^2 = (r - q)^2 + q(1 - q)\\), en développant : minimum unique en \\(r = q\\), et l'excès vaut exactement \\((r - q)^2\\). Log : \\(f(r) = -q \\ln r - (1 - q)\\ln(1 - r)\\) a pour dérivée \\(-q/r + (1 - q)/(1 - r)\\), nulle seulement en \\(r = q\\), et pour dérivée seconde \\(q/r^2 + (1 - q)/(1 - r)^2 > 0\\) : minimum unique. Conséquence : un prévisionniste qui minimise l'un de ces scores en espérance a intérêt à annoncer sa vraie probabilité.\n\nExemple, \\(q = 0{,}3\\) : Brier espéré \\(0{,}21\\) pour \\(r = q\\) et \\(0{,}25\\) pour \\(r = 0{,}5\\), écart \\((0{,}5 - 0{,}3)^2 = 0{,}04\\) ; log-loss espérée \\(0{,}6109\\) contre \\(\\ln 2 \\approx 0{,}6931\\). Différence de comportement : le score de Brier reste entre 0 et 1 ; la log-loss d'une prévision \\(r = 0\\) suivie de \\(y = 1\\) est infinie, et punit très fortement les erreurs confiantes.\n\n**Calibration.** Un modèle est calibré si, pour tout niveau \\(r\\), parmi les observations auxquelles il attribue la probabilité \\(r\\), la proportion de positifs est \\(r\\) : \\(\\mathbb{P}(Y = 1 \\mid \\text{prévision} = r) = r\\). Le **diagramme de fiabilité** se construit en regroupant les prévisions par tranches, puis en traçant la fréquence observée de positifs contre la prévision moyenne de chaque tranche ; calibré signifie sur la diagonale. L'expérience suivante compare des probabilités vraies \\(\\pi\\) et leur carré \\(\\pi^2\\) : même ordre, donc même AUC, mais \\(\\pi^2\\) sous-estime les probabilités, ce que voient le Brier, la log-loss et le diagramme.\n\n```python\nrng = np.random.default_rng(0)\npi = rng.uniform(0, 1, 100000)                       # probabilités vraies\nY = (rng.uniform(size=100000) < pi).astype(int)\ntranches = np.linspace(0, 1, 6)\nfor nom, r in [(\"pi\", pi), (\"pi^2\", pi**2)]:\n    print(f\"{nom:4s} : AUC {roc_auc_score(Y, r):.4f}  Brier {brier_score_loss(Y, r):.4f}  log-loss {log_loss(Y, r):.4f}\")\n    k = np.digitize(r, tranches[1:-1])\n    print(\"       (prévision moyenne, fréquence observée) par tranche :\", [(round(r[k == j].mean(), 2), round(Y[k == j].mean(), 2)) for j in range(5)])\n```\n\n```sortie\npi   : AUC 0.8342  Brier 0.1662  log-loss 0.4987\n       (prévision moyenne, fréquence observée) par tranche : [(0.1, 0.1), (0.3, 0.3), (0.5, 0.5), (0.7, 0.7), (0.9, 0.9)]\npi^2 : AUC 0.8342  Brier 0.2004  log-loss 0.6141\n       (prévision moyenne, fréquence observée) par tranche : [(0.07, 0.22), (0.29, 0.55), (0.5, 0.71), (0.7, 0.83), (0.9, 0.95)]\n```\n\n### Choisir la métrique\n\nLe choix découle de ce que la décision utilise :\n\n- la **valeur** de la probabilité (dimensionner une position, comme la mise par croissance logarithmique d'un système de trading, ou publier un risque) : log-loss ou Brier, et diagramme de fiabilité ; une erreur de calibration devient directement une erreur de taille ;\n- seulement l'**ordre** (prendre les 10 % de scores les plus élevés, construire un portefeuille long-court) : AUC, ou corrélation de rang entre signal et rendement (coefficient d'information) ;\n- une décision binaire à **coûts asymétriques** \\(c_{\\mathrm{FP}}\\) et \\(c_{\\mathrm{FN}}\\) avec une probabilité calibrée \\(\\pi\\) : prédire 1 coûte \\((1 - \\pi)c_{\\mathrm{FP}}\\) en espérance, prédire 0 coûte \\(\\pi\\,c_{\\mathrm{FN}}\\), d'où le seuil \\(u^\\star = c_{\\mathrm{FP}}/(c_{\\mathrm{FP}} + c_{\\mathrm{FN}})\\) ; pour \\(c_{\\mathrm{FP}} = 1\\), \\(c_{\\mathrm{FN}} = 4\\), \\(u^\\star = 0{,}2\\), et non 0,5 ;\n- des **positifs rares** dont chaque alerte coûte : courbe précision-rappel, précision à rappel fixé ;\n- l'exactitude seulement avec des classes de tailles comparables, et toujours comparée au classifieur constant.\n\n### Pièges\n\n1. Précision et rappel ne se comparent pas d'un jeu de données à l'autre si la prévalence change ; TVP et TFP, si.\n2. Une AUC élevée ne dit rien de la calibration ; un modèle calibré peut avoir une AUC de \\(\\tfrac12\\) (prévision constante égale à \\(q\\)).\n3. F1 ignore les VN : il ne convient pas quand les deux classes comptent.\n\n[[controle:auc]]\n\n## Partie 3 : plus proches voisins, échelle, dimension\n\n### Les k plus proches voisins\n\nPour un point \\(\\mathbf{x}\\), on cherche les \\(k\\) observations d'apprentissage les plus proches au sens de la distance euclidienne \\(\\lVert \\mathbf{x} - \\mathbf{x}_i \\rVert = \\big(\\sum_j (x_j - x_{ij})^2\\big)^{1/2}\\) (\\(k\\) entier fixé, égalités départagées par une règle arbitraire). En régression on prédit la moyenne de leurs réponses, en classification la classe majoritaire, ou la proportion de 1 comme probabilité. Aucun paramètre n'est ajusté : tout est dans le choix de \\(k\\) et de la distance.\n\n\\(k\\) règle l'arbitrage biais-variance (leçon de la séance de ML 1, partie 6). Si les \\(\\mathbf{x}_i\\) sont fixes et les réponses ont un bruit indépendant de variance \\(\\sigma^2\\), la prédiction en \\(\\mathbf{x}\\) est la moyenne de \\(k\\) réponses de voisins fixés, de variance \\(\\sigma^2/k\\) : la variance baisse avec \\(k\\), mais les voisins s'éloignent, et le biais monte. Cas extrêmes : \\(k = 1\\) donne une erreur d'apprentissage nulle si les \\(\\mathbf{x}_i\\) sont distincts (chaque point est son propre voisin) ; \\(k = n\\) prédit partout la même moyenne.\n\n### Pourquoi l'échelle compte pour les distances, pas pour les arbres\n\n**Distances.** La variable \\(j\\) contribue \\((x_j - x_{ij})^2\\) au carré de la distance, dans **son** unité : la multiplier par \\(c\\) multiplie sa contribution par \\(c^2\\). Exemple : point \\(Q\\) = (30 ans, 50 000 euros), \\(A\\) = (60 ans, 50 500 euros), \\(B\\) = (31 ans, 52 000 euros). Brut : \\(\\lVert Q - A \\rVert^2 = 900 + 250000\\), \\(\\lVert Q - A \\rVert \\approx 500{,}9\\) ; \\(\\lVert Q - B \\rVert \\approx 2000{,}0\\) : le plus proche est \\(A\\), qui a trente ans de plus, parce que l'euro écrase l'année. Après division par les écarts-types d'apprentissage (supposés de 10 ans et 10 000 euros) : \\(\\lVert Q - A \\rVert \\approx 3{,}000\\) et \\(\\lVert Q - B \\rVert \\approx 0{,}224\\) : le plus proche devient \\(B\\). On standardise donc avant un algorithme à distances (plus proches voisins, k-moyennes, noyaux), avec les moyennes et écarts-types de l'**apprentissage seul** (partie 4).\n\n**Arbres.** Une coupure « \\(x_j \\le u\\) » sépare les observations d'apprentissage selon l'**ordre** des valeurs de \\(x_j\\). Une transformation \\(g\\) strictement croissante de la variable \\(j\\) conserve cet ordre : mêmes partitions possibles, mêmes gains, même arbre, le seuil \\(u\\) devenant \\(g(u)\\) (leçon de la séance de ML 2, `outils/lecons_arbres.py`, partie 1). Précision sur les points nouveaux : scikit-learn place le seuil au milieu de deux valeurs consécutives ; pour \\(g\\) affine de pente positive (une standardisation), le milieu est transporté exactement, et les prédictions sont identiques partout ; pour \\(g\\) non affine, elles sont identiques sur l'apprentissage, et peuvent différer pour un point nouveau tombé entre deux valeurs consécutives.\n\n**Régression logistique.** Sans pénalité, remplacer \\(x_j\\) par \\(c\\,x_j\\) (\\(c \\ne 0\\)) et \\(b_j\\) par \\(b_j/c\\) laisse chaque \\(t_i\\) inchangé : mêmes prédictions. Avec la pénalité L2, \\(b_j^2\\) devient \\(b_j^2/c^2\\) : la pénalité effective change, et les prédictions aussi.\n\n```python\nrng = np.random.default_rng(1)\nn = 2000\nX = rng.standard_normal((n, 2))\ny = (X[:, 0] + 0.5 * rng.standard_normal(n) > 0).astype(int)   # seule la variable 0 est utile\nX[:, 1] *= 1000                                                # variable inutile, en grandes unités\napp, tst = slice(0, 1000), slice(1000, None)\nmoy, et = X[app].mean(axis=0), X[app].std(axis=0)              # statistiques de l'apprentissage seul\nZ = (X - moy) / et\nfor nom, D in [(\"brut\", X), (\"standardisé\", Z)]:\n    knn = voisins(D[app], y[app], D[tst], 15) > 0.5               # vote majoritaire des 15 voisins\n    arbre = DecisionTreeClassifier(max_depth=4, random_state=0).fit(D[app], y[app])\n    print(f\"{nom:12s} : exactitude test kNN {np.mean(knn == y[tst]):.3f} ; arbre {arbre.score(D[tst], y[tst]):.3f}\")\na1 = DecisionTreeClassifier(max_depth=4, random_state=0).fit(X[app], y[app]).predict(X[tst])\na2 = DecisionTreeClassifier(max_depth=4, random_state=0).fit(Z[app], y[app]).predict(Z[tst])\nprint(\"prédictions de l'arbre identiques sur le test :\", bool(np.all(a1 == a2)))\nseule = voisins(Z[app][:, :1], y[app], Z[tst][:, :1], 15) > 0.5            # kNN sur la seule variable utile\nprint(f\"kNN sur la seule variable utile : exactitude test {np.mean(seule == y[tst]):.3f}\")\nZ20 = np.column_stack([Z[:, :1], rng.standard_normal((n, 20))])             # plus 20 variables de bruit, déjà réduites\navec20 = voisins(Z20[app], y[app], Z20[tst], 15) > 0.5\nprint(f\"kNN avec 20 variables de bruit standardisées : exactitude test {np.mean(avec20 == y[tst]):.3f}\")\n```\n\n```sortie\nbrut         : exactitude test kNN 0.479 ; arbre 0.858\nstandardisé  : exactitude test kNN 0.850 ; arbre 0.858\nprédictions de l'arbre identiques sur le test : True\nkNN sur la seule variable utile : exactitude test 0.848\nkNN avec 20 variables de bruit standardisées : exactitude test 0.778\n```\n\n### La malédiction de la dimension : concentration des distances\n\n**Énoncé.** Soient \\(\\mathbf{X}\\) et \\(\\mathbf{X}'\\) deux vecteurs aléatoires de \\(\\mathbb{R}^p\\) (exception d'usage : en gras majuscule, aléatoires), dont les \\(2p\\) coordonnées sont indépendantes et de même loi, avec un moment d'ordre 4 fini et une variance non nulle. On note \\(D^2 = \\lVert \\mathbf{X} - \\mathbf{X}' \\rVert^2\\), \\(m = \\mathbb{E}[(X_1 - X_1')^2]\\) et \\(v = \\mathrm{Var}\\big((X_1 - X_1')^2\\big)\\). Alors \\(\\mathbb{E}[D^2] = p\\,m\\), \\(\\mathrm{Var}(D^2) = p\\,v\\), et pour tout \\(\\varepsilon > 0\\) :\n\n\\(\\displaystyle \\mathbb{P}\\Big(\\Big\\lvert \\frac{D^2}{\\mathbb{E}[D^2]} - 1 \\Big\\rvert \\ge \\varepsilon\\Big) \\le \\frac{v}{p\\,m^2\\,\\varepsilon^2},\\)\n\nborne qui tend vers 0 quand \\(p \\to \\infty\\), \\(\\varepsilon\\) étant fixé.\n\nLe rapport écart-type sur espérance de \\(D^2\\) vaut \\(\\sqrt{v}/(m\\sqrt{p})\\) : toutes les distances entre points deviennent relativement égales.\n\n**Preuve.**\n\n1. \\(D^2 = \\sum_{j=1}^p (X_j - X_j')^2\\) est une somme de \\(p\\) variables indépendantes de même loi (chacune ne dépend que de la paire \\((X_j, X_j')\\), et les paires sont indépendantes) : linéarité de l'espérance, et variance d'une somme de variables indépendantes égale à la somme des variances.\n2. **Inégalité de Markov** : pour \\(V \\ge 0\\) et \\(a > 0\\), \\(V \\ge a\\,I_{\\{V \\ge a\\}}\\), où \\(I_A\\) est l'indicatrice de l'événement \\(A\\), d'où \\(\\mathbb{E}[V] \\ge a\\,\\mathbb{P}(V \\ge a)\\).\n3. **Tchebychev** : Markov appliquée à \\(V = (D^2 - \\mathbb{E}D^2)^2\\) et \\(a = \\varepsilon^2 (\\mathbb{E}D^2)^2\\) donne \\(\\mathbb{P}(\\lvert D^2 - \\mathbb{E}D^2 \\rvert \\ge \\varepsilon\\,\\mathbb{E}D^2) \\le p\\,v/(\\varepsilon^2 p^2 m^2)\\).\n\nCas uniforme sur \\([0, 1]\\) : \\(m = \\tfrac16\\), \\(\\mathbb{E}[(X_1 - X_1')^4] = \\tfrac{1}{15}\\), donc \\(v = \\tfrac{7}{180}\\) (intégrales calculées par sympy), et le rapport vaut \\(\\sqrt{v}/(m\\sqrt{p}) \\approx 1{,}183/\\sqrt{p}\\) : \\(0{,}837\\) pour \\(p = 2\\), \\(0{,}374\\) pour \\(p = 10\\), \\(0{,}118\\) pour \\(p = 100\\), \\(0{,}037\\) pour \\(p = 1000\\). Pour \\(p = 1000\\) et \\(\\varepsilon = 0{,}1\\), la borne de Tchebychev vaut \\(0{,}14\\). Simulation pour \\(p = 100\\) : espérance \\(16{,}664\\) et variance \\(3{,}881\\), pour des valeurs exactes \\(100\\,m \\approx 16{,}667\\) et \\(100\\,v \\approx 3{,}889\\) (script, écarts sous 4 erreurs standard).\n\nL'expérience suivante mesure, pour un point requête et 500 points uniformes, l'écart relatif entre la plus grande et la plus petite distance (constat sur un tirage, pas une preuve) :\n\n```python\nrng = np.random.default_rng(2)\nfor p in [2, 10, 100, 1000]:\n    points, requete = rng.uniform(size=(500, p)), rng.uniform(size=p)\n    d = np.sqrt(((points - requete) ** 2).sum(axis=1))\n    print(f\"p = {p:4d} : distance min {d.min():7.3f}, max {d.max():7.3f}, (max - min)/min = {(d.max() - d.min()) / d.min():7.3f}\")\n```\n\n```sortie\np =    2 : distance min   0.025, max   0.960, (max - min)/min =  37.284\np =   10 : distance min   0.543, max   2.220, (max - min)/min =   3.087\np =  100 : distance min   3.513, max   5.126, (max - min)/min =   0.459\np = 1000 : distance min  12.317, max  13.641, (max - min)/min =   0.108\n```\n\n**Conditions, et ce qui casse le résultat.** L'énoncé exige des coordonnées indépendantes qui apportent chacune une part comparable de variance. Contre-exemple : les \\(p\\) coordonnées égales à une même variable uniforme \\(U\\) ; alors \\(D^2 = p\\,(U - U')^2\\), dont le rapport écart-type sur espérance vaut \\(\\sqrt{v}/m \\approx 1{,}183\\) pour tout \\(p\\) : aucune concentration. Des données réelles dont la variance est portée par quelques facteurs (les rendements de nombreuses actions, par exemple) ont une dimension effective plus petite que \\(p\\) : on s'attend à une concentration plus faible que dans le cas indépendant (non démontré ici ; le contre-exemple en est le cas extrême).\n\n**Conséquence pour les plus proches voisins** : quand les distances se concentrent, le « plus proche » voisin n'est guère plus proche que les autres, et la prédiction moyenne les réponses d'observations qui ne ressemblent guère plus au point que les autres. Autre face du même phénomène : pour capturer 1 % d'un nuage uniforme dans un sous-cube, il faut un côté de \\(0{,}01^{1/p}\\), soit \\(0{,}63\\) pour \\(p = 10\\) et \\(0{,}955\\) pour \\(p = 100\\) : un voisinage qui contient assez de points n'est plus local.\n\n### Pièges\n\n1. Standardiser avec des statistiques calculées sur tout l'échantillon est une fuite (partie 4).\n2. Une variable inutile en grandes unités ruine les plus proches voisins (expérience ci-dessus). Une fois standardisée, une seule variable de bruit ne coûte rien de mesurable dans cette expérience ; vingt variables de bruit standardisées, qui ajoutent chacune à la distance un terme de même ordre que la variable utile, dégradent nettement l'exactitude. Standardiser ne dispense pas de sélectionner les variables.\n3. « La malédiction de la dimension rend les distances inutiles » n'est vrai que sous l'hypothèse d'une dimension effective grande.\n\n[[controle:echelle]]\n\n## Partie 4 : validation et fuites d'information\n\n### Trois ensembles, trois rôles\n\nL'**apprentissage** ajuste les paramètres ; la **validation** choisit les hyperparamètres et le modèle ; le **test** mesure une fois, à la fin, la performance du modèle choisi. Pourquoi ne pas annoncer l'erreur de validation du modèle retenu : si \\(\\hat{E}_1, \\dots, \\hat{E}_M\\) sont les erreurs de validation (aléatoires) de \\(M\\) modèles, \\(\\min_m \\hat{E}_m \\le \\hat{E}_{m'}\\) pour chaque \\(m'\\), donc \\(\\mathbb{E}[\\min_m \\hat{E}_m] \\le \\min_{m'} \\mathbb{E}[\\hat{E}_{m'}]\\) : le minimum est biaisé vers l'optimisme, d'autant plus que \\(M\\) est grand et les estimations bruitées. C'est un biais de sélection ; ton CV mentionne un biais de sélection révélé par l'audit de ton système de trading : demande-toi s'il relevait de ce mécanisme (garder le meilleur de plusieurs essais) et sache l'expliquer.\n\n### La fuite d'information\n\n**Définition** : une fuite a lieu quand une étape quelconque de l'ajustement (prétraitement, sélection de variables, choix d'hyperparamètres, ajustement) utilise des données d'évaluation. L'évaluation n'est alors plus indépendante de l'ajustement, et son estimation est biaisée, vers l'optimisme dans les exemples ci-dessous.\n\n**Exemple 1 : standardiser avant de découper.** La moyenne utilisée pour centrer contient les lignes de test. Pour des données i.i.d. de variance 1, l'écart entre moyenne globale et moyenne d'apprentissage vaut \\((n_{\\mathrm{test}}/n)(\\bar{x}_{\\mathrm{test}} - \\bar{x}_{\\mathrm{app}})\\), d'écart-type \\((n_{\\mathrm{test}}/n)\\sqrt{1/n_{\\mathrm{test}} + 1/n_{\\mathrm{app}}}\\), soit \\(0{,}0158\\) pour \\(n = 1000\\) et \\(n_{\\mathrm{test}} = 200\\) (contrôlé par simulation dans le script) : petit. En série temporelle avec tendance ou changement de régime, la moyenne globale contient le futur, et cette formule ne borne plus rien : c'est un lookahead (usage d'une information future).\n\n**Exemple 2 : sélectionner les variables sur tout l'échantillon.** 50 observations (25 de chaque classe), 5000 variables de bruit pur, étiquettes indépendantes des variables : sur une observation nouvelle d'étiquette équiprobable, indépendante de l'apprentissage, tout classifieur a une exactitude de 50 % exactement, puisque sa prédiction est indépendante de l'étiquette. On sélectionne les 100 variables les plus liées à l'étiquette, puis on évalue un plus proche voisin par validation croisée à 5 plis, soit avec la sélection faite une fois sur tout l'échantillon, soit refaite à l'intérieur de chaque pli, sur l'apprentissage du pli seul (avec scikit-learn, c'est ce que fait un `Pipeline` passé à `cross_val_score`).\n\n```python\ncv = KFold(5, shuffle=True, random_state=0)\ndef exactitude_cv(X, y, selection_globale):\n    masque_global = SelectKBest(f_classif, k=100).fit(X, y).get_support()      # voit les 50 observations\n    bons = 0\n    for app, test in cv.split(X):\n        masque = masque_global if selection_globale else SelectKBest(f_classif, k=100).fit(X[app], y[app]).get_support()\n        pred = voisins(X[app][:, masque], y[app], X[test][:, masque], 1) > 0.5\n        bons += np.sum(pred == y[test])\n    return bons / len(y)\nresultats = []\nfor graine in range(10):\n    rng = np.random.default_rng(100 + graine)\n    X = rng.standard_normal((50, 5000))\n    y = rng.permutation(np.r_[np.zeros(25, int), np.ones(25, int)])\n    resultats.append((exactitude_cv(X, y, True), exactitude_cv(X, y, False)))\nresultats = np.array(resultats)\nprint(\"exactitude moyenne sur 10 jeux, sélection sur tout l'échantillon / dans chaque pli :\", np.round(resultats.mean(axis=0), 3))\nprint(\"erreur standard de ces moyennes                                                  :\", np.round(resultats.std(axis=0, ddof=1) / np.sqrt(10), 3))\n```\n\n```sortie\nexactitude moyenne sur 10 jeux, sélection sur tout l'échantillon / dans chaque pli : [0.988 0.436]\nerreur standard de ces moyennes                                                  : [0.005 0.019]\n```\n\nMécanisme : les variables retenues sont, par construction, corrélées à l'étiquette **dans tout l'échantillon**, plis de validation compris ; la validation croisée mesure alors cette corrélation d'échantillon, pas une capacité de prédiction. La seconde valeur est même sous 50 % de plusieurs erreurs standard : avec des effectifs de classes fixés (25 et 25), un pli de validation riche en 1 laisse un apprentissage pauvre en 1, et inversement, ce qui défavorise un classifieur qui reproduit les proportions de son apprentissage. Ce biais pessimiste de la validation croisée sous l'hypothèse nulle est constaté ici, pas démontré dans cette leçon ; l'écart qui compte est celui entre les deux valeurs. Règle : toute étape qui regarde \\(\\mathbf{y}\\), ou la loi des variables (standardisation, imputation, ACP), fait partie du modèle et s'ajuste dans chaque pli, sur l'apprentissage du pli seul.\n\n### Validation croisée\n\nOn partage les observations en \\(K\\) plis ; pour chaque pli, on ajuste sur les \\(K - 1\\) autres et on évalue sur lui ; on moyenne les \\(K\\) scores. Cela estime la performance de la **procédure** ajustée sur une fraction \\((K - 1)/K\\) des données, et suppose des observations indépendantes et interchangeables. Pour choisir un hyperparamètre **et** annoncer une performance, il faut un test séparé, ou une validation croisée imbriquée (le choix refait dans chaque pli extérieur).\n\n### Séries temporelles : l'exemple des étiquettes à 5 jours\n\nDonnées quotidiennes. \\(R_t\\) est le rendement du jour \\(t\\) (aléatoire). L'étiquette de la date \\(t\\) est le rendement des 5 jours suivants, \\(Y_t = R_{t+1} + \\dots + R_{t+5}\\) (horizon \\(h = 5\\)). Les variables de la date \\(t\\) utilisent les rendements \\(R_{t-L+1}, \\dots, R_t\\) (fenêtre \\(L = 20\\)) : elles sont connues en \\(t\\), l'étiquette l'est en \\(t + 5\\).\n\n**Étiquettes qui se chevauchent.** Si les \\(R_t\\) sont non corrélés, de même variance \\(w > 0\\), alors pour \\(0 \\le k \\le 5\\) : \\(\\mathrm{Corr}(Y_t, Y_{t+k}) = (5 - k)/5\\), et 0 au-delà. Preuve : les deux sommes partagent \\(5 - k\\) rendements ; la covariance vaut \\((5 - k)\\,w\\) (les termes croisés de rendements distincts sont nuls), chaque variance vaut \\(5w\\). Donc \\(0{,}8\\) pour deux dates voisines, \\(0{,}2\\) à 4 jours d'écart.\n\nUne validation croisée à plis **mélangés** pose deux problèmes : elle apprend sur des dates postérieures au test, ce qui n'existe pas en temps réel ; et la date voisine d'une date de test, présente dans l'apprentissage, a une étiquette corrélée à \\(0{,}8\\) avec l'étiquette de test, et des variables presque identiques : un modèle qui mémorise est récompensé. Première correction : des plis formés de **blocs de dates contiguës** ; le bloc de test est \\(\\{t_0, \\dots, t_1\\}\\).\n\n**Purge** : on retire de l'apprentissage toute date dont l'étiquette partage au moins un rendement avec une étiquette de test. Les étiquettes de test utilisent \\(R_{t_0+1}, \\dots, R_{t_1+5}\\) ; celle de \\(t\\) utilise \\(R_{t+1}, \\dots, R_{t+5}\\) ; elles se rencontrent si et seulement si \\(t + 5 \\ge t_0 + 1\\) et \\(t + 1 \\le t_1 + 5\\), soit \\(t_0 - 4 \\le t \\le t_1 + 4\\). La purge retire donc les \\(h - 1 = 4\\) dates avant le bloc et les 4 dates après. Ce qu'elle retire : le canal **étiquettes partagées**.\n\n**Embargo** : on retire en plus, **après** le bloc, toute date dont les variables utilisent un rendement d'une étiquette de test. La fenêtre de \\(t\\) rencontre \\(\\{t_0 + 1, \\dots, t_1 + 5\\}\\) si et seulement si \\(t - L + 1 \\le t_1 + 5\\), soit \\(t \\le t_1 + L + 4\\) : l'embargo retire les \\(L\\) dates \\(t_1 + 5, \\dots, t_1 + L + 4\\), les précédentes étant déjà purgées. Ce qu'il retire : les variables construites avec la période de test. Avant le bloc, rien de tel : les variables n'utilisent que le passé, ce qui serait connu en temps réel. Purge et embargo de longueur \\(L\\) garantissent ensemble qu'aucun rendement entrant dans une étiquette de test n'entre dans les données d'apprentissage, ni par les étiquettes, ni par les variables. Avec des rendements indépendants, la purge supprime le seul canal démontré ici ; l'embargo est une marge contre une dépendance au-delà de l'horizon (volatilité en grappes, régimes), et sa longueur est un choix.\n\nExemple : 1000 dates numérotées de 0 à 999, 5 blocs de 200, test = dates 400 à 599, \\(h = 5\\), \\(L = 20\\). Purge : dates 396 à 399 et 600 à 603, soit 8 dates ; embargo : dates 604 à 623, soit 20 ; il reste \\(772\\) dates d'apprentissage au lieu de \\(800\\).\n\n**Validation progressive** (walk-forward : apprentissage sur le passé seul, comme ton backtest) : pas d'embargo nécessaire, puisqu'aucune date d'apprentissage n'est postérieure au test. La purge reste indispensable : à la date de décision \\(t_0\\), les étiquettes des dates \\(t_0 - 4, \\dots, t_0 - 1\\) utilisent des rendements postérieurs à \\(t_0\\), inconnus ; les utiliser est un lookahead.\n\nExpérience : rendements quotidiens indépendants, donc **aucune** prévisibilité réelle ; variables : moyennes des rendements sur 120 et 250 jours ; modèle : 5 plus proches voisins ; mesure : coefficient d'information, corrélation de rang (Spearman) entre prédiction et étiquette hors échantillon. Toute valeur nettement positive est une fuite.\n\n```python\nT, h = 2000, 5\ndef donnees(graine):\n    rng = np.random.default_rng(graine)\n    r = rng.standard_normal(T + 250 + h)\n    cumul = np.concatenate([[0.0], np.cumsum(r)])\n    t = np.arange(250, T + 250)\n    f1 = (cumul[t + 1] - cumul[t + 1 - 120]) / 120          # moyenne des 120 derniers rendements, t inclus\n    f2 = (cumul[t + 1] - cumul[t + 1 - 250]) / 250\n    etiq = cumul[t + 1 + h] - cumul[t + 1]                  # somme des rendements t+1 à t+5\n    return np.column_stack([f1 / f1.std(), f2 / f2.std()]), etiq\ndef plis_blocs(purge, embargo, L=250, K=5):\n    idx = np.arange(T)\n    for t0 in range(0, T, T // K):\n        t1 = t0 + T // K - 1\n        garde = (idx < t0) | (idx > t1)\n        if purge:\n            garde &= ~((idx >= t0 - (h - 1)) & (idx <= t1 + h - 1))\n        if embargo:\n            garde &= ~((idx >= t1 + h) & (idx <= t1 + h + L - 1))\n        yield idx[garde], idx[t0:t1 + 1]\ndef ic(F, etiq, plis):\n    pred = np.empty(T)\n    for app, test in plis:\n        pred[test] = voisins(F[app], etiq[app], F[test], 5)\n    return spearmanr(pred, etiq).correlation\nres = []\nfor graine in range(5):\n    F, etiq = donnees(graine)\n    res.append([ic(F, etiq, KFold(5, shuffle=True, random_state=0).split(F)), ic(F, etiq, plis_blocs(False, False)), ic(F, etiq, plis_blocs(True, True))])\nres = np.array(res)\nprint(\"IC moyen sur 5 jeux, plis mélangés / blocs / blocs purgés avec embargo :\", np.round(res.mean(axis=0), 3))\nprint(\"erreur standard de ces moyennes                                       :\", np.round(res.std(axis=0, ddof=1) / np.sqrt(5), 3))\n```\n\n```sortie\nIC moyen sur 5 jeux, plis mélangés / blocs / blocs purgés avec embargo : [ 0.266  0.003 -0.016]\nerreur standard de ces moyennes                                       : [0.02  0.024 0.027]\n```\n\nValidation progressive, réapprentissage tous les 5 jours, avec et sans purge des \\(h - 1\\) dernières dates :\n\n```python\ndef progressive(F, etiq, purge, pas=5, debut=500):\n    preds, vraies = [], []\n    for t0 in range(debut, T, pas):\n        fin = t0 - (h - 1) if purge else t0               # dates d'apprentissage : 0 à fin - 1\n        preds.append(voisins(F[:fin], etiq[:fin], F[t0:t0 + pas], 5)); vraies.append(etiq[t0:t0 + pas])\n    return spearmanr(np.concatenate(preds), np.concatenate(vraies)).correlation\nres = np.array([[progressive(*donnees(g), False), progressive(*donnees(g), True)] for g in range(5)])\nprint(\"IC moyen sur 5 jeux, sans purge / avec purge :\", np.round(res.mean(axis=0), 3))\nprint(\"erreur standard de ces moyennes              :\", np.round(res.std(axis=0, ddof=1) / np.sqrt(5), 3))\n```\n\n```sortie\nIC moyen sur 5 jeux, sans purge / avec purge : [ 0.074 -0.01 ]\nerreur standard de ces moyennes              : [0.01  0.019]\n```\n\nLecture : les plis mélangés font apparaître un signal là où il n'y en a pas ; les blocs en suppriment l'essentiel. Dans ces blocs, les dates de bord sont peu nombreuses (\\(2(h - 1)\\) purgées par bloc), et l'écart entre blocs avec et sans purge est de l'ordre de l'erreur standard : cette expérience ne le distingue pas. En validation progressive avec réapprentissage fréquent, chaque date de test est une date de bord, et l'absence de purge produit un coefficient d'information positif ; la purge le ramène vers 0.\n\n### Pièges\n\n1. Mélanger les plis d'une série temporelle à étiquettes chevauchantes gonfle la performance, même sans aucune variable du futur.\n2. La purge dépend de l'horizon de l'étiquette (\\(h - 1\\) dates de chaque côté), l'embargo de la fenêtre des variables, et seulement après le bloc.\n3. Toute étape qui regarde les données (standardisation, sélection, choix de \\(k\\) ou de \\(\\lambda\\)) s'ajuste dans le pli.\n4. Erreur de validation du meilleur de \\(M\\) modèles : estimation optimiste ; garder un test intact.\n\n[[controle:selection]]\n\n[[controle:purge]]\n\n## Réflexes en 30 secondes\n\n| Indice dans l'énoncé | Réflexe |\n|---|---|\n| gradient de la log-loss | \\(\\tfrac1n \\mathbf{X}^\\top (\\boldsymbol{\\pi} - \\mathbf{y})\\) ; hessienne \\(\\tfrac1n \\mathbf{X}^\\top \\mathbf{W}\\mathbf{X}\\), poids \\(\\pi_i(1 - \\pi_i)\\) |\n| convexité de la logistique | hessienne SDP ; stricte si \\(\\mathbf{X}\\) de rang \\(p\\) ; pas de forme fermée |\n| \\(e^{\\beta_j}\\) | facteur sur la cote, pas sur la probabilité ; \\(\\partial \\pi / \\partial x_j = \\beta_j \\pi(1 - \\pi)\\) |\n| coefficients qui explosent | séparation : pas de maximum de vraisemblance ; pénalité L2 (défaut de scikit-learn) |\n| avec constante, au minimum | somme des \\(\\pi_i\\) = somme des \\(y_i\\) |\n| AUC | proportion de paires (positif, négatif) bien ordonnées, ex aequo \\(\\tfrac12\\) ; invariante par transformation croissante |\n| classes déséquilibrées | exactitude trompeuse ; précision \\(= q\\,\\mathrm{TVP}/(q\\,\\mathrm{TVP} + (1 - q)\\mathrm{TFP})\\) ; courbe précision-rappel |\n| Brier, log-loss | règles propres ; Brier espéré \\(= (r - q)^2 + q(1 - q)\\) |\n| seuil à coûts asymétriques | \\(c_{\\mathrm{FP}}/(c_{\\mathrm{FP}} + c_{\\mathrm{FN}})\\) sur une probabilité calibrée |\n| plus proches voisins | standardiser (statistiques d'apprentissage) ; \\(k\\) petit : variance \\(\\sigma^2/k\\) grande |\n| arbres et échelle | invariants par transformation strictement croissante de chaque variable |\n| grande dimension | \\(D^2\\) : espérance \\(p\\,m\\), variance \\(p\\,v\\), rapport en \\(1/\\sqrt{p}\\) ; Tchebychev ; exige des coordonnées indépendantes |\n| fuite | toute étape qui voit le test ; sélection sur tout l'échantillon : performance illusoire |\n| étiquettes à \\(h\\) jours | corrélation \\((h - k)/h\\) ; purge \\(h - 1\\) dates de chaque côté ; embargo \\(L\\) dates après |\n\n## À savoir refaire sans notes\n\n- Les deux écritures de la log-loss, le gradient, la hessienne, sa positivité et la convexité par Taylor.\n- La somme des probabilités ajustées avec constante, le rapport de cotes, la non-existence du minimum sous séparation.\n- F1 en fonction de VP, FP, FN ; la précision par la formule de Bayes ; l'AUC comme proportion de paires (preuve par l'escalier).\n- Brier et log-loss comme règles propres ; le seuil par les coûts.\n- La concentration de \\(D^2\\) avec Markov et Tchebychev, et le contre-exemple des coordonnées égales.\n- Purge et embargo sur l'exemple à 5 jours : quelles dates, et pourquoi.\n", "controles": {"convexite": {"question": "Régression logistique sans pénalité, \\(\\mathbf{X}\\) de rang \\(p\\). Quelle affirmation sur la log-loss moyenne \\(\\ell\\) est vraie ?", "options": [{"id": "a", "texte": "\\(\\ell\\) est strictement convexe, son gradient vaut \\(\\tfrac1n \\mathbf{X}^\\top (\\boldsymbol{\\pi} - \\mathbf{y})\\), et son minimiseur, s'il existe, est unique mais n'a pas de forme fermée.", "correcte": true, "explication": "Oui : hessienne \\(\\tfrac1n \\mathbf{X}^\\top \\mathbf{W}\\mathbf{X}\\) définie positive au rang \\(p\\) ; l'équation du premier ordre n'est pas linéaire en \\(\\mathbf{b}\\) ; et l'existence peut échouer (séparation)."}, {"id": "b", "texte": "\\(\\ell\\) a toujours un unique minimiseur, puisqu'elle est strictement convexe.", "correcte": false, "explication": "La stricte convexité donne au plus un minimiseur, pas son existence. Sous séparation parfaite, \\(\\ell\\) tend vers 0 sans l'atteindre : aucun minimiseur (partie 1, énoncé 6)."}, {"id": "c", "texte": "\\(\\ell\\) n'est pas convexe, car la fonction \\(\\sigma\\) ne l'est pas : on peut tomber dans un minimum local.", "correcte": false, "explication": "\\(\\sigma\\) n'est ni convexe ni concave, mais \\(\\ell\\) est une somme de \\(\\ln(1 + e^{t}) - y t\\), convexes en \\(t\\) (dérivée seconde \\(\\sigma(1 - \\sigma) > 0\\)), composées avec \\(t = \\mathbf{x}_i^\\top \\mathbf{b}\\) linéaire : convexe. Pas de minimum local non global."}, {"id": "d", "texte": "Le minimiseur vaut \\((\\mathbf{X}^\\top \\mathbf{X})^{-1} \\mathbf{X}^\\top \\mathbf{y}\\), comme pour les moindres carrés.", "correcte": false, "explication": "C'est la solution des moindres carrés sur les étiquettes 0 ou 1 (modèle de probabilité linéaire), pas le minimiseur de la log-loss, qui annule \\(\\mathbf{X}^\\top (\\boldsymbol{\\pi}(\\mathbf{b}) - \\mathbf{y})\\) avec \\(\\boldsymbol{\\pi}\\) non linéaire en \\(\\mathbf{b}\\)."}]}, "auc": {"question": "Un modèle a une AUC de 0,8 sur un échantillon de test. On remplace chaque probabilité prédite \\(r\\) par \\(r^2\\). Que deviennent l'AUC et le score de Brier ?", "options": [{"id": "a", "texte": "L'AUC reste 0,8 ; le score de Brier change en général.", "correcte": true, "explication": "Oui : \\(r \\mapsto r^2\\) est strictement croissante sur \\([0, 1]\\), donc l'ordre des scores, et la proportion de paires bien ordonnées, ne changent pas. Le Brier dépend des valeurs : dans l'expérience de calibration de la leçon, il augmente nettement."}, {"id": "b", "texte": "L'AUC baisse, car les probabilités ne sont plus calibrées.", "correcte": false, "explication": "L'AUC ne voit que l'ordre des scores, pas leurs valeurs : elle est aveugle à la calibration. C'est pour cela qu'on la complète par le Brier, la log-loss ou un diagramme de fiabilité."}, {"id": "c", "texte": "L'AUC et le Brier restent inchangés, car le classement est le même.", "correcte": false, "explication": "Le Brier est la moyenne de \\((r_i - y_i)^2\\) : il dépend des valeurs prédites, pas seulement de leur ordre. Une transformation croissante qui fausse les probabilités le dégrade en général."}, {"id": "d", "texte": "L'AUC devient \\(0{,}8^2\\), car chaque score est élevé au carré.", "correcte": false, "explication": "L'AUC est une proportion de paires bien ordonnées, pas une fonction des valeurs des scores. Élever les scores au carré ne change aucune comparaison entre deux scores positifs."}]}, "echelle": {"question": "On multiplie par 1000 l'une des variables (par exemple on passe de milliers d'euros à euros), sans rien changer d'autre, et on réajuste. Quelles prédictions sont à coup sûr inchangées, sur l'apprentissage comme sur des points nouveaux ?", "options": [{"id": "a", "texte": "Celles d'un arbre de décision.", "correcte": true, "explication": "Oui : multiplier par 1000 est affine croissant ; l'ordre des valeurs, les partitions possibles et les gains sont les mêmes, et les seuils au milieu de deux valeurs sont transportés exactement. L'expérience de la partie 3 le constate."}, {"id": "b", "texte": "Celles des 15 plus proches voisins avec la distance euclidienne.", "correcte": false, "explication": "La contribution de la variable à la distance est multipliée par \\(1000^2\\) : elle domine toutes les autres, et les voisins changent (exemple \\(Q\\), \\(A\\), \\(B\\) de la partie 3)."}, {"id": "c", "texte": "Celles d'une régression logistique avec la pénalité L2 par défaut de scikit-learn.", "correcte": false, "explication": "Sans pénalité, le coefficient serait divisé par 1000 et les prédictions inchangées. Avec la pénalité \\(\\tfrac12 \\lVert \\mathbf{w} \\rVert^2\\), le coefficient plus petit est moins pénalisé : la solution, et les prédictions, changent."}, {"id": "d", "texte": "Aucune des trois : tout modèle dépend de l'unité des variables.", "correcte": false, "explication": "Les arbres ne dépendent que de l'ordre des valeurs de chaque variable, et la régression logistique sans pénalité est elle aussi invariante (changement \\(b_j \\to b_j/1000\\))."}]}, "selection": {"question": "On dispose de 60 observations et 2000 variables. On garde les 20 variables les plus corrélées à \\(\\mathbf{y}\\) sur les 60 observations, puis on estime l'erreur d'une régression par validation croisée à 5 plis sur ces 20 variables. Quel est le défaut ?", "options": [{"id": "a", "texte": "La sélection a vu les observations de validation : l'erreur estimée est optimiste ; il faut refaire la sélection dans chaque pli, sur l'apprentissage du pli.", "correcte": true, "explication": "Oui : les variables retenues sont corrélées à \\(\\mathbf{y}\\) dans tout l'échantillon, plis de validation compris. L'expérience de la partie 4, avec des variables de bruit pur, donne une exactitude très supérieure au hasard avec cette procédure, et proche du hasard avec la sélection dans le pli."}, {"id": "b", "texte": "Aucun : la sélection n'utilise que les corrélations, pas le modèle de régression.", "correcte": false, "explication": "Toute étape qui regarde \\(\\mathbf{y}\\) fait partie de l'ajustement. Que ce soit une corrélation ou une régression ne change rien : l'information des plis de validation a servi à choisir les variables."}, {"id": "c", "texte": "5 plis sont trop peu ; avec 60 plis (une observation par pli), l'estimation serait sans biais.", "correcte": false, "explication": "Le nombre de plis ne corrige pas la fuite : avec une observation par pli, la sélection a toujours été faite en voyant cette observation. Le défaut est l'ordre des étapes, pas le nombre de plis."}, {"id": "d", "texte": "Il fallait standardiser les variables avant la sélection, sur tout l'échantillon.", "correcte": false, "explication": "La corrélation ne dépend pas de l'échelle, donc standardiser ne change pas la sélection ; et standardiser sur tout l'échantillon serait une seconde fuite, plus petite."}]}, "purge": {"question": "Étiquettes : rendement des 5 jours suivants ; variables : rendements des 20 derniers jours ; validation croisée par blocs de dates contiguës. Que retirent la purge et l'embargo de l'ensemble d'apprentissage ?", "options": [{"id": "a", "texte": "La purge : les 4 dates de chaque côté du bloc de test, dont l'étiquette partage un rendement avec une étiquette de test. L'embargo : les 20 dates suivantes après le bloc, dont les variables utilisent des rendements de la période de test.", "correcte": true, "explication": "Oui : chevauchement si et seulement si \\(t_0 - 4 \\le t \\le t_1 + 4\\) pour la purge ; fenêtre des variables qui rencontre \\(\\{t_0 + 1, \\dots, t_1 + 5\\}\\) si et seulement si \\(t \\le t_1 + 24\\) pour l'embargo (exemple de la leçon : dates 604 à 623)."}, {"id": "b", "texte": "La purge : les 5 dates de chaque côté du bloc. L'embargo : les 20 dates de chaque côté.", "correcte": false, "explication": "Deux err
