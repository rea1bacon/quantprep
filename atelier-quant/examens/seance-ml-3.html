eurs. La date \\(t_0 - 5\\) a pour étiquette \\(R_{t_0 - 4} + \\dots + R_{t_0}\\), qui ne partage rien avec les étiquettes de test (elles commencent à \\(R_{t_0 + 1}\\)) : la purge retire \\(h - 1 = 4\\) dates. Et avant le bloc, les variables n'utilisent que le passé : pas d'embargo de ce côté."}, {"id": "c", "texte": "La purge : les dates postérieures au bloc de test. L'embargo : les dates antérieures.", "correcte": false, "explication": "La purge agit des deux côtés (les étiquettes des 4 dates précédant le bloc contiennent des rendements de la période de test). L'embargo ne concerne que l'après-bloc."}, {"id": "d", "texte": "Rien, dès que les plis sont des blocs contigus : seul le mélange des dates crée une fuite.", "correcte": false, "explication": "Les blocs suppriment l'essentiel de la fuite, mais pas aux bords : la date \\(t_0 - 1\\) a une étiquette corrélée à \\(0{,}8\\) avec celle de \\(t_0\\). En validation progressive à réapprentissage fréquent, toutes les dates de test sont des bords (expérience de la partie 4)."}]}}, "cellules_initiales": ["import numpy as np\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import roc_auc_score, brier_score_loss, log_loss\nnp.set_printoptions(precision=4, suppress=True)", "# Essaie ici les expériences de la leçon, en les modifiant.\nrng = np.random.default_rng(0)\npi = rng.uniform(0, 1, 10000)\nY = (rng.uniform(size=10000) < pi).astype(int)\nfor r in [pi, pi**2, np.sqrt(pi)]:\n    print(roc_auc_score(Y, r), brier_score_loss(Y, r))"], "verif": {"script": "verif/seance_ml_3.py"}}]}, {"id": "mlf", "nom": "Machine Learning fondamental", "budget_min": 20, "questions": [{"id": "ML3-01", "section": "mlf", "theme": "Régression logistique : rapport de cotes", "difficulte": 2, "temps_cible_s": 75, "enonce": "Une régression logistique \\(\\mathbb{P}(Y = 1 \\mid \\mathbf{x}) = \\sigma(\\mathbf{x}^\\top \\boldsymbol{\\beta})\\), avec \\(\\sigma(t) = 1/(1 + e^{-t})\\), a pour coefficient de la variable \\(x_j\\) la valeur \\(\\beta_j = 0{,}4\\). Pour un individu donné, la probabilité prédite vaut 0,2.\n\nOn augmente \\(x_j\\) de 1 pour cet individu, toutes les autres variables restant fixées. Que vaut la nouvelle probabilité prédite, arrondie à trois décimales ?", "options": [{"id": "a", "texte": "0,272", "correcte": true, "explication": "Oui : la cote \\(0{,}2/0{,}8\\) est multipliée par \\(e^{0{,}4}\\), puis on revient à la probabilité par \\(c/(1 + c)\\)."}, {"id": "b", "texte": "0,298", "correcte": false, "explication": "C'est \\(0{,}2 \\times e^{0{,}4}\\) : le facteur \\(e^{\\beta_j}\\) a été appliqué à la probabilité. Il multiplie la **cote** \\(\\pi/(1 - \\pi)\\), pas la probabilité."}, {"id": "c", "texte": "0,264", "correcte": false, "explication": "C'est l'approximation linéaire \\(0{,}2 + \\beta_j \\pi(1 - \\pi) = 0{,}2 + 0{,}4 \\times 0{,}16\\), qui utilise la dérivée au point de départ. La probabilité n'est pas linéaire en \\(x_j\\) : pour un pas de 1, il faut le calcul exact par la cote."}, {"id": "d", "texte": "0,599", "correcte": false, "explication": "C'est \\(\\sigma(0{,}4)\\) : le point de départ a été oublié, comme si le score linéaire valait 0 avant l'augmentation. Le nouveau score vaut \\(\\ln(0{,}2/0{,}8) + 0{,}4\\)."}], "solution": "Réponse : \\(0{,}272\\).\n\nÉtape 1 : la cote de départ vaut \\(0{,}2/0{,}8 = 0{,}25\\).\n\nÉtape 2 : le logit est linéaire en \\(x_j\\), de pente \\(\\beta_j\\) ; augmenter \\(x_j\\) de 1 multiplie la cote par \\(e^{0{,}4} \\approx 1{,}4918\\) (leçon, partie 1, énoncé 5). Nouvelle cote : \\(0{,}3730\\).\n\nÉtape 3 : retour à la probabilité, \\(c/(1 + c) = 0{,}3730/(1 + 0{,}3730) \\approx 0{,}2716\\).\n\nContrôle : \\(\\sigma\\big(\\ln(0{,}25) + 0{,}4\\big)\\) donne la même valeur (script).", "type": "qcm", "multiple": false, "reponse": "0,272", "fiche": null, "verif": {"script": "verif/seance_ml_3.py", "cles": ["Q01_cote0", "Q01_cote1", "Q01_d_lin", "Q01_d_prob", "Q01_d_sig", "Q01_derivee", "Q01_exact", "Q01_or"]}}, {"id": "ML3-02", "section": "mlf", "theme": "Régression logistique : gradient de la log-loss", "difficulte": 3, "temps_cible_s": 90, "enonce": "Régression logistique avec constante sur trois observations : \\(x = (-1, 0, 2)\\), étiquettes \\(\\mathbf{y} = (0, 1, 1)\\). La matrice \\(\\mathbf{X}\\) a pour lignes \\((1, x_i)\\). Pour \\(\\mathbf{b} = (b_0, b_1)\\), la probabilité prédite est \\(\\pi_i = \\sigma(b_0 + b_1 x_i)\\), avec \\(\\sigma(t) = 1/(1 + e^{-t})\\), et la log-loss moyenne est \\(\\ell(\\mathbf{b}) = -\\tfrac13 \\sum_{i=1}^3 \\big[y_i \\ln \\pi_i + (1 - y_i)\\ln(1 - \\pi_i)\\big]\\).\n\nQue vaut le gradient \\(\\nabla \\ell\\) au point \\(\\mathbf{b} = (0, 1)\\), coordonnées arrondies à trois décimales ?", "options": [{"id": "a", "texte": "(-0,117 ; -0,169)", "correcte": true, "explication": "Oui : \\(\\tfrac13 \\mathbf{X}^\\top (\\boldsymbol{\\pi} - \\mathbf{y})\\), avec \\(\\boldsymbol{\\pi} = (\\sigma(-1), \\sigma(0), \\sigma(2))\\)."}, {"id": "b", "texte": "(0{,}117 ; 0{,}169)", "correcte": false, "explication": "C'est \\(\\tfrac13 \\mathbf{X}^\\top (\\mathbf{y} - \\boldsymbol{\\pi})\\), le gradient de la log-vraisemblance moyenne, que l'on **maximise**. La log-loss en est l'opposé : son gradient est \\(\\tfrac13 \\mathbf{X}^\\top (\\boldsymbol{\\pi} - \\mathbf{y})\\)."}, {"id": "c", "texte": "(-0{,}350 ; -0{,}507)", "correcte": false, "explication": "C'est \\(\\mathbf{X}^\\top (\\boldsymbol{\\pi} - \\mathbf{y})\\) sans le facteur \\(\\tfrac13\\) : le gradient de la somme des pertes, pas de leur moyenne telle que l'énoncé la définit."}, {"id": "d", "texte": "(-0{,}028 ; -0{,}026)", "correcte": false, "explication": "Les résidus \\(\\pi_i - y_i\\) ont été multipliés par les poids \\(\\pi_i(1 - \\pi_i)\\). Ces poids apparaissent dans la hessienne, pas dans le gradient : la dérivée de \\(\\ln(1 + e^{t}) - y t\\) est \\(\\sigma(t) - y\\), sans autre facteur."}], "solution": "Réponse : \\(\\nabla \\ell(0, 1) \\approx (-0{,}117 ; -0{,}169)\\).\n\nÉtape 1 (leçon, partie 1, énoncé 1) : \\(\\nabla \\ell(\\mathbf{b}) = \\tfrac1n \\mathbf{X}^\\top (\\boldsymbol{\\pi} - \\mathbf{y})\\), car la dérivée de \\(\\ln(1 + e^{t}) - y t\\) par rapport à \\(t\\) vaut \\(\\sigma(t) - y\\) et \\(\\partial t_i/\\partial b_j = x_{ij}\\).\n\nÉtape 2 : scores \\(t = (-1, 0, 2)\\), probabilités \\(\\boldsymbol{\\pi} \\approx (0{,}2689 ; 0{,}5000 ; 0{,}8808)\\), résidus \\(\\boldsymbol{\\pi} - \\mathbf{y} \\approx (0{,}2689 ; -0{,}5000 ; -0{,}1192)\\).\n\nÉtape 3 : coordonnée de la constante : somme des résidus \\(\\approx -0{,}3503\\) ; coordonnée de la pente : \\(\\sum_i x_i (\\pi_i - y_i) \\approx -0{,}5073\\). On divise par 3.\n\nLecture : les deux coordonnées sont négatives, donc augmenter \\(b_0\\) et \\(b_1\\) fait baisser la perte ; un pas de descente de longueur 0,1 la fait passer de \\(0{,}3778\\) à \\(0{,}3736\\) (script, qui contrôle aussi le gradient par différences finies).", "type": "qcm", "multiple": false, "reponse": "(-0,117 ; -0,169)", "fiche": null, "verif": {"script": "verif/seance_ml_3.py", "cles": ["Q02_d_poids", "Q02_d_sans_n", "Q02_d_signe", "Q02_exact", "Q02_loss_b", "Q02_loss_pas", "Q02_pi", "Q02_res", "Q02_somme", "Q02_somme_x"]}}, {"id": "ML3-03", "section": "mlf", "theme": "Régression logistique : existence du maximum de vraisemblance, séparation", "difficulte": 4, "temps_cible_s": 120, "enonce": "Régression logistique **sans pénalité**, avec constante et une variable \\(x\\), qui prend les valeurs \\(x = (1, 2, 3, 4)\\) pour quatre observations. On considère quatre vecteurs d'étiquettes possibles pour ces quatre observations, dans cet ordre :\n\n- J1 : \\((0, 1, 0, 1)\\) ;\n- J2 : \\((0, 0, 1, 1)\\) ;\n- J3 : \\((0, 0, 0, 1)\\) ;\n- J4 : \\((1, 1, 1, 1)\\).\n\nPour lequel de ces jeux la log-loss moyenne, vue comme fonction des deux coefficients \\((b_0, b_1)\\) réels, **atteint-elle** son minimum ?", "options": [{"id": "a", "texte": "J1 seulement.", "correcte": true, "explication": "Oui : J1 n'est pas séparable (une étiquette 0 en \\(x = 3\\) entre deux étiquettes 1), la log-loss est strictement convexe et atteint son minimum en un point unique ; J2, J3 et J4 sont séparables par la direction indiquée dans la correction."}, {"id": "b", "texte": "J1 et J4.", "correcte": false, "explication": "J4 a toutes ses étiquettes égales à 1 : la direction de la constante \\((1, 0)\\) le sépare. Avec \\(\\mathbf{b} = (c, 0)\\), chaque terme vaut \\(\\ln(1 + e^{-c})\\), qui tend vers 0 sans l'atteindre : la constante part à \\(+\\infty\\)."}, {"id": "c", "texte": "J1, J3 et J4 : seul J2 pose problème, car il est parfaitement séparé au milieu.", "correcte": false, "explication": "J3 est aussi séparé, par le seuil \\(x = 3{,}5\\) : direction \\((-3{,}5 ; 1)\\), positive seulement en \\(x = 4\\). Une seule observation d'un côté suffit pour une séparation."}, {"id": "d", "texte": "Les quatre : la log-loss est convexe, donc elle atteint toujours son minimum.", "correcte": false, "explication": "La convexité donne l'unicité éventuelle et l'absence de minimum local non global, pas l'existence. Sous séparation, la log-loss tend vers 0 sans l'atteindre, puisqu'elle est strictement positive en tout point."}], "solution": "Réponse : J1 seulement.\n\nÉtape 1, critère (leçon, partie 1, énoncé 6) : s'il existe \\(\\mathbf{b}^\\star\\) avec \\(b_0^\\star + b_1^\\star x_i > 0\\) pour les étiquettes 1 et \\(< 0\\) pour les étiquettes 0, la log-loss tend vers 0 le long de \\(c\\,\\mathbf{b}^\\star\\) quand \\(c \\to \\infty\\), et n'atteint jamais 0, car chaque terme \\(\\ln(1 + e^{\\pm t_i})\\) est strictement positif.\n\nÉtape 2, J2, J3, J4 sont séparés : J2 par \\(\\mathbf{b}^\\star = (-2{,}5 ; 1)\\) (seuil 2,5) ; J3 par \\((-3{,}5 ; 1)\\) (seuil 3,5) ; J4 par \\((1 ; 0)\\) (constante seule). Log-loss le long de \\(c\\,\\mathbf{b}^\\star\\), pour \\(c = 1\\) puis \\(c = 10\\) : J2 \\(0{,}3377\\) puis \\(0{,}0034\\) ; J3 \\(0{,}3071\\) puis \\(0{,}0034\\) ; J4 \\(0{,}3133\\) puis \\(0{,}000045\\).\n\nÉtape 3, J1 : une fonction affine de \\(x\\) positive en \\(x = 2\\) et \\(x = 4\\) et négative en \\(x = 1\\) et \\(x = 3\\) changerait de signe trois fois, impossible : pas de séparation. Le minimiseur, calculé par la méthode de Newton (script), vaut \\(\\hat{\\mathbf{b}} \\approx (-2{,}270 ; 0{,}908)\\), de log-loss \\(0{,}5869\\), avec une hessienne définie positive en ce point. Remarque : ce sont les données de l'exemple de la leçon décalées de 2 en \\(x\\) ; la pente est la même, la constante absorbe le décalage.\n\nAvec la pénalité L2 par défaut de scikit-learn, un minimiseur existe pour J1, J2 et J3 ; pour J4, une seule classe, scikit-learn refuse l'ajustement (`ValueError`, vérifié sous scikit-learn 1.1.1).", "type": "qcm", "multiple": false, "reponse": "J1 seulement.", "fiche": null, "verif": {"script": "verif/seance_ml_3.py", "cles": ["Q03_b_c1", "Q03_b_c10", "Q03_bhat", "Q03_c_c1", "Q03_c_c10", "Q03_d_c1", "Q03_d_c10", "Q03_loss_hat"]}}, {"id": "ML3-04", "section": "mlf", "theme": "Métriques sous déséquilibre : précision, exactitude", "difficulte": 3, "temps_cible_s": 90, "enonce": "Un détecteur de fraude est évalué sur \\(n = 10\\,000\\) transactions, dont 200 frauduleuses (positives). Au seuil choisi, il détecte 80 % des fraudes (taux de vrais positifs 0,8) et signale à tort 5 % des transactions honnêtes (taux de faux positifs 0,05). On compare à un classifieur constant qui déclare toutes les transactions honnêtes.\n\nQuelle affirmation est vraie ?", "options": [{"id": "a", "texte": "La précision vaut environ 0,246, et l'exactitude du détecteur, 0,947, est inférieure à celle du classifieur constant, 0,98.", "correcte": true, "explication": "Oui : VP = 160, FP = 490, précision \\(160/650\\) ; exactitude \\(9470/10\\,000\\) contre \\(9800/10\\,000\\) pour le constant."}, {"id": "b", "texte": "La précision vaut 0,8, puisque le détecteur trouve 80 % des fraudes.", "correcte": false, "explication": "0,8 est le **rappel**, \\(\\mathrm{VP}/(\\mathrm{VP} + \\mathrm{FN})\\). La précision divise par les prédictions positives, \\(\\mathrm{VP} + \\mathrm{FP}\\), dominées ici par les 490 fausses alertes."}, {"id": "c", "texte": "La précision vaut 0{,}95, puisque seulement 5 % des transactions honnêtes sont signalées.", "correcte": false, "explication": "0,95 est la spécificité \\(1 - \\mathrm{TFP}\\), la part des honnêtes reconnues comme telles. Un petit taux de faux positifs appliqué à 9800 transactions honnêtes donne pourtant 490 fausses alertes, contre 160 vraies."}, {"id": "d", "texte": "La précision vaut environ 0,246, et l'exactitude du détecteur, 0,947, dépasse celle du classifieur constant, ce qui confirme son utilité.", "correcte": false, "explication": "Le classifieur constant a une exactitude de \\(1 - 200/10\\,000 = 0{,}98\\), supérieure à \\(0{,}947\\). C'est précisément pourquoi l'exactitude est trompeuse sous déséquilibre : elle préfère le classifieur qui ne détecte rien."}], "solution": "Réponse : précision \\(\\tfrac{16}{65} \\approx 0{,}246\\), exactitude \\(0{,}947 < 0{,}98\\).\n\nÉtape 1, matrice de confusion : VP \\(= 0{,}8 \\times 200 = 160\\), FN \\(= 40\\) ; FP \\(= 0{,}05 \\times 9800 = 490\\), VN \\(= 9310\\).\n\nÉtape 2 : précision \\(= 160/(160 + 490) \\approx 0{,}246\\) ; c'est aussi \\(q\\,\\mathrm{TVP}/(q\\,\\mathrm{TVP} + (1 - q)\\mathrm{TFP})\\) avec \\(q = 0{,}02\\) (leçon, partie 2).\n\nÉtape 3 : exactitude \\(= (160 + 9310)/10\\,000 = 0{,}947\\) ; classifieur constant : \\(9800/10\\,000 = 0{,}98\\).\n\nComplément : F1 \\(= 2\\mathrm{VP}/(2\\mathrm{VP} + \\mathrm{FP} + \\mathrm{FN}) \\approx 0{,}376\\). Pour juger ce détecteur : courbe précision-rappel, ou coût des deux types d'erreur.", "type": "qcm", "multiple": false, "reponse": "La précision vaut environ 0,246, et l'exactitude du détecteur, 0,947, est inférieure à celle du classifieur constant, 0,98.", "fiche": null, "verif": {"script": "verif/seance_ml_3.py", "cles": ["Q04_const", "Q04_d_spec", "Q04_exact", "Q04_f1", "Q04_fn", "Q04_fp", "Q04_neg", "Q04_pp", "Q04_prec", "Q04_prec_den", "Q04_prec_num", "Q04_rap", "Q04_vn", "Q04_vp", "Q04_vp_vn"]}}, {"id": "ML3-05", "section": "mlf", "theme": "AUC comme proportion de paires, ex aequo", "difficulte": 4, "temps_cible_s": 120, "enonce": "Sept observations de test ont reçu les scores suivants :\n\n- positifs (étiquette 1) : 0,9 ; 0,6 ; 0,4 ;\n- négatifs (étiquette 0) : 0,7 ; 0,4 ; 0,3 ; 0,1.\n\nL'AUC est l'aire sous la courbe ROC empirique, obtenue en faisant varier le seuil et en joignant les points successifs par des segments ; un positif et un négatif de même score franchissent le seuil ensemble (segment diagonal). C'est la convention de `roc_auc_score` de scikit-learn.\n\nQue vaut l'AUC, arrondie à trois décimales ?", "options": [{"id": "a", "texte": "0,792", "correcte": true, "explication": "Oui : 9 paires bien ordonnées et 1 ex aequo compté \\(\\tfrac12\\), sur 12 paires : \\(9{,}5/12\\)."}, {"id": "b", "texte": "0{,}750", "correcte": false, "explication": "C'est \\(9/12\\) : la paire ex aequo (0,4 contre 0,4) a été comptée 0. Le segment diagonal correspondant porte la moitié d'un rectangle : elle compte \\(\\tfrac12\\)."}, {"id": "c", "texte": "0,833", "correcte": false, "explication": "C'est \\(10/12\\) : la paire ex aequo a été comptée comme bien ordonnée. Un ex aequo n'est ni bien ni mal ordonné : il compte \\(\\tfrac12\\)."}, {"id": "d", "texte": "0{,}714", "correcte": false, "explication": "C'est l'exactitude au seuil 0,5 (prédire 1 si le score dépasse 0,5) : 2 positifs et 3 négatifs bien classés sur 7. L'AUC ne dépend d'aucun seuil : elle résume tous les seuils à la fois."}], "solution": "Réponse : \\(\\mathrm{AUC} = \\tfrac{19}{24} \\approx 0{,}792\\).\n\nÉtape 1 (leçon, partie 2) : l'AUC est la proportion de paires (positif, négatif) où le positif a le score le plus élevé, une paire ex aequo comptant \\(\\tfrac12\\) (segment diagonal, dont l'aire est la moitié du rectangle).\n\nÉtape 2 : il y a \\(3 \\times 4 = 12\\) paires. Le positif 0,9 bat 4 négatifs (tous) ; 0,6 bat 0,4, 0,3 et 0,1, soit 3 ; 0,4 bat 0,3 et 0,1, soit 2, et fait ex aequo avec le négatif 0,4. Bien ordonnées : \\(9\\), ex aequo : \\(1\\).\n\nÉtape 3 : \\((9 + \\tfrac12)/12 = \\tfrac{19}{24}\\).\n\nVérification (script) : l'aire calculée directement sous l'escalier ROC, trapèzes compris, donne la même fraction.", "type": "qcm", "multiple": false, "reponse": "0,792", "fiche": null, "verif": {"script": "verif/seance_ml_3.py", "cles": ["Q05_bien", "Q05_bien_egal", "Q05_d_exactitude", "Q05_d_un", "Q05_d_zero", "Q05_demi", "Q05_egal", "Q05_ex_vn", "Q05_ex_vp", "Q05_exact", "Q05_exact_den", "Q05_exact_num", "Q05_p1", "Q05_p2", "Q05_p3", "Q05_paires"]}}, {"id": "ML3-06", "section": "mlf", "theme": "Score de Brier, calibration et AUC", "difficulte": 5, "temps_cible_s": 150, "enonce": "Une population se compose de deux groupes de même taille. Dans le groupe 1, chaque individu a la probabilité 0,1 d'être positif ; dans le groupe 2, la probabilité 0,5 ; les étiquettes sont indépendantes. Le modèle A prédit pour chaque individu la vraie probabilité de son groupe (0,1 ou 0,5). Le modèle B prédit 0,3 pour tout le monde.\n\nOn note, pour chaque modèle, son score de Brier espéré \\(\\mathbb{E}[(R - Y)^2]\\) (\\(R\\) : prévision, \\(Y\\) : étiquette, individu tiré au hasard dans la population), son AUC en population, \\(\\mathbb{P}(S^+ > S^-) + \\tfrac12 \\mathbb{P}(S^+ = S^-)\\), où \\(S^+\\) est la prévision d'un positif tiré au hasard et \\(S^-\\), indépendamment, celle d'un négatif tiré au hasard, et on dit qu'un modèle est calibré si \\(\\mathbb{P}(Y = 1 \\mid R = r) = r\\) pour chaque valeur \\(r\\) qu'il prédit.\n\nQuelle affirmation est vraie ?", "options": [{"id": "a", "texte": "Les deux modèles sont calibrés ; Brier : A 0,17, B 0,21 ; AUC : A 0,738, B 0,5.", "correcte": true, "explication": "Oui : B est calibré, car parmi les individus à qui il prédit 0,3 (tous), la proportion de positifs est \\((0{,}1 + 0{,}5)/2\\). Mais il ne discrimine pas : AUC \\(\\tfrac12\\), et un Brier plus élevé de la moyenne des \\((0{,}3 - q)^2\\)."}, {"id": "b", "texte": "B n'est pas calibré, puisqu'il se trompe sur chaque groupe ; Brier : A 0{,}17, B 0{,}21.", "correcte": false, "explication": "La calibration porte sur les valeurs prédites, pas sur les groupes : pour la seule valeur prédite 0,3, la fréquence de positifs est \\(0{,}3\\). B est calibré mais peu informatif ; c'est la discrimination (AUC) qui lui manque."}, {"id": "c", "texte": "Les deux modèles sont calibrés, donc ils ont le même score de Brier, 0{,}21.", "correcte": false, "explication": "Le score de Brier mesure la calibration **et** la discrimination : son espérance vaut la moyenne de \\((r - q)^2 + q(1 - q)\\), et B paie en plus la moyenne des \\((0{,}3 - q)^2\\). Être calibré ne suffit pas pour minimiser le Brier."}, {"id": "d", "texte": "A a une AUC de 1, puisqu'il prédit les vraies probabilités.", "correcte": false, "explication": "Connaître les vraies probabilités ne sépare pas les classes : dans le groupe 2, la moitié des individus sont négatifs et reçoivent la même prévision que les positifs. L'AUC de A vaut \\(\\tfrac{31}{42}\\)."}], "solution": "Réponse : les deux modèles sont calibrés ; Brier A \\(0{,}17\\), B \\(0{,}21\\) ; AUC A \\(\\tfrac{31}{42} \\approx 0{,}738\\), B \\(\\tfrac12\\).\n\nNotations : \\(q_1 = 0{,}1\\), \\(q_2 = 0{,}5\\) les probabilités des groupes.\n\nÉtape 1, calibration : A prédit \\(q_g\\) dans le groupe \\(g\\), où la fréquence de positifs est \\(q_g\\). B ne prédit que 0,3, et la fréquence de positifs dans la population entière est \\((q_1 + q_2)/2 = 0{,}3\\).\n\nÉtape 2, Brier (leçon, partie 2) : pour une prévision \\(r\\) d'une Bernoulli de paramètre \\(q\\), \\(\\mathbb{E}[(r - Y)^2] = (r - q)^2 + q(1 - q)\\). A : \\(\\tfrac12 \\big(q_1(1 - q_1) + q_2(1 - q_2)\\big) = 0{,}17\\). B : \\(0{,}17 + \\tfrac12 \\big((0{,}3 - q_1)^2 + (0{,}3 - q_2)^2\\big) = 0{,}21\\).\n\nÉtape 3, AUC de A : par la formule de Bayes, un positif vient du groupe 2 avec probabilité \\(\\tfrac{q_2}{q_1 + q_2} = \\tfrac{5}{6}\\) (du groupe 1 avec probabilité \\(\\tfrac{1}{6}\\)), un négatif du groupe 1 avec probabilité \\(\\tfrac{1 - q_1}{(1 - q_1) + (1 - q_2)} = \\tfrac{9}{14}\\) (du groupe 2 avec probabilité \\(\\tfrac{5}{14}\\)). \\(S^+ > S^-\\) exactement quand le positif est du groupe 2 et le négatif du groupe 1 ; ex aequo quand ils sont du même groupe. AUC \\(= \\tfrac{5}{6} \\cdot \\tfrac{9}{14} + \\tfrac12\\big(\\tfrac{5}{6} \\cdot \\tfrac{5}{14} + \\tfrac{1}{6} \\cdot \\tfrac{9}{14}\\big) = \\tfrac{31}{42}\\). AUC de B : toujours ex aequo, \\(\\tfrac12\\).\n\nSimulation (script, 400 000 individus) : Brier A \\(0{,}1700\\), B \\(0{,}2100\\), AUC de A \\(0{,}7378\\).", "type": "qcm", "multiple": false, "reponse": "Les deux modèles sont calibrés ; Brier : A 0,17, B 0,21 ; AUC : A 0,738, B 0,5.", "fiche": null, "verif": {"script": "verif/seance_ml_3.py", "cles": ["Q06_auc_A", "Q06_auc_A_den", "Q06_auc_A_mc", "Q06_auc_A_num", "Q06_brier_A", "Q06_brier_A_mc", "Q06_brier_B", "Q06_brier_B_mc", "Q06_calib_B", "Q06_d_brier_moy", "Q06_pn1_den", "Q06_pn1_num", "Q06_pn2_den", "Q06_pn2_num", "Q06_pp1_den", "Q06_pp1_num", "Q06_pp2_den", "Q06_pp2_num"]}}, {"id": "ML3-07", "section": "mlf", "theme": "Malédiction de la dimension : concentration des distances, Tchebychev", "difficulte": 4, "temps_cible_s": 120, "enonce": "Soient \\(\\mathbf{X}\\) et \\(\\mathbf{X}'\\) deux vecteurs aléatoires de \\(\\mathbb{R}^{50}\\) dont les 100 coordonnées sont indépendantes et de loi normale \\(\\mathcal{N}(0, 1)\\). On note \\(D^2 = \\lVert \\mathbf{X} - \\mathbf{X}' \\rVert^2\\) le carré de leur distance euclidienne.\n\nQue valent le rapport \\(\\sqrt{\\mathrm{Var}(D^2)}/\\mathbb{E}[D^2]\\), et la borne que l'inégalité de Tchebychev donne pour \\(\\mathbb{P}\\big(\\lvert D^2/\\mathbb{E}[D^2] - 1 \\rvert \\ge 0{,}5\\big)\\) ?", "options": [{"id": "a", "texte": "Rapport 0,20, borne 0,16.", "correcte": true, "explication": "Oui : \\(X_j - X_j'\\) suit \\(\\mathcal{N}(0, 2)\\), donc \\((X_j - X_j')^2\\) a pour espérance 2 et pour variance \\(12 - 4 = 8\\) ; rapport \\(\\sqrt{50 \\times 8}/(50 \\times 2)\\), puis borne égale au carré du rapport divisé par \\(0{,}5^2\\)."}, {"id": "b", "texte": "Rapport 0,10, borne 0,04.", "correcte": false, "explication": "La variance de \\((X_j - X_j')^2\\) a été prise égale à 2, celle d'un khi-deux à un degré de liberté, en oubliant que \\(X_j - X_j'\\) a pour variance 2 et non 1 : \\((X_j - X_j')^2 = 2 Z^2\\) avec \\(Z\\) normale centrée réduite, de variance \\(2^2\\,\\mathrm{Var}(Z^2) = 8\\)."}, {"id": "c", "texte": "Rapport 0,04, borne 0,0064.", "correcte": false, "explication": "0,04 est \\(\\mathrm{Var}(D^2)/\\mathbb{E}[D^2]^2\\), le **carré** du rapport demandé ; la borne a ensuite été calculée avec ce carré, élevé de nouveau au carré."}, {"id": "d", "texte": "Rapport 0,20, borne 0,4.", "correcte": false, "explication": "C'est le rapport divisé par 0,5, sans carré : Tchebychev borne la probabilité par \\(\\mathrm{Var}/a^2\\), donc par le carré du rapport divisé par \\(\\varepsilon^2\\), soit \\(0{,}04/0{,}25\\)."}], "solution": "Réponse : rapport \\(0{,}20\\), borne \\(\\tfrac{4}{25} = 0{,}16\\).\n\nÉtape 1 : \\(X_j - X_j'\\), différence de deux normales indépendantes centrées réduites, suit \\(\\mathcal{N}(0, 2)\\). Ses moments : \\(\\mathbb{E}[(X_j - X_j')^2] = 2\\), \\(\\mathbb{E}[(X_j - X_j')^4] = 3 \\times 2^2 = 12\\) (moment d'ordre 4 d'une normale centrée de variance \\(s^2\\) : \\(3s^4\\) ; intégrales calculées par sympy dans le script). Donc \\(v = \\mathrm{Var}\\big((X_j - X_j')^2\\big) = 8\\).\n\nÉtape 2 (leçon, partie 3) : \\(D^2\\) est une somme de 50 termes indépendants de même loi : \\(\\mathbb{E}[D^2] = 50 \\times 2 = 100\\), \\(\\mathrm{Var}(D^2) = 50 \\times 8 = 400\\). Rapport \\(\\sqrt{400}/100 = 0{,}20\\), égal à \\(\\sqrt{2/p}\\) avec \\(p = 50\\).\n\nÉtape 3, Tchebychev : \\(\\mathbb{P}(\\lvert D^2 - \\mathbb{E}D^2 \\rvert \ <script>
'use strict';
const D = JSON.parse(document.getElementById('donnees').textContent);
const ITEMS = D.sections.flatMap(s => s.questions.map(q => Object.assign({ nomSection: s.nom }, q)));
const CLE = 'atelier-quant:' + D.id;
const SERVEUR = location.protocol.startsWith('http');
// La session survit à un rechargement de l'onglet : on se reconnecte alors au même noyau, variables comprises.
const SESSION = (() => { const neuve = Math.random().toString(36).slice(2) + Date.now().toString(36); try { const s = sessionStorage.getItem('atelier-quant:session') || neuve; sessionStorage.setItem('atelier-quant:session', s); return s; } catch (e) { return neuve; } })();
const page = document.getElementById('page');
const noyauxDemarres = {};
let E = etatNeuf('accueil');

function etatNeuf(phase) { return { phase, courant: 0, debut: null, fin: null, reponses: {}, temps: {}, ordre: {}, cellules: {}, code: {}, controles: {}, ordreControles: {}, vus: {}, partie: {}, enregistrement: null, pauseDepuis: null, pauseTotale: 0 }; }
// Options par défaut : la pause et « Je ne sais pas » sont permis, sauf si l'examen les interdit (examens blancs).
const PAUSE_PERMISE = D.options.pause !== false;
const NSP_PERMIS = D.options.je_ne_sais_pas !== false;
function dureeEcoulee(fin) { return (fin - E.debut - (E.pauseTotale || 0) - (E.pauseDepuis ? fin - E.pauseDepuis : 0)) / 1000; }
const NOTEES = ITEMS.filter(q => q.type !== 'lecon');
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(E)); } catch (e) {} }
function charger() { try { const s = localStorage.getItem(CLE); if (s) E = Object.assign(etatNeuf('accueil'), JSON.parse(s)); } catch (e) {} }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function enLigne(t) { return esc(t).replace(/`([^`]+)`/g, '<code class="sans-math">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

// Markdown réduit : titres #, tableaux |, listes - et 1., paragraphes, `code`, **gras**, blocs entre triples accents graves.
function rendre(t) {
  let h = '';
  String(t).split('```').forEach((bloc, i) => {
    if (i % 2) {
      const info = (bloc.match(/^(\w*)\n/) || [])[1];
      h += '<pre class="sans-math' + (info === 'sortie' ? ' sortie-lecon' : '') + '"><code>' + esc(bloc.replace(/^\w*\n/, '')) + '</code></pre>';
      return;
    }
    const lignes = bloc.split('\n');
    let k = 0;
    while (k < lignes.length) {
      const l = lignes[k];
      if (!l.trim()) { k++; continue; }
      const titre = l.match(/^(#{1,4})\s+(.*)$/);
      if (titre) { const n = Math.min(4, titre[1].length + 1); h += '<h' + n + '>' + enLigne(titre[2]) + '</h' + n + '>'; k++; continue; }
      if (l.trim().startsWith('|')) {
        const rangs = [];
        while (k < lignes.length && lignes[k].trim().startsWith('|')) { rangs.push(lignes[k].trim()); k++; }
        const cellules = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
        h += '<div class="defile"><table><tr>' + cellules(rangs[0]).map(c => '<th>' + enLigne(c) + '</th>').join('') + '</tr>';
        rangs.slice(1).filter(r => !/^\|[\s|:-]+\|$/.test(r)).forEach(r => { h += '<tr>' + cellules(r).map(c => '<td>' + enLigne(c) + '</td>').join('') + '</tr>'; });
        h += '</table></div>'; continue;
      }
      const puce = /^\s*[-*]\s+/, numero = /^\s*\d+\.\s+/;
      if (puce.test(l) || numero.test(l)) {
        const motif = puce.test(l) ? puce : numero, balise = motif === puce ? 'ul' : 'ol';
        h += '<' + balise + '>';
        while (k < lignes.length && motif.test(lignes[k])) { h += '<li>' + enLigne(lignes[k].replace(motif, '')) + '</li>'; k++; }
        h += '</' + balise + '>'; continue;
      }
      const par = [];
      while (k < lignes.length && lignes[k].trim() && !/^(#{1,4}\s|\s*\||\s*[-*]\s|\s*\d+\.\s)/.test(lignes[k])) { par.push(lignes[k]); k++; }
      const texte = par.join('\n').trim();
      // Un paragraphe réduit à une seule formule est centré ; une formule au milieu d'une phrase reste dans la ligne.
      const seule = texte.startsWith('\\(') && texte.endsWith('\\)') && texte.indexOf('\\(', 2) < 0;
      h += (seule ? '<p class="formule">' : '<p>') + enLigne(par.join('\n')) + '</p>';
    }
  });
  return h;
}
function composer(el) { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el || page]).catch(() => {}); }
function mmss(s) { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function melanger(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function api(chemin, corps) {
  const r = await fetch(chemin, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
  return r.json();
}

let dernierTic = null;
function tic() {
  const ch = document.getElementById('chrono');
  const bouton = document.getElementById('pause');
  bouton.hidden = !(PAUSE_PERMISE && E.phase === 'epreuve');
  document.getElementById('recommencerHaut').hidden = E.phase !== 'epreuve';
  document.getElementById('voile').hidden = !(E.phase === 'epreuve' && E.pauseDepuis);
  if (E.phase !== 'epreuve' || E.pauseDepuis) { dernierTic = null; return; }
  const maintenant = Date.now();
  if (dernierTic !== null) { const q = ITEMS[E.courant]; E.temps[q.id] = (E.temps[q.id] || 0) + (maintenant - dernierTic) / 1000; }
  dernierTic = maintenant;
  const reste = D.duree_minutes * 60 - dureeEcoulee(maintenant);
  ch.textContent = (reste < 0 ? '+' : '') + mmss(Math.abs(reste));
  ch.classList.toggle('depasse', reste < 0);
}
setInterval(() => { tic(); if (E.phase === 'epreuve') sauver(); }, 500);
if (SERVEUR) document.getElementById('lienAccueil').hidden = false;
document.getElementById('lienAccueil').onclick = () => {
  if (E.phase === 'epreuve' && PAUSE_PERMISE && !E.pauseDepuis) { tic(); E.pauseDepuis = Date.now(); sauver(); }
};
document.getElementById('recommencerHaut').onclick = () => {
  if (!confirm('Effacer ce passage (réponses, code, chronomètre) et revenir au début de la séance ?')) return;
  try { localStorage.removeItem(CLE); } catch (e) {}
  E = etatNeuf('accueil'); dernierTic = null; afficher();
};
document.getElementById('pause').onclick = () => { tic(); E.pauseDepuis = Date.now(); sauver(); tic(); };
document.getElementById('reprendre').onclick = () => {
  if (E.pauseDepuis) { E.pauseTotale = (E.pauseTotale || 0) + (Date.now() - E.pauseDepuis); E.pauseDepuis = null; }
  dernierTic = null; sauver(); tic();
};

// ------------------------------------------------------------------ accueil
function accueil() {
  page.className = '';
  document.getElementById('position').textContent = '';
  document.getElementById('chrono').textContent = mmss(D.duree_minutes * 60);
  let h = '<div class="carte presentation"><h2>' + esc(D.titre) + '</h2><p class="meta">' + D.duree_minutes + ' min · ' + NOTEES.length + ' question' + (NOTEES.length > 1 ? 's' : '') + (D.options.pause === false ? ' · sans pause' : '') + '</p>' + rendre(D.presentation);
  h += '<div class="sections-liste">';
  D.sections.forEach(s => { const n = s.questions.filter(q => q.type !== 'lecon').length; h += '<div><span>' + esc(s.nom) + '</span><span class="meta">' + (n ? n + ' question' + (n > 1 ? 's' : '') : 'leçon') + ' · ' + s.budget_min + ' min</span></div>'; });
  h += '</div>';
  D.avertissements.forEach(a => { h += '<div class="note">' + rendre(a) + '</div>'; });
  if (!SERVEUR && ITEMS.some(q => q.type === 'code')) h += '<div class="note"><p><strong>Le notebook ne peut pas s\'exécuter :</strong> cette page est ouverte comme un fichier. Lance <code class="sans-math">python lancer.py</code> dans le dossier du projet, puis ouvre l\'examen depuis la page qui s\'affiche.</p></div>';
  h += '<p class="meta">' + esc(D.conventions) + '</p>';
  h += '<div class="barre"><button class="principal" id="demarrer">Commencer</button></div></div>';
  page.innerHTML = h;
  document.getElementById('demarrer').onclick = () => {
    E = etatNeuf('epreuve');
    E.debut = Date.now();
    ITEMS.forEach(q => {
      if (q.type === 'qcm') E.ordre[q.id] = melanger(q.options.map(o => o.id));
      if (q.cellules_initiales) E.cellules[q.id] = q.cellules_initiales.map(c => ({ code: c, sortie: '', numero: null }));
      if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => { E.ordreControles[q.id + ':' + cid] = melanger(c.options.map(o => o.id)); });
    });
    sauver(); afficher();
  };
  composer();
}

// ------------------------------------------------------------------ épreuve
function pastilles() {
  const faite = it => it.type === 'lecon' ? !!E.vus[it.id] : it.type === 'code' ? (E.code[it.id] || {}).soumissions > 0 : E.reponses[it.id] !== undefined;
  const barre = document.querySelector('#progression > span');
  if (barre) barre.style.width = (100 * ITEMS.filter(faite).length / ITEMS.length) + '%';
  let h = '<div class="cadre"><aside class="plan"><div id="pastilles">', section = null, n = 0;
  ITEMS.forEach((it, i) => {
    if (it.nomSection !== section) { section = it.nomSection; h += '<div class="groupe">' + esc(section) + '</div>'; }
    const libelle = it.type === 'lecon' ? 'Leçon' : 'Question ' + (++n);
    h += '<button class="pastille' + (faite(it) ? ' faite' : '') + (i === E.courant ? ' courante' : '') + '" data-i="' + i + '" title="' + esc(it.theme) + '"' + (D.options.retour_arriere || i === E.courant ? '' : ' disabled') + '><span class="etat"></span><span class="libelle">' + libelle + '</span></button>';
  });
  return h + '</div></aside><div class="contenu">';
}
const FIN_CADRE = '</div></div>';
function navigation() {
  let h = '<div class="barre navigation">';
  if (D.options.retour_arriere) h += '<button id="prec"' + (E.courant === 0 ? ' disabled' : '') + '>Précédente</button>';
  if (E.courant < ITEMS.length - 1) h += '<button class="principal" id="suiv">Suivante</button>';
  return h + '<button id="finir">Terminer et corriger</button></div>';
}
function brancherNavigation() {
  const aller = i => { tic(); E.courant = i; sauver(); afficher(); };
  page.querySelectorAll('.pastille').forEach(b => b.onclick = () => aller(Number(b.dataset.i)));
  const p = document.getElementById('prec'); if (p) p.onclick = () => aller(E.courant - 1);
  const s = document.getElementById('suiv'); if (s) s.onclick = () => aller(E.courant + 1);
  document.getElementById('finir').onclick = () => {
    const manquantes = NOTEES.filter(it => it.type === 'code' ? !((E.code[it.id] || {}).soumissions > 0) : E.reponses[it.id] === undefined).length;
    if (manquantes && !confirm(manquantes + ' question(s) sans réponse ou jamais soumise(s). Terminer quand même ?')) return;
    tic();
    if (E.pauseDepuis) { E.pauseTotale = (E.pauseTotale || 0) + (Date.now() - E.pauseDepuis); E.pauseDepuis = null; }
    E.phase = 'bilan'; E.fin = Date.now(); sauver(); afficher();
  };
}

function epreuve() {
  tic();
  const q = ITEMS[E.courant];
  document.getElementById('position').textContent = q.nomSection + (q.type === 'lecon' ? ' · étape ' : ' · question ') + (E.courant + 1) + ' sur ' + ITEMS.length;
  if (q.type === 'lecon') E.vus[q.id] = true;
  if (q.cellules_initiales) return epreuveCode(q);
  if (q.type === 'lecon') return epreuveLecon(q);
  page.className = '';
  const rang = NOTEES.indexOf(q) + 1;
  let h = pastilles() + '<div class="carte question"><div class="surtitre"><span class="rang">Question ' + rang + ' sur ' + NOTEES.length + '</span><span class="chip">' + esc(q.theme) + '</span><span>temps visé ' + mmss(q.temps_cible_s) + '</span></div>' + rendre(q.enonce);
  h += '<p class="consigne">' + (q.multiple ? 'Une ou plusieurs réponses : coche toutes les affirmations justes, et seulement elles (notation tout ou rien).' : 'Une seule réponse.') + '</p>';
  E.ordre[q.id].forEach((oid, k) => {
    const o = q.options.find(x => x.id === oid);
    h += '<div class="option' + (choisies(q).includes(oid) ? ' choisie' : '') + '" data-o="' + oid + '"><span class="lettre' + (q.multiple ? ' carre' : '') + '">' + 'ABCDE'[k] + '</span><div>' + rendre(o.texte) + '</div></div>';
  });

// Points de contrôle : question corrigée dès le clic, non notée.
function rendreLecon(q) {
  const brut = rendre(q.contenu).replace(/<p>\[\[controle:([\w-]+)\]\]<\/p>/g, (_, cid) => '<div class="controle" data-c="' + cid + '"></div>');
  // Une partie par titre de niveau 2 ; dans chaque partie, un bloc par rubrique (problème, énoncé, preuve, exemple...).
  const source = document.createElement('div');
  source.innerHTML = brut;
  const parties = [];
  Array.from(source.childNodes).forEach(n => {
    if (n.nodeName === 'H3' || !parties.length) parties.push({ titre: n.nodeName === 'H3' ? n.textContent : 'Introduction', noeuds: [] });
    parties[parties.length - 1].noeuds.push(n);
  });
  const genre = t => /preuve/i.test(t) ? 'preuve' : /pi[èe]ge/i.test(t) ? 'pieges' : /exemple|exp[ée]rience/i.test(t) ? 'exemple'
    : /[ée]nonc[ée]/i.test(t) ? 'enonce-bloc' : /intuition/i.test(t) ? 'intuition' : /probl[èe]me/i.test(t) ? 'probleme'
    : /cas limites/i.test(t) ? 'limites' : /d[ée]finition|notation|cadre|mod[èe]le/i.test(t) ? 'definitions' : '';
  const courante = Math.min((E.partie || {})[q.id] || 0, parties.length - 1);
  let h = '<div class="lecon-corps" data-lecon="' + q.id + '"><nav class="sommaire">';
  parties.forEach((p, k) => { h += '<button data-partie="' + k + '"' + (k === courante ? ' class="active"' : '') + '>' + (k + 1) + '. ' + esc(p.titre.replace(/^(Leçon|Partie \d+|Outil \d+|\d+\.)\s*:?\s*/i, '').slice(0, 42) || p.titre) + '</button>'; });
  h += '</nav>';
  parties.forEach((p, k) => {
    h += '<section class="partie" data-partie="' + k + '"' + (k === courante ? '' : ' hidden') + '>';
    let bloc = null;
    const fermer = () => { if (bloc) { h += bloc.genre === 'question' ? ficheDebrief(bloc.titre, bloc.noeuds) : bloc.genre === 'preuve' ? '</details>' : '</div>'; bloc = null; } };
    p.noeuds.forEach(n => {
      if (bloc && bloc.genre === 'question' && n.nodeName !== 'H4' && n.nodeName !== 'H3') { bloc.noeuds.push(n); return; }
      if (n.nodeName === 'H4' && /^Question \d+/.test(n.textContent)) {
        fermer();
        bloc = { genre: 'question', titre: n.textContent, noeuds: [] };
      } else if (n.nodeName === 'H4') {
        fermer();
        const g = genre(n.textContent);
        bloc = { genre: g };
        if (g === 'preuve') h += '<details class="bloc preuve"><summary>' + esc(n.textContent) + '<span class="meta">déplier pour la lire</span></summary>';
        else h += '<div class="bloc ' + g + '"><h4>' + esc(n.textContent) + '</h4>';
      } else if (n.nodeName === 'H3') { fermer(); h += n.outerHTML; }
      else h += n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    });
    fermer();
    h += '<div class="pied-partie"><button data-aller="' + (k - 1) + '"' + (k === 0 ? ' disabled' : '') + '>Partie précédente</button>'
      + '<span class="meta">Partie ' + (k + 1) + ' sur ' + parties.length + '</span>'
      + (k < parties.length - 1 ? '<button class="principal" data-aller="' + (k + 1) + '">Partie suivante</button>' : '<span class="meta">Fin de la leçon : passe à la suite avec « Suivante ».</span>') + '</div></section>';
  });
  return h + '</div>';
}
// Une question du débrief : en-tête (numéro, titre, verdict), énoncé, réponses côte à côte, rubriques, à retenir.
function ficheDebrief(titre, noeuds) {
  const m = titre.match(/^(Question \d+)\s*:?\s*(.*)$/);
  const gras = n => n.nodeName === 'P' && n.firstChild && n.firstChild.nodeName === 'STRONG' ? n.firstChild.textContent.trim() : '';
  const reste = n => { const c = n.cloneNode(true); c.removeChild(c.firstChild); return c.innerHTML.trim(); };
  let enonce = '', ta = null, attendue = null, verdict = '', corps = '', retenir = '', revoir = '', etat = 'enonce';
  noeuds.forEach(n => {
    const g = gras(n), html = n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    if (/^Ta réponse/.test(g)) { ta = reste(n); etat = 'corps'; }
    else if (/^Réponse attendue/.test(g)) { attendue = reste(n); etat = 'corps'; }
    else if (/^Verdict/.test(g)) { verdict = reste(n); etat = 'corps'; }
    else if (/^À retenir/.test(g)) { retenir = '<h5>À retenir</h5><p>' + reste(n) + '</p>'; etat = 'retenir'; }
    else if (/^Leçon à revoir/.test(g)) { revoir = reste(n); etat = 'fin'; }
    else if (g && n.textContent.trim() === g) { corps += '<h5>' + esc(g.replace(/[.:]\s*$/, '')) + '</h5>'; etat = 'corps'; }
    else if (etat === 'enonce') enonce += n.nodeName === 'P' && /^Type :/.test(n.textContent) ? '<p class="meta">' + n.innerHTML + '</p>' : n.nodeName === 'UL' ? '<ul class="choix">' + n.innerHTML + '</ul>' : html;
    else if (etat === 'retenir') retenir += html;
    else corps += html;
  });
  const brut = verdict.replace(/<[^>]+>/g, '').trim();
  const v = /^juste/i.test(brut) ? ['v-juste', 'Juste'] : /^fausse/i.test(brut) ? ['v-fausse', 'Fausse'] : /^incompl/i.test(brut) ? ['v-incomplete', 'Incomplète']
    : /^non visible/i.test(brut) ? ['', 'Réponse non visible'] : ['', ''];
  const suite = brut.replace(/^[^.]*\.\s*/, '');
  let h = '<article class="fiche ' + v[0] + '"><header class="fiche-tete"><span class="num">' + esc(m[1]) + '</span><span class="titre">' + esc(m[2]) + '</span>'
    + (v[1] ? '<span class="verdict">' + v[1] + '</span>' : '') + '</header><div class="fiche-corps">';
  if (ta === null && attendue === null) return h + enonce + corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '') + '</div></article>';
  h += '<h5>Énoncé</h5>' + enonce;
  h += '<div class="fiche-reponses">' + (ta === null ? '' : '<div><span class="lab">Ta réponse</span>' + ta + '</div>') + '<div><span class="lab">Réponse attendue</span>' + (attendue || '') + '</div></div>';
  if (suite) h += '<p class="meta">' + verdict.replace(/^[^.]*\.\s*/, '') + '</p>';
  h += corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '');
  return h + '</div></article>';
}
function brancherLecon(q) {

// ------------------------------------------------------------------ éditeur
// Monaco (l'éditeur de VS Code) depuis cdnjs ; les suggestions, signatures et aides viennent de jedi
// dans le noyau, qui connaît les variables déjà exécutées. Sans connexion, repli sur une zone de texte simple.
const MONACO_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min';
let MONACO = null, promesseMonaco = null;
const EDITEURS = [];
window.EDITEURS = EDITEURS;
// Monaco annule ses tâches en cours quand on ferme un éditeur ; cette annulation n'est pas une erreur.
window.addEventListener('unhandledrejection', ev => { if (ev.reason && ev.reason.name === 'Canceled') ev.preventDefault(); });
function sombre() { return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; }
function questionCode() { const q = ITEMS[E.courant]; return E.phase === 'epreuve' && q && q.cellules_initiales ? q : null; }
function chargerMonaco() {
  if (promesseMonaco) return promesseMonaco;
  promesseMonaco = new Promise(resolve => {
    const abandon = setTimeout(() => fini(null), 20000);
    function fini(m) { clearTimeout(abandon); if (window.MODE_EDITEUR === undefined) { MONACO = m; window.MODE_EDITEUR = m ? 'monaco' : 'simple'; } resolve(MONACO); }
    const s = document.createElement('script');
    s.src = MONACO_BASE + '/vs/loader.js';
    s.onerror = () => fini(null);
    s.onload = () => {
      window.MonacoEnvironment = { getWorkerUrl: () => 'data:text/javascript;charset=utf-8,' + encodeURIComponent("self.MonacoEnvironment={baseUrl:'" + MONACO_BASE + "/'};importScripts('" + MONACO_BASE + "/vs/base/worker/workerMain.js');") };
      window.require.config({ paths: { vs: MONACO_BASE + '/vs' } });
      window.require(['vs/editor/editor.main'], () => { try { configurerMonaco(window.monaco); fini(window.monaco); } catch (e) { fini(null); } }, () => fini(null));
    };
    document.head.appendChild(s);
  });
  return promesseMonaco;
}
async function aide(type, model, position) {
  const q = questionCode();
  if (!q || !SERVEUR) return null;
  try { return await api('/api/' + type, { session: SESSION, dossier: q.dossier, code: model.getValue(), ligne: position.lineNumber, colonne: position.column - 1 }); }
  catch (e) { return null; }
}
function configurerMonaco(m) {
  const K = m.languages.CompletionItemKind;
  const genres = { module: K.Module, class: K.Class, instance: K.Variable, function: K.Function, param: K.Variable, path: K.File, keyword: K.Keyword, property: K.Property, statement: K.Variable };
  m.languages.registerCompletionItemProvider('python', {
    triggerCharacters: ['.'],
    provideCompletionItems: async (model, position) => {
      const r = await aide('completer', model, position);
      if (!r || !r.completions) return { suggestions: [] };
      const mot = model.getWordUntilPosition(position);
      const plage = new m.Range(position.lineNumber, mot.startColumn, position.lineNumber, mot.endColumn);
      return { suggestions: r.completions.map((c, k) => ({ label: c.nom, kind: genres[c.type] ?? K.Variable, insertText: c.nom, detail: c.description, range: plage, sortText: String(k).padStart(4, '0') })) };
    }
  });
  m.languages.registerSignatureHelpProvider('python', {
    signatureHelpTriggerCharacters: ['(', ','],
    provideSignatureHelp: async (model, position) => {
      const r = await aide('signatures', model, position);
      if (!r || !r.signatures || !r.signatures.length) return null;
      return { value: { signatures: r.signatures.map(x => ({ label: x.texte, documentation: x.doc, parameters: x.parametres.map(p => ({ label: p })) })), activeSignature: 0, activeParameter: r.signatures[0].index ?? 0 }, dispose() {} };
    }
  });
  m.languages.registerHoverProvider('python', {
    provideHover: async (model, position) => {
      const r = await aide('aide', model, position);
      if (!r || !r.aide || !r.aide.length) return null;
      return { contents: r.aide.map(a => ({ value: '```text\n' + a.doc + '\n```' })) };
    }

}
function creerEditeur(conteneur, code, rappels) {
  if (MONACO) {
    const m = MONACO;
    const ed = m.editor.create(conteneur, {
      value: code, language: 'python', theme: sombre() ? 'vs-dark' : 'vs', fontSize: 14, tabSize: 4, insertSpaces: true,
      minimap: { enabled: false }, scrollBeyondLastLine: false, automaticLayout: true, lineNumbersMinChars: 3, folding: false,
      glyphMargin: false, renderLineHighlight: 'none', overviewRulerLanes: 0, wordBasedSuggestions: 'off', fixedOverflowWidgets: true,
      quickSuggestions: { other: true, comments: false, strings: false }, padding: { top: 6, bottom: 6 },
      scrollbar: { alwaysConsumeMouseWheel: false, vertical: 'hidden', horizontalScrollbarSize: 8 }
    });
    // Sous Windows, Monaco utilise des fins de ligne \r\n ; le code est toujours lu avec des \n, comme dans un notebook.
    const lire = () => ed.getModel().getValue(m.editor.EndOfLinePreference.LF);
    const hauteur = () => { conteneur.style.height = Math.max(38, ed.getContentHeight()) + 'px'; };
    ed.onDidContentSizeChange(hauteur); hauteur();
    ed.onDidChangeModelContent(() => rappels.modif(lire()));
    ed.onDidFocusEditorText(rappels.focus);
    ed.addCommand(m.KeyMod.Shift | m.KeyCode.Enter, rappels.executerSuivant, '!suggestWidgetVisible');
    ed.addCommand(m.KeyMod.CtrlCmd | m.KeyCode.Enter, rappels.executer, '!suggestWidgetVisible');
    return { brut: ed, getValue: lire, setValue: v => ed.setValue(v), focus: () => ed.focus(), dispose: () => ed.dispose() };
  }
  const zone = document.createElement('textarea');
  zone.spellcheck = false; zone.autocomplete = 'off'; zone.className = 'sans-math';
  zone.value = code;
  conteneur.appendChild(zone);
  zone.addEventListener('input', () => { rappels.modif(zone.value); ajuster(zone); });
  zone.addEventListener('focus', rappels.focus);
  zone.addEventListener('keydown', ev => clavier(ev, zone, rappels));
  setTimeout(() => ajuster(zone));
  return { brut: zone, getValue: () => zone.value, setValue: v => { zone.value = v; zone.dispatchEvent(new Event('input')); }, focus: () => zone.focus(), dispose: () => {} };
}
function libererEditeurs() { EDITEURS.forEach(e => e.dispose()); EDITEURS.length = 0; }

function dessinerCellules(q) {

function majNumeros(q) { document.querySelectorAll('#cellules .numero').forEach((n, i) => { const c = E.cellules[q.id][i]; n.textContent = '[' + (c && c.numero !== null ? c.numero : ' ') + ']'; }); }
function ajuster(zone) { zone.style.height = 'auto'; zone.style.height = (zone.scrollHeight + 2) + 'px'; }
function focaliser(i) { const e = EDITEURS[i]; if (e) e.focus(); }
function inserer(zone, texte) {

}
function clavier(ev, zone, rappels) {
  if (ev.key === 'Enter' && (ev.shiftKey || ev.ctrlKey)) {
    ev.preventDefault();
    if (ev.shiftKey) rappels.executerSuivant(); else rappels.executer();
    return;
  }
  const debut = zone.selectionStart, fin = zone.selectionEnd, v = zone.value;
  const debutLigne = v.lastIndexOf('\n', debut - 1) + 1;
  if (ev.key === 'Tab') {
    ev.preventDefault();
    const multi = v.slice(debut, fin).includes('\n');
    if (!ev.shiftKey && !multi) { inserer(zone, '    '); return; }
    const finBloc = fin;
    const bloc = v.slice(debutLigne, finBloc);
    const nouveau = ev.shiftKey ? bloc.replace(/^ {1,4}/gm, '') : bloc.replace(/^/gm, '    ');
    zone.setSelectionRange(debutLigne, finBloc);
    inserer(zone, nouveau);
    zone.setSelectionRange(debutLigne, debutLigne + nouveau.length);
    return;
  }
  if (ev.key === 'Enter' && !ev.altKey && !ev.metaKey) {
    ev.preventDefault();
    const ligne = v.slice(debutLigne, debut);
    let retrait = ligne.match(/^ */)[0];
    if (/:\s*(#.*)?$/.test(ligne)) retrait += '    ';
    inserer(zone, '\n' + retrait);
  }
}

async function executerCellule(q, i) {
  if (!SERVEUR) return false;
  const c = E.cellules[q.id][i];
  const div = document.querySelectorAll('#cellules .cellule')[i];
  if (div) { div.querySelector('.numero').textContent = '[*]'; div.querySelector('pre.sortie').innerHTML = ''; }
  let r;
  try { r = await api('/api/executer', { session: SESSION, dossier: q.dossier, code: c.code, nom: 'cellule ' + (i + 1) }); }
  catch (e) { r = { erreur: 'Serveur injoignable : lancer.py est-il démarré ?' }; }
  E.compteur = (E.compteur || 0) + 1;
  c.numero = E.compteur;
  let h = '';
  if (r.sortie) h += esc(r.sortie);
  if (r.valeur !== null && r.valeur !== undefined) h += (h && !h.endsWith('\n') ? '\n' : '') + esc(r.valeur);
  if (r.erreur) h += (h && !h.endsWith('\n') ? '\n' : '') + '<span class="erreur">' + esc(r.erreur) + '</span>';
  if (r.redemarre) { noyauxDemarres[q.id] = 'noyau redémarré : variables perdues'; const z = document.getElementById('versions'); if (z) z.textContent = noyauxDemarres[q.id]; }
  c.sortie = h;
  sauver();
  const d = document.querySelectorAll('#cellules .cellule')[i];
  if (d) { d.querySelector('.numero').textContent = '[' + c.numero + ']'; d.querySelector('pre.sortie').innerHTML = h; }
  return !r.erreur;
}

function codeSource(q) { return E.cellules[q.id].map((c, i) => '# %% cellule ' + (i + 1) + '\n' + c.code).join('\n\n') + '\n'; }
function afficherEtatSoumission(q) {
  const s = E.code[q.id] || {};
  const z = document.getElementById('etatSoumission');
  if (z) z.textContent = s.soumissions ? s.soumissions + ' soumission(s) · dernière : ' + s.caches_reussis + '/' + s.caches_total + ' tests cachés réussis' : 'jamais soumis';
}
async function lancerTests(q, mode) {
  const zone = document.getElementById('resultatsTests');
  zone.innerHTML = '<p class="meta">' + (mode === 'visibles' ? 'Tests visibles' : 'Tests cachés') + ' en cours...</p>';
  let r;
  try { r = await api('/api/tests', { session: SESSION, dossier: q.dossier, module: q.module_tests, mode }); }
  catch (e) { r = { erreur: 'Serveur injoignable : lancer.py est-il démarré ?' }; }
  if (r.erreur) { zone.innerHTML = '<pre class="sans-math"><span class="erreur">' + esc(r.erreur) + '</span></pre>'; return; }
  let h = '<p class="etiquette ' + (r.reussis === r.total ? 'bon' : 'faux') + '">' + (mode === 'visibles' ? 'Tests visibles : ' : 'Tests cachés : ') + r.reussis + '/' + r.total + ' réussis</p>';
  if (mode === 'visibles') {
    h += '<div class="defile"><table><tr><th>Test</th><th>Résultat</th><th>Attendu</th><th>Obtenu</th><th class="nombre">Durée</th></tr>';
    r.resultats.forEach(t => { h += '<tr><td>' + esc(t.nom) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec') + '</td><td><code class="sans-math">' + esc(t.attendu) + '</code></td><td><code class="sans-math">' + esc(t.obtenu ?? '') + '</code></td><td class="nombre">' + t.duree_s + ' s</td></tr>'; });
    h += '</table></div>';
    r.resultats.filter(t => t.erreur).forEach(t => { h += '<pre class="sans-math"><span class="erreur">' + esc(t.nom + ' :\n' + t.erreur) + '</span></pre>'; });
    E.code[q.id] = Object.assign(E.code[q.id] || {}, { visibles_reussis: r.reussis });
  } else {
    h += '<div class="defile"><table><tr><th>Test caché</th><th>Résultat</th></tr>';
    r.resultats.forEach((t, k) => { h += '<tr><td>Test ' + (k + 1) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec' + (t.erreur ? ' (exception ou temps dépassé)' : '')) + '</td></tr>'; });
    h += '</table></div>';
    const s = E.code[q.id] || {};
    E.code[q.id] = Object.assign(s, { soumissions: (s.soumissions || 0) + 1, caches_reussis: r.reussis, caches_total: r.total, details: r.resultats, code_source: codeSource(q) });
    afficherEtatSoumission(q);
    const p = page.querySelector('.pastille.courante'); if (p) p.classList.add('faite');
  }
  sauver();
  zone.innerHTML = h;
}

// ------------------------------------------------------------------ bilan
function points(q) {
  if (q.type === 'code') { const c = E.code[q.id]; return c && c.soumissions ? c.caches_reussis / c.caches_total : 0; }
  const r = E.reponses[q.id];
  if (r === undefined || r === 'nsp') return 0;
  // Une question à plusieurs réponses est notée tout ou rien : l'ensemble coché doit être exactement l'ensemble juste.
  const s = choisies(q), bonnes = q.options.filter(o => o.correcte).map(o => o.id);
  return s.length === bonnes.length && bonnes.every(b => s.includes(b)) ? 1 : -D.options.penalite;
}
function choisies(q) { const r = E.reponses[q.id]; return r === undefined || r === 'nsp' ? [] : Array.isArray(r) ? r.slice() : [r]; }
function texteOption(q, id) { const o = q.options.find(x => x.id === id); return o ? o.texte : null; }

function resultatJSON(duree) {
  return {
    examen: D.id, debut: new Date(E.debut).toISOString(), duree_s: Math.round(duree), pauses_s: Math.round((E.pauseTotale || 0) / 1000), options: D.options,
    lecons: ITEMS.filter(q => q.type === 'lecon').map(q => {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      return { id: q.id, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), controles_justes_du_premier_coup: justes, controles_total: ids.length };
    }),
    questions: NOTEES.map(q => {
      const base = { id: q.id, type: q.type, section: q.section, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), temps_cible_s: q.temps_cible_s, points: Number(points(q).toFixed(4)) };
      if (q.type === 'code') {
        const c = E.code[q.id] || {};
        return Object.assign(base, { soumissions: c.soumissions || 0, caches_reussis: c.caches_reussis || 0, caches_total: c.caches_total || q.tests_caches, visibles_reussis: c.visibles_reussis ?? null, code_source: c.code_source || codeSource(q) });
      }
      const r = E.reponses[q.id] ?? null;
      return Object.assign(base, { reponse: r, reponse_texte: r && r !== 'nsp' ? choisies(q).map(i => texteOption(q, i)).join(' ; ') : null, bonne_reponse_texte: q.options.filter(o => o.correcte).map(o => o.texte).join(' ; ') });
    })
  };
}

function bilan() {
  page.className = '';
  document.getElementById('position').textContent = 'Bilan';
  const duree = dureeEcoulee(E.fin);
  document.getElementById('chrono').textContent = mmss(duree);
  let total = 0;
  let h = '<div class="carte"><h2>Bilan</h2>@SCORE@<div class="defile"><table><tr><th>Section</th><th class="nombre">Score</th><th class="nombre">Temps passé</th><th class="nombre">Temps indicatif</th></tr>';
  D.sections.forEach(s => {
    const notees = s.questions.filter(q => q.type !== 'lecon');
    const pts = notees.reduce((a, q) => a + points(q), 0);
    const t = s.questions.reduce((a, q) => a + (E.temps[q.id] || 0), 0);
    total += pts;
    h += '<tr><td>' + esc(s.nom) + '</td><td class="nombre">' + (notees.length ? pts.toFixed(2).replace('.', ',') + ' / ' + notees.length : 'non notée') + '</td><td class="nombre">' + mmss(t) + '</td><td class="nombre">' + mmss(s.budget_min * 60) + '</td></tr>';
  });
  h += '<tr><th>Total</th><th class="nombre">' + total.toFixed(2).replace('.', ',') + ' / ' + NOTEES.length + '</th><th class="nombre">' + mmss(duree) + '</th><th class="nombre">' + mmss(D.duree_minutes * 60) + '</th></tr></table></div>';
  h = h.replace('@SCORE@', '<div class="score-total"><strong>' + total.toFixed(2).replace('.', ',').replace(/,00$/, '') + ' / ' + NOTEES.length + '</strong><span class="meta">en ' + mmss(duree) + '</span></div>');
  const barreFin = document.querySelector('#progression > span'); if (barreFin) barreFin.style.width = '100%';
  h += '<p id="enregistrement" class="meta"></p>';
  h += '<details><summary>Résultat brut (JSON)</summary><textarea readonly class="json sans-math" id="json"></textarea><div class="barre"><button id="telecharger">Enregistrer le fichier</button></div></details>';
  h += '<div class="barre">' + (SERVEUR ? '<button class="principal" id="retourAccueil">Retour à l\'accueil (séance suivante)</button>' : '')
    + '<button id="recommencer">Effacer et recommencer</button></div></div>';
  ITEMS.forEach((q, i) => {
    const temps = mmss(E.temps[q.id] || 0) + ' sur ' + mmss(q.temps_cible_s) + ' visés';
    const tete = (classe, verdict) => '<article class="fiche ' + classe + '"><header class="fiche-tete"><span class="num">' + (q.type === 'lecon' ? 'Leçon' : 'Question ' + (i + 1)) + '</span><span class="titre">' + esc(q.theme)
      + '</span><span class="temps">' + esc(q.nomSection) + ' · ' + temps + '</span>' + (verdict ? '<span class="verdict">' + verdict + '</span>' : '') + '</header><div class="fiche-corps">';
    if (q.type === 'lecon') {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      h += tete('', '') + '<p>Points de contrôle justes du premier coup : ' + justes + ' sur ' + ids.length + '. La leçon reste consultable depuis la séance.</p></div></article>';
      return;
    }
    if (q.type === 'qcm') {
      const r = E.reponses[q.id], juste = points(q) === 1;
      const s = choisies(q), incomplete = !juste && q.multiple && s.length > 0 && s.every(id => q.options.find(o => o.id === id).correcte);
      h += tete(juste ? 'v-juste' : incomplete ? 'v-incomplete' : r === undefined || r === 'nsp' ? '' : 'v-fausse',
        juste ? 'Juste' : r === undefined ? 'Sans réponse' : r === 'nsp' ? 'Je ne sais pas' : incomplete ? 'Incomplète' : 'Fausse');
      h += '<h5>Énoncé</h5>' + rendre(q.enonce) + '<h5>' + (q.multiple ? 'Options (plusieurs réponses, tout ou rien)' : 'Options') + '</h5>';
      E.ordre[q.id].forEach((oid, k) => {
        const o = q.options.find(x => x.id === oid), choisie = s.includes(oid);
        const puces = (o.correcte ? '<span class="puce bon">' + (q.multiple ? 'Juste' : 'Bonne réponse') + '</span>' : '') + (choisie ? '<span class="puce' + (o.correcte ? ' bon' : ' faux') + '">Ta réponse</span>' : '');
        h += '<div class="option ' + (o.correcte ? 'juste' : 'fausse') + (choisie ? ' choisie' : '') + '"><span class="lettre">' + 'ABCDE'[k] + '</span><div>' + puces + rendre(o.texte)
          + '<div class="explication">' + (o.correcte && !q.multiple ? '' : rendre(o.explication)) + '</div></div></div>';
      });
      h += '<h5>Correction</h5>' + rendre(q.solution);
    } else {
      const c = E.code[q.id] || {};
      const tout = c.soumissions && c.caches_reussis === c.caches_total;
      h += tete(tout ? 'v-juste' : c.soumissions ? 'v-incomplete' : '', c.soumissions ? c.caches_reussis + ' / ' + c.caches_total + ' tests cachés' : 'Jamais soumis');
      h += '<details><summary>Énoncé</summary>' + rendre(q.enonce) + '</details>';
      if (c.details) {
        h += '<h5>Tests cachés</h5><div class="defile"><table><tr><th>Test caché</th><th>Résultat</th><th>Attendu</th><th>Obtenu</th></tr>';
        c.details.forEach(t => { h += '<tr><td>' + esc(t.nom) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec') + '</td><td><code class="sans-math">' + esc(t.attendu) + '</code></td><td><code class="sans-math">' + esc(t.obtenu ?? (t.erreur ? 'exception' : '')) + '</code></td></tr>'; });
        h += '</table></div>';
        c.details.filter(t => t.erreur).forEach(t => { h += '<details><summary>Erreur : ' + esc(t.nom) + '</summary><pre class="sans-math">' + esc(t.erreur) + '</pre></details>'; });
      }
      h += '<details><summary>Ton code soumis</summary><pre class="sans-math"><code>' + esc(c.code_source || codeSource(q)) + '</code></pre></details>';
      h += '<details><summary>Correction</summary>' + rendre(q.solution) + '</details>';
    }
    h += '<p class="revoir">Vérification des nombres : <code class="sans-math">' + esc(q.verif.script) + '</code></p></div></article>';
  });
  page.innerHTML = h;
  const resultat = resultatJSON(duree);
  const zone = document.getElementById('json');
  zone.value = JSON.stringify(resultat, null, 1);
  document.getElementById('telecharger').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([zone.value], { type: 'application/json' }));
    a.download = D.id + '_resultat.json'; a.click();
  };
  const retour = document.getElementById('retourAccueil'); if (retour) retour.onclick = () => { location.href = '/'; };
  document.getElementById('recommencer').onclick = () => { if (confirm('Effacer ce passage ?')) { try { localStorage.removeItem(CLE); } catch (e) {} E = etatNeuf('accueil'); afficher(); } };
  const info = document.getElementById('enregistrement');
  if (E.enregistrement) info.textContent = E.enregistrement;
  else if (!SERVEUR) info.textContent = 'Page ouverte comme un fichier : le résultat n\'est pas enregistré automatiquement. Copie le JSON ci-dessous dans la conversation.';
  else {
    info.textContent = 'Enregistrement du résultat...';
    api('/api/resultat', resultat).then(r => {
      E.enregistrement = r.erreur ? null : 'Résultat enregistré dans ' + r.fichier + ' ; ' + r.erreurs_ajoutees + ' erreur(s) ajoutée(s) au journal suivi/erreurs.md.';
      info.textContent = E.enregistrement || 'Échec de l\'enregistrement : ' + r.erreur;
      sauver();
    }).catch(() => { info.textContent = 'Serveur injoignable : le résultat n\'est pas enregistré. Copie le JSON ci-dessous dans la conversation.'; });
  }
  composer();
}

function afficher() {
  libererEditeurs();
  document.getElementById('titre').textContent = D.titre;
  document.title = D.titre;
  if (E.phase === 'epreuve') epreuve(); else if (E.phase === 'bilan') bilan(); else accueil();
  window.scrollTo(0, 0);
}
function completerEtat() {
  ['reponses', 'temps', 'ordre', 'cellules', 'code', 'controles', 'ordreControles', 'vus', 'partie'].forEach(k => { if (!E[k] || typeof E[k] !== 'object') E[k] = {}; });
  if (typeof E.courant !== 'number' || E.courant < 0 || E.courant >= ITEMS.length) E.courant = 0;
  ITEMS.forEach(q => {
    if (q.cellules_initiales && !Array.isArray(E.cellules[q.id])) E.cellules[q.id] = q.cellules_initiales.map(c => ({ code: c, sortie: '', numero: null }));
    if (q.type === 'qcm') {
      const ids = q.options.map(o => o.id);
      const o = E.ordre[q.id];
      if (!Array.isArray(o) || o.length !== ids.length || !ids.every(i => o.includes(i))) E.ordre[q.id] = melanger(ids);
      const rep = E.reponses[q.id];
      if (rep !== undefined && rep !== 'nsp' && (Array.isArray(rep) !== !!q.multiple || !choisies(q).length || !choisies(q).every(i => ids.includes(i)))) delete E.reponses[q.id];
    }
    if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => {
      const cle = q.id + ':' + cid;
      if (!Array.isArray(E.ordreControles[cle])) E.ordreControles[cle] = melanger(c.options.map(o => o.id));
    });
  });
}
charger();
completerEtat();
if (SERVEUR && ITEMS.some(q => q.cellules_initiales)) chargerMonaco();
afficher();
</script>
