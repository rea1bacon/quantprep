<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier quant</title>
<style>
:root { --fond:#f5f6f8; --carte:#ffffff; --texte:#1f2328; --doux:#646b75; --trait:#e3e6ea; --trait-fort:#cdd2d8; --accent:#2f5bd3; --accent-doux:#eef2fc; --bon:#1f7a4d; --bon-doux:#eaf6ef; --faux:#c0392b; --faux-doux:#fcecea; --alerte:#9a5a08; --alerte-doux:#fdf3e4; --code:#f6f8fa; --ombre:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06); }
@media (prefers-color-scheme: dark) { :root { --fond:#0f1115; --carte:#171a20; --texte:#e6e8eb; --doux:#9aa1ab; --trait:#262b33; --trait-fort:#363c46; --accent:#86a8ff; --accent-doux:#1a2135; --bon:#5cc98f; --bon-doux:#13251c; --faux:#f08479; --faux-doux:#2b1716; --alerte:#e2a54f; --alerte-doux:#2a2013; --code:#12151a; --ombre:none; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--fond); color:var(--texte); font:15.5px/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
a { color:var(--accent); }

/* Barre supérieure */
header { position:sticky; top:0; z-index:10; background:var(--carte); border-bottom:1px solid var(--trait); height:56px; padding:0 20px; display:flex; gap:14px; align-items:center; }
#lienAccueil { display:flex; align-items:center; gap:8px; color:var(--texte); font-weight:650; font-size:15px; text-decoration:none; white-space:nowrap; padding-right:14px; border-right:1px solid var(--trait); }
#lienAccueil::before { content:""; width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #7b4bd6)); }
#lienAccueil[hidden] { display:none; }
header h1 { font-size:14.5px; font-weight:600; margin:0; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#position { font-size:13px; color:var(--doux); white-space:nowrap; }
#progression { position:absolute; left:0; right:0; bottom:-1px; height:2px; background:transparent; }
#progression > span { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
#chrono { font:600 15px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; font-variant-numeric:tabular-nums; background:var(--fond); border:1px solid var(--trait); border-radius:999px; padding:7px 12px; }
#chrono.depasse { color:var(--faux); border-color:var(--faux); }
@media (max-width:720px) { #position { display:none; } header { padding:0 12px; gap:8px; } }

/* Mise en page */
main { padding:28px 24px 96px; }
main > .carte, main > .fiche, main > .tableau-bord { max-width:880px; margin-left:auto; margin-right:auto; }
.cadre { display:grid; grid-template-columns:250px minmax(0, 1fr); gap:32px; max-width:1180px; margin:0 auto; align-items:start; }
main.large .cadre { max-width:none; }
.contenu { min-width:0; max-width:820px; }
main.lecture .contenu { max-width:880px; }
main.large .contenu { max-width:none; }
@media (max-width:1000px) { .cadre { grid-template-columns:1fr; gap:16px; } }

/* Plan de la séance (colonne gauche) */
.plan { scrollbar-width:thin; scrollbar-color:var(--trait-fort) transparent; position:sticky; top:84px; max-height:calc(100vh - 104px); overflow-y:auto; font-size:13.5px; }
.plan .groupe { font-size:11.5px; font-weight:650; letter-spacing:.06em; text-transform:uppercase; color:var(--doux); margin:16px 0 6px 10px; }
.plan .groupe:first-child { margin-top:0; }
#pastilles { display:flex; flex-direction:column; gap:2px; }
.pastille { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; background:none; border-radius:8px; padding:6px 10px; font-size:13.5px; color:var(--texte); }
.pastille:hover:not(:disabled) { background:color-mix(in srgb, var(--doux) 9%, transparent); }
.pastille .etat { flex:none; width:18px; height:18px; border-radius:50%; border:1.5px solid var(--trait-fort); display:grid; place-items:center; font-size:10px; color:#fff; }
.pastille.faite .etat { background:var(--accent); border-color:var(--accent); }
.pastille.faite .etat::after { content:"✓"; }
.pastille .libelle { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pastille.courante { background:var(--accent-doux); color:var(--accent); font-weight:600; }
.pastille.courante .etat { border-color:var(--accent); }
@media (max-width:1000px) { .plan { position:static; max-height:none; } #pastilles { flex-direction:row; flex-wrap:wrap; } .pastille { width:auto; } .pastille .libelle { display:none; } .plan .groupe { display:none; } }

/* Cartes */
.carte { background:var(--carte); border:1px solid var(--trait); border-radius:12px; padding:22px 26px; margin-bottom:18px; box-shadow:var(--ombre); }
h2 { font-size:21px; font-weight:650; letter-spacing:-.01em; margin:0 0 10px; }
h3 { font-size:17px; font-weight:650; margin:20px 0 6px; }
h4 { font-size:15px; font-weight:650; margin:16px 0 4px; }
.meta { color:var(--doux); font-size:13.5px; }
.surtitre { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:14px; font-size:13px; color:var(--doux); }
.surtitre .rang { font-weight:650; color:var(--texte); }
.chip { display:inline-block; max-width:420px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; font-size:12px; font-weight:550; padding:2px 10px; border-radius:999px; background:var(--accent-doux); color:var(--accent); }
.note { background:var(--alerte-doux); border-radius:10px; padding:10px 14px; color:var(--texte); font-size:14px; margin:12px 0; }
.note p { margin:4px 0; }
.consigne { font-size:13px; color:var(--doux); margin:18px 0 8px; }

/* Boutons */
button { font:inherit; font-size:14px; font-weight:550; padding:8px 14px; border-radius:8px; border:1px solid var(--trait-fort); background:var(--carte); color:var(--texte); cursor:pointer; transition:background .15s, border-color .15s; }
button:hover:not(:disabled) { background:color-mix(in srgb, var(--doux) 8%, var(--carte)); }
button.principal { background:var(--accent); border-color:var(--accent); color:#fff; }
button.principal:hover:not(:disabled) { background:color-mix(in srgb, var(--accent) 88%, #000); }
@media (prefers-color-scheme: dark) { button.principal { color:#0d1220; } }
button:disabled { opacity:.45; cursor:default; }
header button { padding:6px 12px; font-size:13px; }
.barre { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:16px; }
.navigation { border-top:1px solid var(--trait); margin-top:26px; padding-top:18px; }
.navigation #prec { margin-right:auto; }
.navigation #finir { order:1; }
.navigation #suiv { order:2; }

/* Options d'une question */
.option { display:flex; gap:14px; align-items:flex-start; border:1px solid var(--trait-fort); border-radius:10px; padding:13px 16px; margin:10px 0; cursor:pointer; background:var(--carte); transition:border-color .12s, background .12s; }
.option:hover { border-color:var(--accent); }
.option .lettre { flex:none; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--trait-fort); display:grid; place-items:center; font-size:12.5px; font-weight:650; color:var(--doux); margin-top:-1px; }
.option .lettre.carre { border-radius:6px; }
.option p { margin:0; }
.option.choisie { border-color:var(--accent); background:var(--accent-doux); }
.option.choisie .lettre { background:var(--accent); border-color:var(--accent); color:#fff; }
.option.juste { border-color:var(--bon); }
.option.fausse { border-color:var(--trait); }
.explication { font-size:14px; color:var(--doux); margin-top:6px; }
.etiquette { font-size:13px; font-weight:600; }
.bon { color:var(--bon); } .faux { color:var(--faux); }

/* Code, tableaux */
pre { background:var(--code); border:1px solid var(--trait); border-radius:8px; padding:12px 14px; overflow-x:auto; font:13px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; }
code { font:13px ui-monospace, "Cascadia Mono", Consolas, monospace; background:var(--code); border:1px solid var(--trait); padding:0 4px; border-radius:4px; }
pre code { background:none; border:0; padding:0; }
.defile { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:14px; margin:10px 0; }
th { font-size:12px; font-weight:650; letter-spacing:.04em; text-transform:uppercase; color:var(--doux); }
th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--trait); vertical-align:top; }
td.nombre, th.nombre { text-align:right; font-variant-numeric:tabular-nums; }
textarea.json { width:100%; min-height:140px; font:12.5px ui-monospace, Consolas, monospace; background:var(--code); color:var(--texte); border:1px solid var(--trait); border-radius:8px; padding:8px; }
details { margin-top:10px; } summary { cursor:pointer; color:var(--accent); font-weight:550; }

/* Question de code : énoncé à gauche, notebook à droite */
.deux { display:grid; grid-template-columns:minmax(300px, 38%) 1fr; gap:18px; align-items:start; }
.deux > .carte { margin:0; }
.deux .enonce { position:sticky; top:76px; max-height:calc(100vh - 96px); overflow-y:auto; }
@media (max-width:1100px) { .deux { grid-template-columns:1fr; } .deux .enonce { position:static; max-height:none; } }
.notebook-barre { display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--trait); padding-bottom:12px; margin-bottom:12px; }
.notebook-barre button { font-size:13px; padding:6px 11px; }
.notebook-barre #versions { margin-left:auto; }
.notebook-barre .meta { font-size:12.5px; }
.cellule { display:grid; grid-template-columns:48px 1fr; gap:6px; margin:12px 0; }
.cellule .numero { font:12px ui-monospace, Consolas, monospace; color:var(--doux); text-align:right; padding-top:9px; }
.cellule .editeur { border:1px solid var(--trait); border-radius:8px; overflow:hidden; background:var(--code); }
.cellule.active .editeur { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-doux); }
.cellule .editeur textarea { border:none; border-radius:0; }
.cellule textarea { width:100%; resize:none; overflow:hidden; min-height:44px; font:13.5px/1.5 ui-monospace, Consolas, monospace; tab-size:4; background:var(--code); color:var(--texte); border:1px solid var(--trait); border-radius:8px; padding:8px 10px; white-space:pre; overflow-x:auto; }
.cellule .actions { display:flex; gap:6px; margin-top:4px; }
.cellule .actions button { font-size:12px; padding:2px 8px; font-weight:500; }
.cellule pre.sortie { margin:4px 0 0; max-height:420px; overflow:auto; }
.cellule pre.sortie:empty { display:none; }
pre .erreur { color:var(--faux); }
.resultats-tests { margin-top:12px; }
#voile { position:fixed; inset:0; z-index:20; background:color-mix(in srgb, var(--fond) 92%, transparent); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:16px; }
#voile[hidden] { display:none; }
#voile .carte { max-width:480px; text-align:center; }
#voile .barre { justify-content:center; }
.deux.lecon { grid-template-columns:minmax(320px, 56%) 1fr; }
.deux.lecon .enonce { max-height:calc(100vh - 96px); }
pre.sortie-lecon { margin-top:-6px; border-style:dashed; color:var(--doux); }

/* Leçons : colonne de lecture, une partie à la fois, onglets */
main.lecture .carte.enonce { padding:26px 40px 30px; }
.lecon-corps { font-size:16px; line-height:1.72; max-width:74ch; margin:0 auto; }
.lecon-corps p { margin:0.75em 0; }
.lecon-corps li { margin:0.4em 0; padding-left:2px; }
.lecon-corps ol, .lecon-corps ul { padding-left:1.4em; }
.lecon-corps ol > li::marker { font-weight:650; color:var(--doux); }
.lecon-corps h3 { font-size:23px; font-weight:700; letter-spacing:-.015em; line-height:1.3; margin:8px 0 16px; }
.lecon-corps table { font-size:14.5px; line-height:1.55; }
.lecon-corps mjx-container { font-size:102% !important; }
.lecon-corps mjx-container[display="true"], .lecon-corps p.formule > mjx-container { display:block; text-align:center; margin:0.7em 0; overflow-x:auto; overflow-y:hidden; }
.sommaire { display:flex; flex-wrap:wrap; gap:0 2px; margin:0 0 24px; border-bottom:1px solid var(--trait); }
.sommaire button { flex:none; font-size:13px; font-weight:550; padding:10px 12px; border:0; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--doux); margin-bottom:-1px; }
.sommaire button:hover:not(:disabled) { background:none; color:var(--texte); }
.sommaire button.active { color:var(--accent); border-bottom-color:var(--accent); }
.partie[hidden] { display:none; }
.pied-partie { display:flex; gap:10px; align-items:center; justify-content:space-between; margin:28px 0 4px; padding-top:18px; border-top:1px solid var(--trait); }
.pied-partie .meta { flex:1; text-align:center; }
.bloc { --teinte:var(--doux); border:1px solid var(--trait); border-radius:10px; padding:6px 20px 10px; margin:18px 0; background:var(--carte); }
.bloc > h4, .bloc > summary { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--teinte); margin:10px 0 2px; }
.bloc.enonce-bloc { --teinte:var(--accent); background:var(--accent-doux); border-color:transparent; }
.bloc.exemple { --teinte:var(--bon); } .bloc.pieges { --teinte:var(--faux); } .bloc.limites { --teinte:var(--alerte); }
.bloc.preuve { background:var(--fond); }
details.bloc > summary { cursor:pointer; list-style:revert; padding:6px 0; }
details.bloc > summary .meta { text-transform:none; letter-spacing:0; font-weight:400; margin-left:6px; }
details.bloc[open] > summary { margin-bottom:6px; }
.controle { border:1px solid var(--trait-fort); border-radius:12px; padding:14px 18px; margin:22px 0; background:var(--fond); }
.controle .titre-controle { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--accent); margin:0 0 6px; }
.controle .option { background:var(--carte); }

/* Fiche de question : débrief et bilan */
.fiche { background:var(--carte); border:1px solid var(--trait); border-radius:12px; margin:0 0 20px; overflow:hidden; font-size:15px; line-height:1.65; box-shadow:var(--ombre); }
.lecon-corps .fiche { margin:24px 0; }
.fiche-tete { display:flex; align-items:center; flex-wrap:wrap; gap:6px 14px; padding:14px 22px; border-bottom:1px solid var(--trait); }
.fiche-tete .num { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--doux); white-space:nowrap; }
.fiche-tete .titre { flex:1; min-width:200px; font-weight:650; font-size:16px; }
.fiche-tete .temps { font-size:12.5px; color:var(--doux); white-space:nowrap; }
.verdict { font-size:12px; font-weight:650; padding:3px 10px; border-radius:999px; white-space:nowrap; color:var(--doux); background:var(--fond); }
.v-juste .verdict { color:var(--bon); background:var(--bon-doux); } .v-fausse .verdict { color:var(--faux); background:var(--faux-doux); } .v-incomplete .verdict { color:var(--alerte); background:var(--alerte-doux); }
.fiche-corps { padding:4px 22px 20px; }
.fiche h5 { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--doux); margin:22px 0 8px; }
.fiche-corps > h5:first-child { margin-top:16px; }
.fiche p { margin:0.6em 0; }
.fiche li { margin:0.35em 0; }
.fiche-reponses { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin:18px 0 6px; }
.fiche-reponses > div { background:var(--fond); border-radius:10px; padding:10px 14px; }
.fiche-reponses .lab { display:block; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--doux); margin-bottom:2px; }
.fiche ul.choix { list-style:none; padding:0; margin:8px 0; }
.fiche ul.choix > li { border:1px solid var(--trait); border-radius:10px; padding:9px 14px; margin:8px 0; }
.fiche ul.choix > li > strong:first-child { display:inline-block; min-width:1.8em; color:var(--doux); }
.fiche .retenir { border-radius:10px; padding:12px 16px; margin-top:20px; background:var(--accent-doux); }
.fiche .retenir h5 { margin:0 0 2px; color:var(--accent); }
.fiche .retenir p { margin:0.3em 0 0; }
.fiche .revoir { font-size:13.5px; color:var(--doux); margin:14px 0 0; }
.fiche .option { cursor:default; }
.fiche .option:hover { border-color:var(--trait); }
.fiche .option p { margin:0; }
.fiche .option .explication p { margin:3px 0 0; }
.fiche .option.juste { border-color:color-mix(in srgb, var(--bon) 45%, var(--trait)); background:var(--bon-doux); }
.fiche .option.choisie:not(.juste) { border-color:color-mix(in srgb, var(--faux) 45%, var(--trait)); background:var(--faux-doux); }
.fiche .option.choisie .lettre { background:none; color:var(--doux); border-color:var(--trait-fort); }
.fiche .option > div { flex:1; }
.puce { float:right; font-size:11px; font-weight:650; padding:2px 9px; border-radius:999px; margin-left:8px; white-space:nowrap; color:var(--doux); background:var(--fond); }
.puce.bon { color:var(--bon); background:var(--carte); } .puce.faux { color:var(--faux); background:var(--carte); }
.fiche details { margin-top:16px; border-top:1px solid var(--trait); padding-top:12px; }
.fiche details > summary { cursor:pointer; font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--doux); }

/* Présentation d'une séance et bilan */
.presentation h2 { font-size:26px; letter-spacing:-.02em; }
.sections-liste { display:grid; gap:8px; margin:18px 0; }
.sections-liste > div { display:flex; justify-content:space-between; gap:12px; background:var(--fond); border-radius:10px; padding:10px 14px; font-size:14px; }
.score-total { display:flex; align-items:baseline; gap:10px; margin:4px 0 14px; }
.score-total strong { font-size:34px; font-weight:700; letter-spacing:-.02em; }
</style>

<script type="application/json" id="donnees">{"id": "seance-mm-5", "titre": "Market making 5 : nettoyer un export de transactions", "duree_minutes": 50, "options": {"pause": true, "je_ne_sais_pas": true, "retour_arriere": true, "penalite": 0}, "conventions": "Conventions de notation : une majuscule désigne une variable aléatoire, une minuscule une valeur ou un paramètre fixe, le gras un vecteur ou une matrice. \\(\\mathbb{P}\\) désigne une probabilité, \\(\\mathbb{E}\\) une espérance, \\(\\mathrm{Var}\\) une variance.", "presentation": "Une leçon de 15 minutes sur la décision de réparer ou de retirer une donnée, et deux exercices de code évalués sur un fichier sale réel du dossier de la question.\n\nRègle d'abandon : au-delà du double du temps cible d'un exercice, soumettre ce qui existe et passer au suivant.", "avertissements": ["Le notebook s'exécute sous Python 3.9, pandas 1.4.2 et numpy 1.21.6. Le paquet `amplify_quant_trading` fourni dans le dossier est une imitation écrite pour l'entraînement : ce n'est pas le code d'un éditeur.", "Le fichier est synthétique : ses défauts ont été ajoutés à une série propre, ce qui rend le bon résultat vérifiable."], "sections": [{"id": "lecon", "nom": "Leçon", "budget_min": 15, "questions": [{"id": "L-MM-5", "type": "lecon", "section": "lecon", "theme": "Leçon : réparer ou retirer une donnée sale", "difficulte": 2, "temps_cible_s": 900, "contenu": "## Leçon : réparer ou retirer\n\nDurée visée : 15 minutes.\n\n### 1. Le problème\n\n#### Le problème\n\nUn fichier exporté d'un système contient des défauts de forme et des données fausses. Les deux ne se traitent pas de la même façon, et une erreur d'analyse ne provoque pas forcément d'erreur Python : elle produit un nombre faux qui a l'air correct.\n\n#### Intuition\n\nUne question décide de tout : **la valeur vraie est-elle encore lisible ?** Oui pour `1,446.57` précédé du symbole dollar, écrit autrement mais sans perte : on répare. Non pour une cellule vide ou un volume de -120 : on ne peut pas deviner, on retire la ligne.\n\n### 2. Le fichier\n\n#### Exemple\n\n`data_cache/messy_trading_data.csv` contient 187 lignes pour trois titres. Ses défauts :\n\n- noms de colonnes avec espaces (` Timestamp`, `Ticker `) ;\n- symboles en casse variable, avec espaces (`aapl`, ` GOOG `) ;\n- prix écrits simplement, avec le symbole dollar, ou avec un séparateur de milliers ;\n- prix absents, en cellule vide ou sous la forme `N/A` ;\n- volumes écrits simplement, avec un séparateur de milliers, ou absents ;\n- volumes négatifs ;\n- lignes exactement dupliquées.\n\nLe décompte de ce qui est retiré, dans l'ordre :\n\n| Étape | Lignes concernées |\n|---|---|\n| Prix absent | 24 |\n| Volume absent | 12 |\n| Volume nul ou négatif | 4 |\n| Il reste après ces filtres (une ligne peut cumuler les défauts) | 147 |\n| Doublons exacts retirés | 3 |\n| Lignes finales | 144 |\n\n#### L'ordre importe\n\n1. Normaliser les noms de colonnes avant de les utiliser.\n2. Normaliser le symbole et les nombres **avant** de chercher les doublons : deux lignes de même contenu peuvent différer par leur écriture.\n3. Convertir l'horodatage, trier par titre puis par temps : les rendements en dépendent.\n\n#### Pièges\n\n- `pd.to_numeric(..., errors=\"coerce\")` transforme tout ce qu'il ne lit pas en `NaN`, sans message : il faut retirer les symboles **avant**, sinon tous les prix en milliers disparaissent.\n- Lire un prix jusqu'à la première virgule donne une valeur fausse pour les prix en milliers : pour GOOG, toutes les valeurs deviendraient 1, et la volatilité mesurée \\(0{,}0\\).\n- `pct_change` sur tout le cadre calcule un rendement entre deux titres différents à chaque changement de symbole : le calcul doit se faire à l'intérieur de chaque titre.\n- Une ligne retirée laisse un trou dans la grille de 5 minutes : sur les 180 lignes de la grille d'origine, 144 restent, et certains rendements portent donc sur 10 minutes ou plus. L'écart-type calculé n'est pas celui d'un pas constant.\n\n[[controle:quoi]]\n\n### 3. Le contrôle de bout en bout\n\n#### Intuition\n\nUn nombre calculé sur toutes les lignes, ici la volatilité par titre, attrape les erreurs d'analyse qu'un contrôle de type ne voit pas. Valeurs attendues de l'écart-type du rendement par ligne : \\(0{,}015469\\) pour AAPL, \\(0{,}017329\\) pour GOOG, \\(0{,}019836\\) pour MSFT.\n\n#### Réflexes en 30 secondes\n\n- Valeur vraie encore lisible : réparer. Sinon : retirer.\n- Normaliser avant de dédupliquer.\n- Trier avant tout calcul de rendement.\n- Tout groupe calculé reste à l'intérieur de son groupe.\n\n#### À savoir refaire\n\n- La chaîne complète, de `read_csv` au tri final, en vingt lignes.\n- Le décompte des lignes retirées, étape par étape.\n\n[[controle:ordre]]\n", "controles": {"quoi": {"question": "Une ligne a pour volume -250. Que faire ?", "options": [{"id": "a", "texte": "Retirer la ligne", "correcte": true, "explication": "Oui : rien ne dit que la vraie valeur était 250 ; la donnée est fausse, pas mal écrite."}, {"id": "b", "texte": "Prendre la valeur absolue", "correcte": false, "explication": "Cette réparation invente une valeur : elle suppose une erreur de signe que rien dans le fichier n'établit."}, {"id": "c", "texte": "Propager le volume précédent", "correcte": false, "explication": "Un volume n'est pas un niveau qui persiste : la propagation convient à un prix de relevé, pas à une transaction."}, {"id": "d", "texte": "Remplacer par zéro", "correcte": false, "explication": "Une ligne de volume nul reste une ligne sans transaction : on crée un enregistrement faux au lieu de le retirer."}]}, "ordre": {"question": "Pourquoi dédupliquer après avoir normalisé le symbole ?", "options": [{"id": "a", "texte": "Deux lignes égales peuvent s'écrire différemment", "correcte": true, "explication": "Oui : `aapl` et `AAPL` ne sont des doublons qu'une fois normalisés."}, {"id": "b", "texte": "drop_duplicates exige des majuscules", "correcte": false, "explication": "La méthode compare des valeurs quelconques : le problème vient du contenu du fichier, pas de la méthode."}, {"id": "c", "texte": "Pour gagner du temps de calcul", "correcte": false, "explication": "L'ordre change le résultat, pas seulement la durée : retirer trop tard ou trop tôt ne garde pas les mêmes lignes."}, {"id": "d", "texte": "L'ordre n'a aucune importance", "correcte": false, "explication": "Avant normalisation, deux lignes de même transaction écrites autrement resteraient toutes deux dans le résultat."}]}}, "verif": {"script": "verif/seance_mm_5.py"}}]}, {"id": "code", "nom": "Exercices de code", "budget_min": 35, "questions": [{"id": "MM5-E1", "type": "code", "section": "code", "theme": "Nettoyer un export de transactions", "difficulte": 4, "temps_cible_s": 1320, "enonce": "## Exercice 1 : charger et nettoyer\n\nÉcris `load_and_clean(path)`, où `path` est un chemin de fichier CSV ayant la forme décrite dans la leçon. Il rend un DataFrame de colonnes exactement `timestamp`, `ticker`, `price`, `volume`, dans cet ordre.\n\n1. Noms de colonnes : espaces retirés, minuscules.\n2. `ticker` : espaces de début et de fin retirés, majuscules.\n3. `price` et `volume` : flottants, en retirant le symbole dollar et les virgules de milliers. Une cellule vide ou `N/A` donne une valeur manquante.\n4. `timestamp` : type date.\n5. Retirer les lignes de prix manquant, de volume manquant, ou de volume inférieur ou égal à 0.\n6. Retirer les lignes exactement dupliquées, après ces conversions.\n7. Trier par `ticker` puis `timestamp`, et réindexer de 0 à \\(n-1\\).\n\nLe fichier de travail est `data_cache/messy_trading_data.csv`, relatif au dossier du notebook.\n\n**Ce que vérifient les tests.** Le nombre de lignes, les symboles, l'absence de volume invalide et de doublon, les types.\n\n\n**Fonctionnement.** **Tests visibles** exécute 2 test(s). **Soumettre** exécute les 5 tests de la question, visibles compris, et la note est la proportion de tests réussis. Le message d'un test échoué dit ce qui était attendu. Les classes et fonctions jugées sont celles des cellules exécutées en dernier.\n", "dossier": "coding/millennium", "module_tests": "coding/millennium/tests_mm5_e1.py", "cellules_initiales": ["import sys\nsys.path.insert(0, \".\")   # rend importable le paquet fourni, dans le dossier de la question\nimport numpy as np\nimport pandas as pd", "pd.read_csv(\"data_cache/messy_trading_data.csv\").head(12)", "def load_and_clean(path):\n    pass  # À compléter", "load_and_clean(\"data_cache/messy_trading_data.csv\")"], "tests_visibles": 2, "tests_caches": 5, "fichier_correction": "coding/millennium/corrections/mm_5.py", "intro_correction": "Correction commentée des deux exercices", "verif": {"script": "coding/millennium/tests_mm5_e1.py"}, "fiche": null, "solution": "Correction commentée des deux exercices (`coding/millennium/corrections/mm_5.py`) :\n\n```python\n\"\"\"Correction de la séance MM 5 : nettoyer un export de transactions.\"\"\"\nimport pandas as pd\n\n\ndef _nombre(colonne):\n    \"\"\"Retire tout ce qui n'est ni chiffre, ni point, ni signe moins, puis convertit ; le reste devient NaN.\"\"\"\n    return pd.to_numeric(colonne.astype(str).str.replace(r\"[^0-9.-]\", \"\", regex=True), errors=\"coerce\")\n\n\ndef load_and_clean(path):\n    df = pd.read_csv(path)\n    df.columns = [c.strip().lower() for c in df.columns]\n    df[\"ticker\"] = df[\"ticker\"].astype(str).str.strip().str.upper()\n    df[\"price\"] = _nombre(df[\"price\"])     # une cellule vide ou N/A devient une chaîne vide après filtrage, puis NaN\n    df[\"volume\"] = _nombre(df[\"volume\"])\n    df[\"timestamp\"] = pd.to_datetime(df[\"timestamp\"])\n    df = df.dropna(subset=[\"price\", \"volume\"])\n    df = df[df[\"volume\"] > 0]              # un volume négatif est une donnée fausse : on la retire, on ne la répare pas\n    df = df.drop_duplicates()              # après normalisation : deux lignes égales ne diffèrent plus par leur écriture\n    return df.sort_values([\"ticker\", \"timestamp\"]).reset_index(drop=True)\n\n\ndef realized_vol_by_ticker(df):\n    trie = df.sort_values([\"ticker\", \"timestamp\"])\n    rendements = trie.groupby(\"ticker\")[\"price\"].pct_change()   # le calcul reste à l'intérieur de chaque titre\n    return rendements.groupby(trie[\"ticker\"]).std().sort_index()\n```"}, {"id": "MM5-E2", "type": "code", "section": "code", "theme": "Volatilité par titre, calculée à l'intérieur de chaque groupe", "difficulte": 2, "temps_cible_s": 780, "enonce": "## Exercice 2 : la volatilité par titre\n\nÉcris `realized_vol_by_ticker(df)`, où `df` a la forme rendue par `load_and_clean`, sans hypothèse sur l'ordre des lignes. Il rend une `Series` indexée par le symbole, triée par symbole : pour chaque titre, l'écart-type (`ddof=1`, le défaut de pandas) des variations relatives de `price` d'une ligne à la suivante, les lignes étant dans l'ordre du temps à l'intérieur de chaque titre.\n\n**Ce que vérifie le test.** Les trois valeurs de la leçon, à 0,001 près : ce test valide aussi l'analyse des prix de l'exercice 1.\n\n\n**Fonctionnement.** **Tests visibles** exécute 1 test(s). **Soumettre** exécute les 1 tests de la question, visibles compris, et la note est la proportion de tests réussis. Le message d'un test échoué dit ce qui était attendu. Les classes et fonctions jugées sont celles des cellules exécutées en dernier.\n", "dossier": "coding/millennium", "module_tests": "coding/millennium/tests_mm5_e2.py", "cellules_initiales": ["import sys\nsys.path.insert(0, \".\")   # rend importable le paquet fourni, dans le dossier de la question\nimport numpy as np\nimport pandas as pd", "def realized_vol_by_ticker(df):\n    pass  # À compléter", "realized_vol_by_ticker(load_and_clean(\"data_cache/messy_trading_data.csv\"))"], "tests_visibles": 1, "tests_caches": 1, "fichier_correction": "coding/millennium/corrections/mm_5.py", "intro_correction": "Correction commentée des deux exercices", "verif": {"script": "coding/millennium/tests_mm5_e2.py"}, "fiche": null, "solution": "Correction commentée des deux exercices (`coding/millennium/corrections/mm_5.py`) :\n\n```python\n\"\"\"Correction de la séance MM 5 : nettoyer un export de transactions.\"\"\"\nimport pandas as pd\n\n\ndef _nombre(colonne):\n    \"\"\"Retire tout ce qui n'est ni chiffre, ni point, ni signe moins, puis convertit ; le reste devient NaN.\"\"\"\n    return pd.to_numeric(colonne.astype(str).str.replace(r\"[^0-9.-]\", \"\", regex=True), errors=\"coerce\")\n\n\ndef load_and_clean(path):\n    df = pd.read_csv(path)\n    df.columns = [c.strip().lower() for c in df.columns]\n    df[\"ticker\"] = df[\"ticker\"].astype(str).str.strip().str.upper()\n    df[\"price\"] = _nombre(df[\"price\"])     # une cellule vide ou N/A devient une chaîne vide après filtrage, puis NaN\n    df[\"volume\"] = _nombre(df[\"volume\"])\n    df[\"timestamp\"] = pd.to_datetime(df[\"timestamp\"])\n    df = df.dropna(subset=[\"price\", \"volume\"])\n    df = df[df[\"volume\"] > 0]              # un volume négatif est une donnée fausse : on la retire, on ne la répare pas\n    df = df.drop_duplicates()              # après normalisation : deux lignes égales ne diffèrent plus par leur écriture\n    return df.sort_values([\"ticker\", \"timestamp\"]).reset_index(drop=True)\n\n\ndef realized_vol_by_ticker(df):\n    trie = df.sort_values([\"ticker\", \"timestamp\"])\n    rendements = trie.groupby(\"ticker\")[\"price\"].pct_change()   # le calcul reste à l'intérieur de chaque titre\n    return rendements.groupby(trie[\"ticker\"]).std().sort_index()\n```"}]}]}</script>
<script>
'use strict';
const D = JSON.parse(document.getElementById('donnees').textContent);
const ITEMS = D.sections.flatMap(s => s.questions.map(q => Object.assign({ nomSection: s.nom }, q)));
const CLE = 'atelier-quant:' + D.id;
const SERVEUR = location.protocol.startsWith('http');
// La session survit à un rechargement de l'onglet : on se reconnecte alors au même noyau, variables comprises.
const SESSION = (() => { const neuve = Math.random().toString(36).slice(2) + Date.now().toString(36); try { const s = sessionStorage.getItem('atelier-quant:session') || neuve; sessionStorage.setItem('atelier-quant:session', s); return s; } catch (e) { return neuve; } })();
const page = document.getElementById('page');
const noyauxDemarres = {};
let E = etatNeuf('accueil');

function etatNeuf(phase) { return { phase, courant: 0, debut: null, fin: null, reponses: {}, temps: {}, ordre: {}, cellules: {}, code: {}, controles: {}, ordreControles: {}, vus: {}, partie: {}, enregistrement: null, pauseDepuis: null, pauseTotale: 0 }; }
// Options par défaut : la pause et « Je ne sais pas » sont permis, sauf si l'examen les interdit (examens blancs).
const PAUSE_PERMISE = D.options.pause !== false;
const NSP_PERMIS = D.options.je_ne_sais_pas !== false;
function dureeEcoulee(fin) { return (fin - E.debut - (E.pauseTotale || 0) - (E.pauseDepuis ? fin - E.pauseDepuis : 0)) / 1000; }
const NOTEES = ITEMS.filter(q => q.type !== 'lecon');
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(E)); } catch (e) {} }
function charger() { try { const s = localStorage.getItem(CLE); if (s) E = Object.assign(etatNeuf('accueil'), JSON.parse(s)); } catch (e) {} }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function enLigne(t) { return esc(t).replace(/`([^`]+)`/g, '<code class="sans-math">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

// Markdown réduit : titres #, tableaux |, listes - et 1., paragraphes, `code`, **gras**, blocs entre triples accents graves.
function rendre(t) {
  let h = '';
  String(t).split('```').forEach((bloc, i) => {
    if (i % 2) {
      const info = (bloc.match(/^(\w*)\n/) || [])[1];
      h += '<pre class="sans-math' + (info === 'sortie' ? ' sortie-lecon' : '') + '"><code>' + esc(bloc.replace(/^\w*\n/, '')) + '</code></pre>';
      return;
    }
    const lignes = bloc.split('\n');
    let k = 0;
    while (k < lignes.length) {
      const l = lignes[k];
      if (!l.trim()) { k++; continue; }
      const titre = l.match(/^(#{1,4})\s+(.*)$/);
      if (titre) { const n = Math.min(4, titre[1].length + 1); h += '<h' + n + '>' + enLigne(titre[2]) + '</h' + n + '>'; k++; continue; }
      if (l.trim().startsWith('|')) {
        const rangs = [];
        while (k < lignes.length && lignes[k].trim().startsWith('|')) { rangs.push(lignes[k].trim()); k++; }
        const cellules = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
        h += '<div class="defile"><table><tr>' + cellules(rangs[0]).map(c => '<th>' + enLigne(c) + '</th>').join('') + '</tr>';
        rangs.slice(1).filter(r => !/^\|[\s|:-]+\|$/.test(r)).forEach(r => { h += '<tr>' + cellules(r).map(c => '<td>' + enLigne(c) + '</td>').join('') + '</tr>'; });
        h += '</table></div>'; continue;
      }
      const puce = /^\s*[-*]\s+/, numero = /^\s*\d+\.\s+/;
      if (puce.test(l) || numero.test(l)) {
        const motif = puce.test(l) ? puce : numero, balise = motif === puce ? 'ul' : 'ol';
        h += '<' + balise + '>';
        while (k < lignes.length && motif.test(lignes[k])) { h += '<li>' + enLigne(lignes[k].replace(motif, '')) + '</li>'; k++; }
        h += '</' + balise + '>'; continue;
      }
      const par = [];
      while (k < lignes.length && lignes[k].trim() && !/^(#{1,4}\s|\s*\||\s*[-*]\s|\s*\d+\.\s)/.test(lignes[k])) { par.push(lignes[k]); k++; }
      const texte = par.join('\n').trim();
      // Un paragraphe réduit à une seule formule est centré ; une formule au milieu d'une phrase reste dans la ligne.
      const seule = texte.startsWith('\\(') && texte.endsWith('\\)') && texte.indexOf('\\(', 2) < 0;
      h += (seule ? '<p class="formule">' : '<p>') + enLigne(par.join('\n')) + '</p>';
    }
  });
  return h;
}
function composer(el) { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el || page]).catch(() => {}); }
function mmss(s) { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function melanger(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function api(chemin, corps) {
  const r = await fetch(chemin, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
  return r.json();
}

let dernierTic = null;
function tic() {
  const ch = document.getElementById('chrono');
  const bouton = document.getElementById('pause');
  bouton.hidden = !(PAUSE_PERMISE && E.phase === 'epreuve');
  document.getElementById('recommencerHaut').hidden = E.phase !== 'epreuve';
  document.getElementById('voile').hidden = !(E.phase === 'epreuve' && E.pauseDepuis);
  if (E.phase !== 'epreuve' || E.pauseDepuis) { dernierTic = null; return; }
  const maintenant = Date.now();
  if (dernierTic !== null) { const q = ITEMS[E.courant]; E.temps[q.id] = (E.temps[q.id] || 0) + (maintenant - dernierTic) / 1000; }
  dernierTic = maintenant;
  const reste = D.duree_minutes * 60 - dureeEcoulee(maintenant);
  ch.textContent = (reste < 0 ? '+' : '') + mmss(Math.abs(reste));
  ch.classList.toggle('depasse', reste < 0);
}
setInterval(() => { tic(); if (E.phase === 'epreuve') sauver(); }, 500);
if (SERVEUR) document.getElementById('lienAccueil').hidden = false;
document.getElementById('lienAccueil').onclick = () => {
  if (E.phase === 'epreuve' && PAUSE_PERMISE && !E.pauseDepuis) { tic(); E.pauseDepuis = Date.now(); sauver(); }
};
document.getElementById('recommencerHaut').onclick = () => {
  if (!confirm('Effacer ce passage (réponses, code, chronomètre) et revenir au début de la séance ?')) return;
  try { localStorage.removeItem(CLE); } catch (e) {}
  E = etatNeuf('accueil'); dernierTic = null; afficher();
};
document.getElementById('pause').onclick = () => { tic(); E.pauseDepuis = Date.now(); sauver(); tic(); };
document.getElementById('reprendre').onclick = () => {
  if (E.pauseDepuis) { E.pauseTotale = (E.pauseTotale || 0) + (Date.now() - E.pauseDepuis); E.pauseDepuis = null; }
  dernierTic = null; sauver(); tic();
};

// ------------------------------------------------------------------ accueil
function accueil() {
  page.className = '';
  document.getElementById('position').textContent = '';
  document.getElementById('chrono').textContent = mmss(D.duree_minutes * 60);
  let h = '<div class="carte presentation"><h2>' + esc(D.titre) + '</h2><p class="meta">' + D.duree_minutes + ' min · ' + NOTEES.length + ' question' + (NOTEES.length > 1 ? 's' : '') + (D.options.pause === false ? ' · sans pause' : '') + '</p>' + rendre(D.presentation);
  h += '<div class="sections-liste">';
  D.sections.forEach(s => { const n = s.questions.filter(q => q.type !== 'lecon').length; h += '<div><span>' + esc(s.nom) + '</span><span class="meta">' + (n ? n + ' question' + (n > 1 ? 's' : '') : 'leçon') + ' · ' + s.budget_min + ' min</span></div>'; });
  h += '</div>';
  D.avertissements.forEach(a => { h += '<div class="note">' + rendre(a) + '</div>'; });
  if (!SERVEUR && ITEMS.some(q => q.type === 'code')) h += '<div class="note"><p><strong>Le notebook ne peut pas s\'exécuter :</strong> cette page est ouverte comme un fichier. Lance <code class="sans-math">python lancer.py</code> dans le dossier du projet, puis ouvre l\'examen depuis la page qui s\'affiche.</p></div>';
  h += '<p class="meta">' + esc(D.conventions) + '</p>';
  h += '<div class="barre"><button class="principal" id="demarrer">Commencer</button></div></div>';
  page.innerHTML = h;
  document.getElementById('demarrer').onclick = () => {
    E = etatNeuf('epreuve');
    E.debut = Date.now();
    ITEMS.forEach(q => {
      if (q.type === 'qcm') E.ordre[q.id] = melanger(q.options.map(o => o.id));
      if (q.cellules_initiales) E.cellules[q.id] = q.cellules_initiales.map(c => ({ code: c, sortie: '', numero: null }));
      if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => { E.ordreControles[q.id + ':' + cid] = melanger(c.options.map(o => o.id)); });
    });
    sauver(); afficher();
  };
  composer();
}

// ------------------------------------------------------------------ épreuve
function pastilles() {
  const faite = it => it.type === 'lecon' ? !!E.vus[it.id] : it.type === 'code' ? (E.code[it.id] || {}).soumissions > 0 : E.reponses[it.id] !== undefined;
  const barre = document.querySelector('#progression > span');

// Points de contrôle : question corrigée dès le clic, non notée.
function rendreLecon(q) {
  const brut = rendre(q.contenu).replace(/<p>\[\[controle:([\w-]+)\]\]<\/p>/g, (_, cid) => '<div class="controle" data-c="' + cid + '"></div>');
  // Une partie par titre de niveau 2 ; dans chaque partie, un bloc par rubrique (problème, énoncé, preuve, exemple...).
  const source = document.createElement('div');
  source.innerHTML = brut;
  const parties = [];
  Array.from(source.childNodes).forEach(n => {
    if (n.nodeName === 'H3' || !parties.length) parties.push({ titre: n.nodeName === 'H3' ? n.textContent : 'Introduction', noeuds: [] });
    parties[parties.length - 1].noeuds.push(n);
  });
  const genre = t => /preuve/i.test(t) ? 'preuve' : /pi[èe]ge/i.test(t) ? 'pieges' : /exemple|exp[ée]rience/i.test(t) ? 'exemple'
    : /[ée]nonc[ée]/i.test(t) ? 'enonce-bloc' : /intuition/i.test(t) ? 'intuition' : /probl[èe]me/i.test(t) ? 'probleme'
    : /cas limites/i.test(t) ? 'limites' : /d[ée]finition|notation|cadre|mod[èe]le/i.test(t) ? 'definitions' : '';
  const courante = Math.min((E.partie || {})[q.id] || 0, parties.length - 1);
  let h = '<div class="lecon-corps" data-lecon="' + q.id + '"><nav class="sommaire">';
  parties.forEach((p, k) => { h += '<button data-partie="' + k + '"' + (k === courante ? ' class="active"' : '') + '>' + (k + 1) + '. ' + esc(p.titre.replace(/^(Leçon|Partie \d+|Outil \d+|\d+\.)\s*:?\s*/i, '').slice(0, 42) || p.titre) + '</button>'; });
  h += '</nav>';
  parties.forEach((p, k) => {
    h += '<section class="partie" data-partie="' + k + '"' + (k === courante ? '' : ' hidden') + '>';
    let bloc = null;
    const fermer = () => { if (bloc) { h += bloc.genre === 'question' ? ficheDebrief(bloc.titre, bloc.noeuds) : bloc.genre === 'preuve' ? '</details>' : '</div>'; bloc = null; } };
    p.noeuds.forEach(n => {
      if (bloc && bloc.genre === 'question' && n.nodeName !== 'H4' && n.nodeName !== 'H3') { bloc.noeuds.push(n); return; }
      if (n.nodeName === 'H4' && /^Question \d+/.test(n.textContent)) {
        fermer();
        bloc = { genre: 'question', titre: n.textContent, noeuds: [] };
      } else if (n.nodeName === 'H4') {
        fermer();
        const g = genre(n.textContent);
        bloc = { genre: g };
        if (g === 'preuve') h += '<details class="bloc preuve"><summary>' + esc(n.textContent) + '<span class="meta">déplier pour la lire</span></summary>';
        else h += '<div class="bloc ' + g + '"><h4>' + esc(n.textContent) + '</h4>';
      } else if (n.nodeName === 'H3') { fermer(); h += n.outerHTML; }
      else h += n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    });
    fermer();
    h += '<div class="pied-partie"><button data-aller="' + (k - 1) + '"' + (k === 0 ? ' disabled' : '') + '>Partie précédente</button>'
      + '<span class="meta">Partie ' + (k + 1) + ' sur ' + parties.length + '</span>'
      + (k < parties.length - 1 ? '<button class="principal" data-aller="' + (k + 1) + '">Partie suivante</button>' : '<span class="meta">Fin de la leçon : passe à la suite avec « Suivante ».</span>') + '</div></section>';
  });
  return h + '</div>';
}
// Une question du débrief : en-tête (numéro, titre, verdict), énoncé, réponses côte à côte, rubriques, à retenir.
function ficheDebrief(titre, noeuds) {
  const m = titre.match(/^(Question \d+)\s*:?\s*(.*)$/);
  const gras = n => n.nodeName === 'P' && n.firstChild && n.firstChild.nodeName === 'STRONG' ? n.firstChild.textContent.trim() : '';
  const reste = n => { const c = n.cloneNode(true); c.removeChild(c.firstChild); return c.innerHTML.trim(); };
  let enonce = '', ta = null, attendue = null, verdict = '', corps = '', retenir = '', revoir = '', etat = 'enonce';
  noeuds.forEach(n => {
    const g = gras(n), html = n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    if (/^Ta réponse/.test(g)) { ta = reste(n); etat = 'corps'; }
    else if (/^Réponse attendue/.test(g)) { attendue = reste(n); etat = 'corps'; }
    else if (/^Verdict/.test(g)) { verdict = reste(n); etat = 'corps'; }
    else if (/^À retenir/.test(g)) { retenir = '<h5>À retenir</h5><p>' + reste(n) + '</p>'; etat = 'retenir'; }
    else if (/^Leçon à revoir/.test(g)) { revoir = reste(n); etat = 'fin'; }
    else if (g && n.textContent.trim() === g) { corps += '<h5>' + esc(g.replace(/[.:]\s*$/, '')) + '</h5>'; etat = 'corps'; }
    else if (etat === 'enonce') enonce += n.nodeName === 'P' && /^Type :/.test(n.textContent) ? '<p class="meta">' + n.innerHTML + '</p>' : n.nodeName === 'UL' ? '<ul class="choix">' + n.innerHTML + '</ul>' : html;
    else if (etat === 'retenir') retenir += html;
    else corps += html;
  });
  const brut = verdict.replace(/<[^>]+>/g, '').trim();
  const v = /^juste/i.test(brut) ? ['v-juste', 'Juste'] : /^fausse/i.test(brut) ? ['v-fausse', 'Fausse'] : /^incompl/i.test(brut) ? ['v-incomplete', 'Incomplète']
    : /^non visible/i.test(brut) ? ['', 'Réponse non visible'] : ['', ''];
  const suite = brut.replace(/^[^.]*\.\s*/, '');
  let h = '<article class="fiche ' + v[0] + '"><header class="fiche-tete"><span class="num">' + esc(m[1]) + '</span><span class="titre">' + esc(m[2]) + '</span>'
    + (v[1] ? '<span class="verdict">' + v[1] + '</span>' : '') + '</header><div class="fiche-corps">';
  if (ta === null && attendue === null) return h + enonce + corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '') + '</div></article>';
  h += '<h5>Énoncé</h5>' + enonce;
  h += '<div class="fiche-reponses">' + (ta === null ? '' : '<div><span class="lab">Ta réponse</span>' + ta + '</div>') + '<div><span class="lab">Réponse attendue</span>' + (attendue || '') + '</div></div>';
  if (suite) h += '<p class="meta">' + verdict.replace(/^[^.]*\.\s*/, '') + '</p>';
  h += corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '');
  return h + '</div></article>';
}

// Monaco (l'éditeur de VS Code) depuis cdnjs ; les suggestions, signatures et aides viennent de jedi

const MONACO_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min';

const EDITEURS = [];
window.EDITEURS = EDITEURS;

function chargerMonaco() {
  if (promesseMonaco) return promesseMonaco;
  promesseMonaco = new Promise(resolve => {
    const abandon = setTimeout(() => fini(null), 20000);
    function fini(m) { clearTimeout(abandon); if (window.MODE_EDITEUR === undefined) { MONACO = m; window.MODE_EDITEUR = m ? 'monaco' : 'simple'; } resolve(MONACO); }
    const s = document.createElement('script');
    s.src = MONACO_BASE + '/vs/loader.js';
    s.onerror = () => fini(null);
    s.onload = () => {
      window.MonacoEnvironment = { getWorkerUrl: () => 'data:text/javascript;charset=utf-8,' + encodeURIComponent("self.MonacoEnvironment={baseUrl:'" + MONACO_BASE + "/'};importScripts('" + MONACO_BASE + "/vs/base/worker/workerMain.js');") };
      window.require.config({ paths: { vs: MONACO_BASE + '/vs' } });
      window.require(['vs/editor/editor.main'], () => { try { configurerMonaco(window.monaco); fini(window.monaco); } catch (e) { fini(null); } }, () => fini(null));

}
async function aide(type, model, position) {
  const q = questionCode();
  if (!q || !SERVEUR) return null;

  catch (e) { return null; }
}
function configurerMonaco(m) {
  const K = m.languages.CompletionItemKind;
  const genres = { module: K.Module, class: K.Class, instance: K.Variable, function: K.Function, param: K.Variable, path: K.File, keyword: K.Keyword, property: K.Property, statement: K.Variable };
  m.languages.registerCompletionItemProvider('python', {
    triggerCharacters: ['.'],
    provideCompletionItems: async (model, position) => {
      const r = await aide('completer', model, position);
      if (!r || !r.completions) return { suggestions: [] };
      const mot = model.getWordUntilPosition(position);
      const plage = new m.Range(position.lineNumber, mot.startColumn, position.lineNumber, mot.endColumn);

    }

    provideHover: async (model, position) => {

}
function creerEditeur(conteneur, code, rappels) {

      glyphMargin: false, renderLineHighlight: 'none', overviewRulerLanes: 0, wordBasedSuggestions: 'off', fixedOverflowWidgets: true,

  }

  zone.value = code;
  conteneur.appendChild(zone);
  zone.addEventListener('input', () => { rappels.modif(zone.value); ajuster(zone); });
  zone.addEventListener('focus', rappels.focus);
  zone.addEventListener('keydown', ev => clavier(ev, zone, rappels));
  setTimeout(() => ajuster(zone));
  return { brut: zone, getValue: () => zone.value, setValue: v => { zone.value = v; zone.dispatchEvent(new Event('input')); }, focus: () => zone.focus(), dispose: () => {} };
}
function libererEditeurs() { EDITEURS.forEach(e => e.dispose()); EDITEURS.length = 0; }

function dessinerCellules(q) {
  const conteneur = document.getElementById('cellules');
  if (!conteneur) return;
  if (SERVEUR && window.MODE_EDITEUR === undefined) {
    conteneur.innerHTML = '<p class="meta">Chargement de l\'éditeur...</p>';
    chargerMonaco().then(() => { if (questionCode() === q) dessinerCellules(q); });
    return;
  }
  libererEditeurs();
  conteneur.innerHTML = '';
  const etat = document.getElementById('modeEditeur');
  if (etat) etat.textContent = MONACO ? 'éditeur VS Code, autocomplétion' : 'éditeur simple' + (SERVEUR ? ' (Monaco injoignable)' : '');
  E.cellules[q.id].forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'cellule';
    div.innerHTML = '<div class="numero">[' + (c.numero === null ? ' ' : c.numero) + ']</div><div><div class="editeur"></div>'
      + '<div class="actions"><button data-a="executer">Exécuter</button><button data-a="dessous">Insérer dessous</button><button data-a="supprimer">Supprimer</button></div>'
      + '<pre class="sortie sans-math"></pre></div>';
    div.querySelector('pre.sortie').innerHTML = rendreSortie(c);
    conteneur.appendChild(div);
    EDITEURS.push(creerEditeur(div.querySelector('.editeur'), c.code, {
      modif: v => { c.code = v; sauver(); },
      focus: () => { conteneur.querySelectorAll('.cellule').forEach(x => x.classList.remove('active')); div.classList.add('active'); },
      executer: () => executerCellule(q, i),
      executerSuivant: () => {
        executerCellule(q, i);
        if (i === E.cellules[q.id].length - 1) { E.cellules[q.id].push({ code: '', sortie: '', numero: null }); sauver(); dessinerCellules(q); }
        focaliser(i + 1);
      }
    }));
    div.querySelector('[data-a=executer]').onclick = () => executerCellule(q, i);
    div.querySelector('[data-a=dessous]').onclick = () => { E.cellules[q.id].splice(i + 1, 0, { code: '', sortie: '', numero: null }); sauver(); dessinerCellules(q); focaliser(i + 1); };
    div.querySelector('[data-a=supprimer]').onclick = () => { if (E.cellules[q.id].length > 1) { E.cellules[q.id].splice(i, 1); sauver(); dessinerCellules(q); } };
  });
}
function majNumeros(q) { document.querySelectorAll('#cellules .numero').forEach((n, i) => { const c = E.cellules[q.id][i]; n.textContent = '[' + (c && c.numero !== null ? c.numero : ' ') + ']'; }); }
function ajuster(zone) { zone.style.height = 'auto'; zone.style.height = (zone.scrollHeight + 2) + 'px'; }
function focaliser(i) { const e = EDITEURS[i]; if (e) e.focus(); }
function inserer(zone, texte) {
  zone.focus();
  if (!document.execCommand('insertText', false, texte)) zone.setRangeText(texte, zone.selectionStart, zone.selectionEnd, 'end');
  zone.dispatchEvent(new Event('input'));
}
function clavier(ev, zone, rappels) {
  if (ev.key === 'Enter' && (ev.shiftKey || ev.ctrlKey)) {
    ev.preventDefault();
    if (ev.shiftKey) rappels.executerSuivant(); else rappels.executer();
    return;
  }
  const debut = zone.selectionStart, fin = zone.selectionEnd, v = zone.value;
  const debutLigne = v.lastIndexOf('\n', debut - 1) + 1;
  if (ev.key === 'Tab') {
    ev.preventDefault();
    const multi = v.slice(debut, fin).includes('\n');
    if (!ev.shiftKey && !multi) { inserer(zone, '    '); return; }
    const finBloc = fin;
    const bloc = v.slice(debutLigne, finBloc);
    const nouveau = ev.shiftKey ? bloc.replace(/^ {1,4}/gm, '') : bloc.replace(/^/gm, '    ');
    zone.setSelectionRange(debutLigne, finBloc);
    inserer(zone, nouveau);
    zone.setSelectionRange(debutLigne, debutLigne + nouveau.length);
    return;
  }
  if (ev.key === 'Enter' && !ev.altKey && !ev.metaKey) {
    ev.preventDefault();
    const ligne = v.slice(debutLigne, debut);
    let retrait = ligne.match(/^ */)[0];
    if (/:\s*(#.*)?$/.test(ligne)) retrait += '    ';
    inserer(zone, '\n' + retrait);
  }
}

async function executerCellule(q, i) {
  if (!SERVEUR) return false;
  const c = E.cellules[q.id][i];
  const div = document.querySelectorAll('#cellules .cellule')[i];
  if (div) { div.querySelector('.numero').textContent = '[*]'; div.querySelector('pre.sortie').innerHTML = ''; }
  let r;
  try { r = await api('/api/executer', { session: SESSION, dossier: q.dossier, code: c.code, nom: 'cellule ' + (i + 1) }); }
  catch (e) { r = { erreur: 'Serveur injoignable : lancer.py est-il démarré ?' }; }
  E.compteur = (E.compteur || 0) + 1;
  c.numero = E.compteur;
  let h = '';
  if (r.sortie) h += esc(r.sortie);
  if (r.valeur !== null && r.valeur !== undefined) h += (h && !h.endsWith('\n') ? '\n' : '') + esc(r.valeur);
  if (r.erreur) h += (h && !h.endsWith('\n') ? '\n' : '') + '<span class="erreur">' + esc(r.erreur) + '</span>';
  if (r.redemarre) { noyauxDemarres[q.id] = 'noyau redémarré : variables perdues'; const z = document.getElementById('versions'); if (z) z.textContent = noyauxDemarres[q.id]; }
  c.sortie = h;
  sauver();
  const d = document.querySelectorAll('#cellules .cellule')[i];
  if (d) { d.querySelector('.numero').textContent = '[' + c.numero + ']'; d.querySelector('pre.sortie').innerHTML = h; }
  return !r.erreur;
}

function codeSource(q) { return E.cellules[q.id].map((c, i) => '# %% cellule ' + (i + 1) + '\n' + c.code).join('\n\n') + '\n'; }
function afficherEtatSoumission(q) {
  const s = E.code[q.id] || {};
  const z = document.getElementById('etatSoumission');
  if (z) z.textContent = s.soumissions ? s.soumissions + ' soumission(s) · dernière : ' + s.caches_reussis + '/' + s.caches_total + ' tests cachés réussis' : 'jamais soumis';
}
async function lancerTests(q, mode) {
  const zone = document.getElementById('resultatsTests');
  zone.innerHTML = '<p class="meta">' + (mode === 'visibles' ? 'Tests visibles' : 'Tests cachés') + ' en cours...</p>';
  let r;
  try { r = await api('/api/tests', { session: SESSION, dossier: q.dossier, module: q.module_tests, mode }); }
  catch (e) { r = { erreur: 'Serveur injoignable : lancer.py est-il démarré ?' }; }
  if (r.erreur) { zone.innerHTML = '<pre class="sans-math"><span class="erreur">' + esc(r.erreur) + '</span></pre>'; return; }
  let h = '<p class="etiquette ' + (r.reussis === r.total ? 'bon' : 'faux') + '">' + (mode === 'visibles' ? 'Tests visibles : ' : 'Tests cachés : ') + r.reussis + '/' + r.total + ' réussis</p>';
  if (mode === 'visibles') {
    h += '<div class="defile"><table><tr><th>Test</th><th>Résultat</th><th>Attendu</th><th>Obtenu</th><th class="nombre">Durée</th></tr>';
    r.resultats.forEach(t => { h += '<tr><td>' + esc(t.nom) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec') + '</td><td><code class="sans-math">' + esc(t.attendu) + '</code></td><td><code class="sans-math">' + esc(t.obtenu ?? '') + '</code></td><td class="nombre">' + t.duree_s + ' s</td></tr>'; });
    h += '</table></div>';
    r.resultats.filter(t => t.erreur).forEach(t => { h += '<pre class="sans-math"><span class="erreur">' + esc(t.nom + ' :\n' + t.erreur) + '</span></pre>'; });
    E.code[q.id] = Object.assign(E.code[q.id] || {}, { visibles_reussis: r.reussis });
  } else {
    h += '<div class="defile"><table><tr><th>Test caché</th><th>Résultat</th></tr>';
    r.resultats.forEach((t, k) => { h += '<tr><td>Test ' + (k + 1) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec' + (t.erreur ? ' (exception ou temps dépassé)' : '')) + '</td></tr>'; });
    h += '</table></div>';
    const s = E.code[q.id] || {};
    E.code[q.id] = Object.assign(s, { soumissions: (s.soumissions || 0) + 1, caches_reussis: r.reussis, caches_total: r.total, details: r.resultats, code_source: codeSource(q) });
    afficherEtatSoumission(q);
    const p = page.querySelector('.pastille.courante'); if (p) p.classList.add('faite');
  }
  sauver();
  zone.innerHTML = h;
}

// ------------------------------------------------------------------ bilan
function points(q) {
  if (q.type === 'code') { const c = E.code[q.id]; return c && c.soumissions ? c.caches_reussis / c.caches_total : 0; }
  const r = E.reponses[q.id];
  if (r === undefined || r === 'nsp') return 0;
  // Une question à plusieurs réponses est notée tout ou rien : l'ensemble coché doit être exactement l'ensemble juste.
  const s = choisies(q), bonnes = q.options.filter(o => o.correcte).map(o => o.id);
  return s.length === bonnes.length && bonnes.every(b => s.includes(b)) ? 1 : -D.options.penalite;
}
function choisies(q) { const r = E.reponses[q.id]; return r === undefined || r === 'nsp' ? [] : Array.isArray(r) ? r.slice() : [r]; }
function texteOption(q, id) { const o = q.options.find(x => x.id === id); return o ? o.texte : null; }

function resultatJSON(duree) {
  return {
    examen: D.id, debut: new Date(E.debut).toISOString(), duree_s: Math.round(duree), pauses_s: Math.round((E.pauseTotale || 0) / 1000), options: D.options,
    lecons: ITEMS.filter(q => q.type === 'lecon').map(q => {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      return { id: q.id, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), controles_justes_du_premier_coup: justes, controles_total: ids.length };
    }),
    questions: NOTEES.map(q => {
      const base = { id: q.id, type: q.type, section: q.section, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), temps_cible_s: q.temps_cible_s, points: Number(points(q).toFixed(4)) };
      if (q.type === 'code') {
        const c = E.code[q.id] || {};
        return Object.assign(base, { soumissions: c.soumissions || 0, caches_reussis: c.caches_reussis || 0, caches_total: c.caches_total || q.tests_caches, visibles_reussis: c.visibles_reussis ?? null, code_source: c.code_source || codeSource(q) });
      }
      const r = E.reponses[q.id] ?? null;
      return Object.assign(base, { reponse: r, reponse_texte: r && r !== 'nsp' ? choisies(q).map(i => texteOption(q, i)).join(' ; ') : null, bonne_reponse_texte: q.options.filter(o => o.correcte).map(o => o.texte).join(' ; ') });
    })
  };
}

function bilan() {
  page.className = '';
  document.getElementById('position').textContent = 'Bilan';
  const duree = dureeEcoulee(E.fin);
  document.getElementById('chrono').textContent = mmss(duree);
  let total = 0;
  let h = '<div class="carte"><h2>Bilan</h2>@SCORE@<div class="defile"><table><tr><th>Section</th><th class="nombre">Score</th><th class="nombre">Temps passé</th><th class="nombre">Temps indicatif</th></tr>';
  D.sections.forEach(s => {
    const notees = s.questions.filter(q => q.type !== 'lecon');
    const pts = notees.reduce((a, q) => a + points(q), 0);
    const t = s.questions.reduce((a, q) => a + (E.temps[q.id] || 0), 0);
    total += pts;
    h += '<tr><td>' + esc(s.nom) + '</td><td class="nombre">' + (notees.length ? pts.toFixed(2).replace('.', ',') + ' / ' + notees.length : 'non notée') + '</td><td class="nombre">' + mmss(t) + '</td><td class="nombre">' + mmss(s.budget_min * 60) + '</td></tr>';
  });
  h += '<tr><th>Total</th><th class="nombre">' + total.toFixed(2).replace('.', ',') + ' / ' + NOTEES.length + '</th><th class="nombre">' + mmss(duree) + '</th><th class="nombre">' + mmss(D.duree_minutes * 60) + '</th></tr></table></div>';
  h = h.replace('@SCORE@', '<div class="score-total"><strong>' + total.toFixed(2).replace('.', ',').replace(/,00$/, '') + ' / ' + NOTEES.length + '</strong><span class="meta">en ' + mmss(duree) + '</span></div>');
  const barreFin = document.querySelector('#progression > span'); if (barreFin) barreFin.style.width = '100%';
  h += '<p id="enregistrement" class="meta"></p>';
  h += '<details><summary>Résultat brut (JSON)</summary><textarea readonly class="json sans-math" id="json"></textarea><div class="barre"><button id="telecharger">Enregistrer le fichier</button></div></details>';
  h += '<div class="barre">' + (SERVEUR ? '<button class="principal" id="retourAccueil">Retour à l\'accueil (séance suivante)</button>' : '')
    + '<button id="recommencer">Effacer et recommencer</button></div></div>';
  ITEMS.forEach((q, i) => {
    const temps = mmss(E.temps[q.id] || 0) + ' sur ' + mmss(q.temps_cible_s) + ' visés';
    const tete = (classe, verdict) => '<article class="fiche ' + classe + '"><header class="fiche-tete"><span class="num">' + (q.type === 'lecon' ? 'Leçon' : 'Question ' + (i + 1)) + '</span><span class="titre">' + esc(q.theme)
      + '</span><span class="temps">' + esc(q.nomSection) + ' · ' + temps + '</span>' + (verdict ? '<span class="verdict">' + verdict + '</span>' : '') + '</header><div class="fiche-corps">';
    if (q.type === 'lecon') {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      h += tete('', '') + '<p>Points de contrôle justes du premier coup : ' + justes + ' sur ' + ids.length + '. La leçon reste consultable depuis la séance.</p></div></article>';
      return;
    }
    if (q.type === 'qcm') {
      const r = E.reponses[q.id], juste = points(q) === 1;
      const s = choisies(q), incomplete = !juste && q.multiple && s.length > 0 && s.every(id => q.options.find(o => o.id === id).correcte);
      h += tete(juste ? 'v-juste' : incomplete ? 'v-incomplete' : r === undefined || r === 'nsp' ? '' : 'v-fausse',
        juste ? 'Juste' : r === undefined ? 'Sans réponse' : r === 'nsp' ? 'Je ne sais pas' : incomplete ? 'Incomplète' : 'Fausse');
      h += '<h5>Énoncé</h5>' + rendre(q.enonce) + '<h5>' + (q.multiple ? 'Options (plusieurs réponses, tout ou rien)' : 'Options') + '</h5>';
      E.ordre[q.id].forEach((oid, k) => {
        const o = q.options.find(x => x.id === oid), choisie = s.includes(oid);
        const puces = (o.correcte ? '<span class="puce bon">' + (q.multiple ? 'Juste' : 'Bonne réponse') + '</span>' : '') + (choisie ? '<span class="puce' + (o.correcte ? ' bon' : ' faux') + '">Ta réponse</span>' : '');
        h += '<div class="option ' + (o.correcte ? 'juste' : 'fausse') + (choisie ? ' choisie' : '') + '"><span class="lettre">' + 'ABCDE'[k] + '</span><div>' + puces + rendre(o.texte)
          + '<div class="explication">' + (o.correcte && !q.multiple ? '' : rendre(o.explication)) + '</div></div></div>';
      });
      h += '<h5>Correction</h5>' + rendre(q.solution);
    } else {
      const c = E.code[q.id] || {};
      const tout = c.soumissions && c.caches_reussis === c.caches_total;
      h += tete(tout ? 'v-juste' : c.soumissions ? 'v-incomplete' : '', c.soumissions ? c.caches_reussis + ' / ' + c.caches_total + ' tests cachés' : 'Jamais soumis');
      h += '<details><summary>Énoncé</summary>' + rendre(q.enonce) + '</details>';
      if (c.details) {
        h += '<h5>Tests cachés</h5><div class="defile"><table><tr><th>Test caché</th><th>Résultat</th><th>Attendu</th><th>Obtenu</th></tr>';
        c.details.forEach(t => { h += '<tr><td>' + esc(t.nom) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec') + '</td><td><code class="sans-math">' + esc(t.attendu) + '</code></td><td><code class="sans-math">' + esc(t.obtenu ?? (t.erreur ? 'exception' : '')) + '</code></td></tr>'; });
        h += '</table></div>';
        c.details.filter(t => t.erreur).forEach(t => { h += '<details><summary>Erreur : ' + esc(t.nom) + '</summary><pre class="sans-math">' + esc(t.erreur) + '</pre></details>'; });
      }
      h += '<details><summary>Ton code soumis</summary><pre class="sans-math"><code>' + esc(c.code_source || codeSource(q)) + '</code></pre></details>';
      h += '<details><summary>Correction</summary>' + rendre(q.solution) + '</details>';
    }
    h += '<p class="revoir">Vérification des nombres : <code class="sans-math">' + esc(q.verif.script) + '</code></p></div></article>';
  });
  page.innerHTML = h;
  const resultat = resultatJSON(duree);
  const zone = document.getElementById('json');
  zone.value = JSON.stringify(resultat, null, 1);
  document.getElementById('telecharger').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([zone.value], { type: 'application/json' }));
    a.download = D.id + '_resultat.json'; a.click();
  };
  const retour = document.getElementById('retourAccueil'); if (retour) retour.onclick = () => { location.href = '/'; };
  document.getElementById('recommencer').onclick = () => { if (confirm('Effacer ce passage ?')) { try { localStorage.removeItem(CLE); } catch (e) {} E = etatNeuf('accueil'); afficher(); } };
  const info = document.getElementById('enregistrement');
  if (E.enregistrement) info.textContent = E.enregistrement;
  else if (!SERVEUR) info.textContent = 'Page ouverte comme un fichier : le résultat n\'est pas enregistré automatiquement. Copie le JSON ci-dessous dans la conversation.';
  else {
    info.textContent = 'Enregistrement du résultat...';
    api('/api/resultat', resultat).then(r => {
      E.enregistrement = r.erreur ? null : 'Résultat enregistré dans ' + r.fichier + ' ; ' + r.erreurs_ajoutees + ' erreur(s) ajoutée(s) au journal suivi/erreurs.md.';
      info.textContent = E.enregistrement || 'Échec de l\'enregistrement : ' + r.erreur;
      sauver();
    }).catch(() => { info.textContent = 'Serveur injoignable : le résultat n\'est pas enregistré. Copie le JSON ci-dessous dans la conversation.'; });
  }
  composer();
}

function afficher() {
  libererEditeurs();
  document.getElementById('titre').textContent = D.titre;
  document.title = D.titre;
  if (E.phase === 'epreuve') epreuve(); else if (E.phase === 'bilan') bilan(); else accueil();
  window.scrollTo(0, 0);
}
function completerEtat() {
  ['reponses', 'temps', 'ordre', 'cellules', 'code', 'controles', 'ordreControles', 'vus', 'partie'].forEach(k => { if (!E[k] || typeof E[k] !== 'object') E[k] = {}; });
  if (typeof E.courant !== 'number' || E.courant < 0 || E.courant >= ITEMS.length) E.courant = 0;
  ITEMS.forEach(q => {
    if (q.cellules_initiales && !Array.isArray(E.cellules[q.id])) E.cellules[q.id] = q.cellules_initiales.map(c => ({ code: c, sortie: '', numero: null }));
    if (q.type === 'qcm') {
      const ids = q.options.map(o => o.id);
      const o = E.ordre[q.id];
      if (!Array.isArray(o) || o.length !== ids.length || !ids.every(i => o.includes(i))) E.ordre[q.id] = melanger(ids);
      const rep = E.reponses[q.id];
      if (rep !== undefined && rep !== 'nsp' && (Array.isArray(rep) !== !!q.multiple || !choisies(q).length || !choisies(q).every(i => ids.includes(i)))) delete E.reponses[q.id];
    }
    if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => {
      const cle = q.id + ':' + cid;
      if (!Array.isArray(E.ordreControles[cle])) E.ordreControles[cle] = melanger(c.options.map(o => o.id));
    });
  });
}
charger();
completerEtat();
if (SERVEUR && ITEMS.some(q => q.cellules_initiales)) chargerMonaco();
afficher();
</script>
