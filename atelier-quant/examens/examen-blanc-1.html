, donc \\(\\mathbf{w}_{k+1} = (\\mathbf{I} - \\eta\\mathbf{H})\\,\\mathbf{w}_k\\) : à chaque pas, la première coordonnée est multipliée par \\(1 - 10\\eta\\) et la seconde par \\(1 - \\eta\\).\n\nÉtape 2, convergence depuis tout départ : il faut et il suffit que \\(\\lvert 1 - 10\\eta \\rvert < 1\\) et \\(\\lvert 1 - \\eta \\rvert < 1\\), soit \\(0 < \\eta < 0{,}2\\) et \\(0 < \\eta < 2\\) : c'est \\(L\\) qui impose \\(\\eta < 2/L\\).\n\nÉtape 3, pas optimal : sur \\([1/10, 2/11]\\), \\(\\lvert 1 - \\eta \\rvert = 1 - \\eta\\) décroît et \\(\\lvert 1 - 10\\eta \\rvert = 10\\eta - 1\\) croît ; avant, \\(\\rho = 1 - \\eta\\) décroît, après, \\(\\rho = 10\\eta - 1\\) croît. Le minimum est atteint quand \\(1 - \\eta = 10\\eta - 1\\), soit \\(\\eta^\\star = 2/(L + \\mu) = 2/11\\), où \\(\\rho = 1 - 2/11 = 9/11 = (\\kappa - 1)/(\\kappa + 1)\\).\n\nLecture : pour \\(\\kappa\\) grand, \\(-\\ln \\rho = \\ln\\dfrac{\\kappa + 1}{\\kappa - 1} \\approx 2/\\kappa\\), donc le nombre d'itérations nécessaire pour diviser l'erreur par une constante donnée croît à peu près proportionnellement à \\(\\kappa\\). Expérience (script) : après 50 itérations depuis \\((1, 1)\\), norme 0,000062 au pas \\(\\eta^\\star\\), contre 0,005154 au pas \\(1/10\\).", "type": "qcm", "multiple": false, "reponse": "\\(0 < \\eta < 0{,}2\\) ; \\(\\eta^\\star = 2/11\\), avec \\(\\rho(\\eta^\\star) = 9/11 \\approx 0{,}818\\).", "fiche": null, "verif": {"script": "verif/examen_blanc_1.py", "cles": ["A01_d_facteur_1L", "A01_eta_max", "A01_facteur", "A01_kappa", "A01_norme_50_1L", "A01_norme_50_opt"]}}, {"id": "EB1-A02", "section": "mla", "theme": "Rétropropagation : softmax et entropie croisée", "difficulte": 3, "temps_cible_s": 120, "enonce": "Un réseau de classification à 3 classes produit, pour une observation, le vecteur de scores (logits) \\(\\mathbf{z} = (2, 1, 0)\\). Les probabilités prédites sont \\(p_j = e^{z_j}/\\sum_{k=1}^{3} e^{z_k}\\) (softmax), et la perte d'entropie croisée est \\(L = -\\ln p_c\\), où \\(c\\) est le numéro de la vraie classe ; ici \\(c = 2\\). On donne \\(e \\approx 2{,}718\\) et \\(e^2 \\approx 7{,}389\\).\n\nQue vaut le gradient \\(\\partial L/\\partial \\mathbf{z}\\), coordonnées arrondies à trois décimales ?", "options": [{"id": "a", "texte": "(0,665 ; -0,755 ; 0,090)", "correcte": true, "explication": "Oui : \\(\\mathbf{p} - \\mathbf{y}\\), avec \\(\\mathbf{y}\\) l'indicatrice de la vraie classe."}, {"id": "b", "texte": "(-0,665 ; 0,755 ; -0,090)", "correcte": false, "explication": "C'est \\(\\mathbf{y} - \\mathbf{p}\\), l'opposé du gradient, c'est-à-dire la direction de descente. Augmenter le score de la vraie classe fait baisser la perte : la coordonnée correspondante du gradient doit être négative."}, {"id": "c", "texte": "(0,665 ; 0,245 ; 0,090)", "correcte": false, "explication": "C'est \\(\\mathbf{p}\\) seul : il manque \\(-1\\) sur la coordonnée de la vraie classe, qui vient du terme \\(-z_c\\) dans \\(L = -z_c + \\ln \\sum_k e^{z_k}\\)."}, {"id": "d", "texte": "(0,000 ; -4,086 ; 0,000)", "correcte": false, "explication": "C'est le gradient par rapport aux **probabilités**, \\(\\partial L/\\partial p_2 = -1/p_2\\). La question porte sur les scores \\(\\mathbf{z}\\) : il faut encore composer par la jacobienne du softmax."}], "solution": "Réponse : \\(\\partial L/\\partial \\mathbf{z} = \\mathbf{p} - \\mathbf{y} \\approx (0{,}665 ; -0{,}755 ; 0{,}090)\\), où \\(\\mathbf{y} = (0, 1, 0)\\) est l'indicatrice de la vraie classe.\n\nÉtape 1, réécriture : \\(L = -\\ln p_c = -z_c + \\ln \\sum_k e^{z_k}\\).\n\nÉtape 2, dérivée : \\(\\dfrac{\\partial}{\\partial z_j} \\ln \\sum_k e^{z_k} = \\dfrac{e^{z_j}}{\\sum_k e^{z_k}} = p_j\\), et \\(\\partial(-z_c)/\\partial z_j\\) vaut \\(-1\\) si \\(j = c\\), 0 sinon. Donc \\(\\partial L/\\partial z_j = p_j - y_j\\).\n\nÉtape 3, valeurs : \\(\\sum_k e^{z_k} = e^2 + e + 1 \\approx 11{,}107\\), \\(\\mathbf{p} \\approx (0{,}665 ; 0{,}245 ; 0{,}090)\\), d'où le gradient. Contrôle : ses coordonnées somment à 0, car \\(\\sum_j p_j = \\sum_j y_j = 1\\).\n\nLecture : chaque coordonnée du gradient par rapport aux scores est comprise entre \\(-1\\) et 1 quelle que soit la confiance du modèle, alors que \\(-1/p_c\\) peut être arbitrairement grand. Vérification (script) : dérivation symbolique par sympy et différences finies.", "type": "qcm", "multiple": false, "reponse": "(0,665 ; -0,755 ; 0,090)", "fiche": null, "verif": {"script": "verif/examen_blanc_1.py", "cles": ["A02_d_dp", "A02_d_p", "A02_d_signe", "A02_e", "A02_e2", "A02_exact", "A02_p", "A02_somme_exp"]}}, {"id": "EB1-A03", "section": "mla", "theme": "Attention par produit scalaire normalisé", "difficulte": 3, "temps_cible_s": 120, "enonce": "Une tête d'attention reçoit une requête \\(\\mathbf{q} = (1, 1, 0, 0)\\) et trois clés \\(\\mathbf{k}_1 = (2, 2, 0, 0)\\), \\(\\mathbf{k}_2 = (0, 0, 3, 3)\\), \\(\\mathbf{k}_3 = (1, -1, 0, 0)\\), de dimension \\(d = 4\\), associées aux valeurs scalaires \\(v_1 = 10\\), \\(v_2 = 4\\), \\(v_3 = -2\\). Elle calcule les poids \\(\\alpha_j = \\dfrac{\\exp(\\mathbf{q}^\\top \\mathbf{k}_j/\\sqrt{d})}{\\sum_{i=1}^{3} \\exp(\\mathbf{q}^\\top \\mathbf{k}_i/\\sqrt{d})}\\) et renvoie \\(\\sum_{j=1}^{3} \\alpha_j v_j\\). On donne \\(e^2 \\approx 7{,}389\\).\n\nQuelle est la sortie, arrondie à deux décimales ?", "options": [{"id": "a", "texte": "8,08", "correcte": true, "explication": "Oui : scores (2, 0, 0) après division par \\(\\sqrt{4} = 2\\), puis moyenne pondérée des valeurs."}, {"id": "b", "texte": "9,68", "correcte": false, "explication": "C'est le résultat sans la division par \\(\\sqrt{d}\\) : scores (4, 0, 0) au lieu de (2, 0, 0), et des poids trop concentrés sur la première clé."}, {"id": "c", "texte": "6,19", "correcte": false, "explication": "Les produits scalaires ont été divisés par \\(d = 4\\) au lieu de \\(\\sqrt{d} = 2\\) : scores (1, 0, 0), et des poids trop uniformes."}, {"id": "d", "texte": "4,00", "correcte": false, "explication": "C'est la moyenne simple des valeurs, qui correspondrait à des scores tous égaux. Ici la première clé est alignée avec la requête et reçoit le plus de poids."}], "solution": "Réponse : \\(\\dfrac{10\\,e^2 + 4 - 2}{e^2 + 2} \\approx 8{,}08\\).\n\nÉtape 1, produits scalaires : \\(\\mathbf{q}^\\top \\mathbf{k}_j\\) vaut respectivement (4 ; 0 ; 0) (la deuxième clé est orthogonale à la requête, et pour la troisième \\(1 - 1 = 0\\)).\n\nÉtape 2, normalisation : divisés par \\(\\sqrt{4} = 2\\), les scores valent (2 ; 0 ; 0).\n\nÉtape 3, softmax : les poids sont \\(e^2/(e^2 + 2)\\), \\(1/(e^2 + 2)\\) et \\(1/(e^2 + 2)\\), soit environ (0,787 ; 0,107 ; 0,107).\n\nÉtape 4 : sortie \\(= (10\\,e^2 + 4 - 2)/(e^2 + 2) \\approx 8{,}08\\).\n\nPourquoi \\(\\sqrt{d}\\) : si les coordonnées de \\(\\mathbf{q}\\) et de \\(\\mathbf{k}\\) sont indépendantes, centrées et de variance 1, alors \\(\\mathrm{Var}(\\mathbf{q}^\\top \\mathbf{k}) = \\sum_{i=1}^{d} \\mathbb{E}[q_i^2]\\,\\mathbb{E}[k_i^2] = d\\), les termes croisés étant d'espérance nulle. Diviser par \\(\\sqrt{d}\\) ramène la variance des scores à 1 quelle que soit la dimension. Sans cela, les scores grandissent avec \\(d\\), le softmax sature sur une seule clé, et ses dérivées \\(\\partial \\alpha_j/\\partial s_j = \\alpha_j(1 - \\alpha_j)\\) (\\(s_j\\) le score de la clé \\(j\\)) deviennent très petites. Simulation (script) : variance du produit scalaire 4,01 pour \\(d = 4\\) et 64,0 pour \\(d = 64\\).", "type": "qcm", "multiple": false, "reponse": "8,08", "fiche": null, "verif": {"script": "verif/examen_blanc_1.py", "cles": ["A03_d_echelle_d", "A03_d_moyenne", "A03_d_sans_echelle", "A03_e2", "A03_exact", "A03_poids", "A03_produits", "A03_scores", "A03_var_d4_mc", "A03_var_d64_mc"]}}, {"id": "EB1-A04", "section": "mla", "theme": "Boosting de gradient, taux d'apprentissage", "difficulte": 3, "temps_cible_s": 90, "enonce": "Boosting de gradient pour la perte quadratique \\(\\tfrac12 (y - F)^2\\), où \\(y\\) est la cible et \\(F\\) la prédiction, sur un jeu de données dont les cibles ont pour moyenne \\(\\bar y = 10\\). Chaque arbre est réduit à une seule feuille : à l'étape \\(m\\), il prédit pour toutes les observations la même constante \\(T_m\\), égale à la moyenne des pseudo-résidus \\(y_i - F_{m-1}(x_i)\\). Le modèle part de \\(F_0 = 0\\) et se met à jour par \\(F_m = F_{m-1} + \\nu\\,T_m\\), avec un taux d'apprentissage \\(\\nu = 0{,}1\\). On donne \\(0{,}9^{20} \\approx 0{,}1216\\).\n\nQue vaut la prédiction \\(F_{20}\\) après 20 étapes, arrondie à deux décimales ?", "options": [{"id": "a", "texte": "8,78", "correcte": true, "explication": "Oui : chaque étape corrige 10 % de l'écart restant, qui vaut \\(10 \\times 0{,}9^{20}\\) après 20 étapes."}, {"id": "b", "texte": "10,00", "correcte": false, "explication": "C'est la limite quand le nombre d'étapes tend vers l'infini, atteinte dès la première étape avec \\(\\nu = 1\\). Avec \\(\\nu = 0{,}1\\), chaque étape ne corrige que 10 % de l'écart restant."}, {"id": "c", "texte": "1,22", "correcte": false, "explication": "C'est l'écart **restant**, \\(10 \\times 0{,}9^{20}\\), pas la prédiction."}, {"id": "d", "texte": "20,00", "correcte": false, "explication": "C'est \\(20 \\times 0{,}1 \\times 10\\), comme si chaque étape ajoutait \\(0{,}1 \\times 10\\). Or les pseudo-résidus diminuent au fil des étapes ; sans cela, la prédiction dépasserait la moyenne des cibles."}], "solution": "Réponse : \\(F_{20} = 10\\,(1 - 0{,}9^{20}) \\approx 8{,}78\\).\n\nNotations : \\(r_m = \\bar y - F_m\\) est l'écart restant après \\(m\\) étapes ; \\(F_m\\) est la même constante pour toutes les observations.\n\nÉtape 1 : la moyenne des pseudo-résidus vaut \\(\\bar y - F_{m-1} = r_{m-1}\\), donc \\(T_m = r_{m-1}\\), \\(F_m = F_{m-1} + \\nu\\,r_{m-1}\\), et \\(r_m = (1 - \\nu)\\,r_{m-1}\\).\n\nÉtape 2 : \\(r_m = (1 - \\nu)^m\\,r_0 = 10 \\times 0{,}9^m\\), donc \\(F_{20} = 10 - 10 \\times 0{,}9^{20} \\approx 10 - 1{,}22 = 8{,}78\\).\n\nLecture : avec un petit taux d'apprentissage, il faut plus d'arbres pour s'approcher de l'ajustement ; le nombre d'étapes devient un paramètre de régularisation, à choisir par validation. Vérification (script) : `GradientBoostingRegressor` de scikit-learn, avec une seule variable constante (aucune coupure possible, donc une seule feuille) et `init=\"zero\"`, donne 8,784233.", "type": "qcm", "multiple": false, "reponse": "8,78", "fiche": null, "verif": {"script": "verif/examen_blanc_1.py", "cles": ["A04_d_lineaire", "A04_d_plein", "A04_d_residu", "A04_exact", "A04_facteur", "A04_sklearn"]}}, {"id": "EB1-A05", "section": "mla", "theme": "Algorithme EM, mélange de deux gaussiennes", "difficulte": 4, "temps_cible_s": 150, "enonce": "On ajuste par l'algorithme EM un mélange de deux lois normales sur \\(\\mathbb{R}\\), de poids fixés à 1/2 chacune et de variances fixées à 1 ; seules les moyennes \\(\\mu_1\\) et \\(\\mu_2\\) sont estimées. Les données sont \\(x_1 = -1\\), \\(x_2 = 0\\), \\(x_3 = 3\\), et l'on part de \\(\\mu_1 = 0\\), \\(\\mu_2 = 2\\). Une itération calcule, pour chaque point, la responsabilité \\(r_i\\) : la probabilité a posteriori, avec les paramètres courants, que \\(x_i\\) provienne de la composante 2 (étape E) ; puis elle remplace \\(\\mu_2\\) par \\(\\sum_i r_i x_i / \\sum_i r_i\\) (étape M ; \\(\\mu_1\\) est mis à jour de la même façon avec les poids \\(1 - r_i\\)). On donne \\(e^{-2} \\approx 0{,}1353\\) et \\(e^{-4} \\approx 0{,}0183\\).\n\nQue vaut \\(\\mu_2\\) après une itération, arrondi à trois décimales ?", "options": [{"id": "a", "texte": "2,616", "correcte": true, "explication": "Oui : moyenne des \\(x_i\\) pondérée par les responsabilités \\(r_i = 1/(1 + e^{-(2x_i - 2)})\\)."}, {"id": "b", "texte": "3,000", "correcte": false, "explication": "C'est l'affectation dure des k-moyennes : chaque point à la moyenne la plus proche, et seul \\(x_3 = 3\\) est plus proche de 2 que de 0. EM affecte chaque point à chaque composante avec un poids entre 0 et 1 : les points \\(-1\\) et 0 tirent un peu \\(\\mu_2\\) vers le bas."}, {"id": "c", "texte": "2,928", "correcte": false, "explication": "C'est \\(\\sum_i r_i x_i\\) sans la division par \\(\\sum_i r_i \\approx 1{,}119\\) : la nouvelle moyenne est une moyenne pondérée, dont les poids doivent être normalisés."}, {"id": "d", "texte": "0,667", "correcte": false, "explication": "C'est la moyenne de toutes les données, qui correspondrait à des responsabilités toutes égales. Les responsabilités dépendent de la distance de chaque point aux deux moyennes courantes."}], "solution": "Réponse : \\(\\mu_2 \\approx 2{,}616\\).\n\nÉtape 1, responsabilités, par la formule de Bayes (les poids égaux 1/2 se simplifient) : \\(r_i = \\dfrac{\\varphi(x_i - 2)}{\\varphi(x_i) + \\varphi(x_i - 2)}\\), où \\(\\varphi(u) = e^{-u^2/2}/\\sqrt{2\\pi}\\) est la densité normale centrée réduite. En divisant numérateur et dénominateur par \\(\\varphi(x_i - 2)\\) : \\(r_i = 1/(1 + e^{-\\ell_i})\\), avec \\(\\ell_i = \\tfrac12\\big(x_i^2 - (x_i - 2)^2\\big) = 2x_i - 2\\).\n\nÉtape 2, valeurs : \\(\\ell = (-4 ; -2 ; 4)\\), donc \\(r \\approx (0,0180 ; 0,1192 ; 0,9820)\\).\n\nÉtape 3, étape M : \\(\\sum_i r_i \\approx 1{,}1192\\) et \\(\\sum_i r_i x_i \\approx 2{,}9281\\) (le point 0 ne contribue pas), d'où \\(\\mu_2 \\approx 2{,}616\\). Cette formule maximise en \\(\\mu_2\\) le terme \\(\\sum_i r_i \\ln \\varphi(x_i - \\mu_2)\\) de l'espérance de la log-vraisemblance complète, dont la dérivée \\(\\sum_i r_i (x_i - \\mu_2)\\) s'annule en la moyenne pondérée.\n\nContrôle (script) : avec la mise à jour simultanée de \\(\\mu_1\\) (qui devient -0,493), la log-vraisemblance des données passe de -5,673 à -5,120. Que EM ne fasse jamais baisser la log-vraisemblance est un théorème général, admis ici et constaté sur cet exemple.", "type": "qcm", "multiple": false, "reponse": "2,616", "fiche": null, "verif": {"script": "verif/examen_blanc_1.py", "cles": ["A05_d_dur", "A05_d_moyenne", "A05_d_non_normalise", "A05_e_moins2", "A05_e_moins4", "A05_exact", "A05_logits", "A05_logv_apres", "A05_logv_avant", "A05_mu1", "A05_r2", "A05_somme_r2", "A05_somme_r2x"]}}, {"id": "EB1-A06", "section": "mla", "theme": "Sélection de modèles : AIC et BIC", "difficulte": 2, "temps_cible_s": 90, "enonce": "Deux modèles sont ajustés par maximum de vraisemblance sur les mêmes \\(n = 100\\) observations. Le modèle A a \\(k = 3\\) paramètres et une log-vraisemblance maximale \\(\\ln \\hat L = -140\\) ; le modèle B a \\(k = 6\\) paramètres et \\(\\ln \\hat L = -136\\). On utilise \\(\\mathrm{AIC} = 2k - 2\\ln \\hat L\\) et \\(\\mathrm{BIC} = k \\ln n - 2\\ln \\hat L\\), et chaque critère retient le modèle de plus petite valeur. On donne \\(\\ln 100 \\approx 4{,}605\\).\n\nQuels modèles sont retenus ?", "options": [{"id": "a", "texte": "AIC retient B, BIC retient A.", "correcte": true, "explication": "Oui : AIC 284 contre 286, BIC 293,8 contre 299,6."}, {"id": "b", "texte": "AIC et BIC retiennent B.", "correcte": false, "explication": "BIC pénalise chaque paramètre par \\(\\ln 100\\) au lieu de 2 : les 3 paramètres supplémentaires coûtent \\(3 \\ln 100 \\approx 13{,}8\\), plus que le gain de 8 en \\(-2\\ln \\hat L\\)."}, {"id": "c", "texte": "AIC et BIC retiennent A.", "correcte": false, "explication": "Pour AIC, les 3 paramètres supplémentaires coûtent \\(2 \\times 3 = 6\\), moins que le gain de 8 en \\(-2\\ln \\hat L\\) : AIC vaut 284 pour B contre 286 pour A."}, {"id": "d", "texte": "AIC retient A, BIC retient B.", "correcte": false, "explication": "Les rôles sont inversés : BIC pénalise plus fortement que AIC dès que \\(\\ln n > 2\\), c'est-à-dire \\(n \\ge 8\\) ; c'est donc BIC qui retient le modèle le plus simple."}], "solution": "Réponse : AIC retient B (284 contre 286) ; BIC retient A (293,8 contre 299,6).\n\nÉtape 1, AIC : A : \\(2 \\times 3 + 280 = 286\\) ; B : \\(2 \\times 6 + 272 = 284\\).\n\nÉtape 2, BIC : A : \\(3 \\times 4{,}605 + 280 \\approx 293{,}8\\) ; B : \\(6 \\times 4{,}605 + 272 \\approx 299{,}6\\).\n\nLecture : passer de A à B baisse \\(-2\\ln \\hat L\\) de 8. AIC accepte les 3 paramètres supplémentaires si ce gain dépasse \\(2 \\times 3 = 6\\) ; BIC exige plus de \\(3 \\ln n \\approx 13{,}8\\). Résultats classiques, admis ici : AIC est construit comme une estimation de l'erreur de prédiction au sens de Kullback-Leibler, BIC comme une approximation de la probabilité a posteriori du modèle, et BIC retrouve asymptotiquement le vrai modèle quand il figure parmi les candidats. Si A est emboîté dans B, le test du rapport de vraisemblance compare la statistique \\(8\\) aux quantiles de la loi du khi-deux à 3 degrés de liberté (asymptotiquement, sous les conditions usuelles de régularité).", "type": "qcm", "multiple": false, "reponse": "AIC retient B, BIC retient A.", "fiche": null, "verif": {"script": "verif/examen_blanc_1.py", "cles": ["A06_aic_A", "A06_aic_B", "A06_bic_A", "A06_bic_B", "A06_ln_n", "A06_lr", "A06_seuil_bic"]}}, {"id": "EB1-A07", "section": "mla", "theme": "Étiquettes chevauchantes, variance d'une moyenne", "difficulte": 5, "temps_cible_s": 150, "enonce": "Les rendements quotidiens \\(R_1, R_2, \\dots\\) sont des variables aléatoires indépendantes de même loi, d'espérance 0 et de variance \\(\\sigma^2 > 0\\). Avec \\(h = 10\\), l'étiquette de la date \\(t\\) est le rendement des \\(h\\) jours suivants, \\(Y_t = R_{t+1} + \\dots + R_{t+h}\\), pour \\(t = 1, \\dots, n\\) avec \\(n = 250\\) : deux étiquettes de dates proches partagent des jours. On estime l'espérance des étiquettes par \\(\\bar Y = (Y_1 + \\dots + Y_n)/n\\). Un analyste calcule la variance de \\(\\bar Y\\) comme si les étiquettes étaient indépendantes, soit \\(\\mathrm{Var}(Y_1)/n\\).\n\nQue vaut le rapport \\(\\mathrm{Var}(\\bar Y)\\big/\\big(\\mathrm{Var}(Y_1)/n\\big)\\), arrondi à deux décimales ?", "options": [{"id": "a", "texte": "9,87", "correcte": true, "explication": "Oui : \\(h - (h^2 - 1)/(3n) = 10 - 99/750\\)."}, {"id": "b", "texte": "10,00", "correcte": false, "explication": "C'est la limite du rapport quand \\(n \\to \\infty\\) à \\(h\\) fixé. Pour \\(n = 250\\), les jours des deux bords sont couverts par moins de \\(h\\) étiquettes, et le rapport exact est \\(h - (h^2 - 1)/(3n)\\)."}, {"id": "c", "texte": "3,14", "correcte": false, "explication": "C'est la racine carrée du rapport, le facteur d'erreur sur l'**écart-type** de \\(\\bar Y\\). La question porte sur la variance."}, {"id": "d", "texte": "1,00", "correcte": false, "explication": "C'est l'hypothèse d'indépendance de l'analyste. Or \\(\\mathrm{Cov}(Y_s, Y_t) = \\sigma^2 (h - \\lvert s - t \\rvert)\\) pour \\(\\lvert s - t \\rvert < h\\) : par exemple, deux étiquettes distantes de 3 jours ont une corrélation de 0,7."}], "solution": "Réponse : \\(h - \\dfrac{h^2 - 1}{3n} = 10 - \\dfrac{99}{750} = 9{,}868\\), soit 9,87.\n\nNotations : pour chaque jour \\(s\\), \\(c_s\\) est le nombre d'étiquettes \\(Y_1, \\dots, Y_n\\) qui contiennent \\(R_s\\).\n\nÉtape 1 : \\(\\sum_{t=1}^{n} Y_t = \\sum_s c_s R_s\\), donc, par indépendance des \\(R_s\\), \\(\\mathrm{Var}\\big(\\sum_t Y_t\\big) = \\sigma^2 \\sum_s c_s^2\\) ; et \\(\\mathrm{Var}(Y_1) = h\\sigma^2\\).\n\nÉtape 2, décompte : \\(R_s\\) est dans \\(Y_t\\) si et seulement si \\(s - h \\le t \\le s - 1\\). Les jours \\(s = h + 1, \\dots, n + 1\\), au nombre de 241, sont dans \\(h\\) étiquettes ; aux deux bords, \\(c_s\\) prend une fois chacune des valeurs \\(1, 2, \\dots, h - 1\\). Donc \\(\\sum_s c_s^2 = 241 \\times 100 + 2 \\times 285 = 24670\\).\n\nÉtape 3 : rapport \\(= \\dfrac{\\sigma^2 \\sum_s c_s^2/n^2}{h\\sigma^2/n} = \\dfrac{24670}{250 \\times 10} = 9{,}868\\). En général \\(\\sum_s c_s^2 = (n - h + 1)h^2 + (h - 1)h(2h - 1)/3\\), d'où la forme \\(h - (h^2 - 1)/(3n)\\), qui tend vers \\(h\\).\n\nConséquence : à variance de \\(Y_1\\) connue, la statistique t de \\(\\bar Y\\) calculée comme si les étiquettes étaient indépendantes est gonflée d'un facteur \\(\\sqrt{9{,}868} \\approx 3{,}14\\). Il faut des erreurs standard qui tiennent compte de l'autocorrélation, ou ne garder qu'une étiquette sur \\(h\\). Simulation (script, \\(\\sigma = 1\\)) : \\(\\mathrm{Var}(\\bar Y) \\approx 0,3949\\), contre 0,3947 en théorie.", "type": "qcm", "multiple": false, "reponse": "9,87", "fiche": null, "verif": {"script": "verif/examen_blanc_1.py", "cles": ["A07_correlation_3", "A07_d_limite", "A07_d_naif", "A07_d_racine", "A07_exact", "A07_mc", "A07_nb_pleins", "A07_somme_c2", "A07_somme_carres", "A07_var_theorique"]}}, {"id": "EB1-A08", "section": "mla", "theme": "Processus gaussiens, loi a posteriori", "difficulte": 4, "temps_cible_s": 120, "enonce": "Soit \\(f\\) un processus gaussien sur \\(\\mathbb{R}\\), de moyenne nulle et de noyau \\(k(x, x') = \\exp\\big(-(x - x')^2/2\\big)\\) : pour tous points \\(x_1, \\dots, x_m\\), le vecteur \\((f(x_1), \\dots, f(x_m))\\) est gaussien centré de matrice de covariance \\(\\big(k(x_i, x_j)\\big)_{i,j}\\). On observe \\(Y = f(0) + \\varepsilon\\), où \\(\\varepsilon\\) suit la loi normale centrée de variance 0,5, indépendante de \\(f\\), et la valeur observée est \\(Y = 2\\). On donne \\(e^{-1/2} \\approx 0{,}6065\\).\n\nQuelles sont la moyenne et la variance de la loi de \\(f(1)\\) sachant \\(Y = 2\\), arrondies à trois décimales ?", "options": [{"id": "a", "texte": "moyenne 0,809 ; variance 0,755", "correcte": true, "explication": "Oui : moyenne \\((c/v)\\,y\\) et variance \\(1 - c^2/v\\), avec \\(c = e^{-1/2}\\) et \\(v = 1{,}5\\)."}, {"id": "b", "texte": "moyenne 1,213 ; variance 0,632", "correcte": false, "explication": "C'est le résultat sans le bruit d'observation, comme si \\(Y = f(0)\\) : on a divisé par \\(k(0, 0) = 1\\) au lieu de \\(k(0, 0) + 0{,}5\\). Le bruit rend l'observation moins informative : la moyenne a posteriori est plus proche de 0 et la variance plus grande."}, {"id": "c", "texte": "moyenne 0,809 ; variance 1,000", "correcte": false, "explication": "C'est la variance a priori. L'observation en 0 renseigne aussi sur \\(f(1)\\), puisque \\(f(0)\\) et \\(f(1)\\) sont corrélées ( <script>
'use strict';
const D = JSON.parse(document.getElementById('donnees').textContent);
const ITEMS = D.sections.flatMap(s => s.questions.map(q => Object.assign({ nomSection: s.nom }, q)));
const CLE = 'atelier-quant:' + D.id;
const SERVEUR = location.protocol.startsWith('http');
// La session survit à un rechargement de l'onglet : on se reconnecte alors au même noyau, variables comprises.
const SESSION = (() => { const neuve = Math.random().toString(36).slice(2) + Date.now().toString(36); try { const s = sessionStorage.getItem('atelier-quant:session') || neuve; sessionStorage.setItem('atelier-quant:session', s); return s; } catch (e) { return neuve; } })();
const page = document.getElementById('page');
const noyauxDemarres = {};
let E = etatNeuf('accueil');

function etatNeuf(phase) { return { phase, courant: 0, debut: null, fin: null, reponses: {}, temps: {}, ordre: {}, cellules: {}, code: {}, controles: {}, ordreControles: {}, vus: {}, partie: {}, enregistrement: null, pauseDepuis: null, pauseTotale: 0 }; }
// Options par défaut : la pause et « Je ne sais pas » sont permis, sauf si l'examen les interdit (examens blancs).
const PAUSE_PERMISE = D.options.pause !== false;
const NSP_PERMIS = D.options.je_ne_sais_pas !== false;
function dureeEcoulee(fin) { return (fin - E.debut - (E.pauseTotale || 0) - (E.pauseDepuis ? fin - E.pauseDepuis : 0)) / 1000; }
const NOTEES = ITEMS.filter(q => q.type !== 'lecon');
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(E)); } catch (e) {} }
function charger() { try { const s = localStorage.getItem(CLE); if (s) E = Object.assign(etatNeuf('accueil'), JSON.parse(s)); } catch (e) {} }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function enLigne(t) { return esc(t).replace(/`([^`]+)`/g, '<code class="sans-math">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

// Markdown réduit : titres #, tableaux |, listes - et 1., paragraphes, `code`, **gras**, blocs entre triples accents graves.
function rendre(t) {
  let h = '';
  String(t).split('```').forEach((bloc, i) => {
    if (i % 2) {
      const info = (bloc.match(/^(\w*)\n/) || [])[1];
      h += '<pre class="sans-math' + (info === 'sortie' ? ' sortie-lecon' : '') + '"><code>' + esc(bloc.replace(/^\w*\n/, '')) + '</code></pre>';
      return;
    }
    const lignes = bloc.split('\n');
    let k = 0;
    while (k < lignes.length) {
      const l = lignes[k];
      if (!l.trim()) { k++; continue; }
      const titre = l.match(/^(#{1,4})\s+(.*)$/);
      if (titre) { const n = Math.min(4, titre[1].length + 1); h += '<h' + n + '>' + enLigne(titre[2]) + '</h' + n + '>'; k++; continue; }
      if (l.trim().startsWith('|')) {
        const rangs = [];
        while (k < lignes.length && lignes[k].trim().startsWith('|')) { rangs.push(lignes[k].trim()); k++; }
        const cellules = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
        h += '<div class="defile"><table><tr>' + cellules(rangs[0]).map(c => '<th>' + enLigne(c) + '</th>').join('') + '</tr>';
        rangs.slice(1).filter(r => !/^\|[\s|:-]+\|$/.test(r)).forEach(r => { h += '<tr>' + cellules(r).map(c => '<td>' + enLigne(c) + '</td>').join('') + '</tr>'; });
        h += '</table></div>'; continue;
      }
      const puce = /^\s*[-*]\s+/, numero = /^\s*\d+\.\s+/;
      if (puce.test(l) || numero.test(l)) {
        const motif = puce.test(l) ? puce : numero, balise = motif === puce ? 'ul' : 'ol';
        h += '<' + balise + '>';
        while (k < lignes.length && motif.test(lignes[k])) { h += '<li>' + enLigne(lignes[k].replace(motif, '')) + '</li>'; k++; }
        h += '</' + balise + '>'; continue;
      }
      const par = [];
      while (k < lignes.length && lignes[k].trim() && !/^(#{1,4}\s|\s*\||\s*[-*]\s|\s*\d+\.\s)/.test(lignes[k])) { par.push(lignes[k]); k++; }
      const texte = par.join('\n').trim();
      // Un paragraphe réduit à une seule formule est centré ; une formule au milieu d'une phrase reste dans la ligne.
      const seule = texte.startsWith('\\(') && texte.endsWith('\\)') && texte.indexOf('\\(', 2) < 0;
      h += (seule ? '<p class="formule">' : '<p>') + enLigne(par.join('\n')) + '</p>';
    }
  });
  return h;
}
function composer(el) { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el || page]).catch(() => {}); }
function mmss(s) { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function melanger(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function api(chemin, corps) {
  const r = await fetch(chemin, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
  return r.json();
}

let dernierTic = null;
function tic() {
  const ch = document.getElementById('chrono');
  const bouton = document.getElementById('pause');
  bouton.hidden = !(PAUSE_PERMISE && E.phase === 'epreuve');
  document.getElementById('recommencerHaut').hidden = E.phase !== 'epreuve';
  document.getElementById('voile').hidden = !(E.phase === 'epreuve' && E.pauseDepuis);
  if (E.phase !== 'epreuve' || E.pauseDepuis) { dernierTic = null; return; }
  const maintenant = Date.now();
  if (dernierTic !== null) { const q = ITEMS[E.courant]; E.temps[q.id] = (E.temps[q.id] || 0) + (maintenant - dernierTic) / 1000; }
  dernierTic = maintenant;
  const reste = D.duree_minutes * 60 - dureeEcoulee(maintenant);
  ch.textContent = (reste < 0 ? '+' : '') + mmss(Math.abs(reste));
  ch.classList.toggle('depasse', reste < 0);
}
setInterval(() => { tic(); if (E.phase === 'epreuve') sauver(); }, 500);
if (SERVEUR) document.getElementById('lienAccueil').hidden = false;
document.getElementById('lienAccueil').onclick = () => {
  if (E.phase === 'epreuve' && PAUSE_PERMISE && !E.pauseDepuis) { tic(); E.pauseDepuis = Date.now(); sauver(); }
};
document.getElementById('recommencerHaut').onclick = () => {
  if (!confirm('Effacer ce passage (réponses, code, chronomètre) et revenir au début de la séance ?')) return;
  try { localStorage.removeItem(CLE); } catch (e) {}
  E = etatNeuf('accueil'); dernierTic = null; afficher();
};
document.getElementById('pause').onclick = () => { tic(); E.pauseDepuis = Date.now(); sauver(); tic(); };
document.getElementById('reprendre').onclick = () => {
  if (E.pauseDepuis) { E.pauseTotale = (E.pauseTotale || 0) + (Date.now() - E.pauseDepuis); E.pauseDepuis = null; }
  dernierTic = null; sauver(); tic();
};

// ------------------------------------------------------------------ accueil
function accueil() {
  page.className = '';
  document.getElementById('position').textContent = '';
  document.getElementById('chrono').textContent = mmss(D.duree_minutes * 60);
  let h = '<div class="carte presentation"><h2>' + esc(D.titre) + '</h2><p class="meta">' + D.duree_minutes + ' min · ' + NOTEES.length + ' question' + (NOTEES.length > 1 ? 's' : '') + (D.options.pause === false ? ' · sans pause' : '') + '</p>' + rendre(D.presentation);
  h += '<div class="sections-liste">';
  D.sections.forEach(s => { const n = s.questions.filter(q => q.type !== 'lecon').length; h += '<div><span>' + esc(s.nom) + '</span><span class="meta">' + (n ? n + ' question' + (n > 1 ? 's' : '') : 'leçon') + ' · ' + s.budget_min + ' min</span></div>'; });
  h += '</div>';
  D.avertissements.forEach(a => { h += '<div class="note">' + rendre(a) + '</div>'; });
  if (!SERVEUR && ITEMS.some(q => q.type === 'code')) h += '<div class="note"><p><strong>Le notebook ne peut pas s\'exécuter :</strong> cette page est ouverte comme un fichier. Lance <code class="sans-math">python lancer.py</code> dans le dossier du projet, puis ouvre l\'examen depuis la page qui s\'affiche.</p></div>';
  h += '<p class="meta">' + esc(D.conventions) + '</p>';
  h += '<div class="barre"><button class="principal" id="demarrer">Commencer</button></div></div>';
  page.innerHTML = h;
  document.getElementById('demarrer').onclick = () => {
    E = etatNeuf('epreuve');
    E.debut = Date.now();
    ITEMS.forEach(q => {
      if (q.type === 'qcm') E.ordre[q.id] = melanger(q.options.map(o => o.id));
      if (q.cellules_initiales) E.cellules[q.id] = q.cellules_initiales.map(c => ({ code: c, sortie: '', numero: null }));
      if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => { E.ordreControles[q.id + ':' + cid] = melanger(c.options.map(o => o.id)); });
    });
    sauver(); afficher();
  };
  composer();
}

// ------------------------------------------------------------------ épreuve
function pastilles() {
  const faite = it => it.type === 'lecon' ? !!E.vus[it.id] : it.type === 'code' ? (E.code[it.id] || {}).soumissions > 0 : E.reponses[it.id] !== undefined;
  const barre = document.querySelector('#progression > span');
  if (barre) barre.style.width = (100 * ITEMS.filter(faite).length / ITEMS.length) + '%';
  let h = '<div class="cadre"><aside class="plan"><div id="pastilles">', section = null, n = 0;
  ITEMS.forEach((it, i) => {
    if (it.nomSection !== section) { section = it.nomSection; h += '<div class="groupe">' + esc(section) + '</div>'; }
    const libelle = it.type === 'lecon' ? 'Leçon' : 'Question ' + (++n);
    h += '<button class="pastille' + (faite(it) ? ' faite' : '') + (i === E.courant ? ' courante' : '') + '" data-i="' + i + '" title="' + esc(it.theme) + '"' + (D.options.retour_arriere || i === E.courant ? '' : ' disabled') + '><span class="etat"></span><span class="libelle">' + libelle + '</span></button>';
  });
  return h + '</div></aside><div class="contenu">';
}
const FIN_CADRE = '</div></div>';
function navigation() {
  let h = '<div class="barre navigation">';
  if (D.options.retour_arriere) h += '<button id="prec"' + (E.courant === 0 ? ' disabled' : '') + '>Précédente</button>';
  if (E.courant < ITEMS.length - 1) h += '<button class="principal" id="suiv">Suivante</button>';
  return h + '<button id="finir">Terminer et corriger</button></div>';
}
function brancherNavigation() {
  const aller = i => { tic(); E.courant = i; sauver(); afficher(); };
  page.querySelectorAll('.pastille').forEach(b => b.onclick = () => aller(Number(b.dataset.i)));
  const p = document.getElementById('prec'); if (p) p.onclick = () => aller(E.courant - 1);
  const s = document.getElementById('suiv'); if (s) s.onclick = () => aller(E.courant + 1);
  document.getElementById('finir').onclick = () => {
    const manquantes = NOTEES.filter(it => it.type === 'code' ? !((E.code[it.id] || {}).soumissions > 0) : E.reponses[it.id] === undefined).length;
    if (manquantes && !confirm(manquantes + ' question(s) sans réponse ou jamais soumise(s). Terminer quand même ?')) return;
    tic();
    if (E.pauseDepuis) { E.pauseTotale = (E.pauseTotale || 0) + (Date.now() - E.pauseDepuis); E.pauseDepuis = null; }
    E.phase = 'bilan'; E.fin = Date.now(); sauver(); afficher();
  };
}

function epreuve() {
  tic();
  const q = ITEMS[E.courant];
  document.getElementById('position').textContent = q.nomSection + (q.type === 'lecon' ? ' · étape ' : ' · question ') + (E.courant + 1) + ' sur ' + ITEMS.length;
  if (q.type === 'lecon') E.vus[q.id] = true;
  if (q.cellules_initiales) return epreuveCode(q);
  if (q.type === 'lecon') return epreuveLecon(q);
  page.className = '';
  const rang = NOTEES.indexOf(q) + 1;
  let h = pastilles() + '<div class="carte question"><div class="surtitre"><span class="rang">Question ' + rang + ' sur ' + NOTEES.length + '</span><span class="chip">' + esc(q.theme) + '</span><span>temps visé ' + mmss(q.temps_cible_s) + '</span></div>' + rendre(q.enonce);
  h += '<p class="consigne">' + (q.multiple ? 'Une ou plusieurs réponses : coche toutes les affirmations justes, et seulement elles (notation tout ou rien).' : 'Une seule réponse.') + '</p>';
  E.ordre[q.id].forEach((oid, k) => {
    const o = q.options.find(x => x.id === oid);
    h += '<div class="option' + (choisies(q).includes(oid) ? ' choisie' : '') + '" data-o="' + oid + '"><span class="lettre' + (q.multiple ? ' carre' : '') + '">' + 'ABCDE'[k] + '</span><div>' + rendre(o.texte) + '</div></div>';
  });
  if (NSP_PERMIS) h += '<div class="option' + (E.reponses[q.id] === 'nsp' ? ' choisie' : '') + '" data-o="nsp"><span class="lettre">?</span><div><p>Je ne sais pas (compte comme faux, mais évite qu\'un hasard heureux masque une lacune)</p></div></div>';
  page.innerHTML = h + navigation() + '</div>' + FIN_CADRE;
  page.querySelectorAll('.option').forEach(el => el.onclick = () => {
    const o = el.dataset.o;
    if (q.multiple && o !== 'nsp') {
      const s = choisies(q), k = s.indexOf(o);
      if (k >= 0) s.splice(k, 1); else s.push(o);
      if (s.length) E.reponses[q.id] = s.sort(); else delete E.reponses[q.id];
    } else if (E.reponses[q.id] === o) delete E.reponses[q.id]; else E.reponses[q.id] = o;
    sauver(); afficher();
  });
  brancherNavigation();
  composer();
}

// ------------------------------------------------------------------ notebook
function epreuveLecon(q) {
  page.className = 'lecture';
  page.innerHTML = pastilles() + '<div class="carte enonce"><div class="surtitre"><span class="rang">Leçon</span><span class="chip">' + esc(q.theme) + '</span><span>environ ' + Math.round(q.temps_cible_s / 60) + ' min</span></div>' + rendreLecon(q) + navigation() + '</div>' + FIN_CADRE;
  brancherControles(q);
  brancherNavigation();
  composer();
}

// Points de contrôle : question corrigée dès le clic, non notée.
function rendreLecon(q) {
  const brut = rendre(q.contenu).replace(/<p>\[\[controle:([\w-]+)\]\]<\/p>/g, (_, cid) => '<div class="controle" data-c="' + cid + '"></div>');
  // Une partie par titre de niveau 2 ; dans chaque partie, un bloc par rubrique (problème, énoncé, preuve, exemple...).
  const source = document.createElement('div');
  source.innerHTML = brut;
  const parties = [];
  Array.from(source.childNodes).forEach(n => {
    if (n.nodeName === 'H3' || !parties.length) parties.push({ titre: n.nodeName === 'H3' ? n.textContent : 'Introduction', noeuds: [] });
    parties[parties.length - 1].noeuds.push(n);
  });
  const genre = t => /preuve/i.test(t) ? 'preuve' : /pi[èe]ge/i.test(t) ? 'pieges' : /exemple|exp[ée]rience/i.test(t) ? 'exemple'
    : /[ée]nonc[ée]/i.test(t) ? 'enonce-bloc' : /intuition/i.test(t) ? 'intuition' : /probl[èe]me/i.test(t) ? 'probleme'

// Une question du débrief : en-tête (numéro, titre, verdict), énoncé, réponses côte à côte, rubriques, à retenir.
function ficheDebrief(titre, noeuds) {
  const m = titre.match(/^(Question \d+)\s*:?\s*(.*)$/);
  const gras = n => n.nodeName === 'P' && n.firstChild && n.firstChild.nodeName === 'STRONG' ? n.firstChild.textContent.trim() : '';
  const reste = n => { const c = n.cloneNode(true); c.removeChild(c.firstChild); return c.innerHTML.trim(); };
  let enonce = '', ta = null, attendue = null, verdict = '', corps = '', retenir = '', revoir = '', etat = 'enonce';
  noeuds.forEach(n => {
    const g = gras(n), html = n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    if (/^Ta réponse/.test(g)) { ta = reste(n); etat = 'corps'; }
    else if (/^Réponse attendue/.test(g)) { attendue = reste(n); etat = 'corps'; }
    else if (/^Verdict/.test(g)) { verdict = reste(n); etat = 'corps'; }
    else if (/^À retenir/.test(g)) { retenir = '<h5>À retenir</h5><p>' + reste(n) + '</p>'; etat = 'retenir'; }
    else if (/^Leçon à revoir/.test(g)) { revoir = reste(n); etat = 'fin'; }
    else if (g && n.textContent.trim() === g) { corps += '<h5>' + esc(g.replace(/[.:]\s*$/, '')) + '</h5>'; etat = 'corps'; }
    else if (etat === 'enonce') enonce += n.nodeName === 'P' && /^Type :/.test(n.textContent) ? '<p class="meta">' + n.innerHTML + '</p>' : n.nodeName === 'UL' ? '<ul class="choix">' + n.innerHTML + '</ul>' : html;
    else if (etat === 'retenir') retenir += html;
    else corps += html;
  });
  const brut = verdict.replace(/<[^>]+>/g, '').trim();
  const v = /^juste/i.test(brut) ? ['v-juste', 'Juste'] : /^fausse/i.test(brut) ? ['v-fausse', 'Fausse'] : /^incompl/i.test(brut) ? ['v-incomplete', 'Incomplète']
    : /^non visible/i.test(brut) ? ['', 'Réponse non visible'] : ['', ''];
  const suite = brut.replace(/^[^.]*\.\s*/, '');
  let h = '<article class="fiche ' + v[0] + '"><header class="fiche-tete"><span class="num">' + esc(m[1]) + '</span><span class="titre">' + esc(m[2]) + '</span>'
    + (v[1] ? '<span class="verdict">' + v[1] + '</span>' : '') + '</header><div class="fiche-corps">';
  if (ta === null && attendue === null) return h + enonce + corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '') + '</div></article>';
  h += '<h5>Énoncé</h5>' + enonce;
  h += '<div class="fiche-reponses">' + (ta === null ? '' : '<div><span class="lab">Ta réponse</span>' + ta + '</div>') + '<div><span class="lab">Réponse attendue</span>' + (attendue || '') + '</div></div>';
  if (suite) h += '<p class="meta">' + verdict.replace(/^[^.]*\.\s*/, '') + '</p>';
  h += corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '');
  return h + '</div></article>';
}

// ------------------------------------------------------------------ éditeur
// Monaco (l'éditeur de VS Code) depuis cdnjs ; les suggestions, signatures et aides viennent de jedi
// dans le noyau, qui connaît les variables déjà exécutées. Sans connexion, repli sur une zone de texte simple.
const MONACO_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min';

const EDITEURS = [];
window.EDITEURS = EDITEURS;

function questionCode() { const q = ITEMS[E.courant]; return E.phase === 'epreuve' && q && q.cellules_initiales ? q : null; }
function chargerMonaco() {
  if (promesseMonaco) return promesseMonaco;
  promesseMonaco = new Promise(resolve => {
    const abandon = setTimeout(() => fini(null), 20000);
    function fini(m) { clearTimeout(abandon); if (window.MODE_EDITEUR === undefined) { MONACO = m; window.MODE_EDITEUR = m ? 'monaco' : 'simple'; } resolve(MONACO); }
    const s = document.createElement('script');

    s.onload = () => {

      window.require.config({ paths: { vs: MONACO_BASE + '/vs' } });
      window.require(['vs/editor/editor.main'], () => { try { configurerMonaco(window.monaco); fini(window.monaco); } catch (e) { fini(null); } }, () => fini(null));

async function aide(type, model, position) {
  const q = questionCode();

  catch (e) { return null; }
}
function configurerMonaco(m) {

  m.languages.registerCompletionItemProvider('python', {
    triggerCharacters: ['.'],
    provideCompletionItems: async (model, position) => {

function creerEditeur(conteneur, code, rappels) {
  if (MONACO) {
    const m = MONACO;
    const ed = m.editor.create(conteneur, {
      value: code, language: 'python', theme: sombre() ? 'vs-dark' : 'vs', fontSize: 14, tabSize: 4, insertSpaces: true,
      minimap: { enabled: false }, scrollBeyondLastLine: false, automaticLayout: true, lineNumbersMinChars: 3, folding: false,
      glyphMargin: false, renderLineHighlight: 'none', overviewRulerLanes: 0, wordBasedSuggestions: 'off', fixedOverflowWidgets: true,
      quickSuggestions: { other: true, comments: false, strings: false }, padding: { top: 6, bottom: 6 },

    // Sous Windows, Monaco utilise des fins de ligne \r\n ; le code est toujours lu avec des \n, comme dans un notebook.
    const lire = () => ed.getModel().getValue(m.editor.EndOfLinePreference.LF);
    const hauteur = () => { conteneur.style.height = Math.max(38, ed.getContentHeight()) + 'px'; };
    ed.onDidContentSizeChange(hauteur); hauteur();
    ed.onDidChangeModelContent(() => rappels.modif(lire()));
    ed.onDidFocusEditorText(rappels.focus);
    ed.addCommand(m.KeyMod.Shift | m.KeyCode.Enter, rappels.executerSuivant, '!suggestWidgetVisible');

  }

  zone.value = code;
  conteneur.appendChild(zone);
  zone.addEventListener('input', () => { rappels.modif(zone.value); ajuster(zone); });
  zone.addEventListener('focus', rappels.focus);
  zone.addEventListener('keydown', ev => clavier(ev, zone, rappels));
  setTimeout(() => ajuster(zone));

}

function majNumeros(q) { document.querySelectorAll('#cellules .numero').forEach((n, i) => { const c = E.cellules[q.id][i]; n.textContent = '[' + (c && c.numero !== null ? c.numero : ' ') + ']'; }); }
function ajuster(zone) { zone.style.height = 'auto'; zone.style.height = (zone.scrollHeight + 2) + 'px'; }

function inserer(zone, texte) {

function clavier(ev, zone, rappels) {
  if (ev.key === 'Enter' && (ev.shiftKey || ev.ctrlKey)) {
    ev.preventDefault();
    if (ev.shiftKey) rappels.executerSuivant(); else rappels.executer();
    return;
  }
  const debut = zone.selectionStart, fin = zone.selectionEnd, v = zone.value;
  const debutLigne = v.lastIndexOf('\n', debut - 1) + 1;

    if (!ev.shiftKey && !multi) { inserer(zone, '    '); return; }
    const finBloc = fin;
    const bloc = v.slice(debutLigne, finBloc);
    const nouveau = ev.shiftKey ? bloc.replace(/^ {1,4}/gm, '') : bloc.replace(/^/gm, '    ');
    zone.setSelectionRange(debutLigne, finBloc);

    inserer(zone, '\n' + retrait);
  }
}

async function executerCellule(q, i) {
  if (!SERVEUR) return false;
  const c = E.cellules[q.id][i];

  let r;

  catch (e) { r = { erreur: 'Serveur injoignable : lancer.py est-il démarré ?' }; }

  sauver();
  const d = document.querySelectorAll('#cellules .cellule')[i];
  if (d) { d.querySelector('.numero').textContent = '[' + c.numero + ']'; d.querySelector('pre.sortie').innerHTML = h; }
  return !r.erreur;
}

function codeSource(q) { return E.cellules[q.id].map((c, i) => '# %% cellule ' + (i + 1) + '\n' + c.code).join('\n\n') + '\n'; }
function afficherEtatSoumission(q) {
  const s = E.code[q.id] || {};
  const z = document.getElementById('etatSoumission');
  if (z) z.textContent = s.soumissions ? s.soumissions + ' soumission(s) · dernière : ' + s.caches_reussis + '/' + s.caches_total + ' tests cachés réussis' : 'jamais soumis';
}
async function lancerTests(q, mode) {
  const zone = document.getElementById('resultatsTests');
  zone.innerHTML = '<p class="meta">' + (mode === 'visibles' ? 'Tests visibles' : 'Tests cachés') + ' en cours...</p>';
  let r;
  try { r = await api('/api/tests', { session: SESSION, dossier: q.dossier, module: q.module_tests, mode }); }
  catch (e) { r = { erreur: 'Serveur injoignable : lancer.py est-il démarré ?' }; }
  if (r.erreur) { zone.innerHTML = '<pre class="sans-math"><span class="erreur">' + esc(r.erreur) + '</span></pre>'; return; }
  let h = '<p class="etiquette ' + (r.reussis === r.total ? 'bon' : 'faux') + '">' + (mode === 'visibles' ? 'Tests visibles : ' : 'Tests cachés : ') + r.reussis + '/' + r.total + ' réussis</p>';
  if (mode === 'visibles') {
    h += '<div class="defile"><table><tr><th>Test</th><th>Résultat</th><th>Attendu</th><th>Obtenu</th><th class="nombre">Durée</th></tr>';
    r.resultats.forEach(t => { h += '<tr><td>' + esc(t.nom) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec') + '</td><td><code class="sans-math">' + esc(t.attendu) + '</code></td><td><code class="sans-math">' + esc(t.obtenu ?? '') + '</code></td><td class="nombre">' + t.duree_s + ' s</td></tr>'; });
    h += '</table></div>';
    r.resultats.filter(t => t.erreur).forEach(t => { h += '<pre class="sans-math"><span class="erreur">' + esc(t.nom + ' :\n' + t.erreur) + '</span></pre>'; });
    E.code[q.id] = Object.assign(E.code[q.id] || {}, { visibles_reussis: r.reussis });
  } else {
    h += '<div class="defile"><table><tr><th>Test caché</th><th>Résultat</th></tr>';
    r.resultats.forEach((t, k) => { h += '<tr><td>Test ' + (k + 1) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec' + (t.erreur ? ' (exception ou temps dépassé)' : '')) + '</td></tr>'; });
    h += '</table></div>';
    const s = E.code[q.id] || {};
    E.code[q.id] = Object.assign(s, { soumissions: (s.soumissions || 0) + 1, caches_reussis: r.reussis, caches_total: r.total, details: r.resultats, code_source: codeSource(q) });
    afficherEtatSoumission(q);
    const p = page.querySelector('.pastille.courante'); if (p) p.classList.add('faite');
  }
  sauver();
  zone.innerHTML = h;
}

// ------------------------------------------------------------------ bilan
function points(q) {
  if (q.type === 'code') { const c = E.code[q.id]; return c && c.soumissions ? c.caches_reussis / c.caches_total : 0; }
  const r = E.reponses[q.id];
  if (r === undefined || r === 'nsp') return 0;
  // Une question à plusieurs réponses est notée tout ou rien : l'ensemble coché doit être exactement l'ensemble juste.
  const s = choisies(q), bonnes = q.options.filter(o => o.correcte).map(o => o.id);
  return s.length === bonnes.length && bonnes.every(b => s.includes(b)) ? 1 : -D.options.penalite;
}
function choisies(q) { const r = E.reponses[q.id]; return r === undefined || r === 'nsp' ? [] : Array.isArray(r) ? r.slice() : [r]; }
function texteOption(q, id) { const o = q.options.find(x => x.id === id); return o ? o.texte : null; }

function resultatJSON(duree) {
  return {
    examen: D.id, debut: new Date(E.debut).toISOString(), duree_s: Math.round(duree), pauses_s: Math.round((E.pauseTotale || 0) / 1000), options: D.options,
    lecons: ITEMS.filter(q => q.type === 'lecon').map(q => {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      return { id: q.id, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), controles_justes_du_premier_coup: justes, controles_total: ids.length };
    }),
    questions: NOTEES.map(q => {
      const base = { id: q.id, type: q.type, section: q.section, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), temps_cible_s: q.temps_cible_s, points: Number(points(q).toFixed(4)) };
      if (q.type === 'code') {
        const c = E.code[q.id] || {};
        return Object.assign(base, { soumissions: c.soumissions || 0, caches_reussis: c.caches_reussis || 0, caches_total: c.caches_total || q.tests_caches, visibles_reussis: c.visibles_reussis ?? null, code_source: c.code_source || codeSource(q) });
      }
      const r = E.reponses[q.id] ?? null;
      return Object.assign(base, { reponse: r, reponse_texte: r && r !== 'nsp' ? choisies(q).map(i => texteOption(q, i)).join(' ; ') : null, bonne_reponse_texte: q.options.filter(o => o.correcte).map(o => o.texte).join(' ; ') });
    })
  };
}

function bilan() {
  page.className = '';
  document.getElementById('position').textContent = 'Bilan';
  const duree = dureeEcoulee(E.fin);
  document.getElementById('chrono').textContent = mmss(duree);
  let total = 0;
  let h = '<div class="carte"><h2>Bilan</h2>@SCORE@<div class="defile"><table><tr><th>Section</th><th class="nombre">Score</th><th class="nombre">Temps passé</th><th class="nombre">Temps indicatif</th></tr>';
  D.sections.forEach(s => {
    const notees = s.questions.filter(q => q.type !== 'lecon');
    const pts = notees.reduce((a, q) => a + points(q), 0);
    const t = s.questions.reduce((a, q) => a + (E.temps[q.id] || 0), 0);
    total += pts;
    h += '<tr><td>' + esc(s.nom) + '</td><td class="nombre">' + (notees.length ? pts.toFixed(2).replace('.', ',') + ' / ' + notees.length : 'non notée') + '</td><td class="nombre">' + mmss(t) + '</td><td class="nombre">' + mmss(s.budget_min * 60) + '</td></tr>';
  });
  h += '<tr><th>Total</th><th class="nombre">' + total.toFixed(2).replace('.', ',') + ' / ' + NOTEES.length + '</th><th class="nombre">' + mmss(duree) + '</th><th class="nombre">' + mmss(D.duree_minutes * 60) + '</th></tr></table></div>';
  h = h.replace('@SCORE@', '<div class="score-total"><strong>' + total.toFixed(2).replace('.', ',').replace(/,00$/, '') + ' / ' + NOTEES.length + '</strong><span class="meta">en ' + mmss(duree) + '</span></div>');
  const barreFin = document.querySelector('#progression > span'); if (barreFin) barreFin.style.width = '100%';
  h += '<p id="enregistrement" class="meta"></p>';
  h += '<details><summary>Résultat brut (JSON)</summary><textarea readonly class="json sans-math" id="json"></textarea><div class="barre"><button id="telecharger">Enregistrer le fichier</button></div></details>';
  h += '<div class="barre">' + (SERVEUR ? '<button class="principal" id="retourAccueil">Retour à l\'accueil (séance suivante)</button>' : '')
    + '<button id="recommencer">Effacer et recommencer</button></div></div>';
  ITEMS.forEach((q, i) => {
    const temps = mmss(E.temps[q.id] || 0) + ' sur ' + mmss(q.temps_cible_s) + ' visés';
    const tete = (classe, verdict) => '<article class="fiche ' + classe + '"><header class="fiche-tete"><span class="num">' + (q.type === 'lecon' ? 'Leçon' : 'Question ' + (i + 1)) + '</span><span class="titre">' + esc(q.theme)
      + '</span><span class="temps">' + esc(q.nomSection) + ' · ' + temps + '</span>' + (verdict ? '<span class="verdict">' + verdict + '</span>' : '') + '</header><div class="fiche-corps">';
    if (q.type === 'lecon') {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      h += tete('', '') + '<p>Points de contrôle justes du premier coup : ' + justes + ' sur ' + ids.length + '. La leçon reste consultable depuis la séance.</p></div></article>';
      return;
    }
    if (q.type === 'qcm') {
      const r = E.reponses[q.id], juste = points(q) === 1;
      const s = choisies(q), incomplete = !juste && q.multiple && s.length > 0 && s.every(id => q.options.find(o => o.id === id).correcte);
      h += tete(juste ? 'v-juste' : incomplete ? 'v-incomplete' : r === undefined || r === 'nsp' ? '' : 'v-fausse',
        juste ? 'Juste' : r === undefined ? 'Sans réponse' : r === 'nsp' ? 'Je ne sais pas' : incomplete ? 'Incomplète' : 'Fausse');
      h += '<h5>Énoncé</h5>' + rendre(q.enonce) + '<h5>' + (q.multiple ? 'Options (plusieurs réponses, tout ou rien)' : 'Options') + '</h5>';
      E.ordre[q.id].forEach((oid, k) => {
        const o = q.options.find(x => x.id === oid), choisie = s.includes(oid);
        const puces = (o.correcte ? '<span class="puce bon">' + (q.multiple ? 'Juste' : 'Bonne réponse') + '</span>' : '') + (choisie ? '<span class="puce' + (o.correcte ? ' bon' : ' faux') + '">Ta réponse</span>' : '');
        h += '<div class="option ' + (o.correcte ? 'juste' : 'fausse') + (choisie ? ' choisie' : '') + '"><span class="lettre">' + 'ABCDE'[k] + '</span><div>' + puces + rendre(o.texte)
          + '<div class="explication">' + (o.correcte && !q.multiple ? '' : rendre(o.explication)) + '</div></div></div>';
      });
      h += '<h5>Correction</h5>' + rendre(q.solution);
    } else {
      const c = E.code[q.id] || {};
      const tout = c.soumissions && c.caches_reussis === c.caches_total;
      h += tete(tout ? 'v-juste' : c.soumissions ? 'v-incomplete' : '', c.soumissions ? c.caches_reussis + ' / ' + c.caches_total + ' tests cachés' : 'Jamais soumis');
      h += '<details><summary>Énoncé</summary>' + rendre(q.enonce) + '</details>';
      if (c.details) {
        h += '<h5>Tests cachés</h5><div class="defile"><table><tr><th>Test caché</th><th>Résultat</th><th>Attendu</th><th>Obtenu</th></tr>';
        c.details.forEach(t => { h += '<tr><td>' + esc(t.nom) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec') + '</td><td><code class="sans-math">' + esc(t.attendu) + '</code></td><td><code class="sans-math">' + esc(t.obtenu ?? (t.erreur ? 'exception' : '')) + '</code></td></tr>'; });
        h += '</table></div>';
        c.details.filter(t => t.erreur).forEach(t => { h += '<details><summary>Erreur : ' + esc(t.nom) + '</summary><pre class="sans-math">' + esc(t.erreur) + '</pre></details>'; });
      }
      h += '<details><summary>Ton code soumis</summary><pre class="sans-math"><code>' + esc(c.code_source || codeSource(q)) + '</code></pre></details>';
      h += '<details><summary>Correction</summary>' + rendre(q.solution) + '</details>';
    }
    h += '<p class="revoir">Vérification des nombres : <code class="sans-math">' + esc(q.verif.script) + '</code></p></div></article>';
  });
  page.innerHTML = h;
  const resultat = resultatJSON(duree);
  const zone = document.getElementById('json');
  zone.value = JSON.stringify(resultat, null, 1);
  document.getElementById('telecharger').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([zone.value], { type: 'application/json' }));
    a.download = D.id + '_resultat.json'; a.click();
  };
  const retour = document.getElementById('retourAccueil'); if (retour) retour.onclick = () => { location.href = '/'; };
  document.getElementById('recommencer').onclick = () => { if (confirm('Effacer ce passage ?')) { try { localStorage.removeItem(CLE); } catch (e) {} E = etatNeuf('accueil'); afficher(); } };
  const info = document.getElementById('enregistrement');
  if (E.enregistrement) info.textContent = E.enregistrement;
  else if (!SERVEUR) info.textContent = 'Page ouverte comme un fichier : le résultat n\'est pas enregistré automatiquement. Copie le JSON ci-dessous dans la conversation.';
  else {
    info.textContent = 'Enregistrement du résultat...';
    api('/api/resultat', resultat).then(r => {
      E.enregistrement = r.erreur ? null : 'Résultat enregistré dans ' + r.fichier + ' ; ' + r.erreurs_ajoutees + ' erreur(s) ajoutée(s) au journal suivi/erreurs.md.';
      info.textContent = E.enregistrement || 'Échec de l\'enregistrement : ' + r.erreur;
      sauver();
    }).catch(() => { info.textContent = 'Serveur injoignable : le résultat n\'est pas enregistré. Copie le JSON ci-dessous dans la conversation.'; });
  }
  composer();
}

function afficher() {
  libererEditeurs();
  document.getElementById('titre').textContent = D.titre;
  document.title = D.titre;
  if (E.phase === 'epreuve') epreuve(); else if (E.phase === 'bilan') bilan(); else accueil();
  window.scrollTo(0, 0);
}
function completerEtat() {
  ['reponses', 'temps', 'ordre', 'cellules', 'code', 'controles', 'ordreControles', 'vus', 'partie'].forEach(k => { if (!E[k] || typeof E[k] !== 'object') E[k] = {}; });
  if (typeof E.courant !== 'number' || E.courant < 0 || E.courant >= ITEMS.length) E.courant = 0;
  ITEMS.forEach(q => {
    if (q.cellules_initiales && !Array.isArray(E.cellules[q.id])) E.cellules[q.id] = q.cellules_initiales.map(c => ({ code: c, sortie: '', numero: null }));
    if (q.type === 'qcm') {
      const ids = q.options.map(o => o.id);
      const o = E.ordre[q.id];
      if (!Array.isArray(o) || o.length !== ids.length || !ids.every(i => o.includes(i))) E.ordre[q.id] = melanger(ids);
      const rep = E.reponses[q.id];
      if (rep !== undefined && rep !== 'nsp' && (Array.isArray(rep) !== !!q.multiple || !choisies(q).length || !choisies(q).every(i => ids.includes(i)))) delete E.reponses[q.id];
    }
    if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => {
      const cle = q.id + ':' + cid;
      if (!Array.isArray(E.ordreControles[cle])) E.ordreControles[cle] = melanger(c.options.map(o => o.id));
    });
  });
}
charger();
completerEtat();
if (SERVEUR && ITEMS.some(q => q.cellules_initiales)) chargerMonaco();
afficher();
</script>
