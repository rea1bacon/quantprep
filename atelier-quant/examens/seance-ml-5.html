juste une régression linéaire pénalisée sur des données qui comptent beaucoup plus de variables que d'observations ; les variables sont standardisées. On souhaite un modèle que l'on puisse lire, c'est-à-dire qui retienne peu de variables.\n\nLesquelles de ces affirmations sont justes ?", "options": [{"id": "a", "texte": "Avec une pénalité L1 assez forte, des coefficients sont exactement nuls : le modèle retient un sous-ensemble de variables.", "correcte": true, "explication": "Vrai : un coefficient du Lasso reste nul tant que la corrélation de sa variable avec le résidu ne dépasse pas la pénalité en valeur absolue ; au-delà d'un seuil de pénalité, tous sont nuls."}, {"id": "b", "texte": "Avec une pénalité L2 seule, la solution est unique même quand il y a plus de variables que d'observations, mais elle ne met aucun coefficient exactement à zéro, sauf cas de probabilité nulle.", "correcte": true, "explication": "Vrai : la matrice du système Ridge est définie positive pour toute pénalité strictement positive, d'où l'unicité ; et un coefficient Ridge ne s'annule que sur un ensemble de données de probabilité nulle."}, {"id": "c", "texte": "Si deux variables sont exactement identiques, l'elastic net, dont la pénalité contient une part L2 non nulle, leur donne le même coefficient, alors que le problème L1 seul n'a pas toujours une solution unique.", "correcte": true, "explication": "Vrai : la part L2 rend le critère strictement convexe, donc la solution unique ; échanger les deux coefficients donne une solution, qui est donc la même. Avec L1 seule, tout partage d'un même total entre les deux copies, à signes égaux, a le même critère."}, {"id": "d", "texte": "Si l'erreur d'apprentissage est très inférieure à l'erreur de validation, il faut diminuer la pénalité ou ajouter des variables construites à partir des premières.", "correcte": false, "explication": "Faux : cet écart signale une forte variance. Diminuer la pénalité ou ajouter des variables augmente la complexité, donc l'aggrave ; il faut au contraire régulariser davantage ou simplifier."}], "solution": "Réponse : trois affirmations sont justes : celle sur la pénalité L1 (coefficients exactement nuls, sélection de variables), celle sur la pénalité L2 (solution unique, aucun zéro exact) et celle sur l'elastic net (même coefficient pour deux variables identiques). Celle qui propose de diminuer la pénalité ou d'ajouter des variables est fausse.\n\nÉtape 1 : conditions d'optimalité du Lasso, avec \\(g_j\\) le produit scalaire de la colonne \\(j\\) et du résidu, et \\(\\lambda\\) la pénalité : un coefficient non nul exige \\(\\lvert g_j \\rvert = \\lambda\\), un coefficient nul vérifie \\(\\lvert g_j \\rvert \\le \\lambda\\) ; au-delà d'un seuil de \\(\\lambda\\), tous sont nuls (séance de ML 1, partie 5).\n\nÉtape 2 : Ridge : \\(\\mathbf{X}^\\top \\mathbf{X} + \\lambda\\mathbf{I}\\) est définie positive, la solution est unique quel que soit le rang, sans zéro exact hors cas de probabilité nulle (séance de ML 1, partie 4).\n\nÉtape 3 : entre variables presque identiques, le Lasso choisit de façon instable ; l'elastic net, strictement convexe, donne le même coefficient à deux colonnes identiques (leçon, partie 5.5, EN1).\n\nÉtape 4 : un écart entre erreur d'apprentissage et erreur de validation se traite en réduisant la variance : plus de pénalité, moins de variables, plus de données (partie 5.6).", "type": "qcm", "multiple": true, "reponse": "Avec une pénalité L1 assez forte, des coefficients sont exactement nuls : le modèle retient un sous-ensemble de variables. ; Avec une pénalité L2 seule, la solution est unique même quand il y a plus de variables que d'observations, mais elle ne met aucun coefficient exactement à zéro, sauf cas de probabilité nulle. ; Si deux variables sont exactement identiques, l'elastic net, dont la pénalité contient une part L2 non nulle, leur donne le même coefficient, alors que le problème L1 seul n'a pas toujours une solution unique.", "fiche": null, "verif": {"script": "verif/seance_ml_5.py", "cles": []}}]}, {"id": "mla", "nom": "Machine Learning avancé", "budget_min": 14, "questions": [{"id": "ML5-01", "section": "mla", "theme": "Réseau convolutif : forme après deux branches, concaténation et pooling", "difficulte": 2, "temps_cible_s": 90, "enonce": "Une image de forme \\(128 \\times 128 \\times 3\\) (hauteur, largeur, canaux) entre dans deux branches, qui lisent toutes deux l'image :\n\n- branche A : convolution \\(5 \\times 5\\) à 12 filtres, pas 2, remplissage de 2 zéros de chaque côté ;\n- branche B : max-pooling \\(3 \\times 3\\) de pas 2 avec un remplissage de 1 de chaque côté, suivi d'une convolution \\(1 \\times 1\\) à 20 filtres, de pas 1, sans remplissage.\n\nLes deux sorties sont concaténées selon l'axe des canaux, puis on applique un max-pooling \\(2 \\times 2\\) de pas 2 sans remplissage.\n\nQuelle est la forme du tenseur final ?", "options": [{"id": "a", "texte": "\\(32 \\times 32 \\times 32\\)", "correcte": true, "explication": "Oui : chaque branche sort en \\(64 \\times 64\\), avec 12 et 20 canaux ; la concaténation additionne les canaux, et le dernier pooling divise la taille spatiale par 2 sans toucher aux canaux."}, {"id": "b", "texte": "\\(64 \\times 64 \\times 32\\)", "correcte": false, "explication": "C'est la forme après la concaténation : le dernier max-pooling \\(2 \\times 2\\) de pas 2 a été oublié. Il ramène la taille spatiale à \\(\\lfloor 64/2 \\rfloor\\)."}, {"id": "c", "texte": "\\(32 \\times 32 \\times 240\\)", "correcte": false, "explication": "Les nombres de canaux ont été multipliés (\\(12 \\times 20\\)). Concaténer met les canaux bout à bout : \\(12 + 20\\)."}, {"id": "d", "texte": "\\(32 \\times 32 \\times 35\\)", "correcte": false, "explication": "Les 3 canaux de l'image ont été ajoutés aux 12 et aux 20. Or la sortie d'une convolution a autant de canaux que de filtres, quels que soient les canaux d'entrée, et l'image elle-même n'est pas concaténée."}], "solution": "Réponse : \\(32 \\times 32 \\times 32\\).\n\nFormule par axe (leçon, partie 1.1, C1) : \\(\\lfloor (n + 2p - k)/s \\rfloor + 1\\) pour une taille \\(n\\), un noyau \\(k\\), un remplissage \\(p\\), un pas \\(s\\) (dilatation 1).\n\nÉtape 1, branche A : \\(\\lfloor (128 + 4 - 5)/2 \\rfloor + 1 = 63 + 1 = 64\\) ; 12 filtres, donc \\(64 \\times 64 \\times 12\\).\n\nÉtape 2, branche B : pooling \\(\\lfloor (128 + 2 - 3)/2 \\rfloor + 1 = 64\\), canaux inchangés (3) ; la convolution \\(1 \\times 1\\) garde la taille et sort 20 canaux : \\(64 \\times 64 \\times 20\\).\n\nÉtape 3 : mêmes dimensions spatiales, la concaténation est possible : \\(64 \\times 64 \\times 32\\) (C3).\n\nÉtape 4 : max-pooling \\(2 \\times 2\\) de pas 2 : \\(\\lfloor 64/2 \\rfloor = 32\\), canaux inchangés.\n\nLe script refait l'enchaînement par une vraie convolution numpy sur une image huit fois plus petite.", "type": "qcm", "multiple": false, "reponse": "\\(32 \\times 32 \\times 32\\)", "fiche": null, "verif": {"script": "verif/seance_ml_5.py", "cles": ["Q01_brancheA", "Q01_brancheB", "Q01_canaux", "Q01_d_entree", "Q01_d_produit", "Q01_sortie"]}}, {"id": "ML5-02", "section": "mla", "theme": "Réseau convolutif : quand peut-on concaténer ou additionner", "difficulte": 4, "temps_cible_s": 120, "correctes": ["a", "c"], "enonce": "Une carte d'activations de forme \\(64 \\times 64 \\times 16\\) (hauteur, largeur, canaux) entre dans plusieurs couches, chacune lisant directement cette carte. Toutes les convolutions ont une dilatation de 1 ; « remplissage \\(p\\) » signifie \\(p\\) zéros ajoutés de chaque côté. Aucun rognage ni complément n'est appliqué aux sorties.\n\nLesquelles de ces affirmations sont justes ?", "options": [{"id": "a", "texte": "Les sorties d'une convolution \\(3 \\times 3\\) à 32 filtres (pas 1, remplissage 1) et d'une convolution \\(5 \\times 5\\) à 8 filtres (pas 1, remplissage 2) peuvent être concaténées selon les canaux, et le résultat a la forme \\(64 \\times 64 \\times 40\\).", "correcte": true, "explication": "Vrai : \\(64 + 2 - 3 + 1 = 64\\) et \\(64 + 4 - 5 + 1 = 64\\), mêmes dimensions spatiales ; les canaux s'additionnent, \\(32 + 8\\)."}, {"id": "b", "texte": "Les deux sorties de l'affirmation précédente peuvent aussi être additionnées terme à terme, comme dans une connexion résiduelle.", "correcte": false, "explication": "Faux : l'addition terme à terme exige la même forme, canaux compris ; ici 32 canaux d'un côté et 8 de l'autre. C'est la différence entre concaténer et additionner."}, {"id": "c", "texte": "Les sorties d'une convolution \\(3 \\times 3\\) à 32 filtres (pas 2, remplissage 1) et d'un max-pooling \\(2 \\times 2\\) de pas 2 sans remplissage peuvent être concaténées selon les canaux, et le résultat a la forme \\(32 \\times 32 \\times 48\\).", "correcte": true, "explication": "Vrai : \\(\\lfloor (64 + 2 - 3)/2 \\rfloor + 1 = 32\\) pour la convolution, \\(\\lfloor 64/2 \\rfloor = 32\\) pour le pooling, qui garde ses 16 canaux : \\(32 + 16\\) canaux."}, {"id": "d", "texte": "Les sorties d'une convolution \\(3 \\times 3\\) à 16 filtres et d'une convolution \\(5 \\times 5\\) à 16 filtres, toutes deux de pas 1 et sans remplissage, peuvent être concaténées selon les canaux, puisqu'elles ont le même nombre de filtres.", "correcte": false, "explication": "Faux : sans remplissage, les tailles spatiales valent \\(62\\) et \\(60\\). La concaténation selon les canaux demande les mêmes dimensions spatiales ; le nombre de filtres, lui, est libre."}], "solution": "Réponse : les affirmations sur les convolutions remplies \\(3 \\times 3\\) et \\(5 \\times 5\\) (forme \\(64 \\times 64 \\times 40\\)) et sur la convolution de pas 2 avec le max-pooling (forme \\(32 \\times 32 \\times 48\\)) sont justes ; les deux autres sont fausses.\n\nRègle (leçon, partie 1.3, C3) : concaténer selon les canaux exige les mêmes dimensions spatiales, et les canaux s'additionnent ; additionner exige la même forme complète.\n\nÉtape 1 : tailles par (C1). Remplissage 1 et noyau 3, pas 1 : \\(64\\). Remplissage 2 et noyau 5, pas 1 : \\(64\\). Noyau 3, pas 2, remplissage 1 : \\(32\\). Pooling 2 de pas 2 : \\(32\\). Sans remplissage, noyaux 3 et 5 : \\(62\\) et \\(60\\).\n\nÉtape 2 : les deux premières paires ont des dimensions spatiales égales, donc se concatènent ; la dernière non.\n\nÉtape 3 : l'addition des sorties à 32 et 8 canaux est impossible, puisque \\(32 \\ne 8\\).", "type": "qcm", "multiple": true, "reponse": "Les sorties d'une convolution \\(3 \\times 3\\) à 32 filtres (pas 1, remplissage 1) et d'une convolution \\(5 \\times 5\\) à 8 filtres (pas 1, remplissage 2) peuvent être concaténées selon les canaux, et le résultat a la forme \\(64 \\times 64 \\times 40\\). ; Les sorties d'une convolution \\(3 \\times 3\\) à 32 filtres (pas 2, remplissage 1) et d'un max-pooling \\(2 \\times 2\\) de pas 2 sans remplissage peuvent être concaténées selon les canaux, et le résultat a la forme \\(32 \\times 32 \\times 48\\).", "fiche": null, "verif": {"script": "verif/seance_ml_5.py", "cles": ["Q02_a1", "Q02_a2", "Q02_a_canaux", "Q02_c1", "Q02_c2", "Q02_c_canaux", "Q02_d1", "Q02_d2"]}}, {"id": "ML5-04", "section": "mla", "theme": "Segmentation à deux classes : sortie, perte et métrique", "difficulte": 3, "temps_cible_s": 100, "correctes": ["a", "b", "d"], "enonce": "On entraîne un réseau de segmentation à deux classes (objet, fond) sur des paires (image, masque). Dans les masques, 4 % des pixels sont de la classe « objet ». L'**exactitude par pixel** est la proportion de pixels bien classés. Le **coefficient de Dice** de la classe « objet » est le double du nombre de pixels « objet » à la fois dans la prédiction et dans le vrai masque, divisé par la somme des nombres de pixels « objet » de la prédiction et du vrai masque.\n\nLesquelles de ces affirmations sont justes ?", "options": [{"id": "a", "texte": "Une carte de sortie à un canal suivie d'une sigmoïde, entraînée avec l'entropie croisée binaire moyennée sur les pixels, est un choix cohérent.", "correcte": true, "explication": "Vrai : chaque pixel est une classification binaire, modélisée par une loi de Bernoulli de paramètre \\(\\mathrm{sig}(z)\\), dont l'opposé de la log-vraisemblance est l'entropie croisée binaire."}, {"id": "b", "texte": "Une carte de sortie à deux canaux suivie d'un softmax, entraînée avec l'entropie croisée catégorielle par pixel, décrit la même famille de modèles que le choix précédent.", "correcte": true, "explication": "Vrai : avec deux logits \\(z_0\\) et \\(z_1\\), le softmax donne \\(\\mathrm{sig}(z_1 - z_0)\\) pour la classe 1 ; les deux écritures donnent les mêmes probabilités et la même perte."}, {"id": "c", "texte": "Un modèle dont l'exactitude par pixel atteint \\(0{,}96\\) segmente nécessairement bien l'objet.", "correcte": false, "explication": "Faux : le masque « tout en fond » classe bien les 96 % de pixels de fond et obtient exactement cette exactitude, avec un rappel et un Dice nuls sur l'objet."}, {"id": "d", "texte": "Le coefficient de Dice de la classe « objet » ne dépend pas du nombre de pixels de fond correctement classés.", "correcte": true, "explication": "Vrai : il vaut \\(2\\,\\mathrm{VP}/(2\\,\\mathrm{VP} + \\mathrm{FP} + \\mathrm{FN})\\) ; les vrais négatifs, c'est-à-dire les pixels de fond bien classés, n'y figurent pas. C'est ce qui le rend utile quand l'objet est rare."}], "solution": "Réponse : trois affirmations sont justes : les deux sur la sortie et la perte (un canal avec sigmoïde et entropie croisée binaire ; deux canaux avec softmax et entropie croisée catégorielle, équivalents) et celle sur le coefficient de Dice, qui ignore les pixels de fond bien classés. Celle sur l'exactitude par pixel est fausse.\n\nÉtape 1 : la segmentation est une classification par pixel ; la perte est l'opposé de la log-vraisemblance du modèle de sortie (leçon, partie 2.4, V1).\n\nÉtape 2 : le softmax à deux classes vaut \\(e^{z_1}/(e^{z_0} + e^{z_1}) = \\mathrm{sig}(z_1 - z_0)\\) (V3) : même famille de modèles.\n\nÉtape 3 : un masque entièrement « fond » a une exactitude de \\(1 - 0{,}04 = 0{,}96\\) : l'exactitude par pixel ne suffit pas quand l'objet est rare.\n\nÉtape 4 : avec VP, FP et FN les nombres de vrais positifs, faux positifs et faux négatifs de la classe « objet », le Dice vaut \\(2\\,\\mathrm{VP}/(2\\,\\mathrm{VP} + \\mathrm{FP} + \\mathrm{FN})\\) : les vrais négatifs n'y entrent pas (partie 2.5).", "type": "qcm", "multiple": true, "reponse": "Une carte de sortie à un canal suivie d'une sigmoïde, entraînée avec l'entropie croisée binaire moyennée sur les pixels, est un choix cohérent. ; Une carte de sortie à deux canaux suivie d'un softmax, entraînée avec l'entropie croisée catégorielle par pixel, décrit la même famille de modèles que le choix précédent. ; Le coefficient de Dice de la classe « objet » ne dépend pas du nombre de pixels de fond correctement classés.", "fiche": null, "verif": {"script": "verif/seance_ml_5.py", "cles": ["Q04_fond"]}}, {"id": "ML5-05", "section": "mla", "theme": "Segmentation : coefficient de Dice et IoU", "difficulte": 3, "temps_cible_s": 90, "enonce": "Sur une image, un modèle de segmentation prédit « objet » pour 50 pixels. Le vrai masque contient 70 pixels « objet », et 40 pixels sont « objet » à la fois dans la prédiction et dans le vrai masque.\n\nQue valent le coefficient de Dice et l'IoU (intersection sur union) de cette prédiction ?", "options": [{"id": "a", "texte": "Dice \\(= \\tfrac{2}{3}\\) et IoU \\(= \\tfrac{1}{2}\\)", "correcte": true, "explication": "Oui : Dice \\(= 2 \\times 40/(50 + 70)\\) et IoU \\(= 40/(50 + 70 - 40)\\) ; on retrouve Dice \\(= 2\\,\\mathrm{IoU}/(1 + \\mathrm{IoU})\\)."}, {"id": "b", "texte": "Dice \\(= \\tfrac{1}{2}\\) et IoU \\(= \\tfrac{2}{3}\\)", "correcte": false, "explication": "Les deux mesures ont été échangées. Un contrôle rapide : le Dice est toujours supérieur ou égal à l'IoU, avec égalité seulement en 0 et en 1."}, {"id": "c", "texte": "Dice \\(= \\tfrac{1}{3}\\) et IoU \\(= \\tfrac{1}{2}\\)", "correcte": false, "explication": "Le facteur 2 du Dice a été oublié : \\(40/(50 + 70)\\). Sans lui, une prédiction parfaite aurait un Dice de \\(\\tfrac12\\) au lieu de 1."}, {"id": "d", "texte": "Dice \\(= \\tfrac{2}{3}\\) et IoU \\(= \\tfrac{1}{3}\\)", "correcte": false, "explication": "L'union a été prise égale à \\(50 + 70\\), ce qui compte deux fois les 40 pixels communs. L'union contient \\(50 + 70 - 40 = 80\\) pixels."}], "solution": "Réponse : Dice \\(= \\tfrac{2}{3}\\) et IoU \\(= \\tfrac{1}{2}\\).\n\nNotations : \\(A\\) est l'ensemble des pixels prédits « objet », \\(B_0\\) celui des pixels réellement « objet », \\(\\lvert \\cdot \\rvert\\) le nombre de pixels.\n\nÉtape 1 : \\(\\lvert A \\cup B_0 \\rvert = \\lvert A \\rvert + \\lvert B_0 \\rvert - \\lvert A \\cap B_0 \\rvert = 50 + 70 - 40 = 80\\), donc IoU \\(= 40/80 = \\tfrac{1}{2}\\).\n\nÉtape 2 : Dice \\(= 2\\,\\lvert A \\cap B_0 \\rvert/(\\lvert A \\rvert + \\lvert B_0 \\rvert) = 80/120 = \\tfrac{2}{3}\\).\n\nContrôle (leçon, partie 2.5, S1) : \\(2\\,\\mathrm{IoU}/(1 + \\mathrm{IoU}) = 1/1{,}5 = \\tfrac{2}{3}\\). Le Dice est aussi le score F1 de la classe « objet » : précision \\(\\tfrac{4}{5}\\), rappel \\(\\tfrac{4}{7}\\).", "type": "qcm", "multiple": false, "reponse": "Dice \\(= \\tfrac{2}{3}\\) et IoU \\(= \\tfrac{1}{2}\\)", "fiche": null, "verif": {"script": "verif/seance_ml_5.py", "cles": ["Q05_d_sans2_den", "Q05_d_sans2_num", "Q05_d_union_den", "Q05_d_union_num", "Q05_dice_den", "Q05_dice_num", "Q05_iou_den", "Q05_iou_num", "Q05_precision_den", "Q05_precision_num", "Q05_rappel_den", "Q05_rappel_num", "Q05_union"]}}, {"id": "ML5-08", "section": "mla", "theme": "Apprentissage par renforcement : équation de Bellman d'optimalité", "difficulte": 4, "temps_cible_s": 150, "enonce": "Un processus de décision markovien a deux états, 1 et 2, et un facteur d'actualisation \\(\\gamma = 0{,}8\\). Le retour est la somme des récompenses futures, la récompense reçue \\(i\\) pas après la première étant multipliée par \\(\\gamma^i\\).\n\n- Dans l'état 1, deux actions : « garder » rapporte 2 et laisse dans l'état 1 ; « changer » rapporte 0 et mène dans l'état 2.\n- Dans l'état 2, une seule action : elle rapporte 4, puis l'état suivant est 1 avec probabilité \\(\\tfrac12\\) et 2 avec probabilité \\(\\tfrac12\\).\n\nQuelle est la valeur optimale de l'état 1, c'est-à-dire le plus grand retour espéré que l'on puisse obtenir en partant de l'état 1 ?", "options": [{"id": "a", "texte": "\\(\\tfrac{80}{7} \\approx 11{,}43\\)", "correcte": true, "explication": "Oui : avec « changer », \\(v(1) = 0{,}8\\,v(2)\\) et \\(v(2) = 4 + 0{,}4\\,v(1) + 0{,}4\\,v(2)\\), d'où \\(v(1) = \\tfrac{80}{7}\\), ce qui dépasse la valeur de « garder »."}, {"id": "b", "texte": "\\(10\\)", "correcte": false, "explication": "C'est \\(2/(1 - 0{,}8)\\), la valeur de la politique qui garde toujours. Elle prend la meilleure récompense immédiate, mais l'état 2 rapporte 4 par pas : accepter une récompense nulle pour y aller vaut plus."}, {"id": "c", "texte": "\\(\\tfrac{100}{7} \\approx 14{,}29\\)", "correcte": false, "explication": "C'est la valeur optimale de l'état **2**. Celle de l'état 1 s'en déduit par \\(v(1) = 0 + 0{,}8\\,v(2)\\) : il faut un pas, à récompense nulle, pour y arriver."}, {"id": "d", "texte": "\\(\\tfrac{78}{7} \\approx 11{,}14\\)", "correcte": false, "explication": "C'est \\(2 + 0{,}8 \\times \\tfrac{80}{7}\\) : la valeur de « garder » une fois puis d'agir au mieux. La valeur optimale est le **maximum** sur les actions, atteint par « changer »."}], "solution": "Réponse : \\(\\tfrac{80}{7} \\approx 11{,}43\\), obtenue en choisissant « changer » dans l'état 1.\n\nÉtape 1 : état 2 (une seule action), équation de Bellman : \\(v(2) = 4 + 0{,}8\\,\\big(\\tfrac12 v(1) + \\tfrac12 v(2)\\big)\\), soit \\(0{,}6\\,v(2) = 4 + 0{,}4\\,v(1)\\).\n\nÉtape 2 : on essaie « changer » en 1 : \\(v(1) = 0 + 0{,}8\\,v(2)\\). En reportant : \\(0{,}6\\,v(2) = 4 + 0{,}32\\,v(2)\\), donc \\(v(2) = 4/0{,}28 = \\tfrac{100}{7}\\) et \\(v(1) = \\tfrac{80}{7}\\).\n\nÉtape 3 : on vérifie l'équation d'optimalité en 1 (leçon, partie 4.2, Be2) : « garder » vaudrait \\(2 + 0{,}8 \\times \\tfrac{80}{7} = \\tfrac{78}{7} < \\tfrac{80}{7}\\). Le maximum est bien atteint par « changer » : ces valeurs sont le point fixe, donc les valeurs optimales.\n\nÀ comparer : garder toujours donne \\(2/(1 - 0{,}8) = 10\\). Le script résout les deux politiques en fractions, retrouve la valeur par itération sur la valeur et par simulation (11,437, erreur standard 0,007).", "type": "qcm", "multiple": false, "reponse": "\\(\\tfrac{80}{7} \\approx 11{,}43\\)", "fiche": null, "verif": {"script": "verif/seance_ml_5.py", "cles": ["Q08_d_garder_toujours", "Q08_d_q_garder", "Q08_d_q_garder_den", "Q08_d_q_garder_num", "Q08_exact", "Q08_exact_den", "Q08_exact_mc", "Q08_exact_num", "Q08_exact_se", "Q08_v2", "Q08_v2_den", "Q08_v2_num"]}}, {"id": "ML5-09", "section": "mla", "theme": "Apprentissage par renforcement : Q-learning, gradient de politique, exploration", "difficulte": 3, "temps_cible_s": 100, "conceptuelle": true, "correctes": ["a", "b", "c"], "enonce": "On considère un agent qui apprend par renforcement dans un processus de décision markovien à états et actions en nombre fini, dont il ne connaît ni les probabilités de transition ni la fonction de récompense.\n\nLesquelles de ces affirmations sont justes ?", "options": [{"id": "a", "texte": "Le Q-learning est une méthode hors politique : sa cible utilise le maximum des valeurs estimées dans l'état suivant, quelle que soit l'action que l'agent y choisira réellement.", "correcte": true, "explication": "Vrai : la cible est la récompense plus la valeur actualisée de la meilleure action estimée dans l'état suivant ; l'agent peut explorer autrement tout en apprenant les valeurs optimales. SARSA, qui utilise l'action réellement choisie, est sur politique."}, {"id": "b", "texte": "Une méthode de gradient de politique peut estimer le gradient du retour espéré sans connaître les probabilités de transition : seul le logarithme de la politique est dérivé par rapport aux paramètres.", "correcte": true, "explication": "Vrai : le logarithme de la probabilité d'une trajectoire est une somme, et seuls les termes de la politique dépendent des paramètres ; les transitions disparaissent du gradient, qui s'estime sur des trajectoires jouées."}, {"id": "c", "texte": "Dans REINFORCE, retrancher du retour une ligne de base qui ne dépend que de l'état ne change pas l'espérance du gradient estimé, et peut réduire sa variance.", "correcte": true, "explication": "Vrai : l'espérance du gradient du logarithme de la politique, sachant l'état, est nulle (les probabilités des actions somment à un), donc le terme retranché est d'espérance nulle."}, {"id": "d", "texte": "Un agent qui choisit toujours l'action de meilleure valeur estimée, sans jamais explorer, finit nécessairement par identifier la meilleure action, puisque ses estimations s'améliorent à chaque essai.", "correcte": false, "explication": "Faux : seule l'estimation de l'action essayée s'améliore. Une bonne action sous-estimée au départ n'est plus jamais choisie, et son estimation n'est jamais corrigée."}], "solution": "Réponse : trois affirmations sont justes : celle sur le Q-learning (hors politique, cible avec le maximum), celle sur le gradient de politique (aucun besoin des probabilités de transition) et celle sur la ligne de base de REINFORCE (même espérance, variance réduite). Celle sur l'agent qui n'explore jamais est fausse.\n\nÉtape 1 : cible du Q-learning, \\(r + \\gamma \\max_{a'} Q(s', a')\\), indépendante de l'action suivie (leçon, partie 4.3).\n\nÉtape 2 : \\(\\nabla J(\\boldsymbol{\\theta}) = \\mathbb{E}\\big[g(\\tau)\\sum_t \\nabla \\ln \\pi_{\\boldsymbol{\\theta}}(A_t \\mid S_t)\\big]\\) : ni les transitions ni la récompense ne sont dérivées (partie 4.4, PG1).\n\nÉtape 3 : \\(\\sum_a \\pi_{\\boldsymbol{\\theta}}(a \\mid s)\\,\\nabla \\ln \\pi_{\\boldsymbol{\\theta}}(a \\mid s) = \\nabla \\sum_a \\pi_{\\boldsymbol{\\theta}}(a \\mid s) = \\mathbf{0}\\) : une ligne de base \\(b(s)\\) ne biaise pas (PG2, PG3).\n\nÉtape 4 : la stratégie sans exploration peut rester bloquée sur un bras moins bon, avec une probabilité strictement positive (partie 4.5, X1).", "type": "qcm", "multiple": true, "reponse": "Le Q-learning est une méthode hors politique : sa cible utilise le maximum des valeurs estimées dans l'état suivant, quelle que soit l'action que l'agent y choisira réellement. ; Une méthode de gradient de politique peut estimer le gradient du retour espéré sans connaître les probabilités de transition : seul le logarithme de la politique est dérivé par rapport aux paramètres. ; Dans REINFORCE, retrancher du retour une ligne de base qui ne dépend que de l'état ne change pas l'espérance du gradient estimé, et peut réduire sa variance.", "fiche": null, "verif": {"script": "verif/seance_ml_5.py", "cles": []}}, {"id": "ML5-10", "section": "mla", "theme": "Gradient de politique : espérance et variance de l'estimateur REINFORCE", "difficulte": 5, "temps_cible_s": 150, "enonce": "Un agent choisit une seule fois entre deux actions. Il choisit l'action 1 avec probabilité \\(\\pi = \\mathrm{sig}(\\theta)\\), où \\(\\mathrm{sig}(\\theta) = 1/(1 + e^{-\\theta})\\), et l'action 0 sinon ; le paramètre \\(\\theta\\) est tel que \\(\\pi = \\tfrac15\\). L'action 1 rapporte la récompense 6, l'action 0 la récompense 1 (sans aléa). On note \\(A\\) l'action choisie, \\(R\\) la récompense reçue, et l'on estime la dérivée du gain espéré par rapport à \\(\\theta\\) par\n\n\\(\\displaystyle \\hat g_b = (R - b)\\,\\frac{d}{d\\theta}\\ln \\mathbb{P}_\\theta(A),\\)\n\noù \\(\\mathbb{P}_\\theta(A)\\) est la probabilité que la politique donnait à l'action choisie et \\(b\\) une constante (ligne de base).\n\nQue valent l'espérance et la variance de \\(\\hat g_b\\), pour \\(b = 0\\) puis pour \\(b = 2\\) ?", "options": [{"id": "a", "texte": "Espérance \\(0{,}8\\) dans <script>
'use strict';
const D = JSON.parse(document.getElementById('donnees').textContent);
const ITEMS = D.sections.flatMap(s => s.questions.map(q => Object.assign({ nomSection: s.nom }, q)));
const CLE = 'atelier-quant:' + D.id;
const SERVEUR = location.protocol.startsWith('http');
// La session survit à un rechargement de l'onglet : on se reconnecte alors au même noyau, variables comprises.
const SESSION = (() => { const neuve = Math.random().toString(36).slice(2) + Date.now().toString(36); try { const s = sessionStorage.getItem('atelier-quant:session') || neuve; sessionStorage.setItem('atelier-quant:session', s); return s; } catch (e) { return neuve; } })();
const page = document.getElementById('page');
const noyauxDemarres = {};
let E = etatNeuf('accueil');

function etatNeuf(phase) { return { phase, courant: 0, debut: null, fin: null, reponses: {}, temps: {}, ordre: {}, cellules: {}, code: {}, controles: {}, ordreControles: {}, vus: {}, partie: {}, enregistrement: null, pauseDepuis: null, pauseTotale: 0 }; }
// Options par défaut : la pause et « Je ne sais pas » sont permis, sauf si l'examen les interdit (examens blancs).
const PAUSE_PERMISE = D.options.pause !== false;
const NSP_PERMIS = D.options.je_ne_sais_pas !== false;
function dureeEcoulee(fin) { return (fin - E.debut - (E.pauseTotale || 0) - (E.pauseDepuis ? fin - E.pauseDepuis : 0)) / 1000; }
const NOTEES = ITEMS.filter(q => q.type !== 'lecon');
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(E)); } catch (e) {} }
function charger() { try { const s = localStorage.getItem(CLE); if (s) E = Object.assign(etatNeuf('accueil'), JSON.parse(s)); } catch (e) {} }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function enLigne(t) { return esc(t).replace(/`([^`]+)`/g, '<code class="sans-math">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

// Markdown réduit : titres #, tableaux |, listes - et 1., paragraphes, `code`, **gras**, blocs entre triples accents graves.
function rendre(t) {
  let h = '';
  String(t).split('```').forEach((bloc, i) => {
    if (i % 2) {
      const info = (bloc.match(/^(\w*)\n/) || [])[1];
      h += '<pre class="sans-math' + (info === 'sortie' ? ' sortie-lecon' : '') + '"><code>' + esc(bloc.replace(/^\w*\n/, '')) + '</code></pre>';
      return;
    }
    const lignes = bloc.split('\n');
    let k = 0;
    while (k < lignes.length) {
      const l = lignes[k];
      if (!l.trim()) { k++; continue; }
      const titre = l.match(/^(#{1,4})\s+(.*)$/);
      if (titre) { const n = Math.min(4, titre[1].length + 1); h += '<h' + n + '>' + enLigne(titre[2]) + '</h' + n + '>'; k++; continue; }
      if (l.trim().startsWith('|')) {
        const rangs = [];
        while (k < lignes.length && lignes[k].trim().startsWith('|')) { rangs.push(lignes[k].trim()); k++; }
        const cellules = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
        h += '<div class="defile"><table><tr>' + cellules(rangs[0]).map(c => '<th>' + enLigne(c) + '</th>').join('') + '</tr>';
        rangs.slice(1).filter(r => !/^\|[\s|:-]+\|$/.test(r)).forEach(r => { h += '<tr>' + cellules(r).map(c => '<td>' + enLigne(c) + '</td>').join('') + '</tr>'; });
        h += '</table></div>'; continue;
      }
      const puce = /^\s*[-*]\s+/, numero = /^\s*\d+\.\s+/;
      if (puce.test(l) || numero.test(l)) {
        const motif = puce.test(l) ? puce : numero, balise = motif === puce ? 'ul' : 'ol';
        h += '<' + balise + '>';
        while (k < lignes.length && motif.test(lignes[k])) { h += '<li>' + enLigne(lignes[k].replace(motif, '')) + '</li>'; k++; }
        h += '</' + balise + '>'; continue;
      }
      const par = [];
      while (k < lignes.length && lignes[k].trim() && !/^(#{1,4}\s|\s*\||\s*[-*]\s|\s*\d+\.\s)/.test(lignes[k])) { par.push(lignes[k]); k++; }
      const texte = par.join('\n').trim();
      // Un paragraphe réduit à une seule formule est centré ; une formule au milieu d'une phrase reste dans la ligne.
      const seule = texte.startsWith('\\(') && texte.endsWith('\\)') && texte.indexOf('\\(', 2) < 0;
      h += (seule ? '<p class="formule">' : '<p>') + enLigne(par.join('\n')) + '</p>';
    }
  });
  return h;
}
function composer(el) { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el || page]).catch(() => {}); }
function mmss(s) { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function melanger(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function api(chemin, corps) {
  const r = await fetch(chemin, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
  return r.json();
}

let dernierTic = null;
function tic() {
  const ch = document.getElementById('chrono');
  const bouton = document.getElementById('pause');
  bouton.hidden = !(PAUSE_PERMISE && E.phase === 'epreuve');
  document.getElementById('recommencerHaut').hidden = E.phase !== 'epreuve';
  document.getElementById('voile').hidden = !(E.phase === 'epreuve' && E.pauseDepuis);
  if (E.phase !== 'epreuve' || E.pauseDepuis) { dernierTic = null; return; }
  const maintenant = Date.now();
  if (dernierTic !== null) { const q = ITEMS[E.courant]; E.temps[q.id] = (E.temps[q.id] || 0) + (maintenant - dernierTic) / 1000; }
  dernierTic = maintenant;
  const reste = D.duree_minutes * 60 - dureeEcoulee(maintenant);
  ch.textContent = (reste < 0 ? '+' : '') + mmss(Math.abs(reste));
  ch.classList.toggle('depasse', reste < 0);
}
setInterval(() => { tic(); if (E.phase === 'epreuve') sauver(); }, 500);
if (SERVEUR) document.getElementById('lienAccueil').hidden = false;
document.getElementById('lienAccueil').onclick = () => {
  if (E.phase === 'epreuve' && PAUSE_PERMISE && !E.pauseDepuis) { tic(); E.pauseDepuis = Date.now(); sauver(); }
};
document.getElementById('recommencerHaut').onclick = () => {
  if (!confirm('Effacer ce passage (réponses, code, chronomètre) et revenir au début de la séance ?')) return;
  try { localStorage.removeItem(CLE); } catch (e) {}
  E = etatNeuf('accueil'); dernierTic = null; afficher();
};
document.getElementById('pause').onclick = () => { tic(); E.pauseDepuis = Date.now(); sauver(); tic(); };
document.getElementById('reprendre').onclick = () => {
  if (E.pauseDepuis) { E.pauseTotale = (E.pauseTotale || 0) + (Date.now() - E.pauseDepuis); E.pauseDepuis = null; }
  dernierTic = null; sauver(); tic();
};

// ------------------------------------------------------------------ accueil
function accueil() {
  page.className = '';
  document.getElementById('position').textContent = '';
  document.getElementById('chrono').textContent = mmss(D.duree_minutes * 60);
  let h = '<div class="carte presentation"><h2>' + esc(D.titre) + '</h2><p class="meta">' + D.duree_minutes + ' min · ' + NOTEES.length + ' question' + (NOTEES.length > 1 ? 's' : '') + (D.options.pause === false ? ' · sans pause' : '') + '</p>' + rendre(D.presentation);
  h += '<div class="sections-liste">';
  D.sections.forEach(s => { const n = s.questions.filter(q => q.type !== 'lecon').length; h += '<div><span>' + esc(s.nom) + '</span><span class="meta">' + (n ? n + ' question' + (n > 1 ? 's' : '') : 'leçon') + ' · ' + s.budget_min + ' min</span></div>'; });
  h += '</div>';
  D.avertissements.forEach(a => { h += '<div class="note">' + rendre(a) + '</div>'; });
  if (!SERVEUR && ITEMS.some(q => q.type === 'code')) h += '<div class="note"><p><strong>Le notebook ne peut pas s\'exécuter :</strong> cette page est ouverte comme un fichier. Lance <code class="sans-math">python lancer.py</code> dans le dossier du projet, puis ouvre l\'examen depuis la page qui s\'affiche.</p></div>';
  h += '<p class="meta">' + esc(D.conventions) + '</p>';
  h += '<div class="barre"><button class="principal" id="demarrer">Commencer</button></div></div>';
  page.innerHTML = h;
  document.getElementById('demarrer').onclick = () => {
    E = etatNeuf('epreuve');
    E.debut = Date.now();
    ITEMS.forEach(q => {
      if (q.type === 'qcm') E.ordre[q.id] = melanger(q.options.map(o => o.id));
      if (q.cellules_initiales) E.cellules[q.id] = q.cellules_initiales.map(c => ({ code: c, sortie: '', numero: null }));
      if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => { E.ordreControles[q.id + ':' + cid] = melanger(c.options.map(o => o.id)); });
    });
    sauver(); afficher();
  };
  composer();
}

// ------------------------------------------------------------------ épreuve
function pastilles() {
  const faite = it => it.type === 'lecon' ? !!E.vus[it.id] : it.type === 'code' ? (E.code[it.id] || {}).soumissions > 0 : E.reponses[it.id] !== undefined;
  const barre = document.querySelector('#progression > span');
  if (barre) barre.style.width = (100 * ITEMS.filter(faite).length / ITEMS.length) + '%';
  let h = '<div class="cadre"><aside class="plan"><div id="pastilles">', section = null, n = 0;
  ITEMS.forEach((it, i) => {
    if (it.nomSection !== section) { section = it.nomSection; h += '<div class="groupe">' + esc(section) + '</div>'; }
    const libelle = it.type === 'lecon' ? 'Leçon' : 'Question ' + (++n);
    h += '<button class="pastille' + (faite(it) ? ' faite' : '') + (i === E.courant ? ' courante' : '') + '" data-i="' + i + '" title="' + esc(it.theme) + '"' + (D.options.retour_arriere || i === E.courant ? '' : ' disabled') + '><span class="etat"></span><span class="libelle">' + libelle + '</span></button>';
  });
  return h + '</div></aside><div class="contenu">';
}
const FIN_CADRE = '</div></div>';
function navigation() {
  let h = '<div class="barre navigation">';
  if (D.options.retour_arriere) h += '<button id="prec"' + (E.courant === 0 ? ' disabled' : '') + '>Précédente</button>';
  if (E.courant < ITEMS.length - 1) h += '<button class="principal" id="suiv">Suivante</button>';
  return h + '<button id="finir">Terminer et corriger</button></div>';
}
function brancherNavigation() {
  const aller = i => { tic(); E.courant = i; sauver(); afficher(); };
  page.querySelectorAll('.pastille').forEach(b => b.onclick = () => aller(Number(b.dataset.i)));
  const p = document.getElementById('prec'); if (p) p.onclick = () => aller(E.courant - 1);
  const s = document.getElementById('suiv'); if (s) s.onclick = () => aller(E.courant + 1);
  document.getElementById('finir').onclick = () => {
    const manquantes = NOTEES.filter(it => it.type === 'code' ? !((E.code[it.id] || {}).soumissions > 0) : E.reponses[it.id] === undefined).length;
    if (manquantes && !confirm(manquantes + ' question(s) sans réponse ou jamais soumise(s). Terminer quand même ?')) return;
    tic();
    if (E.pauseDepuis) { E.pauseTotale = (E.pauseTotale || 0) + (Date.now() - E.pauseDepuis); E.pauseDepuis = null; }
    E.phase = 'bilan'; E.fin = Date.now(); sauver(); afficher();
  };
}

function epreuve() {
  tic();
  const q = ITEMS[E.courant];
  document.getElementById('position').textContent = q.nomSection + (q.type === 'lecon' ? ' · étape ' : ' · question ') + (E.courant + 1) + ' sur ' + ITEMS.length;
  if (q.type === 'lecon') E.vus[q.id] = true;
  if (q.cellules_initiales) return epreuveCode(q);
  if (q.type === 'lecon') return epreuveLecon(q);
  page.className = '';
  const rang = NOTEES.indexOf(q) + 1;
  let h = pastilles() + '<div class="carte question"><div class="surtitre"><span class="rang">Question ' + rang + ' sur ' + NOTEES.length + '</span><span class="chip">' + esc(q.theme) + '</span><span>temps visé ' + mmss(q.temps_cible_s) + '</span></div>' + rendre(q.enonce);
  h += '<p class="consigne">' + (q.multiple ? 'Une ou plusieurs réponses : coche toutes les affirmations justes, et seulement elles (notation tout ou rien).' : 'Une seule réponse.') + '</p>';
  E.ordre[q.id].forEach((oid, k) => {
    const o = q.options.find(x => x.id === oid);
    h += '<div class="option' + (choisies(q).includes(oid) ? ' choisie' : '') + '" data-o="' + oid + '"><span class="lettre' + (q.multiple ? ' carre' : '') + '">' + 'ABCDE'[k] + '</span><div>' + rendre(o.texte) + '</div></div>';
  });
  if (NSP_PERMIS) h += '<div class="option' + (E.reponses[q.id] === 'nsp' ? ' choisie' : '') + '" data-o="nsp"><span class="lettre">?</span><div><p>Je ne sais pas (compte comme faux, mais évite qu\'un hasard heureux masque une lacune)</p></div></div>';
  page.innerHTML = h + navigation() + '</div>' + FIN_CADRE;
  page.querySelectorAll('.option').forEach(el => el.onclick = () => {
    const o = el.dataset.o;
    if (q.multiple && o !== 'nsp') {
      const s = choisies(q), k = s.indexOf(o);
      if (k >= 0) s.splice(k, 1); else s.push(o);
      if (s.length) E.reponses[q.id] = s.sort(); else delete E.reponses[q.id];
    } else if (E.reponses[q.id] === o) delete E.reponses[q.id]; else E.reponses[q.id] = o;
    sauver(); afficher();
  });
  brancherNavigation();
  composer();
}

// ------------------------------------------------------------------ notebook
function epreuveLecon(q) {
  page.className = 'lecture';
  page.innerHTML = pastilles() + '<div class="carte enonce"><div class="surtitre"><span class="rang">Leçon</span><span class="chip">' + esc(q.theme) + '</span><span>environ ' + Math.round(q.temps_cible_s / 60) + ' min</span></div>' + rendreLecon(q) + navigation() + '</div>' + FIN_CADRE;
  brancherControles(q);
  brancherNavigation();
  composer();
}

// Points de contrôle : question corrigée dès le clic, non notée.
function rendreLecon(q) {
  const brut = rendre(q.contenu).replace(/<p>\[\[controle:([\w-]+)\]\]<\/p>/g, (_, cid) => '<div class="controle" data-c="' + cid + '"></div>');
  // Une partie par titre de niveau 2 ; dans chaque partie, un bloc par rubrique (problème, énoncé, preuve, exemple...).
  const source = document.createElement('div');
  source.innerHTML = brut;
  const parties = [];
  Array.from(source.childNodes).forEach(n => {
    if (n.nodeName === 'H3' || !parties.length) parties.push({ titre: n.nodeName === 'H3' ? n.textContent : 'Introduction', noeuds: [] });
    parties[parties.length - 1].noeuds.push(n);
  });
  const genre = t => /preuve/i.test(t) ? 'preuve' : /pi[èe]ge/i.test(t) ? 'pieges' : /exemple|exp[ée]rience/i.test(t) ? 'exemple'
    : /[ée]nonc[ée]/i.test(t) ? 'enonce-bloc' : /intuition/i.test(t) ? 'intuition' : /probl[èe]me/i.test(t) ? 'probleme'
    : /cas limites/i.test(t) ? 'limites' : /d[ée]finition|notation|cadre|mod[èe]le/i.test(t) ? 'definitions' : '';
  const courante = Math.min((E.partie || {})[q.id] || 0, parties.length - 1);
  let h = '<div class="lecon-corps" data-lecon="' + q.id + '"><nav class="sommaire">';
  parties.forEach((p, k) => { h += '<button data-partie="' + k + '"' + (k === courante ? ' class="active"' : '') + '>' + (k + 1) + '. ' + esc(p.titre.replace(/^(Leçon|Partie \d+|Outil \d+|\d+\.)\s*:?\s*/i, '').slice(0, 42) || p.titre) + '</button>'; });
  h += '</nav>';
  parties.forEach((p, k) => {
    h += '<section class="partie" data-partie="' + k + '"' + (k === courante ? '' : ' hidden') + '>';
    let bloc = null;
    const fermer = () => { if (bloc) { h += bloc.genre === 'question' ? ficheDebrief(bloc.titre, bloc.noeuds) : bloc.genre === 'preuve' ? '</details>' : '</div>'; bloc = null; } };
    p.noeuds.forEach(n => {
      if (bloc && bloc.genre === 'question' && n.nodeName !== 'H4' && n.nodeName !== 'H3') { bloc.noeuds.push(n); return; }
      if (n.nodeName === 'H4' && /^Question \d+/.test(n.textContent)) {
        fermer();
        bloc = { genre: 'question', titre: n.textContent, noeuds: [] };
      } else if (n.nodeName === 'H4') {
        fermer();
        const g = genre(n.textContent);
        bloc = { genre: g };

// Une question du débrief : en-tête (numéro, titre, verdict), énoncé, réponses côte à côte, rubriques, à retenir.
function ficheDebrief(titre, noeuds) {
  const m = titre.match(/^(Question \d+)\s*:?\s*(.*)$/);
  const gras = n => n.nodeName === 'P' && n.firstChild && n.firstChild.nodeName === 'STRONG' ? n.firstChild.textContent.trim() : '';
  const reste = n => { const c = n.cloneNode(true); c.removeChild(c.firstChild); return c.innerHTML.trim(); };
  let enonce = '', ta = null, attendue = null, verdict = '', corps = '', retenir = '', revoir = '', etat = 'enonce';
  noeuds.forEach(n => {
    const g = gras(n), html = n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    if (/^Ta réponse/.test(g)) { ta = reste(n); etat = 'corps'; }
    else if (/^Réponse attendue/.test(g)) { attendue = reste(n); etat = 'corps'; }
    else if (/^Verdict/.test(g)) { verdict = reste(n); etat = 'corps'; }
    else if (/^À retenir/.test(g)) { retenir = '<h5>À retenir</h5><p>' + reste(n) + '</p>'; etat = 'retenir'; }
    else if (/^Leçon à revoir/.test(g)) { revoir = reste(n); etat = 'fin'; }
    else if (g && n.textContent.trim() === g) { corps += '<h5>' + esc(g.replace(/[.:]\s*$/, '')) + '</h5>'; etat = 'corps'; }
    else if (etat === 'enonce') enonce += n.nodeName === 'P' && /^Type :/.test(n.textContent) ? '<p class="meta">' + n.innerHTML + '</p>' : n.nodeName === 'UL' ? '<ul class="choix">' + n.innerHTML + '</ul>' : html;
    else if (etat === 'retenir') retenir += html;
    else corps += html;
  });
  const brut = verdict.replace(/<[^>]+>/g, '').trim();
  const v = /^juste/i.test(brut) ? ['v-juste', 'Juste'] : /^fausse/i.test(brut) ? ['v-fausse', 'Fausse'] : /^incompl/i.test(brut) ? ['v-incomplete', 'Incomplète']
    : /^non visible/i.test(brut) ? ['', 'Réponse non visible'] : ['', ''];
  const suite = brut.replace(/^[^.]*\.\s*/, '');
  let h = '<article class="fiche ' + v[0] + '"><header class="fiche-tete"><span class="num">' + esc(m[1]) + '</span><span class="titre">' + esc(m[2]) + '</span>'
    + (v[1] ? '<span class="verdict">' + v[1] + '</span>' : '') + '</header><div class="fiche-corps">';
  if (ta === null && attendue === null) return h + enonce + corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '') + '</div></article>';
  h += '<h5>Énoncé</h5>' + enonce;
  h += '<div class="fiche-reponses">' + (ta === null ? '' : '<div><span class="lab">Ta réponse</span>' + ta + '</div>') + '<div><span class="lab">Réponse attendue</span>' + (attendue || '') + '</div></div>';
  if (suite) h += '<p class="meta">' + verdict.replace(/^[^.]*\.\s*/, '') + '</p>';
  h += corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '');
  return h + '</div></article>';
}

// ------------------------------------------------------------------ éditeur
// Monaco (l'éditeur de VS Code) depuis cdnjs ; les suggestions, signatures et aides viennent de jedi
// dans le noyau, qui connaît les variables déjà exécutées. Sans connexion, repli sur une zone de texte simple.
const MONACO_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min';

const EDITEURS = [];

function chargerMonaco() {
  if (promesseMonaco) return promesseMonaco;

    const abandon = setTimeout(() => fini(null), 20000);

    const s = document.createElement('script');

      window.require.config({ paths: { vs: MONACO_BASE + '/vs' } });

async function aide(type, model, position) {

function configurerMonaco(m) {

  m.languages.registerCompletionItemProvider('python', {
    triggerCharacters: ['.'],
    provideCompletionItems: async (model, position) => {
      const r = await aide('completer', model, position);

function creerEditeur(conteneur, code, rappels) {
  if (MONACO) {
    const m = MONACO;
    const ed = m.editor.create(conteneur, {
      value: code, language: 'python', theme: sombre() ? 'vs-dark' : 'vs', fontSize: 14, tabSize: 4, insertSpaces: true,
      minimap: { enabled: false }, scrollBeyondLastLine: false, automaticLayout: true, lineNumbersMinChars: 3, folding: false,
      glyphMargin: false, renderLineHighlight: 'none', overviewRulerLanes: 0, wordBasedSuggestions: 'off', fixedOverflowWidgets: true,
      quickSuggestions: { other: true, comments: false, strings: false }, padding: { top: 6, bottom: 6 },
      scrollbar: { alwaysConsumeMouseWheel: false, vertical: 'hidden', horizontalScrollbarSize: 8 }

    // Sous Windows, Monaco utilise des fins de ligne \r\n ; le code est toujours lu avec des \n, comme dans un notebook.
    const lire = () => ed.getModel().getValue(m.editor.EndOfLinePreference.LF);
    const hauteur = () => { conteneur.style.height = Math.max(38, ed.getContentHeight()) + 'px'; };
    ed.onDidContentSizeChange(hauteur); hauteur();
    ed.onDidChangeModelContent(() => rappels.modif(lire()));
    ed.onDidFocusEditorText(rappels.focus);
    ed.addCommand(m.KeyMod.Shift | m.KeyCode.Enter, rappels.executerSuivant, '!suggestWidgetVisible');
    ed.addCommand(m.KeyMod.CtrlCmd | m.KeyCode.Enter, rappels.executer, '!suggestWidgetVisible');
    return { brut: ed, getValue: lire, setValue: v => ed.setValue(v), focus: () => ed.focus(), dispose: () => ed.dispose() };
  }

  zone.spellcheck = false; zone.autocomplete = 'off'; zone.className = 'sans-math';
  zone.value = code;
  conteneur.appendChild(zone);
  zone.addEventListener('input', () => { rappels.modif(zone.value); ajuster(zone); });
  zone.addEventListener('focus', rappels.focus);
  zone.addEventListener('keydown', ev => clavier(ev, zone, rappels));
  setTimeout(() => ajuster(zone));

}

function clavier(ev, zone, rappels) {
  if (ev.key === 'Enter' && (ev.shiftKey || ev.ctrlKey)) {
    ev.preventDefault();
    if (ev.shiftKey) rappels.executerSuivant(); else rappels.executer();
    return;
  }
  const debut = zone.selectionStart, fin = zone.selectionEnd, v = zone.value;
  const debutLigne = v.lastIndexOf('\n', debut - 1) + 1;

    if (!ev.shiftKey && !multi) { inserer(zone, '    '); return; }

    let retrait = ligne.match(/^ */)[0];

  }

  if (mode === 'visibles') {
    h += '<div class="defile"><table><tr><th>Test</th><th>Résultat</th><th>Attendu</th><th>Obtenu</th><th class="nombre">Durée</th></tr>';
    r.resultats.forEach(t => { h += '<tr><td>' + esc(t.nom) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec') + '</td><td><code class="sans-math">' + esc(t.attendu) + '</code></td><td><code class="sans-math">' + esc(t.obtenu ?? '') + '</code></td><td class="nombre">' + t.duree_s + ' s</td></tr>'; });
    h += '</table></div>';
    r.resultats.filter(t => t.erreur).forEach(t => { h += '<pre class="sans-math"><span class="erreur">' + esc(t.nom + ' :\n' + t.erreur) + '</span></pre>'; });
    E.code[q.id] = Object.assign(E.code[q.id] || {}, { visibles_reussis: r.reussis });
  } else {
    h += '<div class="defile"><table><tr><th>Test caché</th><th>Résultat</th></tr>';
    r.resultats.forEach((t, k) => { h += '<tr><td>Test ' + (k + 1) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec' + (t.erreur ? ' (exception ou temps dépassé)' : '')) + '</td></tr>'; });
    h += '</table></div>';
    const s = E.code[q.id] || {};
    E.code[q.id] = Object.assign(s, { soumissions: (s.soumissions || 0) + 1, caches_reussis: r.reussis, caches_total: r.total, details: r.resultats, code_source: codeSource(q) });
    afficherEtatSoumission(q);
    const p = page.querySelector('.pastille.courante'); if (p) p.classList.add('faite');
  }
  sauver();
  zone.innerHTML = h;
}

// ------------------------------------------------------------------ bilan
function points(q) {
  if (q.type === 'code') { const c = E.code[q.id]; return c && c.soumissions ? c.caches_reussis / c.caches_total : 0; }
  const r = E.reponses[q.id];
  if (r === undefined || r === 'nsp') return 0;
  // Une question à plusieurs réponses est notée tout ou rien : l'ensemble coché doit être exactement l'ensemble juste.
  const s = choisies(q), bonnes = q.options.filter(o => o.correcte).map(o => o.id);
  return s.length === bonnes.length && bonnes.every(b => s.includes(b)) ? 1 : -D.options.penalite;
}
function choisies(q) { const r = E.reponses[q.id]; return r === undefined || r === 'nsp' ? [] : Array.isArray(r) ? r.slice() : [r]; }
function texteOption(q, id) { const o = q.options.find(x => x.id === id); return o ? o.texte : null; }

function resultatJSON(duree) {
  return {
    examen: D.id, debut: new Date(E.debut).toISOString(), duree_s: Math.round(duree), pauses_s: Math.round((E.pauseTotale || 0) / 1000), options: D.options,
    lecons: ITEMS.filter(q => q.type === 'lecon').map(q => {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      return { id: q.id, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), controles_justes_du_premier_coup: justes, controles_total: ids.length };
    }),
    questions: NOTEES.map(q => {
      const base = { id: q.id, type: q.type, section: q.section, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), temps_cible_s: q.temps_cible_s, points: Number(points(q).toFixed(4)) };
      if (q.type === 'code') {
        const c = E.code[q.id] || {};
        return Object.assign(base, { soumissions: c.soumissions || 0, caches_reussis: c.caches_reussis || 0, caches_total: c.caches_total || q.tests_caches, visibles_reussis: c.visibles_reussis ?? null, code_source: c.code_source || codeSource(q) });
      }
      const r = E.reponses[q.id] ?? null;
      return Object.assign(base, { reponse: r, reponse_texte: r && r !== 'nsp' ? choisies(q).map(i => texteOption(q, i)).join(' ; ') : null, bonne_reponse_texte: q.options.filter(o => o.correcte).map(o => o.texte).join(' ; ') });
    })
  };
}

function bilan() {
  page.className = '';
  document.getElementById('position').textContent = 'Bilan';
  const duree = dureeEcoulee(E.fin);
  document.getElementById('chrono').textContent = mmss(duree);
  let total = 0;
  let h = '<div class="carte"><h2>Bilan</h2>@SCORE@<div class="defile"><table><tr><th>Section</th><th class="nombre">Score</th><th class="nombre">Temps passé</th><th class="nombre">Temps indicatif</th></tr>';
  D.sections.forEach(s => {
    const notees = s.questions.filter(q => q.type !== 'lecon');
    const pts = notees.reduce((a, q) => a + points(q), 0);
    const t = s.questions.reduce((a, q) => a + (E.temps[q.id] || 0), 0);
    total += pts;
    h += '<tr><td>' + esc(s.nom) + '</td><td class="nombre">' + (notees.length ? pts.toFixed(2).replace('.', ',') + ' / ' + notees.length : 'non notée') + '</td><td class="nombre">' + mmss(t) + '</td><td class="nombre">' + mmss(s.budget_min * 60) + '</td></tr>';
  });
  h += '<tr><th>Total</th><th class="nombre">' + total.toFixed(2).replace('.', ',') + ' / ' + NOTEES.length + '</th><th class="nombre">' + mmss(duree) + '</th><th class="nombre">' + mmss(D.duree_minutes * 60) + '</th></tr></table></div>';
  h = h.replace('@SCORE@', '<div class="score-total"><strong>' + total.toFixed(2).replace('.', ',').replace(/,00$/, '') + ' / ' + NOTEES.length + '</strong><span class="meta">en ' + mmss(duree) + '</span></div>');
  const barreFin = document.querySelector('#progression > span'); if (barreFin) barreFin.style.width = '100%';
  h += '<p id="enregistrement" class="meta"></p>';
  h += '<details><summary>Résultat brut (JSON)</summary><textarea readonly class="json sans-math" id="json"></textarea><div class="barre"><button id="telecharger">Enregistrer le fichier</button></div></details>';
  h += '<div class="barre">' + (SERVEUR ? '<button class="principal" id="retourAccueil">Retour à l\'accueil (séance suivante)</button>' : '')
    + '<button id="recommencer">Effacer et recommencer</button></div></div>';
  ITEMS.forEach((q, i) => {
    const temps = mmss(E.temps[q.id] || 0) + ' sur ' + mmss(q.temps_cible_s) + ' visés';
    const tete = (classe, verdict) => '<article class="fiche ' + classe + '"><header class="fiche-tete"><span class="num">' + (q.type === 'lecon' ? 'Leçon' : 'Question ' + (i + 1)) + '</span><span class="titre">' + esc(q.theme)
      + '</span><span class="temps">' + esc(q.nomSection) + ' · ' + temps + '</span>' + (verdict ? '<span class="verdict">' + verdict + '</span>' : '') + '</header><div class="fiche-corps">';
    if (q.type === 'lecon') {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      h += tete('', '') + '<p>Points de contrôle justes du premier coup : ' + justes + ' sur ' + ids.length + '. La leçon reste consultable depuis la séance.</p></div></article>';
      return;
    }
    if (q.type === 'qcm') {
      const r = E.reponses[q.id], juste = points(q) === 1;
      const s = choisies(q), incomplete = !juste && q.multiple && s.length > 0 && s.every(id => q.options.find(o => o.id === id).correcte);
      h += tete(juste ? 'v-juste' : incomplete ? 'v-incomplete' : r === undefined || r === 'nsp' ? '' : 'v-fausse',
        juste ? 'Juste' : r === undefined ? 'Sans réponse' : r === 'nsp' ? 'Je ne sais pas' : incomplete ? 'Incomplète' : 'Fausse');
      h += '<h5>Énoncé</h5>' + rendre(q.enonce) + '<h5>' + (q.multiple ? 'Options (plusieurs réponses, tout ou rien)' : 'Options') + '</h5>';
      E.ordre[q.id].forEach((oid, k) => {
        const o = q.options.find(x => x.id === oid), choisie = s.includes(oid);
        const puces = (o.correcte ? '<span class="puce bon">' + (q.multiple ? 'Juste' : 'Bonne réponse') + '</span>' : '') + (choisie ? '<span class="puce' + (o.correcte ? ' bon' : ' faux') + '">Ta réponse</span>' : '');
        h += '<div class="option ' + (o.correcte ? 'juste' : 'fausse') + (choisie ? ' choisie' : '') + '"><span class="lettre">' + 'ABCDE'[k] + '</span><div>' + puces + rendre(o.texte)
          + '<div class="explication">' + (o.correcte && !q.multiple ? '' : rendre(o.explication)) + '</div></div></div>';
      });
      h += '<h5>Correction</h5>' + rendre(q.solution);
    } else {
      const c = E.code[q.id] || {};
      const tout = c.soumissions && c.caches_reussis === c.caches_total;
      h += tete(tout ? 'v-juste' : c.soumissions ? 'v-incomplete' : '', c.soumissions ? c.caches_reussis + ' / ' + c.caches_total + ' tests cachés' : 'Jamais soumis');
      h += '<details><summary>Énoncé</summary>' + rendre(q.enonce) + '</details>';
      if (c.details) {
        h += '<h5>Tests cachés</h5><div class="defile"><table><tr><th>Test caché</th><th>Résultat</th><th>Attendu</th><th>Obtenu</th></tr>';
        c.details.forEach(t => { h += '<tr><td>' + esc(t.nom) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec') + '</td><td><code class="sans-math">' + esc(t.attendu) + '</code></td><td><code class="sans-math">' + esc(t.obtenu ?? (t.erreur ? 'exception' : '')) + '</code></td></tr>'; });
        h += '</table></div>';
        c.details.filter(t => t.erreur).forEach(t => { h += '<details><summary>Erreur : ' + esc(t.nom) + '</summary><pre class="sans-math">' + esc(t.erreur) + '</pre></details>'; });
      }
      h += '<details><summary>Ton code soumis</summary><pre class="sans-math"><code>' + esc(c.code_source || codeSource(q)) + '</code></pre></details>';
      h += '<details><summary>Correction</summary>' + rendre(q.solution) + '</details>';
    }
    h += '<p class="revoir">Vérification des nombres : <code class="sans-math">' + esc(q.verif.script) + '</code></p></div></article>';
  });
  page.innerHTML = h;
  const resultat = resultatJSON(duree);
  const zone = document.getElementById('json');
  zone.value = JSON.stringify(resultat, null, 1);
  document.getElementById('telecharger').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([zone.value], { type: 'application/json' }));
    a.download = D.id + '_resultat.json'; a.click();
  };
  const retour = document.getElementById('retourAccueil'); if (retour) retour.onclick = () => { location.href = '/'; };
  document.getElementById('recommencer').onclick = () => { if (confirm('Effacer ce passage ?')) { try { localStorage.removeItem(CLE); } catch (e) {} E = etatNeuf('accueil'); afficher(); } };
  const info = document.getElementById('enregistrement');
  if (E.enregistrement) info.textContent = E.enregistrement;
  else if (!SERVEUR) info.textContent = 'Page ouverte comme un fichier : le résultat n\'est pas enregistré automatiquement. Copie le JSON ci-dessous dans la conversation.';
  else {
    info.textContent = 'Enregistrement du résultat...';
    api('/api/resultat', resultat).then(r => {
      E.enregistrement = r.erreur ? null : 'Résultat enregistré dans ' + r.fichier + ' ; ' + r.erreurs_ajoutees + ' erreur(s) ajoutée(s) au journal suivi/erreurs.md.';
      info.textContent = E.enregistrement || 'Échec de l\'enregistrement : ' + r.erreur;
      sauver();
    }).catch(() => { info.textContent = 'Serveur injoignable : le résultat n\'est pas enregistré. Copie le JSON ci-dessous dans la conversation.'; });
  }
  composer();
}

function afficher() {
  libererEditeurs();
  document.getElementById('titre').textContent = D.titre;
  document.title = D.titre;
  if (E.phase === 'epreuve') epreuve(); else if (E.phase === 'bilan') bilan(); else accueil();
  window.scrollTo(0, 0);
}
function completerEtat() {
  ['reponses', 'temps', 'ordre', 'cellules', 'code', 'controles', 'ordreControles', 'vus', 'partie'].forEach(k => { if (!E[k] || typeof E[k] !== 'object') E[k] = {}; });
  if (typeof E.courant !== 'number' || E.courant < 0 || E.courant >= ITEMS.length) E.courant = 0;
  ITEMS.forEach(q => {
    if (q.cellules_initiales && !Array.isArray(E.cellules[q.id])) E.cellules[q.id] = q.cellules_initiales.map(c => ({ code: c, sortie: '', numero: null }));
    if (q.type === 'qcm') {
      const ids = q.options.map(o => o.id);
      const o = E.ordre[q.id];
      if (!Array.isArray(o) || o.length !== ids.length || !ids.every(i => o.includes(i))) E.ordre[q.id] = melanger(ids);
      const rep = E.reponses[q.id];
      if (rep !== undefined && rep !== 'nsp' && (Array.isArray(rep) !== !!q.multiple || !choisies(q).length || !choisies(q).every(i => ids.includes(i)))) delete E.reponses[q.id];
    }
    if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => {
      const cle = q.id + ':' + cid;
      if (!Array.isArray(E.ordreControles[cle])) E.ordreControles[cle] = melanger(c.options.map(o => o.id));
    });
  });
}
charger();
completerEtat();
if (SERVEUR && ITEMS.some(q => q.cellules_initiales)) chargerMonaco();
afficher();
</script>
