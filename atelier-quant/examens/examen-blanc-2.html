s prédiction courante \\(\\hat y_i\\)) valent −2 ; 0,5 ; 1 ; 4 ; 10.\n\nLa valeur \\(w\\) de la feuille, ajoutée à la prédiction de chacune de ces 5 observations, est choisie pour minimiser exactement \\(\\sum_i \\lvert y_i - (\\hat y_i + w) \\rvert\\) : pas de développement de Taylor, pas de régularisation, pas de taux d'apprentissage. Que vaut \\(w\\) ?", "options": [{"id": "a", "texte": "1", "correcte": true, "explication": "Oui : la médiane des résidus de la feuille."}, {"id": "b", "texte": "2,7", "correcte": false, "explication": "C'est la moyenne des résidus, qui minimise la somme des carrés \\(\\sum_i (r_i - w)^2\\), pas la somme des valeurs absolues. Elle est tirée vers le haut par le résidu 10 ; la perte absolue y vaut 17,2 contre 15,5 à la médiane."}, {"id": "c", "texte": "0,6", "correcte": false, "explication": "C'est la moyenne des pseudo-résidus \\(\\mathrm{signe}(r_i)\\), c'est-à-dire la valeur qu'un arbre de régression ajusté aux pseudo-résidus mettrait dans cette feuille. Cette valeur sert à choisir les coupures ; la valeur de la feuille est ensuite recalculée pour minimiser la vraie perte."}, {"id": "d", "texte": "Aucune : la dérivée seconde de la perte est nulle, le poids \\(-G/(H + \\lambda)\\) n'est pas défini", "correcte": false, "explication": "La formule \\(-G/(H + \\lambda)\\) vient d'un développement de Taylor à l'ordre 2, que l'énoncé exclut. Le minimum exact de \\(\\sum_i \\lvert r_i - w \\rvert\\) existe toujours : c'est une fonction convexe, affine par morceaux, qui tend vers l'infini aux deux bouts."}], "solution": "Réponse : \\(w = 1\\), la médiane des résidus.\n\nÉtape 1 : \\(y_i - (\\hat y_i + w) = r_i - w\\), donc on minimise \\(g(w) = \\sum_i \\lvert r_i - w \\rvert\\).\n\nÉtape 2 : chaque terme \\(\\lvert r_i - w \\rvert\\) a pour pente +1 quand \\(w > r_i\\) et −1 quand \\(w < r_i\\). Entre deux résidus consécutifs, \\(g\\) est donc affine, de pente \\(\\#\\{i : r_i < w\\} - \\#\\{i : r_i > w\\}\\).\n\nÉtape 3 : avec les 5 résidus triés, −2 < 0,5 < 1 < 4 < 10, la pente vaut \\(2 - 3 = -1\\) juste avant 1 et \\(3 - 2 = +1\\) juste après : \\(g\\) décroît puis croît, son minimum est en 1, la médiane, où elle vaut 15,5.\n\nMécanisme : c'est la robustesse de la perte absolue ; le résidu 10, peut-être aberrant, n'agit sur la feuille que par son signe. Dans le boosting de gradient de Friedman avec cette perte (Friedman, « Greedy function approximation: a gradient boosting machine », Annals of Statistics, 2001, algorithme LAD_TreeBoost), l'arbre est d'abord ajusté aux pseudo-résidus \\(\\mathrm{signe}(r_i)\\) (l'opposé du gradient de la perte), puis chaque feuille reçoit la médiane des résidus qu'elle contient. Cas limite : avec un nombre pair de résidus, tout point entre les deux résidus centraux est un minimum.", "type": "qcm", "multiple": false, "reponse": "1", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["A01_d_moyenne", "A01_d_signes", "A01_exact", "A01_perte_mediane", "A01_perte_moyenne"]}}, {"id": "EB2-A02", "section": "mla", "theme": "LSTM, disparition du gradient", "difficulte": 3, "temps_cible_s": 105, "enonce": "Dans une cellule LSTM à une dimension, la mémoire évolue selon \\(c_t = f_t\\,c_{t-1} + i_t\\,g_t\\), où \\(f_t\\) est la porte d'oubli, \\(i_t\\) la porte d'entrée et \\(g_t\\) la valeur candidate. On suit seulement le chemin direct de la mémoire : les portes et la valeur candidate sont traitées comme des constantes qui ne dépendent pas de \\(c_{t-1}\\), avec \\(f_t = 0{,}99\\) à chaque pas.\n\nQue vaut \\(\\partial c_{50}/\\partial c_0\\), arrondi à trois décimales ?", "options": [{"id": "a", "texte": "0,605", "correcte": true, "explication": "Oui : \\(0{,}99^{50}\\), produit des portes d'oubli le long du chemin."}, {"id": "b", "texte": "0,005", "correcte": false, "explication": "C'est \\(0{,}9^{50}\\), la valeur pour un réseau récurrent simple \\(h_t = \\tanh(w\\,h_{t-1} + \\dots)\\) de poids \\(w = 0{,}9\\) près de 0. La mémoire de la LSTM est multipliée par la porte d'oubli, 0,99, pas par 0,9."}, {"id": "c", "texte": "0,500", "correcte": false, "explication": "C'est \\(1 - 50 \\times 0{,}01\\), le développement au premier ordre de \\(0{,}99^{50}\\). Avec 50 facteurs, l'approximation linéaire n'est plus valable : \\((1 - x)^n \\approx 1 - nx\\) suppose \\(nx\\) petit."}, {"id": "d", "texte": "49,500", "correcte": false, "explication": "C'est \\(50 \\times 0{,}99\\) : les dérivées des pas successifs ont été additionnées. Par la règle de dérivation des fonctions composées, elles se multiplient."}], "solution": "Réponse : \\(0{,}99^{50} \\approx 0{,}605\\).\n\nÉtape 1 : sous l'hypothèse de l'énoncé, \\(\\partial c_t/\\partial c_{t-1} = f_t = 0{,}99\\).\n\nÉtape 2, règle de dérivation des fonctions composées : \\(\\partial c_{50}/\\partial c_0 = \\prod_{t=1}^{50} \\partial c_t/\\partial c_{t-1} = 0{,}99^{50} \\approx 0{,}605\\).\n\nComparaison : dans un réseau récurrent simple \\(h_t = \\tanh(w\\,h_{t-1} + u\\,x_t)\\), le facteur par pas est \\(w \\tanh'(\\cdot)\\), au plus \\(\\lvert w \\rvert\\) ; avec \\(w = 0{,}9\\), il reste au mieux \\(0{,}9^{50} \\approx 0{,}005\\) après 50 pas. C'est la disparition du gradient : le réseau ne peut pas apprendre de dépendances longues. La LSTM la contourne parce que sa mémoire se propage additivement, avec un facteur \\(f_t\\) que le réseau apprend et peut garder proche de 1.\n\nCondition de validité : dans une vraie LSTM, les portes dépendent de l'état caché précédent, donc indirectement de \\(c_{t-1}\\) ; le gradient complet ajoute d'autres chemins. Le chemin direct calculé ici est celui qui ne s'éteint pas. Contrôle (script) : dérivée numérique de \\(c_{50}\\) par rapport à \\(c_0\\).", "type": "qcm", "multiple": false, "reponse": "0,605", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["A02_d_lineaire", "A02_d_somme", "A02_exact", "A02_rnn"]}}, {"id": "EB2-A03", "section": "mla", "theme": "Normalisation par lot (BatchNorm)", "difficulte": 2, "temps_cible_s": 105, "enonce": "En entraînement, une couche de normalisation par lot (BatchNorm) reçoit, pour un neurone donné, les 4 valeurs du lot : 1, 2, 3, 6. Elle calcule la moyenne \\(m\\) et la variance \\(v\\) de ces 4 valeurs, la variance étant calculée avec le diviseur 4 (taille du lot), puis renvoie pour chaque valeur \\(h\\) la sortie \\(\\gamma\\,(h - m)/\\sqrt{v + \\epsilon} + \\beta\\), avec \\(\\gamma = 2\\), \\(\\beta = 1\\) et \\(\\epsilon = 0\\).\n\nQuelle est la sortie pour la valeur \\(h = 6\\), arrondie à trois décimales ?", "options": [{"id": "a", "texte": "4,207", "correcte": true, "explication": "Oui : \\(2 \\times 3/\\sqrt{3{,}5} + 1\\)."}, {"id": "b", "texte": "3,777", "correcte": false, "explication": "La variance a été calculée avec le diviseur 3 au lieu de 4. L'énoncé fixe le diviseur égal à la taille du lot, ce que fait la normalisation par lot en entraînement."}, {"id": "c", "texte": "1,604", "correcte": false, "explication": "C'est la valeur normalisée \\((h - m)/\\sqrt v\\), avant la transformation affine apprise \\(\\gamma\\,(\\cdot) + \\beta\\)."}, {"id": "d", "texte": "2,714", "correcte": false, "explication": "L'écart à la moyenne a été divisé par la variance au lieu de l'écart-type \\(\\sqrt v\\)."}], "solution": "Réponse : \\(2 \\times 3/\\sqrt{3{,}5} + 1 \\approx 4{,}207\\).\n\nÉtape 1 : \\(m = (1 + 2 + 3 + 6)/4 = 3\\).\n\nÉtape 2 : \\(v = \\big((1 - 3)^2 + (2 - 3)^2 + 0 + (6 - 3)^2\\big)/4 = 14/4 = 3{,}5\\).\n\nÉtape 3 : \\((6 - 3)/\\sqrt{3{,}5} \\approx 1{,}6036\\), puis \\(2 \\times 1{,}6036 + 1 \\approx 4{,}207\\).\n\nMécanisme : la normalisation rend la distribution des pré-activations de chaque neurone stable (moyenne 0, variance 1 sur le lot), et \\(\\gamma\\), \\(\\beta\\) rendent au réseau la possibilité de choisir une autre échelle et un autre centre. Pièges : la sortie d'un exemple dépend des autres exemples du lot ; en évaluation, \\(m\\) et \\(v\\) sont remplacées par des moyennes mobiles calculées pendant l'entraînement ; \\(\\epsilon > 0\\) évite une division par zéro quand toutes les valeurs du lot sont égales.", "type": "qcm", "multiple": false, "reponse": "4,207", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["A03_d_n_moins_1", "A03_d_sans_affine", "A03_d_variance", "A03_exact", "A03_moyenne", "A03_var"]}}, {"id": "EB2-A04", "section": "mla", "theme": "Momentum, pas effectif", "difficulte": 3, "temps_cible_s": 120, "enonce": "Descente de gradient avec momentum sur un paramètre réel \\(\\theta\\) : \\(v_t = \\beta\\,v_{t-1} + g_t\\), puis \\(\\theta_t = \\theta_{t-1} - \\eta\\,v_t\\), avec \\(v_0 = 0\\), \\(\\beta = 0{,}9\\) et \\(\\eta = 0{,}01\\). Le gradient vaut \\(g_t = 1\\) à chaque pas (pente constante).\n\nDe combien \\(\\theta\\) a-t-il diminué après 3 pas, c'est-à-dire que vaut \\(\\theta_0 - \\theta_3\\) ?", "options": [{"id": "a", "texte": "0,0561", "correcte": true, "explication": "Oui : \\(0{,}01 \\times (1 + 1{,}9 + 2{,}71)\\)."}, {"id": "b", "texte": "0,0300", "correcte": false, "explication": "C'est le déplacement sans momentum, \\(3 \\times \\eta \\times 1\\). Le momentum accumule les gradients passés : la vitesse \\(v_t\\) grandit tant que la pente reste la même."}, {"id": "c", "texte": "0,0271", "correcte": false, "explication": "C'est le seul troisième pas, \\(\\eta\\,v_3\\). La question demande le déplacement total, somme des trois pas."}, {"id": "d", "texte": "0,3000", "correcte": false, "explication": "C'est 3 pas à la vitesse limite \\(\\eta/(1 - \\beta) = 0{,}1\\). La vitesse part de 0 et n'atteint cette limite qu'après un nombre de pas de l'ordre de \\(1/(1 - \\beta) = 10\\)."}], "solution": "Réponse : \\(\\theta_0 - \\theta_3 = 0{,}01 \\times (1 + 1{,}9 + 2{,}71) = 0{,}0561\\).\n\nÉtape 1, vitesses : \\(v_1 = 1\\), \\(v_2 = 0{,}9 \\times 1 + 1 = 1{,}9\\), \\(v_3 = 0{,}9 \\times 1{,}9 + 1 = 2{,}71\\).\n\nÉtape 2 : chaque pas diminue \\(\\theta\\) de \\(\\eta\\,v_t\\) ; au total \\(\\eta\\,(v_1 + v_2 + v_3) = 0{,}0561\\).\n\nMécanisme : avec un gradient constant \\(g\\), \\(v_t = g\\,(1 - \\beta^t)/(1 - \\beta)\\) (somme géométrique), qui tend vers \\(g/(1 - \\beta)\\). Le pas effectif devient \\(\\eta/(1 - \\beta) = 0{,}1\\), dix fois le pas nominal : dans une direction de pente constante, le momentum accélère ; dans une direction où le gradient change de signe, les contributions successives se compensent et amortissent les oscillations. Conséquence pratique : en ajoutant un momentum \\(\\beta = 0{,}9\\) à un réglage qui fonctionnait sans, il faut diviser \\(\\eta\\) par 10 pour garder le même pas effectif ; à défaut, l'itération peut diverger.", "type": "qcm", "multiple": false, "reponse": "0,0561", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["A04_d_dernier", "A04_d_limite", "A04_d_sans_moment", "A04_exact", "A04_pas_limite", "A04_v2", "A04_v3"]}}, {"id": "EB2-A05", "section": "mla", "theme": "Astuce du noyau, noyau polynomial", "difficulte": 4, "temps_cible_s": 120, "enonce": "Le noyau polynomial \\(k(\\mathbf{x}, \\mathbf{z}) = (1 + \\mathbf{x}^\\top \\mathbf{z})^2\\) est défini pour \\(\\mathbf{x}, \\mathbf{z} \\in \\mathbb{R}^{10}\\).\n\nQuel est le plus petit entier \\(D\\) tel qu'il existe une application \\(\\boldsymbol{\\phi} : \\mathbb{R}^{10} \\to \\mathbb{R}^D\\) vérifiant \\(k(\\mathbf{x}, \\mathbf{z}) = \\boldsymbol{\\phi}(\\mathbf{x})^\\top \\boldsymbol{\\phi}(\\mathbf{z})\\) pour tous \\(\\mathbf{x}, \\mathbf{z} \\in \\mathbb{R}^{10}\\) ?", "options": [{"id": "a", "texte": "66", "correcte": true, "explication": "Oui : la constante, 10 termes linéaires, 10 carrés et 45 produits croisés."}, {"id": "b", "texte": "111", "correcte": false, "explication": "C'est \\(1 + 10 + 10 \\times 10\\) : l'application explicite qui contient \\(x_i x_j\\) pour tous les couples ordonnés \\((i, j)\\). Elle convient, mais \\(x_i x_j\\) et \\(x_j x_i\\) sont la même fonction : on les fusionne en une coordonnée \\(\\sqrt2\\,x_i x_j\\), ce qui réduit la dimension."}, {"id": "c", "texte": "55", "correcte": false, "explication": "C'est \\(\\binom{11}{2}\\), le nombre de monômes de degré exactement 2. Le développement \\(1 + 2\\,\\mathbf{x}^\\top\\mathbf{z} + (\\mathbf{x}^\\top\\mathbf{z})^2\\) contient aussi la constante et les termes de degré 1."}, {"id": "d", "texte": "21", "correcte": false, "explication": "C'est \\(1 + 10 + 10\\) : la constante, les termes linéaires et les carrés \\(x_i^2\\), sans les produits croisés \\(x_i x_j\\) (\\(i \\ne j\\)) qui apparaissent dans \\((\\mathbf{x}^\\top\\mathbf{z})^2 = \\sum_{i,j} x_i x_j z_i z_j\\)."}], "solution": "Réponse : \\(D = 66\\).\n\nÉtape 1, une application de dimension 66. En développant, \\(k(\\mathbf{x}, \\mathbf{z}) = 1 + 2\\sum_i x_i z_i + \\sum_i x_i^2 z_i^2 + 2\\sum_{i < j} x_i x_j z_i z_j\\). Avec \\(\\boldsymbol{\\phi}(\\mathbf{x}) = \\big(1, (\\sqrt2\\,x_i)_{i}, (x_i^2)_{i}, (\\sqrt2\\,x_i x_j)_{i < j}\\big)\\), on a \\(\\boldsymbol{\\phi}(\\mathbf{x})^\\top \\boldsymbol{\\phi}(\\mathbf{z}) = k(\\mathbf{x}, \\mathbf{z})\\), en dimension \\(1 + 10 + 10 + 45 = 66\\).\n\nÉtape 2, on ne peut pas faire moins. Si \\(k(\\mathbf{x}, \\mathbf{z}) = \\boldsymbol{\\phi}(\\mathbf{x})^\\top \\boldsymbol{\\phi}(\\mathbf{z})\\) avec \\(\\boldsymbol{\\phi}\\) à valeurs dans \\(\\mathbb{R}^D\\), alors pour chaque \\(\\mathbf{z}\\) fixé, la fonction \\(\\mathbf{x} \\mapsto k(\\mathbf{x}, \\mathbf{z})\\) est une combinaison linéaire des \\(D\\) fonctions coordonnées de \\(\\boldsymbol{\\phi}\\). L'espace \\(E\\) engendré par ces fonctions de \\(\\mathbf{x}\\), quand \\(\\mathbf{z}\\) parcourt \\(\\mathbb{R}^{10}\\), est donc de dimension au plus \\(D\\). Il suffit de montrer que \\(E\\) contient les 66 monômes \\(1\\), \\(x_i\\), \\(x_i x_j\\) (\\(i \\le j\\)), linéairement indépendants (un polynôme nul en tout point a tous ses coefficients nuls).\n\n2a. Pour \\(\\mathbf{z} = t\\,\\mathbf{a}\\), avec \\(t\\) réel et \\(\\mathbf{a}\\) fixé : \\(k(\\mathbf{x}, t\\mathbf{a}) = 1 + 2t\\,(\\mathbf{a}^\\top\\mathbf{x}) + t^2\\,(\\mathbf{a}^\\top\\mathbf{x})^2\\). Avec trois valeurs distinctes de \\(t\\), le système qui donne ces trois fonctions de \\(\\mathbf{x}\\) a une matrice de Vandermonde inversible : \\(1\\), \\(\\mathbf{a}^\\top\\mathbf{x}\\) et \\((\\mathbf{a}^\\top\\mathbf{x})^2\\) sont dans \\(E\\).\n\n2b. Avec \\(\\mathbf{a} = \\mathbf{e}_i\\), \\(i\\)-ème vecteur de la base canonique, \\(x_i\\) et \\(x_i^2\\) sont dans \\(E\\). Avec \\(\\mathbf{a} = \\mathbf{e}_i + \\mathbf{e}_j\\), \\((x_i + x_j)^2\\) est dans \\(E\\), donc aussi \\(2\\,x_i x_j = (x_i + x_j)^2 - x_i^2 - x_j^2\\). D'où \\(D \\ge 66\\).\n\nVérification numérique (script) : la matrice \\(300 \\times 300\\) des \\(k(\\mathbf{x}_a, \\mathbf{x}_b)\\) pour 300 points aléatoires est de rang 66.\n\nIntérêt de l'astuce du noyau : évaluer \\(k\\) coûte un produit scalaire en dimension 10, au lieu de construire 66 coordonnées ; pour un degré \\(p\\), la dimension \\(\\binom{10 + p}{p}\\) explose, le coût du noyau non.", "type": "qcm", "multiple": false, "reponse": "66", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["A05_carres", "A05_croises", "A05_d_carres", "A05_d_degre2", "A05_d_ordonne", "A05_exact", "A05_lineaires", "A05_rang_gram"]}}, {"id": "EB2-A06", "section": "mla", "theme": "SVM à marge dure, marge", "difficulte": 4, "temps_cible_s": 150, "enonce": "Trois points du plan : \\((2, 0)\\) et \\((0, 2)\\) sont de classe \\(+1\\), \\((0, 0)\\) est de classe \\(-1\\). Le SVM à marge dure cherche \\(\\mathbf{w} \\in \\mathbb{R}^2\\) et \\(b \\in \\mathbb{R}\\) qui minimisent \\(\\tfrac12 \\lVert \\mathbf{w} \\rVert^2\\) sous les contraintes \\(y_i\\,(\\mathbf{w}^\\top \\mathbf{x}_i + b) \\ge 1\\) pour chaque point \\(\\mathbf{x}_i\\) de classe \\(y_i\\). La largeur de la marge est la distance entre les droites \\(\\mathbf{w}^\\top \\mathbf{x} + b = 1\\) et \\(\\mathbf{w}^\\top \\mathbf{x} + b = -1\\), soit \\(2/\\lVert \\mathbf{w} \\rVert\\).\n\nQue vaut la largeur de la marge de la solution, arrondie à trois décimales ?", "options": [{"id": "a", "texte": "1,414", "correcte": true, "explication": "Oui : \\(\\mathbf{w} = (1, 1)\\), \\(b = -1\\), largeur \\(2/\\sqrt2\\)."}, {"id": "b", "texte": "0,707", "correcte": false, "explication": "C'est la demi-largeur \\(1/\\lVert \\mathbf{w} \\rVert\\), distance de la frontière \\(\\mathbf{w}^\\top\\mathbf{x} + b = 0\\) à chaque classe. L'énoncé définit la largeur entre les deux droites \\(\\pm 1\\)."}, {"id": "c", "texte": "2,000", "correcte": false, "explication": "C'est la distance du point négatif à chacun des positifs. La marge sépare le négatif de l'ensemble convexe des positifs, le segment de \\((2, 0)\\) à \\((0, 2)\\), dont le point le plus proche de l'origine est \\((1, 1)\\), à distance \\(\\sqrt2\\)."}, {"id": "d", "texte": "2,828", "correcte": false, "explication": "C'est la distance entre les deux points positifs. La marge mesure la séparation entre les classes, pas l'écart entre les points d'une même classe."}], "solution": "Réponse : \\(2/\\sqrt2 = \\sqrt2 \\approx 1{,}414\\).\n\nÉtape 1, une solution réalisable. Avec \\(\\mathbf{w} = (1, 1)\\) et \\(b = -1\\) : \\((2, 0)\\) et \\((0, 2)\\) donnent \\(\\mathbf{w}^\\top\\mathbf{x} + b = 1\\), et \\((0, 0)\\) donne \\(-1\\), soit \\(y_i\\,(\\mathbf{w}^\\top\\mathbf{x}_i + b) = 1\\) pour les trois points. Ici \\(\\lVert \\mathbf{w} \\rVert = \\sqrt2\\).\n\nÉtape 2, on ne peut pas faire mieux. Pour tout \\((\\mathbf{w}, b)\\) réalisable, la contrainte du point \\((0, 0)\\) donne \\(-b \\ge 1\\) ; celles des points positifs donnent \\(2w_1 + b \\ge 1\\) et \\(2w_2 + b \\ge 1\\). En additionnant ces deux dernières, \\(w_1 + w_2 \\ge 1 - b \\ge 2\\). Par l'inégalité de Cauchy-Schwarz, \\(w_1 + w_2 \\le \\sqrt2\\,\\lVert \\mathbf{w} \\rVert\\), donc \\(\\lVert \\mathbf{w} \\rVert \\ge \\sqrt2\\), avec égalité pour \\(\\mathbf{w} = (1, 1)\\), \\(b = -1\\).\n\nÉtape 3 : largeur \\(2/\\lVert \\mathbf{w} \\rVert = \\sqrt2 \\approx 1{,}414\\).\n\nLecture : les trois points saturent leur contrainte, ce sont les trois vecteurs de support ; la frontière \\(x_1 + x_2 = 1\\) passe à égale distance, \\(1/\\sqrt2\\), de l'origine et du segment des positifs. Retirer un point qui n'est pas vecteur de support ne changerait pas la solution. Contrôle (script) : recherche sur une grille de \\((w_1, w_2, b)\\) ; aucune solution réalisable n'a une norme plus petite que \\(\\sqrt2\\).", "type": "qcm", "multiple": false, "reponse": "1,414", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["A06_d_demi", "A06_d_points", "A06_d_positifs", "A06_exact"]}}, {"id": "EB2-A07", "section": "mla", "theme": "Non-stationnarité, moyenne mobile exponentielle", "difficulte": 3, "temps_cible_s": 105, "enonce": "Pour suivre une volatilité qui change dans le temps, on estime chaque jour la variance des rendements par une moyenne mobile exponentielle : \\(\\hat s_t = \\lambda\\,\\hat s_{t-1} + (1 - \\lambda)\\,r_t^2\\), où \\(r_t\\) est le rendement du jour \\(t\\) et \\(\\lambda = 0{,}94\\). En déroulant la récurrence, le carré \\(r_{t-k}\\) d'il y a \\(k\\) jours reçoit le poids \\((1 - \\lambda)\\,\\lambda^k\\).\n\nLa demi-vie est le nombre \\(h\\) (réel) de jours tel que \\(\\lambda^h = 1/2\\) : le poids d'une observation est divisé par deux tous les \\(h\\) jours. Que vaut \\(h\\), arrondi à deux décimales ?", "options": [{"id": "a", "texte": "11,20", "correcte": true, "explication": "Oui : \\(\\ln(1/2)/\\ln 0{,}94\\)."}, {"id": "b", "texte": "16,67", "correcte": false, "explication": "C'est \\(1/(1 - \\lambda)\\), qu'on présente parfois comme une « longueur de fenêtre équivalente ». Ce n'est pas la demi-vie : il faut résoudre \\(\\lambda^h = 1/2\\)."}, {"id": "c", "texte": "15,67", "correcte": false, "explication": "C'est \\(\\lambda/(1 - \\lambda)\\), l'âge moyen des observations pondérées par leurs poids \\((1 - \\lambda)\\lambda^k\\). La moyenne d'une loi géométrique dépasse sa médiane, proche de la demi-vie."}, {"id": "d", "texte": "8,33", "correcte": false, "explication": "C'est \\(0{,}5/(1 - \\lambda)\\) : on a supposé que le poids perd \\(1 - \\lambda = 6\\) % par jour de façon additive. La décroissance est multiplicative : \\(\\lambda^h\\), pas \\(1 - h\\,(1 - \\lambda)\\)."}], "solution": "Réponse : \\(h = \\ln(1/2)/\\ln(0{,}94) \\approx 11{,}20\\) jours.\n\nÉtape 1 : \\(\\lambda^h = 1/2 \\iff h \\ln \\lambda = -\\ln 2 \\iff h = \\ln 2/(-\\ln \\lambda)\\), car \\(\\ln \\lambda < 0\\).\n\nÉtape 2 : \\(-\\ln 0{,}94 \\approx 0{,}0619\\), d'où \\(h \\approx 11{,}20\\). Approximation utile : \\(-\\ln \\lambda \\approx 1 - \\lambda\\) quand \\(\\lambda\\) est proche de 1, donc \\(h \\approx \\ln 2/(1 - \\lambda) \\approx 11{,}55\\).\n\nContrôle des poids : \\(\\sum_{k \\ge 0} (1 - \\lambda)\\lambda^k = 1\\) (série géométrique), et l'âge moyen \\(\\sum_k k\\,(1 - \\lambda)\\lambda^k = \\lambda/(1 - \\lambda) \\approx 15{,}67\\) jours (script, avec sympy).\n\nMécanisme : la moyenne exponentielle répond à la non-stationnarité en oubliant progressivement le passé. Une demi-vie courte suit vite les changements de régime mais donne une estimation bruitée (peu d'observations effectives) ; une demi-vie longue est stable mais en retard. Le choix de \\(\\lambda\\) se valide hors échantillon, comme un hyperparamètre.", "type": "qcm", "multiple": false, "reponse": "11,20", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["A07_approx", "A07_d_age", "A07_d_inverse", "A07_d_lineaire", "A07_exact", "A07_moins_ln"]}}, {"id": "EB2-A08", "section": "mla", "theme": "Ratio de Sharpe d'une combinaison de stratégies", "difficulte": 3, "temps_cible_s": 135, "enonce": "Deux stratégies ont des rendements annuels \\(R_1\\) et \\(R_2\\) de même écart-type \\(\\sigma > 0\\), de même espérance \\(\\mu > 0\\) et de corrélation 0,5 ; chacune a donc le ratio de Sharpe \\(\\mu/\\sigma = 1\\) (taux sans risque nul). On investit la moitié du capital dans chacune : rendement \\((R_1 + R_2)/2\\).\n\nQuel est le ratio de Sharpe de cette combinaison, arrondi à trois décimales ?", "options": [{"id": "a", "texte": "1,155", "correcte": true, "explication": "Oui : \\(1/\\sqrt{(1 + 0{,}5)/2}\\)."}, {"id": "b", "texte": "1,000", "correcte": false, "explication": "C'est la moyenne des deux Sharpe. L'espérance de la combinaison est la moyenne des espérances, mais son écart-type est plus petit que la moyenne des écarts-types dès que la corrélation est inférieure à 1 : c'est la diversification."}, {"id": "c", "texte": "1,414", "correcte": false, "explication": "C'est \\(\\sqrt2\\), le résultat pour deux stratégies non corrélées. Avec une corrélation 0,5, la variance de la combinaison vaut \\(0{,}75\\,\\sigma^2\\), pas \\(0{,}5\\,\\sigma^2\\)."}, {"id": "d", "texte": "2,000", "correcte": false, "explication": "C'est la somme des deux Sharpe, comme si les espérances s'additionnaient sans que le risque augmente. Le Sharpe ne dépend pas de l'échelle des positions : additionner deux stratégies identiques donnerait encore 1."}], "solution": "Réponse : \\(1/\\sqrt{0{,}75} \\approx 1{,}155\\).\n\nÉtape 1, espérance : \\(\\mathbb{E}[(R_1 + R_2)/2] = \\mu\\).\n\nÉtape 2, variance : \\(\\mathrm{Var}\\big((R_1 + R_2)/2\\big) = \\tfrac14\\big(\\sigma^2 + \\sigma^2 + 2 \\times 0{,}5\\,\\sigma^2\\big) = 0{,}75\\,\\sigma^2\\).\n\nÉtape 3 : Sharpe \\(= \\mu/(\\sigma\\sqrt{0{,}75}) = 1/\\sqrt{0{,}75} \\approx 1{,}155\\).\n\nGénéralisation : \\(N\\) stratégies de même Sharpe \\(S\\), même volatilité et corrélation \\(\\rho\\) deux à deux, à poids égaux, ont un Sharpe \\(S\\sqrt{N/(1 + (N - 1)\\rho)}\\) (même calcul : la variance de la moyenne vaut \\(\\sigma^2(1 + (N - 1)\\rho)/N\\)). Quand \\(N \\to \\infty\\), il tend vers \\(S/\\sqrt\\rho\\), soit 1,414 ici : la corrélation plafonne le gain de diversification, comme pour les arbres d'une forêt aléatoire. Simulation (script) : espérance 1,000 et variance 0,750 du rendement combiné, pour 1 et 0,75.", "type": "qcm", "multiple": false, "reponse": "1,155", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["A08_d_independance", "A08_d_moyenne", "A08_d_somme", "A08_exact", "A08_limite", "A08_moyenne_mc", "A08_var_comb", "A08_var_mc"]}}]}]}</script>
<script>

// La session survit à un rechargement de l'onglet : on se reconnecte alors au même noyau, variables comprises.
const SESSION = (() => { const neuve = Math.random().toString(36).slice(2) + Date.now().toString(36); try { const s = sessionStorage.getItem('atelier-quant:session') || neuve; sessionStorage.setItem('atelier-quant:session', s); return s; } catch (e) { return neuve; } })();
const page = document.getElementById('page');
const noyauxDemarres = {};
let E = etatNeuf('accueil');

function etatNeuf(phase) { return { phase, courant: 0, debut: null, fin: null, reponses: {}, temps: {}, ordre: {}, cellules: {}, code: {}, controles: {}, ordreControles: {}, vus: {}, partie: {}, enregistrement: null, pauseDepuis: null, pauseTotale: 0 }; }
// Options par défaut : la pause et « Je ne sais pas » sont permis, sauf si l'examen les interdit (examens blancs).
const PAUSE_PERMISE = D.options.pause !== false;
const NSP_PERMIS = D.options.je_ne_sais_pas !== false;
function dureeEcoulee(fin) { return (fin - E.debut - (E.pauseTotale || 0) - (E.pauseDepuis ? fin - E.pauseDepuis : 0)) / 1000; }
const NOTEES = ITEMS.filter(q => q.type !== 'lecon');
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(E)); } catch (e) {} }
function charger() { try { const s = localStorage.getItem(CLE); if (s) E = Object.assign(etatNeuf('accueil'), JSON.parse(s)); } catch (e) {} }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function enLigne(t) { return esc(t).replace(/`([^`]+)`/g, '<code class="sans-math">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

// Markdown réduit : titres #, tableaux |, listes - et 1., paragraphes, `code`, **gras**, blocs entre triples accents graves.
function rendre(t) {
  let h = '';
  String(t).split('```').forEach((bloc, i) => {
    if (i % 2) {
      const info = (bloc.match(/^(\w*)\n/) || [])[1];
      h += '<pre class="sans-math' + (info === 'sortie' ? ' sortie-lecon' : '') + '"><code>' + esc(bloc.replace(/^\w*\n/, '')) + '</code></pre>';
      return;
    }
    const lignes = bloc.split('\n');
    let k = 0;
    while (k < lignes.length) {
      const l = lignes[k];
      if (!l.trim()) { k++; continue; }
      const titre = l.match(/^(#{1,4})\s+(.*)$/);
      if (titre) { const n = Math.min(4, titre[1].length + 1); h += '<h' + n + '>' + enLigne(titre[2]) + '</h' + n + '>'; k++; continue; }
      if (l.trim().startsWith('|')) {
        const rangs = [];
        while (k < lignes.length && lignes[k].trim().startsWith('|')) { rangs.push(lignes[k].trim()); k++; }
        const cellules = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
        h += '<div class="defile"><table><tr>' + cellules(rangs[0]).map(c => '<th>' + enLigne(c) + '</th>').join('') + '</tr>';
        rangs.slice(1).filter(r => !/^\|[\s|:-]+\|$/.test(r)).forEach(r => { h += '<tr>' + cellules(r).map(c => '<td>' + enLigne(c) + '</td>').join('') + '</tr>'; });
        h += '</table></div>'; continue;
      }
      const puce = /^\s*[-*]\s+/, numero = /^\s*\d+\.\s+/;
      if (puce.test(l) || numero.test(l)) {
        const motif = puce.test(l) ? puce : numero, balise = motif === puce ? 'ul' : 'ol';
        h += '<' + balise + '>';
        while (k < lignes.length && motif.test(lignes[k])) { h += '<li>' + enLigne(lignes[k].replace(motif, '')) + '</li>'; k++; }
        h += '</' + balise + '>'; continue;
      }
      const par = [];
      while (k < lignes.length && lignes[k].trim() && !/^(#{1,4}\s|\s*\||\s*[-*]\s|\s*\d+\.\s)/.test(lignes[k])) { par.push(lignes[k]); k++; }
      const texte = par.join('\n').trim();
      // Un paragraphe réduit à une seule formule est centré ; une formule au milieu d'une phrase reste dans la ligne.
      const seule = texte.startsWith('\\(') && texte.endsWith('\\)') && texte.indexOf('\\(', 2) < 0;
      h += (seule ? '<p class="formule">' : '<p>') + enLigne(par.join('\n')) + '</p>';
    }
  });
  return h;
}
function composer(el) { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el || page]).catch(() => {}); }
function mmss(s) { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function melanger(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function api(chemin, corps) {
  const r = await fetch(chemin, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
  return r.json();
}

let dernierTic = null;
function tic() {
  const ch = document.getElementById('chrono');
  const bouton = document.getElementById('pause');
  bouton.hidden = !(PAUSE_PERMISE && E.phase === 'epreuve');
  document.getElementById('recommencerHaut').hidden = E.phase !== 'epreuve';
  document.getElementById('voile').hidden = !(E.phase === 'epreuve' && E.pauseDepuis);
  if (E.phase !== 'epreuve' || E.pauseDepuis) { dernierTic = null; return; }
  const maintenant = Date.now();
  if (dernierTic !== null) { const q = ITEMS[E.courant]; E.temps[q.id] = (E.temps[q.id] || 0) + (maintenant - dernierTic) / 1000; }
  dernierTic = maintenant;
  const reste = D.duree_minutes * 60 - dureeEcoulee(maintenant);
  ch.textContent = (reste < 0 ? '+' : '') + mmss(Math.abs(reste));
  ch.classList.toggle('depasse', reste < 0);
}
setInterval(() => { tic(); if (E.phase === 'epreuve') sauver(); }, 500);
if (SERVEUR) document.getElementById('lienAccueil').hidden = false;
document.getElementById('lienAccueil').onclick = () => {
  if (E.phase === 'epreuve' && PAUSE_PERMISE && !E.pauseDepuis) { tic(); E.pauseDepuis = Date.now(); sauver(); }
};
document.getElementById('recommencerHaut').onclick = () => {
  if (!confirm('Effacer ce passage (réponses, code, chronomètre) et revenir au début de la séance ?')) return;
  try { localStorage.removeItem(CLE); } catch (e) {}
  E = etatNeuf('accueil'); dernierTic = null; afficher();
};
document.getElementById('pause').onclick = () => { tic(); E.pauseDepuis = Date.now(); sauver(); tic(); };
document.getElementById('reprendre').onclick = () => {
  if (E.pauseDepuis) { E.pauseTotale = (E.pauseTotale || 0) + (Date.now() - E.pauseDepuis); E.pauseDepuis = null; }
  dernierTic = null; sauver(); tic();
};

// ------------------------------------------------------------------ accueil
function accueil() {
  page.className = '';
  document.getElementById('position').textContent = '';
  document.getElementById('chrono').textContent = mmss(D.duree_minutes * 60);
  let h = '<div class="carte presentation"><h2>' + esc(D.titre) + '</h2><p class="meta">' + D.duree_minutes + ' min · ' + NOTEES.length + ' question' + (NOTEES.length > 1 ? 's' : '') + (D.options.pause === false ? ' · sans pause' : '') + '</p>' + rendre(D.presentation);
  h += '<div class="sections-liste">';
  D.sections.forEach(s => { const n = s.questions.filter(q => q.type !== 'lecon').length; h += '<div><span>' + esc(s.nom) + '</span><span class="meta">' + (n ? n + ' question' + (n > 1 ? 's' : '') : 'leçon') + ' · ' + s.budget_min + ' min</span></div>'; });
  h += '</div>';
  D.avertissements.forEach(a => { h += '<div class="note">' + rendre(a) + '</div>'; });
  if (!SERVEUR && ITEMS.some(q => q.type === 'code')) h += '<div class="note"><p><strong>Le notebook ne peut pas s\'exécuter :</strong> cette page est ouverte comme un fichier. Lance <code class="sans-math">python lancer.py</code> dans le dossier du projet, puis ouvre l\'examen depuis la page qui s\'affiche.</p></div>';
  h += '<p class="meta">' + esc(D.conventions) + '</p>';
  h += '<div class="barre"><button class="principal" id="demarrer">Commencer</button></div></div>';
  page.innerHTML = h;
  document.getElementById('demarrer').onclick = () => {
    E = etatNeuf('epreuve');
    E.debut = Date.now();
    ITEMS.forEach(q => {
      if (q.type === 'qcm') E.ordre[q.id] = melanger(q.options.map(o => o.id));
      if (q.cellules_initiales) E.cellules[q.id] = q.cellules_initiales.map(c => ({ code: c, sortie: '', numero: null }));
      if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => { E.ordreControles[q.id + ':' + cid] = melanger(c.options.map(o => o.id)); });
    });
    sauver(); afficher();
  };
  composer();
}

// ------------------------------------------------------------------ épreuve
function pastilles() {
  const faite = it => it.type === 'lecon' ? !!E.vus[it.id] : it.type === 'code' ? (E.code[it.id] || {}).soumissions > 0 : E.reponses[it.id] !== undefined;
  const barre = document.querySelector('#progression > span');
  if (barre) barre.style.width = (100 * ITEMS.filter(faite).length / ITEMS.length) + '%';
  let h = '<div class="cadre"><aside class="plan"><div id="pastilles">', section = null, n = 0;
  ITEMS.forEach((it, i) => {
    if (it.nomSection !== section) { section = it.nomSection; h += '<div class="groupe">' + esc(section) + '</div>'; }
    const libelle = it.type === 'lecon' ? 'Leçon' : 'Question ' + (++n);
    h += '<button class="pastille' + (faite(it) ? ' faite' : '') + (i === E.courant ? ' courante' : '') + '" data-i="' + i + '" title="' + esc(it.theme) + '"' + (D.options.retour_arriere || i === E.courant ? '' : ' disabled') + '><span class="etat"></span><span class="libelle">' + libelle + '</span></button>';
  });
  return h + '</div></aside><div class="contenu">';
}
const FIN_CADRE = '</div></div>';
function navigation() {
  let h = '<div class="barre navigation">';
  if (D.options.retour_arriere) h += '<button id="prec"' + (E.courant === 0 ? ' disabled' : '') + '>Précédente</button>';
  if (E.courant < ITEMS.length - 1) h += '<button class="principal" id="suiv">Suivante</button>';
  return h + '<button id="finir">Terminer et corriger</button></div>';
}
function brancherNavigation() {
  const aller = i => { tic(); E.courant = i; sauver(); afficher(); };
  page.querySelectorAll('.pastille').forEach(b => b.onclick = () => aller(Number(b.dataset.i)));
  const p = document.getElementById('prec'); if (p) p.onclick = () => aller(E.courant - 1);
  const s = document.getElementById('suiv'); if (s) s.onclick = () => aller(E.courant + 1);
  document.getElementById('finir').onclick = () => {
    const manquantes = NOTEES.filter(it => it.type === 'code' ? !((E.code[it.id] || {}).soumissions > 0) : E.reponses[it.id] === undefined).length;
    if (manquantes && !confirm(manquantes + ' question(s) sans réponse ou jamais soumise(s). Terminer quand même ?')) return;
    tic();
    if (E.pauseDepuis) { E.pauseTotale = (E.pauseTotale || 0) + (Date.now() - E.pauseDepuis); E.pauseDepuis = null; }
    E.phase = 'bilan'; E.fin = Date.now(); sauver(); afficher();
  };
}

function epreuve() {
  tic();
  const q = ITEMS[E.courant];
  document.getElementById('position').textContent = q.nomSection + (q.type === 'lecon' ? ' · étape ' : ' · question ') + (E.courant + 1) + ' sur ' + ITEMS.length;
  if (q.type === 'lecon') E.vus[q.id] = true;
  if (q.cellules_initiales) return epreuveCode(q);
  if (q.type === 'lecon') return epreuveLecon(q);
  page.className = '';
  const rang = NOTEES.indexOf(q) + 1;
  let h = pastilles() + '<div class="carte question"><div class="surtitre"><span class="rang">Question ' + rang + ' sur ' + NOTEES.length + '</span><span class="chip">' + esc(q.theme) + '</span><span>temps visé ' + mmss(q.temps_cible_s) + '</span></div>' + rendre(q.enonce);
  h += '<p class="consigne">' + (q.multiple ? 'Une ou plusieurs réponses : coche toutes les affirmations justes, et seulement elles (notation tout ou rien).' : 'Une seule réponse.') + '</p>';
  E.ordre[q.id].forEach((oid, k) => {
    const o = q.options.find(x => x.id === oid);
    h += '<div class="option' + (choisies(q).includes(oid) ? ' choisie' : '') + '" data-o="' + oid + '"><span class="lettre' + (q.multiple ? ' carre' : '') + '">' + 'ABCDE'[k] + '</span><div>' + rendre(o.texte) + '</div></div>';
  });
  if (NSP_PERMIS) h += '<div class="option' + (E.reponses[q.id] === 'nsp' ? ' choisie' : '') + '" data-o="nsp"><span class="lettre">?</span><div><p>Je ne sais pas (compte comme faux, mais évite qu\'un hasard heureux masque une lacune)</p></div></div>';
  page.innerHTML = h + navigation() + '</div>' + FIN_CADRE;
  page.querySelectorAll('.option').forEach(el => el.onclick = () => {
    const o = el.dataset.o;
    if (q.multiple && o !== 'nsp') {
      const s = choisies(q), k = s.indexOf(o);
      if (k >= 0) s.splice(k, 1); else s.push(o);
      if (s.length) E.reponses[q.id] = s.sort(); else delete E.reponses[q.id];
    } else if (E.reponses[q.id] === o) delete E.reponses[q.id]; else E.reponses[q.id] = o;
    sauver(); afficher();
  });
  brancherNavigation();
  composer();
}

// ------------------------------------------------------------------ notebook
function epreuveLecon(q) {
  page.className = 'lecture';
  page.innerHTML = pastilles() + '<div class="carte enonce"><div class="surtitre"><span class="rang">Leçon</span><span class="chip">' + esc(q.theme) + '</span><span>environ ' + Math.round(q.temps_cible_s / 60) + ' min</span></div>' + rendreLecon(q) + navigation() + '</div>' + FIN_CADRE;
  brancherControles(q);
  brancherNavigation();
  composer();
}

// Points de contrôle : question corrigée dès le clic, non notée.
function rendreLecon(q) {
  const brut = rendre(q.contenu).replace(/<p>\[\[controle:([\w-]+)\]\]<\/p>/g, (_, cid) => '<div class="controle" data-c="' + cid + '"></div>');
  // Une partie par titre de niveau 2 ; dans chaque partie, un bloc par rubrique (problème, énoncé, preuve, exemple...).
  const source = document.createElement('div');
  source.innerHTML = brut;
  const parties = [];
  Array.from(source.childNodes).forEach(n => {
    if (n.nodeName === 'H3' || !parties.length) parties.push({ titre: n.nodeName === 'H3' ? n.textContent : 'Introduction', noeuds: [] });
    parties[parties.length - 1].noeuds.push(n);
  });
  const genre = t => /preuve/i.test(t) ? 'preuve' : /pi[èe]ge/i.test(t) ? 'pieges' : /exemple|exp[ée]rience/i.test(t) ? 'exemple'
    : /[ée]nonc[ée]/i.test(t) ? 'enonce-bloc' : /intuition/i.test(t) ? 'intuition' : /probl[èe]me/i.test(t) ? 'probleme'
    : /cas limites/i.test(t) ? 'limites' : /d[ée]finition|notation|cadre|mod[èe]le/i.test(t) ? 'definitions' : '';
  const courante = Math.min((E.partie || {})[q.id] || 0, parties.length - 1);
  let h = '<div class="lecon-corps" data-lecon="' + q.id + '"><nav class="sommaire">';
  parties.forEach((p, k) => { h += '<button data-partie="' + k + '"' + (k === courante ? ' class="active"' : '') + '>' + (k + 1) + '. ' + esc(p.titre.replace(/^(Leçon|Partie \d+|Outil \d+|\d+\.)\s*:?\s*/i, '').slice(0, 42) || p.titre) + '</button>'; });
  h += '</nav>';
  parties.forEach((p, k) => {
    h += '<section class="partie" data-partie="' + k + '"' + (k === courante ? '' : ' hidden') + '>';
    let bloc = null;
    const fermer = () => { if (bloc) { h += bloc.genre === 'question' ? ficheDebrief(bloc.titre, bloc.noeuds) : bloc.genre === 'preuve' ? '</details>' : '</div>'; bloc = null; } };
    p.noeuds.forEach(n => {
      if (bloc && bloc.genre === 'question' && n.nodeName !== 'H4' && n.nodeName !== 'H3') { bloc.noeuds.push(n); return; }
      if (n.nodeName === 'H4' && /^Question \d+/.test(n.textContent)) {
        fermer();
        bloc = { genre: 'question', titre: n.textContent, noeuds: [] };
      } else if (n.nodeName === 'H4') {
        fermer();
        const g = genre(n.textContent);
        bloc = { genre: g };
        if (g === 'preuve') h += '<details class="bloc preuve"><summary>' + esc(n.textContent) + '<span class="meta">déplier pour la lire</span></summary>';
        else h += '<div class="bloc ' + g + '"><h4>' + esc(n.textContent) + '</h4>';
      } else if (n.nodeName === 'H3') { fermer(); h += n.outerHTML; }
      else h += n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    });
    fermer();
    h += '<div class="pied-partie"><button data-aller="' + (k - 1) + '"' + (k === 0 ? ' disabled' : '') + '>Partie précédente</button>'
      + '<span class="meta">Partie ' + (k + 1) + ' sur ' + parties.length + '</span>'
      + (k < parties.length - 1 ? '<button class="principal" data-aller="' + (k + 1) + '">Partie suivante</button>' : '<span class="meta">Fin de la leçon : passe à la suite avec « Suivante ».</span>') + '</div></section>';
  });
  return h + '</div>';
}
// Une question du débrief : en-tête (numéro, titre, verdict), énoncé, réponses côte à côte, rubriques, à retenir.
function ficheDebrief(titre, noeuds) {
  const m = titre.match(/^(Question \d+)\s*:?\s*(.*)$/);
  const gras = n => n.nodeName === 'P' && n.firstChild && n.firstChild.nodeName === 'STRONG' ? n.firstChild.textContent.trim() : '';
  const reste = n => { const c = n.cloneNode(true); c.removeChild(c.firstChild); return c.innerHTML.trim(); };
  let enonce = '', ta = null, attendue = null, verdict = '', corps = '', retenir = '', revoir = '', etat = 'enonce';
  noeuds.forEach(n => {
    const g = gras(n), html = n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    if (/^Ta réponse/.test(g)) { ta = reste(n); etat = 'corps'; }
    else if (/^Réponse attendue/.test(g)) { attendue = reste(n); etat = 'corps'; }
    else if (/^Verdict/.test(g)) { verdict = reste(n); etat = 'corps'; }
    else if (/^À retenir/.test(g)) { retenir = '<h5>À retenir</h5><p>' + reste(n) + '</p>'; etat = 'retenir'; }
    else if (/^Leçon à revoir/.test(g)) { revoir = reste(n); etat = 'fin'; }
    else if (g && n.textContent.trim() === g) { corps += '<h5>' + esc(g.replace(/[.:]\s*$/, '')) + '</h5>'; etat = 'corps'; }
    else if (etat === 'enonce') enonce += n.nodeName === 'P' && /^Type :/.test(n.textContent) ? '<p class="meta">' + n.innerHTML + '</p>' : n.nodeName === 'UL' ? '<ul class="choix">' + n.innerHTML + '</ul>' : html;
    else if (etat === 'retenir') retenir += html;
    else corps += html;
  });
  const brut = verdict.replace(/<[^>]+>/g, '').trim();
  const v = /^juste/i.test(brut) ? ['v-juste', 'Juste'] : /^fausse/i.test(brut) ? ['v-fausse', 'Fausse'] : /^incompl/i.test(brut) ? ['v-incomplete', 'Incomplète']
    : /^non visible/i.test(brut) ? ['', 'Réponse non visible'] : ['', ''];
  const suite = brut.replace(/^[^.]*\.\s*/, '');
  let h = '<article class="fiche ' + v[0] + '"><header class="fiche-tete"><span class="num">' + esc(m[1]) + '</span><span class="titre">' + esc(m[2]) + '</span>'
    + (v[1] ? '<span class="verdict">' + v[1] + '</span>' : '') + '</header><div class="fiche-corps">';
  if (ta === null && attendue === null) return h + enonce + corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '') + '</div></article>';
  h += '<h5>Énoncé</h5>' + enonce;
  h += '<div class="fiche-reponses"><div><span class="lab">Ta réponse</span>' + (ta || 'non visible') + '</div><div><span class="lab">Réponse attendue</span>' + (attendue || '') + '</div></div>';
  if (suite) h += '<p class="meta">' + verdict.replace(/^[^.]*\.\s*/, '') + '</p>';
  h += corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '');
  return h + '</div></article>';
}
function brancherLecon(q) {
  const corps = page.querySelector('.lecon-corps');
  if (!corps) return;
  const aller = k => {
    if (!E.partie) E.partie = {};
    E.partie[q.id] = k; sauver();
    corps.querySelectorAll('.partie').forEach(sec => { sec.hidden = Number(sec.dataset.partie) !== k; });
    corps.querySelectorAll('.sommaire button').forEach(b => b.classList.toggle('active', Number(b.dataset.partie) === k));
    const cadre = corps.closest('.enonce');
    if (cadre) cadre.scrollTop = 0;
    window.scrollTo(0, 0);
  };
  corps.querySelectorAll('.sommaire button').forEach(b => b.onclick = () => aller(Number(b.dataset.partie)));
  corps.querySelectorAll('[data-aller]').forEach(b => b.onclick = () => aller(Number(b.dataset.aller)));
}
function dessinerControle(q, el) {
  const cid = el.dataset.c, c = q.controles[cid], cle = q.id + ':' + cid, choix = E.controles[cle];
  const ordre = E.ordreControles[cle] || c.options.map(o => o.id);
  let h = '<p class="titre-controle">Point de contrôle' + (choix ? (c.options.find(o => o.id === choix).correcte ? ' · juste' : ' · à revoir') : '') + '</p>' + rendre(c.question);
  ordre.forEach((oid, k) => {
    const o = c.options.find(x => x.id === oid);
    const classe = choix ? (o.correcte ? ' juste' : (oid === choix ? ' fausse' : '')) + (oid === choix ? ' choisie' : '') : '';
    const montrer = choix && (oid === choix || o.correcte);
    h += '<div class="option' + classe + '" data-co="' + oid + '"><span class="lettre">' + 'ABCD'[k] + '</span><div>' + rendre(o.texte)
      + (montrer ? '<div class="explication">' + rendre(o.explication) + '</div>' : '') + '</div></div>';
  });
  el.innerHTML = h;
  if (!choix) el.querySelectorAll('.option').forEach(op => op.onclick = () => { E.controles[cle] = op.dataset.co; sauver(); dessinerControle(q, el); composer(el); });
}
function brancherControles(q) { page.querySelectorAll('.controle').forEach(el => dessinerControle(q, el)); brancherLecon(q); }

function epreuveCode(q) {
  page.className = 'large';
  const lecon = q.type === 'lecon';
  let h = pastilles() + '<div class="deux' + (lecon ? ' lecon' : '') + '"><div class="carte enonce"><div class="meta">' + esc(q.theme) + (lecon ? ' · durée visée ' : ' · temps cible ') + mmss(q.temps_cible_s) + '</div>' + (lecon ? rendreLecon(q) : rendre(q.enonce)) + '</div>';
  h += '<div class="carte"><div class="notebook-barre"><button id="toutExecuter">Tout exécuter</button><button id="redemarrer">Redémarrer le noyau</button><button id="ajouter">Ajouter une cellule</button><span class="meta" id="versions">' + (SERVEUR ? 'noyau : démarrage...' : 'noyau indisponible : lance python lancer.py') + '</span><span class="meta" id="modeEditeur"></span></div>';
  h += '<div id="cellules"></div>';
  if (!lecon) h += '<div class="barre"><button id="testsVisibles">Tests visibles</button><button class="principal" id="soumettre">Soumettre</button><span class="meta" id="etatSoumission"></span></div>';
  h += '<div class="resultats-tests" id="resultatsTests"></div>' + navigation() + '</div></div>' + FIN_CADRE;
  page.innerHTML = h;

  if (lecon) brancherControles(q); else afficherEtatSoumission(q);
  brancherNavigation();
  document.getElementById('toutExecuter').onclick = async () => { for (let i = 0; i < E.cellules[q.id].length; i++) { if (!(await executerCellule(q, i))) break; } };
  document.getElementById('redemarrer').onclick = () => demarrerNoyau(q, true);
  document.getElementById('ajouter').onclick = () => { E.cellules[q.id].push({ code: '', sortie: '', numero: null }); sauver(); dessinerCellules(q); focaliser(E.cellules[q.id].length - 1); };
  if (!lecon) {
    document.getElementById('testsVisibles').onclick = () => lancerTests(q, 'visibles');
    document.getElementById('soumettre').onclick = () => lancerTests(q, 'caches');
  }
  if (!SERVEUR) page.querySelectorAll('.notebook-barre button, #testsVisibles, #soumettre').forEach(b => b.disabled = true);
  else if (!noyauxDemarres[q.id]) demarrerNoyau(q, false, true);
  else document.getElementById('versions').textContent = noyauxDemarres[q.id];
  composer(page.querySelector('.enonce'));
}

async function demarrerNoyau(q, confirmer, reconnexion) {
  if (confirmer && !confirm('Redémarrer le noyau ? Toutes les variables seront perdues.')) return;

  else {
    const etat = v.neuf ? 'noyau neuf' : 'noyau reconnecté, variables conservées';
    noyauxDemarres[q.id] = v.erreur ? 'noyau : ' + v.erreur : etat + ' · Python ' + v.python + ' · pandas ' + v.pandas + ' · numpy ' + v.numpy;

function rendreSortie(c) { return c.sortie || ''; }

// ------------------------------------------------------------------ éditeur
// Monaco (l'éditeur de VS Code) depuis cdnjs ; les suggestions, signatures et aides viennent de jedi
// dans le noyau, qui connaît les variables déjà exécutées. Sans connexion, repli sur une zone de texte simple.
const MONACO_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min';
let MONACO = null, promesseMonaco = null;
const EDITEURS = [];
window.EDITEURS = EDITEURS;
// Monaco annule ses tâches en cours quand on ferme un éditeur ; cette annulation n'est pas une erreur.
window.addEventListener('unhandledrejection', ev => { if (ev.reason && ev.reason.name === 'Canceled') ev.preventDefault(); });
function sombre() { return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; }
function questionCode() { const q = ITEMS[E.courant]; return E.phase === 'epreuve' && q && q.cellules_initiales ? q : null; }
function chargerMonaco() {
  if (promesseMonaco) return promesseMonaco;
  promesseMonaco = new Promise(resolve => {
    const abandon = setTimeout(() => fini(null), 20000);
    function fini(m) { clearTimeout(abandon); if (window.MODE_EDITEUR === undefined) { MONACO = m; window.MODE_EDITEUR = m ? 'monaco' : 'simple'; } resolve(MONACO); }
    const s = document.createElement('script');
    s.src = MONACO_BASE + '/vs/loader.js';
    s.onerror = () => fini(null);
    s.onload = () => {
      window.MonacoEnvironment = { getWorkerUrl: () => 'data:text/javascript;charset=utf-8,' + encodeURIComponent("self.MonacoEnvironment={baseUrl:'" + MONACO_BASE + "/'};importScripts('" + MONACO_BASE + "/vs/base/worker/workerMain.js');") };
      window.require.config({ paths: { vs: MONACO_BASE + '/vs' } });
      window.require(['vs/editor/editor.main'], () => { try { configurerMonaco(window.monaco); fini(window.monaco); } catch (e) { fini(null); } }, () => fini(null));
    };
    document.head.appendChild(s);
  });
  return promesseMonaco;
}
async function aide(type, model, position) {
  const q = questionCode();
  if (!q || !SERVEUR) return null;
  try { return await api('/api/' + type, { session: SESSION, dossier: q.dossier, code: model.getValue(), ligne: position.lineNumber, colonne: position.column - 1 }); }
  catch (e) { return null; }
}
function configurerMonaco(m) {
  const K = m.languages.CompletionItemKind;
  const genres = { module: K.Module, class: K.Class, instance: K.Variable, function: K.Function, param: K.Variable, path: K.File, keyword: K.Keyword, property: K.Property, statement: K.Variable };
  m.languages.registerCompletionItemProvider('python', {
    triggerCharacters: ['.'],
    provideCompletionItems: async (model, position) => {
      const r = await aide('completer', model, position);
      if (!r || !r.completions) return { suggestions: [] };
      const mot = model.getWordUntilPosition(position);
      const plage = new m.Range(position.lineNumber, mot.startColumn, position.lineNumber, mot.endColumn);
      return { suggestions: r.completions.map((c, k) => ({ label: c.nom, kind: genres[c.type] ?? K.Variable, insertText: c.nom, detail: c.description, range: plage, sortText: String(k).padStart(4, '0') })) };
    }
  });
  m.languages.registerSignatureHelpProvider('python', {
    signatureHelpTriggerCharacters: ['(', ','],
    provideSignatureHelp: async (model, position) => {
      const r = await aide('signatures', model, position);
      if (!r || !r.signatures || !r.signatures.length) return null;
      return { value: { signatures: r.signatures.map(x => ({ label: x.texte, documentation: x.doc, parameters: x.parametres.map(p => ({ label: p })) })), activeSignature: 0, activeParameter: r.signatures[0].index ?? 0 }, dispose() {} };
    }
  });
  m.languages.registerHoverProvider('python', {
    provideHover: async (model, position) => {
      const r = await aide('aide', model, position);
      if (!r || !r.aide || !r.aide.length) return null;
      return { contents: r.aide.map(a => ({ value: '```text\n' + a.doc + '\n```' })) };
    }
  });
}
function creerEditeur(conteneur, code, rappels) {
  if (MONACO) {
    const m = MONACO;
    const ed = m.editor.create(conteneur, {
      value: code, language: 'python', theme: sombre() ? 'vs-dark' : 'vs', fontSize: 14, tabSize: 4, insertSpaces: true,
      minimap: { enabled: false }, scrollBeyondLastLine: false, automaticLayout: true, lineNumbersMinChars: 3, folding: false,
      glyphMargin: false, renderLineHighlight: 'none', overviewRulerLanes: 0, wordBasedSuggestions: 'off', fixedOverflowWidgets: true,
      quickSuggestions: { other: true, comments: false, strings: false }, padding: { top: 6, bottom: 6 },
      scrollbar: { alwaysConsumeMouseWheel: false, vertical: 'hidden', horizontalScrollbarSize: 8 }
    });
    // Sous Windows, Monaco utilise des fins de ligne \r\n ; le code est toujours lu avec des \n, comme dans un notebook.
    const lire = () => ed.getModel().getValue(m.editor.EndOfLinePreference.LF);
    const hauteur = () => { conteneur.style.height = Math.max(38, ed.getContentHeight()) + 'px'; };
    ed.onDidContentSizeChange(hauteur); hauteur();
    ed.onDidChangeModelContent(() => rappels.modif(lire()));
    ed.onDidFocusEditorText(rappels.focus);
    ed.addCommand(m.KeyMod.Shift | m.KeyCode.Enter, rappels.executerSuivant, '!suggestWidgetVisible');
    ed.addCommand(m.KeyMod.CtrlCmd | m.KeyCode.Enter, rappels.executer, '!suggestWidgetVisible');
    return { brut: ed, getValue: lire, setValue: v => ed.setValue(v), focus: () => ed.focus(), dispose: () => ed.dispose() };
  }
  const zone = document.createElement('textarea');
  zone.spellcheck = false; zone.autocomplete = 'off'; zone.className = 'sans-math';
  zone.value = code;
  conteneur.appendChild(zone);
  zone.addEventListener('input', () => { rappels.modif(zone.value); ajuster(zone); });
  zone.addEventListener('focus', rappels.focus);
  zone.addEventListener('keydown', ev => clavier(ev, zone, rappels));
  setTimeout(() => ajuster(zone));
  return { brut: zone, getValue: () => zone.value, setValue: v => { zone.value = v; zone.dispatchEvent(new Event('input')); }, focus: () => zone.focus(), dispose: () => {} };
}
function libererEditeurs() { EDITEURS.forEach(e => e.dispose()); EDITEURS.length = 0; }

function dessinerCellules(q) {
  const conteneur = document.getElementById('cellules');
  if (!conteneur) return;
  if (SERVEUR && window.MODE_EDITEUR === undefined) {
    conteneur.innerHTML = '<p class="meta">Chargement de l\'éditeur...</p>';
    chargerMonaco().then(() => { if (questionCode() === q) dessinerCellules(q); });
    return;
  }
  libererEditeurs();
  conteneur.innerHTML = '';
  const etat = document.getElementById('modeEditeur');
  if (etat) etat.textContent = MONACO ? 'éditeur VS Code, autocomplétion' : 'éditeur simple' + (SERVEUR ? ' (Monaco injoignable)' : '');
  E.cellules[q.id].forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'cellule';
    div.innerHTML = '<div class="numero">[' + (c.numero === null ? ' ' : c.numero) + ']</div><div><div class="editeur"></div>'
      + '<div class="actions"><button data-a="executer">Exécuter</button><button data-a="dessous">Insérer dessous</button><button data-a="supprimer">Supprimer</button></div>'
      + '<pre class="sortie sans-math"></pre></div>';
    div.querySelector('pre.sortie').innerHTML = rendreSortie(c);
    conteneur.appendChild(div);
    EDITEURS.push(creerEditeur(div.querySelector('.editeur'), c.code, {
      modif: v => { c.code = v; sauver(); },
      focus: () => { conteneur.querySelectorAll('.cellule').forEach(x => x.classList.remove('active')); div.classList.add('active'); },
      executer: () => executerCellule(q, i),
      executerSuivant: () => {
        executerCellule(q, i);
        if (i === E.cellules[q.id].length - 1) { E.cellules[q.id].push({ code: '', sortie: '', numero: null }); sauver(); dessinerCellules(q); }
        focaliser(i + 1);
      }
    }));
    div.querySelector('[data-a=executer]').onclick = () => executerCellule(q, i);
    div.querySelector('[data-a=dessous]').onclick = () => { E.cellules[q.id].splice(i + 1, 0, { code: '', sortie: '', numero: null }); sauver(); dessinerCellules(q); focaliser(i + 1); };
    div.querySelector('[data-a=supprimer]').onclick = () => { if (E.cellules[q.id].length > 1) { E.cellules[q.id].splice(i, 1); sauver(); dessinerCellules(q); } };
  });
}
function majNumeros(q) { document.querySelectorAll('#cellules .numero').forEach((n, i) => { const c = E.cellules[q.id][i]; n.textContent = '[' + (c && c.numero !== null ? c.numero : ' ') + ']'; }); }
function ajuster(zone) { zone.style.height = 'auto'; zone.style.height = (zone.scrollHeight + 2) + 'px'; }
function focaliser(i) { const e = EDITEURS[i]; if (e) e.focus(); }
function inserer(zone, texte) {
  zone.focus();
  if (!document.execCommand('insertText', false, texte)) zone.setRangeText(texte, zone.selectionStart, zone.selectionEnd, 'end');
  zone.dispatchEvent(new Event('input'));
}
function clavier(ev, zone, rappels) {
  if (ev.key === 'Enter' && (ev.shiftKey || ev.ctrlKey)) {
    ev.preventDefault();
    if (ev.shiftKey) rappels.executerSuivant(); else rappels.executer();
    return;
  }
  const debut = zone.selectionStart, fin = zone.selectionEnd, v = zone.value;
  const debutLigne = v.lastIndexOf('\n', debut - 1) + 1;
  if (ev.key === 'Tab') {
    ev.preventDefault();
    const multi = v.slice(debut, fin).includes('\n');
    if (!ev.shiftKey && !multi) { inserer(zone, '    '); return; }
    const finBloc = fin;
    const bloc = v.slice(debutLigne, finBloc);
    const nouveau = ev.shiftKey ? bloc.replace(/^ {1,4}/gm, '') : bloc.replace(/^/gm, '    ');
    zone.setSelectionRange(debutLigne, finBloc);
    inserer(zone, nouveau);
    zone.setSelectionRange(debutLigne, debutLigne + nouveau.length);
    return;
  }
  if (ev.key === 'Enter' && !ev.altKey && !ev.metaKey) {
    ev.preventDefault();
    const ligne = v.slice(debutLigne, debut);
    let retrait = ligne.match(/^ */)[0];
    if (/:\s*(#.*)?$/.test(ligne)) retrait += '    ';
    inserer(zone, '\n' + retrait);
  }
}

async function executerCellule(q, i) {
  if (!SERVEUR) return false;
  const c = E.cellules[q.id][i];
  const div = document.querySelectorAll('#cellules .cellule')[i];
  if (div) { div.querySelector('.numero').textContent = '[*]'; div.querySelector('pre.sortie').innerHTML = ''; }
  let r;
  try { r = await api('/api/executer', { session: SESSION, dossier: q.dossier, code: c.code, nom: 'cellule ' + (i + 1) }); }
  catch (e) { r = { erreur: 'Serveur injoignable : lancer.py est-il démarré ?' }; }
  E.compteur = (E.compteur || 0) + 1;
  c.numero = E.compteur;
  let h = '';
  if (r.sortie) h += esc(r.sortie);
  if (r.valeur !== null && r.valeur !== undefined) h += (h && !h.endsWith('\n') ? '\n' : '') + esc(r.valeur);
  if (r.erreur) h += (h && !h.endsWith('\n') ? '\n' : '') + '<span class="erreur">' + esc(r.erreur) + '</span>';
  if (r.redemarre) { noyauxDemarres[q.id] = 'noyau redémarré : variables perdues'; const z = document.getElementById('versions'); if (z) z.textContent = noyauxDemarres[q.id]; }
  c.sortie = h;
  sauver();
  const d = document.querySelectorAll('#cellules .cellule')[i];
  if (d) { d.querySelector('.numero').textContent = '[' + c.numero + ']'; d.querySelector('pre.sortie').innerHTML = h; }
  return !r.erreur;
}

function codeSource(q) { return E.cellules[q.id].map((c, i) => '# %% cellule ' + (i + 1) + '\n' + c.code).join('\n\n') + '\n'; }
function afficherEtatSoumission(q) {
  const s = E.code[q.id] || {};
  const z = document.getElementById('etatSoumission');
  if (z) z.textContent = s.soumissions ? s.soumissions + ' soumission(s) · dernière : ' + s.caches_reussis + '/' + s.caches_total + ' tests cachés réussis' : 'jamais soumis';
}
async function lancerTests(q, mode) {

  zone.innerHTML = '<p class="meta">' + (mode === 'visibles' ? 'Tests visibles' : 'Tests cachés') + ' en cours...</p>';

  let h = '<p class="etiquette ' + (r.reussis === r.total ? 'bon' : 'faux') + '">' + (mode === 'visibles' ? 'Tests visibles : ' : 'Tests cachés : ') + r.reussis + '/' + r.total + ' réussis</p>';

    h += '</table></div>';

    h += '</table></div>';
    const s = E.code[q.id] || {};
    E.code[q.id] = Object.assign(s, { soumissions: (s.soumissions || 0) + 1, caches_reussis: r.reussis, caches_total: r.total, details: r.resultats, code_source: codeSource(q) });
    afficherEtatSoumission(q);

// ------------------------------------------------------------------ bilan
function points(q) {
  if (q.type === 'code') { const c = E.code[q.id]; return c && c.soumissions ? c.caches_reussis / c.caches_total : 0; }
  const r = E.reponses[q.id];
  if (r === undefined || r === 'nsp') return 0;
  // Une question à plusieurs réponses est notée tout ou rien : l'ensemble coché doit être exactement l'ensemble juste.
  const s = choisies(q), bonnes = q.options.filter(o => o.correcte).map(o => o.id);
  return s.length === bonnes.length && bonnes.every(b => s.includes(b)) ? 1 : -D.options.penalite;
}
function choisies(q) { const r = E.reponses[q.id]; return r === undefined || r === 'nsp' ? [] : Array.isArray(r) ? r.slice() : [r]; }
function texteOption(q, id) { const o = q.options.find(x => x.id === id); return o ? o.texte : null; }

function resultatJSON(duree) {
  return {
    examen: D.id, debut: new Date(E.debut).toISOString(), duree_s: Math.round(duree), pauses_s: Math.round((E.pauseTotale || 0) / 1000), options: D.options,
    lecons: ITEMS.filter(q => q.type === 'lecon').map(q => {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      return { id: q.id, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), controles_justes_du_premier_coup: justes, controles_total: ids.length };
    }),
    questions: NOTEES.map(q => {
      const base = { id: q.id, type: q.type, section: q.section, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), temps_cible_s: q.temps_cible_s, points: Number(points(q).toFixed(4)) };
      if (q.type === 'code') {
        const c = E.code[q.id] || {};
        return Object.assign(base, { soumissions: c.soumissions || 0, caches_reussis: c.caches_reussis || 0, caches_total: c.caches_total || q.tests_caches, visibles_reussis: c.visibles_reussis ?? null, code_source: c.code_source || codeSource(q) });
      }
      const r = E.reponses[q.id] ?? null;
      return Object.assign(base, { reponse: r, reponse_texte: r && r !== 'nsp' ? choisies(q).map(i => texteOption(q, i)).join(' ; ') : null, bonne_reponse_texte: q.options.filter(o => o.correcte).map(o => o.texte).join(' ; ') });
    })
  };
}

function bilan() {
  page.className = '';
  document.getElementById('position').textContent = 'Bilan';
  const duree = dureeEcoulee(E.fin);
  document.getElementById('chrono').textContent = mmss(duree);
  let total = 0;
  let h = '<div class="carte"><h2>Bilan</h2>@SCORE@<div class="defile"><table><tr><th>Section</th><th class="nombre">Score</th><th class="nombre">Temps passé</th><th class="nombre">Temps indicatif</th></tr>';
  D.sections.forEach(s => {
    const notees = s.questions.filter(q => q.type !== 'lecon');
    const pts = notees.reduce((a, q) => a + points(q), 0);
    const t = s.questions.reduce((a, q) => a + (E.temps[q.id] || 0), 0);
    total += pts;
    h += '<tr><td>' + esc(s.nom) + '</td><td class="nombre">' + (notees.length ? pts.toFixed(2).replace('.', ',') + ' / ' + notees.length : 'non notée') + '</td><td class="nombre">' + mmss(t) + '</td><td class="nombre">' + mmss(s.budget_min * 60) + '</td></tr>';
  });
  h += '<tr><th>Total</th><th class="nombre">' + total.toFixed(2).replace('.', ',') + ' / ' + NOTEES.length + '</th><th class="nombre">' + mmss(duree) + '</th><th class="nombre">' + mmss(D.duree_minutes * 60) + '</th></tr></table></div>';
  h = h.replace('@SCORE@', '<div class="score-total"><strong>' + total.toFixed(2).replace('.', ',').replace(/,00$/, '') + ' / ' + NOTEES.length + '</strong><span class="meta">en ' + mmss(duree) + '</span></div>');
  const barreFin = document.querySelector('#progression > span'); if (barreFin) barreFin.style.width = '100%';
  h += '<p id="enregistrement" class="meta"></p>';
  h += '<details><summary>Résultat brut (JSON)</summary><textarea readonly class="json sans-math" id="json"></textarea><div class="barre"><button id="telecharger">Enregistrer le fichier</button></div></details>';
  h += '<div class="barre">' + (SERVEUR ? '<button class="principal" id="retourAccueil">Retour à l\'accueil (séance suivante)</button>' : '')
    + '<button id="recommencer">Effacer et recommencer</button></div></div>';
  ITEMS.forEach((q, i) => {
    const temps = mmss(E.temps[q.id] || 0) + ' sur ' + mmss(q.temps_cible_s) + ' visés';
    const tete = (classe, verdict) => '<article class="fiche ' + classe + '"><header class="fiche-tete"><span class="num">' + (q.type === 'lecon' ? 'Leçon' : 'Question ' + (i + 1)) + '</span><span class="titre">' + esc(q.theme)
      + '</span><span class="temps">' + esc(q.nomSection) + ' · ' + temps + '</span>' + (verdict ? '<span class="verdict">' + verdict + '</span>' : '') + '</header><div class="fiche-corps">';
    if (q.type === 'lecon') {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      h += tete('', '') + '<p>Points de contrôle justes du premier coup : ' + justes + ' sur ' + ids.length + '. La leçon reste consultable depuis la séance.</p></div></article>';
      return;
    }
    if (q.type === 'qcm') {
      const r = E.reponses[q.id], juste = points(q) === 1;
      const s = choisies(q), incomplete = !juste && q.multiple && s.length > 0 && s.every(id => q.options.find(o => o.id === id).correcte);
      h += tete(juste ? 'v-juste' : incomplete ? 'v-incomplete' : r === undefined || r === 'nsp' ? '' : 'v-fausse',
        juste ? 'Juste' : r === undefined ? 'Sans réponse' : r === 'nsp' ? 'Je ne sais pas' : incomplete ? 'Incomplète' : 'Fausse');
      h += '<h5>Énoncé</h5>' + rendre(q.enonce) + '<h5>' + (q.multiple ? 'Options (plusieurs réponses, tout ou rien)' : 'Options') + '</h5>';
      E.ordre[q.id].forEach((oid, k) => {
        const o = q.options.find(x => x.id === oid), choisie = s.includes(oid);
        const puces = (o.correcte ? '<span class="puce bon">' + (q.multiple ? 'Juste' : 'Bonne réponse') + '</span>' : '') + (choisie ? '<span class="puce' + (o.correcte ? ' bon' : ' faux') + '">Ta réponse</span>' : '');
        h += '<div class="option ' + (o.correcte ? 'juste' : 'fausse') + (choisie ? ' choisie' : '') + '"><span class="lettre">' + 'ABCDE'[k] + '</span><div>' + puces + rendre(o.texte)
          + '<div class="explication">' + (o.correcte && !q.multiple ? '' : rendre(o.explication)) + '</div></div></div>';
      });
      h += '<h5>Correction</h5>' + rendre(q.solution);
    } else {
      const c = E.code[q.id] || {};
      const tout = c.soumissions && c.caches_reussis === c.caches_total;
      h += tete(tout ? 'v-juste' : c.soumissions ? 'v-incomplete' : '', c.soumissions ? c.caches_reussis + ' / ' + c.caches_total + ' tests cachés' : 'Jamais soumis');
      h += '<details><summary>Énoncé</summary>' + rendre(q.enonce) + '</details>';
      if (c.details) {
        h += '<h5>Tests cachés</h5><div class="defile"><table><tr><th>Test caché</th><th>Résultat</th><th>Attendu</th><th>Obtenu</th></tr>';
        c.details.forEach(t => { h += '<tr><td>' + esc(t.nom) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec') + '</td><td><code class="sans-math">' + esc(t.attendu) + '</code></td><td><code class="sans-math">' + esc(t.obtenu ?? (t.erreur ? 'exception' : '')) + '</code></td></tr>'; });
        h += '</table></div>';
        c.details.filter(t => t.erreur).forEach(t => { h += '<details><summary>Erreur : ' + esc(t.nom) + '</summary><pre class="sans-math">' + esc(t.erreur) + '</pre></details>'; });
      }
      h += '<details><summary>Ton code soumis</summary><pre class="sans-math"><code>' + esc(c.code_source || codeSource(q)) + '</code></pre></details>';
      h += '<details><summary>Correction</summary>' + rendre(q.solution) + '</details>';
    }
    h += '<p class="revoir">Vérification des nombres : <code class="sans-math">' + esc(q.verif.script) + '</code></p></div></article>';
  });
  page.innerHTML = h;
  const resultat = resultatJSON(duree);
  const zone = document.getElementById('json');
  zone.value = JSON.stringify(resultat, null, 1);
  document.getElementById('telecharger').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([zone.value], { type: 'application/json' }));
    a.download = D.id + '_resultat.json'; a.click();
  };
  const retour = document.getElementById('retourAccueil'); if (retour) retour.onclick = () => { location.href = '/'; };
  document.getElementById('recommencer').onclick = () => { if (confirm('Effacer ce passage ?')) { try { localStorage.removeItem(CLE); } catch (e) {} E = etatNeuf('accueil'); afficher(); } };
  const info = document.getElementById('enregistrement');
  if (E.enregistrement) info.textContent = E.enregistrement;
  else if (!SERVEUR) info.textContent = 'Page ouverte comme un fichier : le résultat n\'est pas enregistré automatiquement. Copie le JSON ci-dessous dans la conversation.';
  else {
    info.textContent = 'Enregistrement du résultat...';
    api('/api/resultat', resultat).then(r => {
      E.enregistrement = r.erreur ? null : 'Résultat enregistré dans ' + r.fichier + ' ; ' + r.erreurs_ajoutees + ' erreur(s) ajoutée(s) au journal suivi/erreurs.md.';
      info.textContent = E.enregistrement || 'Échec de l\'enregistrement : ' + r.erreur;
      sauver();
    }).catch(() => { info.textContent = 'Serveur injoignable : le résultat n\'est pas enregistré. Copie le JSON ci-dessous dans la conversation.'; });
  }
  composer();
}

function afficher() {
  libererEditeurs();
  document.getElementById('titre').textContent = D.titre;
  document.title = D.titre;
  if (E.phase === 'epreuve') epreuve(); else if (E.phase === 'bilan') bilan(); else accueil();
  window.scrollTo(0, 0);
}
function completerEtat() {
  ['reponses', 'temps', 'ordre', 'cellules', 'code', 'controles', 'ordreControles', 'vus', 'partie'].forEach(k => { if (!E[k] || typeof E[k] !== 'object') E[k] = {}; });
  if (typeof E.courant !== 'number' || E.courant < 0 || E.courant >= ITEMS.length) E.courant = 0;
  ITEMS.forEach(q => {
    if (q.cellules_initiales && !Array.isArray(E.cellules[q.id])) E.cellules[q.id] = q.cellules_initiales.map(c => ({ code: c, sortie: '', numero: null }));
    if (q.type === 'qcm') {
      const ids = q.options.map(o => o.id);
      const o = E.ordre[q.id];
      if (!Array.isArray(o) || o.length !== ids.length || !ids.every(i => o.includes(i))) E.ordre[q.id] = melanger(ids);
      const rep = E.reponses[q.id];
      if (rep !== undefined && rep !== 'nsp' && (Array.isArray(rep) !== !!q.multiple || !choisies(q).length || !choisies(q).every(i => ids.includes(i)))) delete E.reponses[q.id];
    }
    if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => {
      const cle = q.id + ':' + cid;
      if (!Array.isArray(E.ordreControles[cle])) E.ordreControles[cle] = melanger(c.options.map(o => o.id));
    });
  });
}
charger();
completerEtat();
if (SERVEUR && ITEMS.some(q => q.cellules_initiales)) chargerMonaco();
afficher();
</script>
