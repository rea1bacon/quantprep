<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier quant</title>
<style>
:root { --fond:#f5f6f8; --carte:#ffffff; --texte:#1f2328; --doux:#646b75; --trait:#e3e6ea; --trait-fort:#cdd2d8; --accent:#2f5bd3; --accent-doux:#eef2fc; --bon:#1f7a4d; --bon-doux:#eaf6ef; --faux:#c0392b; --faux-doux:#fcecea; --alerte:#9a5a08; --alerte-doux:#fdf3e4; --code:#f6f8fa; --ombre:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06); }
@media (prefers-color-scheme: dark) { :root { --fond:#0f1115; --carte:#171a20; --texte:#e6e8eb; --doux:#9aa1ab; --trait:#262b33; --trait-fort:#363c46; --accent:#86a8ff; --accent-doux:#1a2135; --bon:#5cc98f; --bon-doux:#13251c; --faux:#f08479; --faux-doux:#2b1716; --alerte:#e2a54f; --alerte-doux:#2a2013; --code:#12151a; --ombre:none; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--fond); color:var(--texte); font:15.5px/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
a { color:var(--accent); }

/* Barre supérieure */
header { position:sticky; top:0; z-index:10; background:var(--carte); border-bottom:1px solid var(--trait); height:56px; padding:0 20px; display:flex; gap:14px; align-items:center; }
#lienAccueil { display:flex; align-items:center; gap:8px; color:var(--texte); font-weight:650; font-size:15px; text-decoration:none; white-space:nowrap; padding-right:14px; border-right:1px solid var(--trait); }
#lienAccueil::before { content:""; width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #7b4bd6)); }
#lienAccueil[hidden] { display:none; }
header h1 { font-size:14.5px; font-weight:600; margin:0; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#position { font-size:13px; color:var(--doux); white-space:nowrap; }
#progression { position:absolute; left:0; right:0; bottom:-1px; height:2px; background:transparent; }
#progression > span { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
#chrono { font:600 15px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; font-variant-numeric:tabular-nums; background:var(--fond); border:1px solid var(--trait); border-radius:999px; padding:7px 12px; }
#chrono.depasse { color:var(--faux); border-color:var(--faux); }
@media (max-width:720px) { #position { display:none; } header { padding:0 12px; gap:8px; } }

/* Mise en page */
main { padding:28px 24px 96px; }
main > .carte, main > .fiche, main > .tableau-bord { max-width:880px; margin-left:auto; margin-right:auto; }
.cadre { display:grid; grid-template-columns:250px minmax(0, 1fr); gap:32px; max-width:1180px; margin:0 auto; align-items:start; }
main.large .cadre { max-width:none; }
.contenu { min-width:0; max-width:820px; }
main.lecture .contenu { max-width:880px; }
main.large .contenu { max-width:none; }
@media (max-width:1000px) { .cadre { grid-template-columns:1fr; gap:16px; } }

/* Plan de la séance (colonne gauche) */
.plan { scrollbar-width:thin; scrollbar-color:var(--trait-fort) transparent; position:sticky; top:84px; max-height:calc(100vh - 104px); overflow-y:auto; font-size:13.5px; }
.plan .groupe { font-size:11.5px; font-weight:650; letter-spacing:.06em; text-transform:uppercase; color:var(--doux); margin:16px 0 6px 10px; }
.plan .groupe:first-child { margin-top:0; }
#pastilles { display:flex; flex-direction:column; gap:2px; }
.pastille { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; background:none; border-radius:8px; padding:6px 10px; font-size:13.5px; color:var(--texte); }
.pastille:hover:not(:disabled) { background:color-mix(in srgb, var(--doux) 9%, transparent); }
.pastille .etat { flex:none; width:18px; height:18px; border-radius:50%; border:1.5px solid var(--trait-fort); display:grid; place-items:center; font-size:10px; color:#fff; }
.pastille.faite .etat { background:var(--accent); border-color:var(--accent); }
.pastille.faite .etat::after { content:"✓"; }
.pastille .libelle { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pastille.courante { background:var(--accent-doux); color:var(--accent); font-weight:600; }
.pastille.courante .etat { border-color:var(--accent); }
@media (max-width:1000px) { .plan { position:static; max-height:none; } #pastilles { flex-direction:row; flex-wrap:wrap; } .pastille { width:auto; } .pastille .libelle { display:none; } .plan .groupe { display:none; } }

/* Cartes */
.carte { background:var(--carte); border:1px solid var(--trait); border-radius:12px; padding:22px 26px; margin-bottom:18px; box-shadow:var(--ombre); }
h2 { font-size:21px; font-weight:650; letter-spacing:-.01em; margin:0 0 10px; }
h3 { font-size:17px; font-weight:650; margin:20px 0 6px; }
h4 { font-size:15px; font-weight:650; margin:16px 0 4px; }
.meta { color:var(--doux); font-size:13.5px; }
.surtitre { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:14px; font-size:13px; color:var(--doux); }
.surtitre .rang { font-weight:650; color:var(--texte); }
.chip { display:inline-block; max-width:420px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; font-size:12px; font-weight:550; padding:2px 10px; border-radius:999px; background:var(--accent-doux); color:var(--accent); }
.note { background:var(--alerte-doux); border-radius:10px; padding:10px 14px; color:var(--texte); font-size:14px; margin:12px 0; }
.note p { margin:4px 0; }
.consigne { font-size:13px; color:var(--doux); margin:18px 0 8px; }

/* Boutons */
button { font:inherit; font-size:14px; font-weight:550; padding:8px 14px; border-radius:8px; border:1px solid var(--trait-fort); background:var(--carte); color:var(--texte); cursor:pointer; transition:background .15s, border-color .15s; }
button:hover:not(:disabled) { background:color-mix(in srgb, var(--doux) 8%, var(--carte)); }
button.principal { background:var(--accent); border-color:var(--accent); color:#fff; }
button.principal:hover:not(:disabled) { background:color-mix(in srgb, var(--accent) 88%, #000); }
@media (prefers-color-scheme: dark) { button.principal { color:#0d1220; } }
button:disabled { opacity:.45; cursor:default; }
header button { padding:6px 12px; font-size:13px; }
.barre { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:16px; }
.navigation { border-top:1px solid var(--trait); margin-top:26px; padding-top:18px; }
.navigation #prec { margin-right:auto; }
.navigation #finir { order:1; }
.navigation #suiv { order:2; }

/* Options d'une question */
.option { display:flex; gap:14px; align-items:flex-start; border:1px solid var(--trait-fort); border-radius:10px; padding:13px 16px; margin:10px 0; cursor:pointer; background:var(--carte); transition:border-color .12s, background .12s; }
.option:hover { border-color:var(--accent); }
.option .lettre { flex:none; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--trait-fort); display:grid; place-items:center; font-size:12.5px; font-weight:650; color:var(--doux); margin-top:-1px; }
.option .lettre.carre { border-radius:6px; }
.option p { margin:0; }
.option.choisie { border-color:var(--accent); background:var(--accent-doux); }
.option.choisie .lettre { background:var(--accent); border-color:var(--accent); color:#fff; }
.option.juste { border-color:var(--bon); }
.option.fausse { border-color:var(--trait); }
.explication { font-size:14px; color:var(--doux); margin-top:6px; }
.etiquette { font-size:13px; font-weight:600; }
.bon { color:var(--bon); } .faux { color:var(--faux); }

/* Code, tableaux */
pre { background:var(--code); border:1px solid var(--trait); border-radius:8px; padding:12px 14px; overflow-x:auto; font:13px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; }
code { font:13px ui-monospace, "Cascadia Mono", Consolas, monospace; background:var(--code); border:1px solid var(--trait); padding:0 4px; border-radius:4px; }
pre code { background:none; border:0; padding:0; }
.defile { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:14px; margin:10px 0; }
th { font-size:12px; font-weight:650; letter-spacing:.04em; text-transform:uppercase; color:var(--doux); }
th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--trait); vertical-align:top; }
td.nombre, th.nombre { text-align:right; font-variant-numeric:tabular-nums; }
textarea.json { width:100%; min-height:140px; font:12.5px ui-monospace, Consolas, monospace; background:var(--code); color:var(--texte); border:1px solid var(--trait); border-radius:8px; padding:8px; }
details { margin-top:10px; } summary { cursor:pointer; color:var(--accent); font-weight:550; }

/* Question de code : énoncé à gauche, notebook à droite */
.deux { display:grid; grid-template-columns:minmax(300px, 38%) 1fr; gap:18px; align-items:start; }
.deux > .carte { margin:0; }
.deux .enonce { position:sticky; top:76px; max-height:calc(100vh - 96px); overflow-y:auto; }
@media (max-width:1100px) { .deux { grid-template-columns:1fr; } .deux .enonce { position:static; max-height:none; } }
.notebook-barre { display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--trait); padding-bottom:12px; margin-bottom:12px; }
.notebook-barre button { font-size:13px; padding:6px 11px; }
.notebook-barre #versions { margin-left:auto; }
.notebook-barre .meta { font-size:12.5px; }
.cellule { display:grid; grid-template-columns:48px 1fr; gap:6px; margin:12px 0; }
.cellule .numero { font:12px ui-monospace, Consolas, monospace; color:var(--doux); text-align:right; padding-top:9px; }
.cellule .editeur { border:1px solid var(--trait); border-radius:8px; overflow:hidden; background:var(--code); }
.cellule.active .editeur { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-doux); }
.cellule .editeur textarea { border:none; border-radius:0; }
.cellule textarea { width:100%; resize:none; overflow:hidden; min-height:44px; font:13.5px/1.5 ui-monospace, Consolas, monospace; tab-size:4; background:var(--code); color:var(--texte); border:1px solid var(--trait); border-radius:8px; padding:8px 10px; white-space:pre; overflow-x:auto; }
.cellule .actions { display:flex; gap:6px; margin-top:4px; }
.cellule .actions button { font-size:12px; padding:2px 8px; font-weight:500; }
.cellule pre.sortie { margin:4px 0 0; max-height:420px; overflow:auto; }
.cellule pre.sortie:empty { display:none; }
pre .erreur { color:var(--faux); }
.resultats-tests { margin-top:12px; }
#voile { position:fixed; inset:0; z-index:20; background:color-mix(in srgb, var(--fond) 92%, transparent); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:16px; }
#voile[hidden] { display:none; }
#voile .carte { max-width:480px; text-align:center; }
#voile .barre { justify-content:center; }
.deux.lecon { grid-template-columns:minmax(320px, 56%) 1fr; }
.deux.lecon .enonce { max-height:calc(100vh - 96px); }
pre.sortie-lecon { margin-top:-6px; border-style:dashed; color:var(--doux); }

/* Leçons : colonne de lecture, une partie à la fois, onglets */
main.lecture .carte.enonce { padding:26px 40px 30px; }
.lecon-corps { font-size:16px; line-height:1.72; max-width:74ch; margin:0 auto; }
.lecon-corps p { margin:0.75em 0; }
.lecon-corps li { margin:0.4em 0; padding-left:2px; }
.lecon-corps ol, .lecon-corps ul { padding-left:1.4em; }
.lecon-corps ol > li::marker { font-weight:650; color:var(--doux); }
.lecon-corps h3 { font-size:23px; font-weight:700; letter-spacing:-.015em; line-height:1.3; margin:8px 0 16px; }
.lecon-corps table { font-size:14.5px; line-height:1.55; }
.lecon-corps mjx-container { font-size:102% !important; }
.lecon-corps mjx-container[display="true"], .lecon-corps p.formule > mjx-container { display:block; text-align:center; margin:0.7em 0; overflow-x:auto; overflow-y:hidden; }
.sommaire { display:flex; flex-wrap:wrap; gap:0 2px; margin:0 0 24px; border-bottom:1px solid var(--trait); }
.sommaire button { flex:none; font-size:13px; font-weight:550; padding:10px 12px; border:0; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--doux); margin-bottom:-1px; }
.sommaire button:hover:not(:disabled) { background:none; color:var(--texte); }
.sommaire button.active { color:var(--accent); border-bottom-color:var(--accent); }
.partie[hidden] { display:none; }
.pied-partie { display:flex; gap:10px; align-items:center; justify-content:space-between; margin:28px 0 4px; padding-top:18px; border-top:1px solid var(--trait); }
.pied-partie .meta { flex:1; text-align:center; }
.bloc { --teinte:var(--doux); border:1px solid var(--trait); border-radius:10px; padding:6px 20px 10px; margin:18px 0; background:var(--carte); }
.bloc > h4, .bloc > summary { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--teinte); margin:10px 0 2px; }
.bloc.enonce-bloc { --teinte:var(--accent); background:var(--accent-doux); border-color:transparent; }
.bloc.exemple { --teinte:var(--bon); } .bloc.pieges { --teinte:var(--faux); } .bloc.limites { --teinte:var(--alerte); }
.bloc.preuve { background:var(--fond); }
details.bloc > summary { cursor:pointer; list-style:revert; padding:6px 0; }
details.bloc > summary .meta { text-transform:none; letter-spacing:0; font-weight:400; margin-left:6px; }
details.bloc[open] > summary { margin-bottom:6px; }
.controle { border:1px solid var(--trait-fort); border-radius:12px; padding:14px 18px; margin:22px 0; background:var(--fond); }
.controle .titre-controle { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--accent); margin:0 0 6px; }
.controle .option { background:var(--carte); }

/* Fiche de question : débrief et bilan */
.fiche { background:var(--carte); border:1px solid var(--trait); border-radius:12px; margin:0 0 20px; overflow:hidden; font-size:15px; line-height:1.65; box-shadow:var(--ombre); }
.lecon-corps .fiche { margin:24px 0; }
.fiche-tete { display:flex; align-items:center; flex-wrap:wrap; gap:6px 14px; padding:14px 22px; border-bottom:1px solid var(--trait); }
.fiche-tete .num { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--doux); white-space:nowrap; }
.fiche-tete .titre { flex:1; min-width:200px; font-weight:650; font-size:16px; }
.fiche-tete .temps { font-size:12.5px; color:var(--doux); white-space:nowrap; }
.verdict { font-size:12px; font-weight:650; padding:3px 10px; border-radius:999px; white-space:nowrap; color:var(--doux); background:var(--fond); }
.v-juste .verdict { color:var(--bon); background:var(--bon-doux); } .v-fausse .verdict { color:var(--faux); background:var(--faux-doux); } .v-incomplete .verdict { color:var(--alerte); background:var(--alerte-doux); }
.fiche-corps { padding:4px 22px 20px; }
.fiche h5 { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--doux); margin:22px 0 8px; }
.fiche-corps > h5:first-child { margin-top:16px; }
.fiche p { margin:0.6em 0; }
.fiche li { margin:0.35em 0; }
.fiche-reponses { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin:18px 0 6px; }
.fiche-reponses > div { background:var(--fond); border-radius:10px; padding:10px 14px; }
.fiche-reponses .lab { display:block; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--doux); margin-bottom:2px; }
.fiche ul.choix { list-style:none; padding:0; margin:8px 0; }
.fiche ul.choix > li { border:1px solid var(--trait); border-radius:10px; padding:9px 14px; margin:8px 0; }
.fiche ul.choix > li > strong:first-child { display:inline-block; min-width:1.8em; color:var(--doux); }
.fiche .retenir { border-radius:10px; padding:12px 16px; margin-top:20px; background:var(--accent-doux); }
.fiche .retenir h5 { margin:0 0 2px; color:var(--accent); }
.fiche .retenir p { margin:0.3em 0 0; }
.fiche .revoir { font-size:13.5px; color:var(--doux); margin:14px 0 0; }
.fiche .option { cursor:default; }
.fiche .option:hover { border-color:var(--trait); }
.fiche .option p { margin:0; }
.fiche .option .explication p { margin:3px 0 0; }
.fiche .option.juste { border-color:color-mix(in srgb, var(--bon) 45%, var(--trait)); background:var(--bon-doux); }
.fiche .option.choisie:not(.juste) { border-color:color-mix(in srgb, var(--faux) 45%, var(--trait)); background:var(--faux-doux); }
.fiche .option.choisie .lettre { background:none; color:var(--doux); border-color:var(--trait-fort); }
.fiche .option > div { flex:1; }
.puce { float:right; font-size:11px; font-weight:650; padding:2px 9px; border-radius:999px; margin-left:8px; white-space:nowrap; color:var(--doux); background:var(--fond); }
.puce.bon { color:var(--bon); background:var(--carte); } .puce.faux { color:var(--faux); background:var(--carte); }
.fiche details { margin-top:16px; border-top:1px solid var(--trait); padding-top:12px; }
.fiche details > summary { cursor:pointer; font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--doux); }

/* Présentation d'une séance et bilan */
.presentation h2 { font-size:26px; letter-spacing:-.02em; }
.sections-liste { display:grid; gap:8px; margin:18px 0; }
.sections-liste > div { display:flex; justify-content:space-between; gap:12px; background:var(--fond); border-radius:10px; padding:10px 14px; font-size:14px; }
.score-total { display:flex; align-items:baseline; gap:10px; margin:4px 0 14px; }
.score-total strong { font-size:34px; font-weight:700; letter-spacing:-.02em; }
</style>

<script type="application/json" id="donnees">{"id": "examen-blanc-2", "titre": "Examen blanc 2", "duree_minutes": 72, "options": {"pause": false, "je_ne_sais_pas": false, "retour_arriere": true, "penalite": 0}, "conventions": "Conventions de notation : une majuscule désigne une variable aléatoire, une minuscule une valeur ou un paramètre fixe, le gras un vecteur ou une matrice. \\(\\mathbb{P}\\) désigne une probabilité, \\(\\mathbb{E}\\) une espérance, \\(\\mathrm{Var}\\) une variance.", "presentation": "Deuxième examen blanc au format d'un test en ligne de recherche quantitative : 1 question de code, 10 de mathématiques, 5 de ML fondamental, 8 de ML avancé. À passer **en conditions réelles** : d'une traite, sans notes, sans recherche, sans pause (le bouton Pause est désactivé), seul. Toutes les questions sont nouvelles.\n\nLe chronomètre affiche la somme des budgets de section : 24 minutes pour le code, 25 pour les mathématiques, 7 pour le ML fondamental, 16 pour le ML avancé. Cette somme laisse 10 minutes de marge sur un format de référence de 82 minutes ; l'objectif est de finir avant la fin du chronomètre.\n\nRègles à appliquer :\n\n- Code : écris une solution simple, lance les tests visibles, **soumets tout de suite**, puis améliore et soumets à nouveau. Un code jamais soumis ne rapporte rien.\n- Règle d'abandon : au-delà du double du temps cible affiché sur une question, choisis l'option la plus plausible après élimination, retiens le numéro de la question et passe à la suivante ; tu y reviendras avec la marge.\n- Il n'y a pas de « Je ne sais pas » : sans pénalité, une question laissée vide ne rapporte jamais plus qu'une réponse devinée.", "avertissements": ["Les questions de mathématiques et de ML sont présentées en choix multiple à une seule bonne réponse. Cherche la réponse avant de lire les options, pour t'entraîner aussi au format à réponse numérique.", "Ici le retour en arrière est permis entre toutes les questions et il n'y a pas de pénalité : ce sont les règles de cette plateforme, pas celles de tout test en ligne. Si un test interdit le retour vers une section quittée, il faut finir chaque section avant de passer à la suivante.", "La question de code est un notebook avec des fichiers de données, exécuté avec Python 3.9, pandas 1.4.2 et numpy 1.21.6, l'environnement des notebooks de la plateforme."], "sections": [{"id": "code", "nom": "Coding, data science", "budget_min": 24, "questions": [{"id": "EB2-C1", "type": "code", "section": "code", "theme": "pandas : transactions et cotations, jointure temporelle", "difficulte": 4, "temps_cible_s": 1200, "enonce": "## Déséquilibre des ordres par la règle du point milieu\n\nPour savoir si une transaction a été déclenchée par un acheteur ou par un vendeur, on la compare à la dernière cotation connue juste avant elle. Une cotation donne le meilleur prix d'achat proposé (`achat` : le prix le plus haut auquel un acheteur est prêt à acheter) et le meilleur prix de vente proposé (`vente` : le prix le plus bas auquel un vendeur est prêt à vendre). Une transaction au-dessus du milieu de ces deux prix a été déclenchée par un acheteur (transaction à l'achat) ; en dessous, par un vendeur (transaction à la vente).\n\nDans le notebook, définis la fonction `desequilibre(transactions, cotations)` qui renvoie une `Series` pandas.\n\n### Entrées\n\n`transactions` est un DataFrame dont les colonnes sont exactement :\n\n| Colonne | Type | Contenu |\n|---|---|---|\n| `temps` | entier (`int64`) | instant de la transaction, en millisecondes depuis l'ouverture |\n| `actif` | chaîne | identifiant de l'actif |\n| `prix` | flottant, strictement positif | prix de la transaction |\n| `quantite` | entier (`int64`), au moins 1 | nombre de titres échangés |\n\n`cotations` est un DataFrame dont les colonnes sont exactement :\n\n| Colonne | Type | Contenu |\n|---|---|---|\n| `temps` | entier (`int64`) | instant de la cotation, en millisecondes depuis l'ouverture |\n| `actif` | chaîne | identifiant de l'actif |\n| `achat` | flottant ou `NaN` | meilleur prix d'achat proposé |\n| `vente` | flottant ou `NaN` | meilleur prix de vente proposé |\n\nGaranties : lignes dans un ordre **quelconque** et index quelconque, dans les deux DataFrames ; au plus une cotation par couple (`actif`, `temps`) ; plusieurs transactions peuvent avoir le même `temps` ; chacun des deux DataFrames peut être vide (zéro ligne, avec les colonnes et les types ci-dessus).\n\n### Calcul demandé\n\n1. **Cotations valides.** Une cotation est valide si `achat` et `vente` sont tous deux non manquants et si `achat < vente` (inégalité stricte). Les cotations non valides sont ignorées, comme si elles n'existaient pas.\n2. **Cotation de référence.** Pour une transaction d'instant `t` sur l'actif `a`, c'est, parmi les cotations valides du même actif `a` dont l'instant est **strictement inférieur** à `t`, celle dont l'instant `tc` est le plus grand. Il n'y a pas de cotation de référence s'il n'existe aucune telle cotation, ou si `t - tc > 5000` (cotation de plus de 5 secondes). Une cotation de même instant que la transaction n'est pas antérieure à elle.\n3. **Signe.** Avec `m = (achat + vente) / 2`, le milieu de la cotation de référence : le signe vaut +1 si `prix > m`, -1 si `prix < m`, et 0 si `prix == m` ou s'il n'y a pas de cotation de référence.\n4. **Déséquilibre d'un actif.** Pour chaque actif présent dans `transactions`, `V+` est la somme des quantités de ses transactions de signe +1, et `V-` la somme des quantités de ses transactions de signe -1. Son déséquilibre vaut `(V+ - V-) / (V+ + V-)`, ou `NaN` si `V+ + V-` vaut 0.\n5. **Résultat.** Une `Series` de flottants dont l'index est la liste **triée** (ordre croissant des chaînes) des actifs distincts de `transactions`, et dont les valeurs sont leurs déséquilibres. Un actif présent seulement dans `cotations` n'y figure pas. Si `transactions` est vide, le résultat est une `Series` vide.\n\nTous les prix des tests sont des multiples de 0,25, représentés exactement en flottant : les comparaisons avec le milieu sont exactes. Tolérance de comparaison des résultats : `1e-9`. Limite de temps : 10 secondes par test.\n\n### Exemple\n\n`transactions` :\n\n| temps | actif | prix | quantite |\n|---|---|---|---|\n| 3000 | A | 100.5 | 10 |\n| 3000 | B | 50.0 | 5 |\n| 4000 | C | 20.0 | 1 |\n| 5000 | A | 99.75 | 4 |\n| 6500 | A | 100.25 | 7 |\n| 8000 | B | 50.25 | 6 |\n| 9200 | B | 51.0 | 2 |\n| 9500 | B | 51.5 | 3 |\n\n`cotations` :\n\n| temps | actif | achat | vente |\n|---|---|---|---|\n| 1000 | A | 99.5 | 100.5 |\n| 2500 | A | 101.0 | 100.0 |\n| 3000 | B | 50.0 | 50.5 |\n| 9000 | B | 51.0 | 51.5 |\n\n- La cotation de A à 2500 est croisée (`achat > vente`) : elle n'est pas valide.\n- A à 3000 : référence A à 1000 (milieu 100), prix 100,5 : signe +1. A à 5000 : même référence, 4000 ms avant, prix 99,75 : signe -1. A à 6500 : la cotation de 1000 date de 5500 ms, trop ancienne : signe 0. Déséquilibre de A : (10 - 4) / (10 + 4), soit 0,4286 à 4 décimales.\n- B à 3000 : la seule cotation de B à un instant inférieur ou égal est au même instant : pas de référence, signe 0. B à 8000 : référence B à 3000, exactement 5000 ms avant, donc retenue ; milieu 50,25, égal au prix : signe 0. B à 9200 : référence B à 9000 (milieu 51,25), prix 51 : signe -1. B à 9500 : prix 51,5 : signe +1. Déséquilibre de B : (3 - 2) / (3 + 2) = 0,2.\n- C n'a aucune cotation : `NaN`.\n\nLa fonction renvoie la `Series` d'index `A`, `B`, `C` et de valeurs 0,4286 (à 4 décimales), 0,2 et `NaN`.\n\n### Fonctionnement\n\n- Le notebook s'exécute avec Python 3.9 et pandas 1.4.2, l'environnement des notebooks de la plateforme.\n- Les fichiers `transactions.csv` et `cotations.csv` (mêmes colonnes) sont dans le répertoire courant pour explorer : `pd.read_csv(\"transactions.csv\")`.\n- **Tests visibles** exécute 3 tests sur ta fonction, dont l'exemple ci-dessus. **Soumettre** exécute les 15 tests cachés : seul le nombre de réussites s'affiche, et la dernière soumission compte. Un code jamais soumis ne rapporte rien.\n- Raccourcis : Maj+Entrée exécute la cellule et passe à la suivante, Ctrl+Entrée l'exécute sans changer de cellule.\n", "dossier": "coding/examen2", "module_tests": "coding/examen2/tests.py", "fonction": "desequilibre", "cellules_initiales": ["import numpy as np\nimport pandas as pd\n\ntransactions = pd.read_csv(\"transactions.csv\")\ncotations = pd.read_csv(\"cotations.csv\")\ntransactions.head()", "def desequilibre(transactions: pd.DataFrame, cotations: pd.DataFrame) -> pd.Series:\n    # À compléter\n    return pd.Series(dtype=float)", "desequilibre(transactions, cotations)"], "tests_visibles": 3, "tests_caches": 15, "fichier_correction": "coding/examen2/_correction.py", "verif": {"script": "coding/examen2/tests.py"}, "fiche": null, "solution": "Correction commentée, avec une version pandas et une version sans bibliothèque externe (`coding/examen2/_correction.py`) :\n\n```python\n\"\"\"Correction de la question de code de l'examen blanc 2 (EB2-C1). À n'ouvrir qu'après l'avoir tentée.\n\nDeux implémentations indépendantes : l'une avec pandas (merge_asof), l'autre sans aucune bibliothèque\nexterne (tri et recherche dichotomique). Les tests exigent qu'elles soient d'accord.\n\"\"\"\nimport bisect\nimport math\n\nimport pandas as pd\n\nTOLERANCE_MS = 5000\n\n\ndef desequilibre(transactions: pd.DataFrame, cotations: pd.DataFrame) -> pd.Series:\n    \"\"\"Solution de référence avec pandas.\"\"\"\n    actifs = sorted(transactions[\"actif\"].unique())\n    if len(transactions) == 0:\n        return pd.Series(dtype=float)\n\n    # 1. Cotations valides seulement. Une comparaison avec NaN vaut False : les cotations\n    #    incomplètes disparaissent avec les cotations croisées ou bloquées (achat >= vente).\n    #    Filtrer AVANT la jointure : sinon la dernière cotation trouvée peut être invalide,\n    #    alors qu'une cotation valide plus ancienne, à moins de 5 s, existe.\n    valides = cotations.loc[cotations[\"achat\"] < cotations[\"vente\"], [\"temps\", \"actif\", \"achat\", \"vente\"]]\n    valides = valides.rename(columns={\"temps\": \"temps_cotation\"}).sort_values(\"temps_cotation\")\n\n    # 2. Jointure « au plus tard avant ». merge_asof exige deux cadres triés sur la clé de temps.\n    #    by=\"actif\" : jamais la cotation d'un autre actif.\n    #    allow_exact_matches=False : une cotation de même temps n'est pas antérieure.\n    #    tolerance=5000 : écart au plus 5000 ms, borne incluse (vérifié dans verif/examen_blanc_2.py).\n    t = transactions.sort_values(\"temps\")\n    m = pd.merge_asof(t, valides, left_on=\"temps\", right_on=\"temps_cotation\", by=\"actif\",\n                      allow_exact_matches=False, tolerance=TOLERANCE_MS)\n\n    # 3. Signe par rapport au milieu ; NaN (pas de cotation de référence) compte comme 0.\n    milieu = (m[\"achat\"] + m[\"vente\"]) / 2\n    achat = m[\"quantite\"].where(m[\"prix\"] > milieu, 0)\n    vente = m[\"quantite\"].where(m[\"prix\"] < milieu, 0)\n\n    # 4. Volumes par actif, puis déséquilibre ; NaN quand aucun volume n'est classé.\n    v_achat = achat.groupby(m[\"actif\"]).sum()\n    v_vente = vente.groupby(m[\"actif\"]).sum()\n    total = v_achat + v_vente\n    r = (v_achat - v_vente) / total.where(total > 0)\n    return r.reindex(actifs).astype(float)\n\n\ndef desequilibre_sans_bibliotheque(transactions, cotations):\n    \"\"\"Même calcul sans pandas ni numpy.\n\n    transactions : liste de (temps, actif, prix, quantite) ; cotations : liste de (temps, actif, achat, vente),\n    None ou NaN = manquant. Renvoie une liste de (actif, déséquilibre ou nan), triée par actif.\n    \"\"\"\n    manquant = lambda x: x is None or (isinstance(x, float) and math.isnan(x))\n    par_actif = {}\n    for temps, actif, achat, vente in cotations:\n        if manquant(achat) or manquant(vente) or not achat < vente:\n            continue\n        par_actif.setdefault(actif, []).append((temps, achat, vente))\n    temps_par_actif = {}\n    for actif, liste in par_actif.items():\n        liste.sort()  # au plus une cotation par (actif, temps) : le tri ne compare jamais les prix\n        temps_par_actif[actif] = [c[0] for c in liste]\n\n    v_achat, v_vente = {}, {}\n    for temps, actif, prix, quantite in transactions:\n        v_achat.setdefault(actif, 0)\n        v_vente.setdefault(actif, 0)\n        if actif not in par_actif:\n            continue\n        # bisect_left renvoie le nombre de cotations de temps strictement inférieur à `temps`.\n        k = bisect.bisect_left(temps_par_actif[actif], temps) - 1\n        if k < 0:\n            continue\n        temps_cotation, achat, vente = par_actif[actif][k]\n        if temps - temps_cotation > TOLERANCE_MS:\n            continue\n        milieu = (achat + vente) / 2\n        if prix > milieu:\n            v_achat[actif] += quantite\n        elif prix < milieu:\n            v_vente[actif] += quantite\n    sortie = []\n    for actif in sorted(v_achat):\n        total = v_achat[actif] + v_vente[actif]\n        sortie.append((actif, (v_achat[actif] - v_vente[actif]) / total if total > 0 else float(\"nan\")))\n    return sortie\n```"}]}, {"id": "math", "nom": "Mathématiques", "budget_min": 25, "questions": [{"id": "EB2-M01", "section": "math", "theme": "Chaîne de Markov, temps de retour", "difficulte": 4, "temps_cible_s": 180, "enonce": "Un modèle de régimes de marché décrit chaque jour de bourse par un état parmi trois : C (calme), N (normal), A (agité). La suite \\((X_t)_{t \\ge 0}\\), où \\(X_t\\) est l'état du jour \\(t\\), est une chaîne de Markov homogène : sachant tout le passé jusqu'au jour \\(t\\), l'état du jour \\(t + 1\\) ne dépend que de \\(X_t\\), avec les probabilités de transition du tableau (ligne : état du jour \\(t\\) ; colonne : état du jour \\(t + 1\\)).\n\n| depuis | vers C | vers N | vers A |\n|---|---|---|---|\n| C | 0,8 | 0,2 | 0 |\n| N | 0,1 | 0,7 | 0,2 |\n| A | 0 | 0,5 | 0,5 |\n\nLe jour 0 est agité (\\(X_0 = \\mathrm{A}\\)). Soit \\(T = \\min\\{t \\ge 1 : X_t = \\mathrm{A}\\}\\) le premier jour agité après le jour 0 (\\(T = 1\\) si le jour 1 est agité). Que vaut \\(\\mathbb{E}[T]\\) ?", "options": [{"id": "a", "texte": "4,75", "correcte": true, "explication": "Oui : \\(1 + 0{,}5\\,h_{\\mathrm{N}}\\), où \\(h_{\\mathrm{N}}\\) est le temps moyen pour atteindre A depuis N ; c'est aussi l'inverse de la probabilité stationnaire de A."}, {"id": "b", "texte": "2", "correcte": false, "explication": "C'est \\(1/(1 - 0{,}5)\\), la durée moyenne d'un séjour en A (nombre de jours consécutifs passés en A). La question demande le temps de retour : quand la chaîne quitte A, elle passe par N et met en moyenne 7,5 jours à revenir."}, {"id": "c", "texte": "8,5", "correcte": false, "explication": "C'est \\(1 + h_{\\mathrm{N}}\\), où \\(h_{\\mathrm{N}} = 7{,}5\\) est le temps moyen pour atteindre A depuis N : on a supposé que la chaîne quitte toujours A au premier pas. Avec probabilité 0,5, elle reste en A et \\(T = 1\\) ; le terme \\(h_{\\mathrm{N}}\\) ne compte qu'avec le poids 0,5."}, {"id": "d", "texte": "3", "correcte": false, "explication": "C'est l'inverse de 1/3 : le lemme de Kac appliqué à une loi stationnaire supposée uniforme sur les trois états. La loi stationnaire de cette chaîne n'est pas uniforme : la probabilité stationnaire de A vaut \\(4/19\\)."}], "solution": "Réponse : \\(\\mathbb{E}[T] = 19/4 = 4{,}75\\) jours.\n\nNotations : pour un état \\(x\\) parmi C et N, \\(h_x\\) est l'espérance du nombre de jours nécessaires pour atteindre A en partant de \\(x\\), c'est-à-dire \\(\\mathbb{E}[\\min\\{t \\ge 1 : X_t = \\mathrm{A}\\} \\mid X_0 = x]\\).\n\nÉtape 0, ces espérances sont finies. Depuis n'importe quel état, la chaîne atteint A dans les deux jours suivants avec probabilité au moins \\(0{,}2 \\times 0{,}2 = 0{,}04\\) (le pire cas est C, par le chemin C, N, A). Par la propriété de Markov, la probabilité de ne pas avoir atteint A après \\(2k\\) jours est au plus \\((1 - 0{,}04)^k\\), et l'espérance, somme des probabilités de queue, est finie.\n\nÉtape 1, premier pas depuis N. Le premier jour compte pour 1 ; avec probabilité 0,2 la chaîne est en A et c'est fini ; avec probabilité 0,7 elle est en N, avec probabilité 0,1 en C, et, par la propriété de Markov, elle repart comme une chaîne neuve depuis ce nouvel état. Donc \\(h_{\\mathrm{N}} = 1 + 0{,}1\\,h_{\\mathrm{C}} + 0{,}7\\,h_{\\mathrm{N}}\\). De même depuis C : \\(h_{\\mathrm{C}} = 1 + 0{,}8\\,h_{\\mathrm{C}} + 0{,}2\\,h_{\\mathrm{N}}\\).\n\nÉtape 2, résolution. La seconde équation donne \\(0{,}2\\,h_{\\mathrm{C}} = 1 + 0{,}2\\,h_{\\mathrm{N}}\\), soit \\(h_{\\mathrm{C}} = 5 + h_{\\mathrm{N}}\\). En reportant dans la première : \\(0{,}3\\,h_{\\mathrm{N}} = 1 + 0{,}1\\,(5 + h_{\\mathrm{N}})\\), donc \\(0{,}2\\,h_{\\mathrm{N}} = 1{,}5\\), \\(h_{\\mathrm{N}} = 7{,}5\\) et \\(h_{\\mathrm{C}} = 12{,}5\\).\n\nÉtape 3, premier pas depuis A. Avec probabilité 0,5 le jour 1 est agité et \\(T = 1\\) ; avec probabilité 0,5 il est normal et \\(T\\) vaut 1 plus le temps d'atteinte de A depuis N. Donc \\(\\mathbb{E}[T] = 1 + 0{,}5 \\times 0 + 0{,}5 \\times h_{\\mathrm{N}} = 1 + 0{,}5 \\times 7{,}5 = 4{,}75\\).\n\nContrôle par le lemme de Kac (théorème admis ici : pour une chaîne irréductible sur un ensemble fini d'états, l'espérance du temps de retour en un état est l'inverse de sa probabilité stationnaire). La loi stationnaire \\((\\pi_{\\mathrm{C}}, \\pi_{\\mathrm{N}}, \\pi_{\\mathrm{A}})\\) vérifie \\(\\pi_{\\mathrm{C}} = 0{,}8\\,\\pi_{\\mathrm{C}} + 0{,}1\\,\\pi_{\\mathrm{N}}\\), donc \\(\\pi_{\\mathrm{N}} = 2\\,\\pi_{\\mathrm{C}}\\), et \\(\\pi_{\\mathrm{A}} = 0{,}2\\,\\pi_{\\mathrm{N}} + 0{,}5\\,\\pi_{\\mathrm{A}}\\), donc \\(\\pi_{\\mathrm{A}} = 0{,}4\\,\\pi_{\\mathrm{N}}\\). Avec une somme égale à 1 : \\(\\pi = (5/19, 10/19, 4/19)\\), et \\(1/\\pi_{\\mathrm{A}} = 19/4\\). Les deux méthodes concordent.\n\nSimulation (script) : temps de retour moyen 4,761.", "type": "qcm", "multiple": false, "reponse": "4,75", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["M01_d_sejour", "M01_d_un_plus_hN", "M01_d_uniforme", "M01_exact", "M01_exact_den", "M01_exact_num", "M01_hC", "M01_hN", "M01_mc", "M01_p_deux_pas", "M01_piA_den", "M01_piA_num", "M01_piC_den", "M01_piC_num", "M01_piN_den", "M01_piN_num"]}}, {"id": "EB2-M02", "section": "math", "theme": "Urne de Pólya, échangeabilité, martingale", "difficulte": 4, "temps_cible_s": 150, "enonce": "Une urne contient au départ 1 boule rouge et 1 boule bleue. À chaque tirage, on tire une boule uniformément au hasard parmi celles de l'urne, puis on la remet **avec** une boule supplémentaire de la même couleur (urne de Pólya). On effectue 8 tirages.\n\nQuelle est la probabilité qu'exactement 3 des 8 boules tirées soient rouges ?", "options": [{"id": "a", "texte": "1/9 ≈ 0,111", "correcte": true, "explication": "Oui : le nombre de rouges tirées est uniforme sur \\(\\{0, 1, \\dots, 8\\}\\)."}, {"id": "b", "texte": "7/32 ≈ 0,219", "correcte": false, "explication": "C'est \\(\\binom{8}{3}/2^8\\), la loi binomiale de 8 tirages indépendants de probabilité 1/2. Les tirages ne sont pas indépendants : chaque rouge tirée rend la rouge suivante plus probable."}, {"id": "c", "texte": "1/8 = 0,125", "correcte": false, "explication": "C'est une loi uniforme sur 8 valeurs. Le nombre de rouges tirées peut valoir 0, 1, ..., 8 : il y a 9 valeurs possibles."}, {"id": "d", "texte": "1/504 ≈ 0,002", "correcte": false, "explication": "C'est la probabilité d'une suite particulière de tirages contenant 3 rouges, par exemple trois rouges puis cinq bleues. Il faut la multiplier par le nombre \\(\\binom{8}{3}\\) de positions possibles des rouges."}], "solution": "Réponse : \\(1/9 \\approx 0{,}111\\).\n\nNotations : \\(n = 8\\) tirages, \\(k = 3\\) rouges voulues.\n\nÉtape 1, probabilité d'une suite donnée. Considérons une suite de tirages contenant \\(k\\) rouges et \\(n - k\\) bleues, dans un ordre fixé. Au \\(m\\)-ième tirage, l'urne contient \\(m + 1\\) boules (2 au départ, une de plus par tirage) : les dénominateurs successifs font le produit \\(2 \\times 3 \\times \\dots \\times (n + 1) = (n + 1)!\\). Quand on tire la \\(j\\)-ième rouge, l'urne contient \\(j\\) rouges (1 au départ, plus les \\(j - 1\\) déjà ajoutées) : les numérateurs des tirages rouges font \\(1 \\times 2 \\times \\dots \\times k = k!\\), ceux des tirages bleus \\((n - k)!\\). La probabilité de la suite est donc \\(k!\\,(n - k)!/(n + 1)!\\), quel que soit l'ordre des couleurs (échangeabilité).\n\nÉtape 2 : il y a \\(\\binom{n}{k}\\) suites contenant \\(k\\) rouges, toutes de même probabilité, donc \\(\\mathbb{P}(k \\text{ rouges}) = \\binom{n}{k}\\,\\dfrac{k!\\,(n - k)!}{(n + 1)!} = \\dfrac{1}{n + 1}\\), soit \\(1/9\\) ici.\n\nLien avec les martingales : la proportion de rouges dans l'urne après chaque tirage est une martingale (son espérance conditionnelle au tirage suivant est égale à sa valeur actuelle) ; elle converge presque sûrement, et sa limite suit la loi uniforme sur \\([0, 1]\\), cohérente avec la loi uniforme du nombre de rouges. Ce dernier point est cité, pas démontré ici.\n\nVérifications (script) : énumération exacte des \\(2^8\\) suites, et simulation : 0,1110.", "type": "qcm", "multiple": false, "reponse": "1/9 ≈ 0,111", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["M02_d_binomiale", "M02_d_binomiale_den", "M02_d_binomiale_num", "M02_d_huit", "M02_d_huit_den", "M02_d_huit_num", "M02_d_suite", "M02_d_suite_den", "M02_d_suite_num", "M02_exact", "M02_exact_den", "M02_exact_num", "M02_mc"]}}, {"id": "EB2-M03", "section": "math", "theme": "Dénombrement, arrangements avec contrainte", "difficulte": 3, "temps_cible_s": 150, "enonce": "On appelle anagramme du mot ARBITRAGE toute suite de ses 9 lettres (A, R, B, I, T, R, A, G, E), chaque lettre étant utilisée exactement une fois, que la suite ait un sens ou non ; deux anagrammes sont identiques si elles s'écrivent de la même façon (échanger les deux A, ou les deux R, ne donne pas une nouvelle anagramme).\n\nCombien d'anagrammes de ARBITRAGE ne contiennent pas deux R côte à côte ?", "options": [{"id": "a", "texte": "70560", "correcte": true, "explication": "Oui : 90720 anagrammes en tout, moins les 20160 où les deux R se touchent."}, {"id": "b", "texte": "90720", "correcte": false, "explication": "C'est le nombre total d'anagrammes, \\(9!/(2!\\,2!)\\) : la contrainte sur les R n'a pas été appliquée."}, {"id": "c", "texte": "20160", "correcte": false, "explication": "C'est le nombre d'anagrammes où les deux R sont **côte à côte** (bloc RR traité comme une seule lettre, \\(8!/2!\\)). La question demande le complémentaire."}, {"id": "d", "texte": "141120", "correcte": false, "explication": "C'est \\(9!/2! - 8!\\) : la répétition des deux A a été oubliée. Échanger les deux A ne crée pas une nouvelle anagramme, il faut diviser chaque décompte par \\(2!\\)."}], "solution": "Réponse : 70560.\n\nÉtape 1, total. Les 9 lettres comptent deux A et deux R. Parmi les \\(9!\\) ordres des 9 lettres rendues distinctes, chaque anagramme apparaît \\(2!\\,2!\\) fois (on peut permuter les A entre eux et les R entre eux sans changer l'écriture). Total : \\(9!/(2!\\,2!) = 90720\\).\n\nÉtape 2, R côte à côte. On colle les deux R en un bloc RR. Il reste 8 objets (RR, deux A, B, I, T, G, E), dont deux A identiques : \\(8!/2! = 20160\\) suites. Chaque anagramme avec les R adjacents correspond à exactement une de ces suites (le bloc est à la place des deux R).\n\nÉtape 3, complémentaire : \\(90720 - 20160 = 70560\\).\n\nContrôle (script) : l'énumération des permutations des 9 lettres, sans doublon, donne les mêmes trois nombres.\n\nMéthode alternative : placer d'abord les 7 autres lettres (\\(7!/2!\\) façons), puis choisir 2 des 8 intervalles qu'elles délimitent pour les R (\\(\\binom{8}{2}\\)) : même résultat. Piège : oublier une répétition (A ou R), ou compter le bloc RR comme deux objets.", "type": "qcm", "multiple": false, "reponse": "70560", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["M03_adjacents", "M03_d_a_distincts", "M03_exact", "M03_total"]}}, {"id": "EB2-M04", "section": "math", "theme": "Espérance et variance conditionnelles", "difficulte": 3, "temps_cible_s": 150, "enonce": "Le nombre \\(N\\) d'ordres reçus par un courtier en une minute est modélisé ainsi : l'intensité \\(\\Lambda\\) de la minute est une variable aléatoire de loi exponentielle d'espérance 4 (densité \\(\\tfrac14 e^{-\\lambda/4}\\) pour \\(\\lambda > 0\\)) et, sachant \\(\\Lambda = \\lambda\\), \\(N\\) suit la loi de Poisson de paramètre \\(\\lambda\\).\n\nQue vaut \\(\\mathrm{Var}(N)\\) ?", "options": [{"id": "a", "texte": "20", "correcte": true, "explication": "Oui : \\(\\mathbb{E}[\\Lambda] + \\mathrm{Var}(\\Lambda) = 4 + 16\\)."}, {"id": "b", "texte": "4", "correcte": false, "explication": "C'est \\(\\mathbb{E}[N]\\), qui serait aussi la variance si l'intensité était fixe et égale à 4 (loi de Poisson). Une intensité aléatoire ajoute sa propre variance, \\(\\mathrm{Var}(\\Lambda)\\)."}, {"id": "c", "texte": "16", "correcte": false, "explication": "C'est \\(\\mathrm{Var}(\\Lambda)\\) seule : il manque la dispersion de Poisson autour de l'intensité, \\(\\mathbb{E}[\\mathrm{Var}(N \\mid \\Lambda)] = \\mathbb{E}[\\Lambda] = 4\\)."}, {"id": "d", "texte": "8", "correcte": false, "explication": "C'est \\(4 + 4\\) : la variance d'une loi exponentielle a été prise égale à son espérance, comme pour une loi de Poisson. Pour une exponentielle d'espérance \\(m\\), la variance vaut \\(m^2\\)."}], "solution": "Réponse : \\(\\mathrm{Var}(N) = 20\\).\n\nÉtape 1, formule de la variance totale : \\(\\mathrm{Var}(N) = \\mathbb{E}[\\mathrm{Var}(N \\mid \\Lambda)] + \\mathrm{Var}(\\mathbb{E}[N \\mid \\Lambda])\\). Preuve : \\(\\mathbb{E}[N^2] = \\mathbb{E}\\big[\\mathbb{E}[N^2 \\mid \\Lambda]\\big] = \\mathbb{E}\\big[\\mathrm{Var}(N \\mid \\Lambda)\\big] + \\mathbb{E}\\big[\\mathbb{E}[N \\mid \\Lambda]^2\\big]\\) et \\(\\mathbb{E}[N] = \\mathbb{E}\\big[\\mathbb{E}[N \\mid \\Lambda]\\big]\\) ; en retranchant \\(\\mathbb{E}[N]^2\\), les deux derniers termes forment la variance de \\(\\mathbb{E}[N \\mid \\Lambda]\\).\n\nÉtape 2, moments conditionnels : une loi de Poisson de paramètre \\(\\lambda\\) a pour espérance et pour variance \\(\\lambda\\). Donc \\(\\mathbb{E}[N \\mid \\Lambda] = \\mathrm{Var}(N \\mid \\Lambda) = \\Lambda\\).\n\nÉtape 3, moments de \\(\\Lambda\\) : pour une exponentielle d'espérance \\(m = 4\\), \\(\\mathbb{E}[\\Lambda^2] = \\int_0^\\infty \\lambda^2\\,\\tfrac1m e^{-\\lambda/m}\\,d\\lambda = 2m^2\\) (deux intégrations par parties), donc \\(\\mathrm{Var}(\\Lambda) = 2m^2 - m^2 = m^2 = 16\\).\n\nÉtape 4 : \\(\\mathrm{Var}(N) = \\mathbb{E}[\\Lambda] + \\mathrm{Var}(\\Lambda) = 4 + 16 = 20\\).\n\nContrôle : en intégrant sur \\(\\lambda\\) (script), \\(\\mathbb{P}(N = k) = \\tfrac15 \\big(\\tfrac45\\big)^k\\) pour \\(k \\ge 0\\) : \\(N\\) suit une loi géométrique sur \\(\\{0, 1, 2, \\dots\\}\\), d'espérance 4 et de variance \\((4/5)/(1/5)^2 = 20\\). Simulation : \\(\\mathbb{E}[N] \\approx 3{,}988\\) et \\(\\mathbb{E}[N^2] \\approx 35{,}75\\), pour des valeurs exactes 4 et 36.\n\nLecture : une variance de comptage supérieure à l'espérance (surdispersion) signale une intensité qui varie d'une minute à l'autre ; un modèle de Poisson à intensité fixe la sous-estimerait.", "type": "qcm", "multiple": false, "reponse": "20", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["M04_E", "M04_E2", "M04_E2_mc", "M04_E_mc", "M04_d_somme_moyennes", "M04_exact", "M04_var_lambda"]}}, {"id": "EB2-M05", "section": "math", "theme": "Processus de Poisson, maximum d'exponentielles", "difficulte": 3, "temps_cible_s": 120, "enonce": "Les ordres d'achat arrivent selon un processus de Poisson d'intensité 3 par minute, et les ordres de vente selon un processus de Poisson d'intensité 2 par minute, indépendant du premier. On observe à partir de l'instant 0.\n\nQuelle est l'espérance, en minutes, du temps d'attente jusqu'à avoir reçu au moins un ordre d'achat **et** au moins un ordre de vente ?", "options": [{"id": "a", "texte": "19/30 ≈ 0,633", "correcte": true, "explication": "Oui : \\(1/3 + 1/2 - 1/5\\), l'espérance du maximum de deux exponentielles indépendantes."}, {"id": "b", "texte": "1/2 = 0,500", "correcte": false, "explication": "C'est le plus grand des deux temps moyens, \\(\\max(1/3, 1/2)\\). L'espérance d'un maximum dépasse le maximum des espérances (la fonction max est convexe) : avec une probabilité non nulle, c'est l'ordre d'achat qui arrive le dernier."}, {"id": "c", "texte": "5/6 ≈ 0,833", "correcte": false, "explication": "C'est \\(1/3 + 1/2\\), qui revient à attendre le premier achat, puis seulement ensuite le premier vente. Les deux attentes se déroulent en même temps : il faut retirer leur partie commune, l'espérance du minimum."}, {"id": "d", "texte": "1/5 = 0,200", "correcte": false, "explication": "C'est l'espérance du minimum, le temps jusqu'au premier ordre quel que soit son type. La question demande d'avoir reçu les deux types."}], "solution": "Réponse : \\(19/30 \\approx 0{,}633\\) minute.\n\nNotations : \\(A\\) est l'instant du premier ordre d'achat, \\(B\\) celui du premier ordre de vente ; le temps demandé est \\(\\max(A, B)\\).\n\nÉtape 1, lois. \\(A > t\\) signifie qu'aucun ordre d'achat n'arrive dans \\([0, t]\\), dont le nombre suit une loi de Poisson de paramètre \\(3t\\) : \\(\\mathbb{P}(A > t) = e^{-3t}\\). Donc \\(A\\) suit la loi exponentielle de paramètre 3, d'espérance 1/3 ; de même \\(B\\) est exponentielle de paramètre 2, d'espérance 1/2, et \\(A\\), \\(B\\) sont indépendants.\n\nÉtape 2, minimum. Par indépendance, \\(\\mathbb{P}(\\min(A, B) > t) = \\mathbb{P}(A > t)\\,\\mathbb{P}(B > t) = e^{-5t}\\) : le minimum est exponentiel de paramètre 5, d'espérance 1/5.\n\nÉtape 3, l'identité \\(\\max(a, b) = a + b - \\min(a, b)\\), vraie pour tous réels \\(a\\), \\(b\\), et la linéarité de l'espérance donnent \\(\\mathbb{E}[\\max(A, B)] = 1/3 + 1/2 - 1/5 = 19/30\\).\n\nContrôle direct (script) : \\(\\mathbb{E}[\\max(A, B)] = \\int_0^\\infty \\big(1 - (1 - e^{-3t})(1 - e^{-2t})\\big)\\,dt = 19/30\\), par la formule \\(\\mathbb{E}[Y] = \\int_0^\\infty \\mathbb{P}(Y > t)\\,dt\\) pour \\(Y \\ge 0\\). Simulation : 0,6334.", "type": "qcm", "multiple": false, "reponse": "19/30 ≈ 0,633", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["M05_d_max_moyennes", "M05_d_max_moyennes_den", "M05_d_max_moyennes_num", "M05_d_min", "M05_d_min_den", "M05_d_min_num", "M05_d_somme", "M05_d_somme_den", "M05_d_somme_num", "M05_exact", "M05_exact_den", "M05_exact_num", "M05_mc"]}}, {"id": "EB2-M06", "section": "math", "theme": "Conditionnement, valeurs singulières d'une matrice non symétrique", "difficulte": 4, "temps_cible_s": 150, "enonce": "Soit \\(\\mathbf{A}\\) la matrice \\(2 \\times 2\\) de lignes \\((1, 1)\\) et \\((0, 1)\\). Pour une matrice inversible \\(\\mathbf{M}\\), on note \\(\\lVert \\mathbf{M} \\rVert_2 = \\max_{\\mathbf{x} \\ne \\mathbf{0}} \\lVert \\mathbf{M}\\mathbf{x} \\rVert/\\lVert \\mathbf{x} \\rVert\\) sa norme d'opérateur associée à la norme euclidienne, et \\(\\kappa(\\mathbf{M}) = \\lVert \\mathbf{M} \\rVert_2\\,\\lVert \\mathbf{M}^{-1} \\rVert_2\\) son conditionnement.\n\nQue vaut \\(\\kappa(\\mathbf{A})\\), arrondi à trois décimales ?", "options": [{"id": "a", "texte": "2,618", "correcte": true, "explication": "Oui : \\((3 + \\sqrt5)/2\\), rapport des valeurs singulières extrêmes."}, {"id": "b", "texte": "1,000", "correcte": false, "explication": "C'est le rapport des valeurs propres de \\(\\mathbf{A}\\), toutes deux égales à 1. Pour une matrice non symétrique, le conditionnement se lit sur les valeurs singulières (racines des valeurs propres de \\(\\mathbf{A}^\\top\\mathbf{A}\\)), pas sur les valeurs propres."}, {"id": "c", "texte": "6,854", "correcte": false, "explication": "C'est le rapport des valeurs propres de \\(\\mathbf{A}^\\top\\mathbf{A}\\), c'est-à-dire \\(\\kappa(\\mathbf{A})^2\\) : il manque la racine carrée qui transforme ces valeurs propres en valeurs singulières de \\(\\mathbf{A}\\)."}, {"id": "d", "texte": "4,000", "correcte": false, "explication": "C'est le conditionnement pour la norme d'opérateur associée à la norme du maximum (plus grande somme des valeurs absolues d'une ligne : 2 pour \\(\\mathbf{A}\\) et 2 pour \\(\\mathbf{A}^{-1}\\)). L'énoncé fixe la norme euclidienne."}], "solution": "Réponse : \\(\\kappa(\\mathbf{A}) = (3 + \\sqrt5)/2 \\approx 2{,}618\\).\n\nÉtape 1, norme d'opérateur et valeurs singulières. \\(\\lVert \\mathbf{A}\\mathbf{x} \\rVert^2 = \\mathbf{x}^\\top \\mathbf{A}^\\top\\mathbf{A}\\,\\mathbf{x}\\), et \\(\\mathbf{A}^\\top\\mathbf{A}\\) est symétrique semi-définie positive, de valeurs propres \\(\\lambda_{\\max} \\ge \\lambda_{\\min} \\ge 0\\). En décomposant \\(\\mathbf{x}\\) dans une base orthonormée de vecteurs propres (théorème spectral), \\(\\mathbf{x}^\\top \\mathbf{A}^\\top\\mathbf{A}\\,\\mathbf{x}/\\lVert \\mathbf{x} \\rVert^2\\) est une moyenne pondérée des valeurs propres, maximale en un vecteur propre de \\(\\lambda_{\\max}\\). Donc \\(\\lVert \\mathbf{A} \\rVert_2 = \\sqrt{\\lambda_{\\max}}\\), la plus grande valeur singulière.\n\nÉtape 2, inverse. \\(\\mathbf{A}^{-1}\\) a pour valeurs singulières les inverses de celles de \\(\\mathbf{A}\\) (si \\(\\mathbf{A} = \\mathbf{U}\\mathbf{D}\\mathbf{V}^\\top\\), alors \\(\\mathbf{A}^{-1} = \\mathbf{V}\\mathbf{D}^{-1}\\mathbf{U}^\\top\\)), donc \\(\\lVert \\mathbf{A}^{-1} \\rVert_2 = 1/\\sqrt{\\lambda_{\\min}}\\) et \\(\\kappa(\\mathbf{A}) = \\sqrt{\\lambda_{\\max}/\\lambda_{\\min}}\\).\n\nÉtape 3, calcul. \\(\\mathbf{A}^\\top\\mathbf{A}\\) a pour lignes \\((1, 1)\\) et \\((1, 2)\\) : trace 3, déterminant 1, donc ses valeurs propres sont les racines de \\(\\lambda^2 - 3\\lambda + 1\\), soit \\((3 \\pm \\sqrt5)/2\\), environ 2,618 et 0,382. Comme leur produit vaut 1, \\(\\lambda_{\\max}/\\lambda_{\\min} = \\lambda_{\\max}^2\\) et \\(\\kappa(\\mathbf{A}) = \\lambda_{\\max} = (3 + \\sqrt5)/2 \\approx 2{,}618\\).\n\nPiège : les valeurs propres de \\(\\mathbf{A}\\) valent toutes deux 1, et pourtant \\(\\mathbf{A}\\) amplifie certaines erreurs relatives d'un facteur 2,618. Pour une matrice symétrique définie positive, valeurs propres et valeurs singulières coïncident, et le conditionnement est le rapport des valeurs propres extrêmes ; pas pour une matrice quelconque. Contrôle (script) : sympy et numpy donnent la même valeur.", "type": "qcm", "multiple": false, "reponse": "2,618", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["M06_d_carre", "M06_d_infini", "M06_d_valeurs_propres", "M06_exact", "M06_vp_max", "M06_vp_min"]}}, {"id": "EB2-M07", "section": "math", "theme": "Méthode delta, approximation d'un écart-type", "difficulte": 3, "temps_cible_s": 150, "enonce": "Soient \\(X_1, \\dots, X_{100}\\) des variables aléatoires indépendantes, de même loi, strictement positives, d'espérance \\(\\mu = 2\\) et de variance \\(\\sigma^2 = 4\\), et \\(\\bar X = (X_1 + \\dots + X_{100})/100\\) leur moyenne.\n\nPar la méthode delta (développement de Taylor à l'ordre 1 de la fonction \\(\\ln\\) autour de \\(\\mu\\)), quelle est l'approximation de l'écart-type de \\(\\ln \\bar X\\) ?", "options": [{"id": "a", "texte": "0,10", "correcte": true, "explication": "Oui : \\(\\sigma/(\\mu\\sqrt n)\\), la dérivée de \\(\\ln\\) en 2 valant 1/2."}, {"id": "b", "texte": "0,20", "correcte": false, "explication": "C'est \\(\\sigma/\\sqrt n\\), l'écart-type de \\(\\bar X\\) lui-même : la dérivée \\(1/\\mu\\) de \\(\\ln\\) en \\(\\mu\\), qui convertit une variation de \\(\\bar X\\) en variation de \\(\\ln \\bar X\\), a été oubliée."}, {"id": "c", "texte": "0,01", "correcte": false, "explication": "C'est l'approximation de la **variance** de \\(\\ln \\bar X\\), \\(\\sigma^2/(\\mu^2 n)\\). L'écart-type en est la racine carrée."}, {"id": "d", "texte": "0,05", "correcte": false, "explication": "C'est \\(\\sigma/(\\mu^2\\sqrt n)\\) : la dérivée de \\(\\ln\\) a été prise égale à \\(1/\\mu^2\\), qui est (au signe près) sa dérivée seconde. La dérivée de \\(\\ln x\\) est \\(1/x\\)."}], "solution": "Réponse : \\(\\sigma/(\\mu\\sqrt n) = 2/(2 \\times 10) = 0{,}10\\).\n\nNotations : \\(n = 100\\), \\(g = \\ln\\), \\(g'(x) = 1/x\\).\n\nÉtape 1 : \\(\\bar X\\) a pour espérance \\(\\mu\\) et pour écart-type \\(\\sigma/\\sqrt n = 0{,}2\\), petit devant \\(\\mu = 2\\) : \\(\\bar X\\) reste proche de \\(\\mu\\), ce qui justifie un développement local.\n\nÉtape 2, Taylor à l'ordre 1 : \\(\\ln \\bar X \\approx \\ln \\mu + (\\bar X - \\mu)/\\mu\\). Le second membre est une fonction affine de \\(\\bar X\\), de variance \\(\\mathrm{Var}(\\bar X)/\\mu^2 = \\sigma^2/(\\mu^2 n)\\).\n\nÉtape 3 : écart-type approché \\(\\sigma/(\\mu\\sqrt n) = 0{,}10\\).\n\nStatut : c'est une approximation, pas une égalité. Elle devient exacte au premier ordre quand \\(n \\to \\infty\\) : \\(\\sqrt n\\,(\\ln \\bar X - \\ln \\mu)\\) converge en loi vers une normale de variance \\(\\sigma^2/\\mu^2\\) (théorème central limite et méthode delta, admis). Illustration (script) : pour une loi exponentielle d'espérance 2 (donc de variance 4), l'écart-type simulé de \\(\\ln \\bar X\\) vaut 0,1000. Lecture : l'écart-type de \\(\\ln \\bar X\\) est l'écart-type relatif de \\(\\bar X\\), \\((\\sigma/\\sqrt n)/\\mu\\).", "type": "qcm", "multiple": false, "reponse": "0,10", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["M07_d_derivee_seconde", "M07_d_sans_derivee", "M07_d_variance", "M07_exact", "M07_sd_moyenne", "M07_sd_sim"]}}, {"id": "EB2-M08", "section": "math", "theme": "Test d'une proportion, p-value", "difficulte": 2, "temps_cible_s": 120, "enonce": "Un signal prédit chaque jour le sens (hausse ou baisse) du rendement du lendemain. Sur \\(n = 400\\) jours, il a raison 220 fois. On modélise les 400 jours comme indépendants, chacun avec la même probabilité de succès \\(p\\), et l'on teste \\(H_0 : p = 1/2\\) contre \\(H_1 : p \\ne 1/2\\).\n\nOn note \\(\\hat P\\) la proportion de succès, \\(\\Phi\\) la fonction de répartition de la loi normale centrée réduite, et l'on utilise la statistique \\(Z = (\\hat P - 1/2)/\\sqrt{(1/2)(1/2)/n}\\), dont on approche la loi sous \\(H_0\\) par la loi normale centrée réduite (théorème central limite). Quelle est la p-value bilatérale, arrondie à trois décimales ?", "options": [{"id": "a", "texte": "0,046", "correcte": true, "explication": "Oui : \\(Z = 2\\) et \\(2\\,(1 - \\Phi(2))\\)."}, {"id": "b", "texte": "0,023", "correcte": false, "explication": "C'est la p-value unilatérale \\(\\mathbb{P}(Z \\ge 2)\\). L'alternative \\(p \\ne 1/2\\) est bilatérale : un écart aussi grand vers le bas serait aussi un signe contre \\(H_0\\), et l'on additionne les deux queues."}, {"id": "c", "texte": "0,954", "correcte": false, "explication": "C'est \\(\\mathbb{P}(\\lvert Z \\rvert < 2)\\), la probabilité de l'événement contraire. La p-value est la probabilité, sous \\(H_0\\), d'un écart au moins aussi extrême que celui observé."}, {"id": "d", "texte": "0,000", "correcte": false, "explication": "L'écart-type de \\(\\hat P\\) a été pris égal à \\((1/2)(1/2)/n\\) au lieu de sa racine carrée : \\(Z\\) vaut alors 80 et la p-value est presque nulle. La variance d'une moyenne de \\(n\\) variables indépendantes est divisée par \\(n\\), son écart-type par \\(\\sqrt n\\)."}], "solution": "Réponse : \\(2\\,(1 - \\Phi(2)) \\approx 0{,}046\\).\n\nÉtape 1 : \\(\\hat P = 220/400 = 0{,}55\\).\n\nÉtape 2 : sous \\(H_0\\), le nombre de succès suit la loi binomiale de paramètres \\(n\\) et 1/2, donc \\(\\hat P\\) a pour espérance 1/2 et pour écart-type \\(\\sqrt{(1/2)(1/2)/n} = 0{,}000\\). Ainsi \\(Z = (0{,}55 - 0{,}5)/0{,}000 = 2\\).\n\nÉtape 3 : la p-value bilatérale est \\(\\mathbb{P}(\\lvert Z \\rvert \\ge 2)\\) sous \\(H_0\\), approchée par \\(2\\,(1 - \\Phi(2)) \\approx 0{,}0455\\).\n\nLecture : au niveau 5 %, on rejette \\(H_0\\), de justesse. Mais la p-value binomiale exacte du même test, \\(\\mathbb{P}(\\lvert K - 200 \\rvert \\ge 20)\\) avec \\(K\\) de loi binomiale de paramètres 400 et 1/2, vaut 0,0510 (script) : au-dessus de 5 %. Près du seuil, la conclusion dépend de l'approximation ; et si ce signal a été retenu parmi plusieurs, il faut de plus corriger pour les tests multiples.\n\nSimulations (script) : 0,0455 pour la loi normale, 0,0510 pour la loi binomiale.", "type": "qcm", "multiple": false, "reponse": "0,046", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["M08_binom", "M08_binom_mc", "M08_d_complement", "M08_d_div_n", "M08_d_div_n_z", "M08_d_unilaterale", "M08_exact", "M08_mc", "M08_phat", "M08_se", "M08_z"]}}, {"id": "EB2-M09", "section": "math", "theme": "Intégrale gaussienne, espérance tronquée", "difficulte": 3, "temps_cible_s": 150, "enonce": "Soit \\(Z\\) une variable aléatoire de loi normale centrée réduite. On note \\(\\varphi\\) sa densité et \\(\\Phi\\) sa fonction de répartition ; on donne \\(\\varphi(1) \\approx 0,2420\\) et \\(\\Phi(1) \\approx 0,8413\\).\n\nQue vaut \\(\\mathbb{E}[\\max(Z - 1, 0)]\\), arrondie à trois décimales ?", "options": [{"id": "a", "texte": "0,083", "correcte": true, "explication": "Oui : \\(\\varphi(1) - (1 - \\Phi(1))\\)."}, {"id": "b", "texte": "0,242", "correcte": false, "explication": "C'est \\(\\int_1^\\infty z\\,\\varphi(z)\\,dz = \\varphi(1)\\) seul : le terme \\(-1 \\times \\mathbb{P}(Z > 1)\\), qui retranche le seuil, a été oublié."}, {"id": "c", "texte": "0,159", "correcte": false, "explication": "C'est \\(\\mathbb{P}(Z > 1)\\), la probabilité que le maximum soit non nul, et non l'espérance du montant qui dépasse 1."}, {"id": "d", "texte": "0,000", "correcte": false, "explication": "C'est \\(\\max(\\mathbb{E}[Z] - 1, 0)\\) : l'espérance a été passée à l'intérieur de la fonction. Comme \\(x \\mapsto \\max(x - 1, 0)\\) est convexe, l'inégalité de Jensen donne \\(\\mathbb{E}[\\max(Z - 1, 0)] \\ge \\max(\\mathbb{E}[Z] - 1, 0)\\), et l'inégalité est stricte puisque \\(Z\\) dépasse 1 avec une probabilité non nulle."}], "solution": "Réponse : \\(\\varphi(1) - (1 - \\Phi(1)) \\approx 0{,}083\\).\n\nÉtape 1 : \\(\\max(Z - 1, 0) = (Z - 1)\\,\\mathbf{1}_{\\{Z > 1\\}}\\), donc \\(\\mathbb{E}[\\max(Z - 1, 0)] = \\int_1^\\infty (z - 1)\\,\\varphi(z)\\,dz = \\int_1^\\infty z\\,\\varphi(z)\\,dz - \\mathbb{P}(Z > 1)\\).\n\nÉtape 2 : \\(\\varphi(z) = e^{-z^2/2}/\\sqrt{2\\pi}\\) vérifie \\(\\varphi'(z) = -z\\,\\varphi(z)\\). Donc \\(\\int_1^\\infty z\\,\\varphi(z)\\,dz = \\big[-\\varphi(z)\\big]_1^\\infty = \\varphi(1)\\), puisque \\(\\varphi(z) \\to 0\\) quand \\(z \\to +\\infty\\).\n\nÉtape 3 : \\(\\varphi(1) - (1 - \\Phi(1)) \\approx 0{,}2420 - 0{,}1587 = 0{,}0833\\).\n\nGénéralisation : pour un seuil \\(k\\) réel, le même calcul donne \\(\\mathbb{E}[\\max(Z - k, 0)] = \\varphi(k) - k\\,(1 - \\Phi(k))\\). C'est le prix, sans actualisation, d'une option d'achat de prix d'exercice \\(k\\) sur un sous-jacent de loi normale centrée réduite (modèle de Bachelier). Cas limite \\(k = 0\\) : \\(\\mathbb{E}[\\max(Z, 0)] = \\varphi(0) \\approx 0{,}3989\\).\n\nSimulation (script) : 0,0832.", "type": "qcm", "multiple": false, "reponse": "0,083", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["M09_E_zplus", "M09_Phi1", "M09_d_jensen", "M09_exact", "M09_mc", "M09_phi1", "M09_queue"]}}, {"id": "EB2-M10", "section": "math", "theme": "Mouvement brownien, intégrale en temps", "difficulte": 4, "temps_cible_s": 180, "enonce": "Soit \\((W_t)_{t \\ge 0}\\) un mouvement brownien standard : \\(W_0 = 0\\), trajectoires continues, accroissements indépendants, et \\(W_t - W_s\\) de loi normale centrée de variance \\(t - s\\) pour \\(0 \\le s < t\\). On pose \\(I = \\int_0^1 W_s\\,ds\\), l'aire algébrique sous la trajectoire entre les instants 0 et 1, qui est une variable aléatoire.\n\nQue vaut \\(\\mathrm{Var}(I)\\) ?", "options": [{"id": "a", "texte": "1/3", "correcte": true, "explication": "Oui : \\(\\int_0^1\\!\\int_0^1 \\min(s, t)\\,ds\\,dt\\)."}, {"id": "b", "texte": "1/2", "correcte": false, "explication": "C'est \\(\\mathbb{E}\\big[\\int_0^1 W_s^2\\,ds\\big] = \\int_0^1 s\\,ds\\) : on a calculé l'espérance de l'intégrale du carré au lieu de celle du carré de l'intégrale. \\(I^2 = \\int_0^1\\!\\int_0^1 W_s W_t\\,ds\\,dt\\) fait intervenir les covariances entre instants différents."}, {"id": "c", "texte": "1", "correcte": false, "explication": "C'est \\(\\mathrm{Var}(W_1)\\), la variance du point final. L'intégrale moyenne la trajectoire sur \\([0, 1]\\), dont les valeurs proches de l'instant 0 sont petites : sa variance est plus faible."}, {"id": "d", "texte": "1/6", "correcte": false, "explication": "C'est \\(\\int_0^1\\!\\int_0^t s\\,ds\\,dt\\), l'intégrale de \\(\\min(s, t)\\) sur le seul triangle \\(s \\le t\\). Le carré \\([0, 1]^2\\) contient deux triangles symétriques : il faut doubler."}], "solution": "Réponse : \\(\\mathrm{Var}(I) = 1/3\\).\n\nÉtape 1, covariance. Pour \\(0 \\le s \\le t\\), \\(W_t = W_s + (W_t - W_s)\\), où l'accroissement est centré et indépendant de \\(W_s\\). Donc \\(\\mathbb{E}[W_s W_t] = \\mathbb{E}[W_s^2] + \\mathbb{E}[W_s]\\,\\mathbb{E}[W_t - W_s] = s\\). Ainsi \\(\\mathbb{E}[W_s W_t] = \\min(s, t)\\).\n\nÉtape 2, espérance : \\(\\mathbb{E}[I] = \\int_0^1 \\mathbb{E}[W_s]\\,ds = 0\\), l'échange étant permis par le théorème de Fubini puisque \\(\\int_0^1 \\mathbb{E}\\lvert W_s \\rvert\\,ds < \\infty\\).\n\nÉtape 3 : \\(I^2 = \\int_0^1\\!\\int_0^1 W_s W_t\\,ds\\,dt\\). Le théorème de Fubini s'applique car \\(\\mathbb{E}\\lvert W_s W_t \\rvert \\le \\sqrt{st} \\le 1\\) (inégalité de Cauchy-Schwarz). Donc \\(\\mathbb{E}[I^2] = \\int_0^1\\!\\int_0^1 \\min(s, t)\\,ds\\,dt = 2\\int_0^1\\!\\int_0^t s\\,ds\\,dt = 2\\int_0^1 \\tfrac{t^2}{2}\\,dt = \\tfrac13\\), la symétrie en \\((s, t)\\) permettant de ne calculer que le triangle \\(s \\le t\\).\n\nSeconde méthode, par le calcul d'Itô (formule d'Itô et isométrie d'Itô admises). La formule d'Itô pour le produit \\(t\\,W_t\\), où \\(t\\) est déterministe, donne \\(d(t\\,W_t) = W_t\\,dt + t\\,dW_t\\), donc \\(W_1 = \\int_0^1 W_s\\,ds + \\int_0^1 s\\,dW_s\\) et \\(I = \\int_0^1 (1 - s)\\,dW_s\\). Par l'isométrie d'Itô, \\(\\mathrm{Var}(I) = \\int_0^1 (1 - s)^2\\,ds = \\tfrac13\\). Cette écriture montre aussi que \\(I\\) est gaussienne : \\(I\\) suit la loi normale centrée de variance 1/3.\n\nVérification numérique (script) : la somme de Riemann à 200 pas, \\(\\tfrac{1}{200}\\sum_{k=1}^{200} W_{k/200}\\), a pour variance exacte 0,3358, qui tend vers 1/3 quand le pas diminue ; sa simulation donne 0,3345.", "type": "qcm", "multiple": false, "reponse": "1/3", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["M10_d_moitie_den", "M10_d_moitie_num", "M10_d_second_moment_den", "M10_d_second_moment_num", "M10_d_un", "M10_exact_den", "M10_exact_num", "M10_riemann_200_mc", "M10_var_riemann_200"]}}]}, {"id": "mlf", "nom": "Machine Learning fondamental", "budget_min": 7, "questions": [{"id": "EB2-F01", "section": "mlf", "theme": "Log-loss, meilleur prédicteur constant", "difficulte": 3, "temps_cible_s": 90, "enonce": "Un jeu de test contient 20 % d'exemples positifs (étiquette 1) et 80 % de négatifs (étiquette 0). Un prédicteur constant attribue la même probabilité \\(p \\in \\,]0, 1[\\) d'être positif à tous les exemples. La log-loss moyenne est \\(-\\tfrac{1}{n}\\sum_{i=1}^{n} \\big[y_i \\ln p + (1 - y_i)\\ln(1 - p)\\big]\\), où \\(n\\) est le nombre d'exemples et \\(y_i\\) l'étiquette de l'exemple \\(i\\), avec le logarithme népérien.\n\nQuelle est la plus petite log-loss moyenne que peut atteindre un prédicteur constant, arrondie à trois décimales ?", "options": [{"id": "a", "texte": "0,500", "correcte": true, "explication": "Oui : \\(p = 0{,}2\\) et \\(-(0{,}2 \\ln 0{,}2 + 0{,}8 \\ln 0{,}8)\\)."}, {"id": "b", "texte": "0,693", "correcte": false, "explication": "C'est \\(\\ln 2\\), la log-loss du prédicteur constant \\(p = 1/2\\). Ce n'est pas le meilleur constant quand les classes sont déséquilibrées : la meilleure constante est la proportion de positifs."}, {"id": "c", "texte": "0,223", "correcte": false, "explication": "C'est \\(-\\ln 0{,}8\\), la perte sur un exemple négatif seulement. La moyenne pondère aussi la perte \\(-\\ln 0{,}2\\) des 20 % de positifs."}, {"id": "d", "texte": "0,160", "correcte": false, "explication": "C'est \\(0{,}2 \\times 0{,}8\\), le score de Brier (erreur quadratique moyenne des probabilités) du meilleur prédicteur constant. La question porte sur la log-loss."}], "solution": "Réponse : \\(-(0{,}2 \\ln 0{,}2 + 0{,}8 \\ln 0{,}8) \\approx 0{,}500\\), atteinte en \\(p = 0{,}2\\).\n\nÉtape 1 : avec une proportion \\(q = 0{,}2\\) de positifs, la log-loss moyenne du prédicteur constant vaut \\(L(p) = -\\big(q \\ln p + (1 - q)\\ln(1 - p)\\big)\\).\n\nÉtape 2 : \\(L'(p) = -q/p + (1 - q)/(1 - p)\\), qui s'annule en \\(p = q\\) ; \\(L''(p) = q/p^2 + (1 - q)/(1 - p)^2 > 0\\), donc \\(L\\) est strictement convexe et \\(p = q\\) est son unique minimum.\n\nÉtape 3 : \\(L(0{,}2) = -(0{,}2 \\ln 0{,}2 + 0{,}8 \\ln 0{,}8) \\approx 0{,}500\\) : c'est l'entropie de la loi de Bernoulli de paramètre 0,2.\n\nLecture : c'est le niveau de référence. Un modèle dont la log-loss de test dépasse 0,500 fait moins bien que la simple fréquence de base ; la comparer à \\(\\ln 2\\) serait trop indulgent quand les classes sont déséquilibrées. Contrôle (script) : minimisation sur une grille, minimum en 0,2.", "type": "qcm", "multiple": false, "reponse": "0,500", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["F01_d_brier", "F01_d_demi", "F01_d_negatifs", "F01_exact"]}}, {"id": "EB2-F02", "section": "mlf", "theme": "R² hors échantillon", "difficulte": 2, "temps_cible_s": 60, "enonce": "Un modèle prédit la valeur constante 4 pour toutes les observations (c'est la moyenne de la cible sur l'échantillon d'apprentissage). Sur un échantillon de test, les cibles valent 1, 2, 3, 4, 5. On définit le \\(R^2\\) de test par \\(1 - \\mathrm{SCR}/\\mathrm{SCT}\\), où \\(\\mathrm{SCR} = \\sum_i (y_i - \\hat y_i)^2\\) est la somme des carrés des erreurs de prédiction sur le test et \\(\\mathrm{SCT} = \\sum_i (y_i - \\bar y)^2\\), \\(\\bar y\\) étant la moyenne des cibles de test.\n\nQue vaut ce \\(R^2\\) de test ?", "options": [{"id": "a", "texte": "-0,5", "correcte": true, "explication": "Oui : \\(1 - 15/10\\)."}, {"id": "b", "texte": "0", "correcte": false, "explication": "Un prédicteur constant n'a un \\(R^2\\) nul que si sa constante est la moyenne **du test**. Ici la constante, 4, vient de l'apprentissage et diffère de la moyenne de test, 3."}, {"id": "c", "texte": "0,5", "correcte": false, "explication": "Le signe est perdu. Un \\(R^2\\) de test n'est pas un carré : il peut être négatif, ce qui arrive dès que le modèle fait pire que la moyenne du test."}, {"id": "d", "texte": "-1,5", "correcte": false, "explication": "C'est \\(-\\mathrm{SCR}/\\mathrm{SCT}\\) : le 1 de la définition a été oublié."}], "solution": "Réponse : \\(R^2 = 1 - 15/10 = -0{,}5\\).\n\nÉtape 1 : \\(\\mathrm{SCR} = (1 - 4)^2 + (2 - 4)^2 + (3 - 4)^2 + 0 + (5 - 4)^2 = 15\\).\n\nÉtape 2 : la moyenne de test vaut 3, \\(\\mathrm{SCT} = 4 + 1 + 0 + 1 + 4 = 10\\).\n\nÉtape 3 : \\(R^2 = 1 - 15/10 = -0{,}5\\).\n\nLecture : sur l'échantillon d'apprentissage, avec constante, le \\(R^2\\) des moindres carrés est compris entre 0 et 1, parce que la moyenne d'apprentissage fait partie des modèles possibles. Hors échantillon, rien ne le garantit : un \\(R^2\\) négatif signifie que le modèle prédit moins bien que la moyenne du test. En prévision de rendements, où le signal est faible, une petite erreur sur le niveau moyen suffit à rendre le \\(R^2\\) de test négatif ; il faut donc préciser la référence utilisée (moyenne du test, moyenne d'apprentissage ou zéro).", "type": "qcm", "multiple": false, "reponse": "-0,5", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["F02_d_sans_un", "F02_d_signe", "F02_d_zero", "F02_exact", "F02_scr", "F02_sct"]}}, {"id": "EB2-F03", "section": "mlf", "theme": "Seuil de décision, coûts asymétriques", "difficulte": 3, "temps_cible_s": 90, "enonce": "Un classifieur fournit, pour chaque transaction, une probabilité \\(p\\) d'être frauduleuse, supposée bien calibrée : parmi les transactions de probabilité \\(p\\), une proportion \\(p\\) est frauduleuse. Laisser passer une fraude (faux négatif) coûte 9 ; bloquer une transaction honnête (faux positif) coûte 1 ; une bonne décision ne coûte rien. On bloque une transaction si et seulement si \\(p > s\\).\n\nQuel seuil \\(s\\) minimise l'espérance du coût de chaque décision ?", "options": [{"id": "a", "texte": "0,10", "correcte": true, "explication": "Oui : bloquer coûte en moyenne \\(1 - p\\), laisser passer \\(9p\\) ; on bloque quand \\(1 - p < 9p\\)."}, {"id": "b", "texte": "0,50", "correcte": false, "explication": "C'est le seuil qui minimise le nombre d'erreurs quand les deux erreurs coûtent autant. Ici un faux négatif coûte 9 fois plus : on bloque dès une probabilité bien plus faible."}, {"id": "c", "texte": "0,90", "correcte": false, "explication": "Les coûts ont été inversés : avec ce seuil, on ne bloquerait que les transactions presque sûrement frauduleuses, ce qui convient si c'est le faux positif qui coûte cher."}, {"id": "d", "texte": "1/9 ≈ 0,111", "correcte": false, "explication": "C'est le rapport des coûts, 1/9. La condition \\(1 - p < 9p\\) donne \\(p > 1/(1 + 9)\\) : le seuil est \\(c_{\\mathrm{FP}}/(c_{\\mathrm{FP}} + c_{\\mathrm{FN}})\\), pas \\(c_{\\mathrm{FP}}/c_{\\mathrm{FN}}\\)."}], "solution": "Réponse : \\(s = 1/(1 + 9) = 0{,}1\\).\n\nNotations : \\(c_{\\mathrm{FN}} = 9\\) et \\(c_{\\mathrm{FP}} = 1\\) sont les coûts d'un faux négatif et d'un faux positif.\n\nÉtape 1 : pour une transaction de probabilité \\(p\\), bloquer coûte \\(c_{\\mathrm{FP}}\\) si elle est honnête, ce qui arrive avec probabilité \\(1 - p\\) (calibration) : coût moyen \\((1 - p)\\,c_{\\mathrm{FP}}\\). Laisser passer coûte \\(c_{\\mathrm{FN}}\\) si elle est frauduleuse : coût moyen \\(p\\,c_{\\mathrm{FN}}\\).\n\nÉtape 2 : bloquer est préférable si et seulement si \\((1 - p)\\,c_{\\mathrm{FP}} < p\\,c_{\\mathrm{FN}}\\), c'est-à-dire \\(p > c_{\\mathrm{FP}}/(c_{\\mathrm{FP}} + c_{\\mathrm{FN}}) = 1/10\\). La règle « bloquer si \\(p > 0{,}1\\) » prend la meilleure décision pour chaque transaction, donc minimise le coût moyen.\n\nCondition de validité : le raisonnement utilise la calibration. Avec des scores non calibrés, le seuil 0,1 n'a pas ce sens ; on le choisit alors sur un échantillon de validation. Expérience (script) : probabilités uniformes et étiquettes tirées selon elles ; le coût moyen simulé est minimal au seuil 0,10 et vaut 0,450 contre 1,253 au seuil 0,5.", "type": "qcm", "multiple": false, "reponse": "0,10", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["F03_d_defaut", "F03_d_inverse", "F03_d_rapport", "F03_d_rapport_den", "F03_d_rapport_num", "F03_exact", "F03_exp_cout_01", "F03_exp_cout_05", "F03_exp_meilleur_seuil"]}}, {"id": "EB2-F04", "section": "mlf", "theme": "Malédiction de la dimension, voisinages", "difficulte": 2, "temps_cible_s": 75, "enonce": "Des points sont tirés indépendamment et uniformément dans le cube \\([0, 1]^{10}\\). Autour d'un point, on prend comme voisinage un sous-cube de côté \\(e\\), à faces parallèles aux axes, entièrement contenu dans \\([0, 1]^{10}\\).\n\nQuelle valeur de \\(e\\) donne un voisinage qui contient en moyenne 1 % des points, arrondie à trois décimales ?", "options": [{"id": "a", "texte": "0,631", "correcte": true, "explication": "Oui : \\(e^{10} = 0{,}01\\), soit \\(e = 0{,}01^{1/10}\\)."}, {"id": "b", "texte": "0,010", "correcte": false, "explication": "C'est la fraction de points voulue, prise pour une longueur de côté. En dimension 10, un sous-cube de côté 0,01 a pour volume \\(0{,}01^{10}\\) : il ne contient pratiquement aucun point."}, {"id": "c", "texte": "0,001", "correcte": false, "explication": "C'est \\(0{,}01/10\\) : la dimension a divisé la fraction au lieu d'en prendre la racine dixième. Le volume d'un cube est le produit de ses côtés, \\(e^{10}\\)."}, {"id": "d", "texte": "0,100", "correcte": false, "explication": "C'est \\(0{,}01^{1/2}\\), la bonne réponse en dimension 2. En dimension 10, il faut la racine dixième."}], "solution": "Réponse : \\(e = 0{,}01^{1/10} \\approx 0{,}631\\).\n\nÉtape 1 : pour un point uniforme dans \\([0, 1]^{10}\\), la probabilité de tomber dans une partie du cube est son volume. Un sous-cube de côté \\(e\\) a pour volume \\(e^{10}\\), produit des longueurs de ses côtés.\n\nÉtape 2 : la proportion moyenne de points dans le voisinage est cette probabilité (linéarité de l'espérance appliquée aux indicatrices « le point \\(i\\) est dans le voisinage »). On veut \\(e^{10} = 0{,}01\\), soit \\(e = 0{,}01^{1/10} = 10^{-0{,}2} \\approx 0{,}631\\).\n\nLecture : pour capturer 1 % des données, le voisinage doit couvrir une proportion 0,63 de l'étendue de chaque variable ; il n'a plus rien de local, et la prédiction des k plus proches voisins mélange des points éloignés. En dimension 100, il faudrait un côté de 0,955. C'est la malédiction de la dimension. Simulation (script) : une proportion 0,0101 des points tirés tombe dans un tel cube.", "type": "qcm", "multiple": false, "reponse": "0,631", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["F04_arete_d100", "F04_d_dim2", "F04_d_div", "F04_d_fraction", "F04_exact", "F04_mc"]}}, {"id": "EB2-F05", "section": "mlf", "theme": "Validation croisée un-contre-tous, levier", "difficulte": 4, "temps_cible_s": 105, "enonce": "On ajuste par moindres carrés ordinaires, avec constante, une régression \\(y \\approx b_0 + b_1 x\\) sur 5 observations dont les valeurs de \\(x\\) sont 0, 1, 2, 3 et 9. Le résidu d'ajustement de la cinquième observation (\\(x = 9\\)), c'est-à-dire \\(y_5 - \\hat y_5\\), vaut 0,4.\n\nOn réajuste le même modèle sans la cinquième observation, et l'on note \\(\\tilde y_5\\) sa prédiction en \\(x = 9\\). Que vaut le résidu de validation croisée un-contre-tous \\(y_5 - \\tilde y_5\\) ?", "options": [{"id": "a", "texte": "5", "correcte": true, "explication": "Oui : \\(0{,}4/(1 - h_{55})\\) avec un levier \\(h_{55} = 23/25\\)."}, {"id": "b", "texte": "0,4", "correcte": false, "explication": "C'est le résidu d'ajustement. Retirer l'observation change la droite : sans elle, rien ne tire la droite vers \\(y_5\\), et l'erreur de prédiction est bien plus grande."}, {"id": "c", "texte": "1,43", "correcte": false, "explication": "Le levier a été calculé sans le terme \\(1/n\\) dû à la constante : \\(h_{55} = 1/n + (x_5 - \\bar x)^2/\\sum_j (x_j - \\bar x)^2\\)."}, {"id": "d", "texte": "0,5", "correcte": false, "explication": "Le levier a été pris égal à \\(1/n\\), sa valeur pour une observation située à la moyenne des \\(x\\). Le point \\(x = 9\\) est loin de la moyenne 3 : son levier est proche de 1."}], "solution": "Réponse : \\(0{,}4/(1 - 23/25) = 5\\).\n\nNotations : \\(\\mathbf{H}\\) est la matrice de projection (matrice chapeau) des moindres carrés, \\(\\hat{\\mathbf{y}} = \\mathbf{H}\\mathbf{y}\\), et \\(h_{ii}\\) son \\(i\\)-ème coefficient diagonal, le levier de l'observation \\(i\\) ; \\(e_i = y_i - \\hat y_i\\).\n\nÉtape 1, formule du résidu un-contre-tous : \\(y_i - \\tilde y_i = e_i/(1 - h_{ii})\\). Preuve. Soit \\(\\tilde{\\mathbf{b}}\\) l'estimateur obtenu sans l'observation \\(i\\), et \\(\\mathbf{z}\\) le vecteur égal à \\(\\mathbf{y}\\) sauf \\(z_i = \\tilde y_i\\). Pour tout \\(\\mathbf{b}\\), la somme des carrés des résidus sur \\(\\mathbf{z}\\) est la somme sur les observations \\(j \\ne i\\) plus \\((\\tilde y_i - \\mathbf{x}_i^\\top \\mathbf{b})^2 \\ge 0\\) ; en \\(\\mathbf{b} = \\tilde{\\mathbf{b}}\\), le premier morceau est minimal et le second nul. Donc \\(\\tilde{\\mathbf{b}}\\) est l'estimateur des moindres carrés pour \\(\\mathbf{z}\\), et \\(\\tilde y_i = (\\mathbf{H}\\mathbf{z})_i = \\hat y_i - h_{ii}\\,(y_i - \\tilde y_i)\\), car \\(\\mathbf{z} = \\mathbf{y} - (y_i - \\tilde y_i)\\,\\mathbf{e}_i\\). En réarrangeant : \\((1 - h_{ii})(y_i - \\tilde y_i) = y_i - \\hat y_i\\).\n\nÉtape 2, levier en régression simple avec constante : \\(h_{ii} = 1/n + (x_i - \\bar x)^2/\\sum_j (x_j - \\bar x)^2\\). Preuve : \\(\\mathbf{H}\\) projette sur l'espace engendré par \\(\\mathbf{1}\\) et \\(\\mathbf{x}\\), qui est aussi engendré par les vecteurs orthogonaux \\(\\mathbf{1}\\) et \\(\\mathbf{x} - \\bar x\\,\\mathbf{1}\\) ; la projection sur une base orthogonale est la somme des projections sur chaque vecteur, d'où les deux termes.\n\nÉtape 3 : \\(\\bar x = 3\\), \\(\\sum_j (x_j - \\bar x)^2 = 9 + 4 + 1 + 0 + 36 = 50\\), donc \\(h_{55} = 1/5 + 36/50 = 23/25\\) et \\(y_5 - \\tilde y_5 = 0{,}4/(1 - 0{,}92) = 5\\).\n\nLecture : un point à fort levier attire la droite à lui ; son petit résidu d'ajustement cache une grande erreur de prédiction. La formule donne toute la validation croisée un-contre-tous d'une régression linéaire en un seul ajustement. Contrôles (script) : réajustement explicite sans l'observation, et formule vérifiée sur des données aléatoires pour chaque observation.", "type": "qcm", "multiple": false, "reponse": "5", "fiche": null, "verif": {"script": "verif/examen_blanc_2.py", "cles": ["F05_d_1n", "F05_d_residu", "F05_d_sans_1n", "F05_exact", "F05_h", "F05_h_den", "F05_h_num", "F05_moy_x", "F05_sxx"]}}]}, {"id": "mla", "nom": "Machine Learning avancé", "budget_min": 16, "questions": [{"id": "EB2-A01", "section": "mla", "theme": "Boosting de gradient, perte absolue", "difficulte": 4, "temps_cible_s": 120, "enonce": "Boosting de gradient avec la perte absolue \\(\\ell(y, f) = \\lvert y - f \\rvert\\), où \\(y\\) est la cible et \\(f\\) la prédiction. Une feuille du nouvel arbre contient 5 observations dont les résidus courants \\(r_i = y_i - \\hat y_i\\) (cible moin
