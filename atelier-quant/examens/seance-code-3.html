en les modifiant.\npd.to_numeric(pd.Series([\"12\", \"1 200\", \"3,5\", \"douze\", None]), errors=\"coerce\")", "train.dtypes"], "verif": {"script": "verif/seance_code_3.py"}}]}, {"id": "code", "nom": "Coding, data science", "budget_min": 45, "questions": [{"id": "S3-E1", "type": "code", "section": "code", "theme": "pandas : nettoyer des colonnes sales", "difficulte": 2, "temps_cible_s": 720, "enonce": "## Exercice 1 : nettoyer un cadre sale\n\nDéfinis `nettoyer(df)`.\n\n**Entrée.** `df` est un DataFrame qui contient au moins les colonnes `age`, `revenu`, `appels`, `anciennete_mois` et `forfait`, et éventuellement d'autres colonnes (par exemple `id` ou `resilie`). Son index est quelconque, sans doublon ; il peut n'avoir aucune ligne. Dans ces cinq colonnes, chaque valeur est une chaîne, un nombre, ou manquante (`NaN`). Attention : une colonne dont toutes les valeurs sont des nombres ou sont manquantes n'est pas une colonne de chaînes pour pandas.\n\n**Sortie.** Un **nouveau** DataFrame, de même index et de mêmes colonnes dans le même ordre ; `df` n'est pas modifié ; les colonnes autres que les cinq citées sont recopiées telles quelles. Les colonnes `age`, `revenu`, `appels` et `anciennete_mois` sont des colonnes de flottants. Règles, valeur par valeur :\n\n| Colonne | Si la valeur est une chaîne | Si la valeur est un nombre |\n|---|---|---|\n| `age` | on retire les espaces de début et de fin ; s'il reste un nombre écrit en chiffres, éventuellement suivi d'un espace et de `ans`, la valeur est ce nombre ; sinon `NaN` | conservé |\n| `revenu` | on retire tous les espaces et le symbole `€`, on remplace la virgule par un point ; s'il reste un nombre écrit en chiffres, la valeur est ce nombre ; sinon `NaN` | conservé |\n| `appels` | on retire les espaces de début et de fin ; `zéro`, `un`, `deux`, `trois`, `quatre`, `cinq` valent 0, 1, 2, 3, 4, 5 ; un nombre écrit en chiffres vaut ce nombre ; sinon `NaN` | conservé |\n| `anciennete_mois` | (jamais une chaîne) | `NaN` s'il est strictement négatif, conservé sinon |\n| `forfait` | espaces de début et de fin retirés, puis mise en minuscules | (jamais un nombre) |\n\nDans les cinq colonnes, une valeur manquante reste manquante. « Un nombre écrit en chiffres » désigne une suite de chiffres, éventuellement suivie d'un point et d'une autre suite de chiffres (`1980`, `3100.50`) ; les tests ne contiennent aucune autre écriture de nombre (ni signe, ni exposant).\n\n**Exemple.**\n\n| index | id | age | revenu | appels | anciennete_mois | forfait |\n|---|---|---|---|---|---|---|\n| 0 | 11 | `34 ans` | `2 450 €` | `trois` | 12.0 | ` Premium ` |\n| 1 | 12 | `inconnu` | `1980` | `0` | -1.0 | `base` |\n| 2 | 13 | ` 51` | NaN | `cinq` | NaN | `PLUS` |\n| 3 | 14 | `27` | `3 100,50` | `2` | 40.0 | `plus` |\n\nSortie :\n\n| index | id | age | revenu | appels | anciennete_mois | forfait |\n|---|---|---|---|---|---|---|\n| 0 | 11 | 34.0 | 2450.0 | 3.0 | 12.0 | `premium` |\n| 1 | 12 | NaN | 1980.0 | 0.0 | NaN | `base` |\n| 2 | 13 | 51.0 | NaN | 5.0 | NaN | `plus` |\n| 3 | 14 | 27.0 | 3100.5 | 2.0 | 40.0 | `plus` |\n\nLa sortie contient 4 valeurs numériques manquantes : l'âge `inconnu`, l'ancienneté négative, et les deux valeurs déjà manquantes.\n\n**Ce que vise l'exercice.** Les gestes de la partie 3 de la leçon : `str.replace`, `str.extract` avec un motif ancré, `map` par dictionnaire, `pd.to_numeric(errors=\"coerce\")`, `where`. Les tests cachés contiennent un cadre vide, des textes illisibles, des colonnes entièrement manquantes, et des colonnes sales qui se trouvent être déjà numériques (leçon, partie 3, cas limites).\n\n\n**Fonctionnement.** Notebook sous Python 3.9, pandas 1.4.2 et scikit-learn 1.1.1. Tolérance de comparaison des nombres : `1e-9` ; limite de temps : 20 secondes par test. **Tests visibles** exécute 2 tests visibles ; **Soumettre** exécute 9 tests cachés et n'affiche que leur résultat.\n", "dossier": "coding/seance3", "module_tests": "coding/seance3/tests_e1.py", "fonction": "nettoyer", "cellules_initiales": ["import numpy as np\nimport pandas as pd\n\nexemple = pd.DataFrame(\n    [(11, \"34 ans\", \"2 450 €\", \"trois\", 12.0, \" Premium \"), (12, \"inconnu\", \"1980\", \"0\", -1.0, \"base\"),\n     (13, \" 51\", np.nan, \"cinq\", np.nan, \"PLUS\"), (14, \"27\", \"3 100,50\", \"2\", 40.0, \"plus\")],\n    columns=[\"id\", \"age\", \"revenu\", \"appels\", \"anciennete_mois\", \"forfait\"])\nexemple", "def nettoyer(df: pd.DataFrame) -> pd.DataFrame:\n    d = df.copy()\n    # À compléter\n    return d", "nettoyer(exemple)", "# Fichier d'exploration : les abonnés de la leçon.\nnettoyer(pd.read_csv(\"abonnes_train.csv\")).head()"], "tests_visibles": 2, "tests_caches": 9, "fichier_correction": "coding/seance3/_correction.py", "intro_correction": "Correction commentée des trois exercices : les exercices 1 et 2 en version pandas et en version sans bibliothèque externe, l'exercice 3 avec scikit-learn seulement", "verif": {"script": "coding/seance3/tests_e1.py"}, "fiche": null, "solution": "Correction commentée des trois exercices : les exercices 1 et 2 en version pandas et en version sans bibliothèque externe, l'exercice 3 avec scikit-learn seulement (`coding/seance3/_correction.py`) :\n\n```python\n\"\"\"Corrections de la séance de code 3. À n'ouvrir qu'après avoir tenté les exercices.\n\nExercices 1 et 2 : deux versions indépendantes, pandas et sans bibliothèque externe ; les tests exigent qu'elles\nsoient d'accord. Exercice 3 : une seule version, avec scikit-learn (entraîner un classifieur n'a pas d'équivalent\nraisonnable sans bibliothèque dans le temps d'une épreuve).\n\"\"\"\nimport math\nimport re\n\nimport numpy as np\nimport pandas as pd\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\n\nMOTS = {\"zéro\": 0.0, \"un\": 1.0, \"deux\": 2.0, \"trois\": 3.0, \"quatre\": 4.0, \"cinq\": 5.0}\n\n\n# ------------------------------------------------------------------ exercice 1\ndef nettoyer(df: pd.DataFrame) -> pd.DataFrame:\n    d = df.copy()                                    # ne jamais modifier le cadre reçu\n    # astype(str) d'abord : si une colonne a été lue comme numérique (aucune saleté, ou tout manquant), l'accesseur\n    # .str n'existe pas et lèverait AttributeError. Une valeur manquante devient le texte \"nan\", qui ne correspond\n    # à aucun motif ci-dessous et redevient donc NaN.\n    # age : un nombre, éventuellement suivi de \" ans\". Le motif est ancré (^ au début, \\Z à la fin) : \"inconnu\" ne donne aucun groupe.\n    age = d[\"age\"].astype(str).str.strip().str.extract(r\"^(\\d+(?:\\.\\d+)?)(?: ans)?\\Z\")[0]\n    d[\"age\"] = pd.to_numeric(age, errors=\"coerce\").astype(float)\n    # revenu : retirer espaces et symbole, virgule décimale -> point ; ce qui reste illisible devient NaN (coerce).\n    revenu = (d[\"revenu\"].astype(str).str.replace(\" \", \"\", regex=False).str.replace(\"€\", \"\", regex=False)\n              .str.replace(\",\", \".\", regex=False))\n    d[\"revenu\"] = pd.to_numeric(revenu, errors=\"coerce\").astype(float)\n    # appels : les mots par dictionnaire, le reste par conversion numérique.\n    appels = d[\"appels\"].astype(str).str.strip()\n    d[\"appels\"] = appels.map(MOTS).fillna(pd.to_numeric(appels, errors=\"coerce\")).astype(float)\n    # anciennete_mois : valeur impossible (strictement négative) -> manquante. where garde là où la condition est vraie.\n    anciennete = pd.to_numeric(d[\"anciennete_mois\"], errors=\"coerce\").astype(float)\n    d[\"anciennete_mois\"] = anciennete.where(anciennete >= 0)\n    # forfait : mêmes modalités écrites différemment ; les valeurs manquantes restent manquantes.\n    d[\"forfait\"] = d[\"forfait\"].where(d[\"forfait\"].isna(), d[\"forfait\"].astype(str).str.strip().str.lower())\n    return d\n\n\ndef _manquant(v):\n    return v is None or (isinstance(v, float) and math.isnan(v))\n\n\ndef _nombre(texte):\n    try:\n        return float(texte)\n    except (TypeError, ValueError):\n        return math.nan\n\n\ndef nettoyer_pur(lignes):\n    \"\"\"lignes : liste de dictionnaires (une ligne chacun). Rend une nouvelle liste de dictionnaires nettoyés.\"\"\"\n    sortie = []\n    for ligne in lignes:\n        r = dict(ligne)\n        v = ligne[\"age\"]\n        if isinstance(v, str):\n            t = v.strip()\n            t = t[:-4] if t.endswith(\" ans\") else t\n            r[\"age\"] = float(t) if re.fullmatch(r\"\\d+(?:\\.\\d+)?\", t) else math.nan\n        else:\n            r[\"age\"] = math.nan if _manquant(v) else float(v)\n        v = ligne[\"revenu\"]\n        if isinstance(v, str):\n            r[\"revenu\"] = _nombre(v.replace(\" \", \"\").replace(\"€\", \"\").replace(\",\", \".\"))\n        else:\n            r[\"revenu\"] = math.nan if _manquant(v) else float(v)\n        v = ligne[\"appels\"]\n        if isinstance(v, str):\n            t = v.strip()\n            r[\"appels\"] = MOTS[t] if t in MOTS else _nombre(t)\n        else:\n            r[\"appels\"] = math.nan if _manquant(v) else float(v)\n        v = ligne[\"anciennete_mois\"]\n        r[\"anciennete_mois\"] = math.nan if _manquant(v) or float(v) < 0 else float(v)\n        v = ligne[\"forfait\"]\n        r[\"forfait\"] = math.nan if _manquant(v) else str(v).strip().lower()\n        sortie.append(r)\n    return sortie\n\n\n# ------------------------------------------------------------------ exercice 2\ndef aligner(train: pd.DataFrame, test: pd.DataFrame, colonnes):\n    # get_dummies crée une colonne par modalité PRÉSENTE dans le cadre qu'on lui donne : les deux cadres n'ont donc\n    # pas les mêmes colonnes dès qu'une modalité manque d'un côté. La référence est l'apprentissage.\n    x_train = pd.get_dummies(train, columns=colonnes, dtype=float)\n    # reindex(columns=...) fait les trois corrections d'un coup : il retire les colonnes des modalités inconnues,\n    # ajoute à 0 celles des modalités absentes du test, et remet les colonnes dans l'ordre de l'apprentissage.\n    x_test = pd.get_dummies(test, columns=colonnes, dtype=float).reindex(columns=x_train.columns, fill_value=0.0)\n    return x_train, x_test\n\n\ndef aligner_pur(train, test, colonnes):\n    \"\"\"train, test : listes de dictionnaires dont les clés sont dans l'ordre des colonnes. Rend deux listes de dictionnaires.\"\"\"\n    autres = [c for c in (train[0] if train else {}) if c not in colonnes]\n    modalites = {c: sorted({l[c] for l in train if not _manquant(l[c])}) for c in colonnes}\n\n    def encoder(lignes):\n        sortie = []\n        for l in lignes:\n            r = {c: l[c] for c in autres}\n            for c in colonnes:\n                for v in modalites[c]:\n                    r[f\"{c}_{v}\"] = 1.0 if (not _manquant(l[c]) and l[c] == v) else 0.0\n            sortie.append(r)\n        return sortie\n\n    return encoder(train), encoder(test)\n\n\n# ------------------------------------------------------------------ exercice 3\nNUMERIQUES = [\"age\", \"revenu\", \"appels\", \"anciennete_mois\"]\nCATEGORIELLES = [\"forfait\"]\n\n\ndef predire(train: pd.DataFrame, test: pd.DataFrame):\n    # 1. Le même nettoyage pour les deux cadres (exercice 1). Aucune ligne de test n'est retirée.\n    a, b = nettoyer(train), nettoyer(test)\n    # 2. Tout ce qui s'apprend (médianes, moyennes, écarts-types, modalités) est dans la chaîne, donc appris par fit\n    #    sur l'apprentissage seul, puis appliqué tel quel au test.\n    preparation = ColumnTransformer([\n        (\"num\", Pipeline([(\"imputer\", SimpleImputer(strategy=\"median\")), (\"echelle\", StandardScaler())]), NUMERIQUES),\n        (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), CATEGORIELLES),   # modalité inconnue au test : ligne de zéros\n    ])\n    modele = Pipeline([(\"preparation\", preparation), (\"modele\", LogisticRegression(max_iter=1000))])\n    # 3. Les lignes d'apprentissage incomplètes sont gardées : l'imputation par la médiane les rend utilisables.\n    modele.fit(a[NUMERIQUES + CATEGORIELLES], a[\"resilie\"])\n    return modele.predict(b[NUMERIQUES + CATEGORIELLES]).astype(int)\n\n\ndef predire_baclee(train: pd.DataFrame, test: pd.DataFrame):\n    \"\"\"Ce qu'il ne faut pas faire, pour mesurer ce que coûte l'absence de nettoyage : seule la colonne déjà\n    numérique est utilisée, les manquants sont mis à 0, la valeur impossible -1 est laissée.\"\"\"\n    modele = LogisticRegression(max_iter=1000).fit(train[[\"anciennete_mois\"]].fillna(0), train[\"resilie\"])\n    return modele.predict(test[[\"anciennete_mois\"]].fillna(0)).astype(int)\n```"}, {"id": "S3-E2", "type": "code", "section": "code", "theme": "pandas : aligner les colonnes encodées de l'apprentissage et du test", "difficulte": 3, "temps_cible_s": 480, "enonce": "## Exercice 2 : aligner l'encodage un-parmi-n\n\nDéfinis `aligner(train, test, colonnes)`, qui renvoie un couple `(x_train, x_test)`.\n\n**Entrées.** `train` et `test` sont deux DataFrame qui ont les mêmes colonnes, dans le même ordre. `train` a au moins une ligne ; `test` peut n'en avoir aucune. Leurs index sont quelconques, sans doublon. `colonnes` est une liste non vide de noms de colonnes **catégorielles** : leurs valeurs sont des chaînes ou des entiers, ou sont manquantes (`NaN`). Toutes les autres colonnes sont numériques.\n\n**Sortie.** Deux DataFrame, `x_train` de même index que `train` et `x_test` de même index que `test`, qui ont **exactement les mêmes colonnes, dans le même ordre** :\n\n1. d'abord les colonnes non catégorielles, dans leur ordre d'origine, inchangées ;\n2. puis, pour chaque colonne `c` de `colonnes`, dans l'ordre de la liste : une colonne nommée `c_v` pour chaque valeur `v` non manquante que prend `c` **dans `train`**, ces valeurs étant rangées par ordre croissant (alphabétique pour des chaînes, numérique pour des entiers). Le nom est formé de `c`, d'un tiret bas et de l'écriture de `v` : `forfait_plus`, `ligne_2`.\n\nLa colonne `c_v` est une colonne de flottants : 1.0 sur les lignes où `c` vaut `v`, 0.0 sur toutes les autres. En conséquence : une valeur du test que `train` ne contient pas ne crée aucune colonne, et sa ligne a 0.0 dans toutes les colonnes de `c` ; une valeur de `train` absente du test donne dans `x_test` une colonne de 0.0 ; une valeur manquante a 0.0 dans toutes les colonnes de `c`. Ni `train` ni `test` ne sont modifiés.\n\n**Exemple**, avec `colonnes = [\"forfait\"]`.\n\n`train` :\n\n| index | revenu | forfait |\n|---|---|---|\n| 0 | 2450.0 | plus |\n| 1 | 1980.0 | base |\n| 2 | 3100.0 | plus |\n| 3 | 2700.0 | premium |\n\n`test` :\n\n| index | revenu | forfait |\n|---|---|---|\n| 0 | 2000.0 | base |\n| 1 | 2600.0 | pro |\n| 2 | 3300.0 | base |\n\n`x_train` :\n\n| index | revenu | forfait_base | forfait_plus | forfait_premium |\n|---|---|---|---|---|\n| 0 | 2450.0 | 0.0 | 1.0 | 0.0 |\n| 1 | 1980.0 | 1.0 | 0.0 | 0.0 |\n| 2 | 3100.0 | 0.0 | 1.0 | 0.0 |\n| 3 | 2700.0 | 0.0 | 0.0 | 1.0 |\n\n`x_test` :\n\n| index | revenu | forfait_base | forfait_plus | forfait_premium |\n|---|---|---|---|---|\n| 0 | 2000.0 | 1.0 | 0.0 | 0.0 |\n| 1 | 2600.0 | 0.0 | 0.0 | 0.0 |\n| 2 | 3300.0 | 1.0 | 0.0 | 0.0 |\n\nLes deux cadres ont 4 colonnes. Un `pd.get_dummies(test, columns=[\"forfait\"])` seul n'en aurait que 3 : `revenu`, `forfait_base` et `forfait_pro`, inutilisables par un modèle ajusté sur `x_train`.\n\n**Ce que vise l'exercice.** Le piège de `get_dummies` (leçon, partie 5) et sa réparation : l'apprentissage fixe les colonnes, le test s'y conforme. Trois lignes suffisent.\n\n\n**Fonctionnement.** Notebook sous Python 3.9, pandas 1.4.2 et scikit-learn 1.1.1. Tolérance de comparaison des nombres : `1e-9` ; limite de temps : 20 secondes par test. **Tests visibles** exécute 2 tests visibles ; **Soumettre** exécute 8 tests cachés et n'affiche que leur résultat.\n", "dossier": "coding/seance3", "module_tests": "coding/seance3/tests_e2.py", "fonction": "aligner", "cellules_initiales": ["import numpy as np\nimport pandas as pd\n\ntrain = pd.DataFrame({\"revenu\": [2450.0, 1980.0, 3100.0, 2700.0], \"forfait\": [\"plus\", \"base\", \"plus\", \"premium\"]})\ntest = pd.DataFrame({\"revenu\": [2000.0, 2600.0, 3300.0], \"forfait\": [\"base\", \"pro\", \"base\"]})\npd.get_dummies(train, columns=[\"forfait\"]), pd.get_dummies(test, columns=[\"forfait\"])", "def aligner(train: pd.DataFrame, test: pd.DataFrame, colonnes):\n    # À compléter : renvoyer (x_train, x_test)\n    return train, test", "aligner(train, test, [\"forfait\"])"], "tests_visibles": 2, "tests_caches": 8, "fichier_correction": "coding/seance3/_correction.py", "intro_correction": "Correction commentée des trois exercices : les exercices 1 et 2 en version pandas et en version sans bibliothèque externe, l'exercice 3 avec scikit-learn seulement", "verif": {"script": "coding/seance3/tests_e2.py"}, "fiche": null, "solution": "Correction commentée des trois exercices : les exercices 1 et 2 en version pandas et en version sans bibliothèque externe, l'exercice 3 avec scikit-learn seulement (`coding/seance3/_correction.py`) :\n\n```python\n\"\"\"Corrections de la séance de code 3. À n'ouvrir qu'après avoir tenté les exercices.\n\nExercices 1 et 2 : deux versions indépendantes, pandas et sans bibliothèque externe ; les tests exigent qu'elles\nsoient d'accord. Exercice 3 : une seule version, avec scikit-learn (entraîner un classifieur n'a pas d'équivalent\nraisonnable sans bibliothèque dans le temps d'une épreuve).\n\"\"\"\nimport math\nimport re\n\nimport numpy as np\nimport pandas as pd\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\n\nMOTS = {\"zéro\": 0.0, \"un\": 1.0, \"deux\": 2.0, \"trois\": 3.0, \"quatre\": 4.0, \"cinq\": 5.0}\n\n\n# ------------------------------------------------------------------ exercice 1\ndef nettoyer(df: pd.DataFrame) -> pd.DataFrame:\n    d = df.copy()                                    # ne jamais modifier le cadre reçu\n    # astype(str) d'abord : si une colonne a été lue comme numérique (aucune saleté, ou tout manquant), l'accesseur\n    # .str n'existe pas et lèverait AttributeError. Une valeur manquante devient le texte \"nan\", qui ne correspond\n    # à aucun motif ci-dessous et redevient donc NaN.\n    # age : un nombre, éventuellement suivi de \" ans\". Le motif est ancré (^ au début, \\Z à la fin) : \"inconnu\" ne donne aucun groupe.\n    age = d[\"age\"].astype(str).str.strip().str.extract(r\"^(\\d+(?:\\.\\d+)?)(?: ans)?\\Z\")[0]\n    d[\"age\"] = pd.to_numeric(age, errors=\"coerce\").astype(float)\n    # revenu : retirer espaces et symbole, virgule décimale -> point ; ce qui reste illisible devient NaN (coerce).\n    revenu = (d[\"revenu\"].astype(str).str.replace(\" \", \"\", regex=False).str.replace(\"€\", \"\", regex=False)\n              .str.replace(\",\", \".\", regex=False))\n    d[\"revenu\"] = pd.to_numeric(revenu, errors=\"coerce\").astype(float)\n    # appels : les mots par dictionnaire, le reste par conversion numérique.\n    appels = d[\"appels\"].astype(str).str.strip()\n    d[\"appels\"] = appels.map(MOTS).fillna(pd.to_numeric(appels, errors=\"coerce\")).astype(float)\n    # anciennete_mois : valeur impossible (strictement négative) -> manquante. where garde là où la condition est vraie.\n    anciennete = pd.to_numeric(d[\"anciennete_mois\"], errors=\"coerce\").astype(float)\n    d[\"anciennete_mois\"] = anciennete.where(anciennete >= 0)\n    # forfait : mêmes modalités écrites différemment ; les valeurs manquantes restent manquantes.\n    d[\"forfait\"] = d[\"forfait\"].where(d[\"forfait\"].isna(), d[\"forfait\"].astype(str).str.strip().str.lower())\n    return d\n\n\ndef _manquant(v):\n    return v is None or (isinstance(v, float) and math.isnan(v))\n\n\ndef _nombre(texte):\n    try:\n        return float(texte)\n    except (TypeError, ValueError):\n        return math.nan\n\n\ndef nettoyer_pur(lignes):\n    \"\"\"lignes : liste de dictionnaires (une ligne chacun). Rend une nouvelle liste de dictionnaires nettoyés.\"\"\"\n    sortie = []\n    for ligne in lignes:\n        r = dict(ligne)\n        v = ligne[\"age\"]\n        if isinstance(v, str):\n            t = v.strip()\n            t = t[:-4] if t.endswith(\" ans\") else t\n            r[\"age\"] = float(t) if re.fullmatch(r\"\\d+(?:\\.\\d+)?\", t) else math.nan\n        else:\n            r[\"age\"] = math.nan if _manquant(v) else float(v)\n        v = ligne[\"revenu\"]\n        if isinstance(v, str):\n            r[\"revenu\"] = _nombre(v.replace(\" \", \"\").replace(\"€\", \"\").replace(\",\", \".\"))\n        else:\n            r[\"revenu\"] = math.nan if _manquant(v) else float(v)\n        v = ligne[\"appels\"]\n        if isinstance(v, str):\n            t = v.strip()\n            r[\"appels\"] = MOTS[t] if t in MOTS else _nombre(t)\n        else:\n            r[\"appels\"] = math.nan if _manquant(v) else float(v)\n        v = ligne[\"anciennete_mois\"]\n        r[\"anciennete_mois\"] = math.nan if _manquant(v) or float(v) < 0 else float(v)\n        v = ligne[\"forfait\"]\n        r[\"forfait\"] = math.nan if _manquant(v) else str(v).strip().lower()\n        sortie.append(r)\n    return sortie\n\n\n# ------------------------------------------------------------------ exercice 2\ndef aligner(train: pd.DataFrame, test: pd.DataFrame, colonnes):\n    # get_dummies crée une colonne par modalité PRÉSENTE dans le cadre qu'on lui donne : les deux cadres n'ont donc\n    # pas les mêmes colonnes dès qu'une modalité manque d'un côté. La référence est l'apprentissage.\n    x_train = pd.get_dummies(train, columns=colonnes, dtype=float)\n    # reindex(columns=...) fait les trois corrections d'un coup : il retire les colonnes des modalités inconnues,\n    # ajoute à 0 celles des modalités absentes du test, et remet les colonnes dans l'ordre de l'apprentissage.\n    x_test = pd.get_dummies(test, columns=colonnes, dtype=float).reindex(columns=x_train.columns, fill_value=0.0)\n    return x_train, x_test\n\n\ndef aligner_pur(train, test, colonnes):\n    \"\"\"train, test : listes de dictionnaires dont les clés sont dans l'ordre des colonnes. Rend deux listes de dictionnaires.\"\"\"\n    autres = [c for c in (train[0] if train else {}) if c not in colonnes]\n    modalites = {c: sorted({l[c] for l in train if not _manquant(l[c])}) for c in colonnes}\n\n    def encoder(lignes):\n        sortie = []\n        for l in lignes:\n            r = {c: l[c] for c in autres}\n            for c in colonnes:\n                for v in modalites[c]:\n                    r[f\"{c}_{v}\"] = 1.0 if (not _manquant(l[c]) and l[c] == v) else 0.0\n            sortie.append(r)\n        return sortie\n\n    return encoder(train), encoder(test)\n\n\n# ------------------------------------------------------------------ exercice 3\nNUMERIQUES = [\"age\", \"revenu\", \"appels\", \"anciennete_mois\"]\nCATEGORIELLES = [\"forfait\"]\n\n\ndef predire(train: pd.DataFrame, test: pd.DataFrame):\n    # 1. Le même nettoyage pour les deux cadres (exercice 1). Aucune ligne de test n'est retirée.\n    a, b = nettoyer(train), nettoyer(test)\n    # 2. Tout ce qui s'apprend (médianes, moyennes, écarts-types, modalités) est dans la chaîne, donc appris par fit\n    #    sur l'apprentissage seul, puis appliqué tel quel au test.\n    preparation = ColumnTransformer([\n        (\"num\", Pipeline([(\"imputer\", SimpleImputer(strategy=\"median\")), (\"echelle\", StandardScaler())]), NUMERIQUES),\n        (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), CATEGORIELLES),   # modalité inconnue au test : ligne de zéros\n    ])\n    modele = Pipeline([(\"preparation\", preparation), (\"modele\", LogisticRegression(max_iter=1000))])\n    # 3. Les lignes d'apprentissage incomplètes sont gardées : l'imputation par la médiane les rend utilisables.\n    modele.fit(a[NUMERIQUES + CATEGORIELLES], a[\"resilie\"])\n    return modele.predict(b[NUMERIQUES + CATEGORIELLES]).astype(int)\n\n\ndef predire_baclee(train: pd.DataFrame, test: pd.DataFrame):\n    \"\"\"Ce qu'il ne faut pas faire, pour mesurer ce que coûte l'absence de nettoyage : seule la colonne déjà\n    numérique est utilisée, les manquants sont mis à 0, la valeur impossible -1 est laissée.\"\"\"\n    modele = LogisticRegression(max_iter=1000).fit(train[[\"anciennete_mois\"]].fillna(0), train[\"resilie\"])\n    return modele.predict(test[[\"anciennete_mois\"]].fillna(0)).astype(int)\n```"}, {"id": "S3-E3", "type": "code", "section": "code", "theme": "scikit-learn : nettoyer, encoder, entraîner, prédire", "difficulte": 4, "temps_cible_s": 1500, "enonce": "## Exercice 3 : de deux cadres sales à des prédictions\n\nDéfinis `predire(train, test)`.\n\n**Entrées.**\n\n- `train` : DataFrame aux colonnes `id`, `age`, `revenu`, `appels`, `anciennete_mois`, `forfait`, écrites comme dans l'exercice 1 (mêmes saletés, mêmes règles de lecture), et `resilie`, la cible, qui vaut 0 ou 1 et ne manque jamais.\n- `test` : les mêmes colonnes sans `resilie`, au moins une ligne, index quelconque.\n\nCe que les tests peuvent contenir : des valeurs manquantes, déclarées ou déguisées, dans `age`, `revenu` et `anciennete_mois`, **y compris dans `test`** ; dans `test`, un forfait `pro` absent de `train` ; une colonne `appels` entièrement en chiffres, donc lue comme une colonne d'entiers. `forfait` et `appels` ne manquent jamais. Les données sont synthétiques : `resilie` dépend des cinq variables, et l'identifiant ne porte aucune information.\n\n**Sortie.** Une suite de `len(test)` valeurs 0 ou 1 (liste, tableau numpy ou `Series`) : la prédiction de `resilie` pour chaque ligne de `test`, **dans l'ordre des lignes de `test`** (la première valeur pour la première ligne, quel que soit l'index).\n\n**Notation.** Chaque test fournit un couple (`train`, `test`) et garde pour lui les vraies valeurs de `resilie` sur `test`. Il est réussi si la sortie a le bon format et si son **exactitude**, la proportion de lignes de `test` bien classées, atteint le seuil du test. Deux tests ne contrôlent que le format (une ligne et cinq lignes de test). Les 8 autres ont pour seuil 0,78, sauf celui dont l'apprentissage n'a que 200 lignes, de seuil 0,76.\n\nRepères mesurés sur ces 8 tests (script `verif/seance_code_3.py`) : prédire toujours la classe majoritaire donne au plus 0,543 ; une régression logistique sur la seule colonne déjà numérique, manquants mis à 0, au plus 0,655 ; la correction (nettoyage de l'exercice 1, imputation par la médiane, mise à l'échelle, encodage un-parmi-n, régression logistique) entre 0,815 et 0,859.\n\n**Fichiers d'exploration.** `abonnes_train.csv` et `abonnes_test.csv`, les fichiers de la leçon, sont dans le répertoire courant ; le second contient des forfaits `pro`. Sers-t'en pour valider ta fonction par un découpage de `abonnes_train.csv`.\n\n**Ce que vise l'exercice.** La chaîne complète de la leçon : la fonction de nettoyage appliquée aux deux cadres, puis un `Pipeline` qui contient un `ColumnTransformer` (imputation et échelle des colonnes numériques, `OneHotEncoder(handle_unknown=\"ignore\")` pour le forfait) et un classifieur. Ne retire aucune ligne de `test`.\n\n\n**Fonctionnement.** Notebook sous Python 3.9, pandas 1.4.2 et scikit-learn 1.1.1. Tolérance de comparaison des nombres : `1e-9` ; limite de temps : 30 secondes par test. **Tests visibles** exécute 2 tests visibles ; **Soumettre** exécute 8 tests cachés et n'affiche que leur résultat.\n", "dossier": "coding/seance3", "module_tests": "coding/seance3/tests_e3.py", "fonction": "predire", "cellules_initiales": ["import numpy as np\nimport pandas as pd\n\ntrain = pd.read_csv(\"abonnes_train.csv\")\ntest = pd.read_csv(\"abonnes_test.csv\")\ntrain.head()", "def nettoyer(df: pd.DataFrame) -> pd.DataFrame:\n    d = df.copy()\n    # Ta fonction de l'exercice 1\n    return d", "def predire(train: pd.DataFrame, test: pd.DataFrame):\n    # À compléter : renvoyer une prédiction 0 ou 1 par ligne de test, dans l'ordre\n    return np.zeros(len(test), dtype=int)", "# Validation maison : mettre de côté une partie de abonnes_train.csv et mesurer l'exactitude de predire\npredictions = predire(train, test)\nlen(predictions), predictions[:10]"], "tests_visibles": 2, "tests_caches": 8, "fichier_correction": "coding/seance3/_correction.py", "intro_correction": "Correction commentée des trois exercices : les exercices 1 et 2 en version pandas et en version sans bibliothèque externe, l'exercice 3 avec scikit-learn seulement", "verif": {"script": "coding/seance3/tests_e3.py"}, "fiche": null, "solution": "Correction commentée des trois exercices : les exercices 1 et 2 en version pandas et en version sans bibliothèque externe, l'exercice 3 avec scikit-learn seulement (`coding/seance3/_correction.py`) :\n\n```python\n\"\"\"Corrections de la séance de code 3. À n'ouvrir qu'après avoir tenté les exercices.\n\nExercices 1 et 2 : deux versions indépendantes, pandas et sans bibliothèque externe ; les tests exigent qu'elles\nsoient d'accord. Exercice 3 : une seule version, avec scikit-learn (entraîner un classifieur n'a pas d'équivalent\nraisonnable sans bibliothèque dans le temps d'une épreuve).\n\"\"\"\nimport math\nimport re\n\nimport numpy as np\nimport pandas as pd\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\n\nMOTS = {\"zéro\": 0.0, \"un\": 1.0, \"deux\": 2.0, \"trois\": 3.0, \"quatre\": 4.0, \"cinq\": 5.0}\n\n\n# ------------------------------------------------------------------ exercice 1\ndef nettoyer(df: pd.DataFrame) -> pd.DataFrame:\n    d = df.copy()                                    # ne jamais modifier le cadre reçu\n    # astype(str) d'abord : si une colonne a été lue comme numérique (aucune saleté, ou tout manquant), l'accesseur\n    # .str n'existe pas et lèverait AttributeError. Une valeur manquante devient le texte \"nan\", qui ne correspond\n    # à aucun motif ci-dessous et redevient donc NaN.\n    # age : un nombre, éventuellement suivi de \" ans\". Le motif est ancré (^ au début, \\Z à la fin) : \"inconnu\" ne donne aucun groupe.\n    age = d[\"age\"].astype(str).str.strip().str.extract(r\"^(\\d+(?:\\.\\d+)?)(?: ans)?\\Z\")[0]\n    d[\"age\"] = pd.to_numeric(age, errors=\"coerce\").astype(float)\n    # revenu : retirer espaces et symbole, virgule décimale -> point ; ce qui reste illisible devient NaN (coerce).\n    revenu = (d[\"revenu\"].astype(str).str.replace(\" \", \"\", regex=False).str.replace(\"€\", \"\", regex=False)\n              .str.replace(\",\", \".\", regex=False))\n    d[\"revenu\"] = pd.to_numeric(revenu, errors=\"coerce\").astype(float)\n    # appels : les mots par dictionnaire, le reste par conversion numérique.\n    appels = d[\"appels\"].astype(str).str.strip()\n    d[\"appels\"] = appels.map(MOTS).fillna(pd.to_numeric(appels, errors=\"coerce\")).astype(float)\n    # anciennete_mois : valeur impossible (strictement négative) -> manquante. where garde là où la condition est vraie.\n    anciennete = pd.to_numeric(d[\"anciennete_mois\"], errors=\"coerce\").astype(float)\n    d[\"anciennete_mois\"] = anciennete.where(anciennete >= 0)\n    # forfait : mêmes modalités écrites différemment ; les valeurs manquantes restent manquantes.\n    d[\"forfait\"] = d[\"forfait\"].where(d[\"forfait\"].isna(), d[\"forfait\"].astype(str).str.strip().str.lower())\n    return d\n\n\ndef _manquant(v):\n    return v is None or (isinstance(v, float) and math.isnan(v))\n\n\ndef _nombre(texte):\n    try:\n        return float(texte)\n    except (TypeError, ValueError):\n        return math.nan\n\n\ndef nettoyer_pur(lignes):\n    \"\"\"lignes : liste de dictionnaires (une ligne chacun). Rend une nouvelle liste de dictionnaires nettoyés.\"\"\"\n    sortie = []\n    for ligne in lignes:\n        r = dict(ligne)\n        v = ligne[\"age\"]\n        if isinstance(v, str):\n            t = v.strip()\n            t = t[:-4] if t.endswith(\" ans\") else t\n            r[\"age\"] = float(t) if re.fullmatch(r\"\\d+(?:\\.\\d+)?\", t) else math.nan\n        else:\n            r[\"age\"] = math.nan if _manquant(v) else float(v)\n        v = ligne[\"revenu\"]\n        if isinstance(v, str):\n            r[\"revenu\"] = _nombre(v.replace(\" \", \"\").replace(\"€\", \"\").replace(\",\", \".\"))\n        else:\n            r[\"revenu\"] = math.nan if _manquant(v) else float(v)\n        v = ligne[\"appels\"]\n        if isinstance(v, str):\n            t = v.strip()\n            r[\"appels\"] = MOTS[t] if t in MOTS else _nombre(t)\n        else:\n            r[\"appels\"] = math.nan if _manquant(v) else float(v)\n        v = ligne[\"anciennete_mois\"]\n        r[\"anciennete_mois\"] = math.nan if _manquant(v) or float(v) < 0 else float(v)\n        v = ligne[\"forfait\"]\n        r[\"forfait\"] = math.nan if _manquant(v) else str(v).strip().lower()\n        sortie.append(r)\n    return sortie\n\n\n# ------------------------------------------------------------------ exercice 2\ndef aligner(train: pd.DataFrame, test: pd.DataFrame, colonnes):\n    # get_dummies crée une colonne par modalité PRÉSENTE dans le cadre qu'on lui donne : les deux cadres n'ont donc\n    # pas les mêmes colonnes dès qu'une modalité manque d'un côté. La référence est l'apprentissage.\n    x_train = pd.get_dummies(train, columns=colonnes, dtype=float)\n    # reindex(columns=...) fait les trois corrections d'un coup : il retire les colonnes des modalités inconnues,\n    # ajoute à 0 celles des modalités absentes du test, et remet les colonnes dans l'ordre de l'apprentissage.\n    x_test = pd.get_dummies(test, columns=colonnes, dtype=float).reindex(columns=x_train.columns, fill_value=0.0)\n    return x_train, x_test\n\n\ndef aligner_pur(train, test, colonnes):\n    \"\"\"train, test : listes de dictionnaires dont les clés sont dans l'ordre des colonnes. Rend deux listes de dictionnaires.\"\"\"\n    autres = [c for c in (train[0] if train else {}) if c not in colonnes]\n    modalites = {c: sorted({l[c] for l in train if not _manquant(l[c])}) for c in colonnes}\n\n    def encoder(lignes):\n        sortie = []\n        for l in lignes:\n            r = {c: l[c] for c in autres}\n            for c in colonnes:\n                for v in modalites[c]:\n                    r[f\"{c}_{v}\"] = 1.0 if (not _manquant(l[c]) and l[c] == v) else 0.0\n            sortie.append(r)\n        return sortie\n\n    return encoder(train), encoder(test)\n\n\n# ------------------------------------------------------------------ exercice 3\nNUMERIQUES = [\"age\", \"revenu\", \"appels\", \"anciennete_mois\"]\nCATEGORIELLES = [\"forfait\"]\n\n\ndef predire(train: pd.DataFrame, test: pd.DataFrame):\n    # 1. Le même nettoyage pour les deux cadres (exercice 1). Aucune ligne de test n'est retirée.\n    a, b = nettoyer(train), nettoyer(test)\n    # 2. Tout ce qui s'apprend (médianes, moyennes, écarts-types, modalités) est dans la chaîne, donc appris par fit\n    #    sur l'apprentissage seul, puis appliqué tel quel au test.\n    preparation = ColumnTransformer([\n        (\"num\", Pipeline([(\"imputer\", SimpleImputer(strategy=\"median\")), (\"echelle\", StandardScaler())]), NUMERIQUES),\n        (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), CATEGORIELLES),   # modalité inconnue au test : ligne de zéros\n    ])\n    modele = Pipeline([(\"preparation\", preparation), (\"modele\", LogisticRegression(max_iter=1000))])\n    # 3. Les lignes d'apprentissage incomplètes sont gardées : l'imputation par la médiane les rend utilisables.\n    modele.fit(a[NUMERIQUES + CATEGORIELLES], a[\"resilie\"])\n    return modele.predict(b[NUMERIQUES + CATEGORIELLES]).astype(int)\n\n\ndef predire_baclee(train: pd.DataFrame, test: pd.DataFrame):\n    \"\"\"Ce qu'il ne faut pas faire, pour mesurer ce que coûte l'absence de nettoyage : seule la colonne déjà\n    numérique est utilisée, les manquants sont mis à 0, la valeur impossible -1 est laissée.\"\"\"\n    modele = LogisticRegression(max_iter=1000).fit(train[[\"anciennete_mois\"]].fillna(0), train[\"resilie\"])\n    return modele.predict(test[[\"anciennete_mois\"]].fillna(0)).astype(int)\n```"}]}, {"id": "mlf", "nom": "Machine Learning fondamental : pièges d'une chaîne", "budget_min": 7, "questions": [{"id": "S3-Q1", "section": "mlf", "theme": "Mise à l'échelle ajustée sur l'apprentissage seul", "difficulte": 3, "temps_cible_s": 120, "enonce": "Une variable vaut 2, 4, 6 et 8 sur les quatre lignes d'apprentissage, et 20 sur l'unique ligne de test. On la standardise avec `StandardScaler`, qui retranche la moyenne puis divise par l'écart-type à dénominateur \\(n\\) (le nombre de lignes sur lesquelles il est ajusté).\n\nDans une chaîne correcte, où l'échelle est ajustée sur l'apprentissage seul, quelle valeur standardisée le modèle reçoit-il pour la ligne de test, à quatre décimales ?", "options": [{"id": "a", "texte": "6,7082", "correcte": true, "explication": "Oui : sur l'apprentissage, la moyenne vaut 5 et la variance 5, donc \\(z = (20 - 5)/\\sqrt{5}\\)."}, {"id": "b", "texte": "1,8974", "correcte": false, "explication": "C'est la valeur obtenue en ajustant l'échelle sur les cinq lignes, test compris : moyenne 8, variance 40. La ligne de test a servi à fixer sa propre échelle : c'est une fuite, et la valeur extrême 20 paraît alors banale."}, {"id": "c", "texte": "5,8095", "correcte": false, "explication": "C'est le résultat avec l'écart-type à dénominateur \\(n - 1\\), celui que rend `Series.std()` de pandas. `StandardScaler` divise par \\(n\\), comme le précise l'énoncé."}, {"id": "d", "texte": "0", "correcte": false, "explication": "C'est ce que donne `fit_transform` appliqué à la ligne de test seule : sa moyenne est elle-même, la valeur centrée est nulle. Sur le test, on applique `transform` avec la moyenne et l'écart-type de l'apprentissage."}], "solution": "Réponse : 6,7082.\n\nÉtape 1 : l'échelle est ajustée sur les quatre lignes d'apprentissage. Leur moyenne est \\((2 + 4 + 6 + 8)/4 = 5\\) ; leur variance à dénominateur 4 est \\((9 + 1 + 1 + 9)/4 = 5\\).\n\nÉtape 2 : la ligne de test est transformée avec ces deux nombres, sans réajustement : \\(z = (20 - 5)/\\sqrt{5} \\approx 6{,}7082\\).\n\nÉtape 3, ce que change la fuite : ajustée sur les cinq lignes, l'échelle aurait pour moyenne 8 et pour variance 40, et la même ligne vaudrait \\(12/\\sqrt{40} \\approx 1{,}8974\\). Le script recalcule les quatre valeurs par fractions et par `StandardScaler`.", "type": "qcm", "multiple": false, "reponse": "6,7082", "fiche": null, "verif": {"script": "verif/seance_code_3.py", "cles": ["Q1_moyenne_app", "Q1_moyenne_tout", "Q1_variance_app", "Q1_variance_tout", "Q1_z_ddof1", "Q1_z_fuite", "Q1_z_juste", "Q1_z_test_seul"]}}, {"id": "S3-Q2", "section": "mlf", "theme": "Modalité inconnue au test, encodage un-parmi-n", "difficulte": 3, "temps_cible_s": 90, "enonce": "La colonne `forfait` vaut `base`, `plus`, `premium`, `plus` sur les quatre lignes d'apprentissage, et `plus`, `pro` sur les deux lignes de test. On ajuste `OneHotEncoder(handle_unknown=\"ignore\")` sur la colonne d'apprentissage, puis on l'applique (`transform`) à la colonne de test.\n\nCombien de colonnes a la matrice obtenue pour le test, et que contient la ligne du forfait `pro` ?", "options": [{"id": "a", "texte": "3 colonnes ; la ligne `pro` ne contient que des zéros.", "correcte": true, "explication": "Oui : les colonnes sont celles des modalités apprises (`base`, `plus`, `premium`), et `handle_unknown=\"ignore\"` code une modalité inconnue par une ligne nulle, de somme 0."}, {"id": "b", "texte": "4 colonnes ; la ligne `pro` a un 1 dans la colonne `pro`.", "correcte": false, "explication": "Ce serait le résultat d'un encodage ajusté sur l'apprentissage et le test réunis. `transform` n'ajoute jamais de colonne : il applique les modalités apprises par `fit`, et `pro` n'en fait pas partie."}, {"id": "c", "texte": "2 colonnes ; la ligne `pro` a un 1 dans la colonne `pro`.", "correcte": false, "explication": "C'est ce que donne `pd.get_dummies` appliqué au test seul : une colonne par modalité présente dans le test, `plus` et `pro`. Ces colonnes ne sont pas celles sur lesquelles le modèle a été ajusté."}, {"id": "d", "texte": "Aucune : `transform` lève une erreur à la ligne `pro`.", "correcte": false, "explication": "C'est le comportement du réglage par défaut, `handle_unknown=\"error\"`. L'énoncé précise `handle_unknown=\"ignore\"`, qui remplace l'erreur par une ligne de zéros."}], "solution": "Réponse : 3 colonnes, et la ligne `pro` ne contient que des zéros.\n\nÉtape 1 : `fit` apprend la liste triée des modalités de l'apprentissage : `base`, `plus`, `premium`. La valeur `plus`, présente deux fois, ne compte qu'une fois : 3 modalités, donc 3 colonnes.\n\nÉtape 2 : `transform` produit ces 3 colonnes pour toute ligne. La ligne `plus` du test a un 1 dans la deuxième colonne.\n\nÉtape 3 : `pro` n'est pas une modalité apprise. Avec `handle_unknown=\"ignore\"`, sa ligne est nulle ; avec le réglage par défaut, `transform` lèverait `ValueError`. Le script le vérifie sous scikit-learn 1.1.1, ainsi que les 2 colonnes de `get_dummies` sur le test seul et les 4 colonnes d'un encodage des deux jeux réunis.", "type": "qcm", "multiple": false, "reponse": "3 colonnes ; la ligne `pro` ne contient que des zéros.", "fiche": null, "verif": {"script": "verif/seance_code_3.py", "cles": ["Q2_colonnes", "Q2_colonnes_concat", "Q2_colonnes_dummies_test", "Q2_somme_ligne_pro"]}}, {"id": "S3-Q3", "section": "mlf", "theme": "Fuites et lignes de test : ce qui est permis", "difficulte": 4, "temps_cible_s": 120, "conceptuelle": true, "correctes": ["a", "d"], "enonce": "On dispose d'un jeu d'apprentissage, dont la cible est connue, et d'un jeu de test, dont il faut prédire la cible pour **chaque** ligne. On veut aussi une estimation honnête de l'exactitude du modèle sur des lignes nouvelles.\n\nParmi les pratiques suivantes, lesquelles sont correctes ? (Plusieurs réponses possibles ; il faut cocher exactement les bonnes.)", "options": [{"id": "a", "texte": "Placer l'imputation, la mise à l'échelle et le modèle dans un `Pipeline`, et passer ce `Pipeline` à `cross_val_score` sur le jeu d'apprentissage.", "correcte": true, "explication": "Correct : à chaque pli, la chaîne entière est réajustée sur les seules lignes d'apprentissage du pli ; médianes, moyennes et écarts-types ne voient jamais les lignes qui servent à noter."}, {"id": "b", "texte": "Appliquer `dropna()` au jeu de test après nettoyage, comme au jeu d'apprentissage, puis prédire les lignes restantes.", "correcte": false, "explication": "Incorrect : chaque ligne retirée du test est une prédiction absente du fichier. Les valeurs manquantes du test se remplacent, par une valeur ajustée sur l'apprentissage ; on ne retire des lignes que de l'apprentissage."}, {"id": "c", "texte": "Garder les variables les plus corrélées à la cible sur tout le jeu d'apprentissage, puis estimer l'exactitude du modèle par validation croisée sur ces variables.", "correcte": false, "explication": "Incorrect : la sélection a utilisé la cible des lignes qui serviront ensuite à noter chaque pli. L'expérience de la partie 6 de la leçon montre qu'on obtient ainsi une exactitude élevée sur des variables de pur bruit. La sélection doit être une étape de la chaîne."}, {"id": "d", "texte": "Une fois le modèle choisi par validation, le réajuster sur toutes les lignes d'apprentissage avant de prédire le test.", "correcte": true, "explication": "Correct : les lignes de validation ont fini de servir à estimer ; aucune information du test n'entre dans ce réajustement, et l'estimation déjà faite reste celle d'un modèle ajusté sur un peu moins de lignes."}], "solution": "Réponse : le `Pipeline` passé à `cross_val_score`, et le réajustement final sur toutes les lignes d'apprentissage.\n\nLa règle qui tranche les quatre cas (leçon, partie 1) : toute quantité ajustée sur des données et utilisée pour transformer ou prédire ne doit venir que de lignes d'apprentissage, c'est-à-dire, pendant une validation, des lignes qui ne sont pas mises de côté à ce moment-là.\n\n- Le `Pipeline` dans la validation croisée respecte la règle par construction.\n- Le réajustement final n'utilise que des lignes d'apprentissage : il est permis, et c'est l'usage.\n- `dropna()` sur le test n'est pas une fuite, c'est une faute de format : le fichier n'a plus une ligne par identifiant.\n- La sélection de variables faite avant la validation croisée enfreint la règle : elle a vu la cible des lignes de validation.", "type": "qcm", "multiple": true, "reponse": "Placer l'imputation, la mise à l'échelle et le modèle dans un `Pipeline`, et passer ce `Pipeline` à `cross_val_score` sur le jeu d'apprentissage. ; Une fois le modèle choisi par validation, le réajuster sur toutes les lignes d'apprentissage avant de prédire le test.", "fiche": null, "verif": {"script": "verif/seance_code_3.py", "cles": []}}, {"id": "S3-Q4", "section": "mlf", "theme": "Exactitude, F1 et classe rare", "difficulte": 4, "temps_cible_s": 150, "enonce": "Sur 1000 lignes de validation, 50 sont de classe 1. Le modèle A prédit 0 pour toutes les lignes. Le modèle B prédit 1 pour 30 lignes de classe 1 et pour 60 lignes de classe 0, et 0 pour toutes les autres.\n\nL'exactitude est la proportion de lignes bien classées ; le F1 de la classe 1 est la moyenne harmonique de la précision (part des lignes prédites 1 qui sont de classe 1) et du rappel (part des lignes de classe 1 prédites 1). L'exactitude du modèle A vaut 0,95.\n\nQue valent l'exactitude et le F1 du modèle B, à quatre décimales ?", "options": [{"id": "a", "texte": "Exactitude 0,9200 et F1 0,4286", "correcte": true, "explication": "Oui : \\((30 + 890)/1000\\) pour l'exactitude, et \\(2 \\times 30/(2 \\times 30 + 60 + 20) = \\tfrac{3}{7}\\) pour le F1. B a une exactitude plus faible que A, mais c'est le seul des deux qui retrouve des lignes de classe 1."}, {"id": "b", "texte": "Exactitude 0,9200 et F1 0,4667", "correcte": false, "explication": "C'est la moyenne arithmétique de la précision 0,3333 et du rappel 0,6000. Le F1 est leur moyenne **harmonique**, toujours inférieure ou égale, et tirée vers la plus petite des deux."}, {"id": "c", "texte": "Exactitude 0,6000 et F1 0,4286", "correcte": false, "explication": "0,6000 est le rappel, \\(30/50\\), la part des lignes de classe 1 retrouvées. L'exactitude compte toutes les lignes bien classées, vrais négatifs compris."}, {"id": "d", "texte": "Exactitude 0,9200 et F1 0,3333", "correcte": false, "explication": "0,3333 est la précision seule, \\(30/(30 + 60)\\). Le F1 combine la précision et le rappel ; il ne coïncide avec la précision que si les deux sont égaux."}], "solution": "Réponse : exactitude 0,9200 et F1 0,4286.\n\nÉtape 1 : les quatre cases. Vrais positifs \\(\\mathrm{VP} = 30\\) ; faux positifs \\(\\mathrm{FP} = 60\\) ; faux négatifs \\(\\mathrm{FN} = 50 - 30 = 20\\) ; vrais négatifs \\(\\mathrm{VN} = 1000 - 30 - 60 - 20 = 890\\).\n\nÉtape 2 : exactitude \\(= (\\mathrm{VP} + \\mathrm{VN})/1000 = 0{,}92\\), inférieure à celle du modèle A, 0,95, qui est la part de la classe 0.\n\nÉtape 3 : précision \\(= 30/(30 + 60) \\approx 0{,}3333\\), rappel \\(= 30/50 = 0{,}6\\), et \\(\\mathrm{F1} = 2\\,\\mathrm{VP}/(2\\,\\mathrm{VP} + \\mathrm{FP} + \\mathrm{FN}) = \\tfrac{3}{7} \\approx 0{,}4286\\) (leçon, partie 7).\n\nÉtape 4, ce qu'il faut en retenir : le modèle A n'a aucun vrai positif, son rappel et son F1 sont nuls. Avec une classe rare, l'exactitude classe A devant B alors que A ne détecte rien : il faut lire le rappel, la précision ou le F1.", "type": "qcm", "multiple": false, "reponse": "Exactitude 0,9200 et F1 0,4286", "fiche": null, "verif": {"script": "verif/seance_code_3.py", "cles": ["Q4_exactitude_A", "Q4_exactitude_B", "Q4_f1_B", "Q4_f1_den", "Q4_f1_num", "Q4_fn", "Q4_fp", "Q4_moyenne_arithmetique", "Q4_n", "Q4_positifs", "Q4_precision_B", "Q4_rappel_B", "Q4_vn", "Q4_vp"]}}]}]}</script>
<script>

function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function enLigne(t) { return esc(t).replace(/`([^`]+)`/g, '<code class="sans-math">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

// Markdown réduit : titres #, tableaux |, listes - et 1., paragraphes, `code`, **gras**, blocs entre triples accents graves.
function rendre(t) {
  let h = '';
  String(t).split('```').forEach((bloc, i) => {
    if (i % 2) {
      const info = (bloc.match(/^(\w*)\n/) || [])[1];
      h += '<pre class="sans-math' + (info === 'sortie' ? ' sortie-lecon' : '') + '"><code>' + esc(bloc.replace(/^\w*\n/, '')) + '</code></pre>';
      return;
    }
    const lignes = bloc.split('\n');
    let k = 0;
    while (k < lignes.length) {
      const l = lignes[k];
      if (!l.trim()) { k++; continue; }
      const titre = l.match(/^(#{1,4})\s+(.*)$/);
      if (titre) { const n = Math.min(4, titre[1].length + 1); h += '<h' + n + '>' + enLigne(titre[2]) + '</h' + n + '>'; k++; continue; }
      if (l.trim().startsWith('|')) {
        const rangs = [];
        while (k < lignes.length && lignes[k].trim().startsWith('|')) { rangs.push(lignes[k].trim()); k++; }
        const cellules = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
        h += '<div class="defile"><table><tr>' + cellules(rangs[0]).map(c => '<th>' + enLigne(c) + '</th>').join('') + '</tr>';
        rangs.slice(1).filter(r => !/^\|[\s|:-]+\|$/.test(r)).forEach(r => { h += '<tr>' + cellules(r).map(c => '<td>' + enLigne(c) + '</td>').join('') + '</tr>'; });
        h += '</table></div>'; continue;
      }
      const puce = /^\s*[-*]\s+/, numero = /^\s*\d+\.\s+/;

        const motif = puce.test(l) ? puce : numero, balise = motif === puce ? 'ul' : 'ol';
        h += '<' + balise + '>';
        while (k < lignes.length && motif.test(lignes[k])) { h += '<li>' + enLigne(lignes[k].replace(motif, '')) + '</li>'; k++; }
        h += '</' + balise + '>'; continue;
      }
      const par = [];
      while (k < lignes.length && lignes[k].trim() && !/^(#{1,4}\s|\s*\||\s*[-*]\s|\s*\d+\.\s)/.test(lignes[k])) { par.push(lignes[k]); k++; }
      const texte = par.join('\n').trim();
      // Un paragraphe réduit à une seule formule est centré ; une formule au milieu d'une phrase reste dans la ligne.
      const seule = texte.startsWith('\\(') && texte.endsWith('\\)') && texte.indexOf('\\(', 2) < 0;
      h += (seule ? '<p class="formule">' : '<p>') + enLigne(par.join('\n')) + '</p>';

}

// Une question du débrief : en-tête (numéro, titre, verdict), énoncé, réponses côte à côte, rubriques, à retenir.
function ficheDebrief(titre, noeuds) {
  const m = titre.match(/^(Question \d+)\s*:?\s*(.*)$/);
  const gras = n => n.nodeName === 'P' && n.firstChild && n.firstChild.nodeName === 'STRONG' ? n.firstChild.textContent.trim() : '';
  const reste = n => { const c = n.cloneNode(true); c.removeChild(c.firstChild); return c.innerHTML.trim(); };
  let enonce = '', ta = null, attendue = null, verdict = '', corps = '', retenir = '', revoir = '', etat = 'enonce';
  noeuds.forEach(n => {
    const g = gras(n), html = n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    if (/^Ta réponse/.test(g)) { ta = reste(n); etat = 'corps'; }
    else if (/^Réponse attendue/.test(g)) { attendue = reste(n); etat = 'corps'; }
    else if (/^Verdict/.test(g)) { verdict = reste(n); etat = 'corps'; }
    else if (/^À retenir/.test(g)) { retenir = '<h5>À retenir</h5><p>' + reste(n) + '</p>'; etat = 'retenir'; }
    else if (/^Leçon à revoir/.test(g)) { revoir = reste(n); etat = 'fin'; }
    else if (g && n.textContent.trim() === g) { corps += '<h5>' + esc(g.replace(/[.:]\s*$/, '')) + '</h5>'; etat = 'corps'; }
    else if (etat === 'enonce') enonce += n.nodeName === 'P' && /^Type :/.test(n.textContent) ? '<p class="meta">' + n.innerHTML + '</p>' : n.nodeName === 'UL' ? '<ul class="choix">' + n.innerHTML + '</ul>' : html;
    else if (etat === 'retenir') retenir += html;
    else corps += html;
  });
  const brut = verdict.replace(/<[^>]+>/g, '').trim();
  const v = /^juste/i.test(brut) ? ['v-juste', 'Juste'] : /^fausse/i.test(brut) ? ['v-fausse', 'Fausse'] : /^incompl/i.test(brut) ? ['v-incomplete', 'Incomplète']
    : /^non visible/i.test(brut) ? ['', 'Réponse non visible'] : ['', ''];
  const suite = brut.replace(/^[^.]*\.\s*/, '');
  let h = '<article class="fiche ' + v[0] + '"><header class="fiche-tete"><span class="num">' + esc(m[1]) + '</span><span class="titre">' + esc(m[2]) + '</span>'
    + (v[1] ? '<span class="verdict">' + v[1] + '</span>' : '') + '</header><div class="fiche-corps">';
  if (ta === null && attendue === null) return h + enonce + corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '') + '</div></article>';
  h += '<h5>Énoncé</h5>' + enonce;
  h += '<div class="fiche-reponses"><div><span class="lab">Ta réponse</span>' + (ta || 'non visible') + '</div><div><span class="lab">Réponse attendue</span>' + (attendue || '') + '</div></div>';
  if (suite) h += '<p class="meta">' + verdict.replace(/^[^.]*\.\s*/, '') + '</p>';
  h += corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '');
  return h + '</div></article>';
}

  if (!SERVEUR) page.querySelectorAll('.notebook-barre button, #testsVisibles, #soumettre').forEach(b => b.disabled = true);
  else if (!noyauxDemarres[q.id]) demarrerNoyau(q, false, true);

}

async function demarrerNoyau(q, confirmer, reconnexion) {
  if (confirmer && !confirm('Redémarrer le noyau ? Toutes les variables seront perdues.')) return;
  const zone = document.getElementById('versions');

    noyauxDemarres[q.id] = v.erreur ? 'noyau : ' + v.erreur : etat + ' · Python ' + v.python + ' · pandas ' + v.pandas + ' · numpy ' + v.numpy;

function rendreSortie(c) { return c.sortie || ''; }

// ------------------------------------------------------------------ éditeur
// Monaco (l'éditeur de VS Code) depuis cdnjs ; les suggestions, signatures et aides viennent de jedi
// dans le noyau, qui connaît les variables déjà exécutées. Sans connexion, repli sur une zone de texte simple.
const MONACO_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min';
let MONACO = null, promesseMonaco = null;
const EDITEURS = [];
window.EDITEURS = EDITEURS;
// Monaco annule ses tâches en cours quand on ferme un éditeur ; cette annulation n'est pas une erreur.
window.addEventListener('unhandledrejection', ev => { if (ev.reason && ev.reason.name === 'Canceled') ev.preventDefault(); });
function sombre() { return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; }
function questionCode() { const q = ITEMS[E.courant]; return E.phase === 'epreuve' && q && q.cellules_initiales ? q : null; }
function chargerMonaco() {
  if (promesseMonaco) return promesseMonaco;
  promesseMonaco = new Promise(resolve => {
    const abandon = setTimeout(() => fini(null), 20000);
    function fini(m) { clearTimeout(abandon); if (window.MODE_EDITEUR === undefined) { MONACO = m; window.MODE_EDITEUR = m ? 'monaco' : 'simple'; } resolve(MONACO); }
    const s = document.createElement('script');
    s.src = MONACO_BASE + '/vs/loader.js';
    s.onerror = () => fini(null);
    s.onload = () => {
      window.MonacoEnvironment = { getWorkerUrl: () => 'data:text/javascript;charset=utf-8,' + encodeURIComponent("self.MonacoEnvironment={baseUrl:'" + MONACO_BASE + "/'};importScripts('" + MONACO_BASE + "/vs/base/worker/workerMain.js');") };
      window.require.config({ paths: { vs: MONACO_BASE + '/vs' } });
      window.require(['vs/editor/editor.main'], () => { try { configurerMonaco(window.monaco); fini(window.monaco); } catch (e) { fini(null); } }, () => fini(null));
    };
    document.head.appendChild(s);
  });
  return promesseMonaco;
}
async function aide(type, model, position) {
  const q = questionCode();
  if (!q || !SERVEUR) return null;
  try { return await api('/api/' + type, { session: SESSION, dossier: q.dossier, code: model.getValue(), ligne: position.lineNumber, colonne: position.column - 1 }); }
  catch (e) { return null; }
}
function configurerMonaco(m) {
  const K = m.languages.CompletionItemKind;
  const genres = { module: K.Module, class: K.Class, instance: K.Variable, function: K.Function, param: K.Variable, path: K.File, keyword: K.Keyword, property: K.Property, statement: K.Variable };
  m.languages.registerCompletionItemProvider('python', {
    triggerCharacters: ['.'],
    provideCompletionItems: async (model, position) => {
      const r = await aide('completer', model, position);
      if (!r || !r.completions) return { suggestions: [] };
      const mot = model.getWordUntilPosition(position);
      const plage = new m.Range(position.lineNumber, mot.startColumn, position.lineNumber, mot.endColumn);
      return { suggestions: r.completions.map((c, k) => ({ label: c.nom, kind: genres[c.type] ?? K.Variable, insertText: c.nom, detail: c.description, range: plage, sortText: String(k).padStart(4, '0') })) };
    }
  });
  m.languages.registerSignatureHelpProvider('python', {
    signatureHelpTriggerCharacters: ['(', ','],
    provideSignatureHelp: async (model, position) => {
      const r = await aide('signatures', model, position);
      if (!r || !r.signatures || !r.signatures.length) return null;
      return { value: { signatures: r.signatures.map(x => ({ label: x.texte, documentation: x.doc, parameters: x.parametres.map(p => ({ label: p })) })), activeSignature: 0, activeParameter: r.signatures[0].index ?? 0 }, dispose() {} };
    }
  });
  m.languages.registerHoverProvider('python', {
    provideHover: async (model, position) => {
      const r = await aide('aide', model, position);
      if (!r || !r.aide || !r.aide.length) return null;
      return { contents: r.aide.map(a => ({ value: '```text\n' + a.doc + '\n```' })) };
    }
  });
}
function creerEditeur(conteneur, code, rappels) {
  if (MONACO) {
    const m = MONACO;
    const ed = m.editor.create(conteneur, {
      value: code, language: 'python', theme: sombre() ? 'vs-dark' : 'vs', fontSize: 14, tabSize: 4, insertSpaces: true,
      minimap: { enabled: false }, scrollBeyondLastLine: false, automaticLayout: true, lineNumbersMinChars: 3, folding: false,
      glyphMargin: false, renderLineHighlight: 'none', overviewRulerLanes: 0, wordBasedSuggestions: 'off', fixedOverflowWidgets: true,
      quickSuggestions: { other: true, comments: false, strings: false }, padding: { top: 6, bottom: 6 },
      scrollbar: { alwaysConsumeMouseWheel: false, vertical: 'hidden', horizontalScrollbarSize: 8 }
    });
    // Sous Windows, Monaco utilise des fins de ligne \r\n ; le code est toujours lu avec des \n, comme dans un notebook.
    const lire = () => ed.getModel().getValue(m.editor.EndOfLinePreference.LF);
    const hauteur = () => { conteneur.style.height = Math.max(38, ed.getContentHeight()) + 'px'; };
    ed.onDidContentSizeChange(hauteur); hauteur();
    ed.onDidChangeModelContent(() => rappels.modif(lire()));
    ed.onDidFocusEditorText(rappels.focus);
    ed.addCommand(m.KeyMod.Shift | m.KeyCode.Enter, rappels.executerSuivant, '!suggestWidgetVisible');
    ed.addCommand(m.KeyMod.CtrlCmd | m.KeyCode.Enter, rappels.executer, '!suggestWidgetVisible');
    return { brut: ed, getValue: lire, setValue: v => ed.setValue(v), focus: () => ed.focus(), dispose: () => ed.dispose() };
  }
  const zone = document.createElement('textarea');
  zone.spellcheck = false; zone.autocomplete = 'off'; zone.className = 'sans-math';
  zone.value = code;
  conteneur.appendChild(zone);
  zone.addEventListener('input', () => { rappels.modif(zone.value); ajuster(zone); });
  zone.addEventListener('focus', rappels.focus);
  zone.addEventListener('keydown', ev => clavier(ev, zone, rappels));
  setTimeout(() => ajuster(zone));
  return { brut: zone, getValue: () => zone.value, setValue: v => { zone.value = v; zone.dispatchEvent(new Event('input')); }, focus: () => zone.focus(), dispose: () => {} };
}
function libererEditeurs() { EDITEURS.forEach(e => e.dispose()); EDITEURS.length = 0; }

function dessinerCellules(q) {
  const conteneur = document.getElementById('cellules');
  if (!conteneur) return;
  if (SERVEUR && window.MODE_EDITEUR === undefined) {
    conteneur.innerHTML = '<p class="meta">Chargement de l\'éditeur...</p>';
    chargerMonaco().then(() => { if (questionCode() === q) dessinerCellules(q); });
    return;
  }
  libererEditeurs();
  conteneur.innerHTML = '';
  const etat = document.getElementById('modeEditeur');
  if (etat) etat.textContent = MONACO ? 'éditeur VS Code, autocomplétion' : 'éditeur simple' + (SERVEUR ? ' (Monaco injoignable)' : '');
  E.cellules[q.id].forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'cellule';
    div.innerHTML = '<div class="numero">[' + (c.numero === null ? ' ' : c.numero) + ']</div><div><div class="editeur"></div>'
      + '<div class="actions"><button data-a="executer">Exécuter</button><button data-a="dessous">Insérer dessous</button><button data-a="supprimer">Supprimer</button></div>'
      + '<pre class="sortie sans-math"></pre></div>';
    div.querySelector('pre.sortie').innerHTML = rendreSortie(c);
    conteneur.appendChild(div);
    EDITEURS.push(creerEditeur(div.querySelector('.editeur'), c.code, {
      modif: v => { c.code = v; sauver(); },
      focus: () => { conteneur.querySelectorAll('.cellule').forEach(x => x.classList.remove('active')); div.classList.add('active'); },
      executer: () => executerCellule(q, i),
      executerSuivant: () => {
        executerCellule(q, i);
        if (i === E.cellules[q.id].length - 1) { E.cellules[q.id].push({ code: '', sortie: '', numero: null }); sauver(); dessinerCellules(q); }
        focaliser(i + 1);
      }
    }));
    div.querySelector('[data-a=executer]').onclick = () => executerCellule(q, i);
    div.querySelector('[data-a=dessous]').onclick = () => { E.cellules[q.id].splice(i + 1, 0, { code: '', sortie: '', numero: null }); sauver(); dessinerCellules(q); focaliser(i + 1); };
    div.querySelector('[data-a=supprimer]').onclick = () => { if (E.cellules[q.id].length > 1) { E.cellules[q.id].splice(i, 1); sauver(); dessinerCellules(q); } };
  });
}
function majNumeros(q) { document.querySelectorAll('#cellules .numero').forEach((n, i) => { const c = E.cellules[q.id][i]; n.textContent = '[' + (c && c.numero !== null ? c.numero : ' ') + ']'; }); }
function ajuster(zone) { zone.style.height = 'auto'; zone.style.height = (zone.scrollHeight + 2) + 'px'; }
function focaliser(i) { const e = EDITEURS[i]; if (e) e.focus(); }
function inserer(zone, texte) {
  zone.focus();
  if (!document.execCommand('insertText', false, texte)) zone.setRangeText(texte, zone.selectionStart, zone.selectionEnd, 'end');
  zone.dispatchEvent(new Event('input'));
}
function clavier(ev, zone, rappels) {
  if (ev.key === 'Enter' && (ev.shiftKey || ev.ctrlKey)) {
    ev.preventDefault();
    if (ev.shiftKey) rappels.executerSuivant(); else rappels.executer();
    return;
  }
  const debut = zone.selectionStart, fin = zone.selectionEnd, v = zone.value;
  const debutLigne = v.lastIndexOf('\n', debut - 1) + 1;
  if (ev.key === 'Tab') {
    ev.preventDefault();
    const multi = v.slice(debut, fin).includes('\n');
    if (!ev.shiftKey && !multi) { inserer(zone, '    '); return; }
    const finBloc = fin;
    const bloc = v.slice(debutLigne, finBloc);
    const nouveau = ev.shiftKey ? bloc.replace(/^ {1,4}/gm, '') : bloc.replace(/^/gm, '    ');
    zone.setSelectionRange(debutLigne, finBloc);
    inserer(zone, nouveau);
    zone.setSelectionRange(debutLigne, debutLigne + nouveau.length);
    return;
  }
  if (ev.key === 'Enter' && !ev.altKey && !ev.metaKey) {
    ev.preventDefault();
    const ligne = v.slice(debutLigne, debut);
    let retrait = ligne.match(/^ */)[0];
    if (/:\s*(#.*)?$/.test(ligne)) retrait += '    ';
    inserer(zone, '\n' + retrait);
  }
}

async function executerCellule(q, i) {
  if (!SERVEUR) return false;
  const c = E.cellules[q.id][i];
  const div = document.querySelectorAll('#cellules .cellule')[i];
  if (div) { div.querySelector('.numero').textContent = '[*]'; div.querySelector('pre.sortie').innerHTML = ''; }
  let r;
  try { r = await api('/api/executer', { session: SESSION, dossier: q.dossier, code: c.code, nom: 'cellule ' + (i + 1) }); }
  catch (e) { r = { erreur: 'Serveur injoignable : lancer.py est-il démarré ?' }; }
  E.compteur = (E.compteur || 0) + 1;
  c.numero = E.compteur;
  let h = '';
  if (r.sortie) h += esc(r.sortie);
  if (r.valeur !== null && r.valeur !== undefined) h += (h && !h.endsWith('\n') ? '\n' : '') + esc(r.valeur);
  if (r.erreur) h += (h && !h.endsWith('\n') ? '\n' : '') + '<span class="erreur">' + esc(r.erreur) + '</span>';
  if (r.redemarre) { noyauxDemarres[q.id] = 'noyau redémarré : variables perdues'; const z = document.getElementById('versions'); if (z) z.textContent = noyauxDemarres[q.id]; }
  c.sortie = h;
  sauver();
  const d = document.querySelectorAll('#cellules .cellule')[i];
  if (d) { d.querySelector('.numero').textContent = '[' + c.numero + ']'; d.querySelector('pre.sortie').innerHTML = h; }
  return !r.erreur;
}

function codeSource(q) { return E.cellules[q.id].map((c, i) => '# %% cellule ' + (i + 1) + '\n' + c.code).join('\n\n') + '\n'; }
function afficherEtatSoumission(q) {

  if (z) z.textContent = s.soumissions ? s.soumissions + ' soumission(s) · dernière : ' + s.caches_reussis + '/' + s.caches_total + ' tests cachés réussis' : 'jamais soumis';
}
async function lancerTests(q, mode) {

// ------------------------------------------------------------------ bilan
function points(q) {
  if (q.type === 'code') { const c = E.code[q.id]; return c && c.soumissions ? c.caches_reussis / c.caches_total : 0; }
  const r = E.reponses[q.id];
  if (r === undefined || r === 'nsp') return 0;
  // Une question à plusieurs réponses est notée tout ou rien : l'ensemble coché doit être exactement l'ensemble juste.
  const s = choisies(q), bonnes = q.options.filter(o => o.correcte).map(o => o.id);
  return s.length === bonnes.length && bonnes.every(b => s.includes(b)) ? 1 : -D.options.penalite;
}
function choisies(q) { const r = E.reponses[q.id]; return r === undefined || r === 'nsp' ? [] : Array.isArray(r) ? r.slice() : [r]; }
function texteOption(q, id) { const o = q.options.find(x => x.id === id); return o ? o.texte : null; }

function resultatJSON(duree) {
  return {
    examen: D.id, debut: new Date(E.debut).toISOString(), duree_s: Math.round(duree), pauses_s: Math.round((E.pauseTotale || 0) / 1000), options: D.options,
    lecons: ITEMS.filter(q => q.type === 'lecon').map(q => {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      return { id: q.id, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), controles_justes_du_premier_coup: justes, controles_total: ids.length };
    }),
    questions: NOTEES.map(q => {
      const base = { id: q.id, type: q.type, section: q.section, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), temps_cible_s: q.temps_cible_s, points: Number(points(q).toFixed(4)) };
      if (q.type === 'code') {
        const c = E.code[q.id] || {};
        return Object.assign(base, { soumissions: c.soumissions || 0, caches_reussis: c.caches_reussis || 0, caches_total: c.caches_total || q.tests_caches, visibles_reussis: c.visibles_reussis ?? null, code_source: c.code_source || codeSource(q) });
      }
      const r = E.reponses[q.id] ?? null;
      return Object.assign(base, { reponse: r, reponse_texte: r && r !== 'nsp' ? choisies(q).map(i => texteOption(q, i)).join(' ; ') : null, bonne_reponse_texte: q.options.filter(o => o.correcte).map(o => o.texte).join(' ; ') });
    })
  };
}

function bilan() {
  page.className = '';
  document.getElementById('position').textContent = 'Bilan';
  const duree = dureeEcoulee(E.fin);
  document.getElementById('chrono').textContent = mmss(duree);
  let total = 0;

  D.sections.forEach(s => {
    const notees = s.questions.filter(q => q.type !== 'lecon');

  });

  h = h.replace('@SCORE@', '<div class="score-total"><strong>' + total.toFixed(2).replace('.', ',').replace(/,00$/, '') + ' / ' + NOTEES.length + '</strong><span class="meta">en ' + mmss(duree) + '</span></div>');
  const barreFin = document.querySelector('#progression > span'); if (barreFin) barreFin.style.width = '100%';
  h += '<p id="enregistrement" class="meta"></p>';
  h += '<details><summary>Résultat brut (JSON)</summary><textarea readonly class="json sans-math" id="json"></textarea><div class="barre"><button id="telecharger">Enregistrer le fichier</button></div></details>';
  h += '<div class="barre">' + (SERVEUR ? '<button class="principal" id="retourAccueil">Retour à l\'accueil (séance suivante)</button>' : '')
    + '<button id="recommencer">Effacer et recommencer</button></div></div>';
  ITEMS.forEach((q, i) => {
    const temps = mmss(E.temps[q.id] || 0) + ' sur ' + mmss(q.temps_cible_s) + ' visés';
    const tete = (classe, verdict) => '<article class="fiche ' + classe + '"><header class="fiche-tete"><span class="num">' + (q.type === 'lecon' ? 'Leçon' : 'Question ' + (i + 1)) + '</span><span class="titre">' + esc(q.theme)
      + '</span><span class="temps">' + esc(q.nomSection) + ' · ' + temps + '</span>' + (verdict ? '<span class="verdict">' + verdict + '</span>' : '') + '</header><div class="fiche-corps">';
    if (q.type === 'lecon') {
      const ids = Object.keys(q.controles || {});

      h += tete('', '') + '<p>Points de contrôle justes du premier coup : ' + justes + ' sur ' + ids.length + '. La leçon reste consultable depuis la séance.</p></div></article>';
      return;
    }
    if (q.type === 'qcm') {
      const r = E.reponses[q.id], juste = points(q) === 1;
      const s = choisies(q), incomplete = !juste && q.multiple && s.length > 0 && s.every(id => q.options.find(o => o.id === id).correcte);
      h += tete(juste ? 'v-juste' : incomplete ? 'v-incomplete' : r === undefined || r === 'nsp' ? '' : 'v-fausse',
        juste ? 'Juste' : r === undefined ? 'Sans réponse' : r === 'nsp' ? 'Je ne sais pas' : incomplete ? 'Incomplète' : 'Fausse');
      h += '<h5>Énoncé</h5>' + rendre(q.enonce) + '<h5>' + (q.multiple ? 'Options (plusieurs réponses, tout ou rien)' : 'Options') + '</h5>';
      E.ordre[q.id].forEach((oid, k) => {
        const o = q.options.find(x => x.id === oid), choisie = s.includes(oid);
        const puces = (o.correcte ? '<span class="puce bon">' + (q.multiple ? 'Juste' : 'Bonne réponse') + '</span>' : '') + (choisie ? '<span class="puce' + (o.correcte ? ' bon' : ' faux') + '">Ta réponse</span>' : '');
        h += '<div class="option ' + (o.correcte ? 'juste' : 'fausse') + (choisie ? ' choisie' : '') + '"><span class="lettre">' + 'ABCDE'[k] + '</span><div>' + puces + rendre(o.texte)
          + '<div class="explication">' + (o.correcte && !q.multiple ? '' : rendre(o.explication)) + '</div></div></div>';
      });
      h += '<h5>Correction</h5>' + rendre(q.solution);
    } else {
      const c = E.code[q.id] || {};
      const tout = c.soumissions && c.caches_reussis === c.caches_total;
      h += tete(tout ? 'v-juste' : c.soumissions ? 'v-incomplete' : '', c.soumissions ? c.caches_reussis + ' / ' + c.caches_total + ' tests cachés' : 'Jamais soumis');
      h += '<details><summary>Énoncé</summary>' + rendre(q.enonce) + '</details>';
      if (c.details) {
        h += '<h5>Tests cachés</h5><div class="defile"><table><tr><th>Test caché</th><th>Résultat</th><th>Attendu</th><th>Obtenu</th></tr>';
        c.details.forEach(t => { h += '<tr><td>' + esc(t.nom) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec') + '</td><td><code class="sans-math">' + esc(t.attendu) + '</code></td><td><code class="sans-math">' + esc(t.obtenu ?? (t.erreur ? 'exception' : '')) + '</code></td></tr>'; });
        h += '</table></div>';
        c.details.filter(t => t.erreur).forEach(t => { h += '<details><summary>Erreur : ' + esc(t.nom) + '</summary><pre class="sans-math">' + esc(t.erreur) + '</pre></details>'; });
      }
      h += '<details><summary>Ton code soumis</summary><pre class="sans-math"><code>' + esc(c.code_source || codeSource(q)) + '</code></pre></details>';
      h += '<details><summary>Correction</summary>' + rendre(q.solution) + '</details>';
    }
    h += '<p class="revoir">Vérification des nombres : <code class="sans-math">' + esc(q.verif.script) + '</code></p></div></article>';
  });
  page.innerHTML = h;
  const resultat = resultatJSON(duree);
  const zone = document.getElementById('json');
  zone.value = JSON.stringify(resultat, null, 1);
  document.getElementById('telecharger').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([zone.value], { type: 'application/json' }));
    a.download = D.id + '_resultat.json'; a.click();
  };
  const retour = document.getElementById('retourAccueil'); if (retour) retour.onclick = () => { location.href = '/'; };
  document.getElementById('recommencer').onclick = () => { if (confirm('Effacer ce passage ?')) { try { localStorage.removeItem(CLE); } catch (e) {} E = etatNeuf('accueil'); afficher(); } };
  const info = document.getElementById('enregistrement');
  if (E.enregistrement) info.textContent = E.enregistrement;
  else if (!SERVEUR) info.textContent = 'Page ouverte comme un fichier : le résultat n\'est pas enregistré automatiquement. Copie le JSON ci-dessous dans la conversation.';
  else {
    info.textContent = 'Enregistrement du résultat...';
    api('/api/resultat', resultat).then(r => {
      E.enregistrement = r.erreur ? null : 'Résultat enregistré dans ' + r.fichier + ' ; ' + r.erreurs_ajoutees + ' erreur(s) ajoutée(s) au journal suivi/erreurs.md.';
      info.textContent = E.enregistrement || 'Échec de l\'enregistrement : ' + r.erreur;
      sauver();
    }).catch(() => { info.textContent = 'Serveur injoignable : le résultat n\'est pas enregistré. Copie le JSON ci-dessous dans la conversation.'; });
  }
  composer();
}

function afficher() {
  libererEditeurs();
  document.getElementById('titre').textContent = D.titre;
  document.title = D.titre;
  if (E.phase === 'epreuve') epreuve(); else if (E.phase === 'bilan') bilan(); else accueil();
  window.scrollTo(0, 0);
}
function completerEtat() {
  ['reponses', 'temps', 'ordre', 'cellules', 'code', 'controles', 'ordreControles', 'vus', 'partie'].forEach(k => { if (!E[k] || typeof E[k] !== 'object') E[k] = {}; });
  if (typeof E.courant !== 'number' || E.courant < 0 || E.courant >= ITEMS.length) E.courant = 0;
  ITEMS.forEach(q => {
    if (q.cellules_initiales && !Array.isArray(E.cellules[q.id])) E.cellules[q.id] = q.cellules_initiales.map(c => ({ code: c, sortie: '', numero: null }));
    if (q.type === 'qcm') {
      const ids = q.options.map(o => o.id);
      const o = E.ordre[q.id];
      if (!Array.isArray(o) || o.length !== ids.length || !ids.every(i => o.includes(i))) E.ordre[q.id] = melanger(ids);
      const rep = E.reponses[q.id];
      if (rep !== undefined && rep !== 'nsp' && (Array.isArray(rep) !== !!q.multiple || !choisies(q).length || !choisies(q).every(i => ids.includes(i)))) delete E.reponses[q.id];
    }
    if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => {
      const cle = q.id + ':' + cid;
      if (!Array.isArray(E.ordreControles[cle])) E.ordreControles[cle] = melanger(c.options.map(o => o.id));
    });
  });
}
charger();
completerEtat();
if (SERVEUR && ITEMS.some(q => q.cellules_initiales)) chargerMonaco();
afficher();
</script>
