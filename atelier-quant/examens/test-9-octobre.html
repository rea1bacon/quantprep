s signalées, FP (faux positifs) le nombre de transactions honnêtes signalées, FN (faux négatifs) le nombre de fraudes non signalées, VN (vrais négatifs) le nombre de transactions honnêtes non signalées.\n\nÉtape 1, la matrice de confusion. VP = 30. FP = \\(80 - 30 = 50\\). FN = \\(50 - 30 = 20\\). VN = \\(1000 - 30 - 50 - 20 = 900\\).\n\nÉtape 2. Le rappel est la proportion des fraudes réelles qui sont détectées : VP / (VP + FN) = \\(30/50 = 0{,}6\\).\n\nPour comparaison : précision VP / (VP + FP) = \\(30/80 = 0{,}375\\) ; exactitude (VP + VN) / 1000 = \\(0{,}93\\) ; score F1 = \\(6/13 \\approx 0{,}462\\).\n\nLecture probabiliste, vérifiée par simulation (script) : le rappel est la probabilité qu'une fraude tirée au hasard parmi les fraudes ait été signalée, 0,600 sur un million de tirages.\n\nAvec 5 % de fraudes, l'exactitude est trompeuse : elle récompense surtout la classe majoritaire. C'est le rappel et la précision de la classe rare qu'il faut regarder.", "type": "qcm", "multiple": false, "reponse": "0,6", "fiche": null, "verif": {"script": "verif/test_9_octobre.py", "cles": ["Q14_exactitude", "Q14_f1", "Q14_f1_den", "Q14_f1_num", "Q14_fn", "Q14_fp", "Q14_precision", "Q14_rappel", "Q14_rappel_mc", "Q14_tout_negatif", "Q14_vn"]}}, {"id": "T9-Q15", "section": "mlf", "theme": "k plus proches voisins : rôle de k", "difficulte": 3, "temps_cible_s": 105, "enonce": "Question de remplacement (la question d'origine n'a pas été capturée). Question 15. Un classifieur des \\(k\\) plus proches voisins (distance euclidienne, vote à la majorité parmi les \\(k\\) voisins) est entraîné sur 200 points deux à deux distincts : 120 de la classe 0 et 80 de la classe 1. On mesure son exactitude (proportion de prédictions correctes) **sur ces mêmes 200 points** ; chaque point fait partie de ses propres voisins, à distance nulle.\n\nQue valent l'exactitude pour \\(k = 1\\), puis pour \\(k = 200\\) ?", "options": [{"id": "a", "texte": "1 pour k = 1, puis 0,6 pour k = 200", "correcte": true, "explication": "Oui : avec \\(k = 1\\) chaque point se retrouve lui-même ; avec \\(k = 200\\) tous les points votent, et la classe 0 gagne partout."}, {"id": "b", "texte": "1 pour k = 1, puis 0,4 pour k = 200", "correcte": false, "explication": "Le cas \\(k = 1\\) est juste, mais avec \\(k = 200\\) le vote donne la classe **majoritaire**, qui est correcte pour 120 points sur 200 ; 0,4 est la part de la classe minoritaire."}, {"id": "c", "texte": "0,6 pour k = 1, puis 1 pour k = 200", "correcte": false, "explication": "Les deux cas sont inversés : c'est le petit \\(k\\) qui colle parfaitement aux données d'entraînement, et le grand \\(k\\) qui les ignore au profit de la classe majoritaire."}, {"id": "d", "texte": "1 pour k = 1, puis 0,5 pour k = 200", "correcte": false, "explication": "0,5 serait l'exactitude d'un tirage à pile ou face entre deux classes équilibrées. Ici le vote est déterministe (120 voix contre 80) et les classes ne sont pas équilibrées."}], "solution": "Réponse : 1 pour \\(k = 1\\), puis 0,6 pour \\(k = 200\\).\n\nÉtape 1, \\(k = 1\\). Le plus proche voisin d'un point d'entraînement est ce point lui-même, à distance 0 ; aucun autre point n'est à distance 0 puisque les points sont distincts. La prédiction est donc l'étiquette du point : exactitude 1 sur l'ensemble d'entraînement, quelle que soit la qualité du modèle.\n\nÉtape 2, \\(k = 200\\). Les \\(k\\) voisins de n'importe quel point sont les 200 points : le vote est toujours 120 voix pour la classe 0 contre 80, et le classifieur prédit 0 partout. Il a raison sur les 120 points de classe 0 : exactitude \\(120/200 = 0{,}6\\).\n\nVérification (script) : implémentation numpy sur 200 points gaussiens, exactitude 1 pour \\(k = 1\\), 0,635 pour \\(k = 15\\), 0,6 pour \\(k = 200\\).\n\nCe que cela montre. \\(k\\) règle le compromis biais-variance : \\(k = 1\\) donne un modèle très flexible (biais faible, variance forte, erreur d'entraînement nulle qui ne dit rien de l'erreur sur de nouvelles données) ; \\(k\\) égal à la taille de l'échantillon donne un modèle constant (variance minimale, biais maximal). On choisit \\(k\\) par validation, jamais sur l'erreur d'entraînement.", "type": "qcm", "multiple": false, "reponse": "1 pour k = 1, puis 0,6 pour k = 200", "fiche": null, "verif": {"script": "verif/test_9_octobre.py", "cles": ["Q15_d_hasard", "Q15_d_minoritaire", "Q15_k1", "Q15_k15", "Q15_kn", "Q15_n", "Q15_n0", "Q15_n1"]}}, {"id": "T9-Q16", "section": "mlf", "theme": "Biais et variance : les quatre cibles", "difficulte": 1, "temps_cible_s": 60, "conceptuelle": true, "correctes": ["b", "c"], "ordre_origine": ["a", "b", "c", "d"], "enonce": "Question 16. Quatre cibles de tir, notées A, B, C et D, illustrent le biais et la variance d'un modèle ; le centre de la cible représente la vraie valeur, chaque impact une prédiction.\n\n- Cible A : les impacts sont très groupés, sur le centre.\n- Cible B : les impacts sont dispersés tout autour du centre, leur nuage est centré sur lui.\n- Cible C : les impacts sont très groupés, mais loin du centre (en haut de la cible).\n- Cible D : les impacts sont dispersés, et leur nuage est loin du centre (en haut à gauche).\n\nQuelles affirmations sont correctes ?", "options": [{"id": "a", "texte": "A a un biais élevé et une variance élevée.", "correcte": false, "explication": "Faux : A est le cas idéal, impacts groupés (variance faible) sur le centre (biais faible). C'est D qui cumule biais élevé et variance élevée."}, {"id": "b", "texte": "B a un biais faible et une variance élevée.", "correcte": true, "explication": "Juste : le nuage est centré sur la cible (en moyenne, on vise juste), mais les impacts sont dispersés."}, {"id": "c", "texte": "C a un biais élevé et une variance faible.", "correcte": true, "explication": "Juste : les impacts sont groupés (peu de dispersion), mais tous décalés du centre de la même façon (erreur systématique)."}, {"id": "d", "texte": "D a un biais faible et une variance faible.", "correcte": false, "explication": "Faux : D est dispersé et décalé, donc biais élevé et variance élevée. La description « biais faible, variance faible » est celle de A."}], "solution": "Réponse : « B a un biais faible et une variance élevée » et « C a un biais élevé et une variance faible ».\n\nLecture de l'image. Chaque impact représente la prédiction d'un modèle entraîné sur un échantillon différent ; le centre est la valeur à prédire. On note \\(\\mathbf{P}\\) la position aléatoire d'un impact, \\(\\mathbf{c}\\) le centre (fixe) et \\(\\mathbf{m} = \\mathbb{E}[\\mathbf{P}]\\) la position moyenne des impacts.\n\n- Le **biais** est l'écart \\(\\mathbf{m} - \\mathbf{c}\\) entre la position moyenne des impacts et le centre : une erreur systématique.\n- La **variance** est \\(\\mathbb{E}[\\lVert \\mathbf{P} - \\mathbf{m} \\rVert^2]\\), la dispersion des impacts autour de leur propre moyenne.\n\n| Cible | Nuage centré sur la cible ? | Impacts groupés ? | Biais | Variance |\n|---|---|---|---|---|\n| A | oui | oui | faible | faible |\n| B | oui | non | faible | élevée |\n| C | non | oui | élevé | faible |\n| D | non | non | élevé | élevée |\n\nLes deux se combinent dans l'erreur quadratique moyenne : \\(\\mathbb{E}[\\lVert \\mathbf{P} - \\mathbf{c} \\rVert^2] = \\lVert \\mathbf{m} - \\mathbf{c} \\rVert^2 + \\mathbb{E}[\\lVert \\mathbf{P} - \\mathbf{m} \\rVert^2]\\). Preuve : on écrit \\(\\mathbf{P} - \\mathbf{c} = (\\mathbf{P} - \\mathbf{m}) + (\\mathbf{m} - \\mathbf{c})\\) et on développe le carré de la norme ; le terme croisé \\(2\\,(\\mathbf{m} - \\mathbf{c})^{\\top}\\,\\mathbb{E}[\\mathbf{P} - \\mathbf{m}]\\) est nul, car \\(\\mathbb{E}[\\mathbf{P} - \\mathbf{m}] = \\mathbf{0}\\) par définition de \\(\\mathbf{m}\\).", "type": "qcm", "multiple": true, "reponse": "B a un biais faible et une variance élevée. ; C a un biais élevé et une variance faible.", "fiche": null, "verif": {"script": "verif/test_9_octobre.py", "cles": []}}]}, {"id": "mla", "nom": "Machine Learning avancé", "budget_min": 15, "questions": [{"id": "T9-Q17", "section": "mla", "theme": "Apprentissage par renforcement", "difficulte": 2, "temps_cible_s": 90, "conceptuelle": true, "correctes": ["a", "b", "c"], "ordre_origine": ["a", "b", "c", "d"], "enonce": "Question 17. Quelles affirmations sur l'apprentissage par renforcement sont correctes ? (Choisis toutes celles qui conviennent.)", "options": [{"id": "a", "texte": "En apprentissage par renforcement, l'agent apprend en recevant un retour sous forme de récompenses ou de pénalités, selon les actions qu'il effectue dans un environnement.", "correcte": true, "explication": "Juste : c'est la définition. Il n'y a pas d'étiquette donnant la bonne action, seulement un signal de récompense qui suit les actions."}, {"id": "b", "texte": "L'objectif d'un agent est de maximiser la récompense cumulée, qu'on appelle le « retour » (return).", "correcte": true, "explication": "Juste : le retour est la somme (actualisée) des récompenses futures, et l'agent cherche la politique qui en maximise l'espérance."}, {"id": "c", "texte": "Dans les méthodes de gradient de politique, la politique est paramétrée et optimisée directement, plutôt que déduite d'une estimation de la fonction de valeur.", "correcte": true, "explication": "Juste : c'est ce qui les oppose aux méthodes fondées sur la valeur (Q-learning), où la politique se déduit d'une fonction de valeur estimée."}, {"id": "d", "texte": "Le compromis exploration-exploitation consiste à choisir les actions au hasard pour que toutes les actions possibles soient explorées également.", "correcte": false, "explication": "Faux : choisir au hasard uniformément, c'est de l'exploration pure, sans exploitation. Le compromis consiste à doser les deux : exploiter l'action estimée la meilleure, tout en essayant parfois les autres."}], "solution": "Réponse : les trois premières affirmations (récompenses et pénalités ; maximisation du retour ; gradient de politique). La quatrième est fausse.\n\nLe cadre. À chaque instant \\(t\\), l'agent observe un état \\(S_t\\), choisit une action \\(A_t\\), reçoit une récompense \\(R_{t+1}\\) (un nombre, négatif pour une pénalité) et passe à l'état \\(S_{t+1}\\). Une politique \\(\\pi\\) est la règle qui donne la probabilité de chaque action dans chaque état. Le retour depuis l'instant \\(t\\) est \\(G_t = R_{t+1} + \\gamma R_{t+2} + \\gamma^2 R_{t+3} + \\dots\\), où \\(\\gamma\\), entre 0 et 1, est le facteur d'actualisation. L'objectif est de trouver la politique qui maximise \\(\\mathbb{E}[G_t]\\).\n\nAffirmation 1 : c'est la définition de l'apprentissage par renforcement ; il n'y a pas d'étiquette donnant la bonne action.\n\nAffirmation 2 : juste, avec une précision. C'est l'**espérance** du retour qui est maximisée (les récompenses sont aléatoires), et le retour est actualisé par \\(\\gamma\\) quand l'horizon est infini.\n\nAffirmation 3 : juste. Deux familles de méthodes. Fondées sur la valeur : on estime \\(q(s, a)\\), l'espérance du retour quand on fait l'action \\(a\\) dans l'état \\(s\\), et la politique s'en déduit (prendre l'action de plus grande valeur). Gradient de politique : la politique \\(\\pi_{\\boldsymbol{\\theta}}\\) dépend d'un vecteur de paramètres \\(\\boldsymbol{\\theta}\\), ajusté par montée de gradient sur l'espérance du retour. Nuance : les méthodes acteur-critique estiment **aussi** une fonction de valeur, pour réduire la variance du gradient ; mais la politique y reste paramétrée et optimisée directement, ce qui est ce qu'affirme la phrase.\n\nAffirmation 4 : fausse. Exploiter, c'est choisir l'action que l'on estime la meilleure ; explorer, c'est en essayer d'autres pour améliorer ses estimations. Choisir toujours au hasard uniformément est de l'exploration pure : l'agent n'utilise jamais ce qu'il a appris. La stratégie epsilon-gloutonne illustre le compromis : avec probabilité \\(1 - \\epsilon\\) on exploite, avec probabilité \\(\\epsilon\\) on tire une action au hasard. Rien n'exige que toutes les actions soient explorées **également**.", "type": "qcm", "multiple": true, "reponse": "En apprentissage par renforcement, l'agent apprend en recevant un retour sous forme de récompenses ou de pénalités, selon les actions qu'il effectue dans un environnement. ; L'objectif d'un agent est de maximiser la récompense cumulée, qu'on appelle le « retour » (return). ; Dans les méthodes de gradient de politique, la politique est paramétrée et optimisée directement, plutôt que déduite d'une estimation de la fonction de valeur.", "fiche": null, "verif": {"script": "verif/test_9_octobre.py", "cles": []}}, {"id": "T9-Q18", "section": "mla", "theme": "Dropout inversé", "difficulte": 3, "temps_cible_s": 120, "enonce": "Question de remplacement (la question d'origine n'a pas été capturée). Question 18. Une couche de dropout « inversé » de taux \\(p = 0{,}2\\) fonctionne ainsi pendant l'entraînement : chaque activation est, indépendamment des autres, mise à 0 avec probabilité \\(p\\), et sinon divisée par \\(1 - p\\). On considère une activation dont la valeur avant dropout est fixée à \\(a = 3\\).\n\nQue valent l'espérance et la variance de sa valeur après dropout, pendant l'entraînement ?", "options": [{"id": "a", "texte": "Espérance 3, variance 2,25", "correcte": true, "explication": "Oui : la valeur est \\(3/0{,}8 = 3{,}75\\) avec probabilité 0,8 et 0 sinon."}, {"id": "b", "texte": "Espérance 2,4, variance 1,44", "correcte": false, "explication": "C'est le dropout **sans** remise à l'échelle : la valeur est 3 avec probabilité 0,8 et 0 sinon. La division par \\(1 - p\\) sert justement à ramener l'espérance à 3."}, {"id": "c", "texte": "Espérance 3, variance 1,44", "correcte": false, "explication": "L'espérance est juste, mais la variance est celle de \\(3M\\), où \\(M\\) vaut 1 avec probabilité 0,8 : il manque le carré du facteur \\(1/(1 - p)\\). La variance exacte est \\(a^2\\,p/(1 - p)\\), pas \\(a^2\\,p\\,(1 - p)\\)."}, {"id": "d", "texte": "Espérance 3,75, variance 0", "correcte": false, "explication": "C'est supposer que l'activation est toujours conservée et divisée par \\(1 - p\\). Elle est mise à 0 avec probabilité 0,2 : la sortie est aléatoire, donc de variance non nulle."}], "solution": "Réponse : espérance 3, variance 2,25.\n\nNotations : \\(M\\) est le masque de l'activation, variable aléatoire qui vaut 1 avec probabilité \\(1 - p = 0{,}8\\) (activation conservée) et 0 avec probabilité \\(p = 0{,}2\\). La valeur après dropout est \\(Z = \\dfrac{M\\,a}{1 - p}\\) : elle vaut \\(3/0{,}8 = 3{,}75\\) ou 0.\n\nÉtape 1, espérance. \\(\\mathbb{E}[Z] = \\dfrac{a}{1 - p}\\,\\mathbb{E}[M] = \\dfrac{a}{1 - p}\\,(1 - p) = a = 3\\). C'est le rôle de la division par \\(1 - p\\) : l'espérance de l'activation est la même à l'entraînement (avec dropout) et à l'inférence (sans dropout, sans facteur).\n\nÉtape 2, variance. \\(M\\) est une variable de Bernoulli, de variance \\(p\\,(1 - p)\\). Donc \\(\\mathrm{Var}(Z) = \\dfrac{a^2}{(1 - p)^2}\\,p\\,(1 - p) = \\dfrac{a^2\\,p}{1 - p} = \\dfrac{9 \\times 0{,}2}{0{,}8} = 2{,}25\\).\n\nVérification (script) : calcul exact en fractions, et simulation d'un million de masques : moyenne 3,000, variance 2,250.\n\nÀ l'inférence, le dropout est désactivé : la sortie vaut \\(a\\), sans bruit. Le dropout ajoute donc du bruit pendant l'entraînement seulement, ce qui agit comme une régularisation.", "type": "qcm", "multiple": false, "reponse": "Espérance 3, variance 2,25", "fiche": null, "verif": {"script": "verif/test_9_octobre.py", "cles": ["Q18_d_esp_sans", "Q18_d_var_p", "Q18_d_var_sans", "Q18_esp", "Q18_esp_mc", "Q18_garde", "Q18_p", "Q18_valeur_gardee", "Q18_var", "Q18_var_mc"]}}, {"id": "T9-Q19", "section": "mla", "theme": "Classes déséquilibrées et variance", "difficulte": 3, "temps_cible_s": 90, "ordre_origine": ["b", "c", "d", "a"], "enonce": "Question 19. On dispose d'un jeu de données dans lequel le nombre d'observations diffère nettement d'une classe à l'autre. Quelle technique est la plus appropriée pour améliorer la performance d'un modèle en traitant d'éventuels problèmes de variance ?", "options": [{"id": "a", "texte": "Appliquer des techniques de régularisation pour réduire la complexité du modèle et éviter le surapprentissage.", "correcte": true, "explication": "Oui, dans la lecture retenue : un « problème de variance » d'un modèle est un surapprentissage, et la régularisation est la technique qui réduit la variance d'un modèle."}, {"id": "b", "texte": "Augmenter la complexité du modèle pour capter plus précisément les structures sous-jacentes des données.", "correcte": false, "explication": "Augmenter la complexité réduit le biais et augmente la variance : c'est le remède au sous-apprentissage, l'inverse de ce qui est demandé."}, {"id": "c", "texte": "Recourir à des tests d'hypothèses pour repérer les différences significatives entre classes et ajuster le modèle en conséquence.", "correcte": false, "explication": "Un test d'hypothèse dit si une différence observée est compatible avec le hasard ; il ne modifie ni la flexibilité du modèle ni sa variance."}, {"id": "d", "texte": "Utiliser un échantillonnage stratifié pour que les ensembles d'entraînement et de test aient une répartition des classes similaire.", "correcte": false, "explication": "C'est l'autre réponse défendable : la stratification est la précaution propre au déséquilibre des classes, et elle réduit la variance de l'**évaluation** (composition des ensembles). Mais elle ne change pas le modèle et ne réduit pas sa variance ; voir la discussion dans la correction."}], "solution": "Réponse : appliquer des techniques de régularisation. C'est la réponse la plus défendable, pas une réponse certaine : la question d'origine est ambiguë, et l'échantillonnage stratifié se défend aussi.\n\nPourquoi la question est ambiguë. Elle réunit deux éléments qui ne pointent pas vers la même option :\n\n- la situation décrite, des classes déséquilibrées, appelle la précaution spécifique à ce cas : l'échantillonnage stratifié ;\n- le but annoncé, « améliorer la performance en traitant des problèmes de variance », et le titre de la question d'origine, qui nomme la régularisation, appellent la régularisation.\n\nCe que fait chaque technique, précisément.\n\n- **Régularisation.** La variance d'un modèle est la sensibilité de ses prédictions à l'échantillon d'entraînement ; un modèle de forte variance surapprend. Pénaliser la taille des coefficients (ou limiter la profondeur d'un arbre, etc.) réduit cette variance au prix d'un peu de biais. Expérience (script, celle de la question 22) : sur 30 points, un polynôme de degré 10 sans pénalité a une erreur de test de 0,453 ; avec une pénalité ridge, 0,181.\n- **Échantillonnage stratifié.** Découper au hasard un jeu déséquilibré peut laisser très peu d'exemples de la classe rare dans l'un des ensembles ; stratifier impose la même proportion de chaque classe dans chaque ensemble. Cela réduit la variance de l'**estimation de la performance** d'un découpage à l'autre. Cela ne modifie pas le modèle, donc pas sa variance au sens du compromis biais-variance, et n'« améliore » sa performance que dans la mesure où l'entraînement dispose d'une part garantie de la classe rare.\n\nPourquoi retenir la régularisation : c'est la seule option qui traite la variance **du modèle**, et qui améliore sa performance sur de nouvelles données ; le titre de la question d'origine va dans le même sens. Pourquoi l'autre lecture se défend : si « problèmes de variance » désigne l'instabilité due à la composition aléatoire des ensembles quand une classe est rare, la stratification est la réponse, et c'est la seule option qui utilise la donnée de l'énoncé (le déséquilibre). La réponse attendue par le correcteur n'est pas connue.\n\nLes deux autres options s'écartent sans hésiter : augmenter la complexité augmente la variance, et un test d'hypothèse ne la traite pas.", "type": "qcm", "multiple": false, "reponse": "Appliquer des techniques de régularisation pour réduire la complexité du modèle et éviter le surapprentissage.", "fiche": null, "verif": {"script": "verif/test_9_octobre.py", "cles": ["Q22_degre", "Q22_n", "Q22_test_ridge", "Q22_test_sans"]}}, {"id": "T9-Q20", "section": "mla", "theme": "Arbres de décision : mécanique", "difficulte": 2, "temps_cible_s": 90, "correctes": ["a", "c"], "ordre_origine": ["a", "b", "c", "d"], "enonce": "Question 20. Quelles affirmations sur le fonctionnement des arbres de décision sont correctes ? (Choisis toutes celles qui conviennent.)", "options": [{"id": "a", "texte": "Dans un arbre de décision, le nœud racine est l'endroit où est choisie la variable la plus significative pour découper les données.", "correcte": true, "explication": "Juste, au sens suivant : la racine porte la coupure qui réduit le plus l'impureté sur l'ensemble des données. « La plus significative » est une formulation vague, discutée dans la correction."}, {"id": "b", "texte": "Les arbres de décision ne traitent que des données catégorielles et exigent que toutes les données numériques soient discrétisées avant l'entraînement.", "correcte": false, "explication": "Faux : sur une variable numérique, l'arbre cherche lui-même un seuil \\(s\\) et coupe selon « valeur inférieure ou égale à \\(s\\) ». Aucune discrétisation préalable n'est nécessaire (l'arbre de l'expérience est entraîné sur deux variables numériques brutes)."}, {"id": "c", "texte": "À chaque nœud, un arbre de décision découpe les données en choisissant la variable qui produit la plus grande réduction d'impureté (par exemple l'impureté de Gini ou l'entropie).", "correcte": true, "explication": "Juste : c'est le critère glouton de construction. Plus précisément, il choisit le couple (variable, seuil) qui maximise cette réduction."}, {"id": "d", "texte": "La profondeur d'un arbre de décision est déterminée par le nombre de variables du jeu de données.", "correcte": false, "explication": "Faux : une même variable peut servir à plusieurs niveaux. Expérience (script) : avec 2 variables et 500 points, un arbre non limité atteint la profondeur 24. La profondeur dépend des données et des critères d'arrêt."}], "solution": "Réponse : « le nœud racine est l'endroit où est choisie la variable la plus significative » et « à chaque nœud, l'arbre choisit la variable qui produit la plus grande réduction d'impureté ».\n\nConstruction d'un arbre (algorithme CART). À un nœud contenant un ensemble d'observations, on note \\(i\\) son impureté : pour la classification, l'impureté de Gini \\(1 - \\sum_c p_c^2\\) ou l'entropie \\(-\\sum_c p_c \\ln p_c\\), où \\(p_c\\) est la proportion de la classe \\(c\\) dans le nœud. Pour chaque variable et chaque seuil possibles, on calcule la réduction d'impureté : l'impureté du nœud moins la moyenne des impuretés des deux nœuds fils, pondérée par leurs effectifs. On retient la coupure qui la maximise, puis on recommence dans chaque fils, jusqu'à un critère d'arrêt (profondeur maximale, effectif minimal, nœud pur).\n\nAffirmation 3 : c'est exactement cette règle. Juste.\n\nAffirmation 1 : la racine applique la règle à l'ensemble des données ; la variable qui y est choisie est celle qui, seule et en une coupure, sépare le mieux les classes. C'est le sens dans lequel elle est « la plus significative », et l'affirmation est retenue comme juste. Réserve : ce n'est pas un test statistique, et ce n'est pas forcément la variable la plus importante de l'arbre entier (une variable peut ne servir qu'en interaction avec une autre, plus bas dans l'arbre).\n\nAffirmation 2 : fausse. Une variable numérique est traitée par seuil, sans discrétisation préalable.\n\nAffirmation 4 : fausse. Expérience (script) : sur 500 points décrits par 2 variables numériques, avec des étiquettes tirées au hasard, un arbre sans limite de profondeur atteint la profondeur 24 et classe parfaitement ses données d'entraînement (exactitude 1) : la profondeur n'est pas bornée par le nombre de variables. Elle est bornée par le nombre d'observations et fixée par les critères d'arrêt.\n\nRemarque sur la question d'origine : l'affirmation 1 est formulée de façon vague. Si le correcteur l'a jugée fausse (au motif que « significative » n'est pas le critère), la seule affirmation juste serait la troisième. La lecture retenue ici est la plus courante.", "type": "qcm", "multiple": true, "reponse": "Dans un arbre de décision, le nœud racine est l'endroit où est choisie la variable la plus significative pour découper les données. ; À chaque nœud, un arbre de décision découpe les données en choisissant la variable qui produit la plus grande réduction d'impureté (par exemple l'impureté de Gini ou l'entropie).", "fiche": null, "verif": {"script": "verif/test_9_octobre.py", "cles": ["Q20_exactitude_train", "Q20_n", "Q20_nb_variables", "Q20_profondeur"]}}, {"id": "T9-Q21", "section": "mla", "theme": "Importance des variables", "difficulte": 3, "temps_cible_s": 120, "correctes": ["a", "c", "d"], "ordre_origine": ["a", "b", "c", "d"], "enonce": "Question 21. Quelles affirmations sur l'importance des variables dans les modèles d'apprentissage automatique sont correctes ? (Choisis toutes celles qui conviennent.)", "options": [{"id": "a", "texte": "Dans les arbres de décision, l'importance d'une variable est calculée à partir de la réduction totale d'impureté (impureté de Gini ou entropie, par exemple) sur tous les nœuds où la variable est utilisée.", "correcte": true, "explication": "Juste : c'est la définition de l'importance par réduction d'impureté, chaque réduction étant pondérée par la part des observations qui passent par le nœud."}, {"id": "b", "texte": "Les importances issues de modèles à base d'arbres, comme les forêts aléatoires, sont toujours fiables et doivent être interprétées directement comme l'importance des variables dans le monde réel.", "correcte": false, "explication": "Faux. Expérience (script) : dans une forêt, une variable de pur bruit reçoit une importance par impureté de 0,43, alors que la mélanger ne dégrade pas la performance sur des données de test."}, {"id": "c", "texte": "L'importance par permutation mesure l'importance d'une variable par la baisse de performance du modèle quand les valeurs de cette variable sont mélangées au hasard.", "correcte": true, "explication": "Juste : c'est sa définition. Mélanger la colonne casse son lien avec la cible en conservant sa loi ; la baisse de performance mesure ce que le modèle tirait de cette variable."}, {"id": "d", "texte": "Une limite des importances tirées de modèles linéaires, comme la régression logistique, est qu'elles supposent des relations linéaires entre les variables et la cible.", "correcte": true, "explication": "Juste : un coefficient résume l'effet d'une variable par une seule pente. Si l'effet réel n'est pas linéaire (ou passe par une interaction), le coefficient le décrit mal. Précision : pour la régression logistique, la linéarité porte sur le logarithme des cotes."}], "solution": "Réponse : les affirmations sur la réduction d'impureté, sur l'importance par permutation et sur la limite des modèles linéaires. Celle qui déclare les importances des forêts « toujours fiables » est fausse.\n\nAffirmation 1, juste. L'importance par réduction d'impureté d'une variable est la somme, sur tous les nœuds où elle sert à couper, de la réduction d'impureté obtenue, pondérée par la proportion des observations d'entraînement qui atteignent le nœud ; dans une forêt, on fait la moyenne sur les arbres, puis on normalise pour que les importances somment à 1.\n\nAffirmation 3, juste. Importance par permutation : on mesure la performance du modèle sur un jeu de données, on mélange au hasard les valeurs d'une colonne, on mesure à nouveau ; l'importance est la baisse de performance.\n\nAffirmation 4, juste. Dans un modèle linéaire, l'importance d'une variable est lue sur son coefficient (après mise à la même échelle des variables). Le modèle suppose que la cible, ou le logarithme des cotes pour la régression logistique, est une fonction linéaire des variables : un effet en U, par exemple, donne un coefficient proche de 0 pour une variable pourtant déterminante.\n\nAffirmation 2, fausse : le mot « toujours » suffit à la réfuter, par un contre-exemple. Expérience (script) : une cible binaire dépend d'une seule variable utile ; on ajoute une variable de bruit continue et une variable de bruit binaire, sans lien avec la cible. Une forêt de 200 arbres non limités donne :\n\n| Variable | Importance par impureté | Importance par permutation, sur données de test |\n|---|---|---|\n| utile | 0,559 | 0,078 |\n| bruit continu | 0,426 | -0,034 |\n| bruit binaire | 0,016 | -0,003 |\n\nLe bruit continu reçoit une importance par impureté du même ordre que la variable utile : les arbres profonds s'en servent pour mémoriser le bruit des données d'entraînement, et une variable continue offre beaucoup plus de seuils qu'une variable binaire. Son importance par permutation sur des données de test est négative ou nulle : elle n'aide pas à prédire. C'est une constatation sur cette expérience, qui suffit comme contre-exemple. Autres causes connues de mauvaise lecture : variables corrélées qui se partagent l'importance, et confusion entre importance pour le modèle et effet causal.\n\nRemarque : cocher les affirmations 1 et 4 seulement laisse de côté la 3, qui est une définition exacte.", "type": "qcm", "multiple": true, "reponse": "Dans les arbres de décision, l'importance d'une variable est calculée à partir de la réduction totale d'impureté (impureté de Gini ou entropie, par exemple) sur tous les nœuds où la variable est utilisée. ; L'importance par permutation mesure l'importance d'une variable par la baisse de performance du modèle quand les valeurs de cette variable sont mélangées au hasard. ; Une limite des importances tirées de modèles linéaires, comme la régression logistique, est qu'elles supposent des relations linéaires entre les variables et la cible.", "fiche": null, "verif": {"script": "verif/test_9_octobre.py", "cles": ["Q21_mdi_bruit_binaire", "Q21_mdi_bruit_continu", "Q21_mdi_utile", "Q21_perm_bruit_binaire", "Q21_perm_bruit_continu", "Q21_perm_utile"]}}, {"id": "T9-Q22", "section": "mla", "theme": "Surapprentissage et régularisation", "difficulte": 2, "temps_cible_s": 75, "ordre_origine": ["b", "a", "c", "d"], "enonce": "Question 22. On dispose d'un jeu de données présentant une variance importante, et l'on veut construire un modèle prédictif de grande exactitude. Quelle technique serait la plus efficace pour traiter le surapprentissage tout en préservant la capacité du modèle à généraliser ?", "options": [{"id": "a", "texte": "Appliquer des techniques de régularisation pour réduire la complexité du modèle.", "correcte": true, "explication": "Oui : la régularisation réduit la variance du modèle, donc le surapprentissage, en conservant toutes les données et toutes les variables."}, {"id": "b", "texte": "Augmenter la complexité du modèle pour capter davantage de variance.", "correcte": false, "explication": "C'est le remède au **sous**-apprentissage. Un modèle plus complexe colle encore mieux aux données d'entraînement, bruit compris : dans l'expérience, passer du degré 10 au degré 15 fait passer l'erreur de test de 0,45 à 18,57."}, {"id": "c", "texte": "Retirer des variables au hasard pour réduire la dimension.", "correcte": false, "explication": "Réduire la dimension peut réduire la variance, mais retirer des variables au hasard risque d'écarter les plus utiles. Une sélection doit être guidée par un critère (pénalité L1, validation)."}, {"id": "d", "texte": "S'en remettre uniquement à des tests d'hypothèses pour sélectionner les variables pertinentes.", "correcte": false, "explication": "Les tests variable par variable ignorent les interactions et, répétés sur beaucoup de variables, laissent passer des faux positifs ; « uniquement » exclut la validation sur des données non vues, qui est le vrai garde-fou."}], "solution": "Réponse : appliquer des techniques de régularisation.\n\nDéfinitions. Un modèle surapprend quand il reproduit le bruit de son échantillon d'entraînement : son erreur d'entraînement est faible, son erreur sur de nouvelles données est grande. Dans la décomposition de l'erreur de prédiction en biais au carré, variance et bruit irréductible, le surapprentissage est un excès de **variance** (sensibilité des prédictions à l'échantillon tiré). Régulariser, c'est ajouter à la perte une pénalité sur la taille des paramètres, ce qui réduit la variance au prix d'un biais.\n\nExpérience (script). Données : 30 points, \\(y = \\sin(3x)\\) plus un bruit de variance 0,09 (aucun modèle ne peut descendre sous cette erreur de test). Modèle : polynôme en \\(x\\), ajusté par moindres carrés.\n\n| Modèle | Erreur quadratique d'entraînement | Erreur quadratique de test |\n|---|---|---|\n| degré 10, sans pénalité | 0,0454 | 0,453 |\n| degré 10, pénalité ridge de coefficient 0,1 | 0,0477 | 0,181 |\n| degré 15, sans pénalité (plus complexe) | 0,0348 | 18,57 |\n\nLa pénalité augmente un peu l'erreur d'entraînement et réduit nettement l'erreur de test. Augmenter la complexité fait l'inverse : l'erreur d'entraînement baisse, l'erreur de test explose. Ce sont des constatations sur un tirage ; le sens de l'effet est celui que prévoit la décomposition biais-variance.\n\nLe piège de formulation. L'option « augmenter la complexité pour capter davantage de variance » joue sur le mot variance : « capter la variance des données » sonne comme une qualité, mais un modèle plus complexe augmente la variance **du modèle**, donc le surapprentissage que la question demande de traiter.\n\nRemarque sur la question d'origine : « un jeu de données présentant une variance importante » ne dit pas de quelle variance il s'agit (dispersion de la cible, bruit, ou variance du modèle). Cela ne change pas la réponse, puisque la question demande explicitement de traiter le surapprentissage.", "type": "qcm", "multiple": false, "reponse": "Appliquer des techniques de régularisation pour réduire la complexité du modèle.", "fiche": null, "verif": {"script": "verif/test_9_octobre.py", "cles": ["Q22_bruit_var", "Q22_degre", "Q22_degre_plus", "Q22_lambda", "Q22_n", "Q22_test_plus", "Q22_test_ridge", "Q22_test_sans", "Q22_train_plus", "Q22_train_ridge", "Q22_train_sans"]}}, {"id": "T9-Q23", "section": "mla", "theme": "Analyse en composantes principales", "difficulte": 3, "temps_cible_s": 120, "correctes": ["a", "b", "d"], "ordre_origine": ["a", "b", "c", "d"], "enonce": "Question 23. Quelles affirmations sur l'usage de l'analyse en composantes principales (ACP) sont correctes ? (Choisis toutes celles qui conviennent.)", "options": [{"id": "a", "texte": "L'ACP sert principalement à réduire la dimension, en transformant les variables d'origine en un ensemble de composantes orthogonales qui captent le maximum de variance des données.", "correcte": true, "explication": "Juste : les composantes sont les projections sur les vecteurs propres de la matrice de covariance, orthogonaux entre eux, rangés par variance décroissante."}, {"id": "b", "texte": "Avant d'appliquer l'ACP, il est essentiel de standardiser les variables (moyenne nulle, variance 1), car l'ACP est sensible à l'échelle des données.", "correcte": true, "explication": "Retenue comme juste : l'ACP est sensible à l'échelle (multiplier une variable par 100 fait passer la part de la première composante de 0,5 à 0,9999 dans l'exemple). Réserve : « essentiel » est trop fort quand toutes les variables ont la même unité ; voir la correction."}, {"id": "c", "texte": "La première composante principale capte toujours plus de 90 % de la variance, quelle que soit la complexité ou la structure des données.", "correcte": false, "explication": "Faux : avec 10 variables non corrélées de même variance, la première composante porte \\(1/10\\) de la variance, soit 10 %."}, {"id": "d", "texte": "Les composantes principales obtenues par ACP sont des combinaisons linéaires des variables d'origine.", "correcte": true, "explication": "Juste : chaque composante est le produit scalaire du vecteur des variables centrées par un vecteur propre de la matrice de covariance."}], "solution": "Réponse : les affirmations sur la réduction de dimension, sur la standardisation et sur les combinaisons linéaires. Celle des « plus de 90 % » est fausse.\n\nRappel. On note \\(\\mathbf{X}\\) le vecteur aléatoire des \\(d\\) variables, \\(\\boldsymbol{\\Sigma}\\) sa matrice de covariance, de valeurs propres \\(\\lambda_1 \\ge \\dots \\ge \\lambda_d \\ge 0\\) et de vecteurs propres orthonormés \\(\\mathbf{w}_1, \\dots, \\mathbf{w}_d\\) (théorème spectral). La \\(j\\)-ième composante principale est \\(\\mathbf{w}_j^{\\top}(\\mathbf{X} - \\mathbb{E}[\\mathbf{X}])\\) ; sa variance vaut \\(\\lambda_j\\) et la part de variance qu'elle porte est \\(\\lambda_j / (\\lambda_1 + \\dots + \\lambda_d)\\).\n\nAffirmation 1, juste : les directions \\(\\mathbf{w}_j\\) sont orthogonales, les composantes sont non corrélées, et \\(\\mathbf{w}_1\\) est la direction de variance maximale. Garder les premières composantes réduit la dimension.\n\nAffirmation 4, juste : \\(\\mathbf{w}_j^{\\top}(\\mathbf{X} - \\mathbb{E}[\\mathbf{X}])\\) est une combinaison linéaire des variables centrées, de coefficients les coordonnées de \\(\\mathbf{w}_j\\). Vérifié sur un échantillon par le script (vecteurs propres orthonormés, composantes non corrélées).\n\nAffirmation 3, fausse, par un contre-exemple exact : si \\(\\boldsymbol{\\Sigma}\\) est la matrice identité de taille 10, toutes les valeurs propres valent 1 et la première composante porte 0,1 de la variance.\n\nAffirmation 2, retenue comme juste, avec une réserve.\n\n- Ce qui est vrai sans réserve : l'ACP dépend de l'échelle. Exemple exact : deux variables non corrélées de variance 1 ; la première composante porte 0,5 de la variance. On exprime la première variable dans une unité 100 fois plus petite : sa variance devient 10000, et la première composante, qui est alors cette variable seule, porte \\(10000/(10000 + 1) = 0{,}9999\\) de la variance. Le résultat reflète le choix d'unité, pas la structure des données. Standardiser revient à faire l'ACP sur la matrice de corrélation.\n- La réserve : « essentiel » est trop général. Le centrage est toujours nécessaire. La réduction à variance 1 l'est quand les variables ont des unités ou des ordres de grandeur différents ; quand elles ont la même unité (des rendements d'actifs, par exemple), l'ACP sur la covariance est légitime et garde l'information de volatilité que la standardisation efface.\n\nConséquence : si le correcteur a jugé l'affirmation 2 fausse à cause du mot « essentiel », la réponse attendue serait réduite aux affirmations 1 et 4. La lecture retenue ici (affirmation 2 juste) est celle de la justification donnée dans la phrase elle-même, « car l'ACP est sensible à l'échelle ».\n\nDans tous les cas, l'affirmation 4 est juste et devait être cochée.", "type": "qcm", "multiple": true, "reponse": "L'ACP sert principalement à réduire la dimension, en transformant les variables d'origine en un ensemble de composantes orthogonales qui captent le maximum de variance des données. ; Avant d'appliquer l'ACP, il est essentiel de standardiser les variables (moyenne nulle, variance 1), car l'ACP est sensible à l'échelle des données. ; Les composantes principales obtenues par ACP sont des combinaisons linéaires des variables d'origine.", "fiche": null, "verif": {"script": "verif/test_9_octobre.py", "cles": ["Q23_dim_iso", "Q23_facteur", "Q23_part_echelle", "Q23_part_egales", "Q23_part_iso", "Q23_part_iso_pct", "Q23_var_apres"]}}, {"id": "T9-Q24", "section": "mla", "theme": "Régularisation L1, L2, Elastic Net", "difficulte": 2, "temps_cible_s": 75, "ordre_origine": ["a", "b", "c", "d"], "enonce": "Question 24. On dispose d'un jeu de données dont l'espace des variables est de grande dimension. Quelle technique de régularisation appliquer pour éviter le surapprentissage tout en conservant l'interprétabilité du modèle ?", "options": [{"id": "a", "texte": "Régularisation L1 (Lasso)", "correcte": true, "explication": "Oui : la pénalité L1 annule exactement une partie des coefficients. Le modèle ne garde que quelques variables, ce qui le rend lisible."}, {"id": "b", "texte": "Régularisation L2 (Ridge)", "correcte": false, "explication": "Ridge évite le surapprentissage, mais il rétrécit les coefficients sans en annuler aucun : dans l'expérience, les 200 coefficients restent non nuls. Un modèle à 200 variables n'est pas plus interprétable qu'avant."}, {"id": "c", "texte": "Régularisation Elastic Net (combinaison de L1 et L2)", "correcte": false, "explication": "Elle annule aussi des coefficients, mais moins que le Lasso à pénalité égale (48 coefficients non nuls contre 11 dans l'expérience). C'est le second choix défendable, utile quand des variables sont très corrélées ; pour l'interprétabilité seule, le Lasso est plus direct."}, {"id": "d", "texte": "Aucune régularisation n'est nécessaire", "correcte": false, "explication": "En grande dimension, c'est l'inverse : avec plus de variables que d'observations (200 contre 50 dans l'expérience), les moindres carrés sans pénalité reproduisent exactement les données d'entraînement, bruit compris."}], "solution": "Réponse : la régularisation L1 (Lasso).\n\nNotations : \\(\\boldsymbol{\\beta}\\) est le vecteur des coefficients du modèle linéaire, \\(\\beta_j\\) son \\(j\\)-ième coefficient, \\(\\lambda > 0\\) le coefficient de pénalité. Ridge ajoute à la somme des carrés des résidus la pénalité \\(\\lambda \\sum_j \\beta_j^2\\) (norme L2 au carré) ; le Lasso ajoute \\(\\lambda \\sum_j \\lvert \\beta_j \\rvert\\) (norme L1) ; Elastic Net ajoute une combinaison des deux.\n\nLes deux mots de l'énoncé. « Éviter le surapprentissage » : les trois pénalités le font, en réduisant la variance. « Conserver l'interprétabilité » en grande dimension : il faut un modèle qui n'utilise que peu de variables, donc des coefficients **exactement nuls**. C'est ce qui distingue L1 de L2.\n\nPourquoi L1 annule et pas L2, dans le cas où les colonnes de la matrice des variables sont orthonormées (cas démontré dans la séance de ML 1, partie Lasso). On note \\(b_j\\) le coefficient des moindres carrés sans pénalité. La solution Ridge est \\(b_j / (1 + \\lambda)\\) : nulle seulement si \\(b_j\\) l'est. La solution du Lasso, pour la perte \\(\\tfrac12 \\lVert \\mathbf{y} - \\mathbf{X}\\boldsymbol{\\beta} \\rVert^2 + \\lambda \\sum_j \\lvert \\beta_j \\rvert\\), est le seuillage doux : \\(b_j - \\lambda\\) si \\(b_j > \\lambda\\), \\(b_j + \\lambda\\) si \\(b_j < -\\lambda\\), et **0** si \\(\\lvert b_j \\rvert \\le \\lambda\\). Tout coefficient plus petit que le seuil est annulé.\n\nExpérience (script) : 50 observations, 200 variables, dont 5 seulement agissent sur la cible.\n\n| Méthode | Coefficients non nuls sur 200 |\n|---|---|\n| Lasso | 11 (dont les 5 variables utiles) |\n| Elastic Net, même coefficient de pénalité, moitié L1 | 48 |\n| Ridge | 200 |\n\nC'est une constatation sur un tirage et un réglage ; le fait que Ridge n'annule aucun coefficient, lui, est général (presque sûrement, pour des données continues).\n\nNuance : Elastic Net est aussi parcimonieux et se défend quand des groupes de variables sont très corrélés (le Lasso en garde alors une par groupe, de façon instable). La question demande une seule technique et met en avant l'interprétabilité : le Lasso est la réponse la plus directe.", "type": "qcm", "multiple": false, "reponse": "Régularisation L1 (Lasso)", "fiche": null, "verif": {"script": "verif/test_9_octobre.py", "cles": ["Q24_lasso_retrouve", "Q24_n", "Q24_nz_enet", "Q24_nz_lasso", "Q24_nz_ridge", "Q24_p", "Q24_utiles"]}}]}]}</script>
<script>
'use strict';
const D = JSON.parse(document.getElementById('donnees').textContent);
const ITEMS = D.sections.flatMap(s => s.questions.map(q => Object.assign({ nomSection: s.nom }, q)));
const CLE = 'atelier-quant:' + D.id;
const SERVEUR = location.protocol.startsWith('http');
// La session survit à un rechargement de l'onglet : on se reconnecte alors au même noyau, variables comprises.
const SESSION = (() => { const neuve = Math.random().toString(36).slice(2) + Date.now().toString(36); try { const s = sessionStorage.getItem('atelier-quant:session') || neuve; sessionStorage.setItem('atelier-quant:session', s); return s; } catch (e) { return neuve; } })();
const page = document.getElementById('page');
const noyauxDemarres = {};
let E = etatNeuf('accueil');

function etatNeuf(phase) { return { phase, courant: 0, debut: null, fin: null, reponses: {}, temps: {}, ordre: {}, cellules: {}, code: {}, controles: {}, ordreControles: {}, vus: {}, partie: {}, enregistrement: null, pauseDepuis: null, pauseTotale: 0 }; }
// Options par défaut : la pause et « Je ne sais pas » sont permis, sauf si l'examen les interdit (examens blancs).
const PAUSE_PERMISE = D.options.pause !== false;
const NSP_PERMIS = D.options.je_ne_sais_pas !== false;
function dureeEcoulee(fin) { return (fin - E.debut - (E.pauseTotale || 0) - (E.pauseDepuis ? fin - E.pauseDepuis : 0)) / 1000; }
const NOTEES = ITEMS.filter(q => q.type !== 'lecon');
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(E)); } catch (e) {} }
function charger() { try { const s = localStorage.getItem(CLE); if (s) E = Object.assign(etatNeuf('accueil'), JSON.parse(s)); } catch (e) {} }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function enLigne(t) { return esc(t).replace(/`([^`]+)`/g, '<code class="sans-math">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

// Markdown réduit : titres #, tableaux |, listes - et 1., paragraphes, `code`, **gras**, blocs entre triples accents graves.
function rendre(t) {
  let h = '';
  String(t).split('```').forEach((bloc, i) => {
    if (i % 2) {
      const info = (bloc.match(/^(\w*)\n/) || [])[1];
      h += '<pre class="sans-math' + (info === 'sortie' ? ' sortie-lecon' : '') + '"><code>' + esc(bloc.replace(/^\w*\n/, '')) + '</code></pre>';
      return;
    }
    const lignes = bloc.split('\n');
    let k = 0;
    while (k < lignes.length) {
      const l = lignes[k];
      if (!l.trim()) { k++; continue; }
      const titre = l.match(/^(#{1,4})\s+(.*)$/);
      if (titre) { const n = Math.min(4, titre[1].length + 1); h += '<h' + n + '>' + enLigne(titre[2]) + '</h' + n + '>'; k++; continue; }
      if (l.trim().startsWith('|')) {
        const rangs = [];
        while (k < lignes.length && lignes[k].trim().startsWith('|')) { rangs.push(lignes[k].trim()); k++; }
        const cellules = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
        h += '<div class="defile"><table><tr>' + cellules(rangs[0]).map(c => '<th>' + enLigne(c) + '</th>').join('') + '</tr>';
        rangs.slice(1).filter(r => !/^\|[\s|:-]+\|$/.test(r)).forEach(r => { h += '<tr>' + cellules(r).map(c => '<td>' + enLigne(c) + '</td>').join('') + '</tr>'; });
        h += '</table></div>'; continue;
      }
      const puce = /^\s*[-*]\s+/, numero = /^\s*\d+\.\s+/;
      if (puce.test(l) || numero.test(l)) {
        const motif = puce.test(l) ? puce : numero, balise = motif === puce ? 'ul' : 'ol';
        h += '<' + balise + '>';
        while (k < lignes.length && motif.test(lignes[k])) { h += '<li>' + enLigne(lignes[k].replace(motif, '')) + '</li>'; k++; }
        h += '</' + balise + '>'; continue;
      }
      const par = [];
      while (k < lignes.length && lignes[k].trim() && !/^(#{1,4}\s|\s*\||\s*[-*]\s|\s*\d+\.\s)/.test(lignes[k])) { par.push(lignes[k]); k++; }
      const texte = par.join('\n').trim();

      const seule = texte.startsWith('\\(') && texte.endsWith('\\)') && texte.indexOf('\\(', 2) < 0;

}

function rendreLecon(q) {

  const genre = t => /preuve/i.test(t) ? 'preuve' : /pi[èe]ge/i.test(t) ? 'pieges' : /exemple|exp[ée]rience/i.test(t) ? 'exemple'
    : /[ée]nonc[ée]/i.test(t) ? 'enonce-bloc' : /intuition/i.test(t) ? 'intuition' : /probl[èe]me/i.test(t) ? 'probleme'

  h += '</nav>';

    h += '<section class="partie" data-partie="' + k + '"' + (k === courante ? '' : ' hidden') + '>';

    p.noeuds.forEach(n => {

        else h += '<div class="bloc ' + g + '"><h4>' + esc(n.textContent) + '</h4>';

// Une question du débrief : en-tête (numéro, titre, verdict), énoncé, réponses côte à côte, rubriques, à retenir.
function ficheDebrief(titre, noeuds) {
  const m = titre.match(/^(Question \d+)\s*:?\s*(.*)$/);
  const gras = n => n.nodeName === 'P' && n.firstChild && n.firstChild.nodeName === 'STRONG' ? n.firstChild.textContent.trim() : '';
  const reste = n => { const c = n.cloneNode(true); c.removeChild(c.firstChild); return c.innerHTML.trim(); };
  let enonce = '', ta = null, attendue = null, verdict = '', corps = '', retenir = '', revoir = '', etat = 'enonce';
  noeuds.forEach(n => {
    const g = gras(n), html = n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    if (/^Ta réponse/.test(g)) { ta = reste(n); etat = 'corps'; }
    else if (/^Réponse attendue/.test(g)) { attendue = reste(n); etat = 'corps'; }
    else if (/^Verdict/.test(g)) { verdict = reste(n); etat = 'corps'; }
    else if (/^À retenir/.test(g)) { retenir = '<h5>À retenir</h5><p>' + reste(n) + '</p>'; etat = 'retenir'; }
    else if (/^Leçon à revoir/.test(g)) { revoir = reste(n); etat = 'fin'; }
    else if (g && n.textContent.trim() === g) { corps += '<h5>' + esc(g.replace(/[.:]\s*$/, '')) + '</h5>'; etat = 'corps'; }
    else if (etat === 'enonce') enonce += n.nodeName === 'P' && /^Type :/.test(n.textContent) ? '<p class="meta">' + n.innerHTML + '</p>' : n.nodeName === 'UL' ? '<ul class="choix">' + n.innerHTML + '</ul>' : html;
    else if (etat === 'retenir') retenir += html;
    else corps += html;
  });
  const brut = verdict.replace(/<[^>]+>/g, '').trim();
  const v = /^juste/i.test(brut) ? ['v-juste', 'Juste'] : /^fausse/i.test(brut) ? ['v-fausse', 'Fausse'] : /^incompl/i.test(brut) ? ['v-incomplete', 'Incomplète']
    : /^non visible/i.test(brut) ? ['', 'Réponse non visible'] : ['', ''];
  const suite = brut.replace(/^[^.]*\.\s*/, '');
  let h = '<article class="fiche ' + v[0] + '"><header class="fiche-tete"><span class="num">' + esc(m[1]) + '</span><span class="titre">' + esc(m[2]) + '</span>'
    + (v[1] ? '<span class="verdict">' + v[1] + '</span>' : '') + '</header><div class="fiche-corps">';
  if (ta === null && attendue === null) return h + enonce + corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '') + '</div></article>';
  h += '<h5>Énoncé</h5>' + enonce;
  h += '<div class="fiche-reponses">' + (ta === null ? '' : '<div><span class="lab">Ta réponse</span>' + ta + '</div>') + '<div><span class="lab">Réponse attendue</span>' + (attendue || '') + '</div></div>';
  if (suite) h += '<p class="meta">' + verdict.replace(/^[^.]*\.\s*/, '') + '</p>';
  h += corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '');
  return h + '</div></article>';
}

async function demarrerNoyau(q, confirmer, reconnexion) {
  if (confirmer && !confirm('Redémarrer le noyau ? Toutes les variables seront perdues.')) return;
  const zone = document.getElementById('versions');
  zone.textContent = 'noyau : démarrage...';
  let v;
  try { v = await api(reconnexion ? '/api/connecter' : '/api/redemarrer', { session: SESSION, dossier: q.dossier }); }
  catch (e) { v = null; }
  if (!v) noyauxDemarres[q.id] = 'noyau injoignable : le serveur lancer.py est-il démarré ?';
  else {
    const etat = v.neuf ? 'noyau neuf' : 'noyau reconnecté, variables conservées';
    noyauxDemarres[q.id] = v.erreur ? 'noyau : ' + v.erreur : etat + ' · Python ' + v.python + ' · pandas ' + v.pandas + ' · numpy ' + v.numpy;
    if (v.neuf) (E.cellules[q.id] || []).forEach(c => c.numero = null);
    sauver(); majNumeros(q);
  }

}

function rendreSortie(c) { return c.sortie || ''; }

// ------------------------------------------------------------------ éditeur
// Monaco (l'éditeur de VS Code) depuis cdnjs ; les suggestions, signatures et aides viennent de jedi
// dans le noyau, qui connaît les variables déjà exécutées. Sans connexion, repli sur une zone de texte simple.
const MONACO_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min';
let MONACO = null, promesseMonaco = null;
const EDITEURS = [];
window.EDITEURS = EDITEURS;
// Monaco annule ses tâches en cours quand on ferme un éditeur ; cette annulation n'est pas une erreur.
window.addEventListener('unhandledrejection', ev => { if (ev.reason && ev.reason.name === 'Canceled') ev.preventDefault(); });
function sombre() { return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; }
function questionCode() { const q = ITEMS[E.courant]; return E.phase === 'epreuve' && q && q.cellules_initiales ? q : null; }
function chargerMonaco() {
  if (promesseMonaco) return promesseMonaco;
  promesseMonaco = new Promise(resolve => {
    const abandon = setTimeout(() => fini(null), 20000);
    function fini(m) { clearTimeout(abandon); if (window.MODE_EDITEUR === undefined) { MONACO = m; window.MODE_EDITEUR = m ? 'monaco' : 'simple'; } resolve(MONACO); }
    const s = document.createElement('script');
    s.src = MONACO_BASE + '/vs/loader.js';
    s.onerror = () => fini(null);
    s.onload = () => {
      window.MonacoEnvironment = { getWorkerUrl: () => 'data:text/javascript;charset=utf-8,' + encodeURIComponent("self.MonacoEnvironment={baseUrl:'" + MONACO_BASE + "/'};importScripts('" + MONACO_BASE + "/vs/base/worker/workerMain.js');") };
      window.require.config({ paths: { vs: MONACO_BASE + '/vs' } });
      window.require(['vs/editor/editor.main'], () => { try { configurerMonaco(window.monaco); fini(window.monaco); } catch (e) { fini(null); } }, () => fini(null));
    };
    document.head.appendChild(s);
  });
  return promesseMonaco;
}
async function aide(type, model, position) {
  const q = questionCode();
  if (!q || !SERVEUR) return null;
  try { return await api('/api/' + type, { session: SESSION, dossier: q.dossier, code: model.getValue(), ligne: position.lineNumber, colonne: position.column - 1 }); }
  catch (e) { return null; }
}
function configurerMonaco(m) {
  const K = m.languages.CompletionItemKind;
  const genres = { module: K.Module, class: K.Class, instance: K.Variable, function: K.Function, param: K.Variable, path: K.File, keyword: K.Keyword, property: K.Property, statement: K.Variable };
  m.languages.registerCompletionItemProvider('python', {
    triggerCharacters: ['.'],
    provideCompletionItems: async (model, position) => {
      const r = await aide('completer', model, position);
      if (!r || !r.completions) return { suggestions: [] };
      const mot = model.getWordUntilPosition(position);
      const plage = new m.Range(position.lineNumber, mot.startColumn, position.lineNumber, mot.endColumn);
      return { suggestions: r.completions.map((c, k) => ({ label: c.nom, kind: genres[c.type] ?? K.Variable, insertText: c.nom, detail: c.description, range: plage, sortText: String(k).padStart(4, '0') })) };
    }
  });
  m.languages.registerSignatureHelpProvider('python', {
    signatureHelpTriggerCharacters: ['(', ','],
    provideSignatureHelp: async (model, position) => {
      const r = await aide('signatures', model, position);
      if (!r || !r.signatures || !r.signatures.length) return null;
      return { value: { signatures: r.signatures.map(x => ({ label: x.texte, documentation: x.doc, parameters: x.parametres.map(p => ({ label: p })) })), activeSignature: 0, activeParameter: r.signatures[0].index ?? 0 }, dispose() {} };
    }
  });
  m.languages.registerHoverProvider('python', {
    provideHover: async (model, position) => {
      const r = await aide('aide', model, position);
      if (!r || !r.aide || !r.aide.length) return null;
      return { contents: r.aide.map(a => ({ value: '```text\n' + a.doc + '\n```' })) };
    }
  });
}
function creerEditeur(conteneur, code, rappels) {
  if (MONACO) {
    const m = MONACO;
    const ed = m.editor.create(conteneur, {
      value: code, language: 'python', theme: sombre() ? 'vs-dark' : 'vs', fontSize: 14, tabSize: 4, insertSpaces: true,
      minimap: { enabled: false }, scrollBeyondLastLine: false, automaticLayout: true, lineNumbersMinChars: 3, folding: false,
      glyphMargin: false, renderLineHighlight: 'none', overviewRulerLanes: 0, wordBasedSuggestions: 'off', fixedOverflowWidgets: true,
      quickSuggestions: { other: true, comments: false, strings: false }, padding: { top: 6, bottom: 6 },
      scrollbar: { alwaysConsumeMouseWheel: false, vertical: 'hidden', horizontalScrollbarSize: 8 }
    });
    // Sous Windows, Monaco utilise des fins de ligne \r\n ; le code est toujours lu avec des \n, comme dans un notebook.
    const lire = () => ed.getModel().getValue(m.editor.EndOfLinePreference.LF);
    const hauteur = () => { conteneur.style.height = Math.max(38, ed.getContentHeight()) + 'px'; };
    ed.onDidContentSizeChange(hauteur); hauteur();
    ed.onDidChangeModelContent(() => rappels.modif(lire()));
    ed.onDidFocusEditorText(rappels.focus);
    ed.addCommand(m.KeyMod.Shift | m.KeyCode.Enter, rappels.executerSuivant, '!suggestWidgetVisible');
    ed.addCommand(m.KeyMod.CtrlCmd | m.KeyCode.Enter, rappels.executer, '!suggestWidgetVisible');
    return { brut: ed, getValue: lire, setValue: v => ed.setValue(v), focus: () => ed.focus(), dispose: () => ed.dispose() };
  }
  const zone = document.createElement('textarea');
  zone.spellcheck = false; zone.autocomplete = 'off'; zone.className = 'sans-math';
  zone.value = code;
  conteneur.appendChild(zone);
  zone.addEventListener('input', () => { rappels.modif(zone.value); ajuster(zone); });
  zone.addEventListener('focus', rappels.focus);
  zone.addEventListener('keydown', ev => clavier(ev, zone, rappels));
  setTimeout(() => ajuster(zone));
  return { brut: zone, getValue: () => zone.value, setValue: v => { zone.value = v; zone.dispatchEvent(new Event('input')); }, focus: () => zone.focus(), dispose: () => {} };
}
function libererEditeurs() { EDITEURS.forEach(e => e.dispose()); EDITEURS.length = 0; }

function dessinerCellules(q) {
  const conteneur = document.getElementById('cellules');
  if (!conteneur) return;
  if (SERVEUR && window.MODE_EDITEUR === undefined) {
    conteneur.innerHTML = '<p class="meta">Chargement de l\'éditeur...</p>';
    chargerMonaco().then(() => { if (questionCode() === q) dessinerCellules(q); });
    return;
  }
  libererEditeurs();
  conteneur.innerHTML = '';
  const etat = document.getElementById('modeEditeur');
  if (etat) etat.textContent = MONACO ? 'éditeur VS Code, autocomplétion' : 'éditeur simple' + (SERVEUR ? ' (Monaco injoignable)' : '');
  E.cellules[q.id].forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'cellule';
    div.innerHTML = '<div class="numero">[' + (c.numero === null ? ' ' : c.numero) + ']</div><div><div class="editeur"></div>'
      + '<div class="actions"><button data-a="executer">Exécuter</button><button data-a="dessous">Insérer dessous</button><button data-a="supprimer">Supprimer</button></div>'
      + '<pre class="sortie sans-math"></pre></div>';
    div.querySelector('pre.sortie').innerHTML = rendreSortie(c);
    conteneur.appendChild(div);
    EDITEURS.push(creerEditeur(div.querySelector('.editeur'), c.code, {
      modif: v => { c.code = v; sauver(); },
      focus: () => { conteneur.querySelectorAll('.cellule').forEach(x => x.classList.remove('active')); div.classList.add('active'); },
      executer: () => executerCellule(q, i),
      executerSuivant: () => {
        executerCellule(q, i);
        if (i === E.cellules[q.id].length - 1) { E.cellules[q.id].push({ code: '', sortie: '', numero: null }); sauver(); dessinerCellules(q); }
        focaliser(i + 1);
      }
    }));
    div.querySelector('[data-a=executer]').onclick = () => executerCellule(q, i);
    div.querySelector('[data-a=dessous]').onclick = () => { E.cellules[q.id].splice(i + 1, 0, { code: '', sortie: '', numero: null }); sauver(); dessinerCellules(q); focaliser(i + 1); };
    div.querySelector('[data-a=supprimer]').onclick = () => { if (E.cellules[q.id].length > 1) { E.cellules[q.id].splice(i, 1); sauver(); dessinerCellules(q); } };
  });
}
function majNumeros(q) { document.querySelectorAll('#cellules .numero').forEach((n, i) => { const c = E.cellules[q.id][i]; n.textContent = '[' + (c && c.numero !== null ? c.numero : ' ') + ']'; }); }
function ajuster(zone) { zone.style.height = 'auto'; zone.style.height = (zone.scrollHeight + 2) + 'px'; }
function focaliser(i) { const e = EDITEURS[i]; if (e) e.focus(); }
function inserer(zone, texte) {
  zone.focus();
  if (!document.execCommand('insertText', false, texte)) zone.setRangeText(texte, zone.selectionStart, zone.selectionEnd, 'end');
  zone.dispatchEvent(new Event('input'));
}
function clavier(ev, zone, rappels) {
  if (ev.key === 'Enter' && (ev.shiftKey || ev.ctrlKey)) {
    ev.preventDefault();
    if (ev.shiftKey) rappels.executerSuivant(); else rappels.executer();
    return;
  }
  const debut = zone.selectionStart, fin = zone.selectionEnd, v = zone.value;
  const debutLigne = v.lastIndexOf('\n', debut - 1) + 1;
  if (ev.key === 'Tab') {
    ev.preventDefault();
    const multi = v.slice(debut, fin).includes('\n');
    if (!ev.shiftKey && !multi) { inserer(zone, '    '); return; }
    const finBloc = fin;
    const bloc = v.slice(debutLigne, finBloc);
    const nouveau = ev.shiftKey ? bloc.replace(/^ {1,4}/gm, '') : bloc.replace(/^/gm, '    ');
    zone.setSelectionRange(debutLigne, finBloc);
    inserer(zone, nouveau);
    zone.setSelectionRange(debutLigne, debutLigne + nouveau.length);
    return;
  }
  if (ev.key === 'Enter' && !ev.altKey && !ev.metaKey) {
    ev.preventDefault();
    const ligne = v.slice(debutLigne, debut);
    let retrait = ligne.match(/^ */)[0];
    if (/:\s*(#.*)?$/.test(ligne)) retrait += '    ';
    inserer(zone, '\n' + retrait);
  }
}

async function executerCellule(q, i) {
  if (!SERVEUR) return false;
  const c = E.cellules[q.id][i];
  const div = document.querySelectorAll('#cellules .cellule')[i];
  if (div) { div.querySelector('.numero').textContent = '[*]'; div.querySelector('pre.sortie').innerHTML = ''; }
  let r;
  try { r = await api('/api/executer', { session: SESSION, dossier: q.dossier, code: c.code, nom: 'cellule ' + (i + 1) }); }
  catch (e) { r = { erreur: 'Serveur injoignable : lancer.py est-il démarré ?' }; }
  E.compteur = (E.compteur || 0) + 1;
  c.numero = E.compteur;
  let h = '';
  if (r.sortie) h += esc(r.sortie);
  if (r.valeur !== null && r.valeur !== undefined) h += (h && !h.endsWith('\n') ? '\n' : '') + esc(r.valeur);
  if (r.erreur) h += (h && !h.endsWith('\n') ? '\n' : '') + '<span class="erreur">' + esc(r.erreur) + '</span>';
  if (r.redemarre) { noyauxDemarres[q.id] = 'noyau redémarré : variables perdues'; const z = document.getElementById('versions'); if (z) z.textContent = noyauxDemarres[q.id]; }
  c.sortie = h;
  sauver();
  const d = document.querySelectorAll('#cellules .cellule')[i];
  if (d) { d.querySelector('.numero').textContent = '[' + c.numero + ']'; d.querySelector('pre.sortie').innerHTML = h; }
  return !r.erreur;
}

function codeSource(q) { return E.cellules[q.id].map((c, i) => '# %% cellule ' + (i + 1) + '\n' + c.code).join('\n\n') + '\n'; }
function afficherEtatSoumission(q) {

// ------------------------------------------------------------------ bilan
function points(q) {
  if (q.type === 'code') { const c = E.code[q.id]; return c && c.soumissions ? c.caches_reussis / c.caches_total : 0; }
  const r = E.reponses[q.id];
  if (r === undefined || r === 'nsp') return 0;
  // Une question à plusieurs réponses est notée tout ou rien : l'ensemble coché doit être exactement l'ensemble juste.
  const s = choisies(q), bonnes = q.options.filter(o => o.correcte).map(o => o.id);
  return s.length === bonnes.length && bonnes.every(b => s.includes(b)) ? 1 : -D.options.penalite;
}
function choisies(q) { const r = E.reponses[q.id]; return r === undefined || r === 'nsp' ? [] : Array.isArray(r) ? r.slice() : [r]; }
function texteOption(q, id) { const o = q.options.find(x => x.id === id); return o ? o.texte : null; }

function resultatJSON(duree) {
  return {
    examen: D.id, debut: new Date(E.debut).toISOString(), duree_s: Math.round(duree), pauses_s: Math.round((E.pauseTotale || 0) / 1000), options: D.options,
    lecons: ITEMS.filter(q => q.type === 'lecon').map(q => {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      return { id: q.id, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), controles_justes_du_premier_coup: justes, controles_total: ids.length };
    }),
    questions: NOTEES.map(q => {
      const base = { id: q.id, type: q.type, section: q.section, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), temps_cible_s: q.temps_cible_s, points: Number(points(q).toFixed(4)) };
      if (q.type === 'code') {
        const c = E.code[q.id] || {};
        return Object.assign(base, { soumissions: c.soumissions || 0, caches_reussis: c.caches_reussis || 0, caches_total: c.caches_total || q.tests_caches, visibles_reussis: c.visibles_reussis ?? null, code_source: c.code_source || codeSource(q) });
      }
      const r = E.reponses[q.id] ?? null;
      return Object.assign(base, { reponse: r, reponse_texte: r && r !== 'nsp' ? choisies(q).map(i => texteOption(q, i)).join(' ; ') : null, bonne_reponse_texte: q.options.filter(o => o.correcte).map(o => o.texte).join(' ; ') });
    })
  };
}

function bilan() {
  page.className = '';
  document.getElementById('position').textContent = 'Bilan';
  const duree = dureeEcoulee(E.fin);
  document.getElementById('chrono').textContent = mmss(duree);
  let total = 0;
  let h = '<div class="carte"><h2>Bilan</h2>@SCORE@<div class="defile"><table><tr><th>Section</th><th class="nombre">Score</th><th class="nombre">Temps passé</th><th class="nombre">Temps indicatif</th></tr>';

  });

  h = h.replace('@SCORE@', '<div class="score-total"><strong>' + total.toFixed(2).replace('.', ',').replace(/,00$/, '') + ' / ' + NOTEES.length + '</strong><span class="meta">en ' + mmss(duree) + '</span></div>');
  const barreFin = document.querySelector('#progression > span'); if (barreFin) barreFin.style.width = '100%';
  h += '<p id="enregistrement" class="meta"></p>';
  h += '<details><summary>Résultat brut (JSON)</summary><textarea readonly class="json sans-math" id="json"></textarea><div class="barre"><button id="telecharger">Enregistrer le fichier</button></div></details>';
  h += '<div class="barre">' + (SERVEUR ? '<button class="principal" id="retourAccueil">Retour à l\'accueil (séance suivante)</button>' : '')
    + '<button id="recommencer">Effacer et recommencer</button></div></div>';
  ITEMS.forEach((q, i) => {
    const temps = mmss(E.temps[q.id] || 0) + ' sur ' + mmss(q.temps_cible_s) + ' visés';
    const tete = (classe, verdict) => '<article class="fiche ' + classe + '"><header class="fiche-tete"><span class="num">' + (q.type === 'lecon' ? 'Leçon' : 'Question ' + (i + 1)) + '</span><span class="titre">' + esc(q.theme)
      + '</span><span class="temps">' + esc(q.nomSection) + ' · ' + temps + '</span>' + (verdict ? '<span class="verdict">' + verdict + '</span>' : '') + '</header><div class="fiche-corps">';
    if (q.type === 'lecon') {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      h += tete('', '') + '<p>Points de contrôle justes du premier coup : ' + justes + ' sur ' + ids.length + '. La leçon reste consultable depuis la séance.</p></div></article>';
      return;
    }
    if (q.type === 'qcm') {
      const r = E.reponses[q.id], juste = points(q) === 1;
      const s = choisies(q), incomplete = !juste && q.multiple && s.length > 0 && s.every(id => q.options.find(o => o.id === id).correcte);
      h += tete(juste ? 'v-juste' : incomplete ? 'v-incomplete' : r === undefined || r === 'nsp' ? '' : 'v-fausse',
        juste ? 'Juste' : r === undefined ? 'Sans réponse' : r === 'nsp' ? 'Je ne sais pas' : incomplete ? 'Incomplète' : 'Fausse');
      h += '<h5>Énoncé</h5>' + rendre(q.enonce) + '<h5>' + (q.multiple ? 'Options (plusieurs réponses, tout ou rien)' : 'Options') + '</h5>';
      E.ordre[q.id].forEach((oid, k) => {
        const o = q.options.find(x => x.id === oid), choisie = s.includes(oid);
        const puces = (o.correcte ? '<span class="puce bon">' + (q.multiple ? 'Juste' : 'Bonne réponse') + '</span>' : '') + (choisie ? '<span class="puce' + (o.correcte ? ' bon' : ' faux') + '">Ta réponse</span>' : '');
        h += '<div class="option ' + (o.correcte ? 'juste' : 'fausse') + (choisie ? ' choisie' : '') + '"><span class="lettre">' + 'ABCDE'[k] + '</span><div>' + puces + rendre(o.texte)
          + '<div class="explication">' + (o.correcte && !q.multiple ? '' : rendre(o.explication)) + '</div></div></div>';
      });
      h += '<h5>Correction</h5>' + rendre(q.solution);
    } else {
      const c = E.code[q.id] || {};
      const tout = c.soumissions && c.caches_reussis === c.caches_total;
      h += tete(tout ? 'v-juste' : c.soumissions ? 'v-incomplete' : '', c.soumissions ? c.caches_reussis + ' / ' + c.caches_total + ' tests cachés' : 'Jamais soumis');
      h += '<details><summary>Énoncé</summary>' + rendre(q.enonce) + '</details>';
      if (c.details) {
        h += '<h5>Tests cachés</h5><div class="defile"><table><tr><th>Test caché</th><th>Résultat</th><th>Attendu</th><th>Obtenu</th></tr>';
        c.details.forEach(t => { h += '<tr><td>' + esc(t.nom) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec') + '</td><td><code class="sans-math">' + esc(t.attendu) + '</code></td><td><code class="sans-math">' + esc(t.obtenu ?? (t.erreur ? 'exception' : '')) + '</code></td></tr>'; });
        h += '</table></div>';
        c.details.filter(t => t.erreur).forEach(t => { h += '<details><summary>Erreur : ' + esc(t.nom) + '</summary><pre class="sans-math">' + esc(t.erreur) + '</pre></details>'; });
      }
      h += '<details><summary>Ton code soumis</summary><pre class="sans-math"><code>' + esc(c.code_source || codeSource(q)) + '</code></pre></details>';
      h += '<details><summary>Correction</summary>' + rendre(q.solution) + '</details>';
    }
    h += '<p class="revoir">Vérification des nombres : <code class="sans-math">' + esc(q.verif.script) + '</code></p></div></article>';
  });
  page.innerHTML = h;
  const resultat = resultatJSON(duree);
  const zone = document.getElementById('json');
  zone.value = JSON.stringify(resultat, null, 1);
  document.getElementById('telecharger').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([zone.value], { type: 'application/json' }));
    a.download = D.id + '_resultat.json'; a.click();
  };
  const retour = document.getElementById('retourAccueil'); if (retour) retour.onclick = () => { location.href = '/'; };
  document.getElementById('recommencer').onclick = () => { if (confirm('Effacer ce passage ?')) { try { localStorage.removeItem(CLE); } catch (e) {} E = etatNeuf('accueil'); afficher(); } };
  const info = document.getElementById('enregistrement');
  if (E.enregistrement) info.textContent = E.enregistrement;
  else if (!SERVEUR) info.textContent = 'Page ouverte comme un fichier : le résultat n\'est pas enregistré automatiquement. Copie le JSON ci-dessous dans la conversation.';
  else {
    info.textContent = 'Enregistrement du résultat...';
    api('/api/resultat', resultat).then(r => {
      E.enregistrement = r.erreur ? null : 'Résultat enregistré dans ' + r.fichier + ' ; ' + r.erreurs_ajoutees + ' erreur(s) ajoutée(s) au journal suivi/erreurs.md.';
      info.textContent = E.enregistrement || 'Échec de l\'enregistrement : ' + r.erreur;
      sauver();
    }).catch(() => { info.textContent = 'Serveur injoignable : le résultat n\'est pas enregistré. Copie le JSON ci-dessous dans la conversation.'; });
  }
  composer();
}

function afficher() {
  libererEditeurs();
  document.getElementById('titre').textContent = D.titre;
  document.title = D.titre;
  if (E.phase === 'epreuve') epreuve(); else if (E.phase === 'bilan') bilan(); else accueil();
  window.scrollTo(0, 0);
}
function completerEtat() {
  ['reponses', 'temps', 'ordre', 'cellules', 'code', 'controles', 'ordreControles', 'vus', 'partie'].forEach(k => { if (!E[k] || typeof E[k] !== 'object') E[k] = {}; });
  if (typeof E.courant !== 'number' || E.courant < 0 || E.courant >= ITEMS.length) E.courant = 0;
  ITEMS.forEach(q => {
    if (q.cellules_initiales && !Array.isArray(E.cellules[q.id])) E.cellules[q.id] = q.cellules_initiales.map(c => ({ code: c, sortie: '', numero: null }));
    if (q.type === 'qcm') {
      const ids = q.options.map(o => o.id);
      const o = E.ordre[q.id];
      if (!Array.isArray(o) || o.length !== ids.length || !ids.every(i => o.includes(i))) E.ordre[q.id] = melanger(ids);
      const rep = E.reponses[q.id];
      if (rep !== undefined && rep !== 'nsp' && (Array.isArray(rep) !== !!q.multiple || !choisies(q).length || !choisies(q).every(i => ids.includes(i)))) delete E.reponses[q.id];
    }
    if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => {
      const cle = q.id + ':' + cid;
      if (!Array.isArray(E.ordreControles[cle])) E.ordreControles[cle] = melanger(c.options.map(o => o.id));
    });
  });
}
charger();
completerEtat();
if (SERVEUR && ITEMS.some(q => q.cellules_initiales)) chargerMonaco();
afficher();
</script>
