 (convention de l'énoncé).\n    r = (prix.shift(-1) / prix - 1).fillna(0.0)\n    # 3. Éligibles en t : signal et prix connus en t. Aucune information de t+1 n'intervient ici.\n    eligible = prix.notna() & signal.notna()\n    # 4. Rangs 1..n_t ; method=\"first\" départage les égalités par position de colonne, donc par actif croissant.\n    rang = signal.where(eligible).rank(axis=1, method=\"first\")\n    n = eligible.sum(axis=1)\n    k = n // nb_groupes\n    long_ = rang.gt(n - k, axis=0)\n    court = rang.le(k, axis=0)\n    # 5. Poids +1/k et -1/k ; k = 0 : aucune position, rendement 0.\n    pf = (r.where(long_).sum(axis=1) - r.where(court).sum(axis=1)) / k.where(k > 0)\n    pf = pf.fillna(0.0).iloc[:-1].astype(float)  # la dernière date n'a pas de rendement réalisé\n    return pf, sharpe_annualise(pf)\n\n\ndef backtest_pur(lignes, nb_groupes):\n    \"\"\"lignes : liste de (date, actif, prix, signal). Renvoie ([(date, rendement)], sharpe).\"\"\"\n    par_date = {}\n    for date, actif, p, s in lignes:\n        par_date.setdefault(date, {})[actif] = (p, s)\n    dates = sorted(par_date)\n    serie = []\n    for t, suivante in zip(dates, dates[1:]):\n        eligibles = sorted((s, a) for a, (p, s) in par_date[t].items() if not (_nan(p) or _nan(s)))\n        k = len(eligibles) // nb_groupes\n        if k == 0:\n            serie.append((t, 0.0))\n            continue\n\n        def rendement(a):\n            p1 = par_date[suivante].get(a, (NAN, NAN))[0]\n            return 0.0 if _nan(p1) else p1 / par_date[t][a][0] - 1\n\n        courts = [a for _, a in eligibles[:k]]\n        longs = [a for _, a in eligibles[-k:]]\n        serie.append((t, sum(rendement(a) for a in longs) / k - sum(rendement(a) for a in courts) / k))\n    valeurs = [v for _, v in serie]\n    if len(valeurs) < 2 or len(set(valeurs)) == 1:\n        return serie, NAN\n    moy = sum(valeurs) / len(valeurs)\n    et = math.sqrt(sum((v - moy) ** 2 for v in valeurs) / (len(valeurs) - 1))\n    return serie, math.sqrt(JOURS_PAR_AN) * moy / et\n```"}, {"id": "S2-E3", "type": "code", "section": "code", "theme": "pandas : normalisation transversale et winsorisation", "difficulte": 3, "temps_cible_s": 600, "enonce": "## Exercice 3 : winsorisation, z-score et rang par date\n\nDéfinis `normaliser(df, q_bas, q_haut)`.\n\n**Entrée.** `df` est un DataFrame aux colonnes `date` (chaîne), `actif` (chaîne), `signal` (nombre ou `NaN`), lignes dans un ordre quelconque, index quelconque sans doublon, éventuellement vide. `q_bas` et `q_haut` sont deux nombres vérifiant 0 ≤ `q_bas` < `q_haut` ≤ 1.\n\n**Calcul, date par date.** Pour une date, soit \\(n\\) le nombre de ses signaux **non manquants**, et \\(x_{(1)} \\le \\dots \\le x_{(n)}\\) ces signaux triés.\n\n1. **Quantiles.** Pour un niveau \\(q\\), on pose \\(h = (n - 1)\\,q\\), \\(i = \\lfloor h \\rfloor\\) et \\(f = h - i\\) ; le quantile vaut \\(x_{(i+1)} + f\\,\\bigl(x_{(i+2)} - x_{(i+1)}\\bigr)\\), ou \\(x_{(i+1)}\\) si \\(f = 0\\). On note \\(b\\) le quantile de niveau `q_bas` et \\(c\\) celui de niveau `q_haut`.\n2. **Winsorisation.** Le signal winsorisé d'une ligne de signal \\(x\\) est \\(w = \\min(\\max(x, b), c)\\).\n3. **z-score.** \\(z = (w - \\bar w)/s\\), où \\(\\bar w\\) est la moyenne des \\(n\\) valeurs winsorisées de la date et \\(s\\) leur écart-type à dénominateur \\(n - 1\\). `NaN` si \\(n < 2\\) ou si les \\(n\\) valeurs winsorisées sont toutes égales.\n4. **Rang.** Rang du signal **brut** parmi les \\(n\\) signaux non manquants de la date, par ordre croissant à partir de 1, les valeurs égales recevant la moyenne des rangs qu'elles occupent, puis divisé par \\(n\\).\n\n**Sortie.** Un DataFrame **ayant le même index que `df`**, aux colonnes `w`, `z`, `rang` dans cet ordre, de flottants. Une ligne de signal `NaN` a `NaN` dans les trois colonnes.\n\n**Exemple.**\n\n| index | date | actif | signal |\n|---|---|---|---|\n| 0 | 2026-01-05 | A | 3 |\n| 1 | 2026-01-06 | A | 7 |\n| 2 | 2026-01-05 | B | 100 |\n| 3 | 2026-01-05 | C | 1 |\n| 4 | 2026-01-07 | A | 5 |\n| 5 | 2026-01-05 | D | 4 |\n| 6 | 2026-01-05 | E | NaN |\n| 7 | 2026-01-05 | F | 2 |\n| 8 | 2026-01-07 | B | 5 |\n\nAvec `q_bas = 0.25` et `q_haut = 0.75` : le 2026-01-05, les signaux triés sont 1, 2, 3, 4, 100, donc \\(n = 5\\) ; \\(h = 1\\) donne \\(b = 2\\), \\(h = 3\\) donne \\(c = 4\\). Valeurs winsorisées : A 3, B 4, C 2, D 4, F 2, de moyenne 3 et d'écart-type 1 (somme des carrés des écarts 4, divisée par 4).\n\n| index | w | z | rang |\n|---|---|---|---|\n| 0 | 3 | 0 | 0.6 |\n| 1 | 7 | NaN (une seule valeur) | 1 |\n| 2 | 4 | 1 | 1 |\n| 3 | 2 | -1 | 0.2 |\n| 4 | 5 | NaN (valeurs égales) | 0.75 |\n| 5 | 4 | 1 | 0.8 |\n| 6 | NaN | NaN | NaN |\n| 7 | 2 | -1 | 0.4 |\n| 8 | 5 | NaN (valeurs égales) | 0.75 |\n\nAvec `q_bas = 0.1` et `q_haut = 0.9`, le 2026-01-05 : \\(h = 0{,}4\\), \\(b = 1 + 0{,}4 \\times (2 - 1) = 1{,}4\\) ; \\(h = 3{,}6\\), \\(c = 4 + 0{,}6 \\times (100 - 4) = 61{,}6\\). Valeurs winsorisées : A 3, B 61,6, C 1,4, D 4, F 2, de moyenne 14,40 et d'écart-type 26,4042 ; z-scores : A -0,4318, B 1,7876, C -0,4923, D -0,3939, F -0,4696 (à 4 décimales). Les rangs ne changent pas.\n\n**Ce que vise l'exercice.** Toutes les statistiques sont **par date** (leçon, section 5). Pièges couverts par les tests cachés : quantiles calculés sur tout le cadre, écart-type à dénominateur \\(n\\) (qui donnerait à B le z-score 1,9986 au lieu de 1,7876), rang calculé sur le signal winsorisé, valeurs toutes égales dont l'écart-type calculé n'est pas exactement nul.\n\n\n**Fonctionnement.** Notebook sous Python 3.9 et pandas 1.4.2. Tolérance de comparaison des nombres : `1e-9` ; limite de temps : 10 secondes par test. **Tests visibles** exécute 2 tests visibles ; **Soumettre** exécute 8 tests cachés et n'affiche que leurs noms et leur résultat.\n", "dossier": "coding/seance2", "module_tests": "coding/seance2/tests_e3.py", "fonction": "normaliser", "cellules_initiales": ["import numpy as np\nimport pandas as pd\n\nexemple = pd.DataFrame(\n    [(\"2026-01-05\", \"A\", 3.0), (\"2026-01-06\", \"A\", 7.0), (\"2026-01-05\", \"B\", 100.0), (\"2026-01-05\", \"C\", 1.0),\n     (\"2026-01-07\", \"A\", 5.0), (\"2026-01-05\", \"D\", 4.0), (\"2026-01-05\", \"E\", np.nan), (\"2026-01-05\", \"F\", 2.0),\n     (\"2026-01-07\", \"B\", 5.0)],\n    columns=[\"date\", \"actif\", \"signal\"])\nexemple", "def normaliser(df: pd.DataFrame, q_bas: float, q_haut: float) -> pd.DataFrame:\n    # À compléter\n    return pd.DataFrame(np.nan, index=df.index, columns=[\"w\", \"z\", \"rang\"])", "normaliser(exemple, 0.25, 0.75)"], "tests_visibles": 2, "tests_caches": 8, "fichier_correction": "coding/seance2/_correction.py", "verif": {"script": "coding/seance2/tests_e3.py"}, "fiche": null, "solution": "Correction commentée, avec une version pandas et une version sans bibliothèque externe (`coding/seance2/_correction.py`) :\n\n```python\n\"\"\"Corrections de la séance de code 2. À n'ouvrir qu'après avoir tenté les exercices.\n\nChaque fonction existe en deux versions indépendantes : pandas, et sans bibliothèque externe\n(bibliothèque standard seulement : math, calendar). Les tests exigent qu'elles soient d'accord.\nTestées avec pandas 1.4.2 (environnement des notebooks de la plateforme) et pandas 2.3.3.\n\"\"\"\nimport calendar\nimport math\n\nimport numpy as np\nimport pandas as pd\n\nNAN = float(\"nan\")\n\n\ndef _nan(x):\n    return isinstance(x, float) and math.isnan(x)\n\n\n# ------------------------------------------------------------------ exercice 1\ndef moyenne_glissante(df: pd.DataFrame, fenetre: int, min_periodes: int) -> pd.Series:\n    if df.empty:\n        return pd.Series(np.nan, index=df.index, dtype=float)\n    # 1. Trier par date : rolling, comme shift, travaille dans l'ordre des lignes.\n    #    Trier par date suffit, car groupby conserve l'ordre des lignes à l'intérieur de chaque actif.\n    d = df.sort_values(\"date\")\n    # 2. La fenêtre glisse À L'INTÉRIEUR de chaque actif : sans groupby, la fenêtre de la première\n    #    date d'un actif contiendrait les dernières lignes d'un autre actif.\n    #    min_periods compte les valeurs NON MANQUANTES de la fenêtre.\n    m = d.groupby(\"actif\")[\"rendement\"].rolling(fenetre, min_periods=min_periodes).mean()\n    # 3. groupby(...).rolling(...) renvoie un index à deux niveaux (actif, étiquette d'origine) :\n    #    on retire le niveau actif, puis on revient à l'ordre de df.\n    return m.reset_index(level=0, drop=True).reindex(df.index)\n\n\ndef moyenne_glissante_pur(lignes, fenetre, min_periodes):\n    \"\"\"lignes : liste de (index, date, actif, rendement). Renvoie {index: moyenne ou nan}.\"\"\"\n    par_actif = {}\n    for i, date, actif, r in lignes:\n        par_actif.setdefault(actif, []).append((date, i, r))\n    sortie = {}\n    for serie in par_actif.values():\n        serie.sort(key=lambda t: t[0])  # au plus une ligne par (date, actif) : pas d'égalité de dates\n        for k in range(len(serie)):\n            valeurs = [r for _, _, r in serie[max(0, k - fenetre + 1):k + 1] if not _nan(r)]\n            sortie[serie[k][1]] = sum(valeurs) / len(valeurs) if len(valeurs) >= min_periodes else NAN\n    return sortie\n\n\n# ------------------------------------------------------------------ exercice 2\nCOLONNES_E2 = [\"actif\", \"fin_de_mois\", \"date\", \"prix\", \"signal\"]\n\n\ndef _regle_mensuelle():\n    # \"M\" en pandas 1.4.2 ; \"ME\" dans les versions récentes (2.3.3 testée), où \"M\" émet un avertissement.\n    try:\n        pd.Series([1.0], index=pd.to_datetime([\"2026-01-05\"])).resample(\"ME\").last()\n        return \"ME\"\n    except ValueError:\n        return \"M\"\n\n\ndef mensualiser(prix: pd.DataFrame, signaux: pd.DataFrame) -> pd.DataFrame:\n    # 1. Ne garder que les prix connus AVANT de rééchantillonner : sinon la « dernière ligne du mois »\n    #    pourrait être une ligne sans prix, et sa date ne serait pas celle du prix retenu.\n    p = prix.dropna(subset=[\"prix\"])\n    if p.empty:\n        return pd.DataFrame({c: pd.Series(dtype=float if c in (\"prix\", \"signal\") else object) for c in COLONNES_E2})\n    p = p.assign(date=pd.to_datetime(p[\"date\"]))\n    p = p.assign(jour=p[\"date\"]).set_index(\"date\").sort_index()\n    # 2. Dernier prix connu du mois, actif par actif. resample étiquette chaque mois par son dernier\n    #    jour civil et crée une ligne vide pour un mois sans observation situé entre deux mois observés :\n    #    dropna les retire.\n    m = (p.groupby(\"actif\")[[\"jour\", \"prix\"]].resample(_regle_mensuelle()).last()\n         .dropna(subset=[\"prix\"]).reset_index().rename(columns={\"date\": \"fin_de_mois\"}))\n    # 3. merge_asof : pour chaque ligne de gauche, la dernière ligne de droite du même actif (by) dont la\n    #    date est STRICTEMENT antérieure (allow_exact_matches=False). Les deux cadres doivent être triés\n    #    par la clé on, qui doit être une date ou un nombre (pas une chaîne).\n    s = signaux.assign(jour=pd.to_datetime(signaux[\"date\"]))[[\"jour\", \"actif\", \"signal\"]].sort_values(\"jour\")\n    s = s.astype({\"actif\": m[\"actif\"].dtype, \"signal\": float})\n    r = pd.merge_asof(m.sort_values(\"jour\"), s, on=\"jour\", by=\"actif\", allow_exact_matches=False)\n    r = r.sort_values([\"actif\", \"fin_de_mois\"]).reset_index(drop=True)\n    r[\"fin_de_mois\"] = r[\"fin_de_mois\"].dt.strftime(\"%Y-%m-%d\")\n    r[\"date\"] = r[\"jour\"].dt.strftime(\"%Y-%m-%d\")\n    return r[COLONNES_E2]\n\n\ndef mensualiser_pur(lignes_prix, lignes_signaux):\n    \"\"\"lignes_prix : (date, actif, prix) ; lignes_signaux : (date, actif, signal).\n    Renvoie la liste triée des (actif, fin_de_mois, date, prix, signal).\"\"\"\n    dernier = {}\n    for date, actif, p in lignes_prix:\n        if _nan(p):\n            continue\n        cle = (actif, date[:7])\n        if cle not in dernier or date > dernier[cle][0]:\n            dernier[cle] = (date, p)\n    par_actif = {}\n    for date, actif, s in lignes_signaux:\n        par_actif.setdefault(actif, []).append((date, s))\n    for v in par_actif.values():\n        v.sort(key=lambda t: t[0])\n    sortie = []\n    for actif, mois in sorted(dernier):\n        date, p = dernier[(actif, mois)]\n        annee, numero = int(mois[:4]), int(mois[5:7])\n        fin = f\"{mois}-{calendar.monthrange(annee, numero)[1]:02d}\"\n        anterieurs = [s for d, s in par_actif.get(actif, []) if d < date]  # chaînes AAAA-MM-JJ : ordre = chronologie\n        sortie.append((actif, fin, date, p, anterieurs[-1] if anterieurs else NAN))\n    return sortie\n\n\n# ------------------------------------------------------------------ exercice 3\ndef normaliser(df: pd.DataFrame, q_bas: float, q_haut: float) -> pd.DataFrame:\n    if df.empty:\n        return pd.DataFrame({\"w\": [], \"z\": [], \"rang\": []}, index=df.index, dtype=float)\n    g = df.groupby(\"date\")[\"signal\"]\n    # 1. Quantiles de chaque date (interpolation linéaire, la définition de l'énoncé, qui est celle\n    #    par défaut de pandas et de numpy), répandus sur les lignes de la date par map.\n    bas = df[\"date\"].map(g.quantile(q_bas))\n    haut = df[\"date\"].map(g.quantile(q_haut))\n    w = df[\"signal\"].clip(lower=bas, upper=haut)\n    # 2. z-score du signal winsorisé, date par date ; std de pandas : dénominateur n - 1.\n    gw = w.groupby(df[\"date\"])\n    z = (w - gw.transform(\"mean\")) / gw.transform(\"std\")\n    # Valeurs toutes égales : on renvoie NaN par la règle de l'énoncé, sans tester std == 0, car l'écart-type\n    # calculé de valeurs égales n'est pas toujours exactement nul en flottants (0,1 trois fois par exemple).\n    # nunique ignore les NaN : il vaut 1 pour une seule valeur non manquante aussi.\n    z = z.where(gw.transform(\"nunique\") > 1)\n    # 3. Rang du signal BRUT divisé par le nombre de signaux non manquants de la date.\n    rang = g.rank(pct=True)\n    return pd.DataFrame({\"w\": w, \"z\": z, \"rang\": rang}, index=df.index).astype(float)\n\n\ndef quantile_lineaire(triees, q):\n    \"\"\"Quantile d'une liste triée non vide, par la définition de l'énoncé.\"\"\"\n    h = (len(triees) - 1) * q\n    i = math.floor(h)\n    f = h - i\n    if f == 0 or i + 1 >= len(triees):\n        return triees[i]\n    return triees[i] + f * (triees[i + 1] - triees[i])\n\n\ndef rangs_moyens(valeurs):\n    \"\"\"Rangs moyens (à partir de 1) d'une liste de nombres sans NaN.\"\"\"\n    ordre = sorted(range(len(valeurs)), key=lambda i: valeurs[i])\n    rangs = [0.0] * len(valeurs)\n    i = 0\n    while i < len(ordre):\n        j = i\n        while j + 1 < len(ordre) and valeurs[ordre[j + 1]] == valeurs[ordre[i]]:\n            j += 1\n        for k in range(i, j + 1):\n            rangs[ordre[k]] = (i + j) / 2 + 1\n        i = j + 1\n    return rangs\n\n\ndef normaliser_pur(lignes, q_bas, q_haut):\n    \"\"\"lignes : liste de (index, date, signal). Renvoie {index: (w, z, rang)}.\"\"\"\n    par_date = {}\n    sortie = {}\n    for i, date, s in lignes:\n        if _nan(s):\n            sortie[i] = (NAN, NAN, NAN)\n        else:\n            par_date.setdefault(date, []).append((i, s))\n    for couples in par_date.values():\n        valeurs = [s for _, s in couples]\n        n = len(valeurs)\n        triees = sorted(valeurs)\n        b, h = quantile_lineaire(triees, q_bas), quantile_lineaire(triees, q_haut)\n        w = [min(max(s, b), h) for s in valeurs]\n        if len(set(w)) > 1:\n            moy = sum(w) / n\n            et = math.sqrt(sum((x - moy) ** 2 for x in w) / (n - 1))\n            z = [(x - moy) / et for x in w]\n        else:\n            z = [NAN] * n\n        for (i, _), wi, zi, r in zip(couples, w, z, rangs_moyens(valeurs)):\n            sortie[i] = (wi, zi, r / n)\n    return sortie\n\n\n# ------------------------------------------------------------------ exercice 4\nJOURS_PAR_AN = 252\n\n\ndef sharpe_annualise(rendements):\n    \"\"\"Ratio de Sharpe annualisé d'une Series : racine(252) x moyenne / écart-type (dénominateur n - 1).\"\"\"\n    if len(rendements) < 2 or rendements.nunique() == 1:\n        return NAN\n    return float(math.sqrt(JOURS_PAR_AN) * rendements.mean() / rendements.std())\n\n\ndef backtest(df: pd.DataFrame, nb_groupes: int):\n    # 1. Format large : une ligne par date du calendrier (toutes les dates de df), une colonne par actif,\n    #    triées. Une absence de ligne devient NaN, à la bonne place dans le calendrier.\n    prix = df.pivot(index=\"date\", columns=\"actif\", values=\"prix\").sort_index().sort_index(axis=1)\n    signal = df.pivot(index=\"date\", columns=\"actif\", values=\"signal\").reindex(index=prix.index, columns=prix.columns)\n    # 2. Rendement réalisé de t à t+1, rangé à la ligne t : shift(-1) va chercher la date SUIVANTE du calendrier.\n    #    Prix en t+1 inconnu : la position rapporte 0 (convention de l'énoncé).\n    r = (prix.shift(-1) / prix - 1).fillna(0.0)\n    # 3. Éligibles en t : signal et prix connus en t. Aucune information de t+1 n'intervient ici.\n    eligible = prix.notna() & signal.notna()\n    # 4. Rangs 1..n_t ; method=\"first\" départage les égalités par position de colonne, donc par actif croissant.\n    rang = signal.where(eligible).rank(axis=1, method=\"first\")\n    n = eligible.sum(axis=1)\n    k = n // nb_groupes\n    long_ = rang.gt(n - k, axis=0)\n    court = rang.le(k, axis=0)\n    # 5. Poids +1/k et -1/k ; k = 0 : aucune position, rendement 0.\n    pf = (r.where(long_).sum(axis=1) - r.where(court).sum(axis=1)) / k.where(k > 0)\n    pf = pf.fillna(0.0).iloc[:-1].astype(float)  # la dernière date n'a pas de rendement réalisé\n    return pf, sharpe_annualise(pf)\n\n\ndef backtest_pur(lignes, nb_groupes):\n    \"\"\"lignes : liste de (date, actif, prix, signal). Renvoie ([(date, rendement)], sharpe).\"\"\"\n    par_date = {}\n    for date, actif, p, s in lignes:\n        par_date.setdefault(date, {})[actif] = (p, s)\n    dates = sorted(par_date)\n    serie = []\n    for t, suivante in zip(dates, dates[1:]):\n        eligibles = sorted((s, a) for a, (p, s) in par_date[t].items() if not (_nan(p) or _nan(s)))\n        k = len(eligibles) // nb_groupes\n        if k == 0:\n            serie.append((t, 0.0))\n            continue\n\n        def rendement(a):\n            p1 = par_date[suivante].get(a, (NAN, NAN))[0]\n            return 0.0 if _nan(p1) else p1 / par_date[t][a][0] - 1\n\n        courts = [a for _, a in eligibles[:k]]\n        longs = [a for _, a in eligibles[-k:]]\n        serie.append((t, sum(rendement(a) for a in longs) / k - sum(rendement(a) for a in courts) / k))\n    valeurs = [v for _, v in serie]\n    if len(valeurs) < 2 or len(set(valeurs)) == 1:\n        return serie, NAN\n    moy = sum(valeurs) / len(valeurs)\n    et = math.sqrt(sum((v - moy) ** 2 for v in valeurs) / (len(valeurs) - 1))\n    return serie, math.sqrt(JOURS_PAR_AN) * moy / et\n```"}, {"id": "S2-E4", "type": "code", "section": "code", "theme": "pandas : mini-backtest long-court sans lookahead", "difficulte": 5, "temps_cible_s": 1200, "enonce": "## Exercice 4 : mini-backtest long-court et ratio de Sharpe\n\nDéfinis `backtest(df, nb_groupes)`, qui renvoie un couple `(rendements, sharpe)`.\n\n**Entrée.** `df` est un DataFrame aux colonnes `date` (chaîne `AAAA-MM-JJ`), `actif` (chaîne), `prix` (nombre strictement positif ou `NaN`) et `signal` (nombre ou `NaN`). Au plus une ligne par couple (`date`, `actif`) ; lignes dans un ordre quelconque ; index quelconque ; éventuellement vide. `nb_groupes` est un entier au moins égal à 2.\n\n**Conventions.**\n\n1. **Calendrier.** Les dates du calendrier sont les dates distinctes de `df`, triées. Pour une date \\(t\\) du calendrier autre que la dernière, \\(t+1\\) désigne la date **suivante du calendrier** (pas la ligne suivante de l'actif).\n2. **Éligibles.** Un actif est éligible en \\(t\\) si `df` a une ligne (\\(t\\), actif) dont le prix **et** le signal sont non manquants. Rien d'autre n'intervient : en particulier, l'existence d'un prix en \\(t+1\\) ne compte pas. On note \\(n_t\\) le nombre d'éligibles et \\(k_t\\) le quotient de la division entière de \\(n_t\\) par `nb_groupes`.\n3. **Positions.** On classe les éligibles par signal croissant ; à signal égal, par nom d'actif croissant. Les \\(k_t\\) premiers sont **vendus** (poids \\(-1/k_t\\) chacun), les \\(k_t\\) derniers **achetés** (poids \\(+1/k_t\\) chacun), les autres ont un poids nul. Si \\(k_t = 0\\), aucune position.\n4. **Rendement réalisé.** Un actif en position en \\(t\\), de prix \\(p_t\\), rapporte \\(p_{t+1}/p_t - 1\\), où \\(p_{t+1}\\) est son prix en \\(t+1\\) ; ce rendement vaut 0 si l'actif n'a pas de ligne en \\(t+1\\) ou si son prix y est `NaN`.\n5. **Rendement du portefeuille** en \\(t\\) : la somme des poids multipliés par les rendements réalisés, soit la moyenne des rendements achetés moins la moyenne des rendements vendus ; 0 si \\(k_t = 0\\).\n6. **Sharpe.** Pour la série des \\(m\\) rendements du portefeuille, de moyenne \\(\\bar r\\) et d'écart-type \\(s\\) à dénominateur \\(m - 1\\) : \\(\\sqrt{252}\\,\\bar r / s\\) (252 dates par an, par convention). `NaN` si \\(m < 2\\) ou si les \\(m\\) rendements sont tous égaux.\n\n**Sortie.** `rendements` : une `Series` de flottants indexée par les dates \\(t\\) du calendrier **sauf la dernière**, dans l'ordre chronologique (index en chaînes `AAAA-MM-JJ` ou en `Timestamp`) ; la valeur en \\(t\\) est le rendement du portefeuille décidé en \\(t\\) et réalisé de \\(t\\) à \\(t+1\\). `sharpe` : un `float`. Calendrier de moins de deux dates : `Series` vide et `NaN`.\n\n**Exemple**, avec `nb_groupes = 2`.\n\n| date | actif | prix | signal |\n|---|---|---|---|\n| 2026-01-05 | A | 100 | 0.9 |\n| 2026-01-05 | B | 50 | 0.1 |\n| 2026-01-05 | C | 20 | -0.5 |\n| 2026-01-05 | D | 10 | 0.3 |\n| 2026-01-06 | A | 110 | 0.2 |\n| 2026-01-06 | B | 50 | 0.2 |\n| 2026-01-06 | C | 19 | 0.4 |\n| 2026-01-06 | D | NaN | 1.0 |\n| 2026-01-07 | A | 99 | NaN |\n| 2026-01-07 | B | 55 | 0.0 |\n| 2026-01-07 | C | 19 | -0.1 |\n| 2026-01-07 | D | 12 | 0.5 |\n\n(Dans les tests, ces lignes sont mélangées.)\n\n- 2026-01-05 : 4 éligibles, \\(k = 2\\). Ordre : C, B, D, A. Vendus C et B, achetés D et A. Rendements : A \\(110/100 - 1 = 0{,}10\\), D 0 (prix manquant le 2026-01-06), B 0, C \\(19/20 - 1 = -0{,}05\\). Portefeuille : \\(0{,}050 - (-0{,}0250) = 0{,}0750\\).\n- 2026-01-06 : D n'est pas éligible (prix manquant), 3 éligibles, \\(k = 1\\). A et B ont le même signal 0.2 : A est classé avant B. Vendu A, acheté C. Rendements : C 0, A \\(99/110 - 1 = -0{,}1\\). Portefeuille : \\(0 - (-0{,}1) = 0{,}1\\).\n- 2026-01-07 : dernière date, pas de rendement.\n\nSortie : `rendements` vaut 0,075 au 2026-01-05 et 0,1 au 2026-01-06 ; moyenne 0,0875, écart-type 0,017678, `sharpe` \\(= \\sqrt{252} \\times 0{,}0875 / 0{,}017678 \\approx 78{,}5748\\). Ce Sharpe absurde vient de deux dates seulement.\n\nSi l'on avait écarté D le 2026-01-05 parce que son prix du lendemain manque, on aurait eu 3 éligibles, \\(k = 1\\), et le rendement 0,15 : la sélection aurait utilisé une information du 2026-01-06.\n\n**Fichier d'exploration.** `panel.csv` (1183 lignes, 61 dates, 20 actifs, mêmes colonnes) contient un signal synthétique fabriqué avec une part du rendement du lendemain. Avec `nb_groupes = 5`, la correction y donne un Sharpe de 13,3354 : de quoi contrôler ton résultat, et un exemple de ce qu'un lookahead produit.\n\n**Ce que vise l'exercice.** Le format large par `pivot`, le rendement de \\(t\\) à \\(t+1\\) par `shift(-1)` sur le calendrier, la sélection avec la seule information de \\(t\\), le classement avec départage, puis le Sharpe annualisé (leçon, section 6). Commence par une version simple et lente, une boucle sur les dates, puis vectorise si le temps le permet.\n\n\n**Fonctionnement.** Notebook sous Python 3.9 et pandas 1.4.2. Tolérance de comparaison des nombres : `1e-9` ; limite de temps : 10 secondes par test. **Tests visibles** exécute 2 tests visibles ; **Soumettre** exécute 8 tests cachés et n'affiche que leurs noms et leur résultat.\n", "dossier": "coding/seance2", "module_tests": "coding/seance2/tests_e4.py", "fonction": "backtest", "cellules_initiales": ["import numpy as np\nimport pandas as pd\n\nexemple = pd.DataFrame(\n    [(\"2026-01-05\", \"A\", 100.0, 0.9), (\"2026-01-05\", \"B\", 50.0, 0.1), (\"2026-01-05\", \"C\", 20.0, -0.5),\n     (\"2026-01-05\", \"D\", 10.0, 0.3), (\"2026-01-06\", \"A\", 110.0, 0.2), (\"2026-01-06\", \"B\", 50.0, 0.2),\n     (\"2026-01-06\", \"C\", 19.0, 0.4), (\"2026-01-06\", \"D\", np.nan, 1.0), (\"2026-01-07\", \"A\", 99.0, np.nan),\n     (\"2026-01-07\", \"B\", 55.0, 0.0), (\"2026-01-07\", \"C\", 19.0, -0.1), (\"2026-01-07\", \"D\", 12.0, 0.5)],\n    columns=[\"date\", \"actif\", \"prix\", \"signal\"])\npanel = pd.read_csv(\"panel.csv\")\nexemple", "def backtest(df: pd.DataFrame, nb_groupes: int):\n    # À compléter : renvoyer (rendements, sharpe)\n    return pd.Series(dtype=float), float(\"nan\")", "backtest(exemple, 2)", "backtest(panel, 5)[1]"], "tests_visibles": 2, "tests_caches": 8, "fichier_correction": "coding/seance2/_correction.py", "verif": {"script": "coding/seance2/tests_e4.py"}, "fiche": null, "solution": "Correction commentée, avec une version pandas et une version sans bibliothèque externe (`coding/seance2/_correction.py`) :\n\n```python\n\"\"\"Corrections de la séance de code 2. À n'ouvrir qu'après avoir tenté les exercices.\n\nChaque fonction existe en deux versions indépendantes : pandas, et sans bibliothèque externe\n(bibliothèque standard seulement : math, calendar). Les tests exigent qu'elles soient d'accord.\nTestées avec pandas 1.4.2 (environnement des notebooks de la plateforme) et pandas 2.3.3.\n\"\"\"\nimport calendar\nimport math\n\nimport numpy as np\nimport pandas as pd\n\nNAN = float(\"nan\")\n\n\ndef _nan(x):\n    return isinstance(x, float) and math.isnan(x)\n\n\n# ------------------------------------------------------------------ exercice 1\ndef moyenne_glissante(df: pd.DataFrame, fenetre: int, min_periodes: int) -> pd.Series:\n    if df.empty:\n        return pd.Series(np.nan, index=df.index, dtype=float)\n    # 1. Trier par date : rolling, comme shift, travaille dans l'ordre des lignes.\n    #    Trier par date suffit, car groupby conserve l'ordre des lignes à l'intérieur de chaque actif.\n    d = df.sort_values(\"date\")\n    # 2. La fenêtre glisse À L'INTÉRIEUR de chaque actif : sans groupby, la fenêtre de la première\n    #    date d'un actif contiendrait les dernières lignes d'un autre actif.\n    #    min_periods compte les valeurs NON MANQUANTES de la fenêtre.\n    m = d.groupby(\"actif\")[\"rendement\"].rolling(fenetre, min_periods=min_periodes).mean()\n    # 3. groupby(...).rolling(...) renvoie un index à deux niveaux (actif, étiquette d'origine) :\n    #    on retire le niveau actif, puis on revient à l'ordre de df.\n    return m.reset_index(level=0, drop=True).reindex(df.index)\n\n\ndef moyenne_glissante_pur(lignes, fenetre, min_periodes):\n    \"\"\"lignes : liste de (index, date, actif, rendement). Renvoie {index: moyenne ou nan}.\"\"\"\n    par_actif = {}\n    for i, date, actif, r in lignes:\n        par_actif.setdefault(actif, []).append((date, i, r))\n    sortie = {}\n    for serie in par_actif.values():\n        serie.sort(key=lambda t: t[0])  # au plus une ligne par (date, actif) : pas d'égalité de dates\n        for k in range(len(serie)):\n            valeurs = [r for _, _, r in serie[max(0, k - fenetre + 1):k + 1] if not _nan(r)]\n            sortie[serie[k][1]] = sum(valeurs) / len(valeurs) if len(valeurs) >= min_periodes else NAN\n    return sortie\n\n\n# ------------------------------------------------------------------ exercice 2\nCOLONNES_E2 = [\"actif\", \"fin_de_mois\", \"date\", \"prix\", \"signal\"]\n\n\ndef _regle_mensuelle():\n    # \"M\" en pandas 1.4.2 ; \"ME\" dans les versions récentes (2.3.3 testée), où \"M\" émet un avertissement.\n    try:\n        pd.Series([1.0], index=pd.to_datetime([\"2026-01-05\"])).resample(\"ME\").last()\n        return \"ME\"\n    except ValueError:\n        return \"M\"\n\n\ndef mensualiser(prix: pd.DataFrame, signaux: pd.DataFrame) -> pd.DataFrame:\n    # 1. Ne garder que les prix connus AVANT de rééchantillonner : sinon la « dernière ligne du mois »\n    #    pourrait être une ligne sans prix, et sa date ne serait pas celle du prix retenu.\n    p = prix.dropna(subset=[\"prix\"])\n    if p.empty:\n        return pd.DataFrame({c: pd.Series(dtype=float if c in (\"prix\", \"signal\") else object) for c in COLONNES_E2})\n    p = p.assign(date=pd.to_datetime(p[\"date\"]))\n    p = p.assign(jour=p[\"date\"]).set_index(\"date\").sort_index()\n    # 2. Dernier prix connu du mois, actif par actif. resample étiquette chaque mois par son dernier\n    #    jour civil et crée une ligne vide pour un mois sans observation situé entre deux mois observés :\n    #    dropna les retire.\n    m = (p.groupby(\"actif\")[[\"jour\", \"prix\"]].resample(_regle_mensuelle()).last()\n         .dropna(subset=[\"prix\"]).reset_index().rename(columns={\"date\": \"fin_de_mois\"}))\n    # 3. merge_asof : pour chaque ligne de gauche, la dernière ligne de droite du même actif (by) dont la\n    #    date est STRICTEMENT antérieure (allow_exact_matches=False). Les deux cadres doivent être triés\n    #    par la clé on, qui doit être une date ou un nombre (pas une chaîne).\n    s = signaux.assign(jour=pd.to_datetime(signaux[\"date\"]))[[\"jour\", \"actif\", \"signal\"]].sort_values(\"jour\")\n    s = s.astype({\"actif\": m[\"actif\"].dtype, \"signal\": float})\n    r = pd.merge_asof(m.sort_values(\"jour\"), s, on=\"jour\", by=\"actif\", allow_exact_matches=False)\n    r = r.sort_values([\"actif\", \"fin_de_mois\"]).reset_index(drop=True)\n    r[\"fin_de_mois\"] = r[\"fin_de_mois\"].dt.strftime(\"%Y-%m-%d\")\n    r[\"date\"] = r[\"jour\"].dt.strftime(\"%Y-%m-%d\")\n    return r[COLONNES_E2]\n\n\ndef mensualiser_pur(lignes_prix, lignes_signaux):\n    \"\"\"lignes_prix : (date, actif, prix) ; lignes_signaux : (date, actif, signal).\n    Renvoie la liste triée des (actif, fin_de_mois, date, prix, signal).\"\"\"\n    dernier = {}\n    for date, actif, p in lignes_prix:\n        if _nan(p):\n            continue\n        cle = (actif, date[:7])\n        if cle not in dernier or date > dernier[cle][0]:\n            dernier[cle] = (date, p)\n    par_actif = {}\n    for date, actif, s in lignes_signaux:\n        par_actif.setdefault(actif, []).append((date, s))\n    for v in par_actif.values():\n        v.sort(key=lambda t: t[0])\n    sortie = []\n    for actif, mois in sorted(dernier):\n        date, p = dernier[(actif, mois)]\n        annee, numero = int(mois[:4]), int(mois[5:7])\n        fin = f\"{mois}-{calendar.monthrange(annee, numero)[1]:02d}\"\n        anterieurs = [s for d, s in par_actif.get(actif, []) if d < date]  # chaînes AAAA-MM-JJ : ordre = chronologie\n        sortie.append((actif, fin, date, p, anterieurs[-1] if anterieurs else NAN))\n    return sortie\n\n\n# ------------------------------------------------------------------ exercice 3\ndef normaliser(df: pd.DataFrame, q_bas: float, q_haut: float) -> pd.DataFrame:\n    if df.empty:\n        return pd.DataFrame({\"w\": [], \"z\": [], \"rang\": []}, index=df.index, dtype=float)\n    g = df.groupby(\"date\")[\"signal\"]\n    # 1. Quantiles de chaque date (interpolation linéaire, la définition de l'énoncé, qui est celle\n    #    par défaut de pandas et de numpy), répandus sur les lignes de la date par map.\n    bas = df[\"date\"].map(g.quantile(q_bas))\n    haut = df[\"date\"].map(g.quantile(q_haut))\n    w = df[\"signal\"].clip(lower=bas, upper=haut)\n    # 2. z-score du signal winsorisé, date par date ; std de pandas : dénominateur n - 1.\n    gw = w.groupby(df[\"date\"])\n    z = (w - gw.transform(\"mean\")) / gw.transform(\"std\")\n    # Valeurs toutes égales : on renvoie NaN par la règle de l'énoncé, sans tester std == 0, car l'écart-type\n    # calculé de valeurs égales n'est pas toujours exactement nul en flottants (0,1 trois fois par exemple).\n    # nunique ignore les NaN : il vaut 1 pour une seule valeur non manquante aussi.\n    z = z.where(gw.transform(\"nunique\") > 1)\n    # 3. Rang du signal BRUT divisé par le nombre de signaux non manquants de la date.\n    rang = g.rank(pct=True)\n    return pd.DataFrame({\"w\": w, \"z\": z, \"rang\": rang}, index=df.index).astype(float)\n\n\ndef quantile_lineaire(triees, q):\n    \"\"\"Quantile d'une liste triée non vide, par la définition de l'énoncé.\"\"\"\n    h = (len(triees) - 1) * q\n    i = math.floor(h)\n    f = h - i\n    if f == 0 or i + 1 >= len(triees):\n        return triees[i]\n    return triees[i] + f * (triees[i + 1] - triees[i])\n\n\ndef rangs_moyens(valeurs):\n    \"\"\"Rangs moyens (à partir de 1) d'une liste de nombres sans NaN.\"\"\"\n    ordre = sorted(range(len(valeurs)), key=lambda i: valeurs[i])\n    rangs = [0.0] * len(valeurs)\n    i = 0\n    while i < len(ordre):\n        j = i\n        while j + 1 < len(ordre) and valeurs[ordre[j + 1]] == valeurs[ordre[i]]:\n            j += 1\n        for k in range(i, j + 1):\n            rangs[ordre[k]] = (i + j) / 2 + 1\n        i = j + 1\n    return rangs\n\n\ndef normaliser_pur(lignes, q_bas, q_haut):\n    \"\"\"lignes : liste de (index, date, signal). Renvoie {index: (w, z, rang)}.\"\"\"\n    par_date = {}\n    sortie = {}\n    for i, date, s in lignes:\n        if _nan(s):\n            sortie[i] = (NAN, NAN, NAN)\n        else:\n            par_date.setdefault(date, []).append((i, s))\n    for couples in par_date.values():\n        valeurs = [s for _, s in couples]\n        n = len(valeurs)\n        triees = sorted(valeurs)\n        b, h = quantile_lineaire(triees, q_bas), quantile_lineaire(triees, q_haut)\n        w = [min(max(s, b), h) for s in valeurs]\n        if len(set(w)) > 1:\n            moy = sum(w) / n\n            et = math.sqrt(sum((x - moy) ** 2 for x in w) / (n - 1))\n            z = [(x - moy) / et for x in w]\n        else:\n            z = [NAN] * n\n        for (i, _), wi, zi, r in zip(couples, w, z, rangs_moyens(valeurs)):\n            sortie[i] = (wi, zi, r / n)\n    return sortie\n\n\n# ------------------------------------------------------------------ exercice 4\nJOURS_PAR_AN = 252\n\n\ndef sharpe_annualise(rendements):\n    \"\"\"Ratio de Sharpe annualisé d'une Series : racine(252) x moyenne / écart-type (dénominateur n - 1).\"\"\"\n    if len(rendements) < 2 or rendements.nunique() == 1:\n        return NAN\n    return float(math.sqrt(JOURS_PAR_AN) * rendements.mean() / rendements.std())\n\n\ndef backtest(df: pd.DataFrame, nb_groupes: int):\n    # 1. Format large : une ligne par date du calendrier (toutes les dates de df), une colonne par actif,\n    #    triées. Une absence de ligne devient NaN, à la bonne place dans le calendrier.\n    prix = df.pivot(index=\"date\", columns=\"actif\", values=\"prix\").sort_index().sort_index(axis=1)\n    signal = df.pivot(index=\"date\", columns=\"actif\", values=\"signal\").reindex(index=prix.index, columns=prix.columns)\n    # 2. Rendement réalisé de t à t+1, rangé à la ligne t : shift(-1) va chercher la date SUIVANTE du calendrier.\n    #    Prix en t+1 inconnu : la position rapporte 0 (convention de l'énoncé).\n    r = (prix.shift(-1) / prix - 1).fillna(0.0)\n    # 3. Éligibles en t : signal et prix connus en t. Aucune information de t+1 n'intervient ici.\n    eligible = prix.notna() & signal.notna()\n    # 4. Rangs 1..n_t ; method=\"first\" départage les égalités par position de colonne, donc par actif croissant.\n    rang = signal.where(eligible).rank(axis=1, method=\"first\")\n    n = eligible.sum(axis=1)\n    k = n // nb_groupes\n    long_ = rang.gt(n - k, axis=0)\n    court = rang.le(k, axis=0)\n    # 5. Poids +1/k et -1/k ; k = 0 : aucune position, rendement 0.\n    pf = (r.where(long_).sum(axis=1) - r.where(court).sum(axis=1)) / k.where(k > 0)\n    pf = pf.fillna(0.0).iloc[:-1].astype(float)  # la dernière date n'a pas de rendement réalisé\n    return pf, sharpe_annualise(pf)\n\n\ndef backtest_pur(lignes, nb_groupes):\n    \"\"\"lignes : liste de (date, actif, prix, signal). Renvoie ([(date, rendement)], sharpe).\"\"\"\n    par_date = {}\n    for date, actif, p, s in lignes:\n        par_date.setdefault(date, {})[actif] = (p, s)\n    dates = sorted(par_date)\n    serie = []\n    for t, suivante in zip(dates, dates[1:]):\n        eligibles = sorted((s, a) for a, (p, s) in par_date[t].items() if not (_nan(p) or _nan(s)))\n        k = len(eligibles) // nb_groupes\n        if k == 0:\n            serie.append((t, 0.0))\n            continue\n\n        def rendement(a):\n            p1 = par_date[suivante].get(a, (NAN, NAN))[0]\n            return 0.0 if _nan(p1) else p1 / par_date[t][a][0] - 1\n\n        courts = [a for _, a in eligibles[:k]]\n        longs = [a for _, a in eligibles[-k:]]\n        serie.append((t, sum(rendement(a) for a in longs) / k - sum(rendement(a) for a in courts) / k))\n    valeurs = [v for _, v in serie]\n    if len(valeurs) < 2 or len(set(valeurs)) == 1:\n        return serie, NAN\n    moy = sum(valeurs) / len(valeurs)\n    et = math.sqrt(sum((v - moy) ** 2 for v in valeurs) / (len(valeurs) - 1))\n    return serie, math.sqrt(JOURS_PAR_AN) * moy / et\n```"}]}]}</script>

function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function enLigne(t) { return esc(t).replace(/`([^`]+)`/g, '<code class="sans-math">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

// Markdown réduit : titres #, tableaux |, listes - et 1., paragraphes, `code`, **gras**, blocs entre triples accents graves.
function rendre(t) {
  let h = '';
  String(t).split('```').forEach((bloc, i) => {
    if (i % 2) {
      const info = (bloc.match(/^(\w*)\n/) || [])[1];
      h += '<pre class="sans-math' + (info === 'sortie' ? ' sortie-lecon' : '') + '"><code>' + esc(bloc.replace(/^\w*\n/, '')) + '</code></pre>';
      return;
    }
    const lignes = bloc.split('\n');
    let k = 0;
    while (k < lignes.length) {
      const l = lignes[k];
      if (!l.trim()) { k++; continue; }
      const titre = l.match(/^(#{1,4})\s+(.*)$/);
      if (titre) { const n = Math.min(4, titre[1].length + 1); h += '<h' + n + '>' + enLigne(titre[2]) + '</h' + n + '>'; k++; continue; }
      if (l.trim().startsWith('|')) {
        const rangs = [];
        while (k < lignes.length && lignes[k].trim().startsWith('|')) { rangs.push(lignes[k].trim()); k++; }
        const cellules = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
        h += '<div class="defile"><table><tr>' + cellules(rangs[0]).map(c => '<th>' + enLigne(c) + '</th>').join('') + '</tr>';
        rangs.slice(1).filter(r => !/^\|[\s|:-]+\|$/.test(r)).forEach(r => { h += '<tr>' + cellules(r).map(c => '<td>' + enLigne(c) + '</td>').join('') + '</tr>'; });
        h += '</table></div>'; continue;
      }
      const puce = /^\s*[-*]\s+/, numero = /^\s*\d+\.\s+/;
      if (puce.test(l) || numero.test(l)) {
        const motif = puce.test(l) ? puce : numero, balise = motif === puce ? 'ul' : 'ol';
        h += '<' + balise + '>';
        while (k < lignes.length && motif.test(lignes[k])) { h += '<li>' + enLigne(lignes[k].replace(motif, '')) + '</li>'; k++; }
        h += '</' + balise + '>'; continue;
      }
      const par = [];
      while (k < lignes.length && lignes[k].trim() && !/^(#{1,4}\s|\s*\||\s*[-*]\s|\s*\d+\.\s)/.test(lignes[k])) { par.push(lignes[k]); k++; }
      const texte = par.join('\n').trim();
      // Un paragraphe réduit à une seule formule est centré ; une formule au milieu d'une phrase reste dans la ligne.
      const seule = texte.startsWith('\\(') && texte.endsWith('\\)') && texte.indexOf('\\(', 2) < 0;
      h += (seule ? '<p class="formule">' : '<p>') + enLigne(par.join('\n')) + '</p>';
    }
  });
  return h;
}
function composer(el) { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el || page]).catch(() => {}); }
function mmss(s) { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function melanger(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function api(chemin, corps) {
  const r = await fetch(chemin, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
  return r.json();
}

let dernierTic = null;
function tic() {
  const ch = document.getElementById('chrono');
  const bouton = document.getElementById('pause');
  bouton.hidden = !(PAUSE_PERMISE && E.phase === 'epreuve');
  document.getElementById('recommencerHaut').hidden = E.phase !== 'epreuve';
  document.getElementById('voile').hidden = !(E.phase === 'epreuve' && E.pauseDepuis);
  if (E.phase !== 'epreuve' || E.pauseDepuis) { dernierTic = null; return; }
  const maintenant = Date.now();
  if (dernierTic !== null) { const q = ITEMS[E.courant]; E.temps[q.id] = (E.temps[q.id] || 0) + (maintenant - dernierTic) / 1000; }
  dernierTic = maintenant;
  const reste = D.duree_minutes * 60 - dureeEcoulee(maintenant);
  ch.textContent = (reste < 0 ? '+' : '') + mmss(Math.abs(reste));
  ch.classList.toggle('depasse', reste < 0);
}
setInterval(() => { tic(); if (E.phase === 'epreuve') sauver(); }, 500);
if (SERVEUR) document.getElementById('lienAccueil').hidden = false;
document.getElementById('lienAccueil').onclick = () => {

};
document.getElementById('recommencerHaut').onclick = () => {

function pastilles() {
  const faite = it => it.type === 'lecon' ? !!E.vus[it.id] : it.type === 'code' ? (E.code[it.id] || {}).soumissions > 0 : E.reponses[it.id] !== undefined;
  const barre = document.querySelector('#progression > span');
  if (barre) barre.style.width = (100 * ITEMS.filter(faite).length / ITEMS.length) + '%';
  let h = '<div class="cadre"><aside class="plan"><div id="pastilles">', section = null, n = 0;
  ITEMS.forEach((it, i) => {
    if (it.nomSection !== section) { section = it.nomSection; h += '<div class="groupe">' + esc(section) + '</div>'; }
    const libelle = it.type === 'lecon' ? 'Leçon' : 'Question ' + (++n);
    h += '<button class="pastille' + (faite(it) ? ' faite' : '') + (i === E.courant ? ' courante' : '') + '" data-i="' + i + '" title="' + esc(it.theme) + '"' + (D.options.retour_arriere || i === E.courant ? '' : ' disabled') + '><span class="etat"></span><span class="libelle">' + libelle + '</span></button>';

const FIN_CADRE = '</div></div>';
function navigation() {

function brancherNavigation() {
  const aller = i => { tic(); E.courant = i; sauver(); afficher(); };

    tic();
    if (E.pauseDepuis) { E.pauseTotale = (E.pauseTotale || 0) + (Date.now() - E.pauseDepuis); E.pauseDepuis = null; }
    E.phase = 'bilan'; E.fin = Date.now(); sauver(); afficher();

}

function epreuve() {
  tic();
  const q = ITEMS[E.courant];
  document.getElementById('position').textContent = q.nomSection + (q.type === 'lecon' ? ' · étape ' : ' · question ') + (E.courant + 1) + ' sur ' + ITEMS.length;
  if (q.type === 'lecon') E.vus[q.id] = true;
  if (q.cellules_initiales) return epreuveCode(q);
  if (q.type === 'lecon') return epreuveLecon(q);
  page.className = '';
  const rang = NOTEES.indexOf(q) + 1;
  let h = pastilles() + '<div class="carte question"><div class="surtitre"><span class="rang">Question ' + rang + ' sur ' + NOTEES.length + '</span><span class="chip">' + esc(q.theme) + '</span><span>temps visé ' + mmss(q.temps_cible_s) + '</span></div>' + rendre(q.enonce);
  h += '<p class="consigne">' + (q.multiple ? 'Une ou plusieurs réponses : coche toutes les affirmations justes, et seulement elles (notation tout ou rien).' : 'Une seule réponse.') + '</p>';
  E.ordre[q.id].forEach((oid, k) => {
    const o = q.options.find(x => x.id === oid);
    h += '<div class="option' + (choisies(q).includes(oid) ? ' choisie' : '') + '" data-o="' + oid + '"><span class="lettre' + (q.multiple ? ' carre' : '') + '">' + 'ABCDE'[k] + '</span><div>' + rendre(o.texte) + '</div></div>';
  });
  if (NSP_PERMIS) h += '<div class="option' + (E.reponses[q.id] === 'nsp' ? ' choisie' : '') + '" data-o="nsp"><span class="lettre">?</span><div><p>Je ne sais pas (compte comme faux, mais évite qu\'un hasard heureux masque une lacune)</p></div></div>';
  page.innerHTML = h + navigation() + '</div>' + FIN_CADRE;
  page.querySelectorAll('.option').forEach(el => el.onclick = () => {
    const o = el.dataset.o;
    if (q.multiple && o !== 'nsp') {
      const s = choisies(q), k = s.indexOf(o);

// Points de contrôle : question corrigée dès le clic, non notée.
function rendreLecon(q) {
  const brut = rendre(q.contenu).replace(/<p>\[\[controle:([\w-]+)\]\]<\/p>/g, (_, cid) => '<div class="controle" data-c="' + cid + '"></div>');
  // Une partie par titre de niveau 2 ; dans chaque partie, un bloc par rubrique (problème, énoncé, preuve, exemple...).
  const source = document.createElement('div');
  source.innerHTML = brut;
  const parties = [];
  Array.from(source.childNodes).forEach(n => {
    if (n.nodeName === 'H3' || !parties.length) parties.push({ titre: n.nodeName === 'H3' ? n.textContent : 'Introduction', noeuds: [] });
    parties[parties.length - 1].noeuds.push(n);
  });
  const genre = t => /preuve/i.test(t) ? 'preuve' : /pi[èe]ge/i.test(t) ? 'pieges' : /exemple|exp[ée]rience/i.test(t) ? 'exemple'
    : /[ée]nonc[ée]/i.test(t) ? 'enonce-bloc' : /intuition/i.test(t) ? 'intuition' : /probl[èe]me/i.test(t) ? 'probleme'
    : /cas limites/i.test(t) ? 'limites' : /d[ée]finition|notation|cadre|mod[èe]le/i.test(t) ? 'definitions' : '';
  const courante = Math.min((E.partie || {})[q.id] || 0, parties.length - 1);
  let h = '<div class="lecon-corps" data-lecon="' + q.id + '"><nav class="sommaire">';
  parties.forEach((p, k) => { h += '<button data-partie="' + k + '"' + (k === courante ? ' class="active"' : '') + '>' + (k + 1) + '. ' + esc(p.titre.replace(/^(Leçon|Partie \d+|Outil \d+|\d+\.)\s*:?\s*/i, '').slice(0, 42) || p.titre) + '</button>'; });
  h += '</nav>';
  parties.forEach((p, k) => {
    h += '<section class="partie" data-partie="' + k + '"' + (k === courante ? '' : ' hidden') + '>';
    let bloc = null;
    const fermer = () => { if (bloc) { h += bloc.genre === 'question' ? ficheDebrief(bloc.titre, bloc.noeuds) : bloc.genre === 'preuve' ? '</details>' : '</div>'; bloc = null; } };
    p.noeuds.forEach(n => {
      if (bloc && bloc.genre === 'question' && n.nodeName !== 'H4' && n.nodeName !== 'H3') { bloc.noeuds.push(n); return; }
      if (n.nodeName === 'H4' && /^Question \d+/.test(n.textContent)) {
        fermer();
        bloc = { genre: 'question', titre: n.textContent, noeuds: [] };
      } else if (n.nodeName === 'H4') {
        fermer();
        const g = genre(n.textContent);
        bloc = { genre: g };
        if (g === 'preuve') h += '<details class="bloc preuve"><summary>' + esc(n.textContent) + '<span class="meta">déplier pour la lire</span></summary>';
        else h += '<div class="bloc ' + g + '"><h4>' + esc(n.textContent) + '</h4>';
      } else if (n.nodeName === 'H3') { fermer(); h += n.outerHTML; }
      else h += n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    });
    fermer();
    h += '<div class="pied-partie"><button data-aller="' + (k - 1) + '"' + (k === 0 ? ' disabled' : '') + '>Partie précédente</button>'
      + '<span class="meta">Partie ' + (k + 1) + ' sur ' + parties.length + '</span>'
      + (k < parties.length - 1 ? '<button class="principal" data-aller="' + (k + 1) + '">Partie suivante</button>' : '<span class="meta">Fin de la leçon : passe à la suite avec « Suivante ».</span>') + '</div></section>';
  });
  return h + '</div>';
}
// Une question du débrief : en-tête (numéro, titre, verdict), énoncé, réponses côte à côte, rubriques, à retenir.
function ficheDebrief(titre, noeuds) {
  const m = titre.match(/^(Question \d+)\s*:?\s*(.*)$/);
  const gras = n => n.nodeName === 'P' && n.firstChild && n.firstChild.nodeName === 'STRONG' ? n.firstChild.textContent.trim() : '';
  const reste = n => { const c = n.cloneNode(true); c.removeChild(c.firstChild); return c.innerHTML.trim(); };
  let enonce = '', ta = null, attendue = null, verdict = '', corps = '', retenir = '', revoir = '', etat = 'enonce';
  noeuds.forEach(n => {
    const g = gras(n), html = n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    if (/^Ta réponse/.test(g)) { ta = reste(n); etat = 'corps'; }
    else if (/^Réponse attendue/.test(g)) { attendue = reste(n); etat = 'corps'; }
    else if (/^Verdict/.test(g)) { verdict = reste(n); etat = 'corps'; }
    else if (/^À retenir/.test(g)) { retenir = '<h5>À retenir</h5><p>' + reste(n) + '</p>'; etat = 'retenir'; }
    else if (/^Leçon à revoir/.test(g)) { revoir = reste(n); etat = 'fin'; }
    else if (g && n.textContent.trim() === g) { corps += '<h5>' + esc(g.replace(/[.:]\s*$/, '')) + '</h5>'; etat = 'corps'; }
    else if (etat === 'enonce') enonce += n.nodeName === 'P' && /^Type :/.test(n.textContent) ? '<p class="meta">' + n.innerHTML + '</p>' : n.nodeName === 'UL' ? '<ul class="choix">' + n.innerHTML + '</ul>' : html;
    else if (etat === 'retenir') retenir += html;
    else corps += html;
  });
  const brut = verdict.replace(/<[^>]+>/g, '').trim();
  const v = /^juste/i.test(brut) ? ['v-juste', 'Juste'] : /^fausse/i.test(brut) ? ['v-fausse', 'Fausse'] : /^incompl/i.test(brut) ? ['v-incomplete', 'Incomplète']
    : /^non visible/i.test(brut) ? ['', 'Réponse non visible'] : ['', ''];
  const suite = brut.replace(/^[^.]*\.\s*/, '');
  let h = '<article class="fiche ' + v[0] + '"><header class="fiche-tete"><span class="num">' + esc(m[1]) + '</span><span class="titre">' + esc(m[2]) + '</span>'
    + (v[1] ? '<span class="verdict">' + v[1] + '</span>' : '') + '</header><div class="fiche-corps">';
  if (ta === null && attendue === null) return h + enonce + corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '') + '</div></article>';
  h += '<h5>Énoncé</h5>' + enonce;
  h += '<div class="fiche-reponses"><div><span class="lab">Ta réponse</span>' + (ta || 'non visible') + '</div><div><span class="lab">Réponse attendue</span>' + (attendue || '') + '</div></div>';
  if (suite) h += '<p class="meta">' + verdict.replace(/^[^.]*\.\s*/, '') + '</p>';
  h += corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '');
  return h + '</div></article>';
}
function brancherLecon(q) {

  h += '<div class="resultats-tests" id="resultatsTests"></div>' + navigation() + '</div></div>' + FIN_CADRE;
  page.innerHTML = h;
  dessinerCellules(q);
  if (lecon) brancherControles(q); else afficherEtatSoumission(q);
  brancherNavigation();
  document.getElementById('toutExecuter').onclick = async () => { for (let i = 0; i < E.cellules[q.id].length; i++) { if (!(await executerCellule(q, i))) break; } };
  document.getElementById('redemarrer').onclick = () => demarrerNoyau(q, true);
  document.getElementById('ajouter').onclick = () => { E.cellules[q.id].push({ code: '', sortie: '', numero: null }); sauver(); dessinerCellules(q); focaliser(E.cellules[q.id].length - 1); };
  if (!lecon) {
    document.getElementById('testsVisibles').onclick = () => lancerTests(q, 'visibles');
    document.getElementById('soumettre').onclick = () => lancerTests(q, 'caches');
  }
  if (!SERVEUR) page.querySelectorAll('.notebook-barre button, #testsVisibles, #soumettre').forEach(b => b.disabled = true);
  else if (!noyauxDemarres[q.id]) demarrerNoyau(q, false, true);
  else document.getElementById('versions').textContent = noyauxDemarres[q.id];
  composer(page.querySelector('.enonce'));
}

async function demarrerNoyau(q, confirmer, reconnexion) {
  if (confirmer && !confirm('Redémarrer le noyau ? Toutes les variables seront perdues.')) return;
  const zone = document.getElementById('versions');

  catch (e) { v = null; }
  if (!v) noyauxDemarres[q.id] = 'noyau injoignable : le serveur lancer.py est-il démarré ?';
  else {
    const etat = v.neuf ? 'noyau neuf' : 'noyau reconnecté, variables conservées';
    noyauxDemarres[q.id] = v.erreur ? 'noyau : ' + v.erreur : etat + ' · Python ' + v.python + ' · pandas ' + v.pandas + ' · numpy ' + v.numpy;
    if (v.neuf) (E.cellules[q.id] || []).forEach(c => c.numero = null);

function rendreSortie(c) { return c.sortie || ''; }

// ------------------------------------------------------------------ éditeur
// Monaco (l'éditeur de VS Code) depuis cdnjs ; les suggestions, signatures et aides viennent de jedi
// dans le noyau, qui connaît les variables déjà exécutées. Sans connexion, repli sur une zone de texte simple.
const MONACO_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min';
let MONACO = null, promesseMonaco = null;
const EDITEURS = [];
window.EDITEURS = EDITEURS;
// Monaco annule ses tâches en cours quand on ferme un éditeur ; cette annulation n'est pas une erreur.
window.addEventListener('unhandledrejection', ev => { if (ev.reason && ev.reason.name === 'Canceled') ev.preventDefault(); });
function sombre() { return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; }
function questionCode() { const q = ITEMS[E.courant]; return E.phase === 'epreuve' && q && q.cellules_initiales ? q : null; }
function chargerMonaco() {
  if (promesseMonaco) return promesseMonaco;
  promesseMonaco = new Promise(resolve => {
    const abandon = setTimeout(() => fini(null), 20000);
    function fini(m) { clearTimeout(abandon); if (window.MODE_EDITEUR === undefined) { MONACO = m; window.MODE_EDITEUR = m ? 'monaco' : 'simple'; } resolve(MONACO); }
    const s = document.createElement('script');
    s.src = MONACO_BASE + '/vs/loader.js';
    s.onerror = () => fini(null);
    s.onload = () => {
      window.MonacoEnvironment = { getWorkerUrl: () => 'data:text/javascript;charset=utf-8,' + encodeURIComponent("self.MonacoEnvironment={baseUrl:'" + MONACO_BASE + "/'};importScripts('" + MONACO_BASE + "/vs/base/worker/workerMain.js');") };
      window.require.config({ paths: { vs: MONACO_BASE + '/vs' } });
      window.require(['vs/editor/editor.main'], () => { try { configurerMonaco(window.monaco); fini(window.monaco); } catch (e) { fini(null); } }, () => fini(null));
    };
    document.head.appendChild(s);
  });
  return promesseMonaco;
}
async function aide(type, model, position) {
  const q = questionCode();
  if (!q || !SERVEUR) return null;
  try { return await api('/api/' + type, { session: SESSION, dossier: q.dossier, code: model.getValue(), ligne: position.lineNumber, colonne: position.column - 1 }); }
  catch (e) { return null; }
}
function configurerMonaco(m) {
  const K = m.languages.CompletionItemKind;
  const genres = { module: K.Module, class: K.Class, instance: K.Variable, function: K.Function, param: K.Variable, path: K.File, keyword: K.Keyword, property: K.Property, statement: K.Variable };
  m.languages.registerCompletionItemProvider('python', {
    triggerCharacters: ['.'],
    provideCompletionItems: async (model, position) => {
      const r = await aide('completer', model, position);
      if (!r || !r.completions) return { suggestions: [] };
      const mot = model.getWordUntilPosition(position);
      const plage = new m.Range(position.lineNumber, mot.startColumn, position.lineNumber, mot.endColumn);
      return { suggestions: r.completions.map((c, k) => ({ label: c.nom, kind: genres[c.type] ?? K.Variable, insertText: c.nom, detail: c.description, range: plage, sortText: String(k).padStart(4, '0') })) };
    }
  });
  m.languages.registerSignatureHelpProvider('python', {
    signatureHelpTriggerCharacters: ['(', ','],
    provideSignatureHelp: async (model, position) => {
      const r = await aide('signatures', model, position);
      if (!r || !r.signatures || !r.signatures.length) return null;
      return { value: { signatures: r.signatures.map(x => ({ label: x.texte, documentation: x.doc, parameters: x.parametres.map(p => ({ label: p })) })), activeSignature: 0, activeParameter: r.signatures[0].index ?? 0 }, dispose() {} };
    }
  });
  m.languages.registerHoverProvider('python', {
    provideHover: async (model, position) => {
      const r = await aide('aide', model, position);
      if (!r || !r.aide || !r.aide.length) return null;
      return { contents: r.aide.map(a => ({ value: '```text\n' + a.doc + '\n```' })) };
    }
  });
}
function creerEditeur(conteneur, code, rappels) {
  if (MONACO) {
    const m = MONACO;
    const ed = m.editor.create(conteneur, {
      value: code, language: 'python', theme: sombre() ? 'vs-dark' : 'vs', fontSize: 14, tabSize: 4, insertSpaces: true,
      minimap: { enabled: false }, scrollBeyondLastLine: false, automaticLayout: true, lineNumbersMinChars: 3, folding: false,
      glyphMargin: false, renderLineHighlight: 'none', overviewRulerLanes: 0, wordBasedSuggestions: 'off', fixedOverflowWidgets: true,
      quickSuggestions: { other: true, comments: false, strings: false }, padding: { top: 6, bottom: 6 },
      scrollbar: { alwaysConsumeMouseWheel: false, vertical: 'hidden', horizontalScrollbarSize: 8 }
    });
    // Sous Windows, Monaco utilise des fins de ligne \r\n ; le code est toujours lu avec des \n, comme dans un notebook.
    const lire = () => ed.getModel().getValue(m.editor.EndOfLinePreference.LF);
    const hauteur = () => { conteneur.style.height = Math.max(38, ed.getContentHeight()) + 'px'; };
    ed.onDidContentSizeChange(hauteur); hauteur();
    ed.onDidChangeModelContent(() => rappels.modif(lire()));
    ed.onDidFocusEditorText(rappels.focus);
    ed.addCommand(m.KeyMod.Shift | m.KeyCode.Enter, rappels.executerSuivant, '!suggestWidgetVisible');
    ed.addCommand(m.KeyMod.CtrlCmd | m.KeyCode.Enter, rappels.executer, '!suggestWidgetVisible');
    return { brut: ed, getValue: lire, setValue: v => ed.setValue(v), focus: () => ed.focus(), dispose: () => ed.dispose() };
  }
  const zone = document.createElement('textarea');
  zone.spellcheck = false; zone.autocomplete = 'off'; zone.className = 'sans-math';
  zone.value = code;
  conteneur.appendChild(zone);
  zone.addEventListener('input', () => { rappels.modif(zone.value); ajuster(zone); });
  zone.addEventListener('focus', rappels.focus);
  zone.addEventListener('keydown', ev => clavier(ev, zone, rappels));
  setTimeout(() => ajuster(zone));
  return { brut: zone, getValue: () => zone.value, setValue: v => { zone.value = v; zone.dispatchEvent(new Event('input')); }, focus: () => zone.focus(), dispose: () => {} };
}
function libererEditeurs() { EDITEURS.forEach(e => e.dispose()); EDITEURS.length = 0; }

function dessinerCellules(q) {
  const conteneur = document.getElementById('cellules');
  if (!conteneur) return;
  if (SERVEUR && window.MODE_EDITEUR === undefined) {
    conteneur.innerHTML = '<p class="meta">Chargement de l\'éditeur...</p>';
    chargerMonaco().then(() => { if (questionCode() === q) dessinerCellules(q); });
    return;
  }
  libererEditeurs();
  conteneur.innerHTML = '';
  const etat = document.getElementById('modeEditeur');
  if (etat) etat.textContent = MONACO ? 'éditeur VS Code, autocomplétion' : 'éditeur simple' + (SERVEUR ? ' (Monaco injoignable)' : '');
  E.cellules[q.id].forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'cellule';
    div.innerHTML = '<div class="numero">[' + (c.numero === null ? ' ' : c.numero) + ']</div><div><div class="editeur"></div>'
      + '<div class="actions"><button data-a="executer">Exécuter</button><button data-a="dessous">Insérer dessous</button><button data-a="supprimer">Supprimer</button></div>'
      + '<pre class="sortie sans-math"></pre></div>';
    div.querySelector('pre.sortie').innerHTML = rendreSortie(c);
    conteneur.appendChild(div);
    EDITEURS.push(creerEditeur(div.querySelector('.editeur'), c.code, {
      modif: v => { c.code = v; sauver(); },
      focus: () => { conteneur.querySelectorAll('.cellule').forEach(x => x.classList.remove('active')); div.classList.add('active'); },
      executer: () => executerCellule(q, i),
      executerSuivant: () => {
        executerCellule(q, i);
        if (i === E.cellules[q.id].length - 1) { E.cellules[q.id].push({ code: '', sortie: '', numero: null }); sauver(); dessinerCellules(q); }
        focaliser(i + 1);
      }
    }));
    div.querySelector('[data-a=executer]').onclick = () => executerCellule(q, i);
    div.querySelector('[data-a=dessous]').onclick = () => { E.cellules[q.id].splice(i + 1, 0, { code: '', sortie: '', numero: null }); sauver(); dessinerCellules(q); focaliser(i + 1); };
    div.querySelector('[data-a=supprimer]').onclick = () => { if (E.cellules[q.id].length > 1) { E.cellules[q.id].splice(i, 1); sauver(); dessinerCellules(q); } };
  });
}
function majNumeros(q) { document.querySelectorAll('#cellules .numero').forEach((n, i) => { const c = E.cellules[q.id][i]; n.textContent = '[' + (c && c.numero !== null ? c.numero : ' ') + ']'; }); }
function ajuster(zone) { zone.style.height = 'auto'; zone.style.height = (zone.scrollHeight + 2) + 'px'; }
function focaliser(i) { const e = EDITEURS[i]; if (e) e.focus(); }
function inserer(zone, texte) {
  zone.focus();
  if (!document.execCommand('insertText', false, texte)) zone.setRangeText(texte, zone.selectionStart, zone.selectionEnd, 'end');
  zone.dispatchEvent(new Event('input'));
}
function clavier(ev, zone, rappels) {
  if (ev.key === 'Enter' && (ev.shiftKey || ev.ctrlKey)) {
    ev.preventDefault();
    if (ev.shiftKey) rappels.executerSuivant(); else rappels.executer();
    return;
  }
  const debut = zone.selectionStart, fin = zone.selectionEnd, v = zone.value;
  const debutLigne = v.lastIndexOf('\n', debut - 1) + 1;
  if (ev.key === 'Tab') {
    ev.preventDefault();
    const multi = v.slice(debut, fin).includes('\n');
    if (!ev.shiftKey && !multi) { inserer(zone, '    '); return; }
    const finBloc = fin;
    const bloc = v.slice(debutLigne, finBloc);
    const nouveau = ev.shiftKey ? bloc.replace(/^ {1,4}/gm, '') : bloc.replace(/^/gm, '    ');
    zone.setSelectionRange(debutLigne, finBloc);
    inserer(zone, nouveau);
    zone.setSelectionRange(debutLigne, debutLigne + nouveau.length);
    return;
  }
  if (ev.key === 'Enter' && !ev.altKey && !ev.metaKey) {
    ev.preventDefault();
    const ligne = v.slice(debutLigne, debut);
    let retrait = ligne.match(/^ */)[0];
    if (/:\s*(#.*)?$/.test(ligne)) retrait += '    ';
    inserer(zone, '\n' + retrait);
  }
}

async function executerCellule(q, i) {
  if (!SERVEUR) return false;
  const c = E.cellules[q.id][i];
  const div = document.querySelectorAll('#cellules .cellule')[i];
  if (div) { div.querySelector('.numero').textContent = '[*]'; div.querySelector('pre.sortie').innerHTML = ''; }
  let r;
  try { r = await api('/api/executer', { session: SESSION, dossier: q.dossier, code: c.code, nom: 'cellule ' + (i + 1) }); }
  catch (e) { r = { erreur: 'Serveur injoignable : lancer.py est-il démarré ?' }; }
  E.compteur = (E.compteur || 0) + 1;
  c.numero = E.compteur;
  let h = '';
  if (r.sortie) h += esc(r.sortie);
  if (r.valeur !== null && r.valeur !== undefined) h += (h && !h.endsWith('\n') ? '\n' : '') + esc(r.valeur);
  if (r.erreur) h += (h && !h.endsWith('\n') ? '\n' : '') + '<span class="erreur">' + esc(r.erreur) + '</span>';
  if (r.redemarre) { noyauxDemarres[q.id] = 'noyau redémarré : variables perdues'; const z = document.getElementById('versions'); if (z) z.textContent = noyauxDemarres[q.id]; }
  c.sortie = h;
  sauver();
  const d = document.querySelectorAll('#cellules .cellule')[i];
  if (d) { d.querySelector('.numero').textContent = '[' + c.numero + ']'; d.querySelector('pre.sortie').innerHTML = h; }
  return !r.erreur;
}

function codeSource(q) { return E.cellules[q.id].map((c, i) => '# %% cellule ' + (i + 1) + '\n' + c.code).join('\n\n') + '\n'; }
function afficherEtatSoumission(q) {
  const s = E.code[q.id] || {};
  const z = document.getElementById('etatSoumission');
  if (z) z.textContent = s.soumissions ? s.soumissions + ' soumission(s) · dernière : ' + s.caches_reussis + '/' + s.caches_total + ' tests cachés réussis' : 'jamais soumis';
}
async function lancerTests(q, mode) {

    h += '</table></div>';

// ------------------------------------------------------------------ bilan
function points(q) {
  if (q.type === 'code') { const c = E.code[q.id]; return c && c.soumissions ? c.caches_reussis / c.caches_total : 0; }
  const r = E.reponses[q.id];
  if (r === undefined || r === 'nsp') return 0;
  // Une question à plusieurs réponses est notée tout ou rien : l'ensemble coché doit être exactement l'ensemble juste.
  const s = choisies(q), bonnes = q.options.filter(o => o.correcte).map(o => o.id);
  return s.length === bonnes.length && bonnes.every(b => s.includes(b)) ? 1 : -D.options.penalite;
}
function choisies(q) { const r = E.reponses[q.id]; return r === undefined || r === 'nsp' ? [] : Array.isArray(r) ? r.slice() : [r]; }
function texteOption(q, id) { const o = q.options.find(x => x.id === id); return o ? o.texte : null; }

function resultatJSON(duree) {
  return {
    examen: D.id, debut: new Date(E.debut).toISOString(), duree_s: Math.round(duree), pauses_s: Math.round((E.pauseTotale || 0) / 1000), options: D.options,
    lecons: ITEMS.filter(q => q.type === 'lecon').map(q => {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      return { id: q.id, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), controles_justes_du_premier_coup: justes, controles_total: ids.length };
    }),
    questions: NOTEES.map(q => {
      const base = { id: q.id, type: q.type, section: q.section, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), temps_cible_s: q.temps_cible_s, points: Number(points(q).toFixed(4)) };
      if (q.type === 'code') {
        const c = E.code[q.id] || {};
        return Object.assign(base, { soumissions: c.soumissions || 0, caches_reussis: c.caches_reussis || 0, caches_total: c.caches_total || q.tests_caches, visibles_reussis: c.visibles_reussis ?? null, code_source: c.code_source || codeSource(q) });
      }
      const r = E.reponses[q.id] ?? null;
      return Object.assign(base, { reponse: r, reponse_texte: r && r !== 'nsp' ? choisies(q).map(i => texteOption(q, i)).join(' ; ') : null, bonne_reponse_texte: q.options.filter(o => o.correcte).map(o => o.texte).join(' ; ') });
    })
  };
}

function bilan() {
  page.className = '';
  document.getElementById('position').textContent = 'Bilan';
  const duree = dureeEcoulee(E.fin);
  document.getElementById('chrono').textContent = mmss(duree);
  let total = 0;
  let h = '<div class="carte"><h2>Bilan</h2>@SCORE@<div class="defile"><table><tr><th>Section</th><th class="nombre">Score</th><th class="nombre">Temps passé</th><th class="nombre">Temps indicatif</th></tr>';
  D.sections.forEach(s => {
    const notees = s.questions.filter(q => q.type !== 'lecon');
    const pts = notees.reduce((a, q) => a + points(q), 0);
    const t = s.questions.reduce((a, q) => a + (E.temps[q.id] || 0), 0);
    total += pts;
    h += '<tr><td>' + esc(s.nom) + '</td><td class="nombre">' + (notees.length ? pts.toFixed(2).replace('.', ',') + ' / ' + notees.length : 'non notée') + '</td><td class="nombre">' + mmss(t) + '</td><td class="nombre">' + mmss(s.budget_min * 60) + '</td></tr>';
  });
  h += '<tr><th>Total</th><th class="nombre">' + total.toFixed(2).replace('.', ',') + ' / ' + NOTEES.length + '</th><th class="nombre">' + mmss(duree) + '</th><th class="nombre">' + mmss(D.duree_minutes * 60) + '</th></tr></table></div>';
  h = h.replace('@SCORE@', '<div class="score-total"><strong>' + total.toFixed(2).replace('.', ',').replace(/,00$/, '') + ' / ' + NOTEES.length + '</strong><span class="meta">en ' + mmss(duree) + '</span></div>');
  const barreFin = document.querySelector('#progression > span'); if (barreFin) barreFin.style.width = '100%';
  h += '<p id="enregistrement" class="meta"></p>';
  h += '<details><summary>Résultat brut (JSON)</summary><textarea readonly class="json sans-math" id="json"></textarea><div class="barre"><button id="telecharger">Enregistrer le fichier</button></div></details>';
  h += '<div class="barre">' + (SERVEUR ? '<button class="principal" id="retourAccueil">Retour à l\'accueil (séance suivante)</button>' : '')
    + '<button id="recommencer">Effacer et recommencer</button></div></div>';
  ITEMS.forEach((q, i) => {
    const temps = mmss(E.temps[q.id] || 0) + ' sur ' + mmss(q.temps_cible_s) + ' visés';
    const tete = (classe, verdict) => '<article class="fiche ' + classe + '"><header class="fiche-tete"><span class="num">' + (q.type === 'lecon' ? 'Leçon' : 'Question ' + (i + 1)) + '</span><span class="titre">' + esc(q.theme)
      + '</span><span class="temps">' + esc(q.nomSection) + ' · ' + temps + '</span>' + (verdict ? '<span class="verdict">' + verdict + '</span>' : '') + '</header><div class="fiche-corps">';
    if (q.type === 'lecon') {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      h += tete('', '') + '<p>Points de contrôle justes du premier coup : ' + justes + ' sur ' + ids.length + '. La leçon reste consultable depuis la séance.</p></div></article>';
      return;
    }
    if (q.type === 'qcm') {
      const r = E.reponses[q.id], juste = points(q) === 1;
      const s = choisies(q), incomplete = !juste && q.multiple && s.length > 0 && s.every(id => q.options.find(o => o.id === id).correcte);
      h += tete(juste ? 'v-juste' : incomplete ? 'v-incomplete' : r === undefined || r === 'nsp' ? '' : 'v-fausse',
        juste ? 'Juste' : r === undefined ? 'Sans réponse' : r === 'nsp' ? 'Je ne sais pas' : incomplete ? 'Incomplète' : 'Fausse');
      h += '<h5>Énoncé</h5>' + rendre(q.enonce) + '<h5>' + (q.multiple ? 'Options (plusieurs réponses, tout ou rien)' : 'Options') + '</h5>';
      E.ordre[q.id].forEach((oid, k) => {
        const o = q.options.find(x => x.id === oid), choisie = s.includes(oid);
        const puces = (o.correcte ? '<span class="puce bon">' + (q.multiple ? 'Juste' : 'Bonne réponse') + '</span>' : '') + (choisie ? '<span class="puce' + (o.correcte ? ' bon' : ' faux') + '">Ta réponse</span>' : '');
        h += '<div class="option ' + (o.correcte ? 'juste' : 'fausse') + (choisie ? ' choisie' : '') + '"><span class="lettre">' + 'ABCDE'[k] + '</span><div>' + puces + rendre(o.texte)
          + '<div class="explication">' + (o.correcte && !q.multiple ? '' : rendre(o.explication)) + '</div></div></div>';
      });
      h += '<h5>Correction</h5>' + rendre(q.solution);
    } else {
      const c = E.code[q.id] || {};
      const tout = c.soumissions && c.caches_reussis === c.caches_total;
      h += tete(tout ? 'v-juste' : c.soumissions ? 'v-incomplete' : '', c.soumissions ? c.caches_reussis + ' / ' + c.caches_total + ' tests cachés' : 'Jamais soumis');
      h += '<details><summary>Énoncé</summary>' + rendre(q.enonce) + '</details>';
      if (c.details) {
        h += '<h5>Tests cachés</h5><div class="defile"><table><tr><th>Test caché</th><th>Résultat</th><th>Attendu</th><th>Obtenu</th></tr>';
        c.details.forEach(t => { h += '<tr><td>' + esc(t.nom) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec') + '</td><td><code class="sans-math">' + esc(t.attendu) + '</code></td><td><code class="sans-math">' + esc(t.obtenu ?? (t.erreur ? 'exception' : '')) + '</code></td></tr>'; });
        h += '</table></div>';
        c.details.filter(t => t.erreur).forEach(t => { h += '<details><summary>Erreur : ' + esc(t.nom) + '</summary><pre class="sans-math">' + esc(t.erreur) + '</pre></details>'; });
      }
      h += '<details><summary>Ton code soumis</summary><pre class="sans-math"><code>' + esc(c.code_source || codeSource(q)) + '</code></pre></details>';
      h += '<details><summary>Correction</summary>' + rendre(q.solution) + '</details>';
    }
    h += '<p class="revoir">Vérification des nombres : <code class="sans-math">' + esc(q.verif.script) + '</code></p></div></article>';
  });
  page.innerHTML = h;
  const resultat = resultatJSON(duree);
  const zone = document.getElementById('json');
  zone.value = JSON.stringify(resultat, null, 1);
  document.getElementById('telecharger').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([zone.value], { type: 'application/json' }));
    a.download = D.id + '_resultat.json'; a.click();
  };
  const retour = document.getElementById('retourAccueil'); if (retour) retour.onclick = () => { location.href = '/'; };
  document.getElementById('recommencer').onclick = () => { if (confirm('Effacer ce passage ?')) { try { localStorage.removeItem(CLE); } catch (e) {} E = etatNeuf('accueil'); afficher(); } };
  const info = document.getElementById('enregistrement');
  if (E.enregistrement) info.textContent = E.enregistrement;
  else if (!SERVEUR) info.textContent = 'Page ouverte comme un fichier : le résultat n\'est pas enregistré automatiquement. Copie le JSON ci-dessous dans la conversation.';
  else {
    info.textContent = 'Enregistrement du résultat...';
    api('/api/resultat', resultat).then(r => {
      E.enregistrement = r.erreur ? null : 'Résultat enregistré dans ' + r.fichier + ' ; ' + r.erreurs_ajoutees + ' erreur(s) ajoutée(s) au journal suivi/erreurs.md.';
      info.textContent = E.enregistrement || 'Échec de l\'enregistrement : ' + r.erreur;
      sauver();
    }).catch(() => { info.textContent = 'Serveur injoignable : le résultat n\'est pas enregistré. Copie le JSON ci-dessous dans la conversation.'; });
  }
  composer();
}

function afficher() {
  libererEditeurs();
  document.getElementById('titre').textContent = D.titre;
  document.title = D.titre;
  if (E.phase === 'epreuve') epreuve(); else if (E.phase === 'bilan') bilan(); else accueil();
  window.scrollTo(0, 0);
}
function completerEtat() {
  ['reponses', 'temps', 'ordre', 'cellules', 'code', 'controles', 'ordreControles', 'vus', 'partie'].forEach(k => { if (!E[k] || typeof E[k] !== 'object') E[k] = {}; });
  if (typeof E.courant !== 'number' || E.courant < 0 || E.courant >= ITEMS.length) E.courant = 0;
  ITEMS.forEach(q => {
    if (q.cellules_initiales && !Array.isArray(E.cellules[q.id])) E.cellules[q.id] = q.cellules_initiales.map(c => ({ code: c, sortie: '', numero: null }));
    if (q.type === 'qcm') {
      const ids = q.options.map(o => o.id);
      const o = E.ordre[q.id];
      if (!Array.isArray(o) || o.length !== ids.length || !ids.every(i => o.includes(i))) E.ordre[q.id] = melanger(ids);
      const rep = E.reponses[q.id];
      if (rep !== undefined && rep !== 'nsp' && (Array.isArray(rep) !== !!q.multiple || !choisies(q).length || !choisies(q).every(i => ids.includes(i)))) delete E.reponses[q.id];
    }
    if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => {
      const cle = q.id + ':' + cid;
      if (!Array.isArray(E.ordreControles[cle])) E.ordreControles[cle] = melanger(c.options.map(o => o.id));
    });
  });
}
charger();
completerEtat();
if (SERVEUR && ITEMS.some(q => q.cellules_initiales)) chargerMonaco();
afficher();
</script>
