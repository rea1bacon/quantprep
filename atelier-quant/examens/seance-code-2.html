<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier quant</title>
<style>
:root { --fond:#f5f6f8; --carte:#ffffff; --texte:#1f2328; --doux:#646b75; --trait:#e3e6ea; --trait-fort:#cdd2d8; --accent:#2f5bd3; --accent-doux:#eef2fc; --bon:#1f7a4d; --bon-doux:#eaf6ef; --faux:#c0392b; --faux-doux:#fcecea; --alerte:#9a5a08; --alerte-doux:#fdf3e4; --code:#f6f8fa; --ombre:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06); }
@media (prefers-color-scheme: dark) { :root { --fond:#0f1115; --carte:#171a20; --texte:#e6e8eb; --doux:#9aa1ab; --trait:#262b33; --trait-fort:#363c46; --accent:#86a8ff; --accent-doux:#1a2135; --bon:#5cc98f; --bon-doux:#13251c; --faux:#f08479; --faux-doux:#2b1716; --alerte:#e2a54f; --alerte-doux:#2a2013; --code:#12151a; --ombre:none; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--fond); color:var(--texte); font:15.5px/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
a { color:var(--accent); }

/* Barre supérieure */
header { position:sticky; top:0; z-index:10; background:var(--carte); border-bottom:1px solid var(--trait); height:56px; padding:0 20px; display:flex; gap:14px; align-items:center; }
#lienAccueil { display:flex; align-items:center; gap:8px; color:var(--texte); font-weight:650; font-size:15px; text-decoration:none; white-space:nowrap; padding-right:14px; border-right:1px solid var(--trait); }
#lienAccueil::before { content:""; width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #7b4bd6)); }
#lienAccueil[hidden] { display:none; }
header h1 { font-size:14.5px; font-weight:600; margin:0; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#position { font-size:13px; color:var(--doux); white-space:nowrap; }
#progression { position:absolute; left:0; right:0; bottom:-1px; height:2px; background:transparent; }
#progression > span { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
#chrono { font:600 15px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; font-variant-numeric:tabular-nums; background:var(--fond); border:1px solid var(--trait); border-radius:999px; padding:7px 12px; }
#chrono.depasse { color:var(--faux); border-color:var(--faux); }
@media (max-width:720px) { #position { display:none; } header { padding:0 12px; gap:8px; } }

/* Mise en page */
main { padding:28px 24px 96px; }
main > .carte, main > .fiche, main > .tableau-bord { max-width:880px; margin-left:auto; margin-right:auto; }
.cadre { display:grid; grid-template-columns:250px minmax(0, 1fr); gap:32px; max-width:1180px; margin:0 auto; align-items:start; }
main.large .cadre { max-width:none; }
.contenu { min-width:0; max-width:820px; }
main.lecture .contenu { max-width:880px; }
main.large .contenu { max-width:none; }
@media (max-width:1000px) { .cadre { grid-template-columns:1fr; gap:16px; } }

/* Plan de la séance (colonne gauche) */
.plan { scrollbar-width:thin; scrollbar-color:var(--trait-fort) transparent; position:sticky; top:84px; max-height:calc(100vh - 104px); overflow-y:auto; font-size:13.5px; }
.plan .groupe { font-size:11.5px; font-weight:650; letter-spacing:.06em; text-transform:uppercase; color:var(--doux); margin:16px 0 6px 10px; }
.plan .groupe:first-child { margin-top:0; }
#pastilles { display:flex; flex-direction:column; gap:2px; }
.pastille { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; background:none; border-radius:8px; padding:6px 10px; font-size:13.5px; color:var(--texte); }
.pastille:hover:not(:disabled) { background:color-mix(in srgb, var(--doux) 9%, transparent); }
.pastille .etat { flex:none; width:18px; height:18px; border-radius:50%; border:1.5px solid var(--trait-fort); display:grid; place-items:center; font-size:10px; color:#fff; }
.pastille.faite .etat { background:var(--accent); border-color:var(--accent); }
.pastille.faite .etat::after { content:"✓"; }
.pastille .libelle { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pastille.courante { background:var(--accent-doux); color:var(--accent); font-weight:600; }
.pastille.courante .etat { border-color:var(--accent); }
@media (max-width:1000px) { .plan { position:static; max-height:none; } #pastilles { flex-direction:row; flex-wrap:wrap; } .pastille { width:auto; } .pastille .libelle { display:none; } .plan .groupe { display:none; } }

/* Cartes */
.carte { background:var(--carte); border:1px solid var(--trait); border-radius:12px; padding:22px 26px; margin-bottom:18px; box-shadow:var(--ombre); }
h2 { font-size:21px; font-weight:650; letter-spacing:-.01em; margin:0 0 10px; }
h3 { font-size:17px; font-weight:650; margin:20px 0 6px; }
h4 { font-size:15px; font-weight:650; margin:16px 0 4px; }
.meta { color:var(--doux); font-size:13.5px; }
.surtitre { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:14px; font-size:13px; color:var(--doux); }
.surtitre .rang { font-weight:650; color:var(--texte); }
.chip { display:inline-block; max-width:420px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; font-size:12px; font-weight:550; padding:2px 10px; border-radius:999px; background:var(--accent-doux); color:var(--accent); }
.note { background:var(--alerte-doux); border-radius:10px; padding:10px 14px; color:var(--texte); font-size:14px; margin:12px 0; }
.note p { margin:4px 0; }
.consigne { font-size:13px; color:var(--doux); margin:18px 0 8px; }

/* Boutons */
button { font:inherit; font-size:14px; font-weight:550; padding:8px 14px; border-radius:8px; border:1px solid var(--trait-fort); background:var(--carte); color:var(--texte); cursor:pointer; transition:background .15s, border-color .15s; }
button:hover:not(:disabled) { background:color-mix(in srgb, var(--doux) 8%, var(--carte)); }
button.principal { background:var(--accent); border-color:var(--accent); color:#fff; }
button.principal:hover:not(:disabled) { background:color-mix(in srgb, var(--accent) 88%, #000); }
@media (prefers-color-scheme: dark) { button.principal { color:#0d1220; } }
button:disabled { opacity:.45; cursor:default; }
header button { padding:6px 12px; font-size:13px; }
.barre { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:16px; }
.navigation { border-top:1px solid var(--trait); margin-top:26px; padding-top:18px; }
.navigation #prec { margin-right:auto; }
.navigation #finir { order:1; }
.navigation #suiv { order:2; }

/* Options d'une question */
.option { display:flex; gap:14px; align-items:flex-start; border:1px solid var(--trait-fort); border-radius:10px; padding:13px 16px; margin:10px 0; cursor:pointer; background:var(--carte); transition:border-color .12s, background .12s; }
.option:hover { border-color:var(--accent); }
.option .lettre { flex:none; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--trait-fort); display:grid; place-items:center; font-size:12.5px; font-weight:650; color:var(--doux); margin-top:-1px; }
.option .lettre.carre { border-radius:6px; }
.option p { margin:0; }
.option.choisie { border-color:var(--accent); background:var(--accent-doux); }
.option.choisie .lettre { background:var(--accent); border-color:var(--accent); color:#fff; }
.option.juste { border-color:var(--bon); }
.option.fausse { border-color:var(--trait); }
.explication { font-size:14px; color:var(--doux); margin-top:6px; }
.etiquette { font-size:13px; font-weight:600; }
.bon { color:var(--bon); } .faux { color:var(--faux); }

/* Code, tableaux */
pre { background:var(--code); border:1px solid var(--trait); border-radius:8px; padding:12px 14px; overflow-x:auto; font:13px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; }
code { font:13px ui-monospace, "Cascadia Mono", Consolas, monospace; background:var(--code); border:1px solid var(--trait); padding:0 4px; border-radius:4px; }
pre code { background:none; border:0; padding:0; }
.defile { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:14px; margin:10px 0; }
th { font-size:12px; font-weight:650; letter-spacing:.04em; text-transform:uppercase; color:var(--doux); }
th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--trait); vertical-align:top; }
td.nombre, th.nombre { text-align:right; font-variant-numeric:tabular-nums; }
textarea.json { width:100%; min-height:140px; font:12.5px ui-monospace, Consolas, monospace; background:var(--code); color:var(--texte); border:1px solid var(--trait); border-radius:8px; padding:8px; }
details { margin-top:10px; } summary { cursor:pointer; color:var(--accent); font-weight:550; }

/* Question de code : énoncé à gauche, notebook à droite */
.deux { display:grid; grid-template-columns:minmax(300px, 38%) 1fr; gap:18px; align-items:start; }
.deux > .carte { margin:0; }
.deux .enonce { position:sticky; top:76px; max-height:calc(100vh - 96px); overflow-y:auto; }
@media (max-width:1100px) { .deux { grid-template-columns:1fr; } .deux .enonce { position:static; max-height:none; } }
.notebook-barre { display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--trait); padding-bottom:12px; margin-bottom:12px; }
.notebook-barre button { font-size:13px; padding:6px 11px; }
.notebook-barre #versions { margin-left:auto; }
.notebook-barre .meta { font-size:12.5px; }
.cellule { display:grid; grid-template-columns:48px 1fr; gap:6px; margin:12px 0; }
.cellule .numero { font:12px ui-monospace, Consolas, monospace; color:var(--doux); text-align:right; padding-top:9px; }
.cellule .editeur { border:1px solid var(--trait); border-radius:8px; overflow:hidden; background:var(--code); }
.cellule.active .editeur { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-doux); }
.cellule .editeur textarea { border:none; border-radius:0; }
.cellule textarea { width:100%; resize:none; overflow:hidden; min-height:44px; font:13.5px/1.5 ui-monospace, Consolas, monospace; tab-size:4; background:var(--code); color:var(--texte); border:1px solid var(--trait); border-radius:8px; padding:8px 10px; white-space:pre; overflow-x:auto; }
.cellule .actions { display:flex; gap:6px; margin-top:4px; }
.cellule .actions button { font-size:12px; padding:2px 8px; font-weight:500; }
.cellule pre.sortie { margin:4px 0 0; max-height:420px; overflow:auto; }
.cellule pre.sortie:empty { display:none; }
pre .erreur { color:var(--faux); }
.resultats-tests { margin-top:12px; }
#voile { position:fixed; inset:0; z-index:20; background:color-mix(in srgb, var(--fond) 92%, transparent); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:16px; }
#voile[hidden] { display:none; }
#voile .carte { max-width:480px; text-align:center; }
#voile .barre { justify-content:center; }
.deux.lecon { grid-template-columns:minmax(320px, 56%) 1fr; }
.deux.lecon .enonce { max-height:calc(100vh - 96px); }
pre.sortie-lecon { margin-top:-6px; border-style:dashed; color:var(--doux); }

/* Leçons : colonne de lecture, une partie à la fois, onglets */
main.lecture .carte.enonce { padding:26px 40px 30px; }
.lecon-corps { font-size:16px; line-height:1.72; max-width:74ch; margin:0 auto; }
.lecon-corps p { margin:0.75em 0; }
.lecon-corps li { margin:0.4em 0; padding-left:2px; }
.lecon-corps ol, .lecon-corps ul { padding-left:1.4em; }
.lecon-corps ol > li::marker { font-weight:650; color:var(--doux); }
.lecon-corps h3 { font-size:23px; font-weight:700; letter-spacing:-.015em; line-height:1.3; margin:8px 0 16px; }
.lecon-corps table { font-size:14.5px; line-height:1.55; }
.lecon-corps mjx-container { font-size:102% !important; }
.lecon-corps mjx-container[display="true"], .lecon-corps p.formule > mjx-container { display:block; text-align:center; margin:0.7em 0; overflow-x:auto; overflow-y:hidden; }
.sommaire { display:flex; flex-wrap:wrap; gap:0 2px; margin:0 0 24px; border-bottom:1px solid var(--trait); }
.sommaire button { flex:none; font-size:13px; font-weight:550; padding:10px 12px; border:0; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--doux); margin-bottom:-1px; }
.sommaire button:hover:not(:disabled) { background:none; color:var(--texte); }
.sommaire button.active { color:var(--accent); border-bottom-color:var(--accent); }
.partie[hidden] { display:none; }
.pied-partie { display:flex; gap:10px; align-items:center; justify-content:space-between; margin:28px 0 4px; padding-top:18px; border-top:1px solid var(--trait); }
.pied-partie .meta { flex:1; text-align:center; }
.bloc { --teinte:var(--doux); border:1px solid var(--trait); border-radius:10px; padding:6px 20px 10px; margin:18px 0; background:var(--carte); }
.bloc > h4, .bloc > summary { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--teinte); margin:10px 0 2px; }
.bloc.enonce-bloc { --teinte:var(--accent); background:var(--accent-doux); border-color:transparent; }
.bloc.exemple { --teinte:var(--bon); } .bloc.pieges { --teinte:var(--faux); } .bloc.limites { --teinte:var(--alerte); }
.bloc.preuve { background:var(--fond); }
details.bloc > summary { cursor:pointer; list-style:revert; padding:6px 0; }
details.bloc > summary .meta { text-transform:none; letter-spacing:0; font-weight:400; margin-left:6px; }
details.bloc[open] > summary { margin-bottom:6px; }
.controle { border:1px solid var(--trait-fort); border-radius:12px; padding:14px 18px; margin:22px 0; background:var(--fond); }
.controle .titre-controle { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--accent); margin:0 0 6px; }
.controle .option { background:var(--carte); }

/* Fiche de question : débrief et bilan */
.fiche { background:var(--carte); border:1px solid var(--trait); border-radius:12px; margin:0 0 20px; overflow:hidden; font-size:15px; line-height:1.65; box-shadow:var(--ombre); }
.lecon-corps .fiche { margin:24px 0; }
.fiche-tete { display:flex; align-items:center; flex-wrap:wrap; gap:6px 14px; padding:14px 22px; border-bottom:1px solid var(--trait); }
.fiche-tete .num { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--doux); white-space:nowrap; }
.fiche-tete .titre { flex:1; min-width:200px; font-weight:650; font-size:16px; }
.fiche-tete .temps { font-size:12.5px; color:var(--doux); white-space:nowrap; }
.verdict { font-size:12px; font-weight:650; padding:3px 10px; border-radius:999px; white-space:nowrap; color:var(--doux); background:var(--fond); }
.v-juste .verdict { color:var(--bon); background:var(--bon-doux); } .v-fausse .verdict { color:var(--faux); background:var(--faux-doux); } .v-incomplete .verdict { color:var(--alerte); background:var(--alerte-doux); }
.fiche-corps { padding:4px 22px 20px; }
.fiche h5 { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--doux); margin:22px 0 8px; }
.fiche-corps > h5:first-child { margin-top:16px; }
.fiche p { margin:0.6em 0; }
.fiche li { margin:0.35em 0; }
.fiche-reponses { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin:18px 0 6px; }
.fiche-reponses > div { background:var(--fond); border-radius:10px; padding:10px 14px; }
.fiche-reponses .lab { display:block; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--doux); margin-bottom:2px; }
.fiche ul.choix { list-style:none; padding:0; margin:8px 0; }
.fiche ul.choix > li { border:1px solid var(--trait); border-radius:10px; padding:9px 14px; margin:8px 0; }
.fiche ul.choix > li > strong:first-child { display:inline-block; min-width:1.8em; color:var(--doux); }
.fiche .retenir { border-radius:10px; padding:12px 16px; margin-top:20px; background:var(--accent-doux); }
.fiche .retenir h5 { margin:0 0 2px; color:var(--accent); }
.fiche .retenir p { margin:0.3em 0 0; }
.fiche .revoir { font-size:13.5px; color:var(--doux); margin:14px 0 0; }
.fiche .option { cursor:default; }
.fiche .option:hover { border-color:var(--trait); }
.fiche .option p { margin:0; }
.fiche .option .explication p { margin:3px 0 0; }
.fiche .option.juste { border-color:color-mix(in srgb, var(--bon) 45%, var(--trait)); background:var(--bon-doux); }
.fiche .option.choisie:not(.juste) { border-color:color-mix(in srgb, var(--faux) 45%, var(--trait)); background:var(--faux-doux); }
.fiche .option.choisie .lettre { background:none; color:var(--doux); border-color:var(--trait-fort); }
.fiche .option > div { flex:1; }
.puce { float:right; font-size:11px; font-weight:650; padding:2px 9px; border-radius:999px; margin-left:8px; white-space:nowrap; color:var(--doux); background:var(--fond); }
.puce.bon { color:var(--bon); background:var(--carte); } .puce.faux { color:var(--faux); background:var(--carte); }
.fiche details { margin-top:16px; border-top:1px solid var(--trait); padding-top:12px; }
.fiche details > summary { cursor:pointer; font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--doux); }

/* Présentation d'une séance et bilan */
.presentation h2 { font-size:26px; letter-spacing:-.02em; }
.sections-liste { display:grid; gap:8px; margin:18px 0; }
.sections-liste > div { display:flex; justify-content:space-between; gap:12px; background:var(--fond); border-radius:10px; padding:10px 14px; font-size:14px; }
.score-total { display:flex; align-items:baseline; gap:10px; margin:4px 0 14px; }
.score-total strong { font-size:34px; font-weight:700; letter-spacing:-.02em; }
</style>

<script type="application/json" id="donnees">{"id": "seance-code-2", "titre": "Séance de code 2 : fenêtres glissantes, alignement temporel, normalisation, backtest", "duree_minutes": 70, "options": {"pause": true, "je_ne_sais_pas": true, "retour_arriere": true, "penalite": 0}, "conventions": "Conventions de notation : une majuscule désigne une variable aléatoire, une minuscule une valeur ou un paramètre fixe, le gras un vecteur ou une matrice. \\(\\mathbb{P}\\) désigne une probabilité, \\(\\mathbb{E}\\) une espérance, \\(\\mathrm{Var}\\) une variance.", "presentation": "D'abord une leçon de 20 minutes, avec cinq points de contrôle corrigés immédiatement et un notebook pour essayer les exemples. Ensuite quatre exercices, du plus guidé au plus complet : une moyenne glissante par actif, un passage en fréquence mensuelle avec la dernière information disponible, une normalisation par date avec winsorisation, et un mini-backtest long-court dont on calcule le ratio de Sharpe. Chaque exercice a ses tests visibles et des tests cachés qui contiennent des cas limites : cadre vide, une seule ligne, valeurs manquantes, égalités, index non trivial, grande taille.\n\nRègle de travail, à appliquer aussi dans un test en ligne : écris une solution simple, lance les tests visibles, **soumets tout de suite**, puis améliore et soumets à nouveau. Un code jamais soumis ne rapporte rien. Au-delà du double du temps cible d'un exercice, soumets ce que tu as et passe au suivant : c'est la règle d'abandon à suivre dans un test chronométré.", "avertissements": ["Temps indicatif : 8 minutes pour l'exercice 1, 12 pour le 2, 10 pour le 3, 20 pour le 4. Dans les examens blancs, la question de code dispose de 24 minutes.", "Le notebook de cette séance s'exécute sous Python 3.9 et pandas 1.4.2, l'environnement des notebooks de la plateforme.", "Les points de contrôle de la leçon sont en choix multiple à une seule bonne réponse."], "sections": [{"id": "lecon", "nom": "Leçon", "budget_min": 20, "questions": [{"id": "L-PANDAS-2", "type": "lecon", "section": "lecon", "theme": "Leçon pandas 2 : fenêtres glissantes, rééchantillonnage, merge_asof, normalisation, backtest", "difficulte": 3, "temps_cible_s": 1200, "dossier": "coding/seance2", "contenu": "## Leçon : séries temporelles en panel, sans fuite\n\nDurée visée : 20 minutes. Lis dans l'ordre, exécute les exemples dans le notebook de droite si tu veux les modifier, et réponds à chaque point de contrôle avant de continuer. Les sorties affichées sous chaque exemple sont les vraies sorties de pandas 1.4.2, la version de l'environnement des notebooks de la plateforme.\n\nConventions de cette leçon : une minuscule désigne une valeur observée, donc fixe (un prix, un rendement déjà réalisé) ; une majuscule une variable aléatoire, utilisée seulement à la section 6 pour justifier l'annualisation du ratio de Sharpe.\n\n### 1. Le problème\n\nUn panel a une ligne par couple (date, actif). La séance de code 1 a traité le décalage et le rang par groupe. Celle-ci traite les quatre gestes suivants d'une chaîne de recherche : moyenne glissante par actif, passage à une fréquence mensuelle, association de la dernière information disponible, normalisation par date, puis backtest.\n\nTous obéissent à une même règle, qui se viole sans aucun message d'erreur. La valeur calculée pour la ligne (date \\(t\\), actif \\(a\\)) ne doit utiliser :\n\n1. pour un calcul **par actif** (fenêtre glissante, rendement), que des lignes de l'actif \\(a\\) : sinon il y a **fuite entre actifs** ;\n2. pour un calcul **par date** (rang, z-score, quantile), que des lignes de la date \\(t\\) : une statistique calculée sur tout l'échantillon contient les dates futures ;\n3. dans tous les cas, que de l'information **disponible en \\(t\\)** : sinon il y a **lookahead** (regard vers le futur), et le backtest mesure un gain impossible à réaliser.\n\n### 2. Fenêtre glissante par actif\n\n**Ce que calcule `rolling`.** Pour une série `s` et des entiers \\(n \\ge 1\\) (la fenêtre) et \\(m\\) (le minimum, \\(1 \\le m \\le n\\)), `s.rolling(n, min_periods=m).mean()` associe à la ligne de position \\(i\\) les lignes de positions \\(i - n + 1\\) à \\(i\\) (moins au début de la série). Il en garde les valeurs **non manquantes** ; si elles sont au moins \\(m\\), le résultat est leur moyenne, sinon `NaN`. Sans `min_periods`, \\(m\\) vaut \\(n\\). Les positions sont celles des lignes **dans l'ordre où elles se trouvent** : comme `shift`, `rolling` exige un cadre trié par date.\n\n```python\nimport numpy as np\nimport pandas as pd\n\ns = pd.Series([1.0, np.nan, 3.0, 4.0])\npd.DataFrame({\"min_periods=1\": s.rolling(3, min_periods=1).mean(),\n              \"min_periods=2\": s.rolling(3, min_periods=2).mean(),\n              \"sans min_periods\": s.rolling(3).mean()})\n```\n\n```sortie\n   min_periods=1  min_periods=2  sans min_periods\n0            1.0            NaN               NaN\n1            1.0            NaN               NaN\n2            2.0            2.0               NaN\n3            3.5            3.5               NaN\n```\n\nLecture de la ligne 3 : la fenêtre contient `NaN`, 3 et 4, soit deux valeurs non manquantes ; avec \\(m = 1\\) ou \\(m = 2\\), la moyenne est \\((3 + 4)/2\\) ; sans `min_periods`, il en faudrait 3, d'où `NaN` partout. Par défaut, toute fenêtre qui contient une valeur manquante, ou qui compte moins de \\(n\\) lignes, donne donc `NaN`.\n\n**La fuite entre actifs.** Sur un panel trié par date, une fenêtre sans `groupby` déborde d'un actif sur l'autre :\n\n```python\nr = pd.DataFrame({\"date\": [\"2026-01-05\", \"2026-01-06\", \"2026-01-07\"] * 2,\n                  \"actif\": [\"A\"] * 3 + [\"B\"] * 3,\n                  \"rendement\": [1.0, np.nan, 3.0, 10.0, 20.0, 30.0]})\nd = r.sort_values([\"date\", \"actif\"])\nd[\"sans_groupby\"] = d[\"rendement\"].rolling(2, min_periods=1).mean()\nd\n```\n\n```sortie\n         date actif  rendement  sans_groupby\n0  2026-01-05     A        1.0           1.0\n3  2026-01-05     B       10.0           5.5\n1  2026-01-06     A        NaN          10.0\n4  2026-01-06     B       20.0          20.0\n2  2026-01-07     A        3.0          11.5\n5  2026-01-07     B       30.0          16.5\n```\n\nLa ligne de B au 2026-01-05 reçoit la moyenne de A et de B le même jour : c'est faux. Avec `groupby`, chaque actif a sa propre fenêtre, mais le résultat a **deux niveaux d'index**, l'actif puis l'étiquette d'origine :\n\n```python\nm = d.groupby(\"actif\")[\"rendement\"].rolling(2, min_periods=1).mean()\nm\n```\n\n```sortie\nactif   \nA      0     1.0\n       1     1.0\n       2     3.0\nB      3    10.0\n       4    15.0\n       5    25.0\nName: rendement, dtype: float64\n```\n\nCe n'est pas l'index de `d`, et l'affectation directe échoue :\n\n```python\nd[\"glissante\"] = m\n```\n\n```sortie\nTypeError: incompatible index of inserted column with frame index\n```\n\nDeux écritures justes, dans les deux versions de pandas : retirer le niveau de l'actif, ou passer par `transform`, qui garde l'index d'origine.\n\n```python\nd[\"glissante\"] = m.reset_index(level=0, drop=True)\nd[\"avec_transform\"] = d.groupby(\"actif\")[\"rendement\"].transform(lambda x: x.rolling(2, min_periods=1).mean())\nd\n```\n\n```sortie\n         date actif  rendement  sans_groupby  glissante  avec_transform\n0  2026-01-05     A        1.0           1.0        1.0             1.0\n3  2026-01-05     B       10.0           5.5       10.0            10.0\n1  2026-01-06     A        NaN          10.0        1.0             1.0\n4  2026-01-06     B       20.0          20.0       15.0            15.0\n2  2026-01-07     A        3.0          11.5        3.0             3.0\n5  2026-01-07     B       30.0          16.5       25.0            25.0\n```\n\nL'affectation range chaque valeur à sa ligne par étiquette (séance de code 1, section 2). La première ligne de chaque actif ne voit plus que lui-même.\n\n[[controle:fuite]]\n\n### 3. Rééchantillonnage : passer à une fréquence mensuelle\n\n**Ce que fait `resample`.** Sur une série indexée par des dates (un `DatetimeIndex` : il faut convertir les chaînes avec `pd.to_datetime`), `s.resample(\"M\")` découpe le temps en mois civils ; `.last()` donne, pour chaque mois, la **dernière valeur non manquante** ; l'étiquette est le **dernier jour civil** du mois.\n\n```python\np = pd.Series([10.0, 11.0, np.nan, 12.0],\n              index=pd.to_datetime([\"2026-01-29\", \"2026-01-30\", \"2026-01-31\", \"2026-03-02\"]))\np.resample(\"M\").last()\n```\n\n```sortie\n2026-01-31    11.0\n2026-02-28     NaN\n2026-03-31    12.0\nFreq: M, dtype: float64\n```\n\nTrois faits à lire dans cette sortie : janvier vaut 11, pas `NaN`, car `last` saute la valeur manquante du 31 ; février, sans aucune observation, produit quand même une ligne, `NaN` ; l'étiquette de janvier est le 31 même si la dernière observation est du 30.\n\n**La règle de version.** En pandas 1.4.2, le mois se note `\"M\"`. Le nom `\"ME\"`, qu'acceptent des versions plus récentes, n'y existe pas encore :\n\n```python\np.resample(\"ME\").last()\n```\n\n```sortie\nValueError: Invalid frequency: ME\n```\n\nEn pandas 2.3.3, `\"M\"` fonctionne encore mais émet un avertissement, et `\"ME\"` fonctionne. Dans un environnement en pandas 1.4.2, écrire `\"M\"`.\n\n**Par actif.** On rééchantillonne à l'intérieur de chaque actif :\n\n```python\nq = pd.DataFrame({\"date\": pd.to_datetime([\"2026-01-29\", \"2026-01-30\", \"2026-03-02\", \"2026-01-30\"]),\n                  \"actif\": [\"A\", \"A\", \"A\", \"B\"], \"prix\": [10.0, 11.0, 12.0, 20.0]})\nq.set_index(\"date\").groupby(\"actif\")[\"prix\"].resample(\"M\").last()\n```\n\n```sortie\nactif  date      \nA      2026-01-31    11.0\n       2026-02-28     NaN\n       2026-03-31    12.0\nB      2026-01-31    20.0\nName: prix, dtype: float64\n```\n\nLe mois de février de A, vide, apparaît en `NaN` : `.dropna()` le retire. B n'a pas de ligne de février : pour chaque actif, resample couvre les mois de sa première à sa dernière observation.\n\n**Le piège des colonnes multiples.** `last` saute les `NaN` **colonne par colonne**. Si l'on garde la date d'observation dans une colonne, elle ne correspond plus au prix retenu :\n\n```python\nt = pd.DataFrame({\"prix\": [10.0, 11.0, np.nan],\n                  \"jour\": pd.to_datetime([\"2026-01-29\", \"2026-01-30\", \"2026-01-31\"])},\n                 index=pd.to_datetime([\"2026-01-29\", \"2026-01-30\", \"2026-01-31\"]))\npd.concat({\"sans dropna\": t.resample(\"M\").last(), \"avec dropna\": t.dropna(subset=[\"prix\"]).resample(\"M\").last()}, axis=1)\n```\n\n```sortie\n           sans dropna            avec dropna           \n                  prix       jour        prix       jour\n2026-01-31        11.0 2026-01-31        11.0 2026-01-30\n```\n\nSans `dropna`, le prix est celui du 30 mais le jour affiché est le 31 : retirer les lignes sans prix **avant** de rééchantillonner.\n\n[[controle:resample]]\n\n### 4. merge_asof : la dernière information disponible\n\n**Le problème.** Les signaux sont publiés à des dates irrégulières, week-ends compris ; les décisions sont prises à d'autres dates. Pour chaque décision, il faut la dernière valeur publiée **avant** elle. Une jointure exacte (`merge` sur la date) ne trouve que les publications du jour même : c'est à la fois trop peu et, si la publication a lieu après la décision, du lookahead.\n\n**Ce que fait `pd.merge_asof(gauche, droite, on=\"date\", by=\"actif\")`.** Pour chaque ligne de `gauche`, il cherche dans `droite` les lignes du **même actif** (`by`) dont la date est **inférieure ou égale** (direction par défaut, `\"backward\"`), et prend la plus récente. Avec `allow_exact_matches=False`, l'inégalité devient **stricte**.\n\n```python\nobs = pd.DataFrame({\"date\": pd.to_datetime([\"2026-01-30\", \"2026-01-30\"]), \"actif\": [\"A\", \"B\"]})\nsig = pd.DataFrame({\"date\": pd.to_datetime([\"2026-01-28\", \"2026-01-29\", \"2026-01-30\"]),\n                    \"actif\": [\"A\", \"B\", \"A\"], \"signal\": [0.5, -1.0, 0.7]})\npd.concat({\"par défaut\": pd.merge_asof(obs, sig, on=\"date\", by=\"actif\"),\n           \"strict\": pd.merge_asof(obs, sig, on=\"date\", by=\"actif\", allow_exact_matches=False)}, axis=1)\n```\n\n```sortie\n  par défaut                  strict             \n        date actif signal       date actif signal\n0 2026-01-30     A    0.7 2026-01-30     A    0.5\n1 2026-01-30     B   -1.0 2026-01-30     B   -1.0\n```\n\nPar défaut, A reçoit 0,7, le signal **du jour même**. Si ce signal n'est connu qu'après la clôture du 30 et que la décision est prise à cette clôture, c'est du lookahead ; la version stricte donne 0,5. B reçoit le signal de B, jamais celui de A, grâce à `by`.\n\nDeux contraintes, qui lèvent une erreur au lieu de se tromper en silence. La clé `on` doit être une date ou un nombre, pas une chaîne :\n\n```python\npd.merge_asof(obs.astype({\"date\": str}), sig.astype({\"date\": str}), on=\"date\", by=\"actif\")\n```\n\n```sortie\npandas.errors.MergeError: Incompatible merge dtype, dtype('O') and dtype('O'), both sides must have numeric dtype\n```\n\nEt les deux cadres doivent être triés par cette clé, **sur tout le cadre** : trier par actif puis par date ne suffit pas.\n\n```python\ngauche = pd.DataFrame({\"date\": pd.to_datetime([\"2026-01-30\", \"2026-01-29\"]), \"actif\": [\"A\", \"B\"]})\npd.merge_asof(gauche, sig, on=\"date\", by=\"actif\")\n```\n\n```sortie\nValueError: left keys must be sorted\n```\n\nLe cadre `gauche` est trié par actif puis par date, mais pas par date : refusé.\n\nDernier réflexe : sélectionner les colonnes du résultat dans l'ordre voulu, `resultat[[\"actif\", \"date\", ...]]`. En pandas 1.4.2, quand le cadre de gauche est vide, `merge_asof` renvoie ses colonnes dans un autre ordre (vérifié par `verif/lecon_pandas_2.py`).\n\n[[controle:asof]]\n\n### 5. Normalisation transversale et winsorisation\n\n**Le problème.** Un signal n'a pas la même échelle d'une date à l'autre ; on le compare donc aux autres actifs **de la même date**. Deux normalisations : le z-score, qui centre et réduit, et le rang, insensible à l'échelle. Le z-score est sensible aux valeurs extrêmes : on les **winsorise** d'abord, c'est-à-dire qu'on ramène sous un quantile haut et au-dessus d'un quantile bas toutes les valeurs qui les dépassent.\n\n**Le quantile, défini sans ambiguïté.** Pour \\(n \\ge 1\\) valeurs non manquantes d'une date, triées \\(x_{(1)} \\le \\dots \\le x_{(n)}\\) (des nombres), et un niveau \\(q \\in [0, 1]\\), on pose \\(h = (n - 1)\\,q\\), \\(i = \\lfloor h \\rfloor\\) la partie entière de \\(h\\) et \\(f = h - i \\in [0, 1[\\). Le quantile linéaire est\n\n\\(\\displaystyle x_{(i+1)} + f\\,\\bigl(x_{(i+2)} - x_{(i+1)}\\bigr)\\)\n\navec la convention qu'il vaut \\(x_{(i+1)}\\) quand \\(f = 0\\). C'est une interpolation linéaire entre les valeurs triées placées aux positions \\(0, 1, \\dots, n - 1\\) : elle donne le minimum pour \\(q = 0\\), le maximum pour \\(q = 1\\), et varie continûment entre les deux. C'est la méthode par défaut de `Series.quantile` et de `np.quantile` dans les deux versions (vérifié sur des tirages aléatoires par `verif/lecon_pandas_2.py`) ; les autres méthodes (`\"lower\"`, `\"higher\"`, `\"nearest\"`, `\"midpoint\"`) donnent d'autres valeurs, c'est pourquoi un énoncé doit préciser la sienne.\n\nExemple : les valeurs 3, 1, 10, 2, triées 1, 2, 3, 10, donc \\(n = 4\\). Pour \\(q = 0{,}1\\) : \\(h = 0{,}3\\), \\(i = 0\\), \\(f = 0{,}3\\), quantile \\(1 + 0{,}3 \\times (2 - 1) = 1{,}3\\). Pour \\(q = 0{,}9\\) : \\(h = 2{,}7\\), \\(i = 2\\), \\(f = 0{,}7\\), quantile \\(3 + 0{,}7 \\times (10 - 3) = 7{,}9\\).\n\n```python\nx = pd.DataFrame({\"date\": [\"d1\"] * 4 + [\"d2\"] * 3, \"signal\": [3.0, 1.0, 10.0, 2.0, 5.0, np.nan, -1.0]})\ng = x.groupby(\"date\")[\"signal\"]\nbas = x[\"date\"].map(g.quantile(0.1))\nhaut = x[\"date\"].map(g.quantile(0.9))\nx[\"w\"] = x[\"signal\"].clip(lower=bas, upper=haut)\nx\n```\n\n```sortie\n  date  signal    w\n0   d1     3.0  3.0\n1   d1     1.0  1.3\n2   d1    10.0  7.9\n3   d1     2.0  2.0\n4   d2     5.0  4.4\n5   d2     NaN  NaN\n6   d2    -1.0 -0.4\n```\n\n`g.quantile(0.1)` donne une valeur par date ; `map` la répand sur les lignes de la date ; `clip` accepte des bornes ligne par ligne. Le 10 de `d1` devient 7,9, le 1 devient 1,3.\n\n**Le z-score par date** se calcule avec `transform`, qui répand la moyenne et l'écart-type de la date sur ses lignes. L'écart-type de pandas divise par \\(n - 1\\), celui de numpy par \\(n\\) :\n\n```python\ngw = x.groupby(\"date\")[\"w\"]\nx[\"z\"] = (x[\"w\"] - gw.transform(\"mean\")) / gw.transform(\"std\")\nx[\"rang\"] = g.rank(pct=True)\nx, np.std(x.loc[x[\"date\"] == \"d1\", \"w\"]), x.loc[x[\"date\"] == \"d1\", \"w\"].std()\n```\n\n```sortie\n(  date  signal    w         z  rang\n0   d1     3.0  3.0 -0.184395  0.75\n1   d1     1.0  1.3 -0.754343  0.25\n2   d1    10.0  7.9  1.458396  1.00\n3   d1     2.0  2.0 -0.519659  0.50\n4   d2     5.0  4.4  0.707107  1.00\n5   d2     NaN  NaN       NaN   NaN\n6   d2    -1.0 -0.4 -0.707107  0.50, 2.5831182706178986, 2.982728057779769)\n```\n\n`rank(pct=True)` divise le rang moyen par le nombre de valeurs **non manquantes** de la date : en `d2`, il y en a 2, pas 3.\n\n**Le piège des valeurs égales.** Si toutes les valeurs d'une date sont égales, le z-score n'est pas défini. Mais l'écart-type **calculé** n'est pas toujours exactement nul :\n\n```python\npd.Series([0.1, 0.1, 0.1]).std()\n```\n\n```sortie\n1.6996749443881478e-17\n```\n\nLa somme de trois fois 0,1 en flottants n'est pas exactement 0,3, donc la moyenne calculée diffère de 0,1 d'une quantité minuscule, et l'écart-type aussi. Diviser par lui donne des z-scores de l'ordre de 1, absurdes. Tester l'égalité des valeurs, par exemple `transform(\"nunique\") > 1`, et non `std != 0`.\n\n[[controle:quantile]]\n\n### 6. Backtest sans lookahead\n\n**La chronologie.** Notations : \\(p_{a,t}\\) est le prix observé de l'actif \\(a\\) à la date \\(t\\), en unité monétaire ; « \\(t+1\\) » désigne la date **suivante du calendrier**, c'est-à-dire de l'ensemble des dates du panel, pas la ligne suivante de l'actif. À la clôture de \\(t\\), on connaît les prix jusqu'à \\(t\\) et les signaux de \\(t\\) ; on fixe des poids \\(w_{a,t}\\) (des nombres sans unité, positifs pour un achat, négatifs pour une vente à découvert) ; la position rapporte entre \\(t\\) et \\(t+1\\) le rendement \\(r_{a,t} = p_{a,t+1}/p_{a,t} - 1\\). Le rendement du portefeuille sur cette période est \\(\\sum_a w_{a,t}\\, r_{a,t}\\).\n\nLe rendement \\(r_{a,t}\\) est indexé par la date de **décision** \\(t\\), mais il n'est connu qu'en \\(t+1\\) : il sert à **noter** la décision, jamais à la **prendre**.\n\n**Le format large** aligne le calendrier : une ligne par date, une colonne par actif, `NaN` là où l'actif n'a pas de ligne. Alors `shift(-1)` va chercher la date suivante du calendrier :\n\n```python\nb = pd.DataFrame({\"date\": [\"d1\", \"d1\", \"d2\", \"d3\", \"d3\"], \"actif\": [\"A\", \"B\", \"A\", \"A\", \"B\"],\n                  \"prix\": [100.0, 50.0, 110.0, 99.0, 55.0]})\nprix = b.pivot(index=\"date\", columns=\"actif\", values=\"prix\")\nprix, prix.shift(-1) / prix - 1\n```\n\n```sortie\n(actif      A     B\ndate              \nd1     100.0  50.0\nd2     110.0   NaN\nd3      99.0  55.0, actif    A   B\ndate          \nd1     0.1 NaN\nd2    -0.1 NaN\nd3     NaN NaN)\n```\n\nB n'a pas de ligne en `d2` : son rendement de `d1` à `d2` est `NaN`, et non le rendement de `d1` à `d3`, que donnerait un `groupby(\"actif\")[\"prix\"].shift(-1)` sur le format long. Un énoncé doit dire quoi faire de ce `NaN` (ici, dans l'exercice 4 : compter 0).\n\n**Les trois lookaheads classiques**, tous silencieux :\n\n1. ne garder en \\(t\\) que les actifs dont le prix de \\(t+1\\) est connu : la sélection utilise le futur (on élimine d'avance les actifs qui vont disparaître) ;\n2. normaliser le signal avec une moyenne ou un écart-type calculés sur **toutes** les dates : la normalisation de \\(t\\) contient les dates postérieures ;\n3. associer à la décision de \\(t\\) une information publiée en \\(t\\) après la décision (section 4, `allow_exact_matches`).\n\nL'erreur inverse existe aussi : ranger à la ligne \\(t\\) le rendement de \\(t-1\\) à \\(t\\) (`pct_change()` sans décalage) mesure ce qui s'est passé **avant** la décision.\n\n**Classer en départageant les égalités.** `rank(axis=1, method=\"first\")` classe les actifs de chaque date, et départage les égalités par position de colonne ; `pivot` trie les colonnes, donc l'égalité est départagée par nom d'actif croissant :\n\n```python\npd.DataFrame({\"A\": [0.2, 1.0], \"B\": [0.2, np.nan], \"C\": [0.1, 1.0]}).rank(axis=1, method=\"first\")\n```\n\n```sortie\n     A    B    C\n0  2.0  3.0  1.0\n1  1.0  NaN  2.0\n```\n\n**Le ratio de Sharpe annualisé.** Pour une série de \\(m\\) rendements quotidiens de moyenne empirique \\(\\bar r\\) et d'écart-type empirique \\(s\\) (dénominateur \\(m - 1\\)), on le définit par \\(\\sqrt{252}\\, \\bar r / s\\), où 252 est un nombre conventionnel de jours de bourse par an. D'où vient la racine :\n\n1. Modèle : les rendements quotidiens \\(R_1, \\dots, R_{252}\\) d'une année sont des variables aléatoires de même espérance \\(\\mu\\) et de même variance \\(\\sigma^2 > 0\\), **deux à deux non corrélées**, et l'on approche le rendement annuel par leur somme (approximation valable pour de petits rendements, qui néglige la composition).\n2. Linéarité de l'espérance : \\(\\mathbb{E}\\bigl[\\sum_{j=1}^{252} R_j\\bigr] = 252\\,\\mu\\).\n3. Variance d'une somme : \\(\\mathrm{Var}\\bigl(\\sum_j R_j\\bigr) = \\sum_j \\mathrm{Var}(R_j) + \\sum_{j \\ne l} \\mathrm{Cov}(R_j, R_l) = 252\\,\\sigma^2\\), les covariances étant nulles par hypothèse.\n4. Sharpe annuel : \\(252\\,\\mu / \\sqrt{252\\,\\sigma^2} = \\sqrt{252}\\,\\mu/\\sigma\\), estimé par \\(\\sqrt{252}\\,\\bar r/s\\).\n\nSi les rendements sont autocorrélés, l'étape 3 garde les covariances et le facteur \\(\\sqrt{252}\\) est faux. Multiplier par 252, ou utiliser l'écart-type à dénominateur \\(m\\), sont deux erreurs que les tests cachés de l'exercice 4 attrapent. Les dates sans position comptent, avec un rendement nul : les retirer gonfle le Sharpe.\n\nUn ordre de grandeur pour se méfier : le fichier `panel.csv` du notebook contient un signal synthétique fabriqué avec une part du rendement du lendemain, c'est-à-dire un lookahead volontaire. Le backtest de l'exercice 4 y donne un Sharpe annualisé de 13,3, valeur sans rapport avec ce qu'atteint une stratégie réelle : un Sharpe aussi élevé est d'abord le symptôme d'une fuite.\n\n[[controle:lookahead]]\n\n### 7. Pièges, réflexes et ce qu'il faut savoir refaire\n\nPièges :\n\n1. `rolling`, `shift`, `pct_change` dépendent de l'ordre des lignes : trier par date, et grouper par actif.\n2. `groupby(...).rolling(...)` a un index à deux niveaux : `reset_index(level=0, drop=True)` ou `transform`.\n3. `min_periods` compte les valeurs non manquantes ; sans lui, une seule valeur manquante efface la fenêtre.\n4. `resample(\"M\")` en pandas 1.4.2 ; il crée des mois vides en `NaN` ; `last` saute les `NaN` colonne par colonne.\n5. `merge_asof` : clés en dates, cadres triés par la clé, `by` pour l'actif, `allow_exact_matches=False` pour « strictement avant ».\n6. Quantiles, z-scores et rangs **par date** ; écart-type de pandas à dénominateur \\(n - 1\\) ; égalité des valeurs testée par `nunique`.\n7. Backtest : décision avec l'information de \\(t\\), rendement de \\(t\\) à \\(t+1\\) du calendrier, aucune sélection sur le futur.\n\nRéflexes en 30 secondes :\n\n| Besoin | Écriture |\n|---|---|\n| moyenne glissante par actif | `df.sort_values(\"date\").groupby(\"actif\")[\"x\"].transform(lambda s: s.rolling(n, min_periods=m).mean())` |\n| dernier prix du mois par actif | `p.dropna(subset=[\"prix\"]).set_index(\"date\").groupby(\"actif\")[\"prix\"].resample(\"M\").last().dropna()` |\n| dernière information strictement antérieure | `pd.merge_asof(g.sort_values(\"date\"), d.sort_values(\"date\"), on=\"date\", by=\"actif\", allow_exact_matches=False)` |\n| quantile par date sur chaque ligne | `df[\"date\"].map(df.groupby(\"date\")[\"x\"].quantile(q))` |\n| z-score par date | `(x - g.transform(\"mean\")) / g.transform(\"std\")` |\n| rang par date dans \\(]0, 1]\\) | `df.groupby(\"date\")[\"x\"].rank(pct=True)` |\n| rendement de \\(t\\) à \\(t+1\\) du calendrier | `prix_large.shift(-1) / prix_large - 1` |\n| Sharpe annualisé | `np.sqrt(252) * r.mean() / r.std()` |\n\nÀ savoir refaire sans notes, en moins de 5 minutes chacun : la moyenne glissante par actif, le dernier prix du mois avec le dernier signal strictement antérieur, la winsorisation et le z-score par date, et la démonstration du facteur \\(\\sqrt{252}\\) avec son hypothèse.\n", "controles": {"fuite": {"question": "Avec le cadre `r` de la section 2, on écrit `r.sort_values([\"date\", \"actif\"])[\"rendement\"].rolling(2).mean()`. Que vaut le résultat sur la ligne de B au 2026-01-05 ?", "options": [{"id": "a", "texte": "5,5 : la moyenne de A et de B le 2026-01-05, une fuite entre actifs.", "correcte": true, "explication": "Oui : sans groupby, la fenêtre de deux lignes contient la ligne précédente du cadre trié, qui est A le même jour. Les deux valeurs sont non manquantes, donc min_periods = 2 est atteint."}, {"id": "b", "texte": "`NaN`, car B n'a qu'une valeur à cette date.", "correcte": false, "explication": "Ce serait le résultat juste avec `groupby(\"actif\")` : la fenêtre de B ne contiendrait que B. Sans groupby, la fenêtre ne connaît pas les actifs."}, {"id": "c", "texte": "10, le rendement de B lui-même.", "correcte": false, "explication": "Ce serait le cas avec `groupby` et `min_periods=1`. Ici, ni l'un ni l'autre : la fenêtre prend deux lignes du cadre, tous actifs confondus."}, {"id": "d", "texte": "Une erreur, car le cadre contient deux actifs.", "correcte": false, "explication": "`rolling` ne vérifie rien sur le contenu des autres colonnes : il calcule sur la série dans l'ordre des lignes. C'est ce qui rend la fuite silencieuse."}]}, "resample": {"question": "Une série a des observations les 2026-01-15, 2026-01-20 et 2026-04-02 seulement. Combien de lignes renvoie `s.resample(\"M\").last()` sous pandas 1.4.2 ?", "options": [{"id": "a", "texte": "4 : janvier, février, mars et avril, avec `NaN` pour février et mars.", "correcte": true, "explication": "Oui : resample crée tous les mois entre le premier et le dernier mois observés, vides compris. Il faut `dropna()` pour ne garder que les mois observés."}, {"id": "b", "texte": "2 : seuls les mois observés.", "correcte": false, "explication": "C'est le résultat après `dropna()`, ou celui d'un `groupby` sur le mois. `resample` remplit le calendrier."}, {"id": "c", "texte": "3 : une ligne par observation.", "correcte": false, "explication": "resample produit une ligne par période, pas par observation : les deux observations de janvier sont réduites en une seule par `last`."}, {"id": "d", "texte": "Une erreur : le mois se note `\"ME\"`.", "correcte": false, "explication": "C'est l'inverse : sous pandas 1.4.2, `\"ME\"` lève une erreur et `\"M\"` fonctionne. `\"ME\"` n'est accepté que par des versions plus récentes, dont la 2.3.3."}]}, "asof": {"question": "Décision à la clôture du 2026-01-30 sur l'actif A. Signaux de A datés du 2026-01-28 (0,5) et du 2026-01-30 (0,7), chacun publié après la clôture de son jour. Quelle écriture associe à la décision le dernier signal réellement disponible ?", "options": [{"id": "a", "texte": "`pd.merge_asof(obs, sig, on=\"date\", by=\"actif\", allow_exact_matches=False)`, qui donne 0,5.", "correcte": true, "explication": "Oui : le signal du 30 est publié après la décision, il faut donc une date strictement antérieure. La version stricte écarte l'égalité."}, {"id": "b", "texte": "`pd.merge_asof(obs, sig, on=\"date\", by=\"actif\")`, qui donne 0,7.", "correcte": false, "explication": "Par défaut, merge_asof accepte une date égale : il prend le signal du 30, publié après la décision. C'est du lookahead."}, {"id": "c", "texte": "`pd.merge_asof(obs, sig, on=\"date\", by=\"actif\", direction=\"forward\")`.", "correcte": false, "explication": "`\"forward\"` cherche la première date supérieure ou égale : il regarde vers le futur par construction, et donne ici 0,7."}, {"id": "d", "texte": "`pd.merge(obs, sig, on=[\"date\", \"actif\"])`.", "correcte": false, "explication": "Une jointure exacte ne garde que le signal du jour même (0,7, publié trop tard) et ne trouve rien pour une décision prise un jour sans publication."}]}, "quantile": {"question": "Une date a les signaux 3, 1, 10, 2. Que vaut leur quantile de niveau 0,9 selon la définition de la section 5 ?", "options": [{"id": "a", "texte": "7,9", "correcte": true, "explication": "Oui : \\(h = (4 - 1) \\times 0{,}9 = 2{,}7\\), donc \\(i = 2\\) et \\(f = 0{,}7\\) ; le quantile vaut \\(x_{(3)} + 0{,}7\\,(x_{(4)} - x_{(3)}) = 3 + 0{,}7 \\times 7\\)."}, {"id": "b", "texte": "10", "correcte": false, "explication": "C'est la méthode `'higher'` (ou `'nearest'` ici) : on prend une valeur observée au lieu d'interpoler. La définition linéaire interpole entre 3 et 10."}, {"id": "c", "texte": "3", "correcte": false, "explication": "C'est la méthode `'lower'` : la valeur triée de position \\(\\lfloor h \\rfloor\\). Elle ignore la partie fractionnaire \\(f\\)."}, {"id": "d", "texte": "7,2", "correcte": false, "explication": "C'est le résultat avec la position \\(h = n\\,q - 1 = 2{,}6\\) au lieu de \\((n - 1)\\,q\\) : une autre convention de quantile empirique, qui n'est pas celle de la définition."}]}, "lookahead": {"question": "Dans un backtest où la décision est prise à la clôture de \\(t\\), lequel de ces choix utilise une information postérieure à la décision ?", "options": [{"id": "a", "texte": "Ne retenir en \\(t\\) que les actifs dont le prix de \\(t+1\\) est connu.", "correcte": true, "explication": "Oui : savoir en \\(t\\) qu'un actif aura un prix en \\(t+1\\) est une information future. Elle écarte d'avance les actifs qui vont disparaître ou être suspendus."}, {"id": "b", "texte": "Noter la position par le rendement `prix.shift(-1) / prix - 1` rangé à la ligne \\(t\\).", "correcte": false, "explication": "C'est la définition du résultat de la décision : ce rendement n'est connu qu'en \\(t+1\\), mais il ne sert qu'à évaluer la position, pas à la choisir."}, {"id": "c", "texte": "Classer les actifs par le signal daté de \\(t\\), connu avant la clôture de \\(t\\).", "correcte": false, "explication": "Le signal est disponible au moment de la décision : c'est exactement l'information autorisée."}, {"id": "d", "texte": "Compter un rendement nul pour un actif en position dont le prix de \\(t+1\\) manque.", "correcte": false, "explication": "C'est une convention sur le résultat, fixée à l'avance, qui ne change pas la décision prise en \\(t\\). Elle doit seulement être annoncée."}]}}, "cellules_initiales": ["import numpy as np\nimport pandas as pd\n\nr = pd.DataFrame({\"date\": [\"2026-01-05\", \"2026-01-06\", \"2026-01-07\"] * 2,\n                  \"actif\": [\"A\"] * 3 + [\"B\"] * 3,\n                  \"rendement\": [1.0, np.nan, 3.0, 10.0, 20.0, 30.0]})\nr", "# Essaie ici les exemples de la leçon, en les modifiant.\nd = r.sort_values([\"date\", \"actif\"])\nd.groupby(\"actif\")[\"rendement\"].rolling(2, min_periods=1).mean()", "# Fichier d'exploration : panel synthétique (date, actif, prix, signal).\npanel = pd.read_csv(\"panel.csv\")\npanel.head()"], "verif": {"script": "verif/lecon_pandas_2.py"}}]}, {"id": "code", "nom": "Coding, data science", "budget_min": 50, "questions": [{"id": "S2-E1", "type": "code", "section": "code", "theme": "pandas : fenêtre glissante par actif", "difficulte": 2, "temps_cible_s": 480, "enonce": "## Exercice 1 : moyenne glissante par actif\n\nDéfinis `moyenne_glissante(df, fenetre, min_periodes)`.\n\n**Entrée.** `df` est un DataFrame aux colonnes `date` (chaîne `AAAA-MM-JJ`), `actif` (chaîne) et `rendement` (nombre ou `NaN`). Au plus une ligne par couple (`date`, `actif`) ; lignes dans un ordre **quelconque** ; index quelconque sans doublon. `fenetre` et `min_periodes` sont deux entiers vérifiant 1 ≤ `min_periodes` ≤ `fenetre`.\n\n**Sortie.** Une `Series` de flottants **ayant le même index que `df`**. Pour la ligne d'actif `a` et de date `d` : on prend les lignes de `a` dont la date est inférieure ou égale à `d`, et parmi elles les `fenetre` plus récentes (toutes s'il y en a moins), la ligne elle-même comprise. Si au moins `min_periodes` d'entre elles ont un rendement non manquant, la valeur est la moyenne arithmétique de ces rendements non manquants ; sinon, `NaN`.\n\nLa fenêtre compte des **lignes de l'actif**, pas des jours du calendrier : une date sans ligne pour `a` n'occupe aucune place dans la fenêtre de `a`. Les lignes des autres actifs n'interviennent jamais.\n\n**Exemple**, avec `fenetre = 3` et `min_periodes = 2`.\n\n| index | date | actif | rendement | sortie |\n|---|---|---|---|---|\n| 0 | 2026-01-07 | A | 3 | (1 + 3)/2 = 2 |\n| 1 | 2026-01-05 | B | 10 | NaN (une seule ligne) |\n| 2 | 2026-01-05 | A | 1 | NaN (une seule ligne) |\n| 3 | 2026-01-08 | A | 5 | (3 + 5)/2 = 4 |\n| 4 | 2026-01-06 | A | NaN | NaN (une seule valeur non manquante, 1) |\n| 5 | 2026-01-06 | B | 20 | (10 + 20)/2 = 15 |\n\nLigne 3 : les trois lignes de A les plus récentes jusqu'au 2026-01-08 sont celles des 2026-01-06 (`NaN`), 2026-01-07 (3) et 2026-01-08 (5) ; deux valeurs non manquantes, donc la moyenne de 3 et 5. Ligne 0 : la fenêtre contient 1, `NaN` et 3.\n\n**Ce que vise l'exercice.** Trier, grouper par actif, régler `min_periods`, puis revenir à l'index d'origine malgré l'index à deux niveaux que renvoie `groupby(...).rolling(...)` (leçon, section 2). Sur l'exemple trié par date, une fenêtre sans `groupby` donnerait à la ligne 0 la valeur 11,5, moyenne de B le 2026-01-06 et de A le 2026-01-07 : une fuite entre actifs.\n\n\n**Fonctionnement.** Notebook sous Python 3.9 et pandas 1.4.2. Tolérance de comparaison des nombres : `1e-9` ; limite de temps : 10 secondes par test. **Tests visibles** exécute 2 tests visibles ; **Soumettre** exécute 8 tests cachés et n'affiche que leurs noms et leur résultat.\n", "dossier": "coding/seance2", "module_tests": "coding/seance2/tests_e1.py", "fonction": "moyenne_glissante", "cellules_initiales": ["import numpy as np\nimport pandas as pd\n\nexemple = pd.DataFrame(\n    [(\"2026-01-07\", \"A\", 3.0), (\"2026-01-05\", \"B\", 10.0), (\"2026-01-05\", \"A\", 1.0),\n     (\"2026-01-08\", \"A\", 5.0), (\"2026-01-06\", \"A\", np.nan), (\"2026-01-06\", \"B\", 20.0)],\n    columns=[\"date\", \"actif\", \"rendement\"])\nexemple", "def moyenne_glissante(df: pd.DataFrame, fenetre: int, min_periodes: int) -> pd.Series:\n    # À compléter\n    return pd.Series(np.nan, index=df.index)", "moyenne_glissante(exemple, 3, 2)"], "tests_visibles": 2, "tests_caches": 8, "fichier_correction": "coding/seance2/_correction.py", "verif": {"script": "coding/seance2/tests_e1.py"}, "fiche": null, "solution": "Correction commentée, avec une version pandas et une version sans bibliothèque externe (`coding/seance2/_correction.py`) :\n\n```python\n\"\"\"Corrections de la séance de code 2. À n'ouvrir qu'après avoir tenté les exercices.\n\nChaque fonction existe en deux versions indépendantes : pandas, et sans bibliothèque externe\n(bibliothèque standard seulement : math, calendar). Les tests exigent qu'elles soient d'accord.\nTestées avec pandas 1.4.2 (environnement des notebooks de la plateforme) et pandas 2.3.3.\n\"\"\"\nimport calendar\nimport math\n\nimport numpy as np\nimport pandas as pd\n\nNAN = float(\"nan\")\n\n\ndef _nan(x):\n    return isinstance(x, float) and math.isnan(x)\n\n\n# ------------------------------------------------------------------ exercice 1\ndef moyenne_glissante(df: pd.DataFrame, fenetre: int, min_periodes: int) -> pd.Series:\n    if df.empty:\n        return pd.Series(np.nan, index=df.index, dtype=float)\n    # 1. Trier par date : rolling, comme shift, travaille dans l'ordre des lignes.\n    #    Trier par date suffit, car groupby conserve l'ordre des lignes à l'intérieur de chaque actif.\n    d = df.sort_values(\"date\")\n    # 2. La fenêtre glisse À L'INTÉRIEUR de chaque actif : sans groupby, la fenêtre de la première\n    #    date d'un actif contiendrait les dernières lignes d'un autre actif.\n    #    min_periods compte les valeurs NON MANQUANTES de la fenêtre.\n    m = d.groupby(\"actif\")[\"rendement\"].rolling(fenetre, min_periods=min_periodes).mean()\n    # 3. groupby(...).rolling(...) renvoie un index à deux niveaux (actif, étiquette d'origine) :\n    #    on retire le niveau actif, puis on revient à l'ordre de df.\n    return m.reset_index(level=0, drop=True).reindex(df.index)\n\n\ndef moyenne_glissante_pur(lignes, fenetre, min_periodes):\n    \"\"\"lignes : liste de (index, date, actif, rendement). Renvoie {index: moyenne ou nan}.\"\"\"\n    par_actif = {}\n    for i, date, actif, r in lignes:\n        par_actif.setdefault(actif, []).append((date, i, r))\n    sortie = {}\n    for serie in par_actif.values():\n        serie.sort(key=lambda t: t[0])  # au plus une ligne par (date, actif) : pas d'égalité de dates\n        for k in range(len(serie)):\n            valeurs = [r for _, _, r in serie[max(0, k - fenetre + 1):k + 1] if not _nan(r)]\n            sortie[serie[k][1]] = sum(valeurs) / len(valeurs) if len(valeurs) >= min_periodes else NAN\n    return sortie\n\n\n# ------------------------------------------------------------------ exercice 2\nCOLONNES_E2 = [\"actif\", \"fin_de_mois\", \"date\", \"prix\", \"signal\"]\n\n\ndef _regle_mensuelle():\n    # \"M\" en pandas 1.4.2 ; \"ME\" dans les versions récentes (2.3.3 testée), où \"M\" émet un avertissement.\n    try:\n        pd.Series([1.0], index=pd.to_datetime([\"2026-01-05\"])).resample(\"ME\").last()\n        return \"ME\"\n    except ValueError:\n        return \"M\"\n\n\ndef mensualiser(prix: pd.DataFrame, signaux: pd.DataFrame) -> pd.DataFrame:\n    # 1. Ne garder que les prix connus AVANT de rééchantillonner : sinon la « dernière ligne du mois »\n    #    pourrait être une ligne sans prix, et sa date ne serait pas celle du prix retenu.\n    p = prix.dropna(subset=[\"prix\"])\n    if p.empty:\n        return pd.DataFrame({c: pd.Series(dtype=float if c in (\"prix\", \"signal\") else object) for c in COLONNES_E2})\n    p = p.assign(date=pd.to_datetime(p[\"date\"]))\n    p = p.assign(jour=p[\"date\"]).set_index(\"date\").sort_index()\n    # 2. Dernier prix connu du mois, actif par actif. resample étiquette chaque mois par son dernier\n    #    jour civil et crée une ligne vide pour un mois sans observation situé entre deux mois observés :\n    #    dropna les retire.\n    m = (p.groupby(\"actif\")[[\"jour\", \"prix\"]].resample(_regle_mensuelle()).last()\n         .dropna(subset=[\"prix\"]).reset_index().rename(columns={\"date\": \"fin_de_mois\"}))\n    # 3. merge_asof : pour chaque ligne de gauche, la dernière ligne de droite du même actif (by) dont la\n    #    date est STRICTEMENT antérieure (allow_exact_matches=False). Les deux cadres doivent être triés\n    #    par la clé on, qui doit être une date ou un nombre (pas une chaîne).\n    s = signaux.assign(jour=pd.to_datetime(signaux[\"date\"]))[[\"jour\", \"actif\", \"signal\"]].sort_values(\"jour\")\n    s = s.astype({\"actif\": m[\"actif\"].dtype, \"signal\": float})\n    r = pd.merge_asof(m.sort_values(\"jour\"), s, on=\"jour\", by=\"actif\", allow_exact_matches=False)\n    r = r.sort_values([\"actif\", \"fin_de_mois\"]).reset_index(drop=True)\n    r[\"fin_de_mois\"] = r[\"fin_de_mois\"].dt.strftime(\"%Y-%m-%d\")\n    r[\"date\"] = r[\"jour\"].dt.strftime(\"%Y-%m-%d\")\n    return r[COLONNES_E2]\n\n\ndef mensualiser_pur(lignes_prix, lignes_signaux):\n    \"\"\"lignes_prix : (date, actif, prix) ; lignes_signaux : (date, actif, signal).\n    Renvoie la liste triée des (actif, fin_de_mois, date, prix, signal).\"\"\"\n    dernier = {}\n    for date, actif, p in lignes_prix:\n        if _nan(p):\n            continue\n        cle = (actif, date[:7])\n        if cle not in dernier or date > dernier[cle][0]:\n            dernier[cle] = (date, p)\n    par_actif = {}\n    for date, actif, s in lignes_signaux:\n        par_actif.setdefault(actif, []).append((date, s))\n    for v in par_actif.values():\n        v.sort(key=lambda t: t[0])\n    sortie = []\n    for actif, mois in sorted(dernier):\n        date, p = dernier[(actif, mois)]\n        annee, numero = int(mois[:4]), int(mois[5:7])\n        fin = f\"{mois}-{calendar.monthrange(annee, numero)[1]:02d}\"\n        anterieurs = [s for d, s in par_actif.get(actif, []) if d < date]  # chaînes AAAA-MM-JJ : ordre = chronologie\n        sortie.append((actif, fin, date, p, anterieurs[-1] if anterieurs else NAN))\n    return sortie\n\n\n# ------------------------------------------------------------------ exercice 3\ndef normaliser(df: pd.DataFrame, q_bas: float, q_haut: float) -> pd.DataFrame:\n    if df.empty:\n        return pd.DataFrame({\"w\": [], \"z\": [], \"rang\": []}, index=df.index, dtype=float)\n    g = df.groupby(\"date\")[\"signal\"]\n    # 1. Quantiles de chaque date (interpolation linéaire, la définition de l'énoncé, qui est celle\n    #    par défaut de pandas et de numpy), répandus sur les lignes de la date par map.\n    bas = df[\"date\"].map(g.quantile(q_bas))\n    haut = df[\"date\"].map(g.quantile(q_haut))\n    w = df[\"signal\"].clip(lower=bas, upper=haut)\n    # 2. z-score du signal winsorisé, date par date ; std de pandas : dénominateur n - 1.\n    gw = w.groupby(df[\"date\"])\n    z = (w - gw.transform(\"mean\")) / gw.transform(\"std\")\n    # Valeurs toutes égales : on renvoie NaN par la règle de l'énoncé, sans tester std == 0, car l'écart-type\n    # calculé de valeurs égales n'est pas toujours exactement nul en flottants (0,1 trois fois par exemple).\n    # nunique ignore les NaN : il vaut 1 pour une seule valeur non manquante aussi.\n    z = z.where(gw.transform(\"nunique\") > 1)\n    # 3. Rang du signal BRUT divisé par le nombre de signaux non manquants de la date.\n    rang = g.rank(pct=True)\n    return pd.DataFrame({\"w\": w, \"z\": z, \"rang\": rang}, index=df.index).astype(float)\n\n\ndef quantile_lineaire(triees, q):\n    \"\"\"Quantile d'une liste triée non vide, par la définition de l'énoncé.\"\"\"\n    h = (len(triees) - 1) * q\n    i = math.floor(h)\n    f = h - i\n    if f == 0 or i + 1 >= len(triees):\n        return triees[i]\n    return triees[i] + f * (triees[i + 1] - triees[i])\n\n\ndef rangs_moyens(valeurs):\n    \"\"\"Rangs moyens (à partir de 1) d'une liste de nombres sans NaN.\"\"\"\n    ordre = sorted(range(len(valeurs)), key=lambda i: valeurs[i])\n    rangs = [0.0] * len(valeurs)\n    i = 0\n    while i < len(ordre):\n        j = i\n        while j + 1 < len(ordre) and valeurs[ordre[j + 1]] == valeurs[ordre[i]]:\n            j += 1\n        for k in range(i, j + 1):\n            rangs[ordre[k]] = (i + j) / 2 + 1\n        i = j + 1\n    return rangs\n\n\ndef normaliser_pur(lignes, q_bas, q_haut):\n    \"\"\"lignes : liste de (index, date, signal). Renvoie {index: (w, z, rang)}.\"\"\"\n    par_date = {}\n    sortie = {}\n    for i, date, s in lignes:\n        if _nan(s):\n            sortie[i] = (NAN, NAN, NAN)\n        else:\n            par_date.setdefault(date, []).append((i, s))\n    for couples in par_date.values():\n        valeurs = [s for _, s in couples]\n        n = len(valeurs)\n        triees = sorted(valeurs)\n        b, h = quantile_lineaire(triees, q_bas), quantile_lineaire(triees, q_haut)\n        w = [min(max(s, b), h) for s in valeurs]\n        if len(set(w)) > 1:\n            moy = sum(w) / n\n            et = math.sqrt(sum((x - moy) ** 2 for x in w) / (n - 1))\n            z = [(x - moy) / et for x in w]\n        else:\n            z = [NAN] * n\n        for (i, _), wi, zi, r in zip(couples, w, z, rangs_moyens(valeurs)):\n            sortie[i] = (wi, zi, r / n)\n    return sortie\n\n\n# ------------------------------------------------------------------ exercice 4\nJOURS_PAR_AN = 252\n\n\ndef sharpe_annualise(rendements):\n    \"\"\"Ratio de Sharpe annualisé d'une Series : racine(252) x moyenne / écart-type (dénominateur n - 1).\"\"\"\n    if len(rendements) < 2 or rendements.nunique() == 1:\n        return NAN\n    return float(math.sqrt(JOURS_PAR_AN) * rendements.mean() / rendements.std())\n\n\ndef backtest(df: pd.DataFrame, nb_groupes: int):\n    # 1. Format large : une ligne par date du calendrier (toutes les dates de df), une colonne par actif,\n    #    triées. Une absence de ligne devient NaN, à la bonne place dans le calendrier.\n    prix = df.pivot(index=\"date\", columns=\"actif\", values=\"prix\").sort_index().sort_index(axis=1)\n    signal = df.pivot(index=\"date\", columns=\"actif\", values=\"signal\").reindex(index=prix.index, columns=prix.columns)\n    # 2. Rendement réalisé de t à t+1, rangé à la ligne t : shift(-1) va chercher la date SUIVANTE du calendrier.\n    #    Prix en t+1 inconnu : la position rapporte 0 (convention de l'énoncé).\n    r = (prix.shift(-1) / prix - 1).fillna(0.0)\n    # 3. Éligibles en t : signal et prix connus en t. Aucune information de t+1 n'intervient ici.\n    eligible = prix.notna() & signal.notna()\n    # 4. Rangs 1..n_t ; method=\"first\" départage les égalités par position de colonne, donc par actif croissant.\n    rang = signal.where(eligible).rank(axis=1, method=\"first\")\n    n = eligible.sum(axis=1)\n    k = n // nb_groupes\n    long_ = rang.gt(n - k, axis=0)\n    court = rang.le(k, axis=0)\n    # 5. Poids +1/k et -1/k ; k = 0 : aucune position, rendement 0.\n    pf = (r.where(long_).sum(axis=1) - r.where(court).sum(axis=1)) / k.where(k > 0)\n    pf = pf.fillna(0.0).iloc[:-1].astype(float)  # la dernière date n'a pas de rendement réalisé\n    return pf, sharpe_annualise(pf)\n\n\ndef backtest_pur(lignes, nb_groupes):\n    \"\"\"lignes : liste de (date, actif, prix, signal). Renvoie ([(date, rendement)], sharpe).\"\"\"\n    par_date = {}\n    for date, actif, p, s in lignes:\n        par_date.setdefault(date, {})[actif] = (p, s)\n    dates = sorted(par_date)\n    serie = []\n    for t, suivante in zip(dates, dates[1:]):\n        eligibles = sorted((s, a) for a, (p, s) in par_date[t].items() if not (_nan(p) or _nan(s)))\n        k = len(eligibles) // nb_groupes\n        if k == 0:\n            serie.append((t, 0.0))\n            continue\n\n        def rendement(a):\n            p1 = par_date[suivante].get(a, (NAN, NAN))[0]\n            return 0.0 if _nan(p1) else p1 / par_date[t][a][0] - 1\n\n        courts = [a for _, a in eligibles[:k]]\n        longs = [a for _, a in eligibles[-k:]]\n        serie.append((t, sum(rendement(a) for a in longs) / k - sum(rendement(a) for a in courts) / k))\n    valeurs = [v for _, v in serie]\n    if len(valeurs) < 2 or len(set(valeurs)) == 1:\n        return serie, NAN\n    moy = sum(valeurs) / len(valeurs)\n    et = math.sqrt(sum((v - moy) ** 2 for v in valeurs) / (len(valeurs) - 1))\n    return serie, math.sqrt(JOURS_PAR_AN) * moy / et\n```"}, {"id": "S2-E2", "type": "code", "section": "code", "theme": "pandas : rééchantillonnage et merge_asof", "difficulte": 4, "temps_cible_s": 720, "enonce": "## Exercice 2 : dernier prix du mois et dernier signal disponible\n\nDéfinis `mensualiser(prix, signaux)`.\n\n**Entrées.**\n\n- `prix` : DataFrame aux colonnes `date` (chaîne `AAAA-MM-JJ`), `actif` (chaîne), `prix` (nombre strictement positif ou `NaN`). Au plus une ligne par couple (`date`, `actif`).\n- `signaux` : DataFrame aux colonnes `date` (chaîne `AAAA-MM-JJ`, n'importe quel jour, week-ends compris), `actif` (chaîne), `signal` (nombre, jamais `NaN`). Au plus une ligne par couple (`date`, `actif`). Un signal daté du jour `j` est publié **après la clôture** de `j`.\n\nLes deux cadres ont des lignes dans un ordre quelconque, un index quelconque, et peuvent être vides (zéro ligne, colonnes présentes).\n\n**Sortie.** Un DataFrame avec **une ligne par couple (actif, mois civil)** tel que l'actif a au moins un prix non manquant dans ce mois, et exactement les colonnes suivantes, dans cet ordre :\n\n| Colonne | Contenu |\n|---|---|\n| `actif` | l'actif |\n| `fin_de_mois` | le dernier jour civil du mois, chaîne `AAAA-MM-JJ` (par exemple 2026-02-28) |\n| `date` | la plus grande date du mois où l'actif a un prix **non manquant** |\n| `prix` | ce prix |\n| `signal` | le signal de l'actif dont la date est la plus grande date **strictement antérieure** à `date` ; `NaN` s'il n'y en a pas |\n\nLignes triées par `actif` puis par `fin_de_mois` (ordre croissant des chaînes). L'index n'est pas vérifié. Les colonnes de dates peuvent être des chaînes `AAAA-MM-JJ` ou des `Timestamp`. Entrée sans aucun prix non manquant : un DataFrame vide avec ces cinq colonnes.\n\nL'idée : la décision mensuelle est prise à la clôture de la dernière observation du mois, et ne peut utiliser qu'un signal publié avant cette clôture, donc daté d'un jour strictement antérieur.\n\n**Exemple.**\n\n`prix` :\n\n| date | actif | prix |\n|---|---|---|\n| 2026-01-30 | A | 11 |\n| 2026-03-31 | B | NaN |\n| 2026-01-29 | A | 10 |\n| 2026-01-30 | B | 20 |\n| 2026-02-27 | A | 12 |\n| 2026-03-30 | B | 21 |\n\n`signaux` :\n\n| date | actif | signal |\n|---|---|---|\n| 2026-01-30 | A | 0.7 |\n| 2026-03-30 | B | 2.0 |\n| 2026-01-29 | A | 0.5 |\n| 2026-01-31 | B | -1.0 |\n\nSortie :\n\n| actif | fin_de_mois | date | prix | signal |\n|---|---|---|---|---|\n| A | 2026-01-31 | 2026-01-30 | 11 | 0.5 |\n| A | 2026-02-28 | 2026-02-27 | 12 | 0.7 |\n| B | 2026-01-31 | 2026-01-30 | 20 | NaN |\n| B | 2026-03-31 | 2026-03-30 | 21 | -1.0 |\n\nLecture : en janvier, A a pour dernière observation le 2026-01-30 ; son signal du même jour est exclu, celui du 29 est retenu. En février, le signal du 30 janvier est le dernier strictement antérieur au 27 février. B n'a aucun prix en février : pas de ligne. En mars, le prix du 31 manque, la dernière observation est donc le 30, et le signal du 30 est exclu : il reste celui du 31 janvier (un samedi). B en janvier : aucun signal de B avant le 30 janvier.\n\n**Ce que vise l'exercice.** `resample(\"M\")` par actif après avoir retiré les prix manquants, `dropna` des mois vides, puis `merge_asof` avec `by` et `allow_exact_matches=False` sur des colonnes converties en dates (leçon, sections 3 et 4). Une solution par `groupby` sur le mois et une recherche à la main est aussi acceptée, si elle tient dans le temps limite.\n\n\n**Fonctionnement.** Notebook sous Python 3.9 et pandas 1.4.2. Tolérance de comparaison des nombres : `1e-9` ; limite de temps : 10 secondes par test. **Tests visibles** exécute 2 tests visibles ; **Soumettre** exécute 8 tests cachés et n'affiche que leurs noms et leur résultat.\n", "dossier": "coding/seance2", "module_tests": "coding/seance2/tests_e2.py", "fonction": "mensualiser", "cellules_initiales": ["import numpy as np\nimport pandas as pd\n\nprix = pd.DataFrame(\n    [(\"2026-01-30\", \"A\", 11.0), (\"2026-03-31\", \"B\", np.nan), (\"2026-01-29\", \"A\", 10.0),\n     (\"2026-01-30\", \"B\", 20.0), (\"2026-02-27\", \"A\", 12.0), (\"2026-03-30\", \"B\", 21.0)],\n    columns=[\"date\", \"actif\", \"prix\"])\nsignaux = pd.DataFrame(\n    [(\"2026-01-30\", \"A\", 0.7), (\"2026-03-30\", \"B\", 2.0), (\"2026-01-29\", \"A\", 0.5), (\"2026-01-31\", \"B\", -1.0)],\n    columns=[\"date\", \"actif\", \"signal\"])\nprix, signaux", "def mensualiser(prix: pd.DataFrame, signaux: pd.DataFrame) -> pd.DataFrame:\n    # À compléter\n    return pd.DataFrame(columns=[\"actif\", \"fin_de_mois\", \"date\", \"prix\", \"signal\"])", "mensualiser(prix, signaux)"], "tests_visibles": 2, "tests_caches": 8, "fichier_correction": "coding/seance2/_correction.py", "verif": {"script": "coding/seance2/tests_e2.py"}, "fiche": null, "solution": "Correction commentée, avec une version pandas et une version sans bibliothèque externe (`coding/seance2/_correction.py`) :\n\n```python\n\"\"\"Corrections de la séance de code 2. À n'ouvrir qu'après avoir tenté les exercices.\n\nChaque fonction existe en deux versions indépendantes : pandas, et sans bibliothèque externe\n(bibliothèque standard seulement : math, calendar). Les tests exigent qu'elles soient d'accord.\nTestées avec pandas 1.4.2 (environnement des notebooks de la plateforme) et pandas 2.3.3.\n\"\"\"\nimport calendar\nimport math\n\nimport numpy as np\nimport pandas as pd\n\nNAN = float(\"nan\")\n\n\ndef _nan(x):\n    return isinstance(x, float) and math.isnan(x)\n\n\n# ------------------------------------------------------------------ exercice 1\ndef moyenne_glissante(df: pd.DataFrame, fenetre: int, min_periodes: int) -> pd.Series:\n    if df.empty:\n        return pd.Series(np.nan, index=df.index, dtype=float)\n    # 1. Trier par date : rolling, comme shift, travaille dans l'ordre des lignes.\n    #    Trier par date suffit, car groupby conserve l'ordre des lignes à l'intérieur de chaque actif.\n    d = df.sort_values(\"date\")\n    # 2. La fenêtre glisse À L'INTÉRIEUR de chaque actif : sans groupby, la fenêtre de la première\n    #    date d'un actif contiendrait les dernières lignes d'un autre actif.\n    #    min_periods compte les valeurs NON MANQUANTES de la fenêtre.\n    m = d.groupby(\"actif\")[\"rendement\"].rolling(fenetre, min_periods=min_periodes).mean()\n    # 3. groupby(...).rolling(...) renvoie un index à deux niveaux (actif, étiquette d'origine) :\n    #    on retire le niveau actif, puis on revient à l'ordre de df.\n    return m.reset_index(level=0, drop=True).reindex(df.index)\n\n\ndef moyenne_glissante_pur(lignes, fenetre, min_periodes):\n    \"\"\"lignes : liste de (index, date, actif, rendement). Renvoie {index: moyenne ou nan}.\"\"\"\n    par_actif = {}\n    for i, date, actif, r in lignes:\n        par_actif.setdefault(actif, []).append((date, i, r))\n    sortie = {}\n    for serie in par_actif.values():\n        serie.sort(key=lambda t: t[0])  # au plus une ligne par (date, actif) : pas d'égalité de dates\n        for k in range(len(serie)):\n            valeurs = [r for _, _, r in serie[max(0, k - fenetre + 1):k + 1] if not _nan(r)]\n            sortie[serie[k][1]] = sum(valeurs) / len(valeurs) if len(valeurs) >= min_periodes else NAN\n    return sortie\n\n\n# ------------------------------------------------------------------ exercice 2\nCOLONNES_E2 = [\"actif\", \"fin_de_mois\", \"date\", \"prix\", \"signal\"]\n\n\ndef _regle_mensuelle():\n    # \"M\" en pandas 1.4.2 ; \"ME\" dans les versions récentes (2.3.3 testée), où \"M\" émet un avertissement.\n    try:\n        pd.Series([1.0], index=pd.to_datetime([\"2026-01-05\"])).resample(\"ME\").last()\n        return \"ME\"\n    except ValueError:\n        return \"M\"\n\n\ndef mensualiser(prix: pd.DataFrame, signaux: pd.DataFrame) -> pd.DataFrame:\n    # 1. Ne garder que les prix connus AVANT de rééchantillonner : sinon la « dernière ligne du mois »\n    #    pourrait être une ligne sans prix, et sa date ne serait pas celle du prix retenu.\n    p = prix.dropna(subset=[\"prix\"])\n    if p.empty:\n        return pd.DataFrame({c: pd.Series(dtype=float if c in (\"prix\", \"signal\") else object) for c in COLONNES_E2})\n    p = p.assign(date=pd.to_datetime(p[\"date\"]))\n    p = p.assign(jour=p[\"date\"]).set_index(\"date\").sort_index()\n    # 2. Dernier prix connu du mois, actif par actif. resample étiquette chaque mois par son dernier\n    #    jour civil et crée une ligne vide pour un mois sans observation situé entre deux mois observés :\n    #    dropna les retire.\n    m = (p.groupby(\"actif\")[[\"jour\", \"prix\"]].resample(_regle_mensuelle()).last()\n         .dropna(subset=[\"prix\"]).reset_index().rename(columns={\"date\": \"fin_de_mois\"}))\n    # 3. merge_asof : pour chaque ligne de gauche, la dernière ligne de droite du même actif (by) dont la\n    #    date est STRICTEMENT antérieure (allow_exact_matches=False). Les deux cadres doivent être triés\n    #    par la clé on, qui doit être une date ou un nombre (pas une chaîne).\n    s = signaux.assign(jour=pd.to_datetime(signaux[\"date\"]))[[\"jour\", \"actif\", \"signal\"]].sort_values(\"jour\")\n    s = s.astype({\"actif\": m[\"actif\"].dtype, \"signal\": float})\n    r = pd.merge_asof(m.sort_values(\"jour\"), s, on=\"jour\", by=\"actif\", allow_exact_matches=False)\n    r = r.sort_values([\"actif\", \"fin_de_mois\"]).reset_index(drop=True)\n    r[\"fin_de_mois\"] = r[\"fin_de_mois\"].dt.strftime(\"%Y-%m-%d\")\n    r[\"date\"] = r[\"jour\"].dt.strftime(\"%Y-%m-%d\")\n    return r[COLONNES_E2]\n\n\ndef mensualiser_pur(lignes_prix, lignes_signaux):\n    \"\"\"lignes_prix : (date, actif, prix) ; lignes_signaux : (date, actif, signal).\n    Renvoie la liste triée des (actif, fin_de_mois, date, prix, signal).\"\"\"\n    dernier = {}\n    for date, actif, p in lignes_prix:\n        if _nan(p):\n            continue\n        cle = (actif, date[:7])\n        if cle not in dernier or date > dernier[cle][0]:\n            dernier[cle] = (date, p)\n    par_actif = {}\n    for date, actif, s in lignes_signaux:\n        par_actif.setdefault(actif, []).append((date, s))\n    for v in par_actif.values():\n        v.sort(key=lambda t: t[0])\n    sortie = []\n    for actif, mois in sorted(dernier):\n        date, p = dernier[(actif, mois)]\n        annee, numero = int(mois[:4]), int(mois[5:7])\n        fin = f\"{mois}-{calendar.monthrange(annee, numero)[1]:02d}\"\n        anterieurs = [s for d, s in par_actif.get(actif, []) if d < date]  # chaînes AAAA-MM-JJ : ordre = chronologie\n        sortie.append((actif, fin, date, p, anterieurs[-1] if anterieurs else NAN))\n    return sortie\n\n\n# ------------------------------------------------------------------ exercice 3\ndef normaliser(df: pd.DataFrame, q_bas: float, q_haut: float) -> pd.DataFrame:\n    if df.empty:\n        return pd.DataFrame({\"w\": [], \"z\": [], \"rang\": []}, index=df.index, dtype=float)\n    g = df.groupby(\"date\")[\"signal\"]\n    # 1. Quantiles de chaque date (interpolation linéaire, la définition de l'énoncé, qui est celle\n    #    par défaut de pandas et de numpy), répandus sur les lignes de la date par map.\n    bas = df[\"date\"].map(g.quantile(q_bas))\n    haut = df[\"date\"].map(g.quantile(q_haut))\n    w = df[\"signal\"].clip(lower=bas, upper=haut)\n    # 2. z-score du signal winsorisé, date par date ; std de pandas : dénominateur n - 1.\n    gw = w.groupby(df[\"date\"])\n    z = (w - gw.transform(\"mean\")) / gw.transform(\"std\")\n    # Valeurs toutes égales : on renvoie NaN par la règle de l'énoncé, sans tester std == 0, car l'écart-type\n    # calculé de valeurs égales n'est pas toujours exactement nul en flottants (0,1 trois fois par exemple).\n    # nunique ignore les NaN : il vaut 1 pour une seule valeur non manquante aussi.\n    z = z.where(gw.transform(\"nunique\") > 1)\n    # 3. Rang du signal BRUT divisé par le nombre de signaux non manquants de la date.\n    rang = g.rank(pct=True)\n    return pd.DataFrame({\"w\": w, \"z\": z, \"rang\": rang}, index=df.index).astype(float)\n\n\ndef quantile_lineaire(triees, q):\n    \"\"\"Quantile d'une liste triée non vide, par la définition de l'énoncé.\"\"\"\n    h = (len(triees) - 1) * q\n    i = math.floor(h)\n    f = h - i\n    if f == 0 or i + 1 >= len(triees):\n        return triees[i]\n    return triees[i] + f * (triees[i + 1] - triees[i])\n\n\ndef rangs_moyens(valeurs):\n    \"\"\"Rangs moyens (à partir de 1) d'une liste de nombres sans NaN.\"\"\"\n    ordre = sorted(range(len(valeurs)), key=lambda i: valeurs[i])\n    rangs = [0.0] * len(valeurs)\n    i = 0\n    while i < len(ordre):\n        j = i\n        while j + 1 < len(ordre) and valeurs[ordre[j + 1]] == valeurs[ordre[i]]:\n            j += 1\n        for k in range(i, j + 1):\n            rangs[ordre[k]] = (i + j) / 2 + 1\n        i = j + 1\n    return rangs\n\n\ndef normaliser_pur(lignes, q_bas, q_haut):\n    \"\"\"lignes : liste de (index, date, signal). Renvoie {index: (w, z, rang)}.\"\"\"\n    par_date = {}\n    sortie = {}\n    for i, date, s in lignes:\n        if _nan(s):\n            sortie[i] = (NAN, NAN, NAN)\n        else:\n            par_date.setdefault(date, []).append((i, s))\n    for couples in par_date.values():\n        valeurs = [s for _, s in couples]\n        n = len(valeurs)\n        triees = sorted(valeurs)\n        b, h = quantile_lineaire(triees, q_bas), quantile_lineaire(triees, q_haut)\n        w = [min(max(s, b), h) for s in valeurs]\n        if len(set(w)) > 1:\n            moy = sum(w) / n\n            et = math.sqrt(sum((x - moy) ** 2 for x in w) / (n - 1))\n            z = [(x - moy) / et for x in w]\n        else:\n            z = [NAN] * n\n        for (i, _), wi, zi, r in zip(couples, w, z, rangs_moyens(valeurs)):\n            sortie[i] = (wi, zi, r / n)\n    return sortie\n\n\n# ------------------------------------------------------------------ exercice 4\nJOURS_PAR_AN = 252\n\n\ndef sharpe_annualise(rendements):\n    \"\"\"Ratio de Sharpe annualisé d'une Series : racine(252) x moyenne / écart-type (dénominateur n - 1).\"\"\"\n    if len(rendements) < 2 or rendements.nunique() == 1:\n        return NAN\n    return float(math.sqrt(JOURS_PAR_AN) * rendements.mean() / rendements.std())\n\n\ndef backtest(df: pd.DataFrame, nb_groupes: int):\n    # 1. Format large : une ligne par date du calendrier (toutes les dates de df), une colonne par actif,\n    #    triées. Une absence de ligne devient NaN, à la bonne place dans le calendrier.\n    prix = df.pivot(index=\"date\", columns=\"actif\", values=\"prix\").sort_index().sort_index(axis=1)\n    signal = df.pivot(index=\"date\", columns=\"actif\", values=\"signal\").reindex(index=prix.index, columns=prix.columns)\n    # 2. Rendement réalisé de t à t+1, rangé à la ligne t : shift(-1) va chercher la date SUIVANTE du calendrier.\n    #    Prix en t+1 inconnu : la position rapporte 0
