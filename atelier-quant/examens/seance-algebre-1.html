\), et en intégrant sur la loi de \\(\\mathbf{X}_T\\) (Fubini), avec probabilité 1. L'étape 2 conclut.\n\n### La preuve du biais des valeurs propres extrêmes\n\nSoit \\(\\mathbf{q}\\) un vecteur propre unitaire de \\(\\boldsymbol{\\Sigma}\\) associé à \\(\\lambda_{\\max}(\\boldsymbol{\\Sigma})\\), vecteur **fixe**. Pour chaque tirage, \\(\\lambda_{\\max}(\\mathbf{S}) \\ge \\mathbf{q}^\\top \\mathbf{S}\\,\\mathbf{q}\\) (Rayleigh, section 1). On prend l'espérance, qui conserve les inégalités (\\(\\lambda_{\\max}(\\mathbf{S})\\) est positive et majorée par \\(\\mathrm{tr}(\\mathbf{S})\\), d'espérance finie), et par linéarité et absence de biais \\(\\mathbb{E}[\\mathbf{q}^\\top \\mathbf{S}\\,\\mathbf{q}] = \\mathbf{q}^\\top \\mathbb{E}[\\mathbf{S}]\\,\\mathbf{q} = \\mathbf{q}^\\top \\boldsymbol{\\Sigma}\\,\\mathbf{q} = \\lambda_{\\max}(\\boldsymbol{\\Sigma})\\). Même argument pour le minimum avec l'inégalité inverse. La faute de raisonnement à éviter : prendre la plus grande valeur propre empirique pour un estimateur sans biais de la vraie, alors qu'on choisit la direction **après** avoir vu les données.\n\n### Exemples calculés\n\nRang, pour des rendements gaussiens indépendants :\n\n```python\nrng = np.random.default_rng(4)\nfor T, N in [(30, 50), (50, 50), (51, 50), (80, 50)]:\n    Xr = rng.standard_normal((T, N))\n    S = np.cov(Xr, rowvar=False)          # centrage et diviseur T - 1\n    print(\"T =\", T, \", N =\", N, \": rang\", np.linalg.matrix_rank(S), \"; min(N, T - 1) =\", min(N, T - 1))\n```\n\n```sortie\nT = 30 , N = 50 : rang 29 ; min(N, T - 1) = 29\nT = 50 , N = 50 : rang 49 ; min(N, T - 1) = 49\nT = 51 , N = 50 : rang 50 ; min(N, T - 1) = 50\nT = 80 , N = 50 : rang 50 ; min(N, T - 1) = 50\n```\n\nDispersion des valeurs propres empiriques, quand la vraie covariance est l'identité (toutes les vraies valeurs propres valent 1) :\n\n```python\nN, T = 100, 200\nXr = rng.standard_normal((T, N))\nvp = np.linalg.eigvalsh(np.cov(Xr, rowvar=False))\nprint(\"empiriques : plus petite\", vp.min().round(3), \"; plus grande\", vp.max().round(3), \"; moyenne\", vp.mean().round(3))\nc = N / T\nprint(\"bornes de Marchenko-Pastur :\", round((1 - c ** 0.5) ** 2, 3), \"et\", round((1 + c ** 0.5) ** 2, 3))\n```\n\n```sortie\nempiriques : plus petite 0.1 ; plus grande 2.878 ; moyenne 1.0\nbornes de Marchenko-Pastur : 0.086 et 2.914\n```\n\nLecture : la moyenne des valeurs propres empiriques est juste (c'est \\(\\mathrm{tr}(\\mathbf{S})/N\\), d'espérance \\(\\mathrm{tr}(\\boldsymbol{\\Sigma})/N = 1\\)), mais elles s'étalent largement autour de 1. Les bornes affichées viennent d'un résultat asymptotique **admis**, cité pour situer l'expérience et non utilisé ailleurs (Marčenko et Pastur, 1967, « Distribution of eigenvalues for some sets of random matrices », Mathematics of the USSR-Sbornik) : sous des hypothèses précises (coordonnées indépendantes, centrées, de variance 1, et \\(N/T\\) qui tend vers une constante \\(c \\in \\,]0, 1]\\)), la proportion de valeurs propres de \\(\\mathbf{S}\\) dans tout intervalle converge vers celle d'une loi de support \\([(1 - \\sqrt{c})^2, (1 + \\sqrt{c})^2]\\). Le script de vérification confirme le biais moyen démontré ci-dessus sur 2000 échantillons (\\(N = 20\\), \\(T = 40\\), \\(\\boldsymbol{\\Sigma} = \\mathbf{I}\\)) : moyenne de la plus grande valeur propre \\(2{,}652\\), de la plus petite \\(0{,}109\\).\n\n### Cas limites et pièges\n\n1. Oublier le centrage : sans soustraction de la moyenne (moyenne connue, supposée nulle), \\(\\tfrac{1}{T}\\sum_t \\mathbf{X}_t \\mathbf{X}_t^\\top\\) est de rang \\(\\min(N, T)\\), et non \\(\\min(N, T - 1)\\) ; la preuve est la même, avec les \\(\\mathbf{X}_t\\) eux-mêmes à la place des \\(\\mathbf{D}_t\\).\n2. L'hypothèse de densité compte : des rendements à valeurs discrètes (prix sur une grille de tick, rendements exactement nuls les jours sans cotation) peuvent faire tomber le rang. Exemple du script : \\(T = 4\\), \\(N = 3\\), coordonnées indépendantes uniformes sur \\(\\{-1, 0, 1\\}\\) ; le rang est inférieur à 3 dans une proportion \\(0{,}327\\) des tirages.\n3. \\(T > N\\) ne suffit pas à avoir une estimation fiable : \\(\\mathbf{S}\\) est alors inversible avec probabilité 1, mais dans l'exemple ci-dessus (\\(N/T = 1/2\\)), son conditionnement est le rapport des valeurs propres extrêmes affichées, alors que celui de \\(\\boldsymbol{\\Sigma} = \\mathbf{I}\\) vaut 1.\n4. Une colonne constante, ou un actif combinaison linéaire d'autres (un indice et ses composants), fait aussi chuter le rang : l'hypothèse de densité est alors fausse.\n\n## 9. Analyse en composantes principales\n\n### Le problème\n\nLes rendements de \\(N\\) actifs sont corrélés. On cherche quelques portefeuilles qui résument la plus grande part possible de leur variabilité totale, sans redondance entre eux.\n\n### L'intuition\n\nLe portefeuille de poids \\(\\mathbf{w}\\) (vecteur unitaire) a pour variance \\(\\mathbf{w}^\\top \\boldsymbol{\\Sigma}\\,\\mathbf{w}\\) : c'est un quotient de Rayleigh. La direction de variance maximale est donc le premier vecteur propre de \\(\\boldsymbol{\\Sigma}\\), et la suivante, cherchée orthogonale à la première, est le deuxième vecteur propre.\n\n### L'énoncé\n\nSoit \\(\\mathbf{R}\\) un vecteur aléatoire de \\(\\mathbb{R}^N\\) de moyenne \\(\\mathbf{m}\\) et de covariance \\(\\boldsymbol{\\Sigma}\\), avec \\(\\boldsymbol{\\Sigma} = \\sum_k \\lambda_k \\mathbf{q}_k \\mathbf{q}_k^\\top\\), \\(\\lambda_1 \\ge \\dots \\ge \\lambda_N \\ge 0\\) (section 1).\n\n1. \\(\\max_{\\lVert \\mathbf{w} \\rVert = 1} \\mathrm{Var}(\\mathbf{w}^\\top \\mathbf{R}) = \\lambda_1\\), atteint en \\(\\mathbf{w} = \\mathbf{q}_1\\). Pour \\(k \\ge 2\\), parmi les \\(\\mathbf{w}\\) unitaires orthogonaux à \\(\\mathbf{q}_1, \\dots, \\mathbf{q}_{k-1}\\), le maximum de la variance vaut \\(\\lambda_k\\), atteint en \\(\\mathbf{q}_k\\).\n2. Les **composantes principales** \\(G_k = \\mathbf{q}_k^\\top (\\mathbf{R} - \\mathbf{m})\\) (variables aléatoires réelles) sont non corrélées entre elles, de variances \\(\\lambda_k\\). La variance totale \\(\\sum_i \\mathrm{Var}(R_i) = \\mathrm{tr}(\\boldsymbol{\\Sigma}) = \\sum_k \\lambda_k\\), et la **part de variance expliquée** par la composante \\(k\\) est \\(\\lambda_k / \\mathrm{tr}(\\boldsymbol{\\Sigma})\\).\n3. **ACP empirique et SVD.** Sur des données \\(\\mathbf{X}\\) (\\(T \\times N\\)), centrées en \\(\\mathbf{Y}\\) (section 8), de SVD \\(\\mathbf{Y} = \\sum_k s_k \\mathbf{u}_k \\mathbf{v}_k^\\top\\) : \\(\\mathbf{S} = \\mathbf{Y}^\\top \\mathbf{Y}/(T - 1)\\) a pour vecteurs propres les \\(\\mathbf{v}_k\\) et pour valeurs propres \\(s_k^2/(T - 1)\\) ; les valeurs des composantes aux \\(T\\) dates sont les coordonnées de \\(\\mathbf{Y}\\mathbf{v}_k = s_k \\mathbf{u}_k\\).\n4. **Rendements standardisés.** Soit \\(\\hat{\\sigma}_i > 0\\) l'écart-type empirique de l'actif \\(i\\), calculé avec le même diviseur \\(d\\) (\\(d = T\\) ou \\(d = T - 1\\)) que la matrice ci-dessous, \\(\\hat{\\mathbf{D}}\\) la matrice diagonale de coefficients \\(\\hat{\\sigma}_i\\), et \\(\\mathbf{Z} = \\mathbf{Y}\\hat{\\mathbf{D}}^{-1}\\) (rendements centrés, divisés par leur volatilité). Alors \\(\\mathbf{Z}^\\top \\mathbf{Z}/d\\) est la **matrice de corrélation empirique**. L'ACP des rendements standardisés est l'ACP de la corrélation : ses valeurs propres ont pour somme \\(N\\), et la part de la composante \\(k\\) est \\(\\lambda_k / N\\).\n5. **Modèle à un facteur.** Soit \\(R_i = \\beta_i F + E_i\\) pour \\(i = 1, \\dots, N\\), où \\(F\\) (le facteur) a pour variance \\(\\sigma_F^2 > 0\\), les \\(E_i\\) (parts propres à chaque actif) sont non corrélés entre eux et avec \\(F\\), de même variance \\(\\sigma_E^2 > 0\\), et \\(\\boldsymbol{\\beta} = (\\beta_1, \\dots, \\beta_N)\\) est un vecteur fixe non nul. Alors \\(\\boldsymbol{\\Sigma} = \\sigma_F^2 \\boldsymbol{\\beta}\\boldsymbol{\\beta}^\\top + \\sigma_E^2 \\mathbf{I}\\), la première direction principale est \\(\\boldsymbol{\\beta}/\\lVert \\boldsymbol{\\beta} \\rVert\\) **exactement**, de valeur propre \\(\\sigma_F^2 \\lVert \\boldsymbol{\\beta} \\rVert^2 + \\sigma_E^2\\), et toutes les autres valeurs propres valent \\(\\sigma_E^2\\). Si de plus tous les \\(\\beta_i\\) valent 1, la matrice de corrélation est l'équicorrélation \\(\\mathbf{C}_\\rho\\) avec \\(\\rho = \\sigma_F^2/(\\sigma_F^2 + \\sigma_E^2)\\) ; la première direction est \\(\\mathbf{1}/\\sqrt{N}\\) (poids égaux) et sa part vaut \\((1 + (N - 1)\\rho)/N\\).\n6. **Signe des poids.** Si toutes les corrélations sont strictement positives, la première direction principale de la matrice de corrélation peut être choisie à coordonnées toutes strictement positives.\n\n### La preuve\n\n1. \\(\\mathrm{Var}(\\mathbf{w}^\\top \\mathbf{R}) = \\mathbf{w}^\\top \\boldsymbol{\\Sigma}\\,\\mathbf{w}\\) (section 2) ; Rayleigh (section 1) donne le premier point. Pour \\(\\mathbf{w}\\) unitaire orthogonal à \\(\\mathbf{q}_1, \\dots, \\mathbf{q}_{k-1}\\) : \\(\\mathbf{w} = \\sum_{j \\ge k} c_j \\mathbf{q}_j\\) avec \\(\\sum_{j \\ge k} c_j^2 = 1\\), donc \\(\\mathbf{w}^\\top \\boldsymbol{\\Sigma}\\,\\mathbf{w} = \\sum_{j \\ge k} \\lambda_j c_j^2 \\le \\lambda_k\\), égalité en \\(\\mathbf{w} = \\mathbf{q}_k\\).\n2. \\(\\mathrm{Cov}(G_j, G_k) = \\mathbf{q}_j^\\top \\boldsymbol{\\Sigma}\\,\\mathbf{q}_k = \\lambda_k\\,\\mathbf{q}_j^\\top \\mathbf{q}_k\\), qui vaut \\(\\lambda_k\\) si \\(j = k\\) et 0 sinon. La variance totale est la somme des coefficients diagonaux, donc la trace, égale à la somme des valeurs propres (section 1).\n3. \\(\\mathbf{Y}^\\top \\mathbf{Y} = \\sum_k s_k^2 \\mathbf{v}_k \\mathbf{v}_k^\\top\\) (section 5, point 2), et \\(\\mathbf{Y}\\mathbf{v}_k = s_k \\mathbf{u}_k\\) par orthonormalité des \\(\\mathbf{v}_j\\). Numériquement, on calcule la SVD de \\(\\mathbf{Y}\\) sans former \\(\\mathbf{Y}^\\top \\mathbf{Y}\\), dont le conditionnement est le carré de celui de \\(\\mathbf{Y}\\) (ses valeurs singulières sont les \\(s_k^2\\)).\n4. Le coefficient \\((i, j)\\) de \\(\\mathbf{Z}^\\top \\mathbf{Z}/d\\) vaut \\(\\dfrac{1}{d}\\sum_t \\dfrac{y_{ti}\\,y_{tj}}{\\hat{\\sigma}_i \\hat{\\sigma}_j}\\), où \\(y_{ti}\\) est le coefficient de \\(\\mathbf{Y}\\) ; c'est la covariance empirique de diviseur \\(d\\) divisée par le produit des écarts-types de même diviseur, c'est-à-dire la corrélation empirique (les diviseurs se simplifient). Ses coefficients diagonaux valent 1, donc sa trace vaut \\(N\\). Si les diviseurs diffèrent (écarts-types en \\(T\\), matrice en \\(T - 1\\)), la matrice est multipliée par \\(T/(T - 1)\\) : mêmes vecteurs propres, mêmes parts.\n5. \\(\\mathrm{Cov}(R_i, R_j) = \\beta_i \\beta_j \\sigma_F^2 + \\mathrm{Cov}(E_i, E_j)\\) par bilinéarité de la covariance et non-corrélation de \\(F\\) et des \\(E_i\\) ; d'où \\(\\boldsymbol{\\Sigma}\\). Ensuite \\(\\boldsymbol{\\Sigma}\\boldsymbol{\\beta} = \\sigma_F^2 \\boldsymbol{\\beta}(\\boldsymbol{\\beta}^\\top \\boldsymbol{\\beta}) + \\sigma_E^2 \\boldsymbol{\\beta}\\), et pour \\(\\mathbf{x}\\) orthogonal à \\(\\boldsymbol{\\beta}\\), \\(\\boldsymbol{\\Sigma}\\mathbf{x} = \\sigma_E^2 \\mathbf{x}\\) : \\(N\\) valeurs propres en tout, la plus grande étant \\(\\sigma_F^2 \\lVert \\boldsymbol{\\beta} \\rVert^2 + \\sigma_E^2\\). Avec tous les \\(\\beta_i = 1\\) : chaque variance vaut \\(\\sigma_F^2 + \\sigma_E^2\\), chaque covariance \\(\\sigma_F^2\\), d'où la corrélation \\(\\rho\\) commune, et la section 2 donne la valeur propre \\(1 + (N - 1)\\rho\\), de vecteur \\(\\mathbf{1}\\).\n6. Soit \\(\\mathbf{q}\\) un vecteur propre unitaire de la plus grande valeur propre \\(\\lambda_1\\) de la corrélation \\(\\mathbf{C}\\), et \\(\\lvert \\mathbf{q} \\rvert\\) le vecteur des valeurs absolues de ses coordonnées, unitaire lui aussi. Comme tous les \\(c_{ij} > 0\\) : \\(\\lvert \\mathbf{q} \\rvert^\\top \\mathbf{C}\\,\\lvert \\mathbf{q} \\rvert = \\sum_{i,j} c_{ij} \\lvert q_i \\rvert \\lvert q_j \\rvert \\ge \\sum_{i,j} c_{ij} q_i q_j = \\lambda_1\\). Par Rayleigh, \\(\\lvert \\mathbf{q} \\rvert\\) atteint donc le maximum et est un vecteur propre associé à \\(\\lambda_1\\) (section 1, point 5). Sa coordonnée \\(i\\) vérifie \\(\\lambda_1 \\lvert q_i \\rvert = \\sum_j c_{ij} \\lvert q_j \\rvert > 0\\) (somme de termes positifs dont l'un au moins est non nul), et \\(\\lambda_1 \\ge c_{11} = 1 > 0\\) : toutes les coordonnées sont strictement positives.\n\n### Exemples calculés\n\nQuatre actifs construits comme \\(0{,}6\\,F + 0{,}8\\,E_i\\) (corrélation théorique commune \\(0{,}6^2 = 0{,}36\\)), puis multipliés par des échelles, le quatrième étant cinq fois plus volatil que les autres :\n\n```python\nrng = np.random.default_rng(5)\nT, N = 500, 4\nF = rng.standard_normal((T, 1))\nR = (0.6 * F + 0.8 * rng.standard_normal((T, N))) * np.array([0.01, 0.01, 0.01, 0.05])\nY = R - R.mean(axis=0)\nZ = Y / Y.std(axis=0)                     # rendements centrés, divisés par leur volatilité (diviseur T)\nC = Z.T.dot(Z) / T\nprint(\"Z^T Z / T = corrélation empirique :\", np.allclose(C, np.corrcoef(R, rowvar=False)))\nlam_c, Q_c = np.linalg.eigh(np.cov(R, rowvar=False))\nlam_r, Q_r = np.linalg.eigh(C)\nq_c, q_r = Q_c[:, -1] * np.sign(Q_c[:, -1].sum()), Q_r[:, -1] * np.sign(Q_r[:, -1].sum())   # signe fixé\nprint(\"ACP de la covariance, 1re direction :\", q_c.round(3), \"; part :\", (lam_c[-1] / lam_c.sum()).round(3))\nprint(\"ACP de la corrélation, 1re direction :\", q_r.round(3), \"; part :\", (lam_r[-1] / N).round(3))\nU, s, Vt = np.linalg.svd(Z, full_matrices=False)\nprint(\"SVD de Z : même direction :\", np.allclose(np.abs(Vt[0]), np.abs(Q_r[:, -1])), \"; s1^2 / T = lambda1 :\", np.isclose(s[0] ** 2 / T, lam_r[-1]))\n```\n\n```sortie\nZ^T Z / T = corrélation empirique : True\nACP de la covariance, 1re direction : [0.086 0.059 0.066 0.992] ; part : 0.897\nACP de la corrélation, 1re direction : [0.504 0.502 0.505 0.488] ; part : 0.496\nSVD de Z : même direction : True ; s1^2 / T = lambda1 : True\n```\n\nL'ACP de la covariance est dominée par l'actif le plus volatil, simplement à cause de son échelle ; l'ACP des rendements standardisés retrouve des poids presque égaux, la structure commune.\n\nModèle à un facteur, avec \\(\\sigma_F = 0{,}01\\) et \\(\\sigma_E = 0{,}02\\), puis avec des variances propres inégales :\n\n```python\nbeta = np.array([0.5, 0.8, 1.0, 1.2, 1.5])\nSig = 0.01 ** 2 * np.outer(beta, beta) + 0.02 ** 2 * np.eye(5)\nlam, Q = np.linalg.eigh(Sig)\nq1 = Q[:, -1] * np.sign(Q[:, -1].sum())\nprint(\"valeurs propres x 10000 :\", (lam * 1e4).round(4))\nprint(\"(sigma_F^2 |beta|^2 + sigma_E^2) x 10000 :\", ((0.01 ** 2 * beta.dot(beta) + 0.02 ** 2) * 1e4).round(4))\nprint(\"1re direction :\", q1.round(4), \"; beta / |beta| :\", (beta / np.linalg.norm(beta)).round(4))\nSig2 = 0.01 ** 2 * np.outer(beta, beta) + np.diag([0.01, 0.03, 0.01, 0.03, 0.02]) ** 2\nq2 = np.linalg.eigh(Sig2)[1][:, -1]\nq2 = q2 * np.sign(q2.sum())\nprint(\"variances propres inégales :\", q2.round(4), \"; cosinus avec beta :\", (q2.dot(beta) / np.linalg.norm(beta)).round(4))\n```\n\n```sortie\nvaleurs propres x 10000 : [4.   4.   4.   4.   9.58]\n(sigma_F^2 |beta|^2 + sigma_E^2) x 10000 : 9.58\n1re direction : [0.2117 0.3387 0.4233 0.508  0.635 ] ; beta / |beta| : [0.2117 0.3387 0.4233 0.508  0.635 ]\nvariances propres inégales : [0.0924 0.5008 0.1849 0.7513 0.3769] ; cosinus avec beta : 0.8884\n```\n\n### Ce que l'on peut dire du « facteur de marché »\n\nDémontré : dans un modèle à un facteur avec des variances propres égales, la première composante est exactement le vecteur des expositions \\(\\boldsymbol{\\beta}\\) normalisé ; si de plus les expositions sont égales, c'est le portefeuille équipondéré, et sa part tend vers \\(\\rho\\) quand \\(N\\) grandit. Si toutes les corrélations sont positives, la première composante est un portefeuille à poids tous de même signe (point 6). Non démontré ici : avec des variances propres inégales, la première composante n'est qu'une approximation de \\(\\boldsymbol{\\beta}\\) (cosinus inférieur à 1 dans l'exemple). Et l'affirmation empirique selon laquelle, sur de vraies actions, la première composante ressemble à l'indice de marché et explique une part donnée de la variance n'est pas établie dans ce programme : aucun chiffre n'est donné, faute de source vérifiée.\n\n### Pièges\n\n1. Faire l'ACP de la covariance sur des actifs de volatilités très différentes et l'interpréter comme une structure de dépendance : elle mesure surtout les échelles.\n2. Diviser par la somme des valeurs propres **affichées** quand on n'en connaît que quelques-unes : pour une corrélation, la somme de toutes vaut \\(N\\).\n3. Interpréter le signe d'un vecteur propre : il est arbitraire.\n4. Oublier de centrer avant la SVD : la première direction capte alors la moyenne, pas la variance.\n5. Avec \\(T \\le N\\), \\(N - T + 1\\) valeurs propres au moins sont nulles (section 8) : les dernières composantes ne sont pas estimées du tout.\n\n[[controle:acp]]\n\n## 10. Rétrécissement de Ledoit-Wolf\n\n### Le problème\n\nLa section 8 montre que \\(\\mathbf{S}\\) est singulière si \\(T \\le N\\), et mal conditionnée si \\(N/T\\) n'est pas petit, avec des valeurs propres trop dispersées. On veut un estimateur toujours inversible, bien conditionné, et plus proche de \\(\\boldsymbol{\\Sigma}\\) que \\(\\mathbf{S}\\).\n\n### L'intuition\n\nOn mélange \\(\\mathbf{S}\\), sans biais mais bruitée, avec une cible \\(\\mathbf{F}\\) très simple, biaisée mais peu bruitée. Avec la cible \\(\\mu\\,\\mathbf{I}\\), le mélange rapproche chaque valeur propre de leur moyenne : il corrige exactement la dispersion excessive de la section 8.\n\n### L'énoncé\n\nSoit \\(\\mathbf{S}\\) une matrice symétrique SDP \\(N \\times N\\), de décomposition \\(\\mathbf{S} = \\sum_k \\lambda_k \\mathbf{q}_k \\mathbf{q}_k^\\top\\), \\(\\mu = \\mathrm{tr}(\\mathbf{S})/N\\) la moyenne de ses valeurs propres (supposée strictement positive), \\(\\delta \\in [0, 1]\\) l'**intensité de rétrécissement**, et\n\n\\(\\displaystyle \\hat{\\boldsymbol{\\Sigma}}_\\delta = (1 - \\delta)\\,\\mathbf{S} + \\delta\\,\\mu\\,\\mathbf{I}.\\)\n\n1. \\(\\hat{\\boldsymbol{\\Sigma}}_\\delta\\) a les **mêmes vecteurs propres** que \\(\\mathbf{S}\\), de valeurs propres \\((1 - \\delta)\\lambda_k + \\delta\\mu\\) ; sa trace est celle de \\(\\mathbf{S}\\).\n2. Pour \\(\\delta > 0\\), toutes ses valeurs propres sont au moins \\(\\delta\\mu > 0\\) : \\(\\hat{\\boldsymbol{\\Sigma}}_\\delta\\) est DP, donc inversible, même si \\(\\mathbf{S}\\) est singulière.\n3. Si \\(\\lambda_{\\max} > \\lambda_{\\min}\\), le conditionnement \\(\\kappa(\\delta) = \\dfrac{(1 - \\delta)\\lambda_{\\max} + \\delta\\mu}{(1 - \\delta)\\lambda_{\\min} + \\delta\\mu}\\) décroît strictement de \\(\\kappa(\\mathbf{S})\\) (infini si \\(\\lambda_{\\min} = 0\\)) à 1 quand \\(\\delta\\) va de 0 à 1.\n4. Ce que fait `sklearn.covariance.LedoitWolf` (version 1.1.1, code source lu et recalculé ci-dessous) : \\(\\mathbf{S}\\) est la covariance empirique de diviseur \\(T\\) (et non \\(T - 1\\)) des lignes centrées \\(\\mathbf{y}_t\\) des données observées (valeurs fixes, d'où la minuscule), la cible est \\(\\mu\\,\\mathbf{I}\\), et l'intensité vaut \\(\\delta = \\min(\\bar{b}^2, d^2)/d^2\\) avec \\(d^2 = \\lVert \\mathbf{S} - \\mu\\,\\mathbf{I} \\rVert_F^2 / N\\) et \\(\\bar{b}^2 = \\dfrac{1}{N\\,T^2}\\sum_{t=1}^{T} \\lVert \\mathbf{y}_t \\mathbf{y}_t^\\top - \\mathbf{S} \\rVert_F^2\\). La documentation de scikit-learn renvoie pour cette formule à Ledoit et Wolf (2004), « A well-conditioned estimator for large-dimensional covariance matrices », Journal of Multivariate Analysis, volume 88, numéro 2, pages 365 à 411.\n\n### La preuve\n\n1. \\(\\hat{\\boldsymbol{\\Sigma}}_\\delta \\mathbf{q}_k = (1 - \\delta)\\lambda_k \\mathbf{q}_k + \\delta\\mu\\,\\mathbf{q}_k\\). Trace : \\((1 - \\delta)\\,\\mathrm{tr}(\\mathbf{S}) + \\delta\\mu N = \\mathrm{tr}(\\mathbf{S})\\).\n2. \\(\\lambda_k \\ge 0\\) (section 2) et \\(1 - \\delta \\ge 0\\), donc \\((1 - \\delta)\\lambda_k + \\delta\\mu \\ge \\delta\\mu > 0\\) ; la section 2 (cas DP) conclut.\n3. Les valeurs propres extrêmes de \\(\\hat{\\boldsymbol{\\Sigma}}_\\delta\\) sont les images de \\(\\lambda_{\\max}\\) et \\(\\lambda_{\\min}\\), car \\(\\lambda \\mapsto (1 - \\delta)\\lambda + \\delta\\mu\\) est croissante. On note \\(n(\\delta) = \\lambda_{\\max} + \\delta(\\mu - \\lambda_{\\max})\\) et \\(m(\\delta) = \\lambda_{\\min} + \\delta(\\mu - \\lambda_{\\min})\\), strictement positif pour \\(\\delta > 0\\). La dérivée de \\(n/m\\) a le signe de \\(n' m - n m' = (\\mu - \\lambda_{\\max})\\,m(\\delta) - (\\mu - \\lambda_{\\min})\\,n(\\delta)\\). Les termes en \\(\\delta\\) se compensent exactement (\\((\\mu - \\lambda_{\\max})(\\mu - \\lambda_{\\min})\\,\\delta\\) des deux côtés), et il reste \\((\\mu - \\lambda_{\\max})\\lambda_{\\min} - (\\mu - \\lambda_{\\min})\\lambda_{\\max} = \\mu\\,(\\lambda_{\\min} - \\lambda_{\\max}) < 0\\). En \\(\\delta = 1\\), toutes les valeurs propres valent \\(\\mu\\) et \\(\\kappa = 1\\).\n4. Le point 4 décrit un code et se vérifie en le recalculant (ci-dessous). Ce qui est **admis**, et non vérifié ici : le théorème de l'article, selon lequel cette intensité estimée est asymptotiquement optimale, parmi les combinaisons de \\(\\mathbf{S}\\) et de \\(\\mu\\,\\mathbf{I}\\), pour une perte quadratique de Frobenius normalisée, sous les hypothèses de l'article, y compris quand \\(N\\) et \\(T\\) grandissent ensemble.\n\n### Exemple calculé\n\n\\(N = 50\\) actifs, \\(T = 40\\) dates, vraie covariance diagonale d'écarts-types répartis de 0,5 à 2 :\n\n```python\nfrom sklearn.covariance import LedoitWolf\nimport sklearn\nrng = np.random.default_rng(6)\nN, T = 50, 40\nsd = np.linspace(0.5, 2.0, N)\nXr = rng.standard_normal((T, N)) * sd\nY = Xr - Xr.mean(axis=0)\nS = Y.T.dot(Y) / T                                   # diviseur T, comme scikit-learn\nmu = np.trace(S) / N\nd2 = ((S - mu * np.eye(N)) ** 2).sum() / N\nb2 = sum(((np.outer(y, y) - S) ** 2).sum() for y in Y) / N / T ** 2\ndelta = min(b2, d2) / d2\nlw = LedoitWolf().fit(Xr)\nprint(\"sklearn\", sklearn.__version__, \": shrinkage_ =\", round(lw.shrinkage_, 4), \"; recalcul :\", round(delta, 4))\nprint(\"même matrice :\", np.allclose(lw.covariance_, (1 - delta) * S + delta * mu * np.eye(N)))\nvs, vl = np.linalg.eigvalsh(S), np.linalg.eigvalsh(lw.covariance_)\nprint(\"S : rang\", np.linalg.matrix_rank(S), \"; plus petite valeur propre\", vs.min().round(6) + 0.0)\nprint(\"Ledoit-Wolf : plus petite valeur propre\", vl.min().round(4), \"; égale à delta * mu :\", np.isclose(vl.min(), delta * mu), \"; conditionnement\", (vl.max() / vl.min()).round(2))\nprint(\"mêmes vecteurs propres (5 premiers) :\", np.allclose(np.abs(np.linalg.eigh(S)[1][:, -5:]), np.abs(np.linalg.eigh(lw.covariance_)[1][:, -5:])))\nSigma = np.diag(sd ** 2)\nprint(\"distance de Frobenius à la vraie covariance : S\", np.linalg.norm(S - Sigma).round(3), \"; Ledoit-Wolf\", np.linalg.norm(lw.covariance_ - Sigma).round(3))\n```\n\n```sortie\nsklearn 1.1.1 : shrinkage_ = 0.7259 ; recalcul : 0.7259\nmême matrice : True\nS : rang 39 ; plus petite valeur propre 0.0\nLedoit-Wolf : plus petite valeur propre 1.2332 ; égale à delta * mu : True ; conditionnement 3.02\nmêmes vecteurs propres (5 premiers) : True\ndistance de Frobenius à la vraie covariance : S 13.876 ; Ledoit-Wolf 7.019\n```\n\nSur cet exemple, l'estimateur rétréci est plus proche de la vraie covariance que \\(\\mathbf{S}\\). C'est une illustration sur un tirage, pas une garantie : la garantie de l'article est asymptotique.\n\n### Cas limites et pièges\n\n1. \\(\\delta = 0\\) redonne \\(\\mathbf{S}\\), \\(\\delta = 1\\) donne \\(\\mu\\,\\mathbf{I}\\) : tous les actifs de même variance et non corrélés.\n2. Avec la cible \\(\\mu\\,\\mathbf{I}\\), les **vecteurs propres ne changent pas** : l'ACP (directions et ordre des composantes) est la même avant et après rétrécissement ; seules les valeurs propres, donc les parts et le conditionnement, changent. Le rétrécissement ne corrige pas le bruit des directions.\n3. Rétrécir vers \\(\\mathbf{I}\\) au lieu de \\(\\mu\\,\\mathbf{I}\\) : si les variances sont de l'ordre de \\(10^{-4}\\) (rendements quotidiens), la cible \\(\\mathbf{I}\\) est absurde d'échelle ; \\(\\mu\\) remet la cible à l'échelle des données.\n4. Le diviseur : scikit-learn utilise \\(T\\), `np.cov` utilise \\(T - 1\\) par défaut. Pour comparer, recalculer avec le même diviseur.\n5. D'autres cibles existent (par exemple une corrélation constante, ou un modèle à un facteur) ; l'énoncé 1 sur les vecteurs propres est propre à une cible multiple de \\(\\mathbf{I}\\).\n\n[[controle:lw]]\n\n## Réflexes en 30 secondes\n\n| Indice dans l'énoncé | Premier geste |\n|---|---|\n| « pour quels \\(\\rho\\) cette matrice est-elle une corrélation » | valeurs propres ; équicorrélation : \\(1 + (n-1)\\rho \\ge 0\\) et \\(1 - \\rho \\ge 0\\) ; sinon tous les mineurs principaux |\n| corrélations imposées pour deux paires, la troisième demandée | déterminant \\(3 \\times 3\\) positif ou nul, et vérifier les mineurs \\(2 \\times 2\\) |\n| mineurs dominants positifs ou nuls | ne conclut rien : chercher un coefficient diagonal ou un mineur non dominant négatif |\n| rang d'une covariance empirique, \\(T\\) dates, \\(N\\) actifs | \\(\\min(N, T - 1)\\) avec centrage, \\(\\min(N, T)\\) sans ; après démoyennage transversal (somme nulle sur les actifs à chaque date), le rang est au plus \\(N - 1\\) |\n| trace d'une projection, degrés de liberté | trace = rang = dimension de l'image ; résidus d'une régression à \\(p\\) colonnes : \\(T - p\\) |\n| valeurs singulières données | valeurs propres de \\(\\mathbf{X}^\\top \\mathbf{X}\\) : les carrés ; erreur de rang \\(k\\) : racine de la somme des carrés omis |\n| rendements « centrés et divisés par leur volatilité » | ACP de la corrélation ; somme des valeurs propres \\(= N\\) ; part \\(= \\lambda_k / N\\) |\n| sensibilité de \\(\\mathbf{w}\\) solution de \\(\\mathbf{A}\\mathbf{w} = \\mathbf{b}\\) | erreur relative multipliée par au plus \\(\\lambda_{\\max}/\\lambda_{\\min}\\) |\n| gradient d'une forme quadratique | \\((\\mathbf{A} + \\mathbf{A}^\\top)\\mathbf{x}\\) ; moindres carrés : \\(2\\mathbf{M}^\\top (\\mathbf{M}\\mathbf{x} - \\mathbf{b})\\) |\n| Ledoit-Wolf, cible \\(\\mu\\,\\mathbf{I}\\) | valeurs propres \\((1 - \\delta)\\lambda + \\delta\\mu\\), vecteurs propres inchangés |\n\nContrôles de vraisemblance en 5 secondes :\n\n- une matrice SDP a une diagonale positive ou nulle et \\(\\lvert a_{ij} \\rvert \\le \\sqrt{a_{ii} a_{jj}}\\) (mineur \\(2 \\times 2\\)) ;\n- la somme des valeurs propres est la trace ; une part de variance est entre 0 et 1 ;\n- un rang ne dépasse ni le nombre de lignes ni le nombre de colonnes.\n\n## À savoir refaire sans notes\n\n- Les valeurs propres d'une matrice symétrique sont réelles, les vecteurs propres de valeurs distinctes orthogonaux, et l'encadrement de Rayleigh avec son cas d'égalité.\n- Les équivalences SDP (valeurs propres, forme quadratique, \\(\\mathbf{B}^\\top \\mathbf{B}\\)), la positivité d'une covariance, et les valeurs propres de l'équicorrélation avec la borne \\(-1/(n-1)\\) par les deux preuves.\n- Le critère des mineurs principaux, le critère de Sylvester, et le contre-exemple des mineurs dominants.\n- Projection orthogonale : symétrique, idempotente, valeurs propres 0 et 1, trace = rang ; trace de la matrice chapeau.\n- La construction de la SVD à partir de \\(\\mathbf{X}^\\top \\mathbf{X}\\), et Eckart-Young en norme d'opérateur.\n- La borne de conditionnement et son cas d'égalité.\n- Les trois gradients composante par composante, et les équations normales.\n- Le rang \\(\\min(N, T - 1)\\) de la covariance empirique, majoration et égalité presque sûre (différences \\(\\mathbf{D}_t\\), mesure nulle d'un sous-espace strict, lemme de liberté) ; le biais des valeurs propres extrêmes.\n- L'ACP par Rayleigh, par SVD, l'égalité entre ACP des rendements standardisés et ACP de l onc l'ACP des rendements standardisés, ne dépend pas des échelles : chaque variable est divisée par son propre écart-type."}, {"id": "d", "texte": "L'ACP de la covariance est inchangée ; celle de la corrélation change.", "correcte": false, "explication": "C'est l'inverse : la standardisation supprime précisément l'effet d'échelle, que la covariance conserve."}]}, "lw": {"question": "Une covariance empirique \\(\\mathbf{S}\\) \\(4 \\times 4\\) a pour valeurs propres 4,8 ; 2,4 ; 0,8 ; 0, donc \\(\\mu = \\mathrm{tr}(\\mathbf{S})/4 = 2\\). On forme \\((1 - \\delta)\\,\\mathbf{S} + \\delta\\,\\mu\\,\\mathbf{I}\\) avec \\(\\delta = 1/4\\). Que vaut sa plus petite valeur propre ?", "options": [{"id": "a", "texte": "0,5", "correcte": true, "explication": "Oui : \\((1 - \\delta) \\times 0 + \\delta\\mu = \\tfrac14 \\times 2\\). Le rétrécissement rend la matrice inversible."}, {"id": "b", "texte": "0, car \\(\\mathbf{S}\\) est singulière et le rétrécissement ne change pas le noyau.", "correcte": false, "explication": "Les vecteurs propres sont inchangés, mais la valeur propre associée au noyau devient \\(\\delta\\mu > 0\\) : le noyau disparaît."}, {"id": "c", "texte": "0,25", "correcte": false, "explication": "C'est \\(\\delta \\times 1\\) : le rétrécissement vers \\(\\mathbf{I}\\) au lieu de \\(\\mu\\,\\mathbf{I}\\). Ici \\(\\mu = 2\\)."}, {"id": "d", "texte": "1,5", "correcte": false, "explication": "C'est \\((1 - \\delta)\\,\\mu\\) : les poids de \\(\\mathbf{S}\\) et de la cible ont été échangés. Le poids \\(\\delta\\) va à la cible \\(\\mu\\,\\mathbf{I}\\)."}]}}, "cellules_initiales": ["import numpy as np\nnp.set_printoptions(precision=4, suppress=True)\n\n# Essaie ici les exemples de la leçon, en les modifiant.\nA = np.array([[2.0, 1.0, 0.0], [1.0, 3.0, 1.0], [0.0, 1.0, 2.0]])\nnp.linalg.eigh(A)"], "verif": {"script": "verif/seance_algebre_1.py"}}]}, {"id": "math", "nom": "Mathématiques", "budget_min": 26, "questions": [{"id": "AL-01", "section": "math", "theme": "Équicorrélation, semi-définie positivité", "difficulte": 3, "temps_cible_s": 90, "enonce": "Soit \\(\\rho\\) un réel et \\(\\mathbf{C}\\) la matrice \\(5 \\times 5\\) dont les coefficients diagonaux valent 1 et tous les autres valent \\(\\rho\\). Une matrice de diagonale 1 est la matrice de corrélation d'un vecteur aléatoire si et seulement si elle est semi-définie positive (\\(\\mathbf{x}^\\top \\mathbf{C}\\,\\mathbf{x} \\ge 0\\) pour tout \\(\\mathbf{x} \\in \\mathbb{R}^5\\)).\n\nQuelle est la plus petite valeur de \\(\\rho\\) pour laquelle \\(\\mathbf{C}\\) est semi-définie positive ?", "options": [{"id": "a", "texte": "\\(-1/4\\)", "correcte": true, "explication": "Oui : la valeur propre simple \\(1 + 4\\rho\\) s'annule en \\(\\rho = -1/4\\), et l'autre, \\(1 - \\rho\\), est alors positive."}, {"id": "b", "texte": "\\(-1/5\\)", "correcte": false, "explication": "C'est \\(-1/n\\) au lieu de \\(-1/(n-1)\\). Pour \\(\\rho = -1/4\\), plus petit, la matrice est encore semi-définie positive (valeur propre \\(1 + 4\\rho = 0\\)) : \\(-1/5\\) n'est donc pas la plus petite valeur. Contrôle avec \\(n = 2\\) : la formule \\(-1/n\\) donnerait \\(-1/2\\), alors que \\(\\rho = -1\\) est possible pour deux variables."}, {"id": "c", "texte": "\\(-1/2\\)", "correcte": false, "explication": "C'est la borne pour trois variables (\\(n = 3\\), question DIAG-M4 du test de positionnement). Pour \\(n = 5\\), en \\(\\rho = -1/2\\), la valeur propre \\(1 + 4\\rho\\) vaut \\(-1 < 0\\)."}, {"id": "d", "texte": "\\(-1\\)", "correcte": false, "explication": "\\(\\lvert \\rho \\rvert \\le 1\\) est la seule condition pour deux variables. Pour cinq, en \\(\\rho = -1\\), la valeur propre \\(1 + 4\\rho\\) vaut \\(-3\\) : la somme des cinq variables aurait une variance négative."}], "solution": "Réponse : \\(\\rho = -1/4\\).\n\nNotations : \\(\\mathbf{I}\\) est l'identité \\(5 \\times 5\\), \\(\\mathbf{1}\\) le vecteur de \\(\\mathbb{R}^5\\) dont les coordonnées valent 1. Alors \\(\\mathbf{C} = (1 - \\rho)\\,\\mathbf{I} + \\rho\\,\\mathbf{1}\\mathbf{1}^\\top\\).\n\nÉtape 1, valeurs propres : \\(\\mathbf{C}\\mathbf{1} = (1 + 4\\rho)\\,\\mathbf{1}\\), car \\(\\mathbf{1}^\\top \\mathbf{1} = 5\\) ; pour tout \\(\\mathbf{x}\\) de somme nulle, \\(\\mathbf{C}\\mathbf{x} = (1 - \\rho)\\,\\mathbf{x}\\), et ces vecteurs forment un sous-espace de dimension 4. Les valeurs propres sont donc \\(1 + 4\\rho\\) (simple) et \\(1 - \\rho\\) (multiplicité 4).\n\nÉtape 2 : une matrice symétrique est semi-définie positive si et seulement si toutes ses valeurs propres sont positives ou nulles (leçon, section 2). Il faut \\(1 + 4\\rho \\ge 0\\) et \\(1 - \\rho \\ge 0\\), soit \\(-1/4 \\le \\rho \\le 1\\).\n\nSeconde voie, en 20 secondes : \\(\\mathrm{Var}(R_1 + \\dots + R_5) = \\mathbf{1}^\\top \\mathbf{C}\\,\\mathbf{1} = 5 + 20\\rho \\ge 0\\).\n\nVérification (script) : valeurs propres exactes pour \\(n\\) de 2 à 8, plus petite valeur propre nulle en \\(\\rho = -1/(n-1)\\) et négative juste en dessous.", "type": "qcm", "multiple": false, "reponse": "\\(-1/4\\)", "fiche": null, "verif": {"script": "verif/seance_algebre_1.py", "cles": ["Q01_borne_den", "Q01_borne_num", "Q01_d_3_den", "Q01_d_3_num", "Q01_d_n_den", "Q01_d_n_num", "Q01_mult", "Q01_vp_moins_demi", "Q01_vp_moins_un"]}}, {"id": "AL-02", "section": "math", "theme": "Matrice de corrélation, déterminant et mineurs", "difficulte": 4, "temps_cible_s": 150, "enonce": "Trois variables aléatoires \\(X_1\\), \\(X_2\\), \\(X_3\\) ont des variances finies et non nulles. On sait que \\(\\mathrm{corr}(X_1, X_2) = \\mathrm{corr}(X_1, X_3) = 0{,}8\\), où \\(\\mathrm{corr}\\) désigne le coefficient de corrélation linéaire.\n\nQuelle est la plus petite valeur possible de \\(\\mathrm{corr}(X_2, X_3)\\) ?", "options": [{"id": "a", "texte": "0,28", "correcte": true, "explication": "Oui : le déterminant de la matrice de corrélation vaut \\((1 - c)(1 + c - 2 \\times 0{,}8^2)\\), positif ou nul si et seulement si \\(c \\ge 2 \\times 0{,}8^2 - 1\\) (pour \\(c < 1\\))."}, {"id": "b", "texte": "0,64", "correcte": false, "explication": "C'est \\(0{,}8^2\\) : la corrélation obtenue quand \\(X_2\\) et \\(X_3\\) valent chacune \\(0{,}8\\,X_1\\) plus un bruit indépendant de tout le reste (variables réduites). C'est une valeur possible, pas la plus petite : en \\(c = 0{,}28\\), la matrice est encore semi-définie positive."}, {"id": "c", "texte": "-0,5", "correcte": false, "explication": "C'est la borne \\(-1/(n-1)\\) de l'équicorrélation à trois variables, quand les trois corrélations sont égales. Ici deux corrélations sont imposées à 0,8 : en \\(c = -0{,}5\\), la plus petite valeur propre vaut \\(-0{,}409 < 0\\)."}, {"id": "d", "texte": "0", "correcte": false, "explication": "Deux variables très corrélées à une même troisième ne peuvent pas être non corrélées entre elles : en \\(c = 0\\), la plus petite valeur propre de la matrice de corrélation vaut \\(-0{,}131 < 0\\)."}], "solution": "Réponse : \\(2 \\times 0{,}8^2 - 1 = 0{,}28\\).\n\nNotations : \\(a = 0{,}8\\), \\(c = \\mathrm{corr}(X_2, X_3)\\), et \\(\\mathbf{C}\\) la matrice de corrélation de \\((X_1, X_2, X_3)\\), de lignes \\((1, a, a)\\), \\((a, 1, c)\\), \\((a, c, 1)\\).\n\nÉtape 1 : une matrice de diagonale 1 est une matrice de corrélation si et seulement si elle est semi-définie positive (leçon, section 2), c'est-à-dire si et seulement si tous ses mineurs principaux sont positifs ou nuls (leçon, section 4).\n\nÉtape 2, mineurs d'ordre 1 et 2 : les coefficients diagonaux valent 1 ; \\(1 - a^2 > 0\\) deux fois ; \\(1 - c^2 \\ge 0\\) exige \\(-1 \\le c \\le 1\\).\n\nÉtape 3, déterminant : en développant, \\(\\det(\\mathbf{C}) = 1 + 2a^2 c - 2a^2 - c^2 = (1 - c)(1 + c - 2a^2)\\). Pour \\(c < 1\\), il est positif ou nul si et seulement si \\(c \\ge 2a^2 - 1 = 1{,}28 - 1 = 0{,}28\\) ; pour \\(c = 1\\), il est nul.\n\nÉtape 4 : l'ensemble des valeurs possibles est donc \\([0{,}28 ; 1]\\), et la plus petite est \\(0{,}28\\). Elle est atteinte : la matrice correspondante est semi-définie positive, donc c'est la corrélation d'un vecteur gaussien (leçon, section 2, point 3).\n\nVérification (script) : factorisation symbolique du déterminant, plus petite valeur propre nulle en \\(c = 0{,}28\\) et négative juste en dessous ; simulation d'un vecteur gaussien de cette corrélation : corrélation empirique de \\(X_2\\) et \\(X_3\\) égale à \\(0{,}282\\).", "type": "qcm", "multiple": false, "reponse": "0,28", "fiche": null, "verif": {"script": "verif/seance_algebre_1.py", "cles": ["Q02_2a2", "Q02_corr23_mc", "Q02_d_equi", "Q02_d_produit", "Q02_exact", "Q02_vp_c0", "Q02_vp_cdemi"]}}, {"id": "AL-03", "section": "math", "theme": "Mineurs principaux, piège des mineurs dominants", "difficulte": 4, "temps_cible_s": 120, "enonce": "Soit \\(\\mathbf{A}\\) la matrice symétrique \\(3 \\times 3\\) de lignes \\((0, 0, 0)\\), \\((0, 2, 3)\\), \\((0, 3, 1)\\). Ses trois mineurs principaux dominants (les déterminants des sous-matrices formées des \\(k\\) premières lignes et des \\(k\\) premières colonnes, \\(k = 1, 2, 3\\)) sont tous nuls.\n\nQuelle affirmation est vraie ?", "options": [{"id": "a", "texte": "\\(\\mathbf{A}\\) n'est pas semi-définie positive : le mineur principal formé des lignes et colonnes 2 et 3 vaut -7.", "correcte": true, "explication": "Oui : une matrice semi-définie positive a **tous** ses mineurs principaux positifs ou nuls, et celui-ci est négatif. Contrôle direct : \\(\\mathbf{x} = (0, 1, -1)\\) donne \\(\\mathbf{x}^\\top \\mathbf{A}\\,\\mathbf{x} = -3\\)."}, {"id": "b", "texte": "\\(\\mathbf{A}\\) est semi-définie positive, puisque ses mineurs principaux dominants sont tous positifs ou nuls.", "correcte": false, "explication": "Le critère des mineurs dominants (Sylvester) ne vaut qu'avec des inégalités strictes, et caractérise les matrices définies positives. Avec des inégalités larges, il faut tous les mineurs principaux."}, {"id": "c", "texte": "\\(\\mathbf{A}\\) est semi-définie positive, puisqu'elle est symétrique et que ses coefficients diagonaux sont positifs ou nuls.", "correcte": false, "explication": "Une diagonale positive est nécessaire, pas suffisante : les coefficients hors diagonale peuvent créer une direction de variance négative, ici \\((0, 1, -1)\\)."}, {"id": "d", "texte": "\\(\\mathbf{A}\\) n'est pas semi-définie positive, puisque son déterminant est nul.", "correcte": false, "explication": "La conclusion est juste mais la raison est fausse : un déterminant nul n'empêche pas d'être semi-définie positive (la matrice nulle, ou la matrice diagonale de coefficients 1 et 0, le sont)."}], "solution": "Réponse : \\(\\mathbf{A}\\) n'est pas semi-définie positive, car son mineur principal sur les indices 2 et 3 vaut \\(2 \\times 1 - 3 \\times 3 = -7 < 0\\).\n\nÉtape 1 : une matrice symétrique est semi-définie positive si et seulement si **tous** ses mineurs principaux (lignes et colonnes de mêmes indices, pour tout ensemble d'indices) sont positifs ou nuls (leçon, section 4). Les mineurs dominants ne suffisent pas.\n\nÉtape 2 : la sous-matrice principale sur les indices \\(\\{2, 3\\}\\) a pour lignes \\((2, 3)\\) et \\((3, 1)\\), de déterminant \\(-7\\).\n\nÉtape 3, certificat explicite : \\(\\mathbf{x} = (0, 1, -1)\\) donne \\(\\mathbf{x}^\\top \\mathbf{A}\\,\\mathbf{x} = 2 - 2 \\times 3 + 1 = -3 < 0\\).\n\nValeurs propres (script, calcul exact) : 0 et \\((3 \\pm \\sqrt{37})/2\\), dont une négative, \\(\\approx -1{,}541\\).", "type": "qcm", "multiple": false, "reponse": "\\(\\mathbf{A}\\) n'est pas semi-définie positive : le mineur principal formé des lignes et colonnes 2 et 3 vaut -7.", "fiche": null, "verif": {"script": "verif/seance_algebre_1.py", "cles": ["Q03_forme", "Q03_mineur23", "Q03_racine", "Q03_vp_neg"]}}, {"id": "AL-04", "section": "math", "theme": "Rang d'une covariance empirique, T < N", "difficulte": 3, "temps_cible_s": 75, "enonce": "On observe les rendements de 300 actifs à 120 dates. Pour \\(t = 1, \\dots, 120\\), \\(\\mathbf{X}_t \\in \\mathbb{R}^{300}\\) est le vecteur aléatoire des rendements à la date \\(t\\) ; les 120 vecteurs sont indépendants et chacun a une densité sur \\(\\mathbb{R}^{300}\\). Avec \\(\\bar{\\mathbf{X}}\\) leur moyenne, on forme la covariance empirique \\(\\mathbf{S} = \\dfrac{1}{119}\\sum_{t=1}^{120} (\\mathbf{X}_t - \\bar{\\mathbf{X}})(\\mathbf{X}_t - \\bar{\\mathbf{X}})^\\top\\), matrice \\(300 \\times 300\\).\n\nCombien de valeurs propres de \\(\\mathbf{S}\\), comptées avec multiplicité, sont nulles avec probabilité 1 ?", "options": [{"id": "a", "texte": "181", "correcte": true, "explication": "Oui : le rang vaut \\(\\min(300, 120 - 1) = 119\\), et \\(300 - 119 = 181\\) valeurs propres sont nulles."}, {"id": "b", "texte": "180", "correcte": false, "explication": "C'est \\(300 - 120\\), le résultat sans centrage. La soustraction de la moyenne lie les 120 vecteurs centrés (leur somme est nulle) : le rang tombe à \\(119\\), et il y a une valeur propre nulle de plus."}, {"id": "c", "texte": "119", "correcte": false, "explication": "C'est le **rang** de \\(\\mathbf{S}\\), c'est-à-dire le nombre de valeurs propres non nulles. Le nombre de valeurs propres nulles est la dimension du noyau, \\(300 - 119\\)."}, {"id": "d", "texte": "0", "correcte": false, "explication": "Pour que \\(\\mathbf{S}\\) n'ait aucune valeur propre nulle, il faudrait au moins \\(300 + 1\\) dates : avec 120 dates, son rang est au plus \\(120 - 1\\)."}], "solution": "Réponse : 181.\n\nNotations : \\(\\mathbf{Y}\\) est la matrice aléatoire \\(120 \\times 300\\) de lignes \\((\\mathbf{X}_t - \\bar{\\mathbf{X}})^\\top\\), de sorte que \\(\\mathbf{S} = \\mathbf{Y}^\\top \\mathbf{Y}/119\\).\n\nÉtape 1, majoration : \\(\\mathrm{rang}(\\mathbf{S}) = \\mathrm{rang}(\\mathbf{Y})\\) (même noyau : \\(\\mathbf{Y}^\\top \\mathbf{Y}\\mathbf{v} = \\mathbf{0}\\) implique \\(\\lVert \\mathbf{Y}\\mathbf{v} \\rVert^2 = 0\\)), et les 120 lignes de \\(\\mathbf{Y}\\) ont une somme nulle, donc \\(\\mathrm{rang}(\\mathbf{Y}) \\le 120 - 1 = 119\\).\n\nÉtape 2, égalité avec probabilité 1 (leçon, section 8, démontré) : les différences \\(\\mathbf{X}_t - \\mathbf{X}_{120}\\), \\(t \\le 119\\), engendrent le même espace que les lignes de \\(\\mathbf{Y}\\) ; sachant \\(\\mathbf{X}_{120}\\), ce sont 119 vecteurs indépendants à densité dans \\(\\mathbb{R}^{300}\\), avec \\(119 \\le 300\\), donc libres avec probabilité 1, car un sous-espace strict est de mesure nulle. Le rang vaut 119.\n\nÉtape 3 : \\(\\mathbf{S}\\) est symétrique ; son rang est le nombre de valeurs propres non nulles, donc \\(300 - 119 = 181\\) valeurs propres sont nulles.\n\nVérification (script) : tirage gaussien \\(120 \\times 300\\), rang numérique 119.", "type": "qcm", "multiple": false, "reponse": "181", "fiche": null, "verif": {"script": "verif/seance_algebre_1.py", "cles": ["Q04_d_sans_centrage", "Q04_exact", "Q04_rang"]}}, {"id": "AL-05", "section": "math", "theme": "Rang d'une covariance après démoyennage transversal", "difficulte": 5, "temps_cible_s": 150, "enonce": "On observe les rendements de 100 actifs à 250 dates. Pour \\(t = 1, \\dots, 250\\), \\(\\mathbf{X}_t \\in \\mathbb{R}^{100}\\) est le vecteur aléatoire des rendements à la date \\(t\\) ; les 250 vecteurs sont indépendants et chacun a une densité sur \\(\\mathbb{R}^{100}\\).\n\nOn retire d'abord, à chaque date, la moyenne des 100 rendements de cette date : \\(\\tilde{\\mathbf{X}}_t = \\mathbf{X}_t - \\tfrac{1}{100}(\\mathbf{1}^\\top \\mathbf{X}_t)\\,\\mathbf{1}\\), où \\(\\mathbf{1}\\) est le vecteur de \\(\\mathbb{R}^{100}\\) dont les coordonnées valent 1. Puis, avec \\(\\bar{\\tilde{\\mathbf{X}}}\\) la moyenne des \\(\\tilde{\\mathbf{X}}_t\\), on forme \\(\\tilde{\\mathbf{S}} = \\dfrac{1}{249}\\sum_{t=1}^{250} (\\tilde{\\mathbf{X}}_t - \\bar{\\tilde{\\mathbf{X}}})(\\tilde{\\mathbf{X}}_t - \\bar{\\tilde{\\mathbf{X}}})^\\top\\).\n\nQuel est le rang de \\(\\tilde{\\mathbf{S}}\\) avec probabilité 1 ?", "options": [{"id": "a", "texte": "99", "correcte": true, "explication": "Oui : chaque \\(\\tilde{\\mathbf{X}}_t\\) est orthogonal à \\(\\mathbf{1}\\), donc \\(\\tilde{\\mathbf{S}}\\mathbf{1} = \\mathbf{0}\\) et le rang est au plus \\(100 - 1 = 99\\) ; dans l'hyperplan orthogonal à \\(\\mathbf{1}\\), de dimension 99, les données ont une densité et \\(T - 1 = 249 \\ge 99\\)."}, {"id": "b", "texte": "100", "correcte": false, "explication": "Avec 250 dates, la covariance des \\(\\mathbf{X}_t\\) eux-mêmes serait de rang 100 avec probabilité 1. Mais le démoyennage transversal impose \\(\\mathbf{1}^\\top \\tilde{\\mathbf{X}}_t = 0\\) à chaque date : \\(\\mathbf{1}\\) est dans le noyau de \\(\\tilde{\\mathbf{S}}\\)."}, {"id": "c", "texte": "249", "correcte": false, "explication": "C'est \\(T - 1\\). Le rang ne peut pas dépasser la taille de la matrice, \\(100\\) ; la borne \\(T - 1\\) n'est active que quand \\(T - 1\\) est inférieur à la dimension."}, {"id": "d", "texte": "98", "correcte": false, "explication": "On a retiré une unité pour chaque centrage. Le centrage temporel ne coûte rien ici : il borne le rang par \\(T - 1 = 249\\), qui n'est pas la contrainte active. Seul le démoyennage transversal retire une dimension."}], "solution": "Réponse : 99.\n\nNotations : \\(N = 100\\), \\(T = 250\\) ; \\(\\mathbf{P} = \\mathbf{I} - \\mathbf{1}\\mathbf{1}^\\top/N\\), projection orthogonale sur l'hyperplan \\(H = \\{\\mathbf{z} : \\mathbf{1}^\\top \\mathbf{z} = 0\\}\\), de dimension \\(N - 1 = 99\\), de sorte que \\(\\tilde{\\mathbf{X}}_t = \\mathbf{P}\\mathbf{X}_t\\) ; \\(\\mathbf{B}\\) est une matrice \\(N \\times (N - 1)\\) dont les colonnes forment une base orthonormée de \\(H\\) (donc \\(\\mathbf{B}^\\top \\mathbf{B} = \\mathbf{I}_{N-1}\\) et \\(\\mathbf{P} = \\mathbf{B}\\mathbf{B}^\\top\\)) ; \\(\\mathbf{W}_t = \\mathbf{B}^\\top \\mathbf{X}_t \\in \\mathbb{R}^{N-1}\\) sont les coordonnées de \\(\\tilde{\\mathbf{X}}_t\\) dans cette base, et \\(\\mathbf{S}_W\\) la covariance empirique (diviseur 249) des \\(\\mathbf{W}_t\\).\n\nÉtape 1, majoration : \\(\\mathbf{1}^\\top \\tilde{\\mathbf{X}}_t = 0\\) pour tout \\(t\\), donc aussi pour la moyenne, et \\(\\tilde{\\mathbf{S}}\\mathbf{1} = \\mathbf{0}\\) : rang au plus \\(N - 1\\).\n\nÉtape 2, réduction : \\(\\tilde{\\mathbf{X}}_t = \\mathbf{B}\\mathbf{W}_t\\), donc \\(\\tilde{\\mathbf{S}} = \\mathbf{B}\\,\\mathbf{S}_W \\mathbf{B}^\\top\\) et \\(\\mathbf{S}_W = \\mathbf{B}^\\top \\tilde{\\mathbf{S}}\\,\\mathbf{B}\\). Le rang d'un produit ne dépasse celui d'aucun facteur, donc \\(\\mathrm{rang}(\\tilde{\\mathbf{S}}) \\le \\mathrm{rang}(\\mathbf{S}_W) \\le \\mathrm{rang}(\\tilde{\\mathbf{S}})\\) : les deux rangs sont égaux.\n\nÉtape 3, densité : soit \\(\\mathbf{Q}\\) la matrice orthogonale \\(N \\times N\\) formée des colonnes de \\(\\mathbf{B}\\) et de \\(\\mathbf{1}/\\sqrt{N}\\). \\(\\mathbf{Q}^\\top \\mathbf{X}_t\\) a une densité (changement de variables orthogonal, de déterminant ±1, admis), et \\(\\mathbf{W}_t\\) en est formé des \\(N - 1\\) premières coordonnées : une loi marginale d'une loi à densité a une densité (on intègre la densité jointe par rapport à la coordonnée retirée, théorème de Fubini). Les \\(\\mathbf{W}_t\\) sont indépendants, comme fonctions de vecteurs indépendants.\n\nÉtape 4 : par le théorème de la leçon (section 8), \\(\\mathrm{rang}(\\mathbf{S}_W) = \\min(N - 1, T - 1) = 99\\) avec probabilité 1, puisque \\(T - 1 = 249 \\ge N - 1\\).\n\nVérification (script) : trois tirages gaussiens corrélés, rang numérique 99 et \\(\\tilde{\\mathbf{S}}\\mathbf{1} = \\mathbf{0}\\).\n\nConséquence : une covariance de rendements démoyennés transversalement (rendements « neutres au marché » équipondérés) n'est jamais inversible, quel que soit \\(T\\).", "type": "qcm", "multiple": false, "reponse": "99", "fiche": null, "verif": {"script": "verif/seance_algebre_1.py", "cles": ["Q05_d_double", "Q05_d_t", "Q05_exact"]}}, {"id": "AL-06", "section": "math", "theme": "Projections orthogonales, trace et résidus", "difficulte": 3, "temps_cible_s": 120, "enonce": "Soit \\(\\mathbf{A}\\) une matrice fixe \\(100 \\times 4\\) de rang 4 (une colonne constante et trois variables explicatives), \\(\\mathbf{b} \\in \\mathbb{R}^4\\) un vecteur fixe de coefficients inconnus, et \\(\\mathbf{U}\\) un vecteur aléatoire de \\(\\mathbb{R}^{100}\\) d'espérance nulle et de matrice de covariance \\(\\sigma^2 \\mathbf{I}\\), avec \\(\\sigma > 0\\). On observe \\(\\mathbf{Y} = \\mathbf{A}\\mathbf{b} + \\mathbf{U}\\) et l'on calcule le vecteur des résidus des moindres carrés \\(\\hat{\\mathbf{U}} = \\mathbf{Y} - \\mathbf{A}\\hat{\\mathbf{b}}\\), avec \\(\\hat{\\mathbf{b}} = (\\mathbf{A}^\\top \\mathbf{A})^{-1}\\mathbf{A}^\\top \\mathbf{Y}\\).\n\nQue vaut \\(\\mathbb{E}\\big[\\lVert \\hat{\\mathbf{U}} \\rVert^2\\big]\\) ?", "options": [{"id": "a", "texte": "\\(96\\,\\sigma^2\\)", "correcte": true, "explication": "Oui : \\(\\hat{\\mathbf{U}} = (\\mathbf{I} - \\mathbf{H})\\mathbf{U}\\), et \\(\\mathbb{E}[\\mathbf{U}^\\top (\\mathbf{I} - \\mathbf{H})\\mathbf{U}] = \\sigma^2\\,\\mathrm{tr}(\\mathbf{I} - \\mathbf{H}) = \\sigma^2 (100 - 4)\\)."}, {"id": "b", "texte": "\\(100\\,\\sigma^2\\)", "correcte": false, "explication": "C'est \\(\\mathbb{E}[\\lVert \\mathbf{U} \\rVert^2]\\), la somme des carrés des vraies erreurs. Les résidus sont la projection de \\(\\mathbf{U}\\) sur un sous-espace de dimension \\(100 - 4\\) : l'ajustement absorbe 4 dimensions."}, {"id": "c", "texte": "\\(4\\,\\sigma^2\\)", "correcte": false, "explication": "C'est \\(\\sigma^2\\,\\mathrm{tr}(\\mathbf{H})\\), l'espérance de \\(\\lVert \\mathbf{H}\\mathbf{U} \\rVert^2\\), la part de bruit absorbée par l'ajustement, pas celle qui reste dans les résidus."}, {"id": "d", "texte": "\\(95\\,\\sigma^2\\)", "correcte": false, "explication": "La constante a été retirée deux fois (\\(100 - 4 - 1\\)) : elle fait déjà partie des 4 colonnes de \\(\\mathbf{A}\\). Le nombre de degrés de liberté est \\(T - p\\), \\(p\\) comptant toutes les colonnes."}], "solution": "Réponse : \\(96\\,\\sigma^2\\).\n\nNotations : \\(\\mathbf{H} = \\mathbf{A}(\\mathbf{A}^\\top \\mathbf{A})^{-1}\\mathbf{A}^\\top\\) (matrice chapeau), \\(T = 100\\), \\(p = 4\\).\n\nÉtape 1 : \\(\\hat{\\mathbf{U}} = (\\mathbf{I} - \\mathbf{H})\\mathbf{Y}\\), et \\((\\mathbf{I} - \\mathbf{H})\\mathbf{A} = \\mathbf{A} - \\mathbf{A} = \\mathbf{0}\\), donc \\(\\hat{\\mathbf{U}} = (\\mathbf{I} - \\mathbf{H})\\mathbf{U}\\).\n\nÉtape 2 : \\(\\mathbf{I} - \\mathbf{H}\\) est symétrique et idempotente (projection orthogonale, leçon, section 3), donc \\(\\lVert \\hat{\\mathbf{U}} \\rVert^2 = \\mathbf{U}^\\top (\\mathbf{I} - \\mathbf{H})^\\top (\\mathbf{I} - \\mathbf{H})\\mathbf{U} = \\mathbf{U}^\\top (\\mathbf{I} - \\mathbf{H})\\mathbf{U}\\).\n\nÉtape 3 : un nombre est égal à sa trace, et \\(\\mathrm{tr}(\\mathbf{M}\\mathbf{N}) = \\mathrm{tr}(\\mathbf{N}\\mathbf{M})\\), donc \\(\\mathbf{U}^\\top (\\mathbf{I} - \\mathbf{H})\\mathbf{U} = \\mathrm{tr}\\big((\\mathbf{I} - \\mathbf{H})\\mathbf{U}\\mathbf{U}^\\top\\big)\\). Par linéarité de l'espérance et de la trace, \\(\\mathbb{E}[\\cdot] = \\mathrm{tr}\\big((\\mathbf{I} - \\mathbf{H})\\,\\sigma^2 \\mathbf{I}\\big) = \\sigma^2\\,\\mathrm{tr}(\\mathbf{I} - \\mathbf{H})\\).\n\nÉtape 4 : \\(\\mathrm{tr}(\\mathbf{H}) = \\mathrm{tr}\\big((\\mathbf{A}^\\top \\mathbf{A})^{-1}\\mathbf{A}^\\top \\mathbf{A}\\big) = \\mathrm{tr}(\\mathbf{I}_4) = 4\\), donc \\(\\mathrm{tr}(\\mathbf{I} - \\mathbf{H}) = 100 - 4 = 96\\).\n\nConséquence : \\(\\lVert \\hat{\\mathbf{U}} \\rVert^2/(T - p)\\) est un estimateur sans biais de \\(\\sigma^2\\). Simulation (script, 50 000 tirages gaussiens) : moyenne de \\(\\lVert \\hat{\\mathbf{U}} \\rVert^2/\\sigma^2\\) égale à \\(95{,}97\\), pour une erreur standard \\(0{,}06\\).", "type": "qcm", "multiple": false, "reponse": "\\(96\\,\\sigma^2\\)", "fiche": null, "verif": {"script": "verif/seance_algebre_1.py", "cles": ["Q06_d_double", "Q06_d_p", "Q06_exact", "Q06_rss_sur_sigma2_mc", "Q06_rss_sur_sigma2_se"]}}, {"id": "AL-07", "section": "math", "theme": "Conditionnement et sensibilité d'un système linéaire", "difficulte": 3, "temps_cible_s": 120, "enonce": "Soit \\(\\mathbf{S}\\) une matrice symétrique définie positive \\(3 \\times 3\\) de valeurs propres 4, 1 et 0,04. Pour un vecteur \\(\\mathbf{m} \\ne \\mathbf{0}\\), on note \\(\\mathbf{w}\\) la solution de \\(\\mathbf{S}\\mathbf{w} = \\mathbf{m}\\). On perturbe le second membre en \\(\\mathbf{m} + \\boldsymbol{\\delta}\\), avec \\(\\lVert \\boldsymbol{\\delta} \\rVert / \\lVert \\mathbf{m} \\rVert = 0{,}001\\) (norme euclidienne), et l'on note \\(\\mathbf{w} + \\boldsymbol{\\Delta}\\) la nouvelle solution.\n\nQuelle est la plus grande valeur possible de \\(\\lVert \\boldsymbol{\\Delta} \\rVert / \\lVert \\mathbf{w} \\rVert\\), sur tous les choix de \\(\\mathbf{m}\\) et de \\(\\boldsymbol{\\delta}\\) ?", "options": [{"id": "a", "texte": "0,1", "correcte": true, "explication": "Oui : le conditionnement vaut \\(4/0{,}04 = 100\\), et la borne \\(\\kappa \\times 0{,}001\\) est atteinte pour \\(\\mathbf{m}\\) le long du vecteur propre de valeur propre 4 et \\(\\boldsymbol{\\delta}\\) le long de celui de valeur propre 0,04."}, {"id": "b", "texte": "0,025", "correcte": false, "explication": "C'est \\(0{,}001/0{,}04\\) : seule la norme de \\(\\mathbf{S}^{-1}\\) a été prise en compte. Elle borne l'erreur absolue \\(\\lVert \\boldsymbol{\\Delta} \\rVert \\le \\lVert \\boldsymbol{\\delta} \\rVert/0{,}04\\) ; pour l'erreur relative, il faut aussi \\(\\lVert \\mathbf{m} \\rVert \\le 4\\,\\lVert \\mathbf{w} \\rVert\\)."}, {"id": "c", "texte": "0,01", "correcte": false, "explication": "C'est \\(0{,}001 \\times \\sqrt{100}\\). La racine du conditionnement n'intervient pas : l'amplification maximale de l'erreur relative est le conditionnement lui-même."}, {"id": "d", "texte": "0,004", "correcte": false, "explication": "C'est \\(0{,}001 \\times 4\\), avec la plus grande valeur propre. Ce sont les petites valeurs propres qui amplifient : \\(\\mathbf{S}^{-1}\\) multiplie par \\(1/0{,}04\\) les composantes le long du vecteur propre de valeur propre 0,04."}], "solution": "Réponse : \\(100 \\times 0{,}001 = 0{,}1\\).\n\nNotations : \\(\\mathbf{q}_1\\), \\(\\mathbf{q}_2\\), \\(\\mathbf{q}_3\\) sont des vecteurs propres unitaires orthogonaux de valeurs propres 4, 1 et 0,04 ; \\(\\kappa = 4/0{,}04 = 100\\) est le conditionnement (pour une matrice symétrique définie positive, valeurs singulières = valeurs propres).\n\nÉtape 1, borne (leçon, section 6) : \\(\\boldsymbol{\\Delta} = \\mathbf{S}^{-1}\\boldsymbol{\\delta}\\), donc \\(\\lVert \\boldsymbol{\\Delta} \\rVert \\le \\lVert \\boldsymbol{\\delta} \\rVert/0{,}04\\) ; et \\(\\lVert \\mathbf{m} \\rVert = \\lVert \\mathbf{S}\\mathbf{w} \\rVert \\le 4\\,\\lVert \\mathbf{w} \\rVert\\). En multipliant : \\(\\lVert \\boldsymbol{\\Delta} \\rVert/\\lVert \\mathbf{w} \\rVert \\le \\kappa\\,\\lVert \\boldsymbol{\\delta} \\rVert/\\lVert \\mathbf{m} \\rVert = 0{,}1\\).\n\nÉtape 2, la borne est atteinte : \\(\\mathbf{m} = \\mathbf{q}_1\\) donne \\(\\mathbf{w} = \\mathbf{q}_1/4\\) ; \\(\\boldsymbol{\\delta} = 0{,}001\\,\\mathbf{q}_3\\) donne \\(\\boldsymbol{\\Delta} = 0{,}001\\,\\mathbf{q}_3/0{,}04\\). Le rapport vaut \\((0{,}001/0{,}04)/(1/4) = 0{,}1\\).\n\nVérification (script) : l'exemple diagonal atteint la borne, et 2000 couples tirés au hasard ne la dépassent jamais. Lecture pour un portefeuille : des poids \\(\\boldsymbol{\\Sigma}^{-1}\\boldsymbol{\\mu}\\) calculés avec une covariance mal conditionnée amplifient d'autant les erreurs sur les rendements espérés.", "type": "qcm", "multiple": false, "reponse": "0,1", "fiche": null, "verif": {"script": "verif/seance_algebre_1.py", "cles": ["Q07_d_inv", "Q07_d_max", "Q07_d_racine", "Q07_exact", "Q07_kappa"]}}, {"id": "AL-08", "section": "math", "theme": "Calcul matriciel, gradient d'une forme quadratique", "difficulte": 2, "temps_cible_s": 75, "enonce": "Soit \\(\\mathbf{A}\\) la matrice \\(2 \\times 2\\) de lignes \\((1, 2)\\) et \\((0, 3)\\), et \\(f(\\mathbf{x}) = \\mathbf{x}^\\top \\mathbf{A}\\,\\mathbf{x}\\) pour \\(\\mathbf{x} \\in \\mathbb{R}^2\\).\n\nQue vaut le gradient de \\(f\\) au point \\(\\mathbf{x} = (1, -1)\\) ?", "options": [{"id": "a", "texte": "\\((0 ; -4)\\)", "correcte": true, "explication": "Oui : \\(\\nabla f(\\mathbf{x}) = (\\mathbf{A} + \\mathbf{A}^\\top)\\,\\mathbf{x}\\), et \\(\\mathbf{A} + \\mathbf{A}^\\top\\) a pour lignes \\((2, 2)\\) et \\((2, 6)\\)."}, {"id": "b", "texte": "\\((-2 ; -6)\\)", "correcte": false, "explication": "C'est \\(2\\mathbf{A}\\mathbf{x}\\), la formule valable seulement pour \\(\\mathbf{A}\\) symétrique. Ici \\(\\mathbf{A}\\) ne l'est pas (\\(2 \\ne 0\\) hors de la diagonale)."}, {"id": "c", "texte": "\\((2 ; -2)\\)", "correcte": false, "explication": "C'est \\(2\\mathbf{A}^\\top \\mathbf{x}\\) : même erreur que \\(2\\mathbf{A}\\mathbf{x}\\), avec l'autre moitié de la formule. Le gradient fait intervenir les deux : \\(\\mathbf{A}\\mathbf{x} + \\mathbf{A}^\\top \\mathbf{x}\\)."}, {"id": "d", "texte": "\\((-1 ; -3)\\)", "correcte": false, "explication": "C'est \\(\\mathbf{A}\\mathbf{x}\\), sans le second terme \\(\\mathbf{A}^\\top \\mathbf{x}\\). La dérivée d'un terme \\(a_{ij} x_i x_j\\) touche à la fois \\(x_i\\) et \\(x_j\\)."}], "solution": "Réponse : \\(\\nabla f(1, -1) = (0 ; -4)\\).\n\nÉtape 1, formule (leçon, section 7) : \\(f(\\mathbf{x}) = \\sum_{i,j} a_{ij} x_i x_j\\), et \\(\\partial f/\\partial x_k = \\sum_j a_{kj} x_j + \\sum_i a_{ik} x_i = (\\mathbf{A}\\mathbf{x})_k + (\\mathbf{A}^\\top \\mathbf{x})_k\\).\n\nÉtape 2 : \\(\\mathbf{A}\\mathbf{x} = (-1 ; -3)\\) et \\(\\mathbf{A}^\\top \\mathbf{x} = (1 ; -1)\\), de somme \\((0 ; -4)\\).\n\nContrôle direct : \\(f(x_1, x_2) = x_1^2 + (2 + 0)\\,x_1 x_2 + 3x_2^2\\), de dérivées partielles \\(2x_1 + 2x_2\\) et \\(2x_1 + 6x_2\\), qui valent bien \\((0 ; -4)\\) en \\((1, -1)\\). Seule la partie symétrique \\((\\mathbf{A} + \\mathbf{A}^\\top)/2\\), de lignes \\((1, 1)\\) et \\((1, 3)\\), compte pour \\(f\\).", "type": "qcm", "multiple": false, "reponse": "\\((0 ; -4)\\)", "fiche": null, "verif": {"script": "verif/seance_algebre_1.py", "cles": ["Q08_atx", "Q08_ax", "Q08_d_2atx", "Q08_d_2ax", "Q08_d_ax", "Q08_exact", "Q08_h11", "Q08_h12", "Q08_h22", "Q08_s11", "Q08_s12", "Q08_s22"]}}, {"id": "AL-09", "section": "math", "theme": "SVD, meilleure approximation de rang k", "difficulte": 3, "temps_cible_s": 90, "enonce": "Une matrice réelle \\(\\mathbf{X}\\) de taille \\(6 \\times 4\\) a pour valeurs singulières 4, 3, 2 et 1. On note \\(\\lVert \\mathbf{M} \\rVert_F = \\sqrt{\\sum_{i,j} m_{ij}^2}\\) la norme de Frobenius d'une matrice \\(\\mathbf{M}\\) de coefficients \\(m_{ij}\\).\n\nQuelle est la plus petite valeur de \\(\\lVert \\mathbf{X} - \\mathbf{B} \\rVert_F\\), sur toutes les matrices \\(\\mathbf{B}\\) de taille \\(6 \\times 4\\) et de rang au plus 2 ?", "options": [{"id": "a", "texte": "\\(\\sqrt{5} \\approx 2{,}236\\)", "correcte": true, "explication": "Oui : par Eckart-Young, la meilleure approximation est la SVD tronquée aux deux plus grandes valeurs singulières, et l'erreur est \\(\\sqrt{2^2 + 1^2}\\)."}, {"id": "b", "texte": "2", "correcte": false, "explication": "C'est l'erreur minimale en norme d'**opérateur** (la troisième valeur singulière). En norme de Frobenius, toutes les valeurs singulières omises contribuent, au carré."}, {"id": "c", "texte": "3", "correcte": false, "explication": "C'est \\(2 + 1\\), la somme des valeurs singulières omises. La norme de Frobenius additionne les **carrés** : \\(\\lVert \\mathbf{M} \\rVert_F^2 = \\sum_k s_k(\\mathbf{M})^2\\)."}, {"id": "d", "texte": "5", "correcte": false, "explication": "C'est le **carré** de l'erreur, \\(2^2 + 1^2\\). L'erreur elle-même en est la racine."}], "solution": "Réponse : \\(\\sqrt{2^2 + 1^2} = \\sqrt{5} \\approx 2{,}236\\).\n\nNotations : \\(\\mathbf{X} = \\sum_{k=1}^{4} s_k \\mathbf{u}_k \\mathbf{v}_k^\\top\\) est la SVD, avec \\(s = (4, 3, 2, 1)\\).\n\nÉtape 1 (leçon, section 5, Eckart-Young démontré) : pour toute \\(\\mathbf{B}\\) de rang au plus 2, \\(\\lVert \\mathbf{X} - \\mathbf{B} \\rVert_F^2 \\ge s_3^2 + s_4^2\\), avec égalité pour \\(\\mathbf{B} = s_1 \\mathbf{u}_1 \\mathbf{v}_1^\\top + s_2 \\mathbf{u}_2 \\mathbf{v}_2^\\top\\).\n\nÉtape 2 : \\(\\mathbf{X} - \\mathbf{B} = s_3 \\mathbf{u}_3 \\mathbf{v}_3^\\top + s_4 \\mathbf{u}_4 \\mathbf{v}_4^\\top\\), de norme de Frobenius au carré \\(s_3^2 + s_4^2 = 5\\).\n\nVérification (script) : matrice construite avec ces valeurs singulières, erreur de la SVD tronquée égale à \\(2{,}236\\), et aucune des matrices de rang 2 tirées au hasard ne fait mieux.", "type": "qcm", "multiple": false, "reponse": "\\(\\sqrt{5} \\approx 2{,}236\\)", "fiche": null, "verif": {"script": "verif/seance_algebre_1.py", "cles": ["Q09_d_somme", "Q09_d_spectrale", "Q09_exact", "Q09_somme_carres"]}}, {"id": "AL-10", "section": "math", "theme": "ACP de rendements standardisés, part de variance", "difficulte": 4, "temps_cible_s": 120, "enonce": "On dispose des rendements de 5 actifs sur \\(T\\) dates, rangés dans une matrice \\(T \\times 5\\) dont aucune colonne n'est constante. Chaque colonne est centrée, puis divisée par son écart-type empirique calculé avec le diviseur \\(T\\) ; on note \\(\\mathbf{Z}\\) la matrice obtenue, et l'on fait l'ACP de \\(\\mathbf{Z}^\\top \\mathbf{Z}/T\\). Les quatre plus grandes valeurs propres de cette matrice valent 2,6 ; 1,1 ; 0,7 et 0,4.\n\nQuelle part de la variance totale de \\(\\mathbf{Z}\\) expliquent les deux premières composantes principales ?", "options": [{"id": "a", "texte": "0,74", "correcte": true, "explication": "Oui : \\(\\mathbf{Z}^\\top \\mathbf{Z}/T\\) est la matrice de corrélation, de trace 5 ; la part vaut \\((2{,}6 + 1{,}1)/5\\)."}, {"id": "b", "texte": "0,771", "correcte": false, "explication": "C'est \\((2{,}6 + 1{,}1)/4,8\\) : on a divisé par la somme des quatre valeurs propres données, en oubliant la cinquième, \\(5 - 4,8 = 0,2\\)."}, {"id": "c", "texte": "0,52", "correcte": false, "explication": "C'est la part de la seule première composante, \\(2{,}6/5\\). La question porte sur les deux premières."}, {"id": "d", "texte": "Impossible à déterminer sans la cinquième valeur propre.", "correcte": false, "explication": "La cinquième se déduit des autres : la somme des valeurs propres est la trace, et la trace d'une matrice de corrélation \\(5 \\times 5\\) vaut 5. Donc \\(\\lambda_5 = 0,2\\)."}], "solution": "Réponse : \\((2{,}6 + 1{,}1)/5 = 3{,}7/5 = 0{,}74\\).\n\nÉtape 1 (leçon, section 9, point 4) : avec des écarts-types de diviseur \\(T\\) et la matrice \\(\\mathbf{Z}^\\top \\mathbf{Z}/T\\), de même diviseur, le coefficient \\((i, j)\\) est la covariance empirique des actifs \\(i\\) et \\(j\\) divisée par le produit de leurs écarts-types : c'est la **matrice de corrélation empirique**. Son coefficient diagonal vaut 1.\n\nÉtape 2 : la variance totale de \\(\\mathbf{Z}\\) est la trace, \\(5\\), égale à la somme des cinq valeurs propres (leçon, section 1). Donc \\(\\lambda_5 = 5 - 4{,}8 = 0{,}2\\), cohérent avec \\(\\lambda_5 \\le \\lambda_4 = 0{,}4\\).\n\nÉtape 3 : part des deux premières composantes, \\((2{,}6 + 1{,}1)/5 = 3{,}7/5 = 0{,}74\\).\n\nRemarques : avec un diviseur \\(T - 1\\) pour les écarts-types et \\(T\\) pour la matrice, toutes les valeurs propres seraient multipliées par la même constante : la réponse, un rapport, ne changerait pas. Vérification (script) : une matrice de corrélation \\(5 \\times 5\\) ayant exactement ces cinq valeurs propres existe (construction explicite par rotations), ce qui garantit que l'énoncé est réalisable.", "type": "qcm", "multiple": false, "reponse": "0,74", "fiche": null, "verif": {"script": "verif/seance_algebre_1.py", "cles": ["Q10_d_premiere", "Q10_d_quatre", "Q10_d_somme4", "Q10_exact", "Q10_lam5", "Q10_somme2"]}}, {"id": "AL-11", "section": "math", "theme": "ACP de la corrélation dans un modèle à un facteur", "difficulte": 4, "temps_cible_s": 150, "enonce": "Les rendements de 20 actifs s'écriv <script>
'use strict';
const D = JSON.parse(document.getElementById('donnees').textContent);
const ITEMS = D.sections.flatMap(s => s.questions.map(q => Object.assign({ nomSection: s.nom }, q)));
const CLE = 'atelier-quant:' + D.id;
const SERVEUR = location.protocol.startsWith('http');
// La session survit à un rechargement de l'onglet : on se reconnecte alors au même noyau, variables comprises.
const SESSION = (() => { const neuve = Math.random().toString(36).slice(2) + Date.now().toString(36); try { const s = sessionStorage.getItem('atelier-quant:session') || neuve; sessionStorage.setItem('atelier-quant:session', s); return s; } catch (e) { return neuve; } })();
const page = document.getElementById('page');
const noyauxDemarres = {};
let E = etatNeuf('accueil');

function etatNeuf(phase) { return { phase, courant: 0, debut: null, fin: null, reponses: {}, temps: {}, ordre: {}, cellules: {}, code: {}, controles: {}, ordreControles: {}, vus: {}, partie: {}, enregistrement: null, pauseDepuis: null, pauseTotale: 0 }; }
// Options par défaut : la pause et « Je ne sais pas » sont permis, sauf si l'examen les interdit (examens blancs).
const PAUSE_PERMISE = D.options.pause !== false;
const NSP_PERMIS = D.options.je_ne_sais_pas !== false;
function dureeEcoulee(fin) { return (fin - E.debut - (E.pauseTotale || 0) - (E.pauseDepuis ? fin - E.pauseDepuis : 0)) / 1000; }
const NOTEES = ITEMS.filter(q => q.type !== 'lecon');
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(E)); } catch (e) {} }
function charger() { try { const s = localStorage.getItem(CLE); if (s) E = Object.assign(etatNeuf('accueil'), JSON.parse(s)); } catch (e) {} }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function enLigne(t) { return esc(t).replace(/`([^`]+)`/g, '<code class="sans-math">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

// Markdown réduit : titres #, tableaux |, listes - et 1., paragraphes, `code`, **gras**, blocs entre triples accents graves.
function rendre(t) {
  let h = '';
  String(t).split('```').forEach((bloc, i) => {
    if (i % 2) {
      const info = (bloc.match(/^(\w*)\n/) || [])[1];
      h += '<pre class="sans-math' + (info === 'sortie' ? ' sortie-lecon' : '') + '"><code>' + esc(bloc.replace(/^\w*\n/, '')) + '</code></pre>';
      return;
    }
    const lignes = bloc.split('\n');
    let k = 0;
    while (k < lignes.length) {
      const l = lignes[k];
      if (!l.trim()) { k++; continue; }
      const titre = l.match(/^(#{1,4})\s+(.*)$/);
      if (titre) { const n = Math.min(4, titre[1].length + 1); h += '<h' + n + '>' + enLigne(titre[2]) + '</h' + n + '>'; k++; continue; }
      if (l.trim().startsWith('|')) {
        const rangs = [];
        while (k < lignes.length && lignes[k].trim().startsWith('|')) { rangs.push(lignes[k].trim()); k++; }
        const cellules = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
        h += '<div class="defile"><table><tr>' + cellules(rangs[0]).map(c => '<th>' + enLigne(c) + '</th>').join('') + '</tr>';
        rangs.slice(1).filter(r => !/^\|[\s|:-]+\|$/.test(r)).forEach(r => { h += '<tr>' + cellules(r).map(c => '<td>' + enLigne(c) + '</td>').join('') + '</tr>'; });
        h += '</table></div>'; continue;
      }
      const puce = /^\s*[-*]\s+/, numero = /^\s*\d+\.\s+/;
      if (puce.test(l) || numero.test(l)) {
        const motif = puce.test(l) ? puce : numero, balise = motif === puce ? 'ul' : 'ol';
        h += '<' + balise + '>';
        while (k < lignes.length && motif.test(lignes[k])) { h += '<li>' + enLigne(lignes[k].replace(motif, '')) + '</li>'; k++; }
        h += '</' + balise + '>'; continue;
      }
      const par = [];
      while (k < lignes.length && lignes[k].trim() && !/^(#{1,4}\s|\s*\||\s*[-*]\s|\s*\d+\.\s)/.test(lignes[k])) { par.push(lignes[k]); k++; }
      const texte = par.join('\n').trim();
      // Un paragraphe réduit à une seule formule est centré ; une formule au milieu d'une phrase reste dans la ligne.
      const seule = texte.startsWith('\\(') && texte.endsWith('\\)') && texte.indexOf('\\(', 2) < 0;
      h += (seule ? '<p class="formule">' : '<p>') + enLigne(par.join('\n')) + '</p>';
    }
  });
  return h;
}
function composer(el) { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el || page]).catch(() => {}); }
function mmss(s) { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function melanger(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function api(chemin, corps) {
  const r = await fetch(chemin, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
  return r.json();
}

let dernierTic = null;
function tic() {
  const ch = document.getElementById('chrono');
  const bouton = document.getElementById('pause');
  bouton.hidden = !(PAUSE_PERMISE && E.phase === 'epreuve');
  document.getElementById('recommencerHaut').hidden = E.phase !== 'epreuve';
  document.getElementById('voile').hidden = !(E.phase === 'epreuve' && E.pauseDepuis);
  if (E.phase !== 'epreuve' || E.pauseDepuis) { dernierTic = null; return; }
  const maintenant = Date.now();
  if (dernierTic !== null) { const q = ITEMS[E.courant]; E.temps[q.id] = (E.temps[q.id] || 0) + (maintenant - dernierTic) / 1000; }
  dernierTic = maintenant;
  const reste = D.duree_minutes * 60 - dureeEcoulee(maintenant);
  ch.textContent = (reste < 0 ? '+' : '') + mmss(Math.abs(reste));
  ch.classList.toggle('depasse', reste < 0);
}
setInterval(() => { tic(); if (E.phase === 'epreuve') sauver(); }, 500);
if (SERVEUR) document.getElementById('lienAccueil').hidden = false;
document.getElementById('lienAccueil').onclick = () => {
  if (E.phase === 'epreuve' && PAUSE_PERMISE && !E.pauseDepuis) { tic(); E.pauseDepuis = Date.now(); sauver(); }
};
document.getElementById('recommencerHaut').onclick = () => {
  if (!confirm('Effacer ce passage (réponses, code, chronomètre) et revenir au début de la séance ?')) return;
  try { localStorage.removeItem(CLE); } catch (e) {}
  E = etatNeuf('accueil'); dernierTic = null; afficher();
};
document.getElementById('pause').onclick = () => { tic(); E.pauseDepuis = Date.now(); sauver(); tic(); };
document.getElementById('reprendre').onclick = () => {
  if (E.pauseDepuis) { E.pauseTotale = (E.pauseTotale || 0) + (Date.now() - E.pauseDepuis); E.pauseDepuis = null; }
  dernierTic = null; sauver(); tic();
};

// ------------------------------------------------------------------ accueil
function accueil() {
  page.className = '';
  document.getElementById('position').textContent = '';
  document.getElementById('chrono').textContent = mmss(D.duree_minutes * 60);
  let h = '<div class="carte presentation"><h2>' + esc(D.titre) + '</h2><p class="meta">' + D.duree_minutes + ' min · ' + NOTEES.length + ' question' + (NOTEES.length > 1 ? 's' : '') + (D.options.pause === false ? ' · sans pause' : '') + '</p>' + rendre(D.presentation);
  h += '<div class="sections-liste">';
  D.sections.forEach(s => { const n = s.questions.filter(q => q.type !== 'lecon').length; h += '<div><span>' + esc(s.nom) + '</span><span class="meta">' + (n ? n + ' question' + (n > 1 ? 's' : '') : 'leçon') + ' · ' + s.budget_min + ' min</span></div>'; });
  h += '</div>';
  D.avertissements.forEach(a => { h += '<div class="note">' + rendre(a) + '</div>'; });
  if (!SERVEUR && ITEMS.some(q => q.type === 'code')) h += '<div class="note"><p><strong>Le notebook ne peut pas s\'exécuter :</strong> cette page est ouverte comme un fichier. Lance <code class="sans-math">python lancer.py</code> dans le dossier du projet, puis ouvre l\'examen depuis la page qui s\'affiche.</p></div>';
  h += '<p class="meta">' + esc(D.conventions) + '</p>';
  h += '<div class="barre"><button class="principal" id="demarrer">Commencer</button></div></div>';
  page.innerHTML = h;
  document.getElementById('demarrer').onclick = () => {
    E = etatNeuf('epreuve');
    E.debut = Date.now();
    ITEMS.forEach(q => {
      if (q.type === 'qcm') E.ordre[q.id] = melanger(q.options.map(o => o.id));
      if (q.cellules_initiales) E.cellules[q.id] = q.cellules_initiales.map(c => ({ code: c, sortie: '', numero: null }));
      if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => { E.ordreControles[q.id + ':' + cid] = melanger(c.options.map(o => o.id)); });
    });
    sauver(); afficher();
  };
  composer();
}

// ------------------------------------------------------------------ épreuve
function pastilles() {
  const faite = it => it.type === 'lecon' ? !!E.vus[it.id] : it.type === 'code' ? (E.code[it.id] || {}).soumissions > 0 : E.reponses[it.id] !== undefined;
  const barre = document.querySelector('#progression > span');
  if (barre) barre.style.width = (100 * ITEMS.filter(faite).length / ITEMS.length) + '%';
  let h = '<div class="cadre"><aside class="plan"><div id="pastilles">', section = null, n = 0;
  ITEMS.forEach((it, i) => {
    if (it.nomSection !== section) { section = it.nomSection; h += '<div class="groupe">' + esc(section) + '</div>'; }
    const libelle = it.type === 'lecon' ? 'Leçon' : 'Question ' + (++n);
    h += '<button class="pastille' + (faite(it) ? ' faite' : '') + (i === E.courant ? ' courante' : '') + '" data-i="' + i + '" title="' + esc(it.theme) + '"' + (D.options.retour_arriere || i === E.courant ? '' : ' disabled') + '><span class="etat"></span><span class="libelle">' + libelle + '</span></button>';
  });
  return h + '</div></aside><div class="contenu">';
}
const FIN_CADRE = '</div></div>';
function navigation() {
  let h = '<div class="barre navigation">';
  if (D.options.retour_arriere) h += '<button id="prec"' + (E.courant === 0 ? ' disabled' : '') + '>Précédente</button>';
  if (E.courant < ITEMS.length - 1) h += '<button class="principal" id="suiv">Suivante</button>';
  return h + '<button id="finir">Terminer et corriger</button></div>';
}
function brancherNavigation() {
  const aller = i => { tic(); E.courant = i; sauver(); afficher(); };
  page.querySelectorAll('.pastille').forEach(b => b.onclick = () => aller(Number(b.dataset.i)));
  const p = document.getElementById('prec'); if (p) p.onclick = () => aller(E.courant - 1);
  const s = document.getElementById('suiv'); if (s) s.onclick = () => aller(E.courant + 1);
  document.getElementById('finir').onclick = () => {
    const manquantes = NOTEES.filter(it => it.type === 'code' ? !((E.code[it.id] || {}).soumissions > 0) : E.reponses[it.id] === undefined).length;
    if (manquantes && !confirm(manquantes + ' question(s) sans réponse ou jamais soumise(s). Terminer quand même ?')) return;
    tic();
    if (E.pauseDepuis) { E.pauseTotale = (E.pauseTotale || 0) + (Date.now() - E.pauseDepuis); E.pauseDepuis = null; }
    E.phase = 'bilan'; E.fin = Date.now(); sauver(); afficher();
  };
}

function epreuve() {
  tic();
  const q = ITEMS[E.courant];
  document.getElementById('position').textContent = q.nomSection + (q.type === 'lecon' ? ' · étape ' : ' · question ') + (E.courant + 1) + ' sur ' + ITEMS.length;
  if (q.type === 'lecon') E.vus[q.id] = true;
  if (q.cellules_initiales) return epreuveCode(q);
  if (q.type === 'lecon') return epreuveLecon(q);
  page.className = '';
  const rang = NOTEES.indexOf(q) + 1;
  let h = pastilles() + '<div class="carte question"><div class="surtitre"><span class="rang">Question ' + rang + ' sur ' + NOTEES.length + '</span><span class="chip">' + esc(q.theme) + '</span><span>temps visé ' + mmss(q.temps_cible_s) + '</span></div>' + rendre(q.enonce);
