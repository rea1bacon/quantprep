telle dégénérescence : on borne les variances par en dessous.\n2. La monotonie ne garantit qu'une convergence vers un point stationnaire ou un maximum local : on relance depuis plusieurs départs.\n3. Les étiquettes des composantes sont interchangeables : échanger les composantes 1 et 2 donne la même vraisemblance.\n\n[[controle:em]]\n\n## Réflexes en 30 secondes\n\n| Indice dans l'énoncé | Premier geste |\n|---|---|\n| pas maximal, divergence de la descente | \\(\\eta < 2/L\\), \\(L\\) plus grande valeur propre de la hessienne |\n| vitesse, conditionnement \\(\\kappa\\) | facteur \\(\\max_k \\lvert 1 - \\eta\\lambda_k \\rvert\\) ; optimum \\((\\kappa - 1)/(\\kappa + 1)\\) en \\(\\eta = 2/(\\lambda_{\\min} + L)\\) ; momentum \\((\\sqrt{\\kappa} - 1)/(\\sqrt{\\kappa} + 1)\\) |\n| SGD à pas constant | variance stationnaire \\(\\eta^2\\sigma^2/(1 - (1 - \\eta a)^2)\\), de l'ordre de \\(\\eta\\) ; lot de \\(B\\) : bruit divisé par \\(B\\) |\n| variance des poids à l'initialisation | aller : \\(n_{\\text{entrée}}s^2 \\times \\mathbb{E}[h^2]\\) ; ReLU : \\(\\mathbb{E}[h^2] = \\tfrac12\\mathbb{E}[a^2]\\), d'où \\(2/n\\) ; linéaire ou tanh : \\(1/n\\) |\n| BatchNorm ou LayerNorm | BatchNorm : par neurone, sur le lot (axe 0) ; LayerNorm : par exemple, sur les neurones (axe 1) |\n| dropout de probabilité \\(p\\) | garder et diviser par \\(1 - p\\) ; espérance conservée, variance \\(h^2 p/(1 - p)\\) |\n| gradient à travers \\(M\\) couches | produit des jacobiennes ; résiduel : au moins \\((1 - \\varepsilon)^M\\) |\n| champ réceptif, convolutions causales | \\(1 + \\sum d_l(k_l - 1)\\) ; sans trou si \\(d_l \\le R_{l-1}\\) |\n| LSTM | cellule additive, \\(\\partial\\mathbf{c}_t/\\partial\\mathbf{c}_{t-1} = \\mathrm{diag}(\\mathbf{f}_t)\\) ; paramètres \\(4(n_h(n_h + n_x) + n_h)\\) |\n| attention | scores de variance \\(d\\), division par \\(\\sqrt{d}\\) ; coût en \\(T^2\\) |\n| SVM, rôle de \\(C\\) | \\(C\\) grand : peu de violations, marge étroite ; largeur \\(2/\\lVert \\mathbf{w} \\rVert\\) |\n| ridge à noyau, processus gaussien | \\(\\mathbf{s}(\\mathbf{x})^\\top(\\mathbf{K} + \\lambda\\mathbf{I})^{-1}\\mathbf{y}\\), \\(\\lambda = \\sigma^2\\) |\n| EM, mélange | E : responsabilités par Bayes ; M : moyennes et variances pondérées ; \\(\\ell\\) ne décroît jamais |\n\nContrôles de vraisemblance en 5 secondes :\n\n- un facteur de contraction est dans \\([0, 1[\\) pour un pas qui converge ; \\((\\kappa - 1)/(\\kappa + 1) < 1 - 1/\\kappa\\) dès que \\(\\kappa > 1\\) ;\n- le champ réceptif de \\(M\\) couches causales de noyau au moins 2 vaut au moins \\(M + 1\\), et il croît avec chaque dilatation ;\n- une variance a posteriori de processus gaussien est entre 0 et \\(k(\\mathbf{x}, \\mathbf{x})\\) ;\n- une responsabilité est entre 0 et 1, et les deux responsabilités d'une observation somment à 1.\n\n## À savoir refaire sans notes\n\n- (O1) à (O3) par la base propre, avec le calcul du pas optimal ; la récurrence d'ordre 2 du momentum et la condition sur le discriminant.\n- La variance stationnaire du SGD sur la quadratique de dimension 1.\n- (B1) coordonnée par coordonnée ; (I1) et (I2), d'où 1/n et 2/n.\n- (G1) et la borne résiduelle \\((1 - \\varepsilon)^M\\).\n- Les deux normalisations, avec leurs axes ; l'espérance et la variance du dropout.\n- (C1) et (C2) par récurrence ; les cinq équations du LSTM et (L1) ; (A1) et la jacobienne du softmax.\n- (S1) et (S2) ; (K1) par l'identité de poussée ; (P1) par le résidu non corrélé.\n- Les étapes E et M, et la monotonie de EM par Jensen à deux points.\n", "controles": {"pas": {"question": "La hessienne d'une quadratique a pour valeurs propres 0,5 et 4. Pour quels pas fixes \\(\\eta > 0\\) la descente de gradient converge-t-elle quel que soit le point de départ ?", "options": [{"id": "a", "texte": "Pour \\(\\eta < 0{,}5\\).", "correcte": true, "explication": "Oui : il faut \\(\\lvert 1 - \\eta\\lambda_k \\rvert < 1\\) pour chaque valeur propre, la plus contraignante étant \\(L = 4\\) : \\(\\eta < 2/L\\)."}, {"id": "b", "texte": "Pour \\(\\eta < 4\\).", "correcte": false, "explication": "C'est \\(2/\\lambda_{\\min}\\). Avec \\(\\eta = 1\\), par exemple, la direction de courbure 4 est multipliée par \\(\\lvert 1 - 4 \\rvert = 3\\) à chaque pas : divergence."}, {"id": "c", "texte": "Pour \\(\\eta \\le \\tfrac{4}{9}\\) seulement.", "correcte": false, "explication": "\\(2/(\\lambda_{\\min} + L)\\) est le pas **optimal**, celui qui minimise le facteur de contraction. Les pas un peu plus grands, jusqu'à \\(2/L\\) exclu, convergent aussi, plus lentement."}, {"id": "d", "texte": "Pour \\(\\eta \\le 0{,}25\\) seulement.", "correcte": false, "explication": "\\(1/L\\) est un pas sûr, qui converge avec le facteur \\(1 - 1/\\kappa\\), mais ce n'est pas la limite : tout \\(\\eta < 2/L\\) converge."}]}, "norme": {"question": "Les pré-activations d'un lot forment une matrice de 32 lignes (exemples) et 128 colonnes (neurones). Que calcule LayerNorm ?", "options": [{"id": "a", "texte": "32 moyennes et 32 variances, une par exemple, sur ses 128 neurones.", "correcte": true, "explication": "Oui : LayerNorm normalise chaque ligne (axe 1). Le résultat d'un exemple ne dépend pas des autres exemples."}, {"id": "b", "texte": "128 moyennes et 128 variances, une par neurone, sur les 32 exemples.", "correcte": false, "explication": "C'est BatchNorm, qui normalise chaque colonne sur le lot (axe 0)."}, {"id": "c", "texte": "Une seule moyenne et une seule variance sur les 4096 nombres.", "correcte": false, "explication": "Aucune des deux normalisations ne mélange ainsi tous les exemples et tous les neurones : la moyenne est prise ligne par ligne (LayerNorm) ou colonne par colonne (BatchNorm)."}, {"id": "d", "texte": "Des moyennes mobiles accumulées pendant l'entraînement, utilisées en évaluation.", "correcte": false, "explication": "Les moyennes mobiles sont propres à BatchNorm en évaluation. LayerNorm fait le même calcul en entraînement et en évaluation."}]}, "attention": {"question": "Une requête et une clé ont chacune \\(d = 256\\) coordonnées ; ces \\(2d\\) coordonnées sont des variables indépendantes, de moyenne 0 et de variance 1. Quel est l'écart-type de leur produit scalaire, avant division par \\(\\sqrt{d}\\) ?", "options": [{"id": "a", "texte": "16", "correcte": true, "explication": "Oui : la variance vaut \\(d = 256\\) (A1), donc l'écart-type \\(\\sqrt{d} = 16\\) ; la division par \\(\\sqrt{d}\\) le ramène à 1."}, {"id": "b", "texte": "256", "correcte": false, "explication": "C'est la **variance**, pas l'écart-type. Diviser les scores par \\(d\\) ramènerait leur écart-type à \\(1/\\sqrt{d}\\), trop petit."}, {"id": "c", "texte": "1", "correcte": false, "explication": "C'est l'écart-type **après** division par \\(\\sqrt{d}\\). Avant, chaque coordonnée apporte une variance 1 et les \\(d\\) termes s'additionnent."}, {"id": "d", "texte": "0, car les coordonnées sont centrées.", "correcte": false, "explication": "Centrées, elles donnent un produit scalaire d'**espérance** nulle, pas de dispersion nulle."}]}, "svm": {"question": "Sur des données presque séparables, on multiplie le coefficient \\(C\\) d'un SVM à marge souple par 100. Qu'attendre ?", "options": [{"id": "a", "texte": "Une marge plus étroite et moins de violations : le modèle suit davantage les données d'entraînement.", "correcte": true, "explication": "Oui : \\(C\\) pèse les violations contre \\(\\tfrac12\\lVert \\mathbf{w} \\rVert^2\\) ; le relever autorise un \\(\\lVert \\mathbf{w} \\rVert\\) plus grand, donc une largeur \\(2/\\lVert \\mathbf{w} \\rVert\\) plus petite (exemple de la leçon : de \\(3{,}0\\) à \\(0{,}5\\))."}, {"id": "b", "texte": "Une marge plus large, car le modèle est plus régularisé.", "correcte": false, "explication": "C'est l'effet inverse : \\(C\\) est l'inverse d'un coefficient de régularisation (\\(\\lambda = 1/(Cn)\\)). Plus \\(C\\) est grand, moins le modèle est régularisé."}, {"id": "c", "texte": "Aucun changement : la solution d'un SVM ne dépend que des vecteurs de support.", "correcte": false, "explication": "Les vecteurs de support eux-mêmes changent avec \\(C\\), et la borne \\(\\alpha_i \\le C\\) aussi : la solution dépend de \\(C\\)."}, {"id": "d", "texte": "Toutes les observations deviennent des vecteurs de support.", "correcte": false, "explication": "Au contraire, avec \\(C\\) grand, les observations bien classées au-delà de la marge ont \\(\\alpha_i = 0\\) ; c'est avec \\(C\\) petit et une marge très large que beaucoup d'observations se retrouvent dans la marge."}]}, "em": {"question": "Après une itération de EM sur un mélange de deux gaussiennes, la log-vraisemblance a baissé. Que faut-il en conclure ?", "options": [{"id": "a", "texte": "Il y a une erreur d'implémentation : une itération exacte ne peut pas faire baisser la log-vraisemblance.", "correcte": true, "explication": "Oui : (E2) garantit \\(\\ell(\\boldsymbol{\\vartheta}') \\ge \\ell(\\boldsymbol{\\vartheta})\\) pour une étape E et une étape M exactes. Une baisse au-delà des erreurs d'arrondi signale une faute, par exemple une variance calculée avec l'ancienne moyenne ou des responsabilités non normalisées."}, {"id": "b", "texte": "L'algorithme est passé par un maximum local, ce qui arrive normalement.", "correcte": false, "explication": "EM peut s'arrêter sur un maximum local, mais il n'y descend jamais : la suite des \\(\\ell\\) est croissante."}, {"id": "c", "texte": "La vraisemblance est non bornée, donc elle peut aussi baisser.", "correcte": false, "explication": "La non-bornitude permet à \\(\\ell\\) de tendre vers \\(+\\infty\\) (variance qui s'effondre), pas de baisser."}, {"id": "d", "texte": "C'est normal à la première itération, à cause de l'initialisation.", "correcte": false, "explication": "La monotonie vaut dès la première itération, quel que soit le départ : la preuve n'utilise aucune propriété du point courant."}]}}, "cellules_initiales": ["import numpy as np\nnp.set_printoptions(precision=4, suppress=True)\n\n# Essaie ici les exemples de la leçon, en les modifiant.\nlam = np.array([1.0, 100.0])\nfor eta in [0.01, 2 / 101, 0.0199, 0.0201]:\n    print(eta, np.abs(1 - eta * lam).max())"], "verif": {"script": "verif/seance_ml_4.py"}}]}, {"id": "mla", "nom": "Machine Learning avancé", "budget_min": 16, "questions": [{"id": "ML4-01", "section": "mla", "theme": "Descente de gradient, pas optimal et conditionnement", "difficulte": 3, "temps_cible_s": 90, "enonce": "On minimise \\(f(\\boldsymbol{\\theta}) = \\tfrac12 \\boldsymbol{\\theta}^\\top \\mathbf{A}\\,\\boldsymbol{\\theta} - \\mathbf{b}^\\top \\boldsymbol{\\theta}\\), où \\(\\mathbf{A}\\) est une matrice symétrique \\(2 \\times 2\\) de valeurs propres 2 et 18 et \\(\\mathbf{b} \\in \\mathbb{R}^2\\) est fixé, par descente de gradient à pas fixe \\(\\eta > 0\\) : \\(\\boldsymbol{\\theta}_t = \\boldsymbol{\\theta}_{t-1} - \\eta\\,\\nabla f(\\boldsymbol{\\theta}_{t-1})\\). On note \\(\\boldsymbol{\\theta}^*\\) le minimum et \\(q(\\eta)\\) le plus petit nombre tel que \\(\\lVert \\boldsymbol{\\theta}_t - \\boldsymbol{\\theta}^* \\rVert \\le q(\\eta)^t\\,\\lVert \\boldsymbol{\\theta}_0 - \\boldsymbol{\\theta}^* \\rVert\\) pour tout point de départ et tout \\(t \\ge 1\\).\n\nQuel pas \\(\\eta\\) minimise \\(q(\\eta)\\), et que vaut alors \\(q\\) ?", "options": [{"id": "a", "texte": "\\(\\eta = \\tfrac{1}{10}\\) et \\(q = \\tfrac{4}{5}\\)", "correcte": true, "explication": "Oui : \\(\\eta^* = 2/(\\lambda_{\\min} + L) = 2/20\\), et les deux directions sont contractées du même facteur \\(\\lvert 1 - 2/10 \\rvert = \\lvert 1 - 18/10 \\rvert = (\\kappa - 1)/(\\kappa + 1)\\) avec \\(\\kappa = 9\\)."}, {"id": "b", "texte": "\\(\\eta = \\tfrac{1}{18}\\) et \\(q = \\tfrac{8}{9}\\)", "correcte": false, "explication": "Le pas \\(1/L\\) converge, avec \\(q = 1 - 1/\\kappa\\), mais il n'est pas optimal : il annule l'erreur dans la direction de courbure 18 et laisse la direction plate trop lente. Augmenter \\(\\eta\\) jusqu'à \\(2/(\\lambda_{\\min} + L)\\) équilibre les deux directions."}, {"id": "c", "texte": "\\(\\eta = \\tfrac{1}{9}\\) et \\(q = \\tfrac{7}{9}\\)", "correcte": false, "explication": "C'est le pas limite \\(2/L\\), et \\(\\tfrac{7}{9}\\) n'est que le facteur de la direction plate. Dans la direction de courbure 18, \\(\\lvert 1 - 18 \\times 2/18 \\rvert = 1\\) : l'erreur ne décroît pas, donc \\(q = 1\\)."}, {"id": "d", "texte": "\\(\\eta = \\tfrac{1}{2}\\) et \\(q = 0\\)", "correcte": false, "explication": "Le pas \\(1/\\lambda_{\\min}\\) annule l'erreur de la direction plate en un pas, mais multiplie celle de la direction de courbure 18 par \\(\\lvert 1 - 9 \\rvert\\) : \\(q = 8\\), la descente diverge. Le pas doit rester sous \\(2/L\\)."}], "solution": "Réponse : \\(\\eta = \\tfrac{1}{10}\\), et \\(q = \\tfrac{4}{5}\\).\n\nÉtape 1 : l'erreur \\(\\mathbf{e}_t = \\boldsymbol{\\theta}_t - \\boldsymbol{\\theta}^*\\) vérifie \\(\\mathbf{e}_t = (\\mathbf{I} - \\eta\\mathbf{A})\\,\\mathbf{e}_{t-1}\\) ; dans la base propre, chaque coordonnée est multipliée par \\(1 - \\eta\\lambda_k\\) à chaque pas, donc \\(q(\\eta) = \\max(\\lvert 1 - 2\\eta \\rvert, \\lvert 1 - 18\\eta \\rvert)\\) (leçon, partie 1.1, O1).\n\nÉtape 2 : le maximum de deux fonctions, l'une décroissante tant que \\(\\eta < 1/2\\), l'autre croissante dès que \\(\\eta > 1/18\\), est minimal quand elles sont égales avec des signes opposés : \\(1 - 2\\eta = 18\\eta - 1\\), soit \\(\\eta = 2/20 = \\tfrac{1}{10}\\) (O3).\n\nÉtape 3 : \\(q = 1 - 2/10 = \\tfrac{4}{5}\\), soit \\((\\kappa - 1)/(\\kappa + 1)\\) avec \\(\\kappa = 18/2 = 9\\). Le script vérifie qu'aucun pas d'une grille de 999 valeurs ne fait mieux.", "type": "qcm", "multiple": false, "reponse": "\\(\\eta = \\tfrac{1}{10}\\) et \\(q = \\tfrac{4}{5}\\)", "fiche": null, "verif": {"script": "verif/seance_ml_4.py", "cles": ["Q01_d_invL_eta_den", "Q01_d_invL_eta_num", "Q01_d_invL_q_den", "Q01_d_invL_q_num", "Q01_d_lmin_eta_den", "Q01_d_lmin_eta_num", "Q01_d_lmin_q", "Q01_d_max_eta_den", "Q01_d_max_eta_num", "Q01_d_max_q", "Q01_d_max_qlent_den", "Q01_d_max_qlent_num", "Q01_eta_den", "Q01_eta_num", "Q01_kappa", "Q01_q_den", "Q01_q_num"]}}, {"id": "ML4-02", "section": "mla", "theme": "Gradient stochastique à pas constant, variance stationnaire", "difficulte": 4, "temps_cible_s": 120, "enonce": "On minimise \\(f(\\theta) = \\tfrac{a}{2}\\theta^2\\) avec \\(a = 2\\), dont le minimum est en 0, par gradient stochastique à pas constant \\(\\eta = 0{,}1\\). Au pas \\(t \\ge 1\\), le gradient estimé est \\(G_t = a\\,\\Theta_{t-1} + Z_t\\), où les \\(Z_t\\) sont des variables indépendantes, de moyenne 0 et de variance \\(\\sigma^2 = 0{,}5\\), chacune indépendante de \\(\\Theta_0, \\dots, \\Theta_{t-1}\\) ; puis \\(\\Theta_t = \\Theta_{t-1} - \\eta\\,G_t\\), avec \\(\\Theta_0 = 3\\).\n\nVers quelle valeur tend \\(\\mathrm{Var}(\\Theta_t)\\) quand \\(t \\to \\infty\\), arrondie à quatre décimales ?", "options": [{"id": "a", "texte": "0,0139", "correcte": true, "explication": "Oui : \\(\\eta^2\\sigma^2/(1 - (1 - \\eta a)^2) = 0{,}005/(1 - 0{,}64) = \\tfrac{1}{72}\\)."}, {"id": "b", "texte": "0,0125", "correcte": false, "explication": "C'est l'équivalent pour \\(\\eta\\) petit, \\(\\eta\\sigma^2/(2a)\\), qui néglige le terme \\(\\eta a\\) de \\(\\eta\\sigma^2/(a(2 - \\eta a))\\). Ici \\(\\eta a = 0{,}2\\) n'est pas négligeable devant 2 ; la question demande la valeur exacte."}, {"id": "c", "texte": "0,0250", "correcte": false, "explication": "Le facteur \\(1 - \\eta a\\) n'a pas été élevé au carré dans la récurrence des variances. Or \\(\\mathrm{Var}(c\\,\\Theta) = c^2\\,\\mathrm{Var}(\\Theta)\\) : \\(v_t = (1 - \\eta a)^2 v_{t-1} + \\eta^2\\sigma^2\\)."}, {"id": "d", "texte": "0,0050", "correcte": false, "explication": "C'est \\(\\eta^2\\sigma^2\\), la variance ajoutée par un seul pas. Le bruit s'accumule d'un pas à l'autre, amorti par le facteur \\((1 - \\eta a)^2\\) : la limite est la somme géométrique \\(\\eta^2\\sigma^2 \\sum_{j \\ge 0} (1 - \\eta a)^{2j}\\)."}], "solution": "Réponse : \\(\\tfrac{1}{72} \\approx 0{,}0139\\).\n\nÉtape 1 : \\(\\Theta_t = (1 - \\eta a)\\,\\Theta_{t-1} - \\eta Z_t\\), avec \\(1 - \\eta a = 0{,}8\\).\n\nÉtape 2 : \\(Z_t\\) est indépendante de \\(\\Theta_{t-1}\\), donc \\(v_t = \\mathrm{Var}(\\Theta_t)\\) vérifie \\(v_t = 0{,}8^2\\,v_{t-1} + \\eta^2\\sigma^2\\), avec \\(v_0 = 0\\) (\\(\\Theta_0\\) est fixe) et \\(\\eta^2\\sigma^2 = 0{,}005\\) (leçon, partie 1.3, O5).\n\nÉtape 3 : \\(v_t - v_\\infty = 0{,}64\\,(v_{t-1} - v_\\infty)\\) tend vers 0, avec \\(v_\\infty = 0{,}005/(1 - 0{,}64) = \\tfrac{1}{72}\\). Le départ \\(\\Theta_0 = 3\\) n'agit que sur l'espérance, \\(3 \\times 0{,}8^t \\to 0\\).\n\nSimulation de 40000 chaînes sur 200 pas (script) : 0,0138, erreur standard 0,0001.", "type": "qcm", "multiple": false, "reponse": "0,0139", "fiche": null, "verif": {"script": "verif/seance_ml_4.py", "cles": ["Q02_d_approx", "Q02_d_sans_carre", "Q02_d_un_pas", "Q02_exact", "Q02_exact_den", "Q02_exact_num", "Q02_facteur", "Q02_mc", "Q02_se"]}}, {"id": "ML4-03", "section": "mla", "theme": "Initialisation, propagation de la variance avec ReLU", "difficulte": 4, "temps_cible_s": 120, "enonce": "Un réseau sans biais a toutes ses couches de largeur \\(n\\). Le vecteur \\(\\mathbf{a}^{(1)} \\in \\mathbb{R}^n\\) a des coordonnées indépendantes de loi normale centrée réduite. Pour \\(l = 1, \\dots, 10\\) : \\(\\mathbf{a}^{(l+1)} = \\mathbf{W}^{(l+1)}\\,\\mathrm{ReLU}(\\mathbf{a}^{(l)})\\), où ReLU s'applique coordonnée par coordonnée et où les matrices aléatoires \\(\\mathbf{W}^{(2)}, \\dots, \\mathbf{W}^{(11)}\\), de taille \\(n \\times n\\), ont des coefficients indépendants de loi \\(\\mathcal{N}(0, 1/n)\\) (initialisation de Glorot, \\(2/(n + n)\\)), indépendants de \\(\\mathbf{a}^{(1)}\\).\n\nQue vaut \\(\\mathrm{Var}(a^{(11)}_1)\\), la variance de la première coordonnée de \\(\\mathbf{a}^{(11)}\\) ?", "options": [{"id": "a", "texte": "\\(\\tfrac{1}{1024}\\)", "correcte": true, "explication": "Oui : chaque couche multiplie le moment d'ordre 2 par \\(n \\times \\tfrac1n \\times \\tfrac12\\), et il y a 10 couches entre \\(\\mathbf{a}^{(1)}\\) et \\(\\mathbf{a}^{(11)}\\)."}, {"id": "b", "texte": "1", "correcte": false, "explication": "La règle \\(1/n\\) conserve la variance d'une couche **linéaire**. ReLU met à zéro la moitié du moment d'ordre 2 (leçon, partie 2.2, I2) : il faudrait \\(2/n\\) (He) pour le conserver."}, {"id": "c", "texte": "\\(\\tfrac{1}{2048}\\)", "correcte": false, "explication": "C'est \\(2^{-11}\\) : une couche de trop. De \\(\\mathbf{a}^{(1)}\\) à \\(\\mathbf{a}^{(11)}\\), il y a 10 multiplications par une matrice de poids, donc 10 divisions par 2."}, {"id": "d", "texte": "\\(\\big(\\tfrac12 - \\tfrac{1}{2\\pi}\\big)^{10} \\approx 0{,}0000212\\)", "correcte": false, "explication": "C'est la **variance** de \\(\\mathrm{ReLU}(A)\\) pour \\(A\\) normale centrée réduite, utilisée à la place du moment d'ordre 2. Or \\(\\mathbb{E}[a_i^2] = s^2\\sum_j \\mathbb{E}[h_j^2]\\) fait intervenir \\(\\mathbb{E}[h_j^2] = \\tfrac12\\mathbb{E}[a_j^2]\\), pas \\(\\mathrm{Var}(h_j)\\) : les \\(h_j\\) ne sont pas centrés, et c'est le moment d'ordre 2 qui compte. De plus, après la première couche, les \\(a\\) ne sont plus gaussiens."}], "solution": "Réponse : \\(2^{-10} = \\tfrac{1}{1024}\\).\n\nÉtape 1 (leçon, partie 2.2, I1) : \\(a^{(l+1)}_i = \\sum_j W_{ij}h_j\\) avec \\(\\mathbf{h} = \\mathrm{ReLU}(\\mathbf{a}^{(l)})\\) indépendant de \\(\\mathbf{W}^{(l+1)}\\) ; les termes croisés ont une espérance nulle, donc \\(\\mathbb{E}[(a^{(l+1)}_i)^2] = \\tfrac1n\\sum_{j=1}^{n}\\mathbb{E}[h_j^2]\\). Par symétrie des poids, \\(a^{(l+1)}_i\\) est centrée : son moment d'ordre 2 est sa variance.\n\nÉtape 2 (I2) : \\(\\mathbf{a}^{(1)}\\) est gaussienne centrée, et chaque \\(\\mathbf{a}^{(l)}\\) suivant a une loi symétrique ; donc \\(\\mathbb{E}[h_j^2] = \\tfrac12\\mathbb{E}[(a^{(l)}_j)^2]\\), et \\(\\mathbb{E}[(a^{(l+1)}_i)^2] = \\tfrac12\\,\\mathbb{E}[(a^{(l)}_j)^2]\\) (toutes les coordonnées d'une couche ont la même loi).\n\nÉtape 3 : 10 couches, \\(\\mathrm{Var}(a^{(11)}_1) = 2^{-10} \\times 1 = \\tfrac{1}{1024}\\). Le résultat ne dépend pas de \\(n\\).\n\nSimulation (script, réseaux de largeur 10, un réseau neuf par tirage) : 0,001042, erreur standard 0,000065.", "type": "qcm", "multiple": false, "reponse": "\\(\\tfrac{1}{1024}\\)", "fiche": null, "verif": {"script": "verif/seance_ml_4.py", "cles": ["Q03_d_onze_den", "Q03_d_onze_num", "Q03_d_var_relu", "Q03_exact_den", "Q03_exact_num", "Q03_mc", "Q03_se"]}}, {"id": "ML4-04", "section": "mla", "theme": "Dropout, remise à l'échelle et variance", "difficulte": 3, "temps_cible_s": 75, "enonce": "Pendant l'entraînement, une couche de dropout reçoit une activation de valeur \\(h = 2\\). Avec probabilité \\(p = 0{,}2\\), elle renvoie 0 ; sinon, elle renvoie \\(h/(1 - p)\\). On note \\(\\tilde H\\) la valeur renvoyée.\n\nQue vaut \\(\\mathrm{Var}(\\tilde H)\\) ?", "options": [{"id": "a", "texte": "1", "correcte": true, "explication": "Oui : \\(h^2\\,p/(1 - p) = 4 \\times 0{,}2/0{,}8\\)."}, {"id": "b", "texte": "0,64", "correcte": false, "explication": "C'est \\(h^2 p(1 - p)\\), la variance de \\(D\\,h\\) **sans** la division par \\(1 - p\\). Diviser une variable par \\(0{,}8\\) divise sa variance par \\(0{,}8^2\\)."}, {"id": "c", "texte": "5", "correcte": false, "explication": "C'est \\(\\mathbb{E}[\\tilde H^2] = h^2/(1 - p)\\), le moment d'ordre 2. Il faut retrancher le carré de l'espérance, \\(h^2 = 4\\)."}, {"id": "d", "texte": "16", "correcte": false, "explication": "C'est \\(h^2(1 - p)/p\\) : \\(p\\) a été pris pour la probabilité de **garder** l'activation. Ici \\(p = 0{,}2\\) est la probabilité de l'éteindre."}], "solution": "Réponse : 1.\n\nÉtape 1 : \\(\\tilde H\\) vaut 0 avec probabilité 0,2 et \\(2/0{,}8 = 2{,}5\\) avec probabilité 0,8.\n\nÉtape 2 : \\(\\mathbb{E}[\\tilde H] = 0{,}8 \\times 2{,}5 = 2 = h\\) : la remise à l'échelle conserve l'espérance (leçon, partie 2.5, D1).\n\nÉtape 3 : \\(\\mathbb{E}[\\tilde H^2] = 0{,}8 \\times 2{,}5^2 = 5\\), donc \\(\\mathrm{Var}(\\tilde H) = 5 - 4 = 1\\), comme \\(h^2 p/(1 - p)\\).\n\nSimulation (script, 400000 tirages) : 1,001, erreur standard 0,0024.", "type": "qcm", "multiple": false, "reponse": "1", "fiche": null, "verif": {"script": "verif/seance_ml_4.py", "cles": ["Q04_d_inverse", "Q04_d_moment2", "Q04_d_sans_echelle", "Q04_exact", "Q04_haut", "Q04_mc", "Q04_se"]}}, {"id": "ML4-05", "section": "mla", "theme": "Convolutions causales dilatées, champ réceptif", "difficulte": 4, "temps_cible_s": 120, "enonce": "On empile 5 couches de convolution causales à une dimension, de pas 1. Une couche de noyau de taille \\(k\\) et de dilatation \\(d\\) calcule \\(y_t = \\sum_{i=0}^{k-1} w_i\\,u_{t - di}\\) à partir de la suite \\(u\\) qu'elle reçoit (complétée par des zéros avant son début). Les quatre premières couches ont un noyau de taille 3 et des dilatations 1, 2, 4 et 8 ; la cinquième a un noyau de taille 2 et une dilatation 16. Les poids sont quelconques, tous non nuls.\n\nLoin du début de la série, de combien d'entrées \\(x_s\\) distinctes la sortie de la cinquième couche au temps \\(t\\) peut-elle dépendre ?", "options": [{"id": "a", "texte": "47", "correcte": true, "explication": "Oui : \\(1 + 2(1 + 2 + 4 + 8) + 1 \\times 16\\), et il n'y a aucun trou, car chaque dilatation est au plus le champ réceptif des couches précédentes."}, {"id": "b", "texte": "46", "correcte": false, "explication": "Il manque le 1 de la formule : la somme \\(\\sum_l d_l(k_l - 1)\\) est le plus grand **retard**, et les retards vont de 0 à cette valeur, ce qui fait une entrée de plus."}, {"id": "c", "texte": "77", "correcte": false, "explication": "C'est \\(\\sum_l d_l k_l\\) : chaque couche n'ajoute que \\(d_l(k_l - 1)\\) au plus grand retard, car son premier coefficient lit le retard 0."}, {"id": "d", "texte": "10", "correcte": false, "explication": "C'est le champ réceptif sans dilatation, \\(1 + \\sum_l (k_l - 1)\\). Une dilatation <script>
'use strict';
const D = JSON.parse(document.getElementById('donnees').textContent);
const ITEMS = D.sections.flatMap(s => s.questions.map(q => Object.assign({ nomSection: s.nom }, q)));
const CLE = 'atelier-quant:' + D.id;
const SERVEUR = location.protocol.startsWith('http');
// La session survit à un rechargement de l'onglet : on se reconnecte alors au même noyau, variables comprises.
const SESSION = (() => { const neuve = Math.random().toString(36).slice(2) + Date.now().toString(36); try { const s = sessionStorage.getItem('atelier-quant:session') || neuve; sessionStorage.setItem('atelier-quant:session', s); return s; } catch (e) { return neuve; } })();
const page = document.getElementById('page');
const noyauxDemarres = {};
let E = etatNeuf('accueil');

function etatNeuf(phase) { return { phase, courant: 0, debut: null, fin: null, reponses: {}, temps: {}, ordre: {}, cellules: {}, code: {}, controles: {}, ordreControles: {}, vus: {}, partie: {}, enregistrement: null, pauseDepuis: null, pauseTotale: 0 }; }
// Options par défaut : la pause et « Je ne sais pas » sont permis, sauf si l'examen les interdit (examens blancs).
const PAUSE_PERMISE = D.options.pause !== false;
const NSP_PERMIS = D.options.je_ne_sais_pas !== false;
function dureeEcoulee(fin) { return (fin - E.debut - (E.pauseTotale || 0) - (E.pauseDepuis ? fin - E.pauseDepuis : 0)) / 1000; }
const NOTEES = ITEMS.filter(q => q.type !== 'lecon');
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(E)); } catch (e) {} }
function charger() { try { const s = localStorage.getItem(CLE); if (s) E = Object.assign(etatNeuf('accueil'), JSON.parse(s)); } catch (e) {} }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function enLigne(t) { return esc(t).replace(/`([^`]+)`/g, '<code class="sans-math">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

// Markdown réduit : titres #, tableaux |, listes - et 1., paragraphes, `code`, **gras**, blocs entre triples accents graves.
function rendre(t) {
  let h = '';
  String(t).split('```').forEach((bloc, i) => {
    if (i % 2) {
      const info = (bloc.match(/^(\w*)\n/) || [])[1];
      h += '<pre class="sans-math' + (info === 'sortie' ? ' sortie-lecon' : '') + '"><code>' + esc(bloc.replace(/^\w*\n/, '')) + '</code></pre>';
      return;
    }
    const lignes = bloc.split('\n');
    let k = 0;
    while (k < lignes.length) {
      const l = lignes[k];
      if (!l.trim()) { k++; continue; }
      const titre = l.match(/^(#{1,4})\s+(.*)$/);
      if (titre) { const n = Math.min(4, titre[1].length + 1); h += '<h' + n + '>' + enLigne(titre[2]) + '</h' + n + '>'; k++; continue; }
      if (l.trim().startsWith('|')) {
        const rangs = [];
        while (k < lignes.length && lignes[k].trim().startsWith('|')) { rangs.push(lignes[k].trim()); k++; }
        const cellules = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
        h += '<div class="defile"><table><tr>' + cellules(rangs[0]).map(c => '<th>' + enLigne(c) + '</th>').join('') + '</tr>';
        rangs.slice(1).filter(r => !/^\|[\s|:-]+\|$/.test(r)).forEach(r => { h += '<tr>' + cellules(r).map(c => '<td>' + enLigne(c) + '</td>').join('') + '</tr>'; });
        h += '</table></div>'; continue;
      }
      const puce = /^\s*[-*]\s+/, numero = /^\s*\d+\.\s+/;
      if (puce.test(l) || numero.test(l)) {
        const motif = puce.test(l) ? puce : numero, balise = motif === puce ? 'ul' : 'ol';
        h += '<' + balise + '>';
        while (k < lignes.length && motif.test(lignes[k])) { h += '<li>' + enLigne(lignes[k].replace(motif, '')) + '</li>'; k++; }
        h += '</' + balise + '>'; continue;
      }
      const par = [];
      while (k < lignes.length && lignes[k].trim() && !/^(#{1,4}\s|\s*\||\s*[-*]\s|\s*\d+\.\s)/.test(lignes[k])) { par.push(lignes[k]); k++; }
      const texte = par.join('\n').trim();
      // Un paragraphe réduit à une seule formule est centré ; une formule au milieu d'une phrase reste dans la ligne.

// Points de contrôle : question corrigée dès le clic, non notée.
function rendreLecon(q) {
  const brut = rendre(q.contenu).replace(/<p>\[\[controle:([\w-]+)\]\]<\/p>/g, (_, cid) => '<div class="controle" data-c="' + cid + '"></div>');
  // Une partie par titre de niveau 2 ; dans chaque partie, un bloc par rubrique (problème, énoncé, preuve, exemple...).
  const source = document.createElement('div');

  const parties = [];
  Array.from(source.childNodes).forEach(n => {
    if (n.nodeName === 'H3' || !parties.length) parties.push({ titre: n.nodeName === 'H3' ? n.textContent : 'Introduction', noeuds: [] });
    parties[parties.length - 1].noeuds.push(n);
  });
  const genre = t => /preuve/i.test(t) ? 'preuve' : /pi[èe]ge/i.test(t) ? 'pieges' : /exemple|exp[ée]rience/i.test(t) ? 'exemple'
    : /[ée]nonc[ée]/i.test(t) ? 'enonce-bloc' : /intuition/i.test(t) ? 'intuition' : /probl[èe]me/i.test(t) ? 'probleme'
    : /cas limites/i.test(t) ? 'limites' : /d[ée]finition|notation|cadre|mod[èe]le/i.test(t) ? 'definitions' : '';
  const courante = Math.min((E.partie || {})[q.id] || 0, parties.length - 1);

  h += '</nav>';
  parties.forEach((p, k) => {
    h += '<section class="partie" data-partie="' + k + '"' + (k === courante ? '' : ' hidden') + '>';
    let bloc = null;
    const fermer = () => { if (bloc) { h += bloc.genre === 'question' ? ficheDebrief(bloc.titre, bloc.noeuds) : bloc.genre === 'preuve' ? '</details>' : '</div>'; bloc = null; } };
    p.noeuds.forEach(n => {
      if (bloc && bloc.genre === 'question' && n.nodeName !== 'H4' && n.nodeName !== 'H3') { bloc.noeuds.push(n); return; }
      if (n.nodeName === 'H4' && /^Question \d+/.test(n.textContent)) {
        fermer();
        bloc = { genre: 'question', titre: n.textContent, noeuds: [] };
      } else if (n.nodeName === 'H4') {
        fermer();
        const g = genre(n.textContent);
        bloc = { genre: g };
        if (g === 'preuve') h += '<details class="bloc preuve"><summary>' + esc(n.textContent) + '<span class="meta">déplier pour la lire</span></summary>';
        else h += '<div class="bloc ' + g + '"><h4>' + esc(n.textContent) + '</h4>';
      } else if (n.nodeName === 'H3') { fermer(); h += n.outerHTML; }
      else h += n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    });
    fermer();
    h += '<div class="pied-partie"><button data-aller="' + (k - 1) + '"' + (k === 0 ? ' disabled' : '') + '>Partie précédente</button>'
      + '<span class="meta">Partie ' + (k + 1) + ' sur ' + parties.length + '</span>'
      + (k < parties.length - 1 ? '<button class="principal" data-aller="' + (k + 1) + '">Partie suivante</button>' : '<span class="meta">Fin de la leçon : passe à la suite avec « Suivante ».</span>') + '</div></section>';
  });

// Une question du débrief : en-tête (numéro, titre, verdict), énoncé, réponses côte à côte, rubriques, à retenir.
function ficheDebrief(titre, noeuds) {
  const m = titre.match(/^(Question \d+)\s*:?\s*(.*)$/);
  const gras = n => n.nodeName === 'P' && n.firstChild && n.firstChild.nodeName === 'STRONG' ? n.firstChild.textContent.trim() : '';
  const reste = n => { const c = n.cloneNode(true); c.removeChild(c.firstChild); return c.innerHTML.trim(); };
  let enonce = '', ta = null, attendue = null, verdict = '', corps = '', retenir = '', revoir = '', etat = 'enonce';
  noeuds.forEach(n => {
    const g = gras(n), html = n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    if (/^Ta réponse/.test(g)) { ta = reste(n); etat = 'corps'; }
    else if (/^Réponse attendue/.test(g)) { attendue = reste(n); etat = 'corps'; }
    else if (/^Verdict/.test(g)) { verdict = reste(n); etat = 'corps'; }
    else if (/^À retenir/.test(g)) { retenir = '<h5>À retenir</h5><p>' + reste(n) + '</p>'; etat = 'retenir'; }
    else if (/^Leçon à revoir/.test(g)) { revoir = reste(n); etat = 'fin'; }
    else if (g && n.textContent.trim() === g) { corps += '<h5>' + esc(g.replace(/[.:]\s*$/, '')) + '</h5>'; etat = 'corps'; }
    else if (etat === 'enonce') enonce += n.nodeName === 'P' && /^Type :/.test(n.textContent) ? '<p class="meta">' + n.innerHTML + '</p>' : n.nodeName === 'UL' ? '<ul class="choix">' + n.innerHTML + '</ul>' : html;
    else if (etat === 'retenir') retenir += html;
    else corps += html;
  });
  const brut = verdict.replace(/<[^>]+>/g, '').trim();
  const v = /^juste/i.test(brut) ? ['v-juste', 'Juste'] : /^fausse/i.test(brut) ? ['v-fausse', 'Fausse'] : /^incompl/i.test(brut) ? ['v-incomplete', 'Incomplète']
    : /^non visible/i.test(brut) ? ['', 'Réponse non visible'] : ['', ''];
  const suite = brut.replace(/^[^.]*\.\s*/, '');
  let h = '<article class="fiche ' + v[0] + '"><header class="fiche-tete"><span class="num">' + esc(m[1]) + '</span><span class="titre">' + esc(m[2]) + '</span>'
    + (v[1] ? '<span class="verdict">' + v[1] + '</span>' : '') + '</header><div class="fiche-corps">';
  if (ta === null && attendue === null) return h + enonce + corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '') + '</div></article>';
  h += '<h5>Énoncé</h5>' + enonce;
  h += '<div class="fiche-reponses"><div><span class="lab">Ta réponse</span>' + (ta || 'non visible') + '</div><div><span class="lab">Réponse attendue</span>' + (attendue || '') + '</div></div>';
  if (suite) h += '<p class="meta">' + verdict.replace(/^[^.]*\.\s*/, '') + '</p>';
  h += corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '');
  return h + '</div></article>';
}

const EDITEURS = [];
window.EDITEURS = EDITEURS;
// Monaco annule ses tâches en cours quand on ferme un éditeur ; cette annulation n'est pas une erreur.
window.addEventListener('unhandledrejection', ev => { if (ev.reason && ev.reason.name === 'Canceled') ev.preventDefault(); });
function sombre() { return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; }
function questionCode() { const q = ITEMS[E.courant]; return E.phase === 'epreuve' && q && q.cellules_initiales ? q : null; }
function chargerMonaco() {
  if (promesseMonaco) return promesseMonaco;
  promesseMonaco = new Promise(resolve => {
    const abandon = setTimeout(() => fini(null), 20000);
    function fini(m) { clearTimeout(abandon); if (window.MODE_EDITEUR === undefined) { MONACO = m; window.MODE_EDITEUR = m ? 'monaco' : 'simple'; } resolve(MONACO); }
    const s = document.createElement('script');
    s.src = MONACO_BASE + '/vs/loader.js';
    s.onerror = () => fini(null);
    s.onload = () => {
      window.MonacoEnvironment = { getWorkerUrl: () => 'data:text/javascript;charset=utf-8,' + encodeURIComponent("self.MonacoEnvironment={baseUrl:'" + MONACO_BASE + "/'};importScripts('" + MONACO_BASE + "/vs/base/worker/workerMain.js');") };
      window.require.config({ paths: { vs: MONACO_BASE + '/vs' } });
      window.require(['vs/editor/editor.main'], () => { try { configurerMonaco(window.monaco); fini(window.monaco); } catch (e) { fini(null); } }, () => fini(null));
    };
    document.head.appendChild(s);
  });
  return promesseMonaco;
}
async function aide(type, model, position) {
  const q = questionCode();
  if (!q || !SERVEUR) return null;
  try { return await api('/api/' + type, { session: SESSION, dossier: q.dossier, code: model.getValue(), ligne: position.lineNumber, colonne: position.column - 1 }); }
  catch (e) { return null; }
}
function configurerMonaco(m) {
  const K = m.languages.CompletionItemKind;
  const genres = { module: K.Module, class: K.Class, instance: K.Variable, function: K.Function, param: K.Variable, path: K.File, keyword: K.Keyword, property: K.Property, statement: K.Variable };
  m.languages.registerCompletionItemProvider('python', {
    triggerCharacters: ['.'],
    provideCompletionItems: async (model, position) => {
      const r = await aide('completer', model, position);
      if (!r || !r.completions) return { suggestions: [] };
      const mot = model.getWordUntilPosition(position);
      const plage = new m.Range(position.lineNumber, mot.startColumn, position.lineNumber, mot.endColumn);
      return { suggestions: r.completions.map((c, k) => ({ label: c.nom, kind: genres[c.type] ?? K.Variable, insertText: c.nom, detail: c.description, range: plage, sortText: String(k).padStart(4, '0') })) };
    }
  });
  m.languages.registerSignatureHelpProvider('python', {
    signatureHelpTriggerCharacters: ['(', ','],
    provideSignatureHelp: async (model, position) => {
      const r = await aide('signatures', model, position);
      if (!r || !r.signatures || !r.signatures.length) return null;
      return { value: { signatures: r.signatures.map(x => ({ label: x.texte, documentation: x.doc, parameters: x.parametres.map(p => ({ label: p })) })), activeSignature: 0, activeParameter: r.signatures[0].index ?? 0 }, dispose() {} };
    }
  });
  m.languages.registerHoverProvider('python', {
    provideHover: async (model, position) => {
      const r = await aide('aide', model, position);
      if (!r || !r.aide || !r.aide.length) return null;
      return { contents: r.aide.map(a => ({ value: '```text\n' + a.doc + '\n```' })) };
    }
  });
}
function creerEditeur(conteneur, code, rappels) {
  if (MONACO) {
    const m = MONACO;
    const ed = m.editor.create(conteneur, {
      value: code, language: 'python', theme: sombre() ? 'vs-dark' : 'vs', fontSize: 14, tabSize: 4, insertSpaces: true,
      minimap: { enabled: false }, scrollBeyondLastLine: false, automaticLayout: true, lineNumbersMinChars: 3, folding: false,
      glyphMargin: false, renderLineHighlight: 'none', overviewRulerLanes: 0, wordBasedSuggestions: 'off', fixedOverflowWidgets: true,
      quickSuggestions: { other: true, comments: false, strings: false }, padding: { top: 6, bottom: 6 },
      scrollbar: { alwaysConsumeMouseWheel: false, vertical: 'hidden', horizontalScrollbarSize: 8 }
    });
    // Sous Windows, Monaco utilise des fins de ligne \r\n ; le code est toujours lu avec des \n, comme dans un notebook.
    const lire = () => ed.getModel().getValue(m.editor.EndOfLinePreference.LF);
    const hauteur = () => { conteneur.style.height = Math.max(38, ed.getContentHeight()) + 'px'; };
    ed.onDidContentSizeChange(hauteur); hauteur();
    ed.onDidChangeModelContent(() => rappels.modif(lire()));
    ed.onDidFocusEditorText(rappels.focus);
    ed.addCommand(m.KeyMod.Shift | m.KeyCode.Enter, rappels.executerSuivant, '!suggestWidgetVisible');
    ed.addCommand(m.KeyMod.CtrlCmd | m.KeyCode.Enter, rappels.executer, '!suggestWidgetVisible');
    return { brut: ed, getValue: lire, setValue: v => ed.setValue(v), focus: () => ed.focus(), dispose: () => ed.dispose() };
  }
  const zone = document.createElement('textarea');
  zone.spellcheck = false; zone.autocomplete = 'off'; zone.className = 'sans-math';
  zone.value = code;
  conteneur.appendChild(zone);
  zone.addEventListener('input', () => { rappels.modif(zone.value); ajuster(zone); });
  zone.addEventListener('focus', rappels.focus);
  zone.addEventListener('keydown', ev => clavier(ev, zone, rappels));
  setTimeout(() => ajuster(zone));
  return { brut: zone, getValue: () => zone.value, setValue: v => { zone.value = v; zone.dispatchEvent(new Event('input')); }, focus: () => zone.focus(), dispose: () => {} };
}
function libererEditeurs() { EDITEURS.forEach(e => e.dispose()); EDITEURS.length = 0; }

function dessinerCellules(q) {
  const conteneur = document.getElementById('cellules');
  if (!conteneur) return;
  if (SERVEUR && window.MODE_EDITEUR === undefined) {
    conteneur.innerHTML = '<p class="meta">Chargement de l\'éditeur...</p>';
    chargerMonaco().then(() => { if (questionCode() === q) dessinerCellules(q); });
    return;
  }
  libererEditeurs();
  conteneur.innerHTML = '';
  const etat = document.getElementById('modeEditeur');
  if (etat) etat.textContent = MONACO ? 'éditeur VS Code, autocomplétion' : 'éditeur simple' + (SERVEUR ? ' (Monaco injoignable)' : '');
  E.cellules[q.id].forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'cellule';
    div.innerHTML = '<div class="numero">[' + (c.numero === null ? ' ' : c.numero) + ']</div><div><div class="editeur"></div>'
      + '<div class="actions"><button data-a="executer">Exécuter</button><button data-a="dessous">Insérer dessous</button><button data-a="supprimer">Supprimer</button></div>'
      + '<pre class="sortie sans-math"></pre></div>';
    div.querySelector('pre.sortie').innerHTML = rendreSortie(c);
    conteneur.appendChild(div);
    EDITEURS.push(creerEditeur(div.querySelector('.editeur'), c.code, {
      modif: v => { c.code = v; sauver(); },
      focus: () => { conteneur.querySelectorAll('.cellule').forEach(x => x.classList.remove('active')); div.classList.add('active'); },
      executer: () => executerCellule(q, i),
      executerSuivant: () => {
        executerCellule(q, i);
        if (i === E.cellules[q.id].length - 1) { E.cellules[q.id].push({ code: '', sortie: '', numero: null }); sauver(); dessinerCellules(q); }
        focaliser(i + 1);
      }
    }));
    div.querySelector('[data-a=executer]').onclick = () => executerCellule(q, i);
    div.querySelector('[data-a=dessous]').onclick = () => { E.cellules[q.id].splice(i + 1, 0, { code: '', sortie: '', numero: null }); sauver(); dessinerCellules(q); focaliser(i + 1); };
    div.querySelector('[data-a=supprimer]').onclick = () => { if (E.cellules[q.id].length > 1) { E.cellules[q.id].splice(i, 1); sauver(); dessinerCellules(q); } };
  });
}
function majNumeros(q) { document.querySelectorAll('#cellules .numero').forEach((n, i) => { const c = E.cellules[q.id][i]; n.textContent = '[' + (c && c.numero !== null ? c.numero : ' ') + ']'; }); }
function ajuster(zone) { zone.style.height = 'auto'; zone.style.height = (zone.scrollHeight + 2) + 'px'; }
function focaliser(i) { const e = EDITEURS[i]; if (e) e.focus(); }
function inserer(zone, texte) {
  zone.focus();
  if (!document.execCommand('insertText', false, texte)) zone.setRangeText(texte, zone.selectionStart, zone.selectionEnd, 'end');
  zone.dispatchEvent(new Event('input'));
}
function clavier(ev, zone, rappels) {
  if (ev.key === 'Enter' && (ev.shiftKey || ev.ctrlKey)) {
    ev.preventDefault();
    if (ev.shiftKey) rappels.executerSuivant(); else rappels.executer();
    return;
  }
  const debut = zone.selectionStart, fin = zone.selectionEnd, v = zone.value;
  const debutLigne = v.lastIndexOf('\n', debut - 1) + 1;
  if (ev.key === 'Tab') {
    ev.preventDefault();
    const multi = v.slice(debut, fin).includes('\n');
    if (!ev.shiftKey && !multi) { inserer(zone, '    '); return; }
    const finBloc = fin;
    const bloc = v.slice(debutLigne, finBloc);
    const nouveau = ev.shiftKey ? bloc.replace(/^ {1,4}/gm, '') : bloc.replace(/^/gm, '    ');
    zone.setSelectionRange(debutLigne, finBloc);
    inserer(zone, nouveau);
    zone.setSelectionRange(debutLigne, debutLigne + nouveau.length);
    return;
  }
  if (ev.key === 'Enter' && !ev.altKey && !ev.metaKey) {
    ev.preventDefault();
    const ligne = v.slice(debutLigne, debut);
    let retrait = ligne.match(/^ */)[0];
    if (/:\s*(#.*)?$/.test(ligne)) retrait += '    ';
    inserer(zone, '\n' + retrait);
  }
}

async function executerCellule(q, i) {
  if (!SERVEUR) return false;
  const c = E.cellules[q.id][i];
  const div = document.querySelectorAll('#cellules .cellule')[i];
  if (div) { div.querySelector('.numero').textContent = '[*]'; div.querySelector('pre.sortie').innerHTML = ''; }
  let r;
  try { r = await api('/api/executer', { session: SESSION, dossier: q.dossier, code: c.code, nom: 'cellule ' + (i + 1) }); }
  catch (e) { r = { erreur: 'Serveur injoignable : lancer.py est-il démarré ?' }; }
  E.compteur = (E.compteur || 0) + 1;
  c.numero = E.compteur;
  let h = '';
  if (r.sortie) h += esc(r.sortie);
  if (r.valeur !== null && r.valeur !== undefined) h += (h && !h.endsWith('\n') ? '\n' : '') + esc(r.valeur);
  if (r.erreur) h += (h && !h.endsWith('\n') ? '\n' : '') + '<span class="erreur">' + esc(r.erreur) + '</span>';
  if (r.redemarre) { noyauxDemarres[q.id] = 'noyau redémarré : variables perdues'; const z = document.getElementById('versions'); if (z) z.textContent = noyauxDemarres[q.id]; }
  c.sortie = h;
  sauver();
  const d = document.querySelectorAll('#cellules .cellule')[i];
  if (d) { d.querySelector('.numero').textContent = '[' + c.numero + ']'; d.querySelector('pre.sortie').innerHTML = h; }
  return !r.erreur;
}

function codeSource(q) { return E.cellules[q.id].map((c, i) => '# %% cellule ' + (i + 1) + '\n' + c.code).join('\n\n') + '\n'; }
function afficherEtatSoumission(q) {
  const s = E.code[q.id] || {};
  const z = document.getElementById('etatSoumission');
  if (z) z.textContent = s.soumissions ? s.soumissions + ' soumission(s) · dernière : ' + s.caches_reussis + '/' + s.caches_total + ' tests cachés réussis' : 'jamais soumis';
}
async function lancerTests(q, mode) {
  const zone = document.getElementById('resultatsTests');
  zone.innerHTML = '<p class="meta">' + (mode === 'visibles' ? 'Tests visibles' : 'Tests cachés') + ' en cours...</p>';
  let r;
  try { r = await api('/api/tests', { session: SESSION, dossier: q.dossier, module: q.module_tests, mode }); }
  catch (e) { r = { erreur: 'Serveur injoignable : lancer.py est-il démarré ?' }; }
  if (r.erreur) { zone.innerHTML = '<pre class="sans-math"><span class="erreur">' + esc(r.erreur) + '</span></pre>'; return; }
  let h = '<p class="etiquette ' + (r.reussis === r.total ? 'bon' : 'faux') + '">' + (mode === 'visibles' ? 'Tests visibles : ' : 'Tests cachés : ') + r.reussis + '/' + r.total + ' réussis</p>';
  if (mode === 'visibles') {
    h += '<div class="defile"><table><tr><th>Test</th><th>Résultat</th><th>Attendu</th><th>Obtenu</th><th class="nombre">Durée</th></tr>';
    r.resultats.forEach(t => { h += '<tr><td>' + esc(t.nom) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec') + '</td><td><code class="sans-math">' + esc(t.attendu) + '</code></td><td><code class="sans-math">' + esc(t.obtenu ?? '') + '</code></td><td class="nombre">' + t.duree_s + ' s</td></tr>'; });
    h += '</table></div>';
    r.resultats.filter(t => t.erreur).forEach(t => { h += '<pre class="sans-math"><span class="erreur">' + esc(t.nom + ' :\n' + t.erreur) + '</span></pre>'; });
    E.code[q.id] = Object.assign(E.code[q.id] || {}, { visibles_reussis: r.reussis });
  } else {
    h += '<div class="defile"><table><tr><th>Test caché</th><th>Résultat</th></tr>';
    r.resultats.forEach((t, k) => { h += '<tr><td>Test ' + (k + 1) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec' + (t.erreur ? ' (exception ou temps dépassé)' : '')) + '</td></tr>'; });
    h += '</table></div>';
    const s = E.code[q.id] || {};
    E.code[q.id] = Object.assign(s, { soumissions: (s.soumissions || 0) + 1, caches_reussis: r.reussis, caches_total: r.total, details: r.resultats, code_source: codeSource(q) });
    afficherEtatSoumission(q);
    const p = page.querySelector('.pastille.courante'); if (p) p.classList.add('faite');
  }
  sauver();
  zone.innerHTML = h;
}

// ------------------------------------------------------------------ bilan
function points(q) {
  if (q.type === 'code') { const c = E.code[q.id]; return c && c.soumissions ? c.caches_reussis / c.caches_total : 0; }
  const r = E.reponses[q.id];
  if (r === undefined || r === 'nsp') return 0;
  // Une question à plusieurs réponses est notée tout ou rien : l'ensemble coché doit être exactement l'ensemble juste.
  const s = choisies(q), bonnes = q.options.filter(o => o.correcte).map(o => o.id);
  return s.length === bonnes.length && bonnes.every(b => s.includes(b)) ? 1 : -D.options.penalite;
}
function choisies(q) { const r = E.reponses[q.id]; return r === undefined || r === 'nsp' ? [] : Array.isArray(r) ? r.slice() : [r]; }
function texteOption(q, id) { const o = q.options.find(x => x.id === id); return o ? o.texte : null; }

function resultatJSON(duree) {
  return {
    examen: D.id, debut: new Date(E.debut).toISOString(), duree_s: Math.round(duree), pauses_s: Math.round((E.pauseTotale || 0) / 1000), options: D.options,
    lecons: ITEMS.filter(q => q.type === 'lecon').map(q => {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      return { id: q.id, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), controles_justes_du_premier_coup: justes, controles_total: ids.length };
    }),
    questions: NOTEES.map(q => {
      const base = { id: q.id, type: q.type, section: q.section, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), temps_cible_s: q.temps_cible_s, points: Number(points(q).toFixed(4)) };
      if (q.type === 'code') {
        const c = E.code[q.id] || {};
        return Object.assign(base, { soumissions: c.soumissions || 0, caches_reussis: c.caches_reussis || 0, caches_total: c.caches_total || q.tests_caches, visibles_reussis: c.visibles_reussis ?? null, code_source: c.code_source || codeSource(q) });
      }
      const r = E.reponses[q.id] ?? null;
      return Object.assign(base, { reponse: r, reponse_texte: r && r !== 'nsp' ? choisies(q).map(i => texteOption(q, i)).join(' ; ') : null, bonne_reponse_texte: q.options.filter(o => o.correcte).map(o => o.texte).join(' ; ') });
    })
  };
}

function bilan() {
  page.className = '';
  document.getElementById('position').textContent = 'Bilan';
  const duree = dureeEcoulee(E.fin);
  document.getElementById('chrono').textContent = mmss(duree);
  let total = 0;
  let h = '<div class="carte"><h2>Bilan</h2>@SCORE@<div class="defile"><table><tr><th>Section</th><th class="nombre">Score</th><th class="nombre">Temps passé</th><th class="nombre">Temps indicatif</th></tr>';
  D.sections.forEach(s => {
    const notees = s.questions.filter(q => q.type !== 'lecon');
    const pts = notees.reduce((a, q) => a + points(q), 0);
    const t = s.questions.reduce((a, q) => a + (E.temps[q.id] || 0), 0);
    total += pts;
    h += '<tr><td>' + esc(s.nom) + '</td><td class="nombre">' + (notees.length ? pts.toFixed(2).replace('.', ',') + ' / ' + notees.length : 'non notée') + '</td><td class="nombre">' + mmss(t) + '</td><td class="nombre">' + mmss(s.budget_min * 60) + '</td></tr>';
  });
  h += '<tr><th>Total</th><th class="nombre">' + total.toFixed(2).replace('.', ',') + ' / ' + NOTEES.length + '</th><th class="nombre">' + mmss(duree) + '</th><th class="nombre">' + mmss(D.duree_minutes * 60) + '</th></tr></table></div>';
  h = h.replace('@SCORE@', '<div class="score-total"><strong>' + total.toFixed(2).replace('.', ',').replace(/,00$/, '') + ' / ' + NOTEES.length + '</strong><span class="meta">en ' + mmss(duree) + '</span></div>');
  const barreFin = document.querySelector('#progression > span'); if (barreFin) barreFin.style.width = '100%';
  h += '<p id="enregistrement" class="meta"></p>';
  h += '<details><summary>Résultat brut (JSON)</summary><textarea readonly class="json sans-math" id="json"></textarea><div class="barre"><button id="telecharger">Enregistrer le fichier</button></div></details>';
  h += '<div class="barre">' + (SERVEUR ? '<button class="principal" id="retourAccueil">Retour à l\'accueil (séance suivante)</button>' : '')
    + '<button id="recommencer">Effacer et recommencer</button></div></div>';
  ITEMS.forEach((q, i) => {
    const temps = mmss(E.temps[q.id] || 0) + ' sur ' + mmss(q.temps_cible_s) + ' visés';
    const tete = (classe, verdict) => '<article class="fiche ' + classe + '"><header class="fiche-tete"><span class="num">' + (q.type === 'lecon' ? 'Leçon' : 'Question ' + (i + 1)) + '</span><span class="titre">' + esc(q.theme)
      + '</span><span class="temps">' + esc(q.nomSection) + ' · ' + temps + '</span>' + (verdict ? '<span class="verdict">' + verdict + '</span>' : '') + '</header><div class="fiche-corps">';
    if (q.type === 'lecon') {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      h += tete('', '') + '<p>Points de contrôle justes du premier coup : ' + justes + ' sur ' + ids.length + '. La leçon reste consultable depuis la séance.</p></div></article>';
      return;
    }
    if (q.type === 'qcm') {
      const r = E.reponses[q.id], juste = points(q) === 1;
      const s = choisies(q), incomplete = !juste && q.multiple && s.length > 0 && s.every(id => q.options.find(o => o.id === id).correcte);
      h += tete(juste ? 'v-juste' : incomplete ? 'v-incomplete' : r === undefined || r === 'nsp' ? '' : 'v-fausse',
        juste ? 'Juste' : r === undefined ? 'Sans réponse' : r === 'nsp' ? 'Je ne sais pas' : incomplete ? 'Incomplète' : 'Fausse');
      h += '<h5>Énoncé</h5>' + rendre(q.enonce) + '<h5>' + (q.multiple ? 'Options (plusieurs réponses, tout ou rien)' : 'Options') + '</h5>';
      E.ordre[q.id].forEach((oid, k) => {
        const o = q.options.find(x => x.id === oid), choisie = s.includes(oid);
        const puces = (o.correcte ? '<span class="puce bon">' + (q.multiple ? 'Juste' : 'Bonne réponse') + '</span>' : '') + (choisie ? '<span class="puce' + (o.correcte ? ' bon' : ' faux') + '">Ta réponse</span>' : '');
        h += '<div class="option ' + (o.correcte ? 'juste' : 'fausse') + (choisie ? ' choisie' : '') + '"><span class="lettre">' + 'ABCDE'[k] + '</span><div>' + puces + rendre(o.texte)
          + '<div class="explication">' + (o.correcte && !q.multiple ? '' : rendre(o.explication)) + '</div></div></div>';
      });
      h += '<h5>Correction</h5>' + rendre(q.solution);
    } else {
      const c = E.code[q.id] || {};
      const tout = c.soumissions && c.caches_reussis === c.caches_total;
      h += tete(tout ? 'v-juste' : c.soumissions ? 'v-incomplete' : '', c.soumissions ? c.caches_reussis + ' / ' + c.caches_total + ' tests cachés' : 'Jamais soumis');
      h += '<details><summary>Énoncé</summary>' + rendre(q.enonce) + '</details>';
      if (c.details) {
        h += '<h5>Tests cachés</h5><div class="defile"><table><tr><th>Test caché</th><th>Résultat</th><th>Attendu</th><th>Obtenu</th></tr>';
        c.details.forEach(t => { h += '<tr><td>' + esc(t.nom) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec') + '</td><td><code class="sans-math">' + esc(t.attendu) + '</code></td><td><code class="sans-math">' + esc(t.obtenu ?? (t.erreur ? 'exception' : '')) + '</code></td></tr>'; });
        h += '</table></div>';
        c.details.filter(t => t.erreur).forEach(t => { h += '<details><summary>Erreur : ' + esc(t.nom) + '</summary><pre class="sans-math">' + esc(t.erreur) + '</pre></details>'; });
      }
      h += '<details><summary>Ton code soumis</summary><pre class="sans-math"><code>' + esc(c.code_source || codeSource(q)) + '</code></pre></details>';
      h += '<details><summary>Correction</summary>' + rendre(q.solution) + '</details>';
    }
    h += '<p class="revoir">Vérification des nombres : <code class="sans-math">' + esc(q.verif.script) + '</code></p></div></article>';
  });
  page.innerHTML = h;
  const resultat = resultatJSON(duree);
  const zone = document.getElementById('json');
  zone.value = JSON.stringify(resultat, null, 1);
  document.getElementById('telecharger').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([zone.value], { type: 'application/json' }));
    a.download = D.id + '_resultat.json'; a.click();
  };
  const retour = document.getElementById('retourAccueil'); if (retour) retour.onclick = () => { location.href = '/'; };
  document.getElementById('recommencer').onclick = () => { if (confirm('Effacer ce passage ?')) { try { localStorage.removeItem(CLE); } catch (e) {} E = etatNeuf('accueil'); afficher(); } };
  const info = document.getElementById('enregistrement');
  if (E.enregistrement) info.textContent = E.enregistrement;
  else if (!SERVEUR) info.textContent = 'Page ouverte comme un fichier : le résultat n\'est pas enregistré automatiquement. Copie le JSON ci-dessous dans la conversation.';
  else {
    info.textContent = 'Enregistrement du résultat...';
    api('/api/resultat', resultat).then(r => {
      E.enregistrement = r.erreur ? null : 'Résultat enregistré dans ' + r.fichier + ' ; ' + r.erreurs_ajoutees + ' erreur(s) ajoutée(s) au journal suivi/erreurs.md.';
      info.textContent = E.enregistrement || 'Échec de l\'enregistrement : ' + r.erreur;
      sauver();
    }).catch(() => { info.textContent = 'Serveur injoignable : le résultat n\'est pas enregistré. Copie le JSON ci-dessous dans la conversation.'; });
  }
  composer();
}

function afficher() {
  libererEditeurs();
  document.getElementById('titre').textContent = D.titre;
  document.title = D.titre;
  if (E.phase === 'epreuve') epreuve(); else if (E.phase === 'bilan') bilan(); else accueil();
  window.scrollTo(0, 0);
}
function completerEtat() {
  ['reponses', 'temps', 'ordre', 'cellules', 'code', 'controles', 'ordreControles', 'vus', 'partie'].forEach(k => { if (!E[k] || typeof E[k] !== 'object') E[k] = {}; });
  if (typeof E.courant !== 'number' || E.courant < 0 || E.courant >= ITEMS.length) E.courant = 0;
  ITEMS.forEach(q => {
    if (q.cellules_initiales && !Array.isArray(E.cellules[q.id])) E.cellules[q.id] = q.cellules_initiales.map(c => ({ code: c, sortie: '', numero: null }));
    if (q.type === 'qcm') {
      const ids = q.options.map(o => o.id);
      const o = E.ordre[q.id];
      if (!Array.isArray(o) || o.length !== ids.length || !ids.every(i => o.includes(i))) E.ordre[q.id] = melanger(ids);
      const rep = E.reponses[q.id];
      if (rep !== undefined && rep !== 'nsp' && (Array.isArray(rep) !== !!q.multiple || !choisies(q).length || !choisies(q).every(i => ids.includes(i)))) delete E.reponses[q.id];
    }
    if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => {
      const cle = q.id + ':' + cid;
      if (!Array.isArray(E.ordreControles[cle])) E.ordreControles[cle] = melanger(c.options.map(o => o.id));
    });
  });
}
charger();
completerEtat();
if (SERVEUR && ITEMS.some(q => q.cellules_initiales)) chargerMonaco();
afficher();
</script>
