(j\\) indépendante du reste dans chaque ligne, \\(\\mathbf{C}\\) est indépendant de \\(\\mathbf{D}\\) et ses coordonnées sont indépendantes et de même loi. Permuter les coordonnées d'un tel vecteur, avec une permutation tirée indépendamment, ne change pas sa loi ni son indépendance avec \\(\\mathbf{D}\\) : les données permutées ont la même loi que les données d'origine. Le score après permutation a donc la même loi que le score avant, et leur différence est d'espérance nulle (le score, par exemple l'exactitude, est borné, donc intégrable).\n\n### Exemple chiffré\n\nHypothèse nulle, nœud de 100 observations, étiquettes indépendantes de loi de Bernoulli de paramètre 1/2, 4000 tirages (script) : le meilleur gain de Gini vaut en moyenne 0,0048 pour une variable binaire (valeur exacte 0,0050) et 0,0220 pour une variable continue, soit 4,6 fois plus ; la variable continue l'emporte dans une proportion 0,943 des tirages.\n\nExpérience : une variable binaire informative (la cible lui est égale avec probabilité 0,75), une variable continue de pur bruit, une variable binaire de pur bruit ; 1000 observations d'entraînement, 3000 de validation. Colonnes dans cet ordre : informative, bruit continu, bruit binaire.\n\n```python\nfrom sklearn.inspection import permutation_importance\n\nrng = np.random.default_rng(3)\nn = 4000\ninfo = rng.integers(0, 2, n)                                  # binaire, informative\ncible = np.where(rng.random(n) < 0.75, info, 1 - info)        # égale à info avec probabilité 0,75\nbruit_continu = rng.normal(size=n)                            # bruit, valeurs toutes distinctes\nbruit_binaire = rng.integers(0, 2, n)                         # bruit, deux valeurs\nXi = np.column_stack([info, bruit_continu, bruit_binaire])\nent, val = slice(0, 1000), slice(1000, n)\nfor feuille_min in [1, 50]:\n    rf = RandomForestClassifier(n_estimators=200, min_samples_leaf=feuille_min, random_state=0).fit(Xi[ent], cible[ent])\n    perm = permutation_importance(rf, Xi[val], cible[val], n_repeats=5, random_state=0)\n    print(f\"min_samples_leaf = {feuille_min}: impureté {rf.feature_importances_.round(3)}, permutation {perm.importances_mean.round(3)}\")\n\nXd = np.column_stack([info, info, bruit_continu])             # la variable informative en double\nrf = RandomForestClassifier(n_estimators=200, random_state=0).fit(Xd[ent], cible[ent])\nperm = permutation_importance(rf, Xd[val], cible[val], n_repeats=5, random_state=0)\nprint(\"informative en double : permutation\", perm.importances_mean.round(3))\n```\n\n```sortie\nmin_samples_leaf = 1: impureté [0.268 0.726 0.005], permutation [ 0.128 -0.011 -0.002]\nmin_samples_leaf = 50: impureté [0.854 0.135 0.012], permutation [0.244 0.    0.   ]\ninformative en double : permutation [0.038 0.101 0.004]\n```\n\nLecture : avec des feuilles d'une observation, l'importance par impureté place le bruit continu **devant** la variable informative ; la permutation, sur la validation, donne au bruit une importance proche de 0 (fluctuation autour de son espérance nulle, d'après (I2)), et une importance nette à la variable informative. Imposer 50 observations par feuille réduit le biais de l'importance par impureté sans l'annuler. Dernière ligne : dédoublée, la variable informative voit son importance par permutation partagée entre ses deux copies (I3).\n\n### Cas limites et pièges\n\n1. L'importance par impureté est mesurée sur l'entraînement : elle récompense l'ajustement au bruit, d'autant plus que la variable offre de coupures.\n2. Une importance par permutation peut être légèrement négative sur un jeu de validation fini : c'est une fluctuation, pas un effet.\n3. Variables liées entre elles : la permutation crée aussi des combinaisons de valeurs qui n'existent pas dans les données, et l'importance se dilue entre variables redondantes.\n4. Ajouter des arbres ne corrige pas le biais de l'importance par impureté : il est présent dans chaque arbre, et la moyenne conserve l'espérance.\n\n[[controle:importance]]\n\n## Réflexes en 30 secondes\n\n| Indice dans l'énoncé | Premier geste |\n|---|---|\n| gain d'une coupure, Gini, entropie | impureté du parent moins la moyenne **pondérée par les tailles** des impuretés des enfants ; Gini à deux classes \\(2\\hat p(1 - \\hat p)\\) |\n| bootstrap, hors sac, observations distinctes | \\((1 - 1/n)^n\\), au plus \\(1/e \\approx 0{,}368\\) ; distinctes : \\(n\\,(1 - (1 - 1/n)^n)\\) |\n| variance d'une moyenne de \\(B\\) arbres | \\(\\rho\\,\\sigma^2 + (1 - \\rho)\\,\\sigma^2/B\\) ; plancher \\(\\rho\\,\\sigma^2\\) |\n| ajouter des arbres | forêt : l'erreur quadratique espérée ne croît pas ; boosting : peut sur-apprendre, arrêt précoce |\n| pseudo-résidu | quadratique \\(y - f\\) ; logistique \\(y - \\pi\\) |\n| poids de feuille XGBoost | \\(g\\), \\(h\\) d'abord ; \\(-G/(H + \\lambda)\\) ; logistique \\(h = \\pi(1 - \\pi)\\), quadratique \\(h = 1\\) |\n| gain XGBoost | \\(\\tfrac12[\\,G_L^2/(H_L + \\lambda) + G_R^2/(H_R + \\lambda) - G^2/(H + \\lambda)\\,] - \\gamma\\) |\n| `min_child_weight` | somme des \\(h_i\\) de l'enfant, pas un nombre d'observations |\n| importance d'une variable | impureté : biaisée vers les variables à nombreuses valeurs ; permutation sur validation |\n\nContrôles de vraisemblance en 5 secondes :\n\n- un gain de Gini ou d'entropie est positif ou nul ; un gain XGBoost avec \\(\\lambda > 0\\) peut être négatif ;\n- la variance d'une moyenne d'arbres est entre \\(\\rho\\,\\sigma^2\\) et \\(\\sigma^2\\) (pour \\(\\rho \\ge 0\\)) ;\n- si les pseudo-résidus d'une feuille ont une somme positive, son poids est positif ;\n- pour \\(H > 0\\), un poids XGBoost est, en valeur absolue, au plus égal à celui sans régularisation (\\(\\lvert G \\rvert/(H + \\lambda) \\le \\lvert G \\rvert/H\\)).\n\n## À savoir refaire sans notes\n\n- (R1), (R2) et le Gini comme somme de variances d'indicatrices ; (R5), l'arbre sans limite qui atteint une erreur d'entraînement nulle.\n- \\((1 - 1/n)^n \\le 1/e\\) et sa limite ; la variance \\(\\rho\\,\\sigma^2 + (1 - \\rho)\\,\\sigma^2/B\\) par la double somme de covariances ; la décomposition de l'erreur quadratique espérée de la forêt.\n- Les pseudo-résidus quadratique et logistique, avec la dérivée \\(\\pi(1 - \\pi)\\) ; la décroissance de l'erreur d'entraînement du boosting quadratique.\n- Le poids \\(-G/(H + \\lambda)\\), la valeur optimale, le gain avec \\(\\gamma\\), et le gain positif pour \\(\\lambda = 0\\) par la mise au dénominateur commun.\n- La comparaison en cinq phrases de la partie 6.\n", "controles": {"profondeur": {"question": "On entraîne un arbre de régression sans limite de profondeur, en coupant tant qu'il existe une coupure de gain strictement positif, sur 500 observations. La première variable prend 500 valeurs deux à deux distinctes ; la cible contient un bruit de variance 1. Que vaut l'erreur quadratique moyenne de l'arbre sur ses 500 observations d'entraînement ?", "options": [{"id": "a", "texte": "0, quel que soit le bruit.", "correcte": true, "explication": "Oui : par (R5), toute feuille où \\(y\\) n'est pas constant peut encore être coupée avec un gain positif ; la croissance s'arrête sur des feuilles de \\(y\\) constant, prédit exactement. Ce zéro mesure l'ajustement au bruit, pas la qualité du modèle."}, {"id": "b", "texte": "Environ 1, la variance du bruit, qu'aucun modèle ne peut prédire.", "correcte": false, "explication": "C'est l'erreur minimale, en moyenne, sur de **nouvelles** observations. Sur l'entraînement, l'arbre apprend le bruit lui-même, valeur par valeur."}, {"id": "c", "texte": "On ne peut pas le savoir : un algorithme glouton ne garantit pas la meilleure partition.", "correcte": false, "explication": "L'algorithme glouton ne trouve pas forcément le meilleur arbre, mais il atteint des feuilles pures : (R5) garantit une coupure de gain strictement positif tant qu'une feuille est impure."}, {"id": "d", "texte": "Strictement positive, car certaines feuilles finales contiennent plusieurs observations.", "correcte": false, "explication": "Une feuille finale de plusieurs observations a forcément un \\(y\\) constant, sinon (R5) permettrait encore de la couper : sa moyenne prédit chacune exactement."}]}, "bootstrap": {"question": "On tire un échantillon bootstrap à partir de \\(n = 3\\) observations (3 tirages uniformes, indépendants, avec remise). Quelle est la probabilité qu'une observation donnée soit hors sac ?", "options": [{"id": "a", "texte": "\\(\\tfrac{8}{27}\\)", "correcte": true, "explication": "Oui : chaque tirage manque l'observation avec probabilité \\(2/3\\), et les 3 tirages sont indépendants : \\((2/3)^3\\)."}, {"id": "b", "texte": "\\(\\tfrac{19}{27}\\)", "correcte": false, "explication": "C'est la probabilité que l'observation soit tirée au moins une fois, le complémentaire de la réponse."}, {"id": "c", "texte": "\\(\\tfrac{1}{27}\\)", "correcte": false, "explication": "C'est \\((1/3)^3\\), la probabilité que l'observation soit tirée aux trois tirages, pas qu'elle soit absente."}, {"id": "d", "texte": "\\(1/e \\approx 0{,}368\\)", "correcte": false, "explication": "C'est la limite quand \\(n \\to \\infty\\). Pour tout \\(n\\) fini, \\((1 - 1/n)^n\\) est strictement plus petit que \\(1/e\\) (partie 2, preuve, étape 2)."}]}, "plancher": {"question": "Des arbres ont une variance \\(\\sigma^2 = 1\\) et une corrélation \\(\\rho = 0{,}5\\) deux à deux. Combien en faut-il au minimum pour que la variance de leur moyenne dépasse son plancher \\(\\rho\\,\\sigma^2\\) d'au plus 0,01 ?", "options": [{"id": "a", "texte": "50", "correcte": true, "explication": "Oui : l'excès est \\((1 - \\rho)\\,\\sigma^2/B = 0{,}5/B\\), au plus 0,01 si et seulement si \\(B \\ge 50\\)."}, {"id": "b", "texte": "25", "correcte": false, "explication": "C'est le résultat de \\(\\rho\\,\\sigma^2/B \\le 0{,}01\\) : la corrélation a été placée dans le terme en \\(1/B\\). Le terme qui décroît est \\((1 - \\rho)\\,\\sigma^2/B\\)."}, {"id": "c", "texte": "100", "correcte": false, "explication": "C'est le résultat de \\(\\sigma^2/B \\le 0{,}01\\), qui oublie le facteur \\(1 - \\rho\\) : seule la part non corrélée de la variance est divisée par \\(B\\)."}, {"id": "d", "texte": "Aucun nombre fini : la variance n'atteint jamais son plancher.", "correcte": false, "explication": "Elle ne l'atteint jamais, mais la question demande de s'en approcher à 0,01 près, ce qui arrive dès que \\(0{,}5/B \\le 0{,}01\\)."}]}, "residus": {"question": "Boosting de gradient avec la perte \\(\\tfrac12 (y - f)^2\\), sur trois observations de cibles \\(y = (1, 2, 6)\\). Le modèle initial \\(f_0\\) est la constante qui minimise la perte totale. Quelles cibles reçoit le premier arbre ?", "options": [{"id": "a", "texte": "(-2 ; -1 ; 3)", "correcte": true, "explication": "Oui : \\(f_0\\) est la moyenne, 3, et le pseudo-résidu de la perte quadratique est le résidu \\(y_i - f_0\\)."}, {"id": "b", "texte": "(2 ; 1 ; -3)", "correcte": false, "explication": "C'est le gradient \\(f_0 - y_i\\), pas son opposé : l'arbre doit pointer dans la direction qui fait **baisser** la perte."}, {"id": "c", "texte": "(1 ; 2 ; 6)", "correcte": false, "explication": "Ce serait le cas si \\(f_0 = 0\\). Ici \\(f_0\\) est la constante optimale, la moyenne des cibles, qu'il faut retrancher."}, {"id": "d", "texte": "(-1 ; 0 ; 4)", "correcte": false, "explication": "Ce sont les écarts à la médiane, qui est la constante optimale pour la perte absolue \\(\\lvert y - f \\rvert\\). Pour la perte quadratique, c'est la moyenne (R1)."}]}, "newton": {"question": "Pour quelle perte le poids XGBoost \\(-G/(H + \\lambda)\\) est-il le minimum exact de la perte pénalisée de la feuille, et non une approximation ?", "options": [{"id": "a", "texte": "La perte quadratique : son développement de Taylor à l'ordre 2 est exact.", "correcte": true, "explication": "Oui : sa dérivée troisième est nulle, le reste de Taylor aussi, et le critère approché est la vraie perte pénalisée (X4)."}, {"id": "b", "texte": "La perte logistique, car \\(h_i = \\pi_i(1 - \\pi_i)\\) se calcule exactement.", "correcte": false, "explication": "Calculer \\(h_i\\) exactement ne rend pas le développement exact : la perte logistique n'est pas un polynôme de degré 2 en \\(w\\). Le poids est un pas de Newton ; sur l'exemple de la leçon, 1 contre un minimum exact de 1,0426."}, {"id": "c", "texte": "Toute perte deux fois dérivable, puisque le minimum d'un polynôme du second degré se calcule exactement.", "correcte": false, "explication": "Le minimum du polynôme est exact, mais le polynôme n'est qu'une approximation de la perte, sauf quand la perte est elle-même de degré 2 en \\(w\\)."}, {"id": "d", "texte": "Aucune : la pénalité \\(\\tfrac12 \\lambda w^2\\) empêche d'atteindre le minimum.", "correcte": false, "explication": "La pénalité fait partie de la fonction minimisée ; elle n'introduit aucune approximation. Pour la perte quadratique, \\(-G/(H + \\lambda)\\) minimise exactement perte plus pénalité."}]}, "importance": {"question": "Laquelle de ces mesures est calculée sur les données d'entraînement de chaque arbre, et peut donc récompenser l'ajustement au bruit ?", "options": [{"id": "a", "texte": "L'importance par impureté (`feature_importances_` de scikit-learn).", "correcte": true, "explication": "Oui : elle additionne les gains des coupures, mesurés sur les données qui ont servi à les choisir ; tout gain est positif ou nul, même pour une variable de pur bruit (I1)."}, {"id": "b", "texte": "L'importance par permutation sur un jeu de validation.", "correcte": false, "explication": "Elle mesure la dégradation du score sur des données que le modèle n'a pas vues ; pour une variable indépendante de tout le reste, son espérance est nulle (I2)."}, {"id": "c", "texte": "L'erreur hors sac de la forêt.", "correcte": false, "explication": "Elle est calculée, pour chaque observation, par les seuls arbres qui ne l'ont pas vue : c'est une mesure hors échantillon, et ce n'est pas une importance de variable."}, {"id": "d", "texte": "Les deux importances, puisqu'elles sont calculées sur le même modèle.", "correcte": false, "explication": "Le modèle est le même, mais les données d'évaluation diffèrent : la permutation se fait sur la validation, et c'est ce qui la protège du biais d'ajustement."}]}}, "verif": {"script": "verif/seance_ml_2.py"}}]}, {"id": "mla", "nom": "Machine Learning avancé", "budget_min": 25, "questions": [{"id": "M1-01", "section": "mla", "theme": "Arbre de décision, gain de Gini", "difficulte": 2, "temps_cible_s": 90, "enonce": "Un nœud d'un arbre de classification contient 10 observations : 6 de classe 1 et 4 de classe 0. Une coupure envoie à gauche 4 observations, dont 1 de classe 1, et à droite les 6 autres, dont 5 de classe 1.\n\nL'impureté d'un nœud est l'indice de Gini, \\(1 - \\sum_c \\hat p_c^2\\), où \\(\\hat p_c\\) est la proportion de la classe \\(c\\) parmi les observations du nœud et la somme porte sur les deux classes. Le gain de la coupure est l'impureté du parent moins la moyenne des impuretés des deux enfants pondérée par leurs effectifs.\n\nQue vaut le gain, arrondi à trois décimales ?", "options": [{"id": "a", "texte": "0,163", "correcte": true, "explication": "Oui : \\(\\tfrac{12}{25} - \\tfrac{19}{60} = \\tfrac{49}{300}\\)."}, {"id": "b", "texte": "0,154", "correcte": false, "explication": "C'est le parent moins la moyenne **simple** des impuretés des enfants. Le gain pondère chaque enfant par sa part des observations, \\(4/10\\) et \\(6/10\\)."}, {"id": "c", "texte": "0,082", "correcte": false, "explication": "C'est la moitié de la bonne réponse : l'indice de Gini à deux classes a été pris égal à \\(\\hat p\\,(1 - \\hat p)\\) au lieu de \\(1 - \\hat p^2 - (1 - \\hat p)^2 = 2\\hat p\\,(1 - \\hat p)\\)."}, {"id": "d", "texte": "0,317", "correcte": false, "explication": "C'est l'impureté moyenne pondérée des enfants, \\(\\tfrac{19}{60}\\). Le gain est la **baisse** d'impureté : il faut la retrancher de l'impureté du parent."}], "solution": "Réponse : \\(\\tfrac{49}{300} \\approx 0{,}163\\).\n\nÉtape 1, parent : proportion de la classe 1 égale à \\(6/10\\), donc Gini \\(= 2 \\times 0{,}6 \\times 0{,}4 = \\tfrac{12}{25}\\) (à deux classes, \\(1 - \\hat p^2 - (1 - \\hat p)^2 = 2\\hat p\\,(1 - \\hat p)\\)).\n\nÉtape 2, enfants : à gauche, proportion \\(1/4\\), Gini \\(\\tfrac{3}{8}\\) ; à droite, proportion \\(5/6\\), Gini \\(\\tfrac{5}{18}\\).\n\nÉtape 3, moyenne pondérée : \\(\\tfrac{4}{10} \\times \\tfrac{3}{8} + \\tfrac{6}{10} \\times \\tfrac{5}{18} = \\tfrac{19}{60}\\).\n\nÉtape 4, gain : \\(\\tfrac{12}{25} - \\tfrac{19}{60} = \\tfrac{49}{300} \\approx 0{,}163\\), positif comme tout gain de Gini (leçon, partie 1, R3).", "type": "qcm", "multiple": false, "reponse": "0,163", "fiche": null, "verif": {"script": "verif/seance_ml_2.py", "cles": ["Q01_d_demi", "Q01_d_non_pondere", "Q01_droite_den", "Q01_droite_num", "Q01_enfants", "Q01_enfants_den", "Q01_enfants_num", "Q01_exact", "Q01_exact_den", "Q01_exact_num", "Q01_gauche_den", "Q01_gauche_num", "Q01_parent_den", "Q01_parent_num"]}}, {"id": "M1-02", "section": "mla", "theme": "Arbre de décision, invariance aux transformations monotones", "difficulte": 3, "temps_cible_s": 75, "enonce": "Un arbre de régression est entraîné avec une seule variable \\(x\\), dont les quatre observations d'entraînement valent −3, −1, 2 et 4, et des cibles deux à deux distinctes. On le réentraîne, avec les mêmes réglages et les mêmes cibles, après avoir remplacé \\(x\\) par l'une des transformations ci-dessous.\n\nLaquelle peut changer la partition des observations d'entraînement produite par l'arbre ?", "options": [{"id": "a", "texte": "\\(x^2\\)", "correcte": true, "explication": "Oui : \\(x^2\\) n'est pas monotone sur des valeurs de signes différents. Les carrés valent (9 ; 1 ; 4 ; 16), dans un autre ordre que les \\(x\\) ; sur les 3 partages candidats, 1 seul est commun aux deux variables."}, {"id": "b", "texte": "\\(2x + 5\\)", "correcte": false, "explication": "Fonction affine strictement croissante : même ordre, mêmes partages candidats, mêmes gains, donc même partition ; les seuils se correspondent même exactement, et les prédictions sur de nouveaux points sont identiques."}, {"id": "c", "texte": "\\(e^{x}\\)", "correcte": false, "explication": "Fonction strictement croissante : l'ordre des observations est conservé, donc la partition d'entraînement aussi (R6). Seule la prédiction d'un nouveau point situé entre deux valeurs d'entraînement qui encadrent un seuil peut changer."}, {"id": "d", "texte": "\\(x^3\\)", "correcte": false, "explication": "Le cube est strictement croissant sur tous les réels, valeurs négatives comprises : l'ordre, donc la partition, est conservé."}], "solution": "Réponse : \\(x^2\\).\n\nÉtape 1 : la partition d'un nœud ne dépend que de l'ordre des valeurs de la variable ; les partages candidats sont « les \\(k\\) plus petites valeurs d'un côté, les autres de l'autre » (leçon, partie 1, R6). Une transformation strictement croissante (ou strictement décroissante) conserve ces partages : \\(2x + 5\\), \\(e^x\\) et \\(x^3\\) ne peuvent rien changer.\n\nÉtape 2 : avec \\(x^2\\), les valeurs deviennent (9 ; 1 ; 4 ; 16). Rangées, elles placent −1 en premier, puis 2, puis −3, puis 4. Les 3 partages candidats de \\(x\\) isolent \\(\\{-3\\}\\), \\(\\{-3, -1\\}\\), \\(\\{-3, -1, 2\\}\\) ; ceux de \\(x^2\\) isolent \\(\\{-1\\}\\), \\(\\{-1, 2\\}\\), \\(\\{-1, 2, -3\\}\\). Un seul partage est commun (1 sur 3) : si le meilleur partage pour \\(x\\) était l'un des deux autres, il n'est plus disponible, et la partition change.", "type": "qcm", "multiple": false, "reponse": "\\(x^2\\)", "fiche": null, "verif": {"script": "verif/seance_ml_2.py", "cles": ["Q02_carres", "Q02_communes", "Q02_nb_coupures"]}}, {"id": "M1-03", "section": "mla", "theme": "Bagging, échantillon bootstrap", "difficulte": 3, "temps_cible_s": 90, "enonce": "On tire un échantillon bootstrap à partir de 8 observations distinctes : 8 tirages indépendants, chacun uniforme parmi les 8 observations, avec remise.\n\nQuelle est l'espérance du nombre d'observations distinctes de l'échantillon, arrondie à trois décimales ?", "options": [{"id": "a", "texte": "5,251", "correcte": true, "explication": "Oui : une indicatrice par observation, présente avec probabilité \\(1 - (7/8)^8\\), et 8 observations."}, {"id": "b", "texte": "5,057", "correcte": false, "explication": "C'est \\(8\\,(1 - 1/e)\\), avec la limite \\(1/e\\) à la place de la vraie probabilité d'absence \\((7/8)^8\\). Pour \\(n = 8\\), \\((1 - 1/n)^n\\) est strictement plus petit que \\(1/e\\), donc il y a un peu plus d'observations distinctes."}, {"id": "c", "texte": "2,749", "correcte": false, "explication": "C'est \\(8\\,(7/8)^8\\), le nombre moyen d'observations **absentes** (hors sac). Le nombre d'observations distinctes est 8 moins cette quantité."}, {"id": "d", "texte": "0,656", "correcte": false, "explication": "C'est la probabilité qu'**une** observation donnée soit présente. Il faut sommer sur les 8 observations (linéarité de l'espérance)."}], "solution": "Réponse : \\(8\\,\\big(1 - (7/8)^8\\big) \\approx 5{,}251\\).\n\nNotations : pour \\(i = 1, \\dots, 8\\), \\(I_i\\) est l'indicatrice de l'événement « l'observation \\(i\\) est tirée au moins une fois », et \\(N = I_1 + \\dots + I_8\\) le nombre d'observations distinctes.\n\nÉtape 1 : un tirage manque l'observation \\(i\\) avec probabilité \\(7/8\\) ; les 8 tirages sont indépendants, donc \\(i\\) est absente avec probabilité \\((7/8)^8 \\approx 0{,}3436\\).\n\nÉtape 2 : par linéarité de l'espérance, qui ne demande aucune indépendance entre les \\(I_i\\), \\(\\mathbb{E}[N] = 8\\,\\big(1 - (7/8)^8\\big) \\approx 5{,}251\\).\n\nSimulation (script) : 5,251.", "type": "qcm", "multiple": false, "reponse": "5,251", "fiche": null, "verif": {"script": "verif/seance_ml_2.py", "cles": ["Q03_d_lim", "Q03_d_oob", "Q03_d_un", "Q03_exact", "Q03_mc", "Q03_p_abs"]}}, {"id": "M1-04", "section": "mla", "theme": "Variance d'une moyenne d'arbres corrélés", "difficulte": 5, "temps_cible_s": 150, "enonce": "Une forêt aléatoire est formée d'arbres dont les prédictions en un point fixé, \\(T_1, T_2, \\dots\\), sont des variables aléatoires de même variance \\(\\sigma^2\\) et de même corrélation \\(\\rho\\) deux à deux ; le hasard porte sur l'échantillon d'entraînement et sur les tirages de la forêt.\n\nLa variance de la moyenne des \\(B\\) premiers arbres vaut exactement 0,5 pour \\(B = 5\\) et exactement 0,35 pour \\(B = 20\\).\n\nQue vaut \\(\\rho\\), arrondi à trois décimales ?", "options": [{"id": "a", "texte": "0,231", "correcte": true, "explication": "Oui : le plancher \\(\\rho\\,\\sigma^2\\) vaut \\(0{,}3\\), la variance d'un arbre \\(\\sigma^2 = 1{,}3\\), et leur rapport est \\(\\tfrac{3}{13}\\)."}, {"id": "b", "texte": "0,300", "correcte": false, "explication": "C'est le plancher \\(\\rho\\,\\sigma^2\\), pas \\(\\rho\\) : il faut encore le diviser par \\(\\sigma^2 = 1{,}3\\)."}, {"id": "c", "texte": "0,350", "correcte": false, "explication": "C'est la variance mesurée pour \\(B = 20\\), prise pour le plancher : elle contient encore le terme \\((1 - \\rho)\\,\\sigma^2/20\\). Et ce serait \\(\\rho\\,\\sigma^2\\), pas \\(\\rho\\)."}, {"id": "d", "texte": "0,769", "correcte": false, "explication": "C'est \\(1 - \\rho\\) : la part \\((1 - \\rho)\\,\\sigma^2 = 1\\) a été divisée par \\(\\sigma^2\\) à la place du plancher \\(\\rho\\,\\sigma^2\\)."}], "solution": "Réponse : \\(\\rho = \\tfrac{3}{13} \\approx 0{,}231\\).\n\nNotations : \\(\\bar T_B\\) est la moyenne des \\(B\\) premiers arbres ; \\(a = \\rho\\,\\sigma^2\\) et \\(b = (1 - \\rho)\\,\\sigma^2\\).\n\nÉtape 1 : \\(\\mathrm{Var}(\\bar T_B) = \\rho\\,\\sigma^2 + (1 - \\rho)\\,\\sigma^2/B = a + b/B\\) (leçon, partie 2, B2 : double somme des covariances, \\(B\\) variances et \\(B(B-1)\\) covariances égales à \\(\\rho\\,\\sigma^2\\), divisée par \\(B^2\\)).\n\nÉtape 2 : \\(a + b/5 = 0{,}5\\) et \\(a + b/20 = 0{,}35\\). Par différence, \\(b\\,(1/5 - 1/20) = 0{,}5 - 0{,}35 = 0{,}15\\), d'où \\(b = 1\\), puis \\(a = 0{,}5 - b/5 = 0{,}3\\).\n\nÉtape 3 : \\(\\sigma^2 = a + b = 1{,}3\\) et \\(\\rho = a/\\sigma^2 = \\tfrac{3}{13} \\approx 0{,}231\\).\n\nLecture : quel que soit le nombre d'arbres, la variance ne descendra pas sous \\(0{,}3\\) ; pour la baisser, il faut décorréler les arbres, pas en ajouter.", "type": "qcm", "multiple": false, "reponse": "0,231", "fiche": null, "verif": {"script": "verif/seance_ml_2.py", "cles": ["Q04_a", "Q04_b", "Q04_d_un_moins", "Q04_diff", "Q04_rho", "Q04_rho_den", "Q04_rho_num", "Q04_sigma2"]}}, {"id": "M1-05", "section": "mla", "theme": "Forêt aléatoire, erreur quadratique et nombre d'arbres", "difficulte": 4, "temps_cible_s": 100, "enonce": "En un point fixé \\(\\mathbf{x}\\), les arbres d'une forêt ont des prédictions \\(T_1, T_2, \\dots\\) de même espérance, de variance \\(\\sigma^2 = 1\\) et de corrélation \\(\\rho = 0{,}2\\) deux à deux. La cible en ce point est une variable aléatoire \\(Y\\) d'espérance \\(\\mu\\) et de variance 0,5, indépendante de l'échantillon d'entraînement et des tirages de la forêt. Le biais d'un arbre vérifie \\((\\mathbb{E}[T_1] - \\mu)^2 = 0{,}1\\).\n\nOn note \\(\\bar T_B\\) la moyenne des \\(B\\) premiers arbres. Vers quelle valeur tend \\(\\mathbb{E}\\big[(\\bar T_B - Y)^2\\big]\\) quand \\(B\\) tend vers l'infini ?", "options": [{"id": "a", "texte": "0,8", "correcte": true, "explication": "Oui : biais au carré + plancher de variance + bruit, \\(0{,}1 + 0{,}2 \\times 1 + 0{,}5\\)."}, {"id": "b", "texte": "0,6", "correcte": false, "explication": "Cela suppose que la moyenne supprime toute la variance des arbres. Elle ne supprime que la part \\((1 - \\rho)\\,\\sigma^2/B\\) ; le plancher \\(\\rho\\,\\sigma^2 = 0{,}2\\) reste."}, {"id": "c", "texte": "1,6", "correcte": false, "explication": "C'est l'erreur d'un arbre seul (\\(B = 1\\)), comme si ajouter des arbres ne changeait rien. L'erreur espérée décroît avec \\(B\\) ; avec 100 arbres elle vaut déjà 0,808."}, {"id": "d", "texte": "0,3", "correcte": false, "explication": "Il manque la variance de la cible, 0,5 : aucun modèle ne prédit le bruit de \\(Y\\), qui s'ajoute à l'erreur par indépendance."}], "solution": "Réponse : 0,8.\n\nÉtape 1, décomposition : on écrit \\(\\bar T_B - Y = (\\bar T_B - \\mathbb{E}\\bar T_B) + (\\mathbb{E}\\bar T_B - \\mu) + (\\mu - Y)\\). Les doubles produits ont une espérance nulle (termes centrés, constants, ou indépendants et centrés), donc \\(\\mathbb{E}[(\\bar T_B - Y)^2] = (\\mathbb{E}[T_1] - \\mu)^2 + \\mathrm{Var}(\\bar T_B) + \\mathrm{Var}(Y)\\), avec \\(\\mathbb{E}\\bar T_B = \\mathbb{E}[T_1]\\) par linéarité (leçon, partie 3).\n\nÉtape 2 : \\(\\mathrm{Var}(\\bar T_B) = \\rho\\,\\sigma^2 + (1 - \\rho)\\,\\sigma^2/B\\), qui tend vers \\(\\rho\\,\\sigma^2 = 0{,}2\\).\n\nÉtape 3 : la limite vaut \\(0{,}1 + 0{,}2 + 0{,}5 = 0{,}8\\). Pour \\(B = 1\\), on trouve \\(1{,}6\\), et pour \\(B = 100\\), \\(0{,}808\\) : l'erreur espérée décroît avec \\(B\\), mais vers un plancher qui contient le biais et \\(\\rho\\,\\sigma^2\\).", "type": "qcm", "multiple": false, "reponse": "0,8", "fiche": null, "verif": {"script": "verif/seance_ml_2.py", "cles": ["Q05_B1", "Q05_B100", "Q05_lim", "Q05_sans_bruit", "Q05_sans_rho"]}}, {"id": "M1-06", "section": "mla", "theme": "Forêt aléatoire contre bagging, compromis entre sigma2 et rho", "difficulte": 4, "temps_cible_s": 120, "enonce": "En un point fixé, on compare deux ensembles d'arbres dont les prédictions ont la même espérance.\n\n- Bagging : variance d'un arbre \\(\\sigma^2 = 1\\), corrélation entre deux arbres \\(\\rho = 0{,}6\\).\n- Forêt aléatoire (tirage de variables à chaque coupure) : \\(\\sigma^2 = 1{,}3\\), \\(\\rho = 0{,}3\\).\n\nLes deux ensembles comptent le même nombre d'arbres \\(B\\). Pour quelles valeurs de \\(B\\) la moyenne de la forêt a-t-elle une variance strictement plus faible que celle du bagging ?", "options": [{"id": "a", "texte": "Pour \\(B \\ge 3\\).", "correcte": true, "explication": "Oui : \\(0{,}39 + 0{,}91/B < 0{,}6 + 0{,}4/B\\) équivaut à \\(B > 2{,}429\\)."}, {"id": "b", "texte": "Pour tout \\(B \\ge 1\\).", "correcte": false, "explication": "Pour \\(B = 1\\), la forêt a la variance d'un de ses arbres, 1,3, plus grande que 1 ; pour \\(B = 2\\), \\(0{,}845\\) contre \\(0{,}8\\). Le tirage de variables ne paie qu'une fois le terme en \\(1/B\\) assez petit."}, {"id": "c", "texte": "Pour aucun \\(B\\) : chaque arbre de la forêt a une variance plus grande.", "correcte": false, "explication": "Quand \\(B\\) grandit, seule compte \\(\\rho\\,\\sigma^2\\) : \\(0{,}39\\) pour la forêt contre \\(0{,}6\\) pour le bagging. La baisse de \\(\\rho\\) l'emporte sur la hausse de \\(\\sigma^2\\)."}, {"id": "d", "texte": "Seulement à la limite, quand \\(B \\to \\infty\\).", "correcte": false, "explication": "L'inégalité est vraie dès \\(B = 3\\) : \\(0{,}693\\) pour la forêt contre \\(0{,}733\\) pour le bagging."}], "solution": "Réponse : pour \\(B \\ge 3\\).\n\nÉtape 1 : la variance de la moyenne de \\(B\\) arbres est \\(\\rho\\,\\sigma^2 + (1 - \\rho)\\,\\sigma^2/B\\) (leçon, partie 2, B2). Bagging : \\(0{,}6 + 0{,}4/B\\). Forêt : \\(0{,}39 + 0{,}91/B\\).\n\nÉtape 2 : la forêt est strictement meilleure si et seulement si \\(0{,}39 + 0{,}91/B < 0{,}6 + 0{,}4/B\\), soit \\(0{,}51/B < 0{,}21\\), soit \\(B > 0{,}51/0{,}21 \\approx 2{,}429\\).\n\nÉtape 3 : \\(B\\) est entier, donc \\(B \\ge 3\\). Contrôle : \\(B = 2\\) donne \\(0{,}845\\) contre \\(0{,}8\\), \\(B = 3\\) donne \\(0{,}693\\) contre \\(0{,}733\\).\n\nLecture : décorréler les arbres coûte en variance individuelle et rapporte sur le plancher ; la variance n'est qu'une partie de l'erreur, et le biais peut aussi monter (leçon, partie 3, expérience).", "type": "qcm", "multiple": false, "reponse": "Pour \\(B \\ge 3\\).", "fiche": null, "verif": {"script": "verif/seance_ml_2.py", "cles": ["Q06_B_min", "Q06_b_seuil", "Q06_bag_1", "Q06_bag_2", "Q06_bag_3", "Q06_bag_b", "Q06_bag_plancher", "Q06_den", "Q06_num", "Q06_rf_1", "Q06_rf_2", "Q06_rf_3", "Q06_rf_b", "Q06_rf_plancher"]}}, {"id": "M1-07", "section": "mla", "theme": "Boosting de gradient, pseudo-résidu logistique", "difficulte": 3, "temps_cible_s": 75, "enonce": "Boosting de gradient avec la perte logistique \\(\\ell(y, f) = -\\big[y \\ln \\pi + (1 - y)\\ln(1 - \\pi)\\big]\\), où \\(y \\in \\{0, 1\\}\\) est l'étiquette, \\(f\\) le score du modèle (un réel) et \\(\\pi = 1/(1 + e^{-f})\\) la probabilité prédite.\n\nUne observation d'étiquette \\(y = 0\\) a un score courant \\(f = \\ln 3\\). Quel est son pseudo-résidu, c'est-à-dire \\(-\\partial \\ell/\\partial f\\) évalué au score courant ?", "options": [{"id": "a", "texte": "-0,75", "correcte": true, "explication": "Oui : \\(\\pi = 1/(1 + 1/3) = 0{,}75\\) et le pseudo-résidu vaut \\(y - \\pi\\)."}, {"id": "b", "texte": "0,75", "correcte": false, "explication": "C'est \\(\\pi - y\\), la dérivée \\(\\partial \\ell/\\partial f\\) elle-même. Le pseudo-résidu est son opposé, la direction qui fait baisser la perte."}, {"id": "c", "texte": "-1,099", "correcte": false, "explication": "C'est \\(y - f\\), le résidu sur l'échelle des scores, qui serait le pseudo-résidu de la perte quadratique appliquée au score. Pour la perte logistique, la différence se prend sur l'échelle des probabilités : \\(y - \\pi\\)."}, {"id": "d", "texte": "0,1875", "correcte": false, "explication": "C'est \\(\\pi\\,(1 - \\pi)\\), la dérivée **seconde** de la perte, celle que XGBoost note \\(h\\)."}], "solution": "Réponse : \\(y - \\pi = -0{,}75\\).\n\nÉtape 1 : \\(\\pi = 1/(1 + e^{-\\ln 3}) = 1/(1 + 1/3) = 0{,}75\\).\n\nÉtape 2, dérivée : \\(d\\pi/df = \\pi\\,(1 - \\pi)\\), donc \\(\\partial \\ell/\\partial f = -y\\,(1 - \\pi) + (1 - y)\\,\\pi = \\pi - y\\) (leçon, partie 4, D1).\n\nÉtape 3 : pseudo-résidu \\(= -(\\pi - y) = 0 - 0{,}75 = -0{,}75\\). Il est négatif : le prochain arbre doit faire baisser le score de cette observation d'étiquette 0.", "type": "qcm", "multiple": false, "reponse": "-0,75", "fiche": null, "verif": {"script": "verif/seance_ml_2.py", "cles": ["Q07_d_score", "Q07_h", "Q07_pi", "Q07_r"]}}, {"id": "M1-08", "section": "mla", "theme": "XGBoost, poids optimal d'une feuille, perte logistique", "difficulte": 4, "temps_cible_s": 120, "enonce": "Notations. Pour une observation \\(i\\) : \\(y_i \\in \\{0, 1\\}\\) est l'étiquette et \\(\\hat y_i\\) le score courant du modèle, somme des arbres déjà construits. La perte logistique, vue comme une fonction du score \\(f\\), est \\(\\ell(y, f) = -\\big[y \\ln \\pi + (1 - y)\\ln(1 - \\pi)\\big]\\) avec \\(\\pi = 1/(1 + e^{-f})\\). On note \\(g_i\\) et \\(h_i\\) ses dérivées première et seconde par rapport au score, évaluées au score courant : \\(g_i = \\frac{\\partial \\ell}{\\partial f}(y_i, \\hat y_i)\\) et \\(h_i = \\frac{\\partial^2 \\ell}{\\partial f^2}(y_i, \\hat y_i)\\).\n\nUn nouvel arbre ajoute au score de chaque observation d'une même feuille une même constante \\(w\\), le poids de la feuille. XGBoost choisit \\(w\\) en minimisant, sur les observations \\(i\\) de la feuille, \\(\\sum_i \\big[g_i\\,w + \\tfrac12 h_i\\,w^2\\big] + \\tfrac12 \\lambda\\,w^2\\), où \\(\\lambda \\ge 0\\) est le coefficient de régularisation.\n\nUne feuille contient 5 observations, d'étiquettes 1, 1, 1, 1 et 0, toutes de score courant \\(\\hat y_i = 0\\). On prend \\(\\lambda = 0{,}5\\). Que vaut le \\(w\\) optimal, arrondi à trois décimales ?", "options": [{"id": "a", "texte": "0,857", "correcte": true, "explication": "Oui : \\(G = -1{,}5\\), \\(H = 1{,}25\\) et \\(w = -G/(H + \\lambda)\\)."}, {"id": "b", "texte": "1,200", "correcte": false, "explication": "C'est \\(-G/H\\), sans la régularisation : \\(\\lambda = 0{,}5\\) s'ajoute au dénominateur et rétrécit le poids vers 0."}, {"id": "c", "texte": "0,273", "correcte": false, "explication": "C'est \\(-G/(5 + \\lambda)\\), avec \\(h_i = 1\\) comme pour la perte quadratique. Pour la perte logistique, \\(h_i = \\pi_i\\,(1 - \\pi_i) = 1/4\\) ici."}, {"id": "d", "texte": "0,300", "correcte": false, "explication": "C'est la moyenne des pseudo-résidus \\(y_i - \\pi_i\\), le poids d'un boosting qui ajusterait les probabilités par moindres carrés. XGBoost divise la somme par \\(H + \\lambda\\), pas par le nombre d'observations."}], "solution": "Réponse : \\(w = \\tfrac{6}{7} \\approx 0{,}857\\).\n\nNotations : \\(G\\) et \\(H\\) sont les sommes des \\(g_i\\) et des \\(h_i\\) sur les observations de la feuille.\n\nÉtape 1, forme du poids optimal : le critère s'écrit \\(G\\,w + \\tfrac12 (H + \\lambda)\\,w^2\\), polynôme du second degré strictement convexe dès que \\(H + \\lambda > 0\\) ; sa dérivée \\(G + (H + \\lambda)\\,w\\) s'annule en \\(w = -G/(H + \\lambda)\\) (leçon, partie 5, X1).\n\nÉtape 2, dérivées de la perte logistique : \\(g_i = \\pi_i - y_i\\) et \\(h_i = \\pi_i\\,(1 - \\pi_i)\\), car \\(d\\pi/df = \\pi\\,(1 - \\pi)\\) (leçon, partie 4, D1).\n\nÉtape 3 : score courant nul, donc \\(\\pi_i = 1/2\\) pour toutes les observations. \\(g_i = -1/2\\) pour les quatre étiquettes 1 et \\(+1/2\\) pour l'étiquette 0 : \\(G = -1{,}5\\). \\(h_i = 1/4\\) pour toutes : \\(H = 1{,}25\\).\n\nÉtape 4 : \\(w = -(-1{,}5)/(1{,}25 + 0{,}5) = \\tfrac{6}{7} \\approx 0{,}857\\). Le poids est positif : une feuille dominée par des étiquettes 1 voit son score augmenter.\n\nRemarque : pour la perte logistique, ce poids est un pas de Newton sur la perte pénalisée de la feuille, pas son minimum exact (leçon, partie 5, X5).", "type": "qcm", "multiple": false, "reponse": "0,857", "fiche": null, "verif": {"script": "verif/seance_ml_2.py", "cles": ["Q08_G", "Q08_H", "Q08_d_h_un", "Q08_d_moyenne", "Q08_d_sans_lambda", "Q08_exact", "Q08_exact_den", "Q08_exact_num"]}}, {"id": "M1-09", "section": "mla", "theme": "XGBoost, gain d'une coupure avec lambda et gamma", "difficulte": 4, "temps_cible_s": 150, "enonce": "XGBoost avec la perte quadratique \\(\\ell(y, f) = \\tfrac12 (y - f)^2\\). Pour chaque observation \\(i\\), de cible \\(y_i\\) et de prédiction courante \\(\\hat y_i\\), on note \\(g_i = \\hat y_i - y_i\\) et \\(h_i = 1\\) les dérivées première et seconde de la perte par rapport à la prédiction ; pour un ensemble \\(S\\) d'observations, \\(G_S\\) et \\(H_S\\) sont les sommes des \\(g_i\\) et des \\(h_i\\) sur \\(S\\).\n\nLe critère d'un arbre est \\(\\sum_{\\text{feuilles } S} \\big[G_S\\,w_S + \\tfrac12 (H_S + \\lambda)\\,w_S^2\\big] + \\gamma \\times (\\text{nombre de feuilles})\\), où \\(w_S\\) est le poids de la feuille \\(S\\) ; pour une structure d'arbre donnée, on le minimise en les poids. Le gain d'une coupure est la baisse de ce minimum quand on coupe une feuille en deux.\n\nUne feuille contient 5 observations dont les résidus \\(y_i - \\hat y_i\\) valent 2, 2, 3, −1 et −2. On envisage la coupure qui sépare les trois premières des deux dernières. Avec \\(\\lambda = 1\\) et \\(\\gamma = 1\\), que vaut le gain, arrondi à trois décimales ?", "options": [{"id": "a", "texte": "5,292", "correcte": true, "explication": "Oui : \\(\\tfrac12\\big[12{,}25 + 3 - 2{,}6667\\big] - 1\\)."}, {"id": "b", "texte": "11,583", "correcte": false, "explication": "Le facteur \\(\\tfrac12\\) a été oublié : la valeur minimale d'une feuille est \\(-\\tfrac12 G^2/(H + \\lambda)\\), pas \\(-G^2/(H + \\lambda)\\)."}, {"id": "c", "texte": "7,817", "correcte": false, "explication": "C'est le gain calculé avec \\(\\lambda = 0\\) dans les dénominateurs. Ici \\(\\lambda = 1\\) s'ajoute à chaque \\(H\\)."}, {"id": "d", "texte": "6,292", "correcte": false, "explication": "Il manque \\(-\\gamma\\) : la coupure crée une feuille de plus, qui coûte \\(\\gamma = 1\\)."}], "solution": "Réponse : \\(5{,}292\\), à trois décimales ; la coupure améliore le critère.\n\nÉtape 1, valeur minimale d'une feuille : \\(G\\,w + \\tfrac12 (H + \\lambda)\\,w^2\\) est minimal en \\(w = -G/(H + \\lambda)\\) et vaut alors \\(-\\tfrac12 G^2/(H + \\lambda)\\) (leçon, partie 5, X1).\n\nÉtape 2, gain : avant la coupure, la feuille contribue \\(-\\tfrac12 G^2/(H + \\lambda) + \\gamma\\) ; après, \\(-\\tfrac12 G_L^2/(H_L + \\lambda) - \\tfrac12 G_R^2/(H_R + \\lambda) + 2\\gamma\\). La baisse vaut \\(\\tfrac12\\big[\\tfrac{G_L^2}{H_L + \\lambda} + \\tfrac{G_R^2}{H_R + \\lambda} - \\tfrac{G^2}{H + \\lambda}\\big] - \\gamma\\), avec \\(G = G_L + G_R\\) et \\(H = H_L + H_R\\).\n\nÉtape 3, sommes : \\(g_i\\) est l'opposé du résidu. Gauche : \\(G_L = -7\\), \\(H_L = 3\\). Droite : \\(G_R = 3\\), \\(H_R = 2\\). Feuille entière : \\(G = -4\\), \\(H = 5\\).\n\nÉtape 4 : \\(\\tfrac{G_L^2}{H_L + 1} = 12{,}25\\), \\(\\tfrac{G_R^2}{H_R + 1} = 3\\), \\(\\tfrac{G^2}{H + 1} = \\tfrac{8}{3} \\approx 2{,}6667\\) ; gain \\(= \\tfrac12\\big[12{,}25 + 3 - 2{,}6667\\big] - 1 \\approx 5{,}2917\\).\n\nPour aller plus loin : les poids des deux nouvelles feuilles valent \\(w_L = 1{,}75\\) et \\(w_R = -1\\).", "type": "qcm", "multiple": false, "reponse": "5,292", "fiche": null, "verif": {"script": "verif/seance_ml_2.py", "cles": ["Q09_G", "Q09_GL", "Q09_GR", "Q09_HL", "Q09_HR", "Q09_d_sans_demi", "Q09_d_sans_gamma", "Q09_d_sans_lambda", "Q09_exact", "Q09_sL", "Q09_sP", "Q09_sP_den", "Q09_sP_num", "Q09_sR", "Q09_wL", "Q09_wR"]}}, {"id": "M1-10", "section": "mla", "theme": "XGBoost, min_child_weight et perte logistique", "difficulte": 3, "temps_cible_s": 75, "enonce": "XGBoost avec la perte logistique et le réglage `min_child_weight` égal à 1 : une coupure est refusée si, dans l'un des deux enfants, la somme des \\(h_i\\) est strictement inférieure à 1. Ici \\(h_i = \\pi_i\\,(1 - \\pi_i)\\) est la dérivée seconde de la perte logistique par rapport au score, \\(\\pi_i\\) étant la probabilité prédite pour l'observation \\(i\\).\n\nToutes les observations d'un enfant envisagé ont la même probabilité prédite, 0,8. Combien d'observations doit-il contenir au minimum pour que la coupure ne soit pas refusée pour cette raison ?", "options": [{"id": "a", "texte": "7", "correcte": true, "explication": "Oui : \\(h = 0{,}8 \\times 0{,}2 = 0{,}16\\), et \\(n \\times 0{,}16 \\ge 1\\) exige \\(n \\ge 6{,}25\\)."}, {"id": "b", "texte": "4", "correcte": false, "explication": "C'est le minimum quand \\(\\pi = 1/2\\), où \\(h\\) atteint son maximum \\(1/4\\). Avec \\(\\pi = 0{,}8\\), \\(h\\) est plus petit et il faut plus d'observations."}, {"id": "c", "texte": "5", "correcte": false, "explication": "C'est \\(1/(1 - \\pi)\\) : \\(h\\) a été pris égal à \\(1 - \\pi\\). La dérivée seconde de la perte logistique est \\(\\pi\\,(1 - \\pi)\\)."}, {"id": "d", "texte": "1", "correcte": false, "explication": "C'est la lecture de `min_child_weight` comme un nombre d'observations, valable seulement pour la perte quadratique, où \\(h_i = 1\\). Ici chaque observation ne pèse que \\(h = 0{,}16\\)."}], "solution": "Réponse : 7 observations.\n\nÉtape 1 : \\(h = \\pi\\,(1 - \\pi) = 0{,}8 \\times 0{,}2 = 0{,}16\\) pour chaque observation (leçon, partie 4, D1 : dérivée seconde de la perte logistique).\n\nÉtape 2 : avec \\(n\\) observations, la somme vaut \\(n \\times 0{,}16\\), au moins 1 si et seulement si \\(n \\ge 1/0{,}16 = 6{,}25\\).\n\nÉtape 3 : \\(n\\) est entier, donc \\(n \\ge 7\\). Plus le modèle est confiant (\\(\\pi\\) proche de 0 ou de 1), plus il faut d'observations pour couper.", "type": "qcm", "multiple": false, "reponse": "7", "fiche": null, "verif": {"script": "verif/seance_ml_2.py", "cles": ["Q10_d_inv_un_moins", "Q10_d_max", "Q10_exact", "Q10_h", "Q10_inv"]}}, {"id": "M1-11", "section": "mla", "theme": "Comparer forêt aléatoire et XGBoost", "difficulte": 3, "temps_cible_s": 90, "enonce": "On hésite entre une forêt aléatoire et XGBoost pour une régression évaluée par l'erreur quadratique. Laquelle de ces affirmations est vraie ?", "options": [{"id": "a", "texte": "Ajouter des arbres à la forêt ne peut pas augmenter son erreur quadratique de test espérée, alors que l'erreur de test de XGBoost peut augmenter avec le nombre d'arbres, qui se règle par arrêt précoce sur un jeu de validation.", "correcte": true, "explication": "Oui : pour la forêt, seul le terme \\((1 - \\rho)\\,\\sigma^2/B\\) de l'erreur espérée dépend de \\(B\\), et il décroît. Pour le boosting, l'erreur d'entraînement tend vers 0 quand les arbres isolent chaque observation, bruit compris : avec un taux d'apprentissage de 0,1, elle passe sous 1 % de sa valeur initiale après 22 arbres."}, {"id": "b", "texte": "La forêt réduit surtout le biais d'arbres peu profonds, et XGBoost surtout la variance d'arbres profonds.", "correcte": false, "explication": "C'est l'inverse. La moyenne d'une forêt garde l'espérance d'un arbre, donc son biais, et réduit la variance d'arbres profonds ; le boosting corrige pas à pas le biais d'arbres peu profonds."}, {"id": "c", "texte": "XGBoost construit ses arbres indépendamment les uns des autres, en parallèle, alors que la forêt les construit l'un après l'autre.", "correcte": false, "explication": "C'est l'inverse. Les arbres d'une forêt sont indépendants sachant les données ; l'arbre \\(m\\) d'un boosting est ajusté aux pseudo-résidus du modèle \\(f_{m-1}\\), donc après lui. XGBoost parallélise la recherche des coupures à l'intérieur d'un arbre, pas la suite des arbres."}, {"id": "d", "texte": "Les deux méthodes moyennent des arbres : pour chacune, l'erreur de test espérée décroît avec le nombre d'arbres.", "correcte": false, "explication": "Le boosting ne moyenne pas : il additionne des corrections successives, et l'erreur de test peut remonter après un minimum (leçon, partie 4, expérience)."}], "solution": "Réponse : la forêt ne peut pas voir son erreur quadratique de test espérée augmenter avec le nombre d'arbres ; XGBoost, si.\n\nÉtape 1, forêt : en un point, \\(\\mathbb{E}[(\\bar T_B - Y)^2] = (\\mathbb{E}[T_1] - \\mu)^2 + \\rho\\,\\sigma^2 + (1 - \\rho)\\,\\sigma^2/B + \\mathrm{Var}(Y)\\), dont seul le terme en \\(1/B\\) dépend de \\(B\\) (leçon, partie 3). C'est une affirmation sur l'espérance : une courbe d'erreur réalisée peut fluctuer.\n\nÉtape 2, boosting : avec la perte quadratique, chaque arbre multiplie la somme des carrés des résidus d'entraînement par \\((1 - \\eta)^2\\) quand il isole chaque observation (leçon, partie 4, D3) ; le modèle finit par reproduire le bruit, et l'erreur de test, après un minimum, remonte (expérience de la leçon). D'où l'arrêt précoce.\n\nÉtape 3, les autres options inversent les rôles : forêt = moyenne, variance, parallèle ; boosting = somme séquentielle, biais.", "type": "qcm", "multiple": false, "reponse": "Ajouter des arbres à la forêt ne peut pas augmenter son erreur quadratique de test espérée, alors que l'erreur de test de XGBoost peut augmenter avec le nombre d'arbres, qui se règle par arrêt précoce sur un jeu de validation.", "fiche": null, "verif": {"script": "verif/seance_ml_2.py", "cles": ["D_m_1pct"]}}, {"id": "M1-12", "section": "mla", "theme": "Importance des variables, impureté contre permutation", "difficulte": 3, "temps_cible_s": 90, "enonce": "Une forêt aléatoire de classification, aux feuilles d'une observation, est entraînée sur 1000 observations avec trois variables : une variable binaire très informative, un identifiant client tiré au hasard (une valeur différente par observation, indépendante de la cible et des autres variables) et une variable binaire de bruit. L'importance par impureté (`feature_importances_` de scikit-learn) vaut 0,75 pour l'identifiant et 0,23 pour la variable informative.\n\nQue faut-il en conclure ?", "options": [{"id": "a", "texte": "Rien sur l'utilité de l'identifiant : l'importance par impureté est mesurée sur les données d'entraînement et favorise les variables qui offrent de nombreuses coupures ; il faut mesurer l'importance par permutation sur un jeu de validation.", "correcte": true, "explication": "Oui : sous l'hypothèse nulle, avec 100 observations, le meilleur gain de Gini d'une variable continue vaut en moyenne 4,6 fois celui d'une variable binaire (leçon, partie 7). Sur la validation, l'importance par permutation de l'identifiant est d'espérance nulle (I2)."}, {"id": "b", "texte": "L'identifiant est la variable la plus utile : on peut retirer la variable informative sans perte.", "correcte": false, "explication": "L'identifiant n'a aucun lien avec la cible : ses coupures n'apprennent que le bruit de l'échantillon d'entraînement, et ne servent à rien sur de nouvelles données."}, {"id": "c", "texte": "L'importance par permutation aurait le même biais, puisqu'elle est calculée avec le même modèle.", "correcte": false, "explication": "Le modèle est le même, mais la permutation se mesure sur des données que le modèle n'a pas vues. Pour une variable indépendante de la cible et des autres variables, permuter ne change pas la loi des données de validation : l'importance est d'espérance nulle (leçon, partie 7, I2)."}, {"id": "d", "texte": "Augmenter le nombre d'arbres ferait disparaître le biais.", "correcte": false, "explication": "Le biais est présent dans chaque arbre, dont les gains sont mesurés sur ses propres données d'entraînement ; la moyenne sur les arbres conserve l'espérance, donc le biais."}], "solution": "Réponse : on ne peut rien conclure de l'importance par impureté sur l'utilité de l'identifiant ; il faut l'importance par permutation sur un jeu de validation.\n\nÉtape 1 : l'importance par impureté additionne des gains de coupures mesurés sur les données qui ont servi à choisir ces coupures. Tout gain est positif ou nul (leçon, partie 1, R2 à R4) : une variable de bruit utilisée pour couper accumule une importance positive.\n\nÉtape 2 : une variable aux valeurs toutes distinctes offre une coupure candidate par valeur, contre une seule pour une variable binaire. Sous l'hypothèse nulle, son meilleur gain est en espérance au moins celui de la variable binaire (leçon, partie 7, I1) ; avec 100 observations, 0,0220 contre 0,0048 en moyenne (script). Avec des feuilles d'une observation, l'arbre coupe sur l'identifiant jusqu'à isoler chaque observation.\n\nÉtape 3 : l'importance par permutation compare le score de v <script>
'use strict';
const D = JSON.parse(document.getElementById('donnees').textContent);
const ITEMS = D.sections.flatMap(s => s.questions.map(q => Object.assign({ nomSection: s.nom }, q)));
const CLE = 'atelier-quant:' + D.id;
const SERVEUR = location.protocol.startsWith('http');
// La session survit à un rechargement de l'onglet : on se reconnecte alors au même noyau, variables comprises.
const SESSION = (() => { const neuve = Math.random().toString(36).slice(2) + Date.now().toString(36); try { const s = sessionStorage.getItem('atelier-quant:session') || neuve; sessionStorage.setItem('atelier-quant:session', s); return s; } catch (e) { return neuve; } })();
const page = document.getElementById('page');
const noyauxDemarres = {};
let E = etatNeuf('accueil');

function etatNeuf(phase) { return { phase, courant: 0, debut: null, fin: null, reponses: {}, temps: {}, ordre: {}, cellules: {}, code: {}, controles: {}, ordreControles: {}, vus: {}, partie: {}, enregistrement: null, pauseDepuis: null, pauseTotale: 0 }; }
// Options par défaut : la pause et « Je ne sais pas » sont permis, sauf si l'examen les interdit (examens blancs).
const PAUSE_PERMISE = D.options.pause !== false;
const NSP_PERMIS = D.options.je_ne_sais_pas !== false;
function dureeEcoulee(fin) { return (fin - E.debut - (E.pauseTotale || 0) - (E.pauseDepuis ? fin - E.pauseDepuis : 0)) / 1000; }
const NOTEES = ITEMS.filter(q => q.type !== 'lecon');
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(E)); } catch (e) {} }
function charger() { try { const s = localStorage.getItem(CLE); if (s) E = Object.assign(etatNeuf('accueil'), JSON.parse(s)); } catch (e) {} }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function enLigne(t) { return esc(t).replace(/`([^`]+)`/g, '<code class="sans-math">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

// Markdown réduit : titres #, tableaux |, listes - et 1., paragraphes, `code`, **gras**, blocs entre triples accents graves.
function rendre(t) {
  let h = '';
  String(t).split('```').forEach((bloc, i) => {
    if (i % 2) {
      const info = (bloc.match(/^(\w*)\n/) || [])[1];
      h += '<pre class="sans-math' + (info === 'sortie' ? ' sortie-lecon' : '') + '"><code>' + esc(bloc.replace(/^\w*\n/, '')) + '</code></pre>';
      return;
    }
    const lignes = bloc.split('\n');
    let k = 0;
    while (k < lignes.length) {
      const l = lignes[k];
      if (!l.trim()) { k++; continue; }
      const titre = l.match(/^(#{1,4})\s+(.*)$/);
      if (titre) { const n = Math.min(4, titre[1].length + 1); h += '<h' + n + '>' + enLigne(titre[2]) + '</h' + n + '>'; k++; continue; }
      if (l.trim().startsWith('|')) {
        const rangs = [];
        while (k < lignes.length && lignes[k].trim().startsWith('|')) { rangs.push(lignes[k].trim()); k++; }
        const cellules = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
        h += '<div class="defile"><table><tr>' + cellules(rangs[0]).map(c => '<th>' + enLigne(c) + '</th>').join('') + '</tr>';
        rangs.slice(1).filter(r => !/^\|[\s|:-]+\|$/.test(r)).forEach(r => { h += '<tr>' + cellules(r).map(c => '<td>' + enLigne(c) + '</td>').join('') + '</tr>'; });
        h += '</table></div>'; continue;
      }
      const puce = /^\s*[-*]\s+/, numero = /^\s*\d+\.\s+/;
      if (puce.test(l) || numero.test(l)) {
        const motif = puce.test(l) ? puce : numero, balise = motif === puce ? 'ul' : 'ol';
        h += '<' + balise + '>';
        while (k < lignes.length && motif.test(lignes[k])) { h += '<li>' + enLigne(lignes[k].replace(motif, '')) + '</li>'; k++; }
        h += '</' + balise + '>'; continue;
      }
      const par = [];
      while (k < lignes.length && lignes[k].trim() && !/^(#{1,4}\s|\s*\||\s*[-*]\s|\s*\d+\.\s)/.test(lignes[k])) { par.push(lignes[k]); k++; }
      const texte = par.join('\n').trim();
      // Un paragraphe réduit à une seule formule est centré ; une formule au milieu d'une phrase reste dans la ligne.
      const seule = texte.startsWith('\\(') && texte.endsWith('\\)') && texte.indexOf('\\(', 2) < 0;
      h += (seule ? '<p class="formule">' : '<p>') + enLigne(par.join('\n')) + '</p>';
    }
  });
  return h;
}
function composer(el) { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el || page]).catch(() => {}); }
function mmss(s) { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function melanger(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function api(chemin, corps) {
  const r = await fetch(chemin, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
  return r.json();
}

let dernierTic = null;
function tic() {
  const ch = document.getElementById('chrono');
  const bouton = document.getElementById('pause');
  bouton.hidden = !(PAUSE_PERMISE && E.phase === 'epreuve');
  document.getElementById('recommencerHaut').hidden = E.phase !== 'epreuve';
  document.getElementById('voile').hidden = !(E.phase === 'epreuve' && E.pauseDepuis);
  if (E.phase !== 'epreuve' || E.pauseDepuis) { dernierTic = null; return; }
  const maintenant = Date.now();
  if (dernierTic !== null) { const q = ITEMS[E.courant]; E.temps[q.id] = (E.temps[q.id] || 0) + (maintenant - dernierTic) / 1000; }
  dernierTic = maintenant;
  const reste = D.duree_minutes * 60 - dureeEcoulee(maintenant);
  ch.textContent = (reste < 0 ? '+' : '') + mmss(Math.abs(reste));
  ch.classList.toggle('depasse', reste < 0);
}
setInterval(() => { tic(); if (E.phase === 'epreuve') sauver(); }, 500);
if (SERVEUR) document.getElementById('lienAccueil').hidden = false;
document.getElementById('lienAccueil').onclick = () => {
  if (E.phase === 'epreuve' && PAUSE_PERMISE && !E.pauseDepuis) { tic(); E.pauseDepuis = Date.now(); sauver(); }
};
document.getElementById('recommencerHaut').onclick = () => {
  if (!confirm('Effacer ce passage (réponses, code, chronomètre) et revenir au début de la séance ?')) return;
  try { localStorage.removeItem(CLE); } catch (e) {}
  E = etatNeuf('accueil'); dernierTic = null; afficher();
};
document.getElementById('pause').onclick = () => { tic(); E.pauseDepuis = Date.now(); sauver(); tic(); };
document.getElementById('reprendre').onclick = () => {
  if (E.pauseDepuis) { E.pauseTotale = (E.pauseTotale || 0) + (Date.now() - E.pauseDepuis); E.pauseDepuis = null; }
  dernierTic = null; sauver(); tic();
};

// ------------------------------------------------------------------ accueil
function accueil() {
  page.className = '';
  document.getElementById('position').textContent = '';
  document.getElementById('chrono').textContent = mmss(D.duree_minutes * 60);

// ------------------------------------------------------------------ épreuve
function pastilles() {
  const faite = it => it.type === 'lecon' ? !!E.vus[it.id] : it.type === 'code' ? (E.code[it.id] || {}).soumissions > 0 : E.reponses[it.id] !== undefined;
  const barre = document.querySelector('#progression > span');
  if (barre) barre.style.width = (100 * ITEMS.filter(faite).length / ITEMS.length) + '%';
  let h = '<div class="cadre"><aside class="plan"><div id="pastilles">', section = null, n = 0;
  ITEMS.forEach((it, i) => {
    if (it.nomSection !== section) { section = it.nomSection; h += '<div class="groupe">' + esc(section) + '</div>'; }
    const libelle = it.type === 'lecon' ? 'Leçon' : 'Question ' + (++n);
    h += '<button class="pastille' + (faite(it) ? ' faite' : '') + (i === E.courant ? ' courante' : '') + '" data-i="' + i + '" title="' + esc(it.theme) + '"' + (D.options.retour_arriere || i === E.courant ? '' : ' disabled') + '><span class="etat"></span><span class="libelle">' + libelle + '</span></button>';
  });
  return h + '</div></aside><div class="contenu">';
}
const FIN_CADRE = '</div></div>';
function navigation() {
  let h = '<div class="barre navigation">';
  if (D.options.retour_arriere) h += '<button id="prec"' + (E.courant === 0 ? ' disabled' : '') + '>Précédente</button>';
  if (E.courant < ITEMS.length - 1) h += '<button class="principal" id="suiv">Suivante</button>';
  return h + '<button id="finir">Terminer et corriger</button></div>';
}
function brancherNavigation() {
  const aller = i => { tic(); E.courant = i; sauver(); afficher(); };
  page.querySelectorAll('.pastille').forEach(b => b.onclick = () => aller(Number(b.dataset.i)));
  const p = document.getElementById('prec'); if (p) p.onclick = () => aller(E.courant - 1);
  const s = document.getElementById('suiv'); if (s) s.onclick = () => aller(E.courant + 1);
  document.getElementById('finir').onclick = () => {
    const manquantes = NOTEES.filter(it => it.type === 'code' ? !((E.code[it.id] || {}).soumissions > 0) : E.reponses[it.id] === undefined).length;
    if (manquantes && !confirm(manquantes + ' question(s) sans réponse ou jamais soumise(s). Terminer quand même ?')) return;
    tic();
    if (E.pauseDepuis) { E.pauseTotale = (E.pauseTotale || 0) + (Date.now() - E.pauseDepuis); E.pauseDepuis = null; }
    E.phase = 'bilan'; E.fin = Date.now(); sauver(); afficher();
  };
}

function epreuve() {
  tic();
  const q = ITEMS[E.courant];
  document.getElementById('position').textContent = q.nomSection + (q.type === 'lecon' ? ' · étape ' : ' · question ') + (E.courant + 1) + ' sur ' + ITEMS.length;
  if (q.type === 'lecon') E.vus[q.id] = true;

  h += '<p class="consigne">' + (q.multiple ? 'Une ou plusieurs réponses : coche toutes les affirmations justes, et seulement elles (notation tout ou rien).' : 'Une seule réponse.') + '</p>';
  E.ordre[q.id].forEach((oid, k) => {
    const o = q.options.find(x => x.id === oid);
    h += '<div class="option' + (choisies(q).includes(oid) ? ' choisie' : '') + '" data-o="' + oid + '"><span class="lettre' + (q.multiple ? ' carre' : '') + '">' + 'ABCDE'[k] + '</span><div>' + rendre(o.texte) + '</div></div>';
  });
  if (NSP_PERMIS) h += '<div class="option' + (E.reponses[q.id] === 'nsp' ? ' choisie' : '') + '" data-o="nsp"><span class="lettre">?</span><div><p>Je ne sais pas (compte comme faux, mais évite qu\'un hasard heureux masque une lacune)</p></div></div>';
  page.innerHTML = h + navigation() + '</div>' + FIN_CADRE;
  page.querySelectorAll('.option').forEach(el => el.onclick = () => {
    const o = el.dataset.o;

      const s = choisies(q), k = s.indexOf(o);
      if (k >= 0) s.splice(k, 1); else s.push(o);

    } else if (E.reponses[q.id] === o) delete E.reponses[q.id]; else E.reponses[q.id] = o;

// Points de contrôle : question corrigée dès le clic, non notée.
function rendreLecon(q) {
  const brut = rendre(q.contenu).replace(/<p>\[\[controle:([\w-]+)\]\]<\/p>/g, (_, cid) => '<div class="controle" data-c="' + cid + '"></div>');
  // Une partie par titre de niveau 2 ; dans chaque partie, un bloc par rubrique (problème, énoncé, preuve, exemple...).
  const source = document.createElement('div');
  source.innerHTML = brut;
  const parties = [];
  Array.from(source.childNodes).forEach(n => {
    if (n.nodeName === 'H3' || !parties.length) parties.push({ titre: n.nodeName === 'H3' ? n.textContent : 'Introduction', noeuds: [] });
    parties[parties.length - 1].noeuds.push(n);
  });
  const genre = t => /preuve/i.test(t) ? 'preuve' : /pi[èe]ge/i.test(t) ? 'pieges' : /exemple|exp[ée]rience/i.test(t) ? 'exemple'
    : /[ée]nonc[ée]/i.test(t) ? 'enonce-bloc' : /intuition/i.test(t) ? 'intuition' : /probl[èe]me/i.test(t) ? 'probleme'
    : /cas limites/i.test(t) ? 'limites' : /d[ée]finition|notation|cadre|mod[èe]le/i.test(t) ? 'definitions' : '';
  const courante = Math.min((E.partie || {})[q.id] || 0, parties.length - 1);
  let h = '<div class="lecon-corps" data-lecon="' + q.id + '"><nav class="sommaire">';
  parties.forEach((p, k) => { h += '<button data-partie="' + k + '"' + (k === courante ? ' class="active"' : '') + '>' + (k + 1) + '. ' + esc(p.titre.replace(/^(Leçon|Partie \d+|Outil \d+|\d+\.)\s*:?\s*/i, '').slice(0, 42) || p.titre) + '</button>'; });
  h += '</nav>';
  parties.forEach((p, k) => {
    h += '<section class="partie" data-partie="' + k + '"' + (k === courante ? '' : ' hidden') + '>';
    let bloc = null;
    const fermer = () => { if (bloc) { h += bloc.genre === 'question' ? ficheDebrief(bloc.titre, bloc.noeuds) : bloc.genre === 'preuve' ? '</details>' : '</div>'; bloc = null; } };
    p.noeuds.forEach(n => {
      if (bloc && bloc.genre === 'question' && n.nodeName !== 'H4' && n.nodeName !== 'H3') { bloc.noeuds.push(n); return; }
      if (n.nodeName === 'H4' && /^Question \d+/.test(n.textContent)) {
        fermer();
        bloc = { genre: 'question', titre: n.textContent, noeuds: [] };
      } else if (n.nodeName === 'H4') {
        fermer();
        const g = genre(n.textContent);
        bloc = { genre: g };
        if (g === 'preuve') h += '<details class="bloc preuve"><summary>' + esc(n.textContent) + '<span class="meta">déplier pour la lire</span></summary>';
        else h += '<div class="bloc ' + g + '"><h4>' + esc(n.textContent) + '</h4>';
      } else if (n.nodeName === 'H3') { fermer(); h += n.outerHTML; }
      else h += n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    });
    fermer();
    h += '<div class="pied-partie"><button data-aller="' + (k - 1) + '"' + (k === 0 ? ' disabled' : '') + '>Partie précédente</button>'
      + '<span class="meta">Partie ' + (k + 1) + ' sur ' + parties.length + '</span>'
      + (k < parties.length - 1 ? '<button class="principal" data-aller="' + (k + 1) + '">Partie suivante</button>' : '<span class="meta">Fin de la leçon : passe à la suite avec « Suivante ».</span>') + '</div></section>';
  });
  return h + '</div>';
}
// Une question du débrief : en-tête (numéro, titre, verdict), énoncé, réponses côte à côte, rubriques, à retenir.
function ficheDebrief(titre, noeuds) {
  const m = titre.match(/^(Question \d+)\s*:?\s*(.*)$/);
  const gras = n => n.nodeName === 'P' && n.firstChild && n.firstChild.nodeName === 'STRONG' ? n.firstChild.textContent.trim() : '';
  const reste = n => { const c = n.cloneNode(true); c.removeChild(c.firstChild); return c.innerHTML.trim(); };
  let enonce = '', ta = null, attendue = null, verdict = '', corps = '', retenir = '', revoir = '', etat = 'enonce';
  noeuds.forEach(n => {
    const g = gras(n), html = n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    if (/^Ta réponse/.test(g)) { ta = reste(n); etat = 'corps'; }
    else if (/^Réponse attendue/.test(g)) { attendue = reste(n); etat = 'corps'; }
    else if (/^Verdict/.test(g)) { verdict = reste(n); etat = 'corps'; }
    else if (/^À retenir/.test(g)) { retenir = '<h5>À retenir</h5><p>' + reste(n) + '</p>'; etat = 'retenir'; }
    else if (/^Leçon à revoir/.test(g)) { revoir = reste(n); etat = 'fin'; }
    else if (g && n.textContent.trim() === g) { corps += '<h5>' + esc(g.replace(/[.:]\s*$/, '')) + '</h5>'; etat = 'corps'; }
    else if (etat === 'enonce') enonce += n.nodeName === 'P' && /^Type :/.test(n.textContent) ? '<p class="meta">' + n.innerHTML + '</p>' : n.nodeName === 'UL' ? '<ul class="choix">' + n.innerHTML + '</ul>' : html;
    else if (etat === 'retenir') retenir += html;
    else corps += html;
  });
  const brut = verdict.replace(/<[^>]+>/g, '').trim();
  const v = /^juste/i.test(brut) ? ['v-juste', 'Juste'] : /^fausse/i.test(brut) ? ['v-fausse', 'Fausse'] : /^incompl/i.test(brut) ? ['v-incomplete', 'Incomplète']
    : /^non visible/i.test(brut) ? ['', 'Réponse non visible'] : ['', ''];
  const suite = brut.replace(/^[^.]*\.\s*/, '');
  let h = '<article class="fiche ' + v[0] + '"><header class="fiche-tete"><span class="num">' + esc(m[1]) + '</span><span class="titre">' + esc(m[2]) + '</span>'
    + (v[1] ? '<span class="verdict">' + v[1] + '</span>' : '') + '</header><div class="fiche-corps">';
  if (ta === null && attendue === null) return h + enonce + corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '') + '</div></article>';
  h += '<h5>Énoncé</h5>' + enonce;
  h += '<div class="fiche-reponses">' + (ta === null ? '' : '<div><span class="lab">Ta réponse</span>' + ta + '</div>') + '<div><span class="lab">Réponse attendue</span>' + (attendue || '') + '</div></div>';
  if (suite) h += '<p class="meta">' + verdict.replace(/^[^.]*\.\s*/, '') + '</p>';
  h += corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '');
  return h + '</div></article>';
}
function brancherLecon(q) {
  const corps = page.querySelector('.lecon-corps');
  if (!corps) return;
  const aller = k => {
    if (!E.partie) E.partie = {};

    corps.querySelectorAll('.sommaire button').forEach(b => b.classList.toggle('active', Number(b.dataset.partie) === k));
    const cadre = corps.closest('.enonce');

function dessinerControle(q, el) {

    const montrer = choix && (oid === choix || o.correcte);
    h += '<div class="option' + classe + '" data-co="' + oid + '"><span class="lettre">' + 'ABCD'[k] + '</span><div>' + rendre(o.texte)

  });
  el.innerHTML = h;
  if (!choix) el.querySelectorAll('.option').forEach(op => op.onclick = () => { E.controles[cle] = op.dataset.co; sauver(); dessinerControle(q, el); composer(el); });
}
function brancherControles(q) { page.querySelectorAll('.controle').forEach(el => dessinerControle(q, el)); brancherLecon(q); }

function epreuveCode(q) {

async function demarrerNoyau(q, confirmer, reconnexion) {

function rendreSortie(c) { return c.sortie || ''; }

// ------------------------------------------------------------------ éditeur
// Monaco (l'éditeur de VS Code) depuis cdnjs ; les suggestions, signatures et aides viennent de jedi
// dans le noyau, qui connaît les variables déjà exécutées. Sans connexion, repli sur une zone de texte simple.
const MONACO_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min';
let MONACO = null, promesseMonaco = null;
const EDITEURS = [];
window.EDITEURS = EDITEURS;
// Monaco annule ses tâches en cours quand on ferme un éditeur ; cette annulation n'est pas une erreur.
window.addEventListener('unhandledrejection', ev => { if (ev.reason && ev.reason.name === 'Canceled') ev.preventDefault(); });
function sombre() { return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; }
function questionCode() { const q = ITEMS[E.courant]; return E.phase === 'epreuve' && q && q.cellules_initiales ? q : null; }
function chargerMonaco() {
  if (promesseMonaco) return promesseMonaco;
  promesseMonaco = new Promise(resolve => {
    const abandon = setTimeout(() => fini(null), 20000);
    function fini(m) { clearTimeout(abandon); if (window.MODE_EDITEUR === undefined) { MONACO = m; window.MODE_EDITEUR = m ? 'monaco' : 'simple'; } resolve(MONACO); }
    const s = document.createElement('script');
    s.src = MONACO_BASE + '/vs/loader.js';
    s.onerror = () => fini(null);
    s.onload = () => {
      window.MonacoEnvironment = { getWorkerUrl: () => 'data:text/javascript;charset=utf-8,' + encodeURIComponent("self.MonacoEnvironment={baseUrl:'" + MONACO_BASE + "/'};importScripts('" + MONACO_BASE + "/vs/base/worker/workerMain.js');") };
      window.require.config({ paths: { vs: MONACO_BASE + '/vs' } });
      window.require(['vs/editor/editor.main'], () => { try { configurerMonaco(window.monaco); fini(window.monaco); } catch (e) { fini(null); } }, () => fini(null));
    };
    document.head.appendChild(s);
  });
  return promesseMonaco;
}
async function aide(type, model, position) {
  const q = questionCode();
  if (!q || !SERVEUR) return null;
  try { return await api('/api/' + type, { session: SESSION, dossier: q.dossier, code: model.getValue(), ligne: position.lineNumber, colonne: position.column - 1 }); }
  catch (e) { return null; }
}
function configurerMonaco(m) {
  const K = m.languages.CompletionItemKind;
  const genres = { module: K.Module, class: K.Class, instance: K.Variable, function: K.Function, param: K.Variable, path: K.File, keyword: K.Keyword, property: K.Property, statement: K.Variable };
  m.languages.registerCompletionItemProvider('python', {
    triggerCharacters: ['.'],
    provideCompletionItems: async (model, position) => {
      const r = await aide('completer', model, position);
      if (!r || !r.completions) return { suggestions: [] };
      const mot = model.getWordUntilPosition(position);
      const plage = new m.Range(position.lineNumber, mot.startColumn, position.lineNumber, mot.endColumn);
      return { suggestions: r.completions.map((c, k) => ({ label: c.nom, kind: genres[c.type] ?? K.Variable, insertText: c.nom, detail: c.description, range: plage, sortText: String(k).padStart(4, '0') })) };
    }
  });
  m.languages.registerSignatureHelpProvider('python', {
    signatureHelpTriggerCharacters: ['(', ','],
    provideSignatureHelp: async (model, position) => {

function inserer(zone, texte) {
  zone.focus();

  zone.dispatchEvent(new Event('input'));
}
function clavier(ev, zone, rappels) {
  if (ev.key === 'Enter' && (ev.shiftKey || ev.ctrlKey)) {
    ev.preventDefault();
    if (ev.shiftKey) rappels.executerSuivant(); else rappels.executer();
    return;
  }
  const debut = zone.selectionStart, fin = zone.selectionEnd, v = zone.value;
  const debutLigne = v.lastIndexOf('\n', debut - 1) + 1;
  if (ev.key === 'Tab') {
    ev.preventDefault();
    const multi = v.slice(debut, fin).includes('\n');
    if (!ev.shiftKey && !multi) { inserer(zone, '    '); return; }
    const finBloc = fin;
    const bloc = v.slice(debutLigne, finBloc);
    const nouveau = ev.shiftKey ? bloc.replace(/^ {1,4}/gm, '') : bloc.replace(/^/gm, '    ');
    zone.setSelectionRange(debutLigne, finBloc);
    inserer(zone, nouveau);
    zone.setSelectionRange(debutLigne, debutLigne + nouveau.length);
    return;
  }
  if (ev.key === 'Enter' && !ev.altKey && !ev.metaKey) {
    ev.preventDefault();
    const ligne = v.slice(debutLigne, debut);
    let retrait = ligne.match(/^ */)[0];
    if (/:\s*(#.*)?$/.test(ligne)) retrait += '    ';
    inserer(zone, '\n' + retrait);
  }
}

function points(q) {
  if (q.type === 'code') { const c = E.code[q.id]; return c && c.soumissions ? c.caches_reussis / c.caches_total : 0; }
  const r = E.reponses[q.id];
  if (r === undefined || r === 'nsp') return 0;
  // Une question à plusieurs réponses est notée tout ou rien : l'ensemble coché doit être exactement l'ensemble juste.
  const s = choisies(q), bonnes = q.options.filter(o => o.correcte).map(o => o.id);
  return s.length === bonnes.length && bonnes.every(b => s.includes(b)) ? 1 : -D.options.penalite;
}
function choisies(q) { const r = E.reponses[q.id]; return r === undefined || r === 'nsp' ? [] : Array.isArray(r) ? r.slice() : [r]; }
function texteOption(q, id) { const o = q.options.find(x => x.id === id); return o ? o.texte : null; }

function resultatJSON(duree) {
  return {
    examen: D.id, debut: new Date(E.debut).toISOString(), duree_s: Math.round(duree), pauses_s: Math.round((E.pauseTotale || 0) / 1000), options: D.options,
    lecons: ITEMS.filter(q => q.type === 'lecon').map(q => {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      return { id: q.id, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), controles_justes_du_premier_coup: justes, controles_total: ids.length };
    }),
    questions: NOTEES.map(q => {
      const base = { id: q.id, type: q.type, section: q.section, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), temps_cible_s: q.temps_cible_s, points: Number(points(q).toFixed(4)) };
      if (q.type === 'code') {
        const c = E.code[q.id] || {};
        return Object.assign(base, { soumissions: c.soumissions || 0, caches_reussis: c.caches_reussis || 0, caches_total: c.caches_total || q.tests_caches, visibles_reussis: c.visibles_reussis ?? null, code_source: c.code_source || codeSource(q) });
      }
      const r = E.reponses[q.id] ?? null;
      return Object.assign(base, { reponse: r, reponse_texte: r && r !== 'nsp' ? choisies(q).map(i => texteOption(q, i)).join(' ; ') : null, bonne_reponse_texte: q.options.filter(o => o.correcte).map(o => o.texte).join(' ; ') });
    })
  };
}

      if (!Array.isArray(o) || o.length !== ids.length || !ids.every(i => o.includes(i))) E.ordre[q.id] = melanger(ids);
      const rep = E.reponses[q.id];
      if (rep !== undefined && rep !== 'nsp' && (Array.isArray(rep) !== !!q.multiple || !choisies(q).length || !choisies(q).every(i => ids.includes(i)))) delete E.reponses[q.id];
    }
    if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => {
      const cle = q.id + ':' + cid;
      if (!Array.isArray(E.ordreControles[cle])) E.ordreControles[cle] = melanger(c.options.map(o => o.id));
    });
  });
}
charger();
completerEtat();
if (SERVEUR && ITEMS.some(q => q.cellules_initiales)) chargerMonaco();
afficher();
</script>
