n": "C'est le résultat avec \\(r = p/q\\) au lieu de \\(q/p\\) : la probabilité de finir en bas. Le contrôle « \\(p > 1/2\\) implique \\(h > i/n\\) » détecte l'inversion en 5 secondes."}, {"id": "d", "texte": "0,078", "correcte": false, "explication": "C'est \\(0{,}6^5\\), la probabilité de monter 5 fois de suite : un seul des chemins qui mènent à 10. Les chemins avec des allers-retours comptent aussi."}]}, "ordre": {"question": "On tire 7 variables indépendantes de loi uniforme sur \\([0, 1]\\). Quelle est l'espérance de la deuxième plus grande ?", "options": [{"id": "a", "texte": "3/4", "correcte": true, "explication": "Oui : la deuxième plus grande est \\(U_{(6)}\\), d'espérance \\(6/(7+1)\\)."}, {"id": "b", "texte": "1/4", "correcte": false, "explication": "C'est \\(\\mathbb{E}[U_{(2)}] = 2/8\\), la deuxième plus petite. La deuxième plus grande est \\(U_{(n-1)}\\)."}, {"id": "c", "texte": "6/7", "correcte": false, "explication": "Le dénominateur est \\(n = 7\\) au lieu de \\(n + 1 = 8\\) : 7 points découpent le segment en 8 morceaux."}, {"id": "d", "texte": "7/8", "correcte": false, "explication": "C'est l'espérance du maximum, \\(7/8\\). La deuxième plus grande se trouve en moyenne un morceau plus bas."}]}, "bonferroni": {"question": "On réalise 10 tests et l'on veut que la probabilité de rejeter à tort au moins une hypothèse nulle vraie soit au plus 0,05, sans rien savoir de la dépendance entre les tests. Que fait la correction de Bonferroni, et que garantit-elle ?", "options": [{"id": "a", "texte": "Chaque test au niveau 0,005 ; le taux d'erreur familial est au plus 0,05 quelle que soit la dépendance.", "correcte": true, "explication": "Oui : par la borne de Boole, la probabilité d'au moins un rejet à tort est au plus la somme des 10 probabilités, chacune au plus 0,005."}, {"id": "b", "texte": "Chaque test au niveau 0,005 ; la garantie suppose les tests indépendants.", "correcte": false, "explication": "La borne de Boole ne demande aucune indépendance. C'est le calcul exact \\(1 - (1 - t)^m\\) qui la demanderait."}, {"id": "c", "texte": "Chaque test au niveau 0,005 ; au plus 5 % des hypothèses rejetées sont des fausses découvertes.", "correcte": false, "explication": "Cela décrit le contrôle de la proportion de fausses découvertes (FDR), une autre garantie. Bonferroni borne la probabilité d'au moins une fausse découverte."}, {"id": "d", "texte": "Chaque test au niveau 0,05 ; chaque test ne se trompe qu'avec probabilité 0,05, donc l'ensemble aussi.", "correcte": false, "explication": "Le niveau de chaque test ne borne pas le taux familial : sous indépendance, 10 tests au niveau 0,05 donnent au moins un rejet à tort avec probabilité \\(1 - 0{,}95^{10} \\approx 0{,}401\\), et Boole ne garantit que \\(0{,}5\\)."}]}}, "verif": {"script": "verif/seance_math_1.py"}}]}, {"id": "math", "nom": "Mathématiques", "budget_min": 25, "questions": [{"id": "S1M-01", "section": "math", "theme": "Linéarité de l'espérance, indicatrices", "difficulte": 2, "temps_cible_s": 75, "enonce": "On lance 12 fois une pièce équilibrée ; les lancers sont indépendants et chacun donne P (pile) ou F (face) avec probabilité 1/2. Une occurrence du motif PFP est un numéro \\(j\\) tel que les lancers numéros \\(j\\), \\(j+1\\) et \\(j+2\\) existent et donnent P, F, P dans cet ordre. Les occurrences peuvent se chevaucher : la suite PFPFP contient 2 occurrences.\n\nQuelle est l'espérance du nombre d'occurrences du motif PFP, arrondie à trois décimales ?", "options": [{"id": "a", "texte": "1,250", "correcte": true, "explication": "Oui : 10 positions possibles, chacune occupée par le motif avec probabilité \\(1/8\\)."}, {"id": "b", "texte": "1,500", "correcte": false, "explication": "On a compté 12 positions de départ. Le motif occupe 3 lancers : il ne peut commencer qu'aux positions 1 à 10."}, {"id": "c", "texte": "0,737", "correcte": false, "explication": "C'est \\(1 - (1 - 1/8)^{10}\\), un calcul de la probabilité d'au moins une occurrence qui suppose de plus les positions indépendantes, ce qu'elles ne sont pas. La question demande l'espérance du nombre d'occurrences, qui peut dépasser 1."}, {"id": "d", "texte": "0,125", "correcte": false, "explication": "C'est la probabilité d'une occurrence à une position donnée, \\(\\mathbb{E}[I_j] = 1/8\\). Il faut encore sommer sur les 10 positions."}], "solution": "Réponse : \\(10 \\times 1/8 = 1{,}250\\).\n\nNotations : pour \\(j = 1, \\dots, 10\\), \\(I_j\\) est l'indicatrice de l'événement « les lancers \\(j\\), \\(j+1\\), \\(j+2\\) donnent P, F, P », et \\(N = I_1 + \\dots + I_{10}\\) est le nombre d'occurrences.\n\nÉtape 1 : le motif occupe 3 lancers consécutifs ; il peut commencer aux positions 1 à \\(12 - 2 = 10\\).\n\nÉtape 2 : les trois lancers concernés sont indépendants, donc \\(\\mathbb{P}(I_j = 1) = (1/2)^3 = 1/8\\).\n\nÉtape 3 : par linéarité de l'espérance, qui ne demande aucune indépendance entre les \\(I_j\\) (deux positions voisines ne sont pas indépendantes), \\(\\mathbb{E}[N] = 10/8 = 1{,}250\\).\n\nVérification (script) : énumération des \\(2^{12}\\) suites, et simulation : 1,251.", "type": "qcm", "multiple": false, "reponse": "1,250", "fiche": null, "verif": {"script": "verif/seance_math_1.py", "cles": ["Q01_d_12pos", "Q01_d_au_moins_un", "Q01_d_proba1", "Q01_ex", "Q01_exact", "Q01_mc", "Q01_p_den", "Q01_pos"]}}, {"id": "S1M-02", "section": "math", "theme": "Linéarité de l'espérance, indicatrices", "difficulte": 3, "temps_cible_s": 120, "enonce": "Une urne contient 20 boules numérotées de 1 à 20. On effectue 10 tirages avec remise : chaque tirage choisit une boule uniformément au hasard, indépendamment des autres tirages, puis la remet dans l'urne. Par exemple, les tirages 4, 7, 4, 4, 12, 7, 1, 1, 9, 20 donnent 6 numéros distincts.\n\nQuelle est l'espérance du nombre de numéros distincts obtenus, arrondie à trois décimales ?", "options": [{"id": "a", "texte": "8,025", "correcte": true, "explication": "Oui : une indicatrice par numéro possible, de probabilité \\(1 - (19/20)^{10}\\), et 20 numéros."}, {"id": "b", "texte": "11,975", "correcte": false, "explication": "C'est \\(20 \\times (19/20)^{10}\\), l'espérance du nombre de numéros **jamais** obtenus. Le nombre de numéros distincts est 20 moins cette quantité."}, {"id": "c", "texte": "7,750", "correcte": false, "explication": "C'est 10 moins l'espérance du nombre de paires de tirages égaux, \\(\\binom{10}{2}/20 = 45/20\\). Ce décompte est faux dès que trois tirages coïncident : ils forment 3 paires pour seulement 2 tirages en trop."}, {"id": "d", "texte": "6,302", "correcte": false, "explication": "C'est \\(10 \\times (19/20)^{9}\\), l'espérance du nombre de tirages dont le numéro ne sort qu'une fois. Un numéro sorti plusieurs fois compte aussi comme un numéro distinct."}], "solution": "Réponse : \\(20\\,\\big(1 - (19/20)^{10}\\big) \\approx 8{,}025\\).\n\nNotations : pour chaque numéro \\(k \\in \\{1, \\dots, 20\\}\\), \\(I_k\\) est l'indicatrice de l'événement « le numéro \\(k\\) sort au moins une fois », et \\(N = I_1 + \\dots + I_{20}\\) est le nombre de numéros distincts.\n\nÉtape 1 : à un tirage donné, \\(k\\) ne sort pas avec probabilité \\(19/20 = 0{,}95\\). Les 10 tirages étant indépendants, \\(k\\) ne sort jamais avec probabilité \\((19/20)^{10} \\approx 0{,}5987\\).\n\nÉtape 2 : \\(\\mathbb{E}[I_k] = \\mathbb{P}(I_k = 1) = 1 - (19/20)^{10}\\).\n\nÉtape 3 : par linéarité de l'espérance (les \\(I_k\\) ne sont pas indépendants, et c'est sans importance), \\(\\mathbb{E}[N] = 20\\,\\big(1 - (19/20)^{10}\\big) \\approx 8{,}025\\).\n\nRéflexe : une indicatrice par **valeur possible** (20 numéros), pas par tirage.", "type": "qcm", "multiple": false, "reponse": "8,025", "fiche": null, "verif": {"script": "verif/seance_math_1.py", "cles": ["Q02_d_absents", "Q02_d_paires", "Q02_d_uniques", "Q02_ex_distincts", "Q02_exact", "Q02_nb_paires", "Q02_p_absent", "Q02_ratio"]}}, {"id": "S1M-03", "section": "math", "theme": "Linéarité de l'espérance, variance d'un comptage", "difficulte": 4, "temps_cible_s": 120, "enonce": "On tire une permutation \\(S\\) de \\(\\{1, \\dots, 10\\}\\) uniformément au hasard parmi les \\(10!\\) permutations. Un point fixe de \\(S\\) est un entier \\(i\\) tel que \\(S(i) = i\\). Soit \\(N\\) le nombre de points fixes de \\(S\\).\n\nQue vaut \\(\\mathrm{Var}(N)\\) ?", "options": [{"id": "a", "texte": "1", "correcte": true, "explication": "Oui : \\(\\mathbb{E}[N] = 1\\) et \\(\\mathbb{E}[N^2] = 2\\)."}, {"id": "b", "texte": "0,9", "correcte": false, "explication": "C'est \\(\\sum_i \\mathrm{Var}(I_i) = 10 \\times \\tfrac{1}{10} \\times \\tfrac{9}{10}\\), qui suppose les indicatrices non corrélées. Elles sont positivement corrélées : \\(\\mathbb{P}(I_1 = 1, I_2 = 1) = 1/90\\), plus grand que \\(\\mathbb{P}(I_1 = 1)\\,\\mathbb{P}(I_2 = 1) = 1/100\\)."}, {"id": "c", "texte": "2", "correcte": false, "explication": "C'est \\(\\mathbb{E}[N^2]\\). La variance est \\(\\mathbb{E}[N^2] - \\mathbb{E}[N]^2\\), avec \\(\\mathbb{E}[N] = 1\\)."}, {"id": "d", "texte": "0,5", "correcte": false, "explication": "Les couples d'indices distincts ont été comptés une seule fois (\\(\\binom{10}{2} = 45\\) paires) au lieu de deux : dans \\(N^2 = \\sum_i \\sum_j I_i I_j\\), les termes \\(I_1 I_2\\) et \\(I_2 I_1\\) apparaissent tous les deux, soit 90 couples ordonnés."}], "solution": "Réponse : \\(\\mathrm{Var}(N) = 1\\).\n\nNotations : \\(I_i\\) est l'indicatrice de l'événement \\(\\{S(i) = i\\}\\), et \\(N = I_1 + \\dots + I_{10}\\).\n\nÉtape 1, espérance : les permutations qui fixent \\(i\\) sont les \\(9!\\) permutations des autres éléments, donc \\(\\mathbb{P}(S(i) = i) = 9!/10! = 1/10\\) et, par linéarité, \\(\\mathbb{E}[N] = 10 \\times 1/10 = 1\\).\n\nÉtape 2, développement : \\(N^2 = \\sum_i I_i^2 + \\sum_{i \\ne j} I_i I_j\\), où la seconde somme porte sur les \\(10 \\times 9 = 90\\) couples **ordonnés** d'indices distincts. Comme \\(I_i^2 = I_i\\), la première somme a pour espérance \\(\\mathbb{E}[N] = 1\\).\n\nÉtape 3 : \\(I_i I_j\\) est l'indicatrice de « \\(i\\) et \\(j\\) sont fixes », de probabilité \\(8!/10! = 1/90\\). Par linéarité, la seconde somme a pour espérance \\(90 \\times 1/90 = 1\\).\n\nÉtape 4 : \\(\\mathbb{E}[N^2] = 2\\) et \\(\\mathrm{Var}(N) = 2 - 1^2 = 1\\). Le résultat vaut pour tout \\(n \\ge 2\\) (leçon, outil 1, exemple 1).\n\nVérification (script) : énumération exacte pour \\(n = 2\\) à 7, et simulation pour \\(n = 10\\) : 0,998.", "type": "qcm", "multiple": false, "reponse": "1", "fiche": null, "verif": {"script": "verif/seance_math_1.py", "cles": ["Q03_d_e2", "Q03_d_indep", "Q03_d_paires", "Q03_e2", "Q03_exact", "Q03_mc", "Q03_n2", "Q03_nb_couples", "Q03_nb_paires"]}}, {"id": "S1M-04", "section": "math", "theme": "Marche aléatoire, durée moyenne", "difficulte": 3, "temps_cible_s": 90, "enonce": "Une particule part de la position 2 sur les entiers relatifs. À chaque pas, indépendamment des pas précédents, elle se déplace de +1 avec probabilité 1/2 et de −1 avec probabilité 1/2. Elle s'arrête dès qu'elle atteint la position −3 ou la position 6.\n\nQuelle est l'espérance du nombre de pas effectués jusqu'à l'arrêt ?", "options": [{"id": "a", "texte": "20", "correcte": true, "explication": "Oui : produit des distances du départ aux deux barrières, \\(5 \\times 4\\)."}, {"id": "b", "texte": "12", "correcte": false, "explication": "C'est \\(2 \\times 6\\), la position de départ multipliée par la barrière haute. La formule multiplie les **distances** du départ aux deux barrières : \\(5 \\times 4\\)."}, {"id": "c", "texte": "8", "correcte": false, "explication": "C'est \\(2 \\times (6 - 2)\\) : la formule \\(i\\,(n - i)\\) appliquée sans translation, comme si la barrière basse était en 0. En translatant de 3, les barrières deviennent 0 et 9, et le départ 5."}, {"id": "d", "texte": "4", "correcte": false, "explication": "C'est le nombre **minimal** de pas (4 pas vers le haut), pas une espérance : la particule fait des allers-retours et peut aussi finir en −3."}], "solution": "Réponse : 20 pas.\n\nÉtape 1, translation : ajouter 3 à toutes les positions ne change ni les pas ni le moment de l'arrêt. La marche part alors de \\(i = 5\\) entre les barrières 0 et \\(n = 9\\).\n\nÉtape 2 : pour la marche symétrique entre 0 et \\(n\\), l'espérance du temps d'arrêt partant de \\(i\\) est \\(d(i) = i\\,(n - i)\\) (leçon, outil 2 : équation du premier pas \\(d(i) = 1 + \\tfrac12 d(i+1) + \\tfrac12 d(i-1)\\), \\(d(0) = d(n) = 0\\), finitude par blocs et unicité de la solution).\n\nÉtape 3 : \\(d(5) = 5 \\times (9 - 5) = 20\\). Forme directe sans translation : (départ − barrière basse) × (barrière haute − départ) \\(= 5 \\times 4\\).\n\nVérification (script) : système linéaire résolu en rationnels, et simulation : 20,03.", "type": "qcm", "multiple": false, "reponse": "20", "fiche": null, "verif": {"script": "verif/seance_math_1.py", "cles": ["Q04_d_min", "Q04_d_produit", "Q04_d_sans_translation", "Q04_dist_bas", "Q04_dist_haut", "Q04_exact", "Q04_i_translate", "Q04_largeur", "Q04_mc"]}}, {"id": "S1M-05", "section": "math", "theme": "Ruine du joueur, jeu biaisé", "difficulte": 4, "temps_cible_s": 120, "enonce": "Un joueur dispose de 3 euros. À chaque partie, indépendamment des parties précédentes, il gagne 1 euro avec probabilité 0,4 et perd 1 euro avec probabilité 0,6. Il s'arrête dès que sa fortune atteint 0 euro ou 6 euros.\n\nQuelle est la probabilité qu'il atteigne 6 euros, arrondie à trois décimales ?", "options": [{"id": "a", "texte": "0,229", "correcte": true, "explication": "Oui : \\(r = q/p = 1{,}5\\) et, comme le départ est au milieu, \\(h = 1/(1 + r^3)\\)."}, {"id": "b", "texte": "0,500", "correcte": false, "explication": "C'est \\(i/n = 3/6\\), la formule du jeu équitable. Ici le jeu est défavorable (\\(p < 1/2\\)), donc la probabilité d'atteindre 6 doit être inférieure à 1/2."}, {"id": "c", "texte": "0,771", "correcte": false, "explication": "C'est le résultat avec \\(r = p/q\\) au lieu de \\(q/p\\), c'est-à-dire la probabilité de finir à 0. Contrôle en 5 secondes : avec \\(p < 1/2\\), la réponse doit être sous \\(i/n = 1/2\\)."}, {"id": "d", "texte": "0,064", "correcte": false, "explication": "C'est \\(0{,}4^3\\), la probabilité de gagner les trois premières parties : un seul des chemins qui mènent à 6. Les chemins avec des allers-retours comptent aussi."}], "solution": "Réponse : \\(\\tfrac{8}{35} \\approx 0{,}229\\).\n\nNotations : \\(p = 0{,}4\\) (gain), \\(q = 0{,}6\\) (perte), départ \\(i = 3\\), barrières 0 et \\(n = 6\\), \\(r = q/p = 1{,}5\\).\n\nÉtape 1 : comme \\(p \\ne 1/2\\), la probabilité de finir en haut est \\(h(i) = (1 - r^i)/(1 - r^n)\\) (leçon, outil 2 : équation du premier pas \\(h(i) = p\\,h(i+1) + q\\,h(i-1)\\), \\(h(0) = 0\\), \\(h(n) = 1\\), solution unique).\n\nÉtape 2 : \\(r^3 = \\tfrac{27}{8}\\) et \\(r^6 = \\tfrac{729}{64}\\), donc \\(h(3) = \\dfrac{-19/8}{-665/64} = \\tfrac{8}{35}\\).\n\nRaccourci quand le départ est au milieu (\\(i = n/2\\)) : \\(1 - r^n = (1 - r^i)(1 + r^i)\\), donc \\(h = 1/(1 + r^3) = 1/(35/8) = \\tfrac{8}{35}\\).\n\nContrôle : \\(p < 1/2\\), et la réponse est bien sous \\(i/n = 1/2\\). Simulation (script) : 0,228.", "type": "qcm", "multiple": false, "reponse": "0,229", "fiche": null, "verif": {"script": "verif/seance_math_1.py", "cles": ["Q05_d_inverse", "Q05_d_sym", "Q05_d_trois", "Q05_exact", "Q05_exact_den", "Q05_exact_num", "Q05_mc", "Q05_r", "Q05_r3_den", "Q05_r3_num", "Q05_r6_den", "Q05_r6_num", "Q05_un_moins_r3_den", "Q05_un_moins_r3_num", "Q05_un_moins_r6_den", "Q05_un_moins_r6_num", "Q05_un_plus_r3_den", "Q05_un_plus_r3_num"]}}, {"id": "S1M-06", "section": "math", "theme": "Ruine du joueur, durée moyenne d'un jeu biaisé", "difficulte": 5, "temps_cible_s": 150, "enonce": "Un joueur dispose de 3 euros. À chaque partie, indépendamment des parties précédentes, il gagne 1 euro avec probabilité 0,4 et perd 1 euro avec probabilité 0,6. Il s'arrête dès que sa fortune atteint 0 euro ou 6 euros.\n\nQuelle est l'espérance du nombre de parties jouées, arrondie à trois décimales ?", "options": [{"id": "a", "texte": "8,143", "correcte": true, "explication": "Oui : \\(d = (n\\,h - i)/(p - q)\\) avec \\(h = \\tfrac{8}{35}\\)."}, {"id": "b", "texte": "9,000", "correcte": false, "explication": "C'est \\(i\\,(n - i) = 3 \\times 3\\), la formule du jeu équitable. Elle n'est valable que pour \\(p = 1/2\\)."}, {"id": "c", "texte": "15,000", "correcte": false, "explication": "C'est \\(i/(q - p) = 3/0{,}2\\), la durée moyenne jusqu'à la ruine **sans** barrière haute. La barrière en 6 arrête certaines parties plus tôt, ce qui raccourcit la durée moyenne (leçon, outil 2, cas limites)."}, {"id": "d", "texte": "21,857", "correcte": false, "explication": "Erreur de signe sur le terme de correction : \\((i + n\\,h)/(q - p)\\) au lieu de \\((i - n\\,h)/(q - p)\\). Ce résultat dépasse \\(i/(q - p) = 15\\), la durée sans barrière haute, ce qui est impossible."}], "solution": "Réponse : \\(\\tfrac{57}{7} \\approx 8{,}143\\) parties.\n\nNotations : \\(p = 0{,}4\\), \\(q = 0{,}6\\), \\(i = 3\\), \\(n = 6\\), \\(r = q/p = 1{,}5\\) ; \\(h\\) est la probabilité de finir à 6, \\(d\\) l'espérance du nombre de parties.\n\nÉtape 1 : \\(h = 1/(1 + r^3) = \\tfrac{8}{35}\\) (départ au milieu, voir la question précédente ou la leçon, outil 2).\n\nÉtape 2, identité de Wald : la fortune finale \\(Z_T\\) vérifie \\(\\mathbb{E}[Z_T] - i = (p - q)\\,\\mathbb{E}[T]\\), car chaque partie jouée rapporte \\(p - q\\) en moyenne et la décision de jouer la \\(k\\)-ième partie ne dépend que des parties précédentes. Comme \\(\\mathbb{E}[Z_T] = n\\,h\\) : \\(d = (n\\,h - i)/(p - q)\\).\n\nÉtape 3 : \\(n\\,h = \\tfrac{48}{35}\\), \\(n\\,h - i = \\tfrac{-57}{35}\\), \\(p - q = -0{,}2\\), donc \\(d = \\tfrac{57}{7} \\approx 8{,}143\\).\n\nContrôles : \\(d\\) est positif, inférieur à \\(i/(q - p) = 15\\) (durée sans barrière haute) et différent de \\(3 \\times 3\\) puisque le jeu n'est pas équitable. Simulation (script) : 8,139.", "type": "qcm", "multiple": false, "reponse": "8,143", "fiche": null, "verif": {"script": "verif/seance_math_1.py", "cles": ["Q05_exact_den", "Q05_exact_num", "Q05_r", "Q06_d_signe", "Q06_d_sym", "Q06_d_une_barriere", "Q06_exact", "Q06_exact_den", "Q06_exact_num", "Q06_mc", "Q06_nh_den", "Q06_nh_moins_i_den", "Q06_nh_moins_i_num", "Q06_nh_num", "Q06_p_moins_q", "Q06_q_moins_p"]}}, {"id": "S1M-07", "section": "math", "theme": "Premier pas, temps d'attente d'un motif", "difficulte": 3, "temps_cible_s": 120, "enonce": "On lance une pièce équilibrée de façon répétée, les lancers étant indépendants, jusqu'à obtenir pour la première fois deux piles consécutifs, c'est-à-dire deux lancers successifs qui donnent tous deux pile. On compte tous les lancers effectués, y compris les deux derniers.\n\nQuelle est l'espérance du nombre de lancers ?", "options": [{"id": "a", "texte": "6", "correcte": true, "explication": "Oui : \\(e_1 = 4\\) depuis l'état « dernier lancer pile », \\(e_0 = 6\\) depuis le départ."}, {"id": "b", "texte": "4", "correcte": false, "explication": "C'est \\(1/\\mathbb{P}(\\text{PP}) = 1/(1/4)\\), le temps d'attente moyen d'un succès de probabilité 1/4 si les essais étaient indépendants et disjoints. Ici, après un pile suivi d'un face, il faut tout recommencer, et les paires de lancers successifs se chevauchent."}, {"id": "c", "texte": "8", "correcte": false, "explication": "C'est l'attente d'un bloc PP quand on découpe les lancers en blocs disjoints de deux : 4 blocs en moyenne, soit 8 lancers. Deux piles consécutifs peuvent aussi chevaucher deux blocs (F P puis P F), ce qui les fait arriver plus tôt : 8 n'est qu'un majorant."}, {"id": "d", "texte": "3", "correcte": false, "explication": "C'est 2 + 1 : attendre un pile (2 lancers en moyenne), puis un lancer de plus. Cela oublie qu'un face au lancer suivant oblige à tout recommencer."}], "solution": "Réponse : 6 lancers.\n\nNotations : deux états. État 0 : « rien d'utile » (au départ, ou dernier lancer face). État 1 : « dernier lancer pile ». \\(e_0\\) et \\(e_1\\) sont les espérances du nombre de lancers restants depuis chaque état.\n\nÉtape 1, finitude : en découpant les lancers en blocs disjoints de deux, chaque bloc vaut PP avec probabilité 1/4, indépendamment des autres ; l'argument des blocs de la leçon (outil 2, étape 1 de la preuve) majore l'espérance par \\(2 \\times 4 = 8\\).\n\nÉtape 2, premier lancer depuis l'état 0 : pile mène à l'état 1, face laisse en état 0 : \\(e_0 = 1 + \\tfrac12 e_1 + \\tfrac12 e_0\\), donc \\(e_0 = 2 + e_1\\).\n\nÉtape 3, premier lancer depuis l'état 1 : pile termine, face ramène à l'état 0 : \\(e_1 = 1 + \\tfrac12 \\times 0 + \\tfrac12 e_0\\).\n\nÉtape 4 : en substituant, \\(e_1 = 1 + \\tfrac12 (2 + e_1)\\), donc \\(e_1 = 4\\) et \\(e_0 = 6\\). Le système a une solution unique, et les vraies espérances, finies, le vérifient : ce sont donc ces valeurs.\n\nComparaison utile : pour le motif pile puis face, l'attente moyenne n'est que de 4 lancers (leçon, outil 2), car un pile raté n'oblige pas à recommencer. Simulation (script) : 6,017.", "type": "qcm", "multiple": false, "reponse": "6", "fiche": null, "verif": {"script": "verif/seance_math_1.py", "cles": ["Lb_pf_e0", "Q07_borne", "Q07_d_blocs", "Q07_d_inverse", "Q07_d_naif", "Q07_e1", "Q07_exact", "Q07_mc"]}}, {"id": "S1M-08", "section": "math", "theme": "Statistiques d'ordre", "difficulte": 2, "temps_cible_s": 60, "enonce": "Soient \\(U_1, \\dots, U_5\\) cinq variables aléatoires indépendantes de loi uniforme sur \\([0, 1]\\). Quelle est l'espérance de la deuxième plus grande des cinq valeurs ?", "options": [{"id": "a", "texte": "2/3", "correcte": true, "explication": "Oui : la deuxième plus grande est \\(U_{(4)}\\), d'espérance \\(4/(5+1)\\)."}, {"id": "b", "texte": "1/3", "correcte": false, "explication": "C'est \\(\\mathbb{E}[U_{(2)}] = 2/6\\), la deuxième plus **petite**. La deuxième plus grande est \\(U_{(n-1)} = U_{(4)}\\)."}, {"id": "c", "texte": "4/5", "correcte": false, "explication": "Le dénominateur est \\(n = 5\\) au lieu de \\(n + 1 = 6\\) : 5 points découpent le segment en 6 morceaux de même longueur moyenne."}, {"id": "d", "texte": "5/6", "correcte": false, "explication": "C'est l'espérance du maximum, \\(5/6\\). La deuxième plus grande se trouve en moyenne un morceau plus bas."}], "solution": "Réponse : \\(\\tfrac{2}{3}\\).\n\nÉtape 1 : en rangeant les valeurs, \\(U_{(1)} < \\dots < U_{(5)}\\), la deuxième plus grande est \\(U_{(4)}\\).\n\nÉtape 2 : pour \\(n\\) uniformes indépendantes sur \\([0, 1]\\), \\(\\mathbb{E}[U_{(k)}] = k/(n+1)\\) (leçon, outil 3 : formule de la queue, loi binomiale et intégrale bêta).\n\nÉtape 3 : \\(\\mathbb{E}[U_{(4)}] = 4/6 = \\tfrac{2}{3}\\). Contrôle de symétrie : la deuxième plus petite a pour espérance \\(2/6\\), et \\(4/6 + 2/6 = 1\\).\n\nSimulation (script) : 0,6667.", "type": "qcm", "multiple": false, "reponse": "2/3", "fiche": null, "verif": {"script": "verif/seance_math_1.py", "cles": ["Q08_d_max_den", "Q08_d_max_num", "Q08_d_n_den", "Q08_d_n_num", "Q08_d_petit_den", "Q08_d_petit_num", "Q08_exact_den", "Q08_exact_num", "Q08_mc"]}}, {"id": "S1M-09", "section": "math", "theme": "Statistiques d'ordre, étendue", "difficulte": 4, "temps_cible_s": 120, "enonce": "Soient \\(V_1, \\dots, V_6\\) six variables aléatoires indépendantes de loi uniforme sur \\([0, 2]\\). Quelle est l'espérance de \\(\\max(V_1, \\dots, V_6) - \\min(V_1, \\dots, V_6)\\) ?", "options": [{"id": "a", "texte": "10/7", "correcte": true, "explication": "Oui : \\(2 \\times (n - 1)/(n + 1)\\) avec \\(n = 6\\)."}, {"id": "b", "texte": "5/7", "correcte": false, "explication": "C'est l'étendue moyenne de 6 uniformes sur \\([0, 1]\\), \\((n - 1)/(n + 1)\\). Sur \\([0, 2]\\), toutes les longueurs sont multipliées par 2."}, {"id": "c", "texte": "12/7", "correcte": false, "explication": "C'est l'espérance du maximum seul, \\(2 \\times 6/7\\). Il faut encore soustraire celle du minimum, \\(2 \\times 1/7\\)."}, {"id": "d", "texte": "5/3", "correcte": false, "explication": "C'est \\(2 \\times 5/6\\), avec le dénominateur \\(n\\) au lieu de \\(n + 1\\) : 6 points découpent l'intervalle en 7 morceaux."}], "solution": "Réponse : \\(\\tfrac{10}{7}\\).\n\nNotations : \\(U_j = V_j/2\\), qui sont indépendantes et uniformes sur \\([0, 1]\\) ; \\(n = 6\\).\n\nÉtape 1, mise à l'échelle : \\(V_j = 2\\,U_j\\), transformation croissante, donc \\(\\max_j V_j - \\min_j V_j = 2\\,(U_{(6)} - U_{(1)})\\).\n\nÉtape 2 : \\(\\mathbb{E}[U_{(6)}] = 6/7\\) et \\(\\mathbb{E}[U_{(1)}] = 1/7\\) (leçon, outil 3), donc par linéarité \\(\\mathbb{E}[U_{(6)} - U_{(1)}] = 5/7\\).\n\nÉtape 3 : \\(\\mathbb{E}[\\max - \\min] = 2 \\times 5/7 = \\tfrac{10}{7} \\approx 1{,}429\\).\n\nSimulation (script) : 1,429.", "type": "qcm", "multiple": false, "reponse": "10/7", "fiche": null, "verif": {"script": "verif/seance_math_1.py", "cles": ["Q09_d_echelle_den", "Q09_d_echelle_num", "Q09_d_max_den", "Q09_d_max_num", "Q09_d_n_den", "Q09_d_n_num", "Q09_exact", "Q09_exact_den", "Q09_exact_num", "Q09_mc"]}}, {"id": "S1M-10", "section": "math", "theme": "Statistiques d'ordre, loi jointe du minimum et du maximum", "difficulte": 3, "temps_cible_s": 90, "enonce": "Soient \\(U_1, \\dots, U_4\\) quatre variables aléatoires indépendantes de loi uniforme sur \\([0, 1]\\). Quelle est la probabilité que leur minimum soit supérieur ou égal à 0,2 **et** que leur maximum soit inférieur ou égal à 0,9, arrondie à quatre décimales ?", "options": [{"id": "a", "texte": "0,2401", "correcte": true, "explication": "Oui : les quatre valeurs doivent toutes tomber dans \\([0{,}2 ; 0{,}9]\\), de longueur \\(0{,}7\\)."}, {"id": "b", "texte": "0,2687", "correcte": false, "explication": "C'est \\(\\mathbb{P}(\\max \\le 0{,}9) \\times \\mathbb{P}(\\min \\ge 0{,}2) = 0{,}9^4 \\times 0{,}8^4\\) : ce produit suppose le minimum et le maximum indépendants, ce qu'ils ne sont pas. Le bon calcul porte sur l'événement joint."}, {"id": "c", "texte": "0,6545", "correcte": false, "explication": "C'est \\(0{,}9^4 - 0{,}2^4 = \\mathbb{P}(0{,}2 < \\max \\le 0{,}9)\\) : cet événement ne contraint que le maximum, et laisse le minimum descendre sous 0,2."}, {"id": "d", "texte": "0,7000", "correcte": false, "explication": "C'est la probabilité qu'**une** variable tombe dans \\([0{,}2 ; 0{,}9]\\). Les quatre doivent y tomber, indépendamment : il faut la puissance 4."}], "solution": "Réponse : \\(0{,}7^4 = 0{,}2401\\).\n\nÉtape 1 : « minimum au moins 0,2 et maximum au plus 0,9 » équivaut à « chacune des quatre valeurs est dans \\([0{,}2 ; 0{,}9]\\) ».\n\nÉtape 2 : chaque \\(U_j\\) y tombe avec probabilité \\(0{,}9 - 0{,}2 = 0{,}7\\).\n\nÉtape 3 : par indépendance, \\(\\mathbb{P} = 0{,}7^4 = 0{,}2401\\).\n\nPiège visé : le minimum et le maximum ne sont pas indépendants ; on ne multiplie pas leurs probabilités, on traduit l'événement joint en une condition sur chaque variable (leçon, outil 3, piège 3). Simulation (script) : 0,2395.", "type": "qcm", "multiple": false, "reponse": "0,2401", "fiche": null, "verif": {"script": "verif/seance_math_1.py", "cles": ["Q10_d_diff", "Q10_d_indep", "Q10_d_un", "Q10_exact", "Q10_largeur", "Q10_mc", "Q10_q_min"]}}, {"id": "S1M-11", "section": "math", "theme": "Tests multiples, complémentaire, approximation", "difficulte": 3, "temps_cible_s": 90, "enonce": "Un chercheur teste 200 signaux, dont aucun n'a d'effet réel. Les 200 tests sont indépendants et chacun est réalisé au niveau 0,5 % : un test dont l'hypothèse nulle est vraie la rejette avec probabilité exactement 0,005.\n\nQuelle est la probabilité qu'au moins un des 200 tests rejette son hypothèse nulle, arrondie à deux décimales ?", "options": [{"id": "a", "texte": "0,63", "correcte": true, "explication": "Oui : \\(1 - 0{,}995^{200}\\), que l'on approche sans calculatrice par \\(1 - e^{-1}\\)."}, {"id": "b", "texte": "1,00", "correcte": false, "explication": "C'est \\(200 \\times 0{,}005\\), l'espérance du nombre de rejets et la borne de Boole : un majorant, ici sans information, pas la probabilité. Aucun rejet reste possible, avec probabilité \\(0{,}995^{200} \\approx 0{,}37\\)."}, {"id": "c", "texte": "0,37", "correcte": false, "explication": "C'est \\(0{,}995^{200}\\), la probabilité qu'aucun test ne rejette : le complémentaire de l'événement demandé."}, {"id": "d", "texte": "0,005", "correcte": false, "explication": "C'est le niveau d'un seul test. Avec 200 tests, les occasions de rejeter à tort se multiplient."}], "solution": "Réponse : \\(1 - 0{,}995^{200} \\approx 0{,}633\\), soit 0,63 à deux décimales.\n\nÉtape 1, complémentaire : « au moins un rejet » est le contraire de « aucun rejet ».\n\nÉtape 2, indépendance : chaque test ne rejette pas avec probabilité 0,995, donc aucun ne rejette avec probabilité \\(0{,}995^{200}\\).\n\nÉtape 3, calcul rapide : \\(m = 200\\), \\(p = 0{,}005\\), \\(mp = 1\\). L'encadrement de la leçon (outil 4, valable pour \\(p \\le 1/2\\)) donne \\(1 - e^{-1} \\le 1 - 0{,}995^{200} \\le 1 - e^{-1} + m p^2 e^{-1}\\), avec \\(e^{-1} \\approx 0{,}368\\) et \\(m p^2 = 0{,}005\\). La vraie valeur est donc entre \\(0{,}6321\\) et \\(0{,}6340\\), et s'arrondit à 0,63 dans tous les cas.\n\nSimulation (script) : 0,633.", "type": "qcm", "multiple": false, "reponse": "0,63", "fiche": null, "verif": {"script": "verif/seance_math_1.py", "cles": ["Q11_aucun", "Q11_d_boole", "Q11_d_un", "Q11_e_moins_un", "Q11_exact", "Q11_haut", "Q11_mc", "Q11_mp", "Q11_mp2", "Q11_poisson", "Q11_q"]}}, {"id": "S1M-12", "section": "math", "theme": "Tests multiples, Bonferroni et dépendance", "difficulte": 4, "temps_cible_s": 120, "enonce": "On teste 25 hypothèses nulles, toutes vraies. Chaque test \\(j\\) fournit une p-value \\(P_j\\) de loi uniforme sur \\([0, 1]\\), et le test \\(j\\) au niveau \\(t\\) rejette son hypothèse nulle si \\(P_j \\le t\\) ; il la rejette donc à tort avec probabilité exactement \\(t\\). La dépendance entre les 25 p-values est inconnue et peut être quelconque.\n\nOn veut un niveau commun \\(t\\), le même pour les 25 tests, qui garantisse, **quelle que soit cette dépendance**, que la probabilité d'au moins un rejet est au plus 0,05. Quelle affirmation est vraie ?", "options": [{"id": "a", "texte": "\\(t = 0{,}002\\) le garantit ; \\(t = 1 - 0{,}95^{1/25} \\approx 0{,}00205\\) ne le garantit pas.", "correcte": true, "explication": "Oui : Boole garantit le premier niveau ; des rejets disjoints mettent le second en défaut."}, {"id": "b", "texte": "Les deux niveaux \\(0{,}002\\) et \\(1 - 0{,}95^{1/25} \\approx 0{,}00205\\) le garantissent ; le second est préférable car moins strict.", "correcte": false, "explication": "Le niveau de Šidák donne exactement 0,05 sous indépendance, mais pas pour toute dépendance. Contre-exemple : \\(U\\) uniforme sur \\([0, 1[\\) et \\(P_j\\) la partie fractionnaire de \\(U - (j - 1)\\,t\\). Chaque \\(P_j\\) est uniforme, le test \\(j\\) rejette exactement quand \\(U\\) tombe dans \\([(j-1)\\,t, j\\,t]\\), et ces intervalles ne se chevauchent qu'en des points, de probabilité nulle. La probabilité d'au moins un rejet vaut alors \\(25\\,t \\approx 0{,}0512\\), plus que 0,05."}, {"id": "c", "texte": "Aucun niveau commun ne peut le garantir sans connaître la dépendance.", "correcte": false, "explication": "La borne de Boole donne une garantie sans aucune hypothèse de dépendance : la probabilité d'au moins un rejet est au plus \\(25\\,t\\), qui vaut 0,05 pour \\(t = 0{,}002\\)."}, {"id": "d", "texte": "\\(t = 0{,}05\\) le garantit, puisque chaque test pris seul ne rejette à tort qu'avec probabilité 0,05.", "correcte": false, "explication": "Le niveau de chaque test ne borne pas la probabilité d'au moins un rejet : par exemple, sous indépendance, elle vaut \\(1 - 0{,}95^{25} \\approx 0{,}723\\)."}], "solution": "Réponse : le niveau de Bonferroni, \\(0{,}05/25 = 0{,}002\\), le garantit ; le niveau de Šidák, \\(1 - 0{,}95^{1/25} \\approx 0{,}00205\\), ne le garantit pas.\n\nÉtape 1, Bonferroni : par la borne de Boole, qui ne demande aucune indépendance, \\(\\mathbb{P}(\\text{au moins un rejet}) \\le \\sum_{j=1}^{25} \\mathbb{P}(P_j \\le t) = 25\\,t\\), égal à 0,05 pour \\(t = 0{,}002\\).\n\nÉtape 2, une dépendance défavorable : soit \\(U\\) uniforme sur \\([0, 1[\\) et \\(P_j\\) la partie fractionnaire de \\(U - (j-1)\\,t\\). Un décalage modulo 1 d'une uniforme est uniforme, donc chaque test est valide. Pour \\(25\\,t \\le 1\\), le test \\(j\\) rejette exactement quand \\(U\\) est dans \\([(j-1)\\,t, j\\,t]\\) : à des points près, de probabilité nulle, les rejets sont disjoints, et \\(\\mathbb{P}(\\text{au moins un rejet}) = 25\\,t\\).\n\nÉtape 3 : avec le niveau de Šidák, cela donne \\(25\\,t \\approx 0{,}0512 > 0{,}05\\). Plus généralement, tout niveau commun \\(t > 0{,}002\\) échoue pour cette dépendance : \\(0{,}002\\) est le plus grand niveau commun garanti.\n\nLien avec la leçon (outil 4, cas limites) : le niveau de Šidák rend la probabilité exactement égale à 0,05 sous indépendance, mais il dépasse \\(\\alpha/m\\) et n'est garanti que sous cette hypothèse. Simulation de la construction (script) : 0,0511.", "type": "qcm", "multiple": false, "reponse": "\\(t = 0{,}002\\) le garantit ; \\(t = 1 - 0{,}95^{1/25} \\approx 0{,}00205\\) ne le garantit pas.", "fiche": null, "verif": {"script": "verif/seance_math_1.py", "cles": ["Q12_bonf", "Q12_disjoint_sidak_mc", "Q12_fwer_005_indep", "Q12_fwer_sidak_disjoint", "Q12_q", "Q12_sidak"]}}]}]}</script>
<script>
'use strict';
const D = JSON.parse(document.getElementById('donnees').textContent);
const ITEMS = D.sections.flatMap(s => s.questions.map(q => Object.assign({ nomSection: s.nom }, q)));
const CLE = 'atelier-quant:' + D.id;
const SERVEUR = location.protocol.startsWith('http');
// La session survit à un rechargement de l'onglet : on se reconnecte alors au même noyau, variables comprises.
const SESSION = (() => { const neuve = Math.random().toString(36).slice(2) + Date.now().toString(36); try { const s = sessionStorage.getItem('atelier-quant:session') || neuve; sessionStorage.setItem('atelier-quant:session', s); return s; } catch (e) { return neuve; } })();
const page = document.getElementById('page');
const noyauxDemarres = {};
let E = etatNeuf('accueil');

function etatNeuf(phase) { return { phase, courant: 0, debut: null, fin: null, reponses: {}, temps: {}, ordre: {}, cellules: {}, code: {}, controles: {}, ordreControles: {}, vus: {}, partie: {}, enregistrement: null, pauseDepuis: null, pauseTotale: 0 }; }
// Options par défaut : la pause et « Je ne sais pas » sont permis, sauf si l'examen les interdit (examens blancs).
const PAUSE_PERMISE = D.options.pause !== false;
const NSP_PERMIS = D.options.je_ne_sais_pas !== false;
function dureeEcoulee(fin) { return (fin - E.debut - (E.pauseTotale || 0) - (E.pauseDepuis ? fin - E.pauseDepuis : 0)) / 1000; }
const NOTEES = ITEMS.filter(q => q.type !== 'lecon');
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(E)); } catch (e) {} }
function charger() { try { const s = localStorage.getItem(CLE); if (s) E = Object.assign(etatNeuf('accueil'), JSON.parse(s)); } catch (e) {} }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function enLigne(t) { return esc(t).replace(/`([^`]+)`/g, '<code class="sans-math">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

// Markdown réduit : titres #, tableaux |, listes - et 1., paragraphes, `code`, **gras**, blocs entre triples accents graves.
function rendre(t) {
  let h = '';
  String(t).split('```').forEach((bloc, i) => {
    if (i % 2) {
      const info = (bloc.match(/^(\w*)\n/) || [])[1];
      h += '<pre class="sans-math' + (info === 'sortie' ? ' sortie-lecon' : '') + '"><code>' + esc(bloc.replace(/^\w*\n/, '')) + '</code></pre>';
      return;
    }
    const lignes = bloc.split('\n');
    let k = 0;
    while (k < lignes.length) {
      const l = lignes[k];
      if (!l.trim()) { k++; continue; }
      const titre = l.match(/^(#{1,4})\s+(.*)$/);
      if (titre) { const n = Math.min(4, titre[1].length + 1); h += '<h' + n + '>' + enLigne(titre[2]) + '</h' + n + '>'; k++; continue; }
      if (l.trim().startsWith('|')) {
        const rangs = [];
        while (k < lignes.length && lignes[k].trim().startsWith('|')) { rangs.push(lignes[k].trim()); k++; }
        const cellules = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
        h += '<div class="defile"><table><tr>' + cellules(rangs[0]).map(c => '<th>' + enLigne(c) + '</th>').join('') + '</tr>';
        rangs.slice(1).filter(r => !/^\|[\s|:-]+\|$/.test(r)).forEach(r => { h += '<tr>' + cellules(r).map(c => '<td>' + enLigne(c) + '</td>').join('') + '</tr>'; });
        h += '</table></div>'; continue;
      }
      const puce = /^\s*[-*]\s+/, numero = /^\s*\d+\.\s+/;
      if (puce.test(l) || numero.test(l)) {
        const motif = puce.test(l) ? puce : numero, balise = motif === puce ? 'ul' : 'ol';
        h += '<' + balise + '>';
        while (k < lignes.length && motif.test(lignes[k])) { h += '<li>' + enLigne(lignes[k].replace(motif, '')) + '</li>'; k++; }
        h += '</' + balise + '>'; continue;
      }

      while (k < lignes.length && lignes[k].trim() && !/^(#{1,4}\s|\s*\||\s*[-*]\s|\s*\d+\.\s)/.test(lignes[k])) { par.push(lignes[k]); k++; }

      const seule = texte.startsWith('\\(') && texte.endsWith('\\)') && texte.indexOf('\\(', 2) < 0;

function rendreLecon(q) {

  const genre = t => /preuve/i.test(t) ? 'preuve' : /pi[èe]ge/i.test(t) ? 'pieges' : /exemple|exp[ée]rience/i.test(t) ? 'exemple'
    : /[ée]nonc[ée]/i.test(t) ? 'enonce-bloc' : /intuition/i.test(t) ? 'intuition' : /probl[èe]me/i.test(t) ? 'probleme'

  h += '</nav>';

    h += '<section class="partie" data-partie="' + k + '"' + (k === courante ? '' : ' hidden') + '>';

    p.noeuds.forEach(n => {

        else h += '<div class="bloc ' + g + '"><h4>' + esc(n.textContent) + '</h4>';

// Une question du débrief : en-tête (numéro, titre, verdict), énoncé, réponses côte à côte, rubriques, à retenir.
function ficheDebrief(titre, noeuds) {
  const m = titre.match(/^(Question \d+)\s*:?\s*(.*)$/);
  const gras = n => n.nodeName === 'P' && n.firstChild && n.firstChild.nodeName === 'STRONG' ? n.firstChild.textContent.trim() : '';
  const reste = n => { const c = n.cloneNode(true); c.removeChild(c.firstChild); return c.innerHTML.trim(); };
  let enonce = '', ta = null, attendue = null, verdict = '', corps = '', retenir = '', revoir = '', etat = 'enonce';
  noeuds.forEach(n => {
    const g = gras(n), html = n.outerHTML !== undefined ? n.outerHTML : esc(n.textContent);
    if (/^Ta réponse/.test(g)) { ta = reste(n); etat = 'corps'; }
    else if (/^Réponse attendue/.test(g)) { attendue = reste(n); etat = 'corps'; }
    else if (/^Verdict/.test(g)) { verdict = reste(n); etat = 'corps'; }
    else if (/^À retenir/.test(g)) { retenir = '<h5>À retenir</h5><p>' + reste(n) + '</p>'; etat = 'retenir'; }
    else if (/^Leçon à revoir/.test(g)) { revoir = reste(n); etat = 'fin'; }
    else if (g && n.textContent.trim() === g) { corps += '<h5>' + esc(g.replace(/[.:]\s*$/, '')) + '</h5>'; etat = 'corps'; }
    else if (etat === 'enonce') enonce += n.nodeName === 'P' && /^Type :/.test(n.textContent) ? '<p class="meta">' + n.innerHTML + '</p>' : n.nodeName === 'UL' ? '<ul class="choix">' + n.innerHTML + '</ul>' : html;
    else if (etat === 'retenir') retenir += html;
    else corps += html;
  });
  const brut = verdict.replace(/<[^>]+>/g, '').trim();
  const v = /^juste/i.test(brut) ? ['v-juste', 'Juste'] : /^fausse/i.test(brut) ? ['v-fausse', 'Fausse'] : /^incompl/i.test(brut) ? ['v-incomplete', 'Incomplète']
    : /^non visible/i.test(brut) ? ['', 'Réponse non visible'] : ['', ''];
  const suite = brut.replace(/^[^.]*\.\s*/, '');
  let h = '<article class="fiche ' + v[0] + '"><header class="fiche-tete"><span class="num">' + esc(m[1]) + '</span><span class="titre">' + esc(m[2]) + '</span>'
    + (v[1] ? '<span class="verdict">' + v[1] + '</span>' : '') + '</header><div class="fiche-corps">';
  if (ta === null && attendue === null) return h + enonce + corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '') + '</div></article>';
  h += '<h5>Énoncé</h5>' + enonce;
  h += '<div class="fiche-reponses">' + (ta === null ? '' : '<div><span class="lab">Ta réponse</span>' + ta + '</div>') + '<div><span class="lab">Réponse attendue</span>' + (attendue || '') + '</div></div>';
  if (suite) h += '<p class="meta">' + verdict.replace(/^[^.]*\.\s*/, '') + '</p>';
  h += corps + (retenir ? '<div class="retenir">' + retenir + '</div>' : '') + (revoir ? '<p class="revoir">Leçon à revoir : ' + revoir + '</p>' : '');
  return h + '</div></article>';
}

  try { v = await api(reconnexion ? '/api/connecter' : '/api/redemarrer', { session: SESSION, dossier: q.dossier }); }
  catch (e) { v = null; }
  if (!v) noyauxDemarres[q.id] = 'noyau injoignable : le serveur lancer.py est-il démarré ?';
  else {
    const etat = v.neuf ? 'noyau neuf' : 'noyau reconnecté, variables conservées';
    noyauxDemarres[q.id] = v.erreur ? 'noyau : ' + v.erreur : etat + ' · Python ' + v.python + ' · pandas ' + v.pandas + ' · numpy ' + v.numpy;
    if (v.neuf) (E.cellules[q.id] || []).forEach(c => c.numero = null);

function rendreSortie(c) { return c.sortie || ''; }

// ------------------------------------------------------------------ éditeur
// Monaco (l'éditeur de VS Code) depuis cdnjs ; les suggestions, signatures et aides viennent de jedi
// dans le noyau, qui connaît les variables déjà exécutées. Sans connexion, repli sur une zone de texte simple.
const MONACO_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min';
let MONACO = null, promesseMonaco = null;
const EDITEURS = [];
window.EDITEURS = EDITEURS;
// Monaco annule ses tâches en cours quand on ferme un éditeur ; cette annulation n'est pas une erreur.
window.addEventListener('unhandledrejection', ev => { if (ev.reason && ev.reason.name === 'Canceled') ev.preventDefault(); });
function sombre() { return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; }
function questionCode() { const q = ITEMS[E.courant]; return E.phase === 'epreuve' && q && q.cellules_initiales ? q : null; }
function chargerMonaco() {
  if (promesseMonaco) return promesseMonaco;
  promesseMonaco = new Promise(resolve => {
    const abandon = setTimeout(() => fini(null), 20000);
    function fini(m) { clearTimeout(abandon); if (window.MODE_EDITEUR === undefined) { MONACO = m; window.MODE_EDITEUR = m ? 'monaco' : 'simple'; } resolve(MONACO); }
    const s = document.createElement('script');
    s.src = MONACO_BASE + '/vs/loader.js';
    s.onerror = () => fini(null);
    s.onload = () => {
      window.MonacoEnvironment = { getWorkerUrl: () => 'data:text/javascript;charset=utf-8,' + encodeURIComponent("self.MonacoEnvironment={baseUrl:'" + MONACO_BASE + "/'};importScripts('" + MONACO_BASE + "/vs/base/worker/workerMain.js');") };
      window.require.config({ paths: { vs: MONACO_BASE + '/vs' } });
      window.require(['vs/editor/editor.main'], () => { try { configurerMonaco(window.monaco); fini(window.monaco); } catch (e) { fini(null); } }, () => fini(null));
    };
    document.head.appendChild(s);
  });
  return promesseMonaco;
}
async function aide(type, model, position) {
  const q = questionCode();
  if (!q || !SERVEUR) return null;
  try { return await api('/api/' + type, { session: SESSION, dossier: q.dossier, code: model.getValue(), ligne: position.lineNumber, colonne: position.column - 1 }); }
  catch (e) { return null; }
}
function configurerMonaco(m) {
  const K = m.languages.CompletionItemKind;
  const genres = { module: K.Module, class: K.Class, instance: K.Variable, function: K.Function, param: K.Variable, path: K.File, keyword: K.Keyword, property: K.Property, statement: K.Variable };
  m.languages.registerCompletionItemProvider('python', {
    triggerCharacters: ['.'],
    provideCompletionItems: async (model, position) => {
      const r = await aide('completer', model, position);
      if (!r || !r.completions) return { suggestions: [] };
      const mot = model.getWordUntilPosition(position);
      const plage = new m.Range(position.lineNumber, mot.startColumn, position.lineNumber, mot.endColumn);
      return { suggestions: r.completions.map((c, k) => ({ label: c.nom, kind: genres[c.type] ?? K.Variable, insertText: c.nom, detail: c.description, range: plage, sortText: String(k).padStart(4, '0') })) };
    }
  });
  m.languages.registerSignatureHelpProvider('python', {
    signatureHelpTriggerCharacters: ['(', ','],
    provideSignatureHelp: async (model, position) => {
      const r = await aide('signatures', model, position);
      if (!r || !r.signatures || !r.signatures.length) return null;
      return { value: { signatures: r.signatures.map(x => ({ label: x.texte, documentation: x.doc, parameters: x.parametres.map(p => ({ label: p })) })), activeSignature: 0, activeParameter: r.signatures[0].index ?? 0 }, dispose() {} };
    }
  });
  m.languages.registerHoverProvider('python', {
    provideHover: async (model, position) => {
      const r = await aide('aide', model, position);
      if (!r || !r.aide || !r.aide.length) return null;
      return { contents: r.aide.map(a => ({ value: '```text\n' + a.doc + '\n```' })) };
    }
  });
}
function creerEditeur(conteneur, code, rappels) {
  if (MONACO) {
    const m = MONACO;
    const ed = m.editor.create(conteneur, {
      value: code, language: 'python', theme: sombre() ? 'vs-dark' : 'vs', fontSize: 14, tabSize: 4, insertSpaces: true,
      minimap: { enabled: false }, scrollBeyondLastLine: false, automaticLayout: true, lineNumbersMinChars: 3, folding: false,
      glyphMargin: false, renderLineHighlight: 'none', overviewRulerLanes: 0, wordBasedSuggestions: 'off', fixedOverflowWidgets: true,
      quickSuggestions: { other: true, comments: false, strings: false }, padding: { top: 6, bottom: 6 },
      scrollbar: { alwaysConsumeMouseWheel: false, vertical: 'hidden', horizontalScrollbarSize: 8 }
    });
    // Sous Windows, Monaco utilise des fins de ligne \r\n ; le code est toujours lu avec des \n, comme dans un notebook.
    const lire = () => ed.getModel().getValue(m.editor.EndOfLinePreference.LF);
    const hauteur = () => { conteneur.style.height = Math.max(38, ed.getContentHeight()) + 'px'; };
    ed.onDidContentSizeChange(hauteur); hauteur();
    ed.onDidChangeModelContent(() => rappels.modif(lire()));
    ed.onDidFocusEditorText(rappels.focus);
    ed.addCommand(m.KeyMod.Shift | m.KeyCode.Enter, rappels.executerSuivant, '!suggestWidgetVisible');
    ed.addCommand(m.KeyMod.CtrlCmd | m.KeyCode.Enter, rappels.executer, '!suggestWidgetVisible');
    return { brut: ed, getValue: lire, setValue: v => ed.setValue(v), focus: () => ed.focus(), dispose: () => ed.dispose() };
  }
  const zone = document.createElement('textarea');
  zone.spellcheck = false; zone.autocomplete = 'off'; zone.className = 'sans-math';
  zone.value = code;
  conteneur.appendChild(zone);
  zone.addEventListener('input', () => { rappels.modif(zone.value); ajuster(zone); });
  zone.addEventListener('focus', rappels.focus);
  zone.addEventListener('keydown', ev => clavier(ev, zone, rappels));
  setTimeout(() => ajuster(zone));
  return { brut: zone, getValue: () => zone.value, setValue: v => { zone.value = v; zone.dispatchEvent(new Event('input')); }, focus: () => zone.focus(), dispose: () => {} };
}
function libererEditeurs() { EDITEURS.forEach(e => e.dispose()); EDITEURS.length = 0; }

function dessinerCellules(q) {
  const conteneur = document.getElementById('cellules');
  if (!conteneur) return;
  if (SERVEUR && window.MODE_EDITEUR === undefined) {
    conteneur.innerHTML = '<p class="meta">Chargement de l\'éditeur...</p>';
    chargerMonaco().then(() => { if (questionCode() === q) dessinerCellules(q); });
    return;
  }
  libererEditeurs();
  conteneur.innerHTML = '';
  const etat = document.getElementById('modeEditeur');
  if (etat) etat.textContent = MONACO ? 'éditeur VS Code, autocomplétion' : 'éditeur simple' + (SERVEUR ? ' (Monaco injoignable)' : '');
  E.cellules[q.id].forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'cellule';
    div.innerHTML = '<div class="numero">[' + (c.numero === null ? ' ' : c.numero) + ']</div><div><div class="editeur"></div>'
      + '<div class="actions"><button data-a="executer">Exécuter</button><button data-a="dessous">Insérer dessous</button><button data-a="supprimer">Supprimer</button></div>'
      + '<pre class="sortie sans-math"></pre></div>';
    div.querySelector('pre.sortie').innerHTML = rendreSortie(c);
    conteneur.appendChild(div);
    EDITEURS.push(creerEditeur(div.querySelector('.editeur'), c.code, {
      modif: v => { c.code = v; sauver(); },
      focus: () => { conteneur.querySelectorAll('.cellule').forEach(x => x.classList.remove('active')); div.classList.add('active'); },
      executer: () => executerCellule(q, i),
      executerSuivant: () => {
        executerCellule(q, i);
        if (i === E.cellules[q.id].length - 1) { E.cellules[q.id].push({ code: '', sortie: '', numero: null }); sauver(); dessinerCellules(q); }
        focaliser(i + 1);
      }
    }));
    div.querySelector('[data-a=executer]').onclick = () => executerCellule(q, i);
    div.querySelector('[data-a=dessous]').onclick = () => { E.cellules[q.id].splice(i + 1, 0, { code: '', sortie: '', numero: null }); sauver(); dessinerCellules(q); focaliser(i + 1); };
    div.querySelector('[data-a=supprimer]').onclick = () => { if (E.cellules[q.id].length > 1) { E.cellules[q.id].splice(i, 1); sauver(); dessinerCellules(q); } };
  });
}
function majNumeros(q) { document.querySelectorAll('#cellules .numero').forEach((n, i) => { const c = E.cellules[q.id][i]; n.textContent = '[' + (c && c.numero !== null ? c.numero : ' ') + ']'; }); }
function ajuster(zone) { zone.style.height = 'auto'; zone.style.height = (zone.scrollHeight + 2) + 'px'; }
function focaliser(i) { const e = EDITEURS[i]; if (e) e.focus(); }
function inserer(zone, texte) {
  zone.focus();
  if (!document.execCommand('insertText', false, texte)) zone.setRangeText(texte, zone.selectionStart, zone.selectionEnd, 'end');
  zone.dispatchEvent(new Event('input'));
}
function clavier(ev, zone, rappels) {
  if (ev.key === 'Enter' && (ev.shiftKey || ev.ctrlKey)) {
    ev.preventDefault();
    if (ev.shiftKey) rappels.executerSuivant(); else rappels.executer();
    return;
  }
  const debut = zone.selectionStart, fin = zone.selectionEnd, v = zone.value;
  const debutLigne = v.lastIndexOf('\n', debut - 1) + 1;
  if (ev.key === 'Tab') {
    ev.preventDefault();
    const multi = v.slice(debut, fin).includes('\n');
    if (!ev.shiftKey && !multi) { inserer(zone, '    '); return; }
    const finBloc = fin;
    const bloc = v.slice(debutLigne, finBloc);
    const nouveau = ev.shiftKey ? bloc.replace(/^ {1,4}/gm, '') : bloc.replace(/^/gm, '    ');
    zone.setSelectionRange(debutLigne, finBloc);
    inserer(zone, nouveau);
    zone.setSelectionRange(debutLigne, debutLigne + nouveau.length);
    return;
  }
  if (ev.key === 'Enter' && !ev.altKey && !ev.metaKey) {
    ev.preventDefault();
    const ligne = v.slice(debutLigne, debut);
    let retrait = ligne.match(/^ */)[0];
    if (/:\s*(#.*)?$/.test(ligne)) retrait += '    ';
    inserer(zone, '\n' + retrait);
  }
}

async function executerCellule(q, i) {
  if (!SERVEUR) return false;
  const c = E.cellules[q.id][i];
  const div = document.querySelectorAll('#cellules .cellule')[i];
  if (div) { div.querySelector('.numero').textContent = '[*]'; div.querySelector('pre.sortie').innerHTML = ''; }
  let r;
  try { r = await api('/api/executer', { session: SESSION, dossier: q.dossier, code: c.code, nom: 'cellule ' + (i + 1) }); }
  catch (e) { r = { erreur: 'Serveur injoignable : lancer.py est-il démarré ?' }; }
  E.compteur = (E.compteur || 0) + 1;
  c.numero = E.compteur;
  let h = '';
  if (r.sortie) h += esc(r.sortie);
  if (r.valeur !== null && r.valeur !== undefined) h += (h && !h.endsWith('\n') ? '\n' : '') + esc(r.valeur);
  if (r.erreur) h += (h && !h.endsWith('\n') ? '\n' : '') + '<span class="erreur">' + esc(r.erreur) + '</span>';
  if (r.redemarre) { noyauxDemarres[q.id] = 'noyau redémarré : variables perdues'; const z = document.getElementById('versions'); if (z) z.textContent = noyauxDemarres[q.id]; }
  c.sortie = h;
  sauver();
  const d = document.querySelectorAll('#cellules .cellule')[i];
  if (d) { d.querySelector('.numero').textContent = '[' + c.numero + ']'; d.querySelector('pre.sortie').innerHTML = h; }
  return !r.erreur;
}

function codeSource(q) { return E.cellules[q.id].map((c, i) => '# %% cellule ' + (i + 1) + '\n' + c.code).join('\n\n') + '\n'; }
function afficherEtatSoumission(q) {

// ------------------------------------------------------------------ bilan
function points(q) {
  if (q.type === 'code') { const c = E.code[q.id]; return c && c.soumissions ? c.caches_reussis / c.caches_total : 0; }
  const r = E.reponses[q.id];
  if (r === undefined || r === 'nsp') return 0;
  // Une question à plusieurs réponses est notée tout ou rien : l'ensemble coché doit être exactement l'ensemble juste.
  const s = choisies(q), bonnes = q.options.filter(o => o.correcte).map(o => o.id);
  return s.length === bonnes.length && bonnes.every(b => s.includes(b)) ? 1 : -D.options.penalite;
}
function choisies(q) { const r = E.reponses[q.id]; return r === undefined || r === 'nsp' ? [] : Array.isArray(r) ? r.slice() : [r]; }
function texteOption(q, id) { const o = q.options.find(x => x.id === id); return o ? o.texte : null; }

function resultatJSON(duree) {
  return {
    examen: D.id, debut: new Date(E.debut).toISOString(), duree_s: Math.round(duree), pauses_s: Math.round((E.pauseTotale || 0) / 1000), options: D.options,
    lecons: ITEMS.filter(q => q.type === 'lecon').map(q => {
      const ids = Object.keys(q.controles || {});
      const justes = ids.filter(cid => { const c = E.controles[q.id + ':' + cid]; return c && q.controles[cid].options.find(o => o.id === c).correcte; }).length;
      return { id: q.id, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), controles_justes_du_premier_coup: justes, controles_total: ids.length };
    }),
    questions: NOTEES.map(q => {
      const base = { id: q.id, type: q.type, section: q.section, theme: q.theme, temps_s: Math.round(E.temps[q.id] || 0), temps_cible_s: q.temps_cible_s, points: Number(points(q).toFixed(4)) };
      if (q.type === 'code') {
        const c = E.code[q.id] || {};
        return Object.assign(base, { soumissions: c.soumissions || 0, caches_reussis: c.caches_reussis || 0, caches_total: c.caches_total || q.tests_caches, visibles_reussis: c.visibles_reussis ?? null, code_source: c.code_source || codeSource(q) });
      }
      const r = E.reponses[q.id] ?? null;
      return Object.assign(base, { reponse: r, reponse_texte: r && r !== 'nsp' ? choisies(q).map(i => texteOption(q, i)).join(' ; ') : null, bonne_reponse_texte: q.options.filter(o => o.correcte).map(o => o.texte).join(' ; ') });
    })
  };
}

function bilan() {
  page.className = '';

  h += '<div class="barre">' + (SERVEUR ? '<button class="principal" id="retourAccueil">Retour à l\'accueil (séance suivante)</button>' : '')

  ITEMS.forEach((q, i) => {

      + '</span><span class="temps">' + esc(q.nomSection) + ' · ' + temps + '</span>' + (verdict ? '<span class="verdict">' + verdict + '</span>' : '') + '</header><div class="fiche-corps">';
    if (q.type === 'lecon') {
      const ids = Object.keys(q.controles || {});

      h += tete('', '') + '<p>Points de contrôle justes du premier coup : ' + justes + ' sur ' + ids.length + '. La leçon reste consultable depuis la séance.</p></div></article>';
      return;
    }
    if (q.type === 'qcm') {
      const r = E.reponses[q.id], juste = points(q) === 1;
      const s = choisies(q), incomplete = !juste && q.multiple && s.length > 0 && s.every(id => q.options.find(o => o.id === id).correcte);
      h += tete(juste ? 'v-juste' : incomplete ? 'v-incomplete' : r === undefined || r === 'nsp' ? '' : 'v-fausse',
        juste ? 'Juste' : r === undefined ? 'Sans réponse' : r === 'nsp' ? 'Je ne sais pas' : incomplete ? 'Incomplète' : 'Fausse');

      E.ordre[q.id].forEach((oid, k) => {
        const o = q.options.find(x => x.id === oid), choisie = s.includes(oid);
        const puces = (o.correcte ? '<span class="puce bon">' + (q.multiple ? 'Juste' : 'Bonne réponse') + '</span>' : '') + (choisie ? '<span class="puce' + (o.correcte ? ' bon' : ' faux') + '">Ta réponse</span>' : '');
        h += '<div class="option ' + (o.correcte ? 'juste' : 'fausse') + (choisie ? ' choisie' : '') + '"><span class="lettre">' + 'ABCDE'[k] + '</span><div>' + puces + rendre(o.texte)
          + '<div class="explication">' + (o.correcte && !q.multiple ? '' : rendre(o.explication)) + '</div></div></div>';
      });
      h += '<h5>Correction</h5>' + rendre(q.solution);
    } else {

      const tout = c.soumissions && c.caches_reussis === c.caches_total;
      h += tete(tout ? 'v-juste' : c.soumissions ? 'v-incomplete' : '', c.soumissions ? c.caches_reussis + ' / ' + c.caches_total + ' tests cachés' : 'Jamais soumis');
      h += '<details><summary>Énoncé</summary>' + rendre(q.enonce) + '</details>';
      if (c.details) {
        h += '<h5>Tests cachés</h5><div class="defile"><table><tr><th>Test caché</th><th>Résultat</th><th>Attendu</th><th>Obtenu</th></tr>';
        c.details.forEach(t => { h += '<tr><td>' + esc(t.nom) + '</td><td class="' + (t.ok ? 'bon">réussi' : 'faux">échec') + '</td><td><code class="sans-math">' + esc(t.attendu) + '</code></td><td><code class="sans-math">' + esc(t.obtenu ?? (t.erreur ? 'exception' : '')) + '</code></td></tr>'; });
        h += '</table></div>';
        c.details.filter(t => t.erreur).forEach(t => { h += '<details><summary>Erreur : ' + esc(t.nom) + '</summary><pre class="sans-math">' + esc(t.erreur) + '</pre></details>'; });
      }
      h += '<details><summary>Ton code soumis</summary><pre class="sans-math"><code>' + esc(c.code_source || codeSource(q)) + '</code></pre></details>';
      h += '<details><summary>Correction</summary>' + rendre(q.solution) + '</details>';
    }
    h += '<p class="revoir">Vérification des nombres : <code class="sans-math">' + esc(q.verif.script) + '</code></p></div></article>';
  });
  page.innerHTML = h;
  const resultat = resultatJSON(duree);
  const zone = document.getElementById('json');
  zone.value = JSON.stringify(resultat, null, 1);
  document.getElementById('telecharger').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([zone.value], { type: 'application/json' }));
    a.download = D.id + '_resultat.json'; a.click();
  };
  const retour = document.getElementById('retourAccueil'); if (retour) retour.onclick = () => { location.href = '/'; };
  document.getElementById('recommencer').onclick = () => { if (confirm('Effacer ce passage ?')) { try { localStorage.removeItem(CLE); } catch (e) {} E = etatNeuf('accueil'); afficher(); } };
  const info = document.getElementById('enregistrement');
  if (E.enregistrement) info.textContent = E.enregistrement;
  else if (!SERVEUR) info.textContent = 'Page ouverte comme un fichier : le résultat n\'est pas enregistré automatiquement. Copie le JSON ci-dessous dans la conversation.';
  else {
    info.textContent = 'Enregistrement du résultat...';
    api('/api/resultat', resultat).then(r => {
      E.enregistrement = r.erreur ? null : 'Résultat enregistré dans ' + r.fichier + ' ; ' + r.erreurs_ajoutees + ' erreur(s) ajoutée(s) au journal suivi/erreurs.md.';
      info.textContent = E.enregistrement || 'Échec de l\'enregistrement : ' + r.erreur;
      sauver();
    }).catch(() => { info.textContent = 'Serveur injoignable : le résultat n\'est pas enregistré. Copie le JSON ci-dessous dans la conversation.'; });
  }
  composer();
}

function afficher() {
  libererEditeurs();
  document.getElementById('titre').textContent = D.titre;
  document.title = D.titre;
  if (E.phase === 'epreuve') epreuve(); else if (E.phase === 'bilan') bilan(); else accueil();
  window.scrollTo(0, 0);
}
function completerEtat() {
  ['reponses', 'temps', 'ordre', 'cellules', 'code', 'controles', 'ordreControles', 'vus', 'partie'].forEach(k => { if (!E[k] || typeof E[k] !== 'object') E[k] = {}; });
  if (typeof E.courant !== 'number' || E.courant < 0 || E.courant >= ITEMS.length) E.courant = 0;
  ITEMS.forEach(q => {
    if (q.cellules_initiales && !Array.isArray(E.cellules[q.id])) E.cellules[q.id] = q.cellules_initiales.map(c => ({ code: c, sortie: '', numero: null }));
    if (q.type === 'qcm') {
      const ids = q.options.map(o => o.id);
      const o = E.ordre[q.id];
      if (!Array.isArray(o) || o.length !== ids.length || !ids.every(i => o.includes(i))) E.ordre[q.id] = melanger(ids);
      const rep = E.reponses[q.id];
      if (rep !== undefined && rep !== 'nsp' && (Array.isArray(rep) !== !!q.multiple || !choisies(q).length || !choisies(q).every(i => ids.includes(i)))) delete E.reponses[q.id];
    }
    if (q.type === 'lecon') Object.entries(q.controles || {}).forEach(([cid, c]) => {
      const cle = q.id + ':' + cid;
      if (!Array.isArray(E.ordreControles[cle])) E.ordreControles[cle] = melanger(c.options.map(o => o.id));
    });
  });
}
charger();
completerEtat();
if (SERVEUR && ITEMS.some(q => q.cellules_initiales)) chargerMonaco();
afficher();
</script>
