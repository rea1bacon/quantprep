 + k\\) et de paramètre \\(b + t\\) ; la constante est imposée par l'intégrale égale à 1. Moyenne et mode : partie 1. Enfin \\(\\tfrac{b}{b+t} \\cdot \\tfrac{a}{b} + \\tfrac{t}{b+t} \\cdot \\tfrac{k}{t} = \\tfrac{a + k}{b + t}\\).\n4. (B4) : le rapport des deux poids a posteriori vaut \\((\\lambda_j/\\lambda_i)^k e^{-(\\lambda_j - \\lambda_i)t}\\) ; il dépasse 1 si et seulement si \\(k\\,(\\ln \\lambda_j - \\ln \\lambda_i) > (\\lambda_j - \\lambda_i)\\,t\\).\n5. (B5) : \\((1/\\lambda) \\cdot \\lambda^k e^{-\\lambda t} = \\lambda^{k-1} e^{-\\lambda t}\\), noyau de la loi gamma de forme \\(k\\) et de paramètre \\(t\\) si \\(k \\ge 1\\). Si \\(k = 0\\), \\(e^{-\\lambda t}/\\lambda\\) n'est pas intégrable près de 0 : il n'y a pas de loi a posteriori.\n\n### Ce que veut dire un a priori impropre\n\n\\(\\int_0^\\infty d\\lambda/\\lambda\\) diverge, en 0 comme à l'infini : \\(1/\\lambda\\) n'est la densité d'aucune loi. C'est une convention, qui n'a de sens que par la loi a posteriori qu'elle produit, quand celle-ci est une vraie loi (ici dès que \\(k \\ge 1\\)). Trois lectures :\n\n- c'est la limite de la loi gamma de forme \\(a\\) et de paramètre \\(b\\) quand \\(a\\) et \\(b\\) tendent vers 0 : (B3) se lit « l'a priori vaut \\(a\\) événements fictifs observés pendant une durée fictive \\(b\\) », et ici il n'apporte aucun événement fictif ;\n- c'est la densité constante sur \\(\\ln \\lambda\\), puisque \\(d\\lambda/\\lambda = d(\\ln \\lambda)\\) : aucun ordre de grandeur de \\(\\lambda\\) n'est favorisé, et la forme \\(1/\\lambda\\) est conservée si l'on change d'unité de temps (\\(\\lambda\\) multiplié par une constante) ;\n- sur une **liste finie**, des poids proportionnels à \\(1/\\lambda_i\\) forment une loi a priori ordinaire une fois divisés par leur somme.\n\n| A priori | A posteriori, \\(k\\) événements en une durée \\(t\\) | Moyenne a posteriori | MAP |\n|---|---|---|---|\n| gamma de forme \\(a\\), de paramètre \\(b\\) | gamma de forme \\(a + k\\), de paramètre \\(b + t\\) | \\((a + k)/(b + t)\\) | \\((a + k - 1)/(b + t)\\) |\n| \\(1/\\lambda\\) (impropre), \\(k \\ge 1\\) | gamma de forme \\(k\\), de paramètre \\(t\\) | \\(k/t\\) | \\((k - 1)/t\\) |\n| constant (impropre) | gamma de forme \\(k + 1\\), de paramètre \\(t\\) | \\((k + 1)/t\\) | \\(k/t\\) |\n\nL'EMV \\(k/t\\) coïncide avec le MAP pour l'a priori constant, et avec la moyenne a posteriori pour l'a priori en \\(1/\\lambda\\).\n\n### Exemples calculés\n\n**Liste, deux a priori.** Intensités candidates 1, 2, 3 et 5 événements par heure ; on observe 5 événements en 2 heures (EMV \\(2{,}5\\)).\n\n- A priori uniforme sur la liste : poids \\(\\lambda^5 e^{-2\\lambda}\\), soit \\((0{,}135 ; 0{,}586 ; 0{,}602 ; 0{,}142)\\) ; probabilités a posteriori \\((0{,}092 ; 0{,}400 ; 0{,}411 ; 0{,}097)\\). Le MAP est 3. Les candidates 2 et 3 sont à la même distance de 2,5, mais leur moyenne logarithmique \\(1/\\ln(3/2) \\approx 2{,}466\\) est sous 2,5 : (B4) donne l'avantage à 3.\n- A priori proportionnel à \\(1/\\lambda\\) (poids \\((0{,}492 ; 0{,}246 ; 0{,}164 ; 0{,}098)\\)) : poids \\(\\lambda^4 e^{-2\\lambda}\\), soit \\((0{,}135 ; 0{,}293 ; 0{,}201 ; 0{,}028)\\) ; probabilités a posteriori \\((0{,}206 ; 0{,}446 ; 0{,}305 ; 0{,}043)\\). Le MAP est 2 : l'a priori a changé la réponse.\n\n**Le seuil n'est pas le milieu.** Candidates 2 et 6, poids égaux, 19 événements en 5 heures : le taux observé \\(3{,}8\\) est sous le milieu 4, donc plus proche de 2. Mais la moyenne logarithmique vaut \\(4/\\ln 3 \\approx 3{,}641 < 3{,}8\\) : 6 est la plus probable, avec un rapport des poids a posteriori de \\(3^{19} e^{-20} \\approx 2{,}40\\).\n\n**Conjugaison.** A priori gamma de forme 2 et de paramètre 1 par heure (moyenne 2, mode 1) ; on observe 7 événements en 3 heures. A posteriori : gamma de forme 9 et de paramètre 4. Moyenne \\(\\tfrac{9}{4} = \\tfrac14 \\times 2 + \\tfrac34 \\times \\tfrac73\\) (simulation : 2,253) ; MAP \\(8/4 = 2\\) ; EMV \\(7/3 \\approx 2{,}333\\). Trois estimations, trois nombres différents. Avec l'a priori en \\(1/\\lambda\\) : gamma de forme 7 et de paramètre 3, moyenne \\(\\tfrac{7}{3}\\), MAP 2. Avec l'a priori constant : gamma de forme 8 et de paramètre 3, MAP \\(\\tfrac{7}{3}\\), moyenne \\(\\tfrac{8}{3}\\).\n\n### Cas limites\n\n- **Beaucoup de données.** Si \\(t \\to \\infty\\) avec \\(k/t\\) fixé, le poids \\(b/(b + t)\\) de l'a priori dans (B3) tend vers 0 et la variance a posteriori \\((a + k)/(b + t)^2\\) aussi : la loi a posteriori se concentre en \\(k/t\\), quel que soit l'a priori gamma.\n- **Plusieurs fenêtres.** Pour des comptages \\(k_1, \\dots, k_r\\) sur des durées disjointes \\(t_1, \\dots, t_r\\), indépendants sachant \\(\\Lambda\\), la vraisemblance est le produit des vraisemblances, proportionnel à \\(\\lambda^{k_1 + \\dots + k_r} e^{-\\lambda (t_1 + \\dots + t_r)}\\) : seuls comptent le nombre total d'événements et la durée totale.\n- **Observer une durée.** Si l'on observe l'instant \\(s\\) du \\(k\\)-ième événement, la vraisemblance est la densité de cet instant, \\(\\lambda^k s^{k-1} e^{-\\lambda s}/(k-1)!\\) (dérivée en \\(s\\) de \\(1 - \\sum_{j < k} e^{-\\lambda s}(\\lambda s)^j/j!\\), résultat (P2) de la séance de mathématiques 2 : la somme se télescope). Même noyau \\(\\lambda^k e^{-\\lambda s}\\) : même loi a posteriori que pour \\(k\\) événements comptés en une durée \\(s\\).\n- **Le MAP dépend de la paramétrisation.** Si \\(\\Lambda\\) a la densité \\(p\\), la durée moyenne entre événements \\(1/\\Lambda\\) a la densité \\(p(1/\\theta)/\\theta^2\\) en \\(\\theta\\). Pour la loi gamma de forme 9 et de paramètre 4, le mode de \\(1/\\Lambda\\) est \\(4/10 = 0{,}4\\), alors que l'inverse du MAP de \\(\\Lambda\\) est \\(0{,}5\\). Sur une liste finie, ce problème n'existe pas : les poids ne changent pas quand on renomme les valeurs.\n\n### Pièges\n\n1. Oublier l'a priori : choisir la candidate de plus grande vraisemblance, c'est supposer des poids égaux.\n2. Choisir la candidate la plus proche de \\(k/t\\) en distance : le seuil entre deux candidates est leur moyenne logarithmique.\n3. Le paramètre de la loi de Poisson est \\(\\lambda t\\), intensité fois durée, en unités cohérentes.\n4. MAP, moyenne a posteriori et EMV sont trois nombres différents ; lire lequel est demandé.\n5. Avec l'a priori en \\(1/\\lambda\\) et \\(k = 0\\), il n'y a pas de loi a posteriori.\n\n[[controle:posterieur]]\n\n## Partie 6 : bâton coupé au hasard\n\n### Le problème\n\nUn bâton de longueur 1 est coupé en \\(n\\) morceaux par \\(n - 1\\) points tirés indépendamment et uniformément. L'outil 3 de la séance de mathématiques 1 donne l'espérance de chaque morceau, \\(1/n\\). Ici : la loi des morceaux, l'espérance du plus petit, du \\(k\\)-ième plus petit, et la probabilité de pouvoir former un triangle.\n\n### Notations\n\n\\(n \\ge 2\\) est le nombre de morceaux. \\(U_1, \\dots, U_{n-1}\\) sont indépendantes, uniformes sur \\([0, 1]\\) ; \\(U_{(1)} < \\dots < U_{(n-1)}\\) sont ces points triés, avec les conventions \\(U_{(0)} = 0\\) et \\(U_{(n)} = 1\\). Le \\(j\\)-ième morceau en partant de la gauche a pour longueur \\(L_j = U_{(j)} - U_{(j-1)}\\), et \\(L_1 + \\dots + L_n = 1\\). Les longueurs triées sont \\(L_{(1)} \\le \\dots \\le L_{(n)}\\) : \\(L_{(1)}\\) est le plus petit morceau. Pour un réel \\(x\\), \\((x)_+ = \\max(x, 0)\\).\n\n### L'intuition\n\nLes \\(n\\) morceaux se comportent comme \\(n\\) durées exponentielles indépendantes divisées par leur somme (énoncé (E5)). Or le minimum de \\(n\\) exponentielles de même paramètre est \\(n\\) fois plus petit en moyenne que chacune (séance de mathématiques 2, résultat (A3)). Le plus petit de \\(n\\) morceaux de moyenne \\(1/n\\) mesure donc \\(1/n^2\\) en moyenne, et non \\(1/(2n)\\) ou \\(1/(n+1)\\).\n\n### L'énoncé\n\n1. **(E1) Loi conjointe.** Pour des réels \\(c_1, \\dots, c_n \\ge 0\\) de somme \\(c \\le 1\\) : \\(\\mathbb{P}(L_1 > c_1, \\dots, L_n > c_n) = (1 - c)^{n-1}\\).\n2. **(E2) Chaque morceau, et le plus petit.** Chaque \\(L_j\\) a la même loi : \\(\\mathbb{P}(L_j > x) = (1 - x)^{n-1}\\) pour \\(0 \\le x \\le 1\\). Les morceaux ne sont pas indépendants. \\(\\mathbb{P}(L_{(1)} > x) = (1 - nx)_+^{\\,n-1}\\) et \\(\\mathbb{E}[L_{(1)}] = \\dfrac{1}{n^2}\\).\n3. **(E3) Le \\(k\\)-ième plus petit.** \\(\\mathbb{E}[L_{(k)}] = \\dfrac{1}{n}\\Big(\\dfrac{1}{n} + \\dfrac{1}{n-1} + \\dots + \\dfrac{1}{n-k+1}\\Big)\\) ; pour le plus grand, \\(\\dfrac{1}{n}\\Big(1 + \\dfrac12 + \\dots + \\dfrac1n\\Big)\\).\n4. **(E4) Le plus grand, et le triangle.** Pour \\(x \\ge 1/2\\), \\(\\mathbb{P}(L_{(n)} > x) = n\\,(1 - x)^{n-1}\\). Trois morceaux forment un triangle avec probabilité \\(1/4\\).\n5. **(E5) Représentation.** Si \\(E_1, \\dots, E_n\\) sont indépendantes de loi exponentielle de paramètre 1 et si \\(T = E_1 + \\dots + E_n\\), le vecteur \\((E_1/T, \\dots, E_n/T)\\) a la loi de \\((L_1, \\dots, L_n)\\) et il est indépendant de \\(T\\).\n\n### La preuve\n\n1. Loi des points triés. Le vecteur \\((U_{(1)}, \\dots, U_{(n-1)})\\) a la densité \\((n-1)!\\) sur \\(\\{0 < u_1 < \\dots < u_{n-1} < 1\\}\\) : pour une région \\(\\mathcal{B}\\) de cet ensemble, « les points triés sont dans \\(\\mathcal{B}\\) » est la réunion disjointe, sur les \\((n-1)!\\) ordres possibles des \\(U_i\\), d'événements de probabilité égale au volume de \\(\\mathcal{B}\\) (les \\(U_i\\) non triés ont la densité 1 sur le cube, et permuter les coordonnées conserve le volume).\n2. Loi des morceaux. Le passage \\(l_j = u_j - u_{j-1}\\) (avec \\(u_0 = 0\\)) est linéaire, de matrice triangulaire à diagonale de 1, donc de déterminant 1 : \\((L_1, \\dots, L_{n-1})\\) a la densité \\((n-1)!\\) sur le simplexe \\(\\mathcal{S} = \\{l_j > 0,\\ l_1 + \\dots + l_{n-1} < 1\\}\\) (changement de variables, admis), et \\(L_n = 1 - L_1 - \\dots - L_{n-1}\\). La loi est uniforme sur \\(\\mathcal{S}\\), dont le volume est donc \\(1/(n-1)!\\).\n3. (E1), cas \\(c < 1\\). En termes des \\(n - 1\\) premières longueurs, l'événement s'écrit \\(l_j > c_j\\) pour \\(j < n\\) et \\(l_1 + \\dots + l_{n-1} < 1 - c_n\\). En posant \\(l_j = c_j + (1 - c)\\,l'_j\\), ces conditions deviennent \\(l'_j > 0\\) et \\(l'_1 + \\dots + l'_{n-1} < 1\\) : la région de l'événement est l'image de \\(\\mathcal{S}\\) par une translation suivie d'une homothétie de rapport \\(1 - c\\) en dimension \\(n - 1\\), de volume \\((1 - c)^{n-1}/(n-1)!\\). Multiplié par la densité \\((n-1)!\\) : \\((1 - c)^{n-1}\\). Si \\(c = 1\\), l'événement exige \\(L_j = c_j\\) pour tout \\(j\\), de probabilité 0.\n4. (E2). Avec \\(c_j = x\\) et les autres nuls : \\(\\mathbb{P}(L_j > x) = (1 - x)^{n-1}\\), quel que soit \\(j\\). Avec tous les \\(c_j\\) égaux à \\(x \\le 1/n\\) : \\(\\mathbb{P}(L_{(1)} > x) = (1 - nx)^{n-1}\\), et cette probabilité est nulle si \\(x > 1/n\\) (la somme des longueurs vaut 1). Par la formule de la queue (séance de mathématiques 1, outil 3, (F)) : \\(\\mathbb{E}[L_{(1)}] = \\int_0^{1/n} (1 - nx)^{n-1}\\,dx = \\Big[-\\dfrac{(1 - nx)^n}{n^2}\\Big]_0^{1/n} = \\dfrac{1}{n^2}\\). Non-indépendance : \\(\\mathbb{P}(L_1 > 0{,}6, L_2 > 0{,}6) = 0\\), alors que chaque probabilité est non nulle.\n5. (E4). Si \\(x \\ge 1/2\\), deux morceaux ne peuvent pas dépasser \\(x\\) tous les deux (leur somme dépasserait 1) : les événements \\(\\{L_j > x\\}\\) sont deux à deux disjoints, donc \\(\\mathbb{P}(L_{(n)} > x) = n\\,(1 - x)^{n-1}\\). Trois longueurs forment un triangle (non aplati) si et seulement si chacune est strictement inférieure à la somme des deux autres ; leur somme valant 1, cela équivaut à : chacune est inférieure à \\(1/2\\). Probabilité : \\(1 - \\mathbb{P}(L_{(3)} \\ge 1/2) = 1 - 3 \\times (1/2)^2 = \\tfrac14\\).\n6. (E5). La densité de \\((E_1, \\dots, E_n)\\) est \\(e^{-(e_1 + \\dots + e_n)}\\) sur les réels positifs. Les sommes partielles \\(s_j = e_1 + \\dots + e_j\\) (déterminant 1) ont la densité \\(e^{-s_n}\\) sur \\(\\{0 < s_1 < \\dots < s_n\\}\\). On pose \\(v_j = s_j/s_n\\) pour \\(j < n\\), en gardant \\(s_n\\) : \\(s_j = v_j s_n\\), de jacobien \\(s_n^{\\,n-1}\\). La densité de \\((V_1, \\dots, V_{n-1}, T)\\) est donc \\(t^{n-1} e^{-t} = (n-1)! \\times \\dfrac{t^{n-1} e^{-t}}{(n-1)!}\\) sur le produit de \\(\\{0 < v_1 < \\dots < v_{n-1} < 1\\}\\) par \\(\\{t > 0\\}\\). C'est un produit sur un domaine produit : par (D4) de la partie 4 (même preuve avec un vecteur à la place de \\(x\\)), \\((V_1, \\dots, V_{n-1})\\) a la densité \\((n-1)!\\), celle des points triés de l'étape 1, et il est indépendant de \\(T\\), de loi gamma de forme \\(n\\). Les écarts successifs des \\(V_j\\) sont les \\(E_j/T\\).\n7. (E3). Soient \\(E_{(1)} \\le \\dots \\le E_{(n)}\\) les exponentielles triées. \\(E_{(1)}\\) est le minimum de \\(n\\) exponentielles de paramètre 1, d'espérance \\(1/n\\) (résultat (A3) de la séance de mathématiques 2). Par (A5) (« la course recommence »), les \\(n - 1\\) durées restantes \\(E_j - E_{(1)}\\) sont indépendantes, de loi exponentielle de paramètre 1 : \\(E_{(2)} - E_{(1)}\\) est le minimum de \\(n - 1\\) exponentielles, d'espérance \\(1/(n-1)\\), et ainsi de suite. Donc \\(\\mathbb{E}[E_{(k)}] = \\tfrac1n + \\tfrac{1}{n-1} + \\dots + \\tfrac{1}{n-k+1}\\).\n8. Fin de (E3). Diviser par \\(T > 0\\) conserve l'ordre : \\(L_{(k)}\\) a la loi de \\(E_{(k)}/T\\). Et \\(E_{(k)} = (E_{(k)}/T) \\times T\\) est le produit de deux variables indépendantes par (E5), donc \\(\\mathbb{E}[E_{(k)}] = \\mathbb{E}[E_{(k)}/T]\\,\\mathbb{E}[T] = n\\,\\mathbb{E}[L_{(k)}]\\). On divise l'étape 7 par \\(n\\).\n\n### Exemple calculé\n\nTrois morceaux (deux points de coupe) : le plus petit mesure en moyenne \\(\\tfrac13 \\times \\tfrac13 = \\tfrac{1}{9}\\), celui du milieu \\(\\tfrac13\\big(\\tfrac13 + \\tfrac12\\big) = \\tfrac{5}{18}\\), le plus grand \\(\\tfrac13\\big(\\tfrac13 + \\tfrac12 + 1\\big) = \\tfrac{11}{18}\\) ; la somme vaut bien 1. Probabilité de former un triangle : \\(\\tfrac{1}{4}\\). Deux morceaux (un point de coupe) : \\(\\tfrac{1}{4}\\) et \\(\\tfrac{3}{4}\\). La corrélation entre le morceau de gauche et celui du milieu, pour trois morceaux, vaut \\(-0{,}5\\) (calcul d'intégrales du script).\n\n```python\nnb = 400000\ncoupes = np.sort(rng.random((nb, 2)), axis=1)\nmorceaux = np.diff(np.concatenate([np.zeros((nb, 1)), coupes, np.ones((nb, 1))], axis=1), axis=1)\ntries = np.sort(morceaux, axis=1)\nprint(\"moyennes des morceaux triés   :\", tries.mean(axis=0).round(4), \"; exact :\", np.round([1 / 9, 5 / 18, 11 / 18], 4))\nprint(\"moyennes gauche, milieu, droite :\", morceaux.mean(axis=0).round(4))\nprint(\"triangle possible             :\", round(float(np.mean(tries[:, 2] < 0.5)), 4))\ne = rng.exponential(1.0, (nb, 3))\nprint(\"exponentielles normalisées, triées :\", np.sort(e / e.sum(axis=1, keepdims=True), axis=1).mean(axis=0).round(4))\n```\n\n```sortie\nmoyennes des morceaux triés   : [0.111  0.2777 0.6113] ; exact : [0.1111 0.2778 0.6111]\nmoyennes gauche, milieu, droite : [0.333  0.3334 0.3336]\ntriangle possible             : 0.2499\nexponentielles normalisées, triées : [0.1112 0.2777 0.6111]\n```\n\n### Cas limites\n\n- **Bâton de longueur \\(\\ell\\)** : toutes les longueurs sont multipliées par \\(\\ell\\), les probabilités d'événements comme « former un triangle » sont inchangées.\n- **Cercle.** \\(n\\) points uniformes indépendants sur un cercle de circonférence 1 le découpent en \\(n\\) arcs qui ont la loi des \\(n\\) morceaux du bâton : on coupe le cercle au premier point, et les \\(n - 1\\) autres, repérés à partir de lui, sont indépendants et uniformes.\n- **Coupes successives : une autre loi.** On coupe en un point uniforme, puis on recoupe le **plus grand** des deux morceaux en un point uniforme de ce morceau. Le plus grand morceau \\(M\\) est uniforme sur \\([1/2, 1]\\) ; la seconde coupe le partage en \\(WM\\) et \\((1 - W)M\\), avec \\(W\\) uniforme sur \\([0, 1]\\), indépendante de \\(M\\). Le morceau \\(1 - M\\) est sous \\(1/2\\) ; le triangle exige \\(WM < 1/2\\) et \\((1 - W)M < 1/2\\), soit \\(1 - \\tfrac{1}{2M} < W < \\tfrac{1}{2M}\\), de probabilité \\(\\tfrac1M - 1\\). En intégrant contre la densité 2 de \\(M\\) : \\(\\int_{1/2}^{1} 2\\big(\\tfrac1m - 1\\big)\\,dm = 2\\ln 2 - 1 \\approx 0{,}386\\) (simulation : 0,387), et non \\(1/4\\).\n- **Plus de trois morceaux** : pour \\(n = 4\\), \\(\\mathbb{P}(L_{(4)} < 1/2) = 1 - 4 \\times (1/2)^3 = \\tfrac{1}{2}\\) par (E4).\n\n### Pièges\n\n1. Le plus petit de trois morceaux mesure \\(1/9\\) en moyenne, pas \\(1/6\\) ni \\(1/4\\) : \\(1/n^2\\), avec \\(n\\) le nombre de **morceaux**.\n2. \\(n\\) morceaux viennent de \\(n - 1\\) coupes ; l'outil 3 de la séance de mathématiques 1 compte \\(n\\) points, donc \\(n + 1\\) morceaux.\n3. Le morceau de gauche a la même loi que celui du milieu (E2), mais les morceaux ne sont pas indépendants.\n4. Lire comment les coupes sont faites : deux points tirés ensemble, ou coupes successives.\n\n## Partie 7 : conditionner sur la bonne information\n\n### Le problème\n\nLa phrase « il y a au moins un garçon » peut conduire à \\(1/3\\) ou à \\(1/2\\) selon la façon dont l'information a été obtenue. La règle : on ne conditionne pas par une phrase vraie, mais par l'événement « j'ai observé ceci », décrit dans un univers écrit explicitement, avec la règle d'observation.\n\n### Le cadre\n\nUne famille a deux enfants. Hypothèses du modèle : chaque enfant est un garçon (G) ou une fille (F) avec probabilité \\(1/2\\), indépendamment de l'autre. L'univers est l'ensemble des couples (aîné, cadet) : GG, GF, FG, FF, chacun de probabilité \\(1/4\\).\n\n### L'énoncé\n\n1. **Version 1.** On sait que l'aîné est une fille. Alors \\(\\mathbb{P}(\\text{deux filles}) = \\tfrac{1}{2}\\).\n2. **Version 2.** À la question « avez-vous au moins un garçon ? », le parent répond oui, et il dit vrai. Alors \\(\\mathbb{P}(\\text{deux garçons}) = \\tfrac{1}{3}\\).\n3. **Version 3.** On rencontre l'un des deux enfants, choisi au hasard (aîné ou cadet avec probabilité \\(1/2\\), indépendamment des sexes) : c'est un garçon. Alors \\(\\mathbb{P}(\\text{deux garçons}) = \\tfrac{1}{2}\\).\n\n### La preuve\n\n1. Version 1 : l'événement observé est \\(\\{\\text{FG}, \\text{FF}\\}\\), de probabilité \\(1/2\\) ; FF a la probabilité \\(1/4\\) ; le rapport vaut \\(1/2\\). Le sexe du cadet est indépendant de celui de l'aîné.\n2. Version 2 : l'événement observé est \\(\\{\\text{GG}, \\text{GF}, \\text{FG}\\}\\), de probabilité \\(3/4\\) ; GG a la probabilité \\(1/4\\) ; le rapport vaut \\(1/3\\).\n3. Version 3 : l'univers doit contenir l'enfant rencontré. Il a 8 issues (famille, enfant rencontré), chacune de probabilité \\(1/8\\). « L'enfant rencontré est un garçon » contient 4 issues : (GG, aîné), (GG, cadet), (GF, aîné), (FG, cadet), dont 2 avec deux garçons. Le rapport vaut \\(2/4 = 1/2\\).\n4. Pourquoi les versions 2 et 3 diffèrent, alors que « au moins un garçon » est vrai dans les deux : par la formule de Bayes, la probabilité d'**observer** un garçon vaut 1 pour GG et seulement \\(1/2\\) pour GF et pour FG dans la version 3, alors que la réponse « oui » a la probabilité 1 pour ces trois familles dans la version 2. La version 3 favorise GG d'un facteur 2.\n\n### Exemple calculé : le garçon né un mardi\n\nLe parent répond oui à « avez-vous au moins un garçon né un mardi ? », chaque enfant étant né un jour de la semaine uniforme et indépendant du reste. Cas général : soit une propriété que chaque garçon possède avec probabilité \\(q\\), indépendamment (\\(q = 1/7\\) pour le mardi).\n\n1. Un enfant donné est « un garçon ayant la propriété » avec probabilité \\(q/2\\). Donc \\(\\mathbb{P}(\\text{au moins un tel enfant}) = 1 - (1 - q/2)^2 = q(4 - q)/4\\).\n2. \\(\\mathbb{P}(\\text{deux garçons, dont au moins un a la propriété}) = \\tfrac14\\big(1 - (1 - q)^2\\big) = q(2 - q)/4\\).\n3. Rapport : \\(\\mathbb{P}(\\text{deux garçons} \\mid \\text{oui}) = \\dfrac{2 - q}{4 - q}\\).\n\nPour \\(q = 1\\) (aucune précision), on retrouve \\(1/3\\), la version 2 ; pour \\(q = 1/7\\), \\(\\tfrac{13}{27} \\approx 0{,}481\\) (énumération des 196 couples de types d'enfant, un type étant un sexe et un jour, et simulation du script : 0,481) ; quand \\(q \\to 0\\), la limite est \\(1/2\\). Plus la propriété est rare, plus elle désigne un enfant précis, et plus on se rapproche de la version 1.\n\n### Cas limites\n\n- **Énoncé sans règle d'observation.** « M. Durand a deux enfants, dont un garçon. Probabilité qu'il ait deux garçons ? » est ambigu : \\(1/3\\) si l'information vient d'un filtre sur la famille (version 2), \\(1/2\\) si elle vient de l'observation d'un enfant désigné (versions 1 et 3). Un énoncé correct dit comment l'information a été obtenue.\n- **Même mécanisme ailleurs** : dans le jeu des trois portes, la réponse dépend de la règle suivie par l'animateur quand il ouvre une porte, pas seulement de la porte ouverte.\n- Les hypothèses (probabilité \\(1/2\\), indépendance des sexes) sont les conventions du problème ; avec d'autres probabilités, la méthode est la même : écrire l'univers, les probabilités des issues, l'événement observé.\n\n### Pièges\n\n1. Conditionner par la phrase « au moins un garçon » quand on a en réalité **vu** un enfant.\n2. Parler de « l'autre enfant » dans la version 2 : aucun enfant n'y est désigné.\n3. Oublier que GF et FG sont deux issues distinctes, de probabilité totale \\(1/2\\).\n\n[[controle:enfants]]\n\n## Réflexes en 30 secondes\n\n| Indice dans l'énoncé | Premier geste |\n|---|---|\n| « étalée à droite », ordre de la moyenne, de la médiane et du mode | règle empirique mode < médiane < moyenne (exponentielle, log-normale, gamma) ; seule garantie générale : \\(\\lvert \\mu - m \\rvert \\le \\sigma\\) |\n| asymétrie, kurtosis d'une loi usuelle | exponentielle : 2 et 9 ; gamma de forme \\(a\\) : \\(2/\\sqrt{a}\\) et \\(3 + 6/a\\) ; normale : 0 et 3 ; somme de \\(n\\) : divisés par \\(\\sqrt{n}\\) et \\(n\\) (pour l'excès) |\n| changement d'unité | covariance multipliée par \\(ac\\) ; corrélation inchangée, au signe de \\(ac\\) près ; pente \\(\\rho\\,\\sigma_Y/\\sigma_X\\) |\n| « corrélation nulle », « mesure quoi » | liaison linéaire seulement ; \\(Y = X^2\\) avec \\(X\\) symétrique : corrélation nulle, dépendance totale |\n| comparer deux notes | cote Z \\((x - \\mu)/\\sigma\\) ; rangs comparables seulement si les lois ont la même forme |\n| adéquation à une loi discrète (binomiale, Poisson) | khi-deux, \\(k - 1 - s\\) degrés de liberté, effectifs attendus d'au moins 5 |\n| adéquation à une loi continue spécifiée | Kolmogorov-Smirnov (écart maximal), Anderson-Darling (queues) |\n| normalité, paramètres estimés | Lilliefors, Shapiro-Wilk, Jarque-Bera ; jamais la table de Kolmogorov |\n| densité conjointe | constante par \\(\\iint = 1\\) ; marginale en intégrant l'autre variable ; conditionnelle = conjointe divisée par marginale ; indépendance = produit **sur un pavé** |\n| intensité de Poisson, a priori | poids a posteriori proportionnel à \\(\\pi_i\\,\\lambda_i^k e^{-\\lambda_i t}\\) ; gamma de forme \\(a\\), paramètre \\(b\\) devient forme \\(a + k\\), paramètre \\(b + t\\) ; a priori \\(1/\\lambda\\) : exposant \\(k - 1\\) |\n| bâton coupé en \\(n\\) morceaux | plus petit \\(1/n^2\\) ; \\(k\\)-ième plus petit \\(\\tfrac1n\\big(\\tfrac1n + \\dots + \\tfrac{1}{n-k+1}\\big)\\) ; triangle \\(1/4\\) |\n| deux enfants | écrire GG, GF, FG, FF ; « aîné » ou enfant vu : \\(1/2\\) ; « au moins un » par filtre : \\(1/3\\) |\n\n## À savoir refaire sans notes\n\n- \\(\\lvert \\mu - m \\rvert \\le \\sigma\\) : la médiane minimise l'écart absolu moyen, puis trois inégalités.\n- Moyenne, médiane, mode et asymétrie de la loi exponentielle et de la loi log-normale ; un contre-exemple à la règle de l'ordre.\n- L'effet d'un changement affine sur la covariance et la corrélation ; la variance résiduelle \\(\\sigma_Y^2 (1 - \\rho^2)\\) ; un exemple de corrélation nulle sans indépendance.\n- Le khi-deux : \\(\\mathbb{E}[C] = k - 1\\), le cas \\(k = 2\\) par la binomiale centrée réduite, le compte des degrés de liberté.\n- Kolmogorov-Smirnov : la formule de calcul, et la preuve que la loi de \\(D_n\\) est libre par \\(X_i = Q(U_i)\\) ; ce qui casse pour une loi discrète et avec des paramètres estimés.\n- Sur une densité conjointe : normalisation, marginales, conditionnelle, probabilité sachant \\(X = x\\), critère d'indépendance.\n- La loi a posteriori sur une liste, la conjugaison gamma-Poisson, l'effet de l'a priori en \\(1/\\lambda\\).\n- \\(\\mathbb{P}(L_1 > c_1, \\dots, L_n > c_n) = (1 - c)^{n-1}\\) par le volume du simplexe, \\(\\mathbb{E}[L_{(1)}] = 1/n^2\\), le triangle, et \\(\\mathbb{E}[L_{(k)}]\\) par les exponentielles.\n- Les trois versions du problème des deux enfants, univers écrit.\n", "controles": {"forme": {"question": "On sait seulement qu'une loi a une variance finie et un coefficient d'asymétrie strictement positif. Qu'est-ce qui est garanti ?", "options": [{"id": "a", "texte": "Rien sur l'ordre de la moyenne et de la médiane ; seulement que leur écart est au plus égal à l'écart-type.", "correcte": true, "explication": "Oui : \\(\\lvert \\mu - m \\rvert \\le \\sigma\\) vaut pour toute loi de variance finie. Dans le contre-exemple discret de la leçon, l'asymétrie vaut \\(0{,}366\\), l'écart entre moyenne et médiane \\(0{,}9\\) et l'écart-type \\(1{,}921\\)."}, {"id": "b", "texte": "La moyenne est supérieure à la médiane.", "correcte": false, "explication": "C'est la règle empirique, vraie pour les lois exponentielle, log-normale et gamma, mais pas un théorème : la loi qui vaut \\(-2\\), 1, 4 avec probabilités 0,4, 0,5, 0,1 a une asymétrie positive, une moyenne de \\(0{,}1\\) et une médiane de 1."}, {"id": "c", "texte": "Le mode est inférieur à la médiane.", "correcte": false, "explication": "Faux en général : pour la loi de Weibull de forme \\(3{,}5\\), l'asymétrie est positive (\\(0{,}025\\)) et le mode \\(0{,}908\\) dépasse la médiane \\(0{,}901\\)."}, {"id": "d", "texte": "Le kurtosis est supérieur à 3.", "correcte": false, "explication": "Asymétrie et kurtosis sont deux moments distincts : le contre-exemple discret de la leçon a une asymétrie positive et un kurtosis de \\(2{,}29\\), sous celui de la loi normale. Seul \\(\\kappa \\ge 1\\) est garanti."}]}, "unites": {"question": "Deux rendements exprimés en nombres décimaux ont une covariance de 0,00012 et une corrélation de 0,6. On les exprime tous deux en pourcentage (multiplication par 100). Que deviennent la covariance et la corrélation ?", "options": [{"id": "a", "texte": "Covariance \\(1{,}2\\), corrélation \\(0{,}6\\).", "correcte": true, "explication": "Oui : \\(\\mathrm{Cov}(aX, cY) = ac\\,\\mathrm{Cov}(X, Y)\\) avec \\(a = c = 100\\), soit un facteur 10 000 ; la corrélation, sans unité, ne change pas puisque \\(ac > 0\\)."}, {"id": "b", "texte": "Covariance \\(0{,}012\\), corrélation \\(0{,}6\\).", "correcte": false, "explication": "Le facteur 100 n'a été appliqué qu'une fois. La covariance est un produit de deux écarts : chacun des deux est multiplié par 100."}, {"id": "c", "texte": "Covariance \\(1{,}2\\), corrélation \\(60\\).", "correcte": false, "explication": "La corrélation a été multipliée par 100 comme une quantité qui aurait une unité. Elle est le rapport de la covariance au produit des écarts-types, tous deux multipliés par 100 : elle reste entre \\(-1\\) et 1."}, {"id": "d", "texte": "Covariance \\(0{,}00012\\), corrélation \\(0{,}6\\).", "correcte": false, "explication": "C'est la corrélation qui est insensible aux unités, pas la covariance : celle-ci a l'unité du produit des deux variables et change avec elle."}]}, "adequation": {"question": "On veut tester la normalité de 80 rendements. On estime la moyenne et l'écart-type sur ces 80 valeurs, on calcule la statistique de Kolmogorov-Smirnov contre la loi normale ainsi ajustée, et on lit la p-value dans la table de Kolmogorov. Que vaut cette procédure ?", "options": [{"id": "a", "texte": "Son niveau réel est très inférieur au niveau affiché et elle perd de la puissance ; il faut des seuils propres au cas estimé (Lilliefors), ou un autre test de normalité.", "correcte": true, "explication": "Oui : la loi ajustée suit les données, la statistique est plus petite que sous la loi de la table. Dans la simulation du script (\\(n = 50\\)), la fréquence de rejet au niveau nominal 5 % tombe à \\(0{,}0001\\), et le seuil correct est \\(0{,}125\\) au lieu de \\(0{,}188\\)."}, {"id": "b", "texte": "Elle est exacte : la loi de la statistique ne dépend pas de la loi continue testée.", "correcte": false, "explication": "Ce résultat suppose une loi testée **entièrement spécifiée** avant de voir les données. Ici, la loi testée dépend de l'échantillon par la moyenne et l'écart-type estimés."}, {"id": "c", "texte": "Elle rejette trop souvent une hypothèse de normalité vraie.", "correcte": false, "explication": "C'est le sens inverse : estimer les paramètres rapproche la loi ajustée des données, donc diminue la statistique. Le test rejette trop rarement, pas trop souvent."}, {"id": "d", "texte": "Elle devient exacte si l'on retire deux degrés de liberté, un par paramètre estimé.", "correcte": false, "explication": "Les degrés de liberté appartiennent au test du khi-deux. La loi de la statistique de Kolmogorov-Smirnov n'a pas de degrés de liberté ; avec des paramètres estimés, il faut une autre table."}]}, "posterieur": {"question": "L'intensité \\(\\Lambda\\) d'un processus de Poisson suit a priori la loi gamma de forme 2 et de paramètre 1 (par heure). On observe 7 événements en 3 heures. Quelle est la loi a posteriori, et quel est le maximum a posteriori ?", "options": [{"id": "a", "texte": "Loi gamma de forme 9 et de paramètre 4 ; maximum a posteriori 2.", "correcte": true, "explication": "Oui : la forme reçoit le nombre d'événements (\\(2 + 7\\)), le paramètre reçoit la durée (\\(1 + 3\\)), et le mode d'une loi gamma de forme \\(\\alpha\\) et de paramètre \\(\\beta\\) est \\((\\alpha - 1)/\\beta = 8/4\\)."}, {"id": "b", "texte": "Loi gamma de forme 9 et de paramètre 4 ; maximum a posteriori \\(2{,}25\\).", "correcte": false, "explication": "La loi est juste, mais \\(9/4\\) est sa **moyenne**. Le maximum a posteriori est le mode de la densité, \\((\\alpha - 1)/\\beta\\), plus petit que la moyenne pour une loi gamma."}, {"id": "c", "texte": "Loi gamma de forme 9 et de paramètre 3 ; maximum a posteriori \\(2{,}67\\).", "correcte": false, "explication": "La durée observée remplace ici le paramètre a priori au lieu de s'y ajouter. Le noyau a posteriori est \\(\\lambda^{2 + 7 - 1} e^{-(1 + 3)\\lambda}\\) : les exposants de \\(e^{-\\lambda}\\) s'additionnent."}, {"id": "d", "texte": "Le maximum a posteriori vaut \\(7/3 \\approx 2{,}33\\), quelle que soit la loi a priori.", "correcte": false, "explication": "\\(7/3\\) est le maximum de vraisemblance. Il ne coïncide avec le maximum a posteriori que pour un a priori constant ; un a priori gamma de forme 2 et de paramètre 1 tire l'estimation vers sa propre zone de forte densité."}]}, "enfants": {"question": "M. Martin a deux enfants (chaque enfant est un garçon ou une fille avec probabilité 1/2, indépendamment). Vous le croisez accompagné de l'un des deux, choisi au hasard avec probabilité 1/2 indépendamment des sexes : c'est un garçon. Quelle est la probabilité que M. Martin ait deux garçons ?", "options": [{"id": "a", "texte": "\\(\\tfrac{1}{2}\\)", "correcte": true, "explication": "Oui : parmi les 8 issues (famille, enfant vu), 4 montrent un garçon, dont 2 viennent d'une famille de deux garçons. De façon équivalente, le sexe de l'enfant resté à la maison est indépendant de celui de l'enfant vu."}, {"id": "b", "texte": "\\(\\tfrac{1}{3}\\)", "correcte": false, "explication": "C'est la réponse quand on sait seulement, par un filtre sur la famille, qu'il y a au moins un garçon. Ici un enfant précis a été vu, et une famille de deux garçons montre un garçon deux fois plus souvent qu'une famille mixte."}, {"id": "c", "texte": "\\(\\tfrac14\\)", "correcte": false, "explication": "C'est la probabilité de deux garçons avant toute observation. Avoir vu un garçon élimine la famille de deux filles et rend les familles avec garçons plus probables."}, {"id": "d", "texte": "\\(\\tfrac23\\)", "correcte": false, "explication": "C'est la probabilité que la famille soit mixte quand on sait par un filtre qu'il y a au moins un garçon : deux erreurs à la fois, le mauvais conditionnement et le mauvais événement."}]}}, "verif": {"script": "verif/seance_math_5.py"}}]}, {"id": "math", "nom": "Mathématiques", "budget_min": 24, "questions": [{"id": "M5-01", "section": "math", "theme": "Tests d'adéquation, quel test pour quelle loi", "difficulte": 3, "temps_cible_s": 90, "conceptuelle": true, "correctes": ["a", "c", "d"], "enonce": "On dispose de \\(n\\) observations indépendantes et de même loi, et l'on veut tester l'adéquation de cette loi à un modèle. Dans les affirmations ci-dessous, \\(k\\) désigne le nombre de classes d'un test du khi-deux, et « la table usuelle » du test de Kolmogorov-Smirnov est celle qui vaut pour une loi continue entièrement spécifiée à l'avance.\n\nQuelles affirmations sont justes ?", "options": [{"id": "a", "texte": "Pour tester « les comptages suivent une loi de Poisson », de paramètre inconnu estimé sur les données, on peut utiliser le test du khi-deux, en comparant la statistique à une loi du khi-deux à \\(k - 2\\) degrés de liberté.", "correcte": true, "explication": "Juste : le khi-deux est le test naturel d'une loi discrète, et l'on retire un degré de liberté pour la contrainte sur le total et un autre pour le paramètre estimé, soit \\(k - 1 - 1\\)."}, {"id": "b", "texte": "Pour cette même hypothèse (loi de Poisson de paramètre estimé), le test de Kolmogorov-Smirnov lu dans sa table usuelle a exactement le niveau affiché.", "correcte": false, "explication": "Faux, pour deux raisons : la loi de Poisson est discrète, et son paramètre est estimé sur l'échantillon. Dans les deux cas la statistique est plus petite que sous la loi de la table, et le niveau réel est inférieur au niveau affiché."}, {"id": "c", "texte": "Si la loi testée est continue et entièrement spécifiée à l'avance, la loi de la statistique de Kolmogorov-Smirnov sous l'hypothèse nulle est la même quelle que soit cette loi.", "correcte": true, "explication": "Juste : en écrivant \\(X_i = Q(U_i)\\) avec des \\(U_i\\) uniformes, la statistique devient \\(\\sup_u \\lvert G_n(u) - u \\rvert\\), qui ne dépend que des \\(U_i\\) (leçon, partie 3)."}, {"id": "d", "texte": "La statistique d'Anderson-Darling donne plus de poids que celle de Kolmogorov-Smirnov aux écarts situés dans les queues de la loi.", "correcte": true, "explication": "Juste : elle divise chaque écart au carré par sa variance \\(u(1-u)/n\\), petite près de 0 et de 1, alors que Kolmogorov-Smirnov prend l'écart brut maximal, dominé par le centre."}], "solution": "Réponse : les affirmations sur le khi-deux à \\(k - 2\\) degrés de liberté, sur la loi libre de la statistique de Kolmogorov-Smirnov et sur le poids des queues dans Anderson-Darling sont justes ; celle sur le test de Kolmogorov-Smirnov appliqué à une loi de Poisson de paramètre estimé est fausse.\n\nLe classement à retenir (leçon, partie 3, tableau « Quel test pour quelle loi ») :\n\n- loi discrète (binomiale, Poisson) : khi-deux, avec \\(k - 1 - s\\) degrés de liberté quand \\(s\\) paramètres sont estimés, et des effectifs attendus d'au moins 5 (règle d'usage) ;\n- loi continue entièrement spécifiée : Kolmogorov-Smirnov, dont la loi sous l'hypothèse nulle ne dépend pas de la loi testée, ou Anderson-Darling, plus sensible aux queues ;\n- paramètres estimés sur l'échantillon : la table de Kolmogorov ne s'applique plus ; il faut des seuils propres (Lilliefors pour la loi normale ou exponentielle) ou un test conçu pour ce cas (Shapiro-Wilk pour la normalité).\n\nPourquoi le test de Kolmogorov-Smirnov échoue pour une loi discrète : la statistique s'écrit \\(\\sup_{u \\in \\mathcal{A}} \\lvert G_n(u) - u \\rvert\\), où \\(\\mathcal{A}\\) est l'ensemble des valeurs de la fonction de répartition testée ; pour une loi discrète, \\(\\mathcal{A}\\) n'est qu'une partie de \\([0, 1]\\) et le sup est plus petit.", "type": "qcm", "multiple": true, "reponse": "Pour tester « les comptages suivent une loi de Poisson », de paramètre inconnu estimé sur les données, on peut utiliser le test du khi-deux, en comparant la statistique à une loi du khi-deux à \\(k - 2\\) degrés de liberté. ; Si la loi testée est continue et entièrement spécifiée à l'avance, la loi de la statistique de Kolmogorov-Smirnov sous l'hypothèse nulle est la même quelle que soit cette loi. ; La statistique d'Anderson-Darling donne plus de poids que celle de Kolmogorov-Smirnov aux écarts situés dans les queues de la loi.", "fiche": null, "verif": {"script": "verif/seance_math_5.py", "cles": []}}, {"id": "M5-02", "section": "math", "theme": "Khi-deux d'adéquation, statistique et décision", "difficulte": 2, "temps_cible_s": 90, "enonce": "Un générateur est censé tirer, à chaque tirage et indépendamment des autres, l'un des symboles A, B, C, D avec la même probabilité 1/4. Sur 200 tirages, on observe 38 fois A, 62 fois B, 55 fois C et 45 fois D.\n\nOn teste l'hypothèse nulle « les quatre symboles sont équiprobables » par le test du khi-deux d'adéquation, au niveau 5 %. On donne les quantiles d'ordre 0,95 de la loi du khi-deux : 5,99 pour 2 degrés de liberté, 7,81 pour 3, 9,49 pour 4.\n\nQue vaut la statistique du test, et quelle est la décision ?", "options": [{"id": "a", "texte": "6,76 ; on ne rejette pas l'hypothèse nulle.", "correcte": true, "explication": "Oui : \\((144 + 144 + 25 + 25)/50 = 6{,}76\\), sous le quantile \\(7{,}81\\) de la loi à \\(4 - 1 = 3\\) degrés de liberté."}, {"id": "b", "texte": "6,76 ; on rejette l'hypothèse nulle.", "correcte": false, "explication": "La statistique est juste, mais elle a été comparée au quantile à 2 degrés de liberté (\\(5{,}99\\)). Aucun paramètre n'est estimé ici : il y a \\(k - 1 = 3\\) degrés de liberté, et \\(6{,}76 < 7{,}81\\)."}, {"id": "c", "texte": "1,69 ; on ne rejette pas l'hypothèse nulle.", "correcte": false, "explication": "Les carrés des écarts ont été divisés par le nombre de tirages, 200, au lieu de l'effectif attendu de chaque classe, 50. Chaque terme est \\((O_j - e_j)^2/e_j\\)."}, {"id": "d", "texte": "338 ; on rejette l'hypothèse nulle.", "correcte": false, "explication": "C'est la somme des carrés des écarts, sans la division par les effectifs attendus. Sans cette division, la statistique dépendrait de la taille de l'échantillon et n'aurait pas la loi du khi-deux."}], "solution": "Réponse : la statistique vaut \\(6{,}76\\) et l'on ne rejette pas l'hypothèse nulle au niveau 5 %.\n\nNotations : \\(O_j\\) est l'effectif observé du symbole \\(j\\), \\(e_j = 200 \\times 1/4 = 50\\) l'effectif attendu sous l'hypothèse nulle, \\(C = \\sum_j (O_j - e_j)^2/e_j\\) la statistique.\n\nÉtape 1, écarts : \\(38 - 50 = -12\\), \\(62 - 50 = 12\\), \\(55 - 50 = 5\\), \\(45 - 50 = -5\\). Leur somme est nulle, comme toujours.\n\nÉtape 2, statistique : \\(C = (144 + 144 + 25 + 25)/50 = 338/50 = 6{,}76\\).\n\nÉtape 3, degrés de liberté : \\(k = 4\\) classes, aucun paramètre estimé, donc \\(k - 1 = 3\\) (leçon, partie 3). Le quantile d'ordre 0,95 est \\(7{,}81\\), et \\(6{,}76 < 7{,}81\\) : pas de rejet. Tous les effectifs attendus valent 50, bien au-dessus de 5 : l'approximation par la loi du khi-deux est acceptable.\n\nLa p-value approchée vaut \\(0{,}080\\) ; la simulation de la loi exacte de la statistique sous l'hypothèse nulle (script) donne 0,082, et une moyenne de la statistique de 3,001, pour une valeur exacte \\(k - 1 = 3\\).", "type": "qcm", "multiple": false, "reponse": "6,76 ; on ne rejette pas l'hypothèse nulle.", "fiche": null, "verif": {"script": "verif/seance_math_5.py", "cles": ["Q02_d_brut", "Q02_d_sur_n", "Q02_ddl", "Q02_esp_mc", "Q02_exact", "Q02_p", "Q02_p_sim", "Q02_q2", "Q02_q3", "Q02_q4", "Q02_somme_carres"]}}, {"id": "M5-03", "section": "math", "theme": "Khi-deux d'adéquation à une loi de Poisson, paramètre estimé", "difficulte": 4, "temps_cible_s": 150, "enonce": "On compte les ordres reçus pendant 200 intervalles d'une minute : 300 ordres au total. On veut tester l'hypothèse « le nombre d'ordres par intervalle suit une loi de Poisson », de paramètre inconnu, par un test du khi-deux d'adéquation sur les cinq classes « 0 », « 1 », « 2 », « 3 » et « 4 ou plus ». Le paramètre de la loi de Poisson est estimé par le nombre moyen d'ordres par intervalle. On donne \\(e^{-1{,}5} \\approx 0{,}2231\\).\n\nQuel est l'effectif attendu de la classe « 4 ou plus », arrondi à une décimale, et à combien de degrés de liberté compare-t-on la statistique ?", "options": [{"id": "a", "texte": "13,1 intervalles ; 3 degrés de liberté", "correcte": true, "explication": "Oui : \\(200 \\times (1 - 0{,}9344) = 13{,}1\\), et \\(5 - 1 - 1 = 3\\) degrés de liberté, le dernier retrait venant du paramètre estimé."}, {"id": "b", "texte": "9,4 intervalles ; 3 degrés de liberté", "correcte": false, "explication": "C'est \\(200\\,\\mathbb{P}(N = 4)\\) : la classe est « 4 ou plus », elle doit recevoir tout le complément \\(1 - \\mathbb{P}(N \\le 3)\\). Sinon les effectifs attendus n'ont pas pour somme 200."}, {"id": "c", "texte": "13,1 intervalles ; 4 degrés de liberté", "correcte": false, "explication": "\\(k - 1 = 4\\) vaut quand la loi est entièrement spécifiée. Ici le paramètre est estimé sur les données, ce qui retire un degré de liberté de plus."}, {"id": "d", "texte": "13,1 intervalles ; 5 degrés de liberté", "correcte": false, "explication": "Le nombre de classes n'est pas le nombre de degrés de liberté : les cinq écarts ont une somme nulle (un degré en moins), et un paramètre est estimé (un autre en moins)."}], "solution": "Réponse : \\(13{,}1\\) intervalles attendus, et 3 degrés de liberté.\n\nNotations : \\(N\\) est le nombre d'ordres d'un intervalle, \\(\\hat{\\lambda}\\) le paramètre estimé.\n\nÉtape 1, estimation : \\(\\hat{\\lambda} = 300/200 = 1{,}5\\) ordre par intervalle.\n\nÉtape 2, probabilité de la dernière classe : \\(\\mathbb{P}(N \\le 3) = e^{-1{,}5}\\big(1 + 1{,}5 + \\tfrac{1{,}5^2}{2} + \\tfrac{1{,}5^3}{6}\\big) = 0{,}2231 \\times 4{,}1875 = 0{,}9344\\), donc \\(\\mathbb{P}(N \\ge 4) = 0{,}0656\\) (simulation : 0,0657).\n\nÉtape 3, effectif attendu : \\(200 \\times 0{,}0656 = 13{,}1\\). Les quatre autres valent \\((44{,}6 ; 66{,}9 ; 50{,}2 ; 25{,}1)\\) ; tous dépassent 5, la règle d'usage est respectée.\n\nÉtape 4, degrés de liberté : \\(k - 1 - s\\) avec \\(k = 5\\) classes et \\(s = 1\\) paramètre estimé, soit 3 (leçon, partie 3).\n\nRemarque : regrouper les valeurs rares dans « 4 ou plus » est ce qui permet de respecter la règle sur les effectifs attendus ; sans regroupement, la classe « 6 », par exemple, aurait un effectif attendu inférieur à 1.", "type": "qcm", "multiple": false, "reponse": "13,1 intervalles ; 3 degrés de liberté", "fiche": null, "verif": {"script": "verif/seance_math_5.py", "cles": ["Q03_att", "Q03_d_ddl_classes", "Q03_d_ddl_sans_estim", "Q03_d_egal4", "Q03_ddl", "Q03_exact", "Q03_exp", "Q03_lambda", "Q03_n_param", "Q03_p_bas", "Q03_p_queue", "Q03_p_queue_mc", "Q03_somme"]}}, {"id": "M5-04", "section": "math", "theme": "Covariance et corrélation, changement d'unités", "difficulte": 3, "temps_cible_s": 120, "correctes": ["a", "b", "d"], "enonce": "Pour un jour tiré au hasard dans l'année, \\(X\\) est la température à midi, en degrés Celsius, et \\(Y\\) le montant des ventes d'un glacier, en euros. L'écart-type de \\(X\\) vaut 5 °C, celui de \\(Y\\) vaut 40 euros, et leur covariance vaut 120 (en °C fois euro). On note \\(X' = 1{,}8\\,X + 32\\) la même température en degrés Fahrenheit.\n\nQuelles affirmations sont justes ?", "options": [{"id": "a", "texte": "La corrélation entre \\(X\\) et \\(Y\\) vaut 0,6, et la corrélation entre \\(X'\\) et \\(Y\\) aussi.", "correcte": true, "explication": "Juste : \\(120/(5 \\times 40) = 0{,}6\\), et un changement affine de pente positive ne change pas la corrélation, qui n'a pas d'unité."}, {"id": "b", "texte": "La covariance entre \\(X'\\) et \\(Y\\) vaut 216 (en °F fois euro).", "correcte": true, "explication": "Juste : \\(\\mathrm{Cov}(1{,}8\\,X + 32, Y) = 1{,}8 \\times 120 = 216\\). La constante 32 disparaît avec le centrage ; l'ajouter donnerait 248, ce qui est faux."}, {"id": "c", "texte": "La droite de régression de \\(Y\\) sur \\(X\\) a pour pente 0,6 euro par degré Celsius.", "correcte": false, "explication": "Faux : la pente est \\(\\mathrm{Cov}(X, Y)/\\mathrm{Var}(X) = 120/25 = 4{,}8\\) euros par degré Celsius. La corrélation est sans unité et ne se lit pas comme une pente."}, {"id": "d", "texte": "Si l'on remplace \\(Y\\) par \\(-Y\\), la covariance et la corrélation avec \\(X\\) changent de signe sans changer de valeur absolue.", "correcte": true, "explication": "Juste : \\(\\mathrm{Cov}(X, -Y) = -\\mathrm{Cov}(X, Y)\\) et l'écart-type de \\(-Y\\) est celui de \\(Y\\), donc la corrélation devient \\(-0{,}6\\)."}], "solution": "Réponse : sont justes les affirmations sur la corrélation inchangée (\\(0{,}6\\)), sur la covariance \\(216\\) en degrés Fahrenheit et sur le changement de signe ; l'affirmation sur la pente est fausse.\n\nRègle (leçon, partie 2, (K1)) : \\(\\mathrm{Cov}(aX + b, cY + d) = ac\\,\\mathrm{Cov}(X, Y)\\), et la corrélation est multipliée par le signe de \\(ac\\).\n\nÉtape 1, corrélation : \\(\\rho = 120/(5 \\times 40) = 0{,}6\\).\n\nÉtape 2, degrés Fahrenheit (\\(a = 1{,}8\\), \\(b = 32\\)) : covariance \\(1{,}8 \\times 120 = 216\\), écart-type de \\(X'\\) égal à \\(1{,}8 \\times 5 = 9\\) °F, corrélation \\(216/(9 \\times 40) = 0{,}6\\) (simulation de la covariance : 214,1).\n\nÉtape 3, pente : \\(\\mathrm{Cov}(X, Y)/\\mathrm{Var}(X) = 120/25 = 4{,}8\\) euros par degré Celsius, soit aussi \\(\\rho\\,\\sigma_Y/\\sigma_X = 0{,}6 \\times 40/5\\). En degrés Fahrenheit, elle devient \\(4{,}8/1{,}8 \\approx 2{,}67\\) euros par degré : la pente dépend des unités, la corrélation non.\n\nÉtape 4, signe : \\(a = 1\\), \\(c = -1\\), donc covariance \\(-120\\) et corrélation \\(-0{,}6\\).", "type": "qcm", "multiple": true, "reponse": "La corrélation entre \\(X\\) et \\(Y\\) vaut 0,6, et la corrélation entre \\(X'\\) et \\(Y\\) aussi. ; La covariance entre \\(X'\\) et \\(Y\\) vaut 216 (en °F fois euro). ; Si l'on remplace \\(Y\\) par \\(-Y\\), la covariance et la corrélation avec \\(X\\) changent de signe sans changer de valeur absolue.", "fiche": null, "verif": {"script": "verif/seance_math_5.py", "cles": ["Q04_cov_f", "Q04_cov_f_mc", "Q04_d_cov_affine", "Q04_pente", "Q04_pente_f", "Q04_rho", "Q04_sx_f"]}}, {"id": "M5-05", "section": "math", "theme": "Cote Z, comparaison de notes", "difficulte": 2, "temps_cible_s": 60, "enonce": "Trois candidats passent trois examens différents. Pour chaque examen, on donne la note du candidat, puis la moyenne et l'écart-type des notes de tous les candidats de cet examen.\n\n- Examen A : note 78 sur 100 ; moyenne 66, écart-type 8.\n- Examen B : note 1340 sur 1600 ; moyenne 1100, écart-type 200.\n- Examen C : note 15 sur 20 ; moyenne 11,4, écart-type 2.\n\nQuelle note est la meilleure en position relative, mesurée par la cote Z, et que vaut cette cote ?", "options": [{"id": "a", "texte": "Celle de l'examen C, de cote Z 1,8.", "correcte": true, "explication": "Oui : \\((15 - 11{,}4)/2 = 1{,}8\\), contre \\(1{,}5\\) pour A et \\(1{,}2\\) pour B."}, {"id": "b", "texte": "Celle de l'examen B, la plus éloignée de sa moyenne : 240 points.", "correcte": false, "explication": "Un écart en points dépend de l'échelle de l'examen. Rapporté à l'écart-type de 200 points, il ne vaut que \\(1{,}2\\) écart-type, la plus petite des trois cotes."}, {"id": "c", "texte": "Celle de l'examen B, qui atteint 83,75 % du barème.", "correcte": false, "explication": "Le pourcentage du barème ne dit rien de la position parmi les candidats : il ignore la moyenne et la dispersion des notes de chaque examen."}, {"id": "d", "texte": "Celle de l'examen C, de cote Z 3,6.", "correcte": false, "explication": "L'examen est le bon, mais \\(3{,}6\\) est l'écart à la moyenne en points, \\(15 - 11{,}4\\) : il reste à le diviser par l'écart-type 2."}], "solution": "Réponse : la note de l'examen C, de cote Z \\(1{,}8\\).\n\nLa cote Z d'une note \\(x\\) est \\(z = (x - \\mu)/\\sigma\\), où \\(\\mu\\) et \\(\\sigma\\) sont la moyenne et l'écart-type des notes de l'examen : le nombre d'écarts-types entre la note et la moyenne (leçon, partie 2). Elle n'a pas d'unité, ce qui permet de comparer des barèmes différents.\n\n- Examen A : \\((78 - 66)/8 = 1{,}5\\).\n- Examen B : \\((1340 - 1100)/200 = 1{,}2\\).\n- Examen C : \\((15 - 11{,}4)/2 = 1{,}8\\).\n\nLecture en rang, sous l'hypothèse supplémentaire que les notes de chaque examen suivent une loi normale : la proportion de candidats dépassés serait \\(0{,}933\\) pour A, \\(0{,}885\\) pour B et \\(0{,}964\\) pour C (simulation pour C : 0,964). Sans hypothèse sur la forme des lois, les cotes comparent des positions en écarts-types, pas des rangs.", "type": "qcm", "multiple": false, "reponse": "Celle de l'examen C, de cote Z 1,8.", "fiche": null, "verif": {"script": "verif/seance_math_5.py", "cles": ["Q05_d_ecart_b", "Q05_d_ecart_c", "Q05_d_pct_b", "Q05_phi_a", "Q05_phi_b", "Q05_phi_c", "Q05_phi_c_mc", "Q05_za", "Q05_zb", "Q05_zc"]}}, {"id": "M5-06", "section": "math", "theme": "Asymétrie : moyenne, médiane et mode d'une loi log-normale", "difficulte": 3, "temps_cible_s": 90, "correctes": ["a", "b"], "enonce": "La variable aléatoire \\(X\\) est strictement positive, et \\(\\ln X\\) suit la loi normale d'espérance 0 et de variance 1 : \\(X\\) suit une loi log-normale.\n\nQuelles affirmations sont justes ?", "options": [{"id": "a", "texte": "La médiane de \\(X\\) vaut 1.", "correcte": true, "explication": "Juste : l'exponentielle est croissante, donc \\(\\mathbb{P}(X \\le 1) = \\mathbb{P}(\\ln X \\le 0) = 1/2\\). Une fonction croissante transporte la médiane."}, {"id": "b", "texte": "L'espérance de \\(X\\) vaut \\(e^{1/2} \\approx 1{,}649\\).", "correcte": true, "explication": "Juste : \\(\\mathbb{E}[e^{Y}] = e^{1/2}\\) pour \\(Y\\) de loi \\(\\mathcal{N}(0, 1)\\). L'espérance, elle, n'est pas transportée par l'exponentielle : elle dépasse \\(e^{\\mathbb{E}[\\ln X]} = 1\\) (inégalité de Jensen)."}, {"id": "c", "texte": "Le mode de \\(X\\) vaut \\(e^{-1/2} \\approx 0{,}607\\).", "correcte": false, "explication": "Faux : le mode vaut \\(e^{-1} \\approx 0{,}368\\). L'exposant est \\(a - b^2\\) avec \\(a = 0\\) et \\(b^2 = 1\\) ; \\(1/2\\) est le terme \\(b^2/2\\) de la moyenne, pas celui du mode."}, {"id": "d", "texte": "Pour toute loi de variance finie dont le coefficient d'asymétrie est strictement positif, la moyenne est supérieure à la médiane.", "correcte": false, "explication": "Faux : c'est une règle empirique, vraie ici, mais pas un théorème. La loi qui vaut \\(-2\\), 1, 4 avec probabilités 0,4, 0,5, 0,1 a une asymétrie positive (\\(0{,}366\\)), une moyenne de \\(0{,}1\\) et une médiane de 1 (leçon, partie 1)."}], "solution": "Réponse : seules les affirmations sur la médiane (1) et sur l'espérance (\\(e^{1/2} \\approx 1{,}649\\)) sont justes.\n\nNotations : \\(X = e^{Y}\\) avec \\(Y\\) de loi \\(\\mathcal{N}(0, 1)\\) ; dans les formules de la leçon (partie 1), \\(a = 0\\) et \\(b = 1\\).\n\nÉtape 1, médiane : \\(\\mathbb{P}(X \\le e^0) = \\mathbb{P}(Y \\le 0) = 1/2\\), donc la médiane vaut 1 (simulation de \\(\\mathbb{P}(X \\le 1)\\) : 0,500).\n\nÉtape 2, moyenne : \\(\\mathbb{E}[e^{Y}] = e^{1/2} \\approx 1{,}649\\) (fonction génératrice de la loi normale ; simulation : 1,648).\n\nÉtape 3, mode : la densité de \\(X\\) en \\(x\\) est \\(\\varphi(\\ln x)/x\\) ; avec \\(t = \\ln x\\), son logarithme vaut \\(-t^2/2 - t\\) à une constante près, maximal en \\(t = -1\\). Le mode est \\(e^{-1} \\approx 0{,}368\\).\n\nÉtape 4 : mode < médiane < moyenne (\\(0{,}368 < 1 < 1{,}649\\)), avec un coefficient d'asymétrie \\((e + 2)\\sqrt{e - 1} \\approx 6{,}18\\). La loi log-normale suit la règle empirique, mais la règle n'est pas générale : ce qui vaut pour toute loi de variance finie, c'est que l'écart entre moyenne et médiane ne dépasse pas l'écart-type (ici \\(2{,}161\\)).", "type": "qcm", "multiple": true, "reponse": "La médiane de \\(X\\) vaut 1. ; L'espérance de \\(X\\) vaut \\(e^{1/2} \\approx 1{,}649\\).", "fiche": null, "verif": {"script": "verif/seance_math_5.py", "cles": ["La_B_med", "La_B_moy", "La_B_skew", "Q06_d_mode", "Q06_med", "Q06_med_p_mc", "Q06_mode", "Q06_moy", "Q06_moy_mc", "Q06_sigma", "Q06_skew"]}}, {"id": "M5-07", "section": "math", "theme": "Processus de Poisson, intensité la plus probable a posteriori dans une liste", "difficulte": 4, "temps_cible_s": 150, "enonce": "Des appels arrivent selon un processus de Poisson dont l'intensité \\(\\Lambda\\), en appels par heure, est inconnue. On sait que \\(\\Lambda\\) vaut 0,5, 1, 2 ou 4, et la loi a priori donne à chaque valeur \\(\\lambda\\) de cette liste un poids proportionnel à \\(1/\\lambda\\). On observe exactement 3 appels pendant 2 heures.\n\nOn donne \\(e^{-1} \\approx 0{,}3679\\), \\(e^{-2} \\approx 0{,}1353\\), \\(e^{-4} \\approx 0{,}0183\\), \\(e^{-8} \\approx 0{,}00034\\).\n\nQuelle est la valeur de \\(\\Lambda\\) la plus probable a posteriori, et quelle est sa probabilité a posteriori ?", "options": [{"id": "a", "texte": "1 appel par heure, avec la probabilité 0,442", "correcte": true, "explication": "Oui : les poids a posteriori sont proportionnels à \\(\\lambda^{2} e^{-2\\lambda}\\), soit \\((0{,}0920 ; 0{,}1353 ; 0{,}0733 ; 0{,}0054)\\), et \\(0{,}1353/0{,}3059 = 0{,}442\\)."}, {"id": "b", "texte": "2 appels par heure, avec la probabilité 0,419", "correcte": false, "explication": "C'est le résultat pour un a priori uniforme sur la liste, c'est-à-dire la vraisemblance \\(\\lambda^3 e^{-2\\lambda}\\) seule. L'a priori en \\(1/\\lambda\\) retire une puissance de \\(\\lambda\\) et favorise les petites intensités."}, {"id": "c", "texte": "1,5 appel par heure, le nombre d'appels divisé par la durée", "correcte": false, "explication": "\\(3/2\\) est le maximum de vraisemblance sur tous les réels positifs. Il n'appartient pas à la liste des valeurs possibles de \\(\\Lambda\\), et il ignore la loi a priori."}, {"id": "d", "texte": "0,5 appel par heure, avec la probabilité 0,533", "correcte": false, "explication": "C'est la valeur la plus probable **a priori**, avec son poids a priori \\(2/3{,}75\\). Les 3 appels observés en 2 heures rendent cette petite intensité moins plausible."}], "solution": "Réponse : 1 appel par heure, de probabilité a posteriori \\(0{,}442\\).\n\nNotations : \\(N\\) est le nombre d'appels en \\(t = 2\\) heures ; sachant \\(\\Lambda = \\lambda\\), \\(N\\) suit la loi de Poisson de paramètre \\(2\\lambda\\).\n\nÉtape 1, formule (leçon, partie 5, (B1)) : le poids a posteriori de \\(\\lambda\\) est proportionnel à l'a priori fois la vraisemblance, \\(\\tfrac{1}{\\lambda} \\times \\lambda^3 e^{-2\\lambda} = \\lambda^2 e^{-2\\lambda}\\) ; les facteurs communs \\(2^3/3!\\) et la constante de l'a priori se simplifient.\n\nÉtape 2, calcul pour \\(\\lambda = 0{,}5\\), 1, 2, 4 : \\(0{,}25\\,e^{-1}\\), \\(e^{-2}\\), \\(4\\,e^{-4}\\), \\(16\\,e^{-8}\\), soit \\((0{,}0920 ; 0{,}1353 ; 0{,}0733 ; 0{,}0054)\\), de somme \\(0{,}3059\\).\n\nÉtape 3, normalisation : probabilités a posteriori \\((0{,}301 ; 0{,}442 ; 0{,}239 ; 0{,}018)\\). La plus grande est celle de \\(\\lambda = 1\\) : \\(0{,}442\\) (simulation : 0,441).\n\nComparaison : avec un a priori uniforme sur la liste, les poids seraient \\(\\lambda^3 e^{-2\\lambda}\\), les probabilités a posteriori \\((0{,}132 ; 0{,}387 ; 0{,}419 ; 0{,}061)\\), et la valeur la plus probable serait 2. Le maximum de vraisemblance sans contrainte vaut \\(1{,}5\\), entre les deux : l'a priori décide.", "type": "qcm", "multiple": false, "reponse": "1 appel par heure, avec la probabilité 0,442", "fiche": null, "verif": {"script": "verif/seance_math_5.py", "cles": ["Q07_d_prior", "Q07_d_unif_2", "Q07_e1", "Q07_e2", "Q07_e4", "Q07_e8", "Q07_emv", "Q07_exact", "Q07_mc", "Q07_noyau", "Q07_post", "Q07_post_unif", "Q07_somme_noyau"]}}, {"id": "M5-08", "section": "math", "theme": "Bâton coupé en quatre, deuxième plus petit morceau", "difficulte": 5, "temps_cible_s": 150, "enonce": "Un bâton de longueur 1 est coupé en quatre morceaux par trois points tirés indépendamment et uniformément sur le bâton. On range les quatre longueurs par ordre croissant.\n\nQuelle est l'espérance de la deuxième plus petite longueur ?", "options": [{"id": "a", "texte": "\\(\\tfrac{7}{48}\\)", "correcte": true, "explication": "Oui : \\(\\tfrac14\\big(\\tfrac14 + \\tfrac13\\big) = \\tfrac{7}{48} \\approx 0{,}1458\\)."}, {"id": "b", "texte": "\\(\\tfrac{1}{16}\\)", "correcte": false, "explication": "C'est \\(1/n^2\\) avec \\(n = 4\\), l'espérance du **plus petit** morceau. Le deuxième ajoute le terme \\(\\tfrac14 \\times \\tfrac13\\)."}, {"id": "c", "texte": "\\(\\tfrac{1}{8}\\)", "correcte": false, "explication": "C'est deux fois l'espérance du plus petit morceau. Les écarts entre longueurs triées successives ne sont pas égaux : le deuxième écart vaut \\(\\tfrac14 \\times \\tfrac13\\), plus grand que le premier, \\(\\tfrac14 \\times \\tfrac14\\)."}, {"id": "d", "texte": "\\(\\tfrac{1}{5}\\)", "correcte": false, "explication": "C'est \\(2/(1 + 2 + 3 + 4)\\) : des longueurs triées supposées proportionnelles à leur rang. La formule \\(k/(n+1)\\) vaut pour les **positions** de points uniformes triés, pas pour les longueurs triées des morceaux."}], "solution": "Réponse : \\(\\tfrac14\\big(\\tfrac14 + \\tfrac13\\big) = \\tfrac{7}{48} \\approx 0{,}1458\\).\n\nNotations : \\(n = 4\\) morceaux, de longueurs triées \\(L_{(1)} \\le L_{(2)} \\le L_{(3)} \\le L_{(4)}\\).\n\nÉtape 1, représentation (leçon, partie 6, (E5)) : les quatre morceaux ont la loi de \\((E_1/T, \\dots, E_4/T)\\), où les \\(E_i\\) sont des exponentielles indépendantes de paramètre 1 et \\(T\\) leur somme, et ce vecteur est indépendant de \\(T\\).\n\nÉtape 2, exponentielles triées : la plus petite est le minimum de 4 exponentielles, d'espérance \\(1/4\\) ; par absence de mémoire, l'attente supplémentaire jusqu'à la deuxième est le minimum de 3 exponentielles, d'espérance \\(1/3\\). Donc \\(\\mathbb{E}[E_{(2)}] = \\tfrac14 + \\tfrac13\\).\n\nÉtape 3, retour au bâton : \\(E_{(2)} = (E_{(2)}/T) \\times T\\), produit de deux variables indépendantes, avec \\(\\mathbb{E}[T] = 4\\). Donc \\(\\mathbb{E}[L_{(2)}] = \\tfrac14\\big(\\tfrac14 + \\tfrac13\\big) = \\tfrac{7}{48}\\).\n\nContrôle : les quatre espérances \\(\\tfrac{1}{16}\\), \\(\\tfrac{7}{48}\\), \\(\\tfrac{13}{48}\\), \\(\\tfrac{25}{48}\\) ont pour somme 1. Simulation du bâton (script) : 0,1458.", "type": "qcm", "multiple": false, "reponse": "\\(\\tfrac{7}{48}\\)", "fiche": null, "verif": {"script": "verif/seance_math_5.py", "cles": ["Q08_3e_den", "Q08_3e_num", "Q08_d_double_den", "Q08_d_double_num", "Q08_d_min_den", "Q08_d_min_num", "Q08_d_rang_den", "Q08_d_rang_num", "Q08_exact", "Q08_exact_den", "Q08_exact_num", "Q08_max_den", "Q08_max_num", "Q08_mc"]}}, {"id": "M5-09", "section": "math", "theme": "Bâton coupé en trois, loi des morceaux", "difficulte": 4, "temps_cible_s": 150, "correctes": ["a", "b", "d"], "enonce": "Un bâton de longueur 1 est coupé en trois morceaux par deux points tirés indépendamment et uniformément sur le bâton. Le « morceau de gauche » va de l'extrémité gauche au premier point de coupe, le « morceau du milieu » est compris entre les deux points de coupe.\n\nQuelles affirmations sont justes ?", "options": [{"id": "a", "texte": "L'espérance de la longueur du plus grand des trois morceaux vaut \\(\\tfrac{11}{18}\\).", "correcte": true, "explication": "Juste : \\(\\tfrac13\\big(\\tfrac13 + \\tfrac12 + 1\\big) = \\tfrac{11}{18}\\), par la formule du \\(k\\)-ième plus petit morceau avec \\(k = n = 3\\)."}, {"id": "b", "texte": "La probabilité que le plus petit morceau mesure plus de 0,1 vaut 0,49.", "correcte": true, "explication": "Juste : \\(\\mathbb{P}(L_{(1)} > x) = (1 - 3x)^2\\), soit \\(0{,}7^2 = 0{,}49\\) pour \\(x = 0{,}1\\) : on réserve 0,1 à chaque morceau, il reste un bâton de longueur 0,7."}, {"id": "c", "texte": "La probabilité que les trois morceaux puissent former un triangle vaut \\(\\tfrac{1}{2}\\).", "correcte": false, "explication": "Faux : elle vaut \\(\\tfrac{1}{4}\\). Il faut que le plus grand morceau soit sous \\(1/2\\), et \\(\\mathbb{P}(L_{(3)} \\ge 1/2) = 3 \\times (1/2)^2 = 3/4\\). La valeur \\(1/2\\) vient d'un argument de symétrie sans fondement : rien ne dit que le plus grand morceau est au-dessus ou au-dessous de \\(1/2\\) avec la même probabilité."}, {"id": "d", "texte": "Le morceau de gauche et le morceau du milieu ont la même loi.", "correcte": true, "explication": "Juste : chaque morceau vérifie \\(\\mathbb{P}(L_j > x) = (1 - x)^2\\), quelle que soit sa place. En revanche ils ne sont pas indépendants : leur corrélation vaut \\(-0{,}5\\)."}], "solution": "Réponse : sont justes l'espérance \\(\\tfrac{11}{18}\\) du plus grand morceau, la probabilité \\(0{,}49\\) et l'égalité des lois du morceau de gauche et du morceau du milieu ; la probabilité de former un triangle vaut \\(\\tfrac{1}{4}\\), pas \\(\\tfrac{1}{2}\\).\n\nTout vient de la loi conjointe (leçon, partie 6, (E1)) : pour des réels positifs \\(c_1, c_2, c_3\\) de somme \\(c \\le 1\\), \\(\\mathbb{P}(L_1 > c_1, L_2 > c_2, L_3 > c_3) = (1 - c)^2\\).\n\nÉtape 1, même loi : avec un seul \\(c_j = x\\) non nul, \\(\\mathbb{P}(L_j > x) = (1 - x)^2\\), pour le morceau de gauche comme pour celui du milieu. Par exemple \\(\\mathbb{P}(L_j > 1/3) = \\tfrac{4}{9}\\) (simulations : 0,445 à gauche, 0,444 au milieu).\n\nÉtape 2, plus petit morceau : avec \\(c_1 = c_2 = c_3 = 0{,}1\\), \\(\\mathbb{P}(L_{(1)} > 0{,}1) = (1 - 0{,}3)^2 = 0{,}49\\) (simulation : 0,491).\n\nÉtape 3, triangle : il faut \\(L_{(3)} < 1/2\\). Deux morceaux ne peuvent pas dépasser \\(1/2\\) tous les deux, donc \\(\\mathbb{P}(L_{(3)} \\ge 1/2) = 3 \\times (1 - 1/2)^2 = 3/4\\), et la probabilité cherchée vaut \\(\\tfrac{1}{4}\\) (simulation : 0,250).\n\nÉtape 4, plus grand morceau : \\(\\mathbb{E}[L_{(3)}] = \\tfrac13\\big(\\tfrac13 + \\tfrac12 + 1\\big) = \\tfrac{11}{18} \\approx 0{,}611\\) (leçon, (E3) ; simulation : 0,611).", "type": "qcm", "multiple": true, "reponse": "L'espérance de la longueur du plus grand des trois morceaux vaut \\(\\tfrac{11}{18}\\). ; La probabilité que le plus petit morceau mesure plus de 0,1 vaut 0,49. ; Le morceau de gauche et le morceau du milieu ont la même loi.", "fiche": null, "verif": {"script": "verif/seance_math_5.py", "cles": ["Q09_corr", "Q09_d_triangle_den", "Q09_d_triangle_num", "Q09_gauche_mc", "Q09_max", "Q09_max_den", "Q09_max_mc", "Q09_max_num", "Q09_milieu_mc", "Q09_p_min", "Q09_p_min_mc", "Q09_p_tiers_den", "Q09_p_tiers_num", "Q09_triangle_den", "Q09_triangle_mc", "Q09_triangle_num"]}}, {"id": "M5-10", "section": "math", "theme": "Densité conjointe, probabilité sachant X = x", "difficulte": 3, "temps_cible_s": 120, "enonce": "Le couple \\((X, Y)\\) a pour densité conjointe \\(f(x, y) = c\\,(x + 2y)\\) pour \\(0 \\le x \\le 1\\) et \\(0 \\le y \\le 1\\), et \\(f(x, y) = 0\\) ailleurs, où \\(c\\) est la constante de normalisation.\n\nQue vaut \\(\\mathbb{P}(Y > 1/2 \\mid X = 1/4)\\) ?", "options": [{"id": "a", "texte": "\\(\\tfrac{7}{10}\\)", "correcte": true, "explication": "Oui : \\(\\int_{1/2}^{1} f(1/4, y)\\,dy = \\tfrac{7}{12}\\), divisé par \\(f_X(1/4) = \\tfrac{5}{6}\\)."}, {"id": "b", "texte": "\\(\\tfrac{2}{3}\\)", "correcte": false, "explication": "C'est \\(\\mathbb{P}(Y > 1/2)\\) sans condition. \\(X\\) et \\(Y\\) ne sont pas indépendantes (\\(x + 2y\\) n'est pas un produit) : savoir \\(X = 1/4\\) change la loi de \\(Y\\)."}, {"id": "c", "texte": "\\(\\tfrac{7}{12}\\)", "correcte": false, "explication": "C'est \\(\\int_{1/2}^{1} f(1/4, y)\\,dy\\), le numérateur seul. Il faut le diviser par la densité marginale \\(f_X(1/4)\\) pour que la densité conditionnelle ait une intégrale égale à 1."}, {"id": "d", "texte": "\\(\\tfrac{1}{2}\\)", "correcte": false, "explication": "Ce serait vrai si, sachant \\(X = 1/4\\), \\(Y\\) était uniforme sur \\([0, 1]\\). La densité conditionnelle est proportionnelle à \\(1/4 + 2y\\), croissante en \\(y\\) : elle favorise les grandes valeurs."}], "solution": "Réponse : \\(\\tfrac{7}{10}\\).\n\nÉtape 1, normalisation : \\(\\int_0^1 \\int_0^1 (x + 2y)\\,dx\\,dy = \\tfrac12 + 1 = \\tfrac32\\), donc \\(c = \\tfrac{2}{3}\\).\n\nÉtape 2, marginale : \\(f_X(x) = \\tfrac23 \\int_0^1 (x + 2y)\\,dy = \\tfrac23\\,(x + 1)\\), donc \\(f_X(1/4) = \\tfrac{5}{6}\\).\n\nÉtape 3, conditionnelle (leçon, partie 4) : \\(f_{Y \\mid X}(y \\mid x) = \\dfrac{f(x, y)}{f_X(x)} = \\dfrac{x + 2y}{x + 1}\\) pour \\(0 \\le y \\le 1\\) ; la constante \\(c\\) se simplifie.\n\nÉtape 4 : \\(\\mathbb{P}(Y > 1/2 \\mid X = 1/4) = \\dfrac{\\int_{1/2}^{1} (1/4 + 2y)\\,dy}{1/4 + 1} = \\dfrac{1/8 + 3/4}{5/4} = \\tfrac{7}{10}\\).\n\nContrôles : sans condition, \\(\\mathbb{P}(Y > 1/2) = \\tfrac{2}{3}\\) (simulation : 0,667) ; simulation de la probabilité conditionnelle, dans une bande étroite autour de \\(x = 1/4\\) : 0,700.", "type": "qcm", "multiple": false, "reponse": "\\(\\tfrac{7}{10}\\)", "fiche": null, "verif": {"script": "verif/seance_math_5.py", "cles": ["Q10_c_den", "Q10_c_num", "Q10_d_joint_den", "Q10_d_joint_num", "Q10_d_marg_den", "Q10_d_marg_num", "Q10_d_unif_den", "Q10_d_unif_num", "Q10_exact_den", "Q10_exact_num", "Q10_fx_den", "Q10_fx_num", "Q10_marg_mc", "Q10_mc"]}}, {"id": "M5-11", "section": "math", "theme": "Densité conjointe sur un domaine non rectangulaire, lois marginales et conditionnelles", "difficulte": 4, "temps_cible_s": 150, "correctes": ["a", "b"], "enonce": "Le couple \\((X, Y)\\) a pour densité conjointe \\(f(x, y) = 2\\,e^{-x-y}\\) pour \\(0 < x < y\\), et \\(f(x, y) = 0\\) ailleurs.\n\nQuelles affirmations sont justes ?", "options": [{"id": "a", "texte": "\\(X\\) suit la loi exponentielle de paramètre 2.", "correcte": true, "explication": "Juste : \\(f_X(x) = 2e^{-x} \\int_x^\\infty e^{-y}\\,dy = 2e^{-2x}\\). Son espérance vaut \\(\\tfrac{1}{2}\\)."}, {"id": "b", "texte": "Sachant \\(X = x\\), la variable \\(Y - x\\) suit la loi exponentielle de paramètre 1.", "correcte": true, "explication": "Juste : \\(f_{Y \\mid X}(y \\mid x) = 2e^{-x-y}/(2e^{-2x}) = e^{-(y - x)}\\) pour \\(y > x\\), densité de \\(x\\) plus une exponentielle de paramètre 1."}, {"id": "c", "texte": "\\(X\\) et \\(Y\\) sont indépendantes, car \\(f(x, y) = 2e^{-x} \\times e^{-y}\\) est un produit d'une fonction de \\(x\\) par une fonction de \\(y\\).", "correcte": false, "explication": "Faux : le domaine \\(0 < x < y\\) n'est pas un pavé. Savoir \\(X = x\\) impose \\(Y > x\\) ; d'ailleurs \\(\\mathrm{Cov}(X, Y) = \\tfrac{1}{4}\\), non nulle."}, {"id": "d", "texte": "\\(Y\\) suit la loi exponentielle de paramètre 1.", "correcte": false, "explication": "Faux : \\(f_Y(y) = 2e^{-y} \\int_0^y e^{-x}\\,dx = 2e^{-y}(1 - e^{-y})\\), d'espérance \\(\\tfrac{3}{2}\\) et non 1. C'est la loi conditionnelle de \\(Y - x\\) qui est exponentielle, pas la loi de \\(Y\\)."}], "solution": "Réponse : seules les affirmations « \\(X\\) suit la loi exponentielle de paramètre 2 » et « sachant \\(X = x\\), \\(Y - x\\) suit la loi exponentielle de paramètre 1 » sont justes.\n\nÉtape 1, marginale de \\(X\\) : à \\(x\\) fixé, \\(y\\) va de \\(x\\) à l'infini. \\(f_X(x) = \\int_x^\\infty 2e^{-x-y}\\,dy = 2e^{-x} \\cdot e^{-x} = 2e^{-2x}\\) pour \\(x > 0\\) : loi exponentielle de paramètre 2, d'espérance \\(\\tfrac{1}{2}\\) (simulation : 0,500).\n\nÉtape 2, conditionnelle : \\(f_{Y \\mid X}(y \\mid x) = \\dfrac{2e^{-x-y}}{2e^{-2x}} = e^{-(y - x)}\\) pour \\(y > x\\). Ainsi \\(\\mathbb{P}(Y > x + 1 \\mid X = x) = e^{-1} \\approx 0{,}368\\) pour tout \\(x\\) (simulation autour de \\(x = 0{,}5\\) : 0,367).\n\nÉtape 3, marginale de \\(Y\\) : à \\(y\\) fixé, \\(x\\) va de 0 à \\(y\\). \\(f_Y(y) = 2e^{-y}(1 - e^{-y})\\), qui n'est pas une densité exponentielle : \\(\\mathbb{E}[Y] = \\tfrac{3}{2}\\) (simulation : 1,500) et \\(\\mathbb{P}(Y > 1) = 2e^{-1} - e^{-2} \\approx 0{,}600\\), contre \\(0{,}368\\) pour une exponentielle de paramètre 1.\n\nÉtape 4, indépendance : la formule est un produit, mais sur le domaine \\(0 < x < y\\), qui n'est pas un pavé (leçon, partie 4, (D4)). \\(f_X(x)\\,f_Y(y) > 0\\) pour \\(x > y > 0\\), où \\(f = 0\\) : pas d'indépendance.\n\nLecture : \\(f\\) est la densité du couple (minimum, maximum) de deux durées exponentielles indépendantes de paramètre 1. Le minimum est exponentiel de paramètre 2, puis la course recommence pour la durée restante (séance de mathématiques 2, résultats (A3) et (A5)).", "type": "qcm", "multiple": true, "reponse": "\\(X\\) suit la loi exponentielle de paramètre 2. ; Sachant \\(X = x\\), la variable \\(Y - x\\) suit la loi exponentielle de paramètre 1.", "fiche": null, "verif": {"script": "verif/seance_math_5.py", "cles": ["Q11_cov_den", "Q11_cov_num", "Q11_d_p_y1", "Q11_ex_den", "Q11_ex_mc", "Q11_ex_num", "Q11_ey_den", "Q11_ey_mc", "Q11_ey_num", "Q11_p_cond", "Q11_p_cond_mc", "Q11_p_y1"]}}, {"id": "M5-12", "section": "math", "theme": "Conditionnement, famille de trois enfants", "difficulte": 3, "temps_cible_s": 75, "enonce": "Une famille a trois enfants. Chaque enfant est une fille ou un garçon avec probabilité 1/2, indépendamment des autres. À la question « avez-vous au moins une fille ? », le parent répond oui, et il dit vrai.\n\nQuelle est la probabilité que les trois enfants soient des filles ?", "options": [{"id": "a", "texte": "\\(\\tfrac{1}{7}\\)", "correcte": true, "explication": "Oui : 7 des 8 familles équiprobables contiennent au moins une fille, et une seule est composée de trois filles."}, {"id": "b", "texte": "\\(\\tfrac{1}{4}\\)", "correcte": false, "explication": "C'est la réponse quand un enfant **désigné** est une fille (l'aîné, ou un enfant rencontré au hasard) : les deux autres sont alors des filles avec probabilité \\(1/2 \\times 1/2\\). Ici aucun enfant n'est désigné."}, {"id": "c", "texte": "\\(\\tfrac{1}{8}\\)", "correcte": false, "explication": "C'est la probabilité de trois filles avant toute information. La réponse du parent élimine la famille de trois garçons : la probabilité doit augmenter."}, {"id": "d", "texte": "\\(\\tfrac{1}{3}\\)", "correcte": false, "explication": "C'est la réponse du problème à deux enfants (trois familles possibles, une favorable). Avec trois enfants, l'information « au moins une fille » laisse sept familles possibles."}], "solution": "Réponse : \\(\\tfrac{1}{7}\\).\n\nUnivers : les 8 triplets (aîné, deuxième, benjamin) formés de F et de G, chacun de probabilité \\(1/8\\).\n\nÉtape 1, événement observé : le parent répond oui exactement quand la famille n'est pas GGG. L'événement contient 7 triplets, de probabilité totale \\(7/8\\).\n\nÉtape 2 : un seul de ces triplets est FFF, de probabilité \\(1/8\\). Donc \\(\\mathbb{P}(\\text{FFF} \\mid \\text{oui}) = \\dfrac{1/8}{7/8} = \\tfrac{1}{7}\\) (simulation : 0,143).\n\nComparaison (leçon, partie 7) : si l'on avait rencontré un enfant choisi au hasard et constaté que c'est une fille, la probabilité de trois filles serait \\(\\tfrac{1}{4}\\) (simulation : 0,251), car la famille FFF montre une fille trois fois plus souvent qu'une famille à une seule fille. La règle d'observation, et pas seulement la phrase « au moins une fille », fixe la réponse.", "type": "qcm", "multiple": false, "reponse": "\\(\\tfrac{1}{7}\\)", "fiche": null, "verif": {"script": "verif/seance_math_5.py", "cles": ["Q12_d_aine_den", "Q12_d_aine_num", "Q12_d_deux_den", "Q12_d_deux_num", "Q12_d_sans_den", "Q12_d_sans_num", "Q12_exact_den", "Q12_exact_num", "Q12_hasard_mc", "Q12_mc", "Q12_nb_issues"]}}]}]}</script>
<script>
'use strict';
const D = JSON.parse(document.getElementById('donnees').textContent);
const ITEMS = D.sections.flatMap(s => s.questions.map(q => Object.assign({ nomSection: s.nom }, q)));
const CLE = 'atelier-quant:' + D.id;
const SERVEUR = location.protocol.startsWith('http');
// La session survit à un rechargement de l'onglet : on se reconnecte alors au même noyau, variables comprises.
const SESSION = (() => { const neuve = Math.random().toString(36).slice(2) + Date.now().toString(36); try { const s = sessionStorage.getItem('atelier-quant:session') || neuve; sessionStorage.setItem('atelier-quant:session', s); return s; } catch (e) { return neuve; } })();
const page = document.getElementById('page');
const noyauxDemarres = {};
let E = etatNeuf('accueil');

function etatNeuf(phase) { return { phase, courant: 0, debut: null, fin: null, reponses: {}, temps: {}, ordre: {}, cellules: {}, code: {}, controles: {}, ordreControles: {}, vus: {}, partie: {}, enregistrement: null, pauseDepuis: null, pauseTotale: 0 }; }
// Options par défaut : la pause et « Je ne sais pas » sont permis, sauf si l'examen les interdit (examens blancs).
const PAUSE_PERMISE = D.options.pause !== false;
const NSP_PERMIS = D.options.je_ne_sais_pas !== false;
function dureeEcoulee(fin) { return (fin - E.debut - (E.pauseTotale || 0) - (E.pauseDepuis ? fin - E.pauseDepuis : 0)) / 1000; }
const NOTEES = ITEMS.filter(q => q.type !== 'lecon');
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(E)); } catch (e) {} }
function charger() { try { const s = localStorage.getItem(CLE); if (s) E = Object.assign(etatNeuf('accueil'), JSON.parse(s)); } catch (e) {} }
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function enLigne(t) { return esc(t).replace(/`([^`]+)`/g, '<code class="sans-math">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }

// Markdown réduit : titres #, tableaux |, listes - et 1., paragraphes, `code`, **gras**, blocs entre triples accents graves.
function rendre(t) {
  let h = '';
  String(t).split('```').forEach((bloc, i) => {
    if (i % 2) {
      const info = (bloc.match(/^(\w*)\n/) || [])[1];
      h += '<pre class="sans-math' + (info === 'sortie' ? ' sortie-lecon' : '') + '"><code>' + esc(bloc.replace(/^\w*\n/, '')) + '</code></pre>';
      return;
    }
    const lignes = bloc.split('\n');
    let k = 0;
    while (k < lignes.length) {
      const l = lignes[k];
      if (!l.trim()) { k++; continue; }
      const titre = l.match(/^(#{1,4})\s+(.*)$/);
      if (titre) { const n = Math.min(4, titre[1].length + 1); h += '<h' + n + '>' + enLigne(titre[2]) + '</h' + n + '>'; k++; continue; }
      if (l.trim().startsWith('|')) {
        const rangs = [];
        while (k < lignes.length && lignes[k].trim().startsWith('|')) { rangs.push(lignes[k].trim()); k++; }
        const cellules = r => r.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
        h += '<div class="defile"><table><tr>' + cellules(rangs[0]).map(c => '<th>' + enLigne(c) + '</th>').join('') + '</tr>';
        rangs.slice(1).filter(r => !/^\|[\s|:-]+\|$/.test(r)).forEach(r => { h += '<tr>' + cellules(r).map(c => '<td>' + enLigne(c) + '</td>').join('') + '</tr>'; });
        h += '</table></div>'; continue;
      }
      const puce = /^\s*[-*]\s+/, numero = /^\s*\d+\.\s+/;
      if (puce.test(l) || numero.test(l)) {
        const motif = puce.test(l) ? puce : numero, balise = motif === puce ? 'ul' : 'ol';
        h += '<' + balise + '>';
        while (k < lignes.length && motif.test(lignes[k])) { h += '<li>' + enLigne(lignes[k].replace(motif, '')) + '</li>'; k++; }
        h += '</' + balise + '>'; continue;
      }
      const par = [];
      while (k < lignes.length && lignes[k].trim() && !/^(#{1,4}\s|\s*\||\s*[-*]\s|\s*\d+\.\s)/.test(lignes[k])) { par.push(lignes[k]); k++; }
      const texte = par.join('\n').trim();
      // Un paragraphe réduit à une seule formule est centré ; une formule au milieu d'une phrase reste dans la ligne.
      const seule = texte.startsWith('\\(') && texte.endsWith('\\)') && texte.indexOf('\\(', 2) < 0;
      h += (seule ? '<p class="formule">' : '<p>') + enLigne(par.join('\n')) + '</p>';
    }
  });
  return h;
}
function composer(el) { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el || page]).catch(() => {}); }
function mmss(s) { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function melanger(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function api(chemin, corps) {
  const r = await fetch(chemin, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
  return r.json();
}

let dernierTic = null;
function tic() {
  const ch = document.getElementById('chrono');
  const bouton = document.getElementById('pause');
  bouton.hidden = !(PAUSE_PERMISE && E.phase === 'epreuve');
  document.getElementById('recommencerHaut').hidden = E.phase !== 'epreuve';
  document.getElementById('voile').hidden = !(E.phase === 'epreuve' && E.pauseDepuis);
  if (E.phase !== 'epreuve' || E.pauseDepuis) { dernierTic = null; return; }
  const maintenant = Date.now();
  if (dernierTic !== null) { const q = ITEMS[E.courant]; E.temps[q.id] = (E.temps[q.id] || 0) + (maintenant - dernierTic) / 1000; }
  dernierTic = maintenant;
  const reste = D.duree_minutes * 60 - dureeEcoulee(maintenant);
  ch.textContent = (reste < 0 ? '+' : '') + mmss(Math.abs(reste));
  ch.classList.toggle('depasse', reste < 0);
}
setInterval(() => { tic(); if (E.phase === 'epreuve') sauver(); }, 500);
if (SERVEUR) document.getElementById('lienAccueil').hidden = false;
document.getElementById('lienAccueil').onclick = () => {
  if (E.phase === 'epreuve' && PAUSE_PERMISE && !E.pauseDepuis) { tic(); E.pauseDepuis = Date.now(); sauver(); }
};
document.getElementById('recommencerHaut').onclick = () => {
  if (!confirm('Effacer ce passage (réponses, code, chronomètre) et revenir au début de la séance ?')) return;
  try { localStorage.removeItem(CLE); } catch (e) {}
  E = etatNeuf('accueil'); dernierTic = null; afficher();
};
document.getElementById('pause').onclick = () => { tic(); E.pauseDepuis = Date.now(); sauver(); tic(); };
document.getElementById('reprendre').onclick = () => {
  if (E.pauseDepuis) { E.pauseTotale = (E.pauseTotale || 0) + (Date.now() - E.pauseDepuis); E.pauseDepuis = null; }
  dernierTic = null; sauver(); tic();
};

// ------------------------------------------------------------------ accueil
function accueil() {
  page.className = '';
  document.getElementById('position').textContent = '';
  document.getElementById('chrono').textContent = mmss(D.duree_minutes * 60);
  let h = '<div class="carte presentation"><h2>' + esc(D.titre) + '</h2><p class="meta">' + D.duree_minutes + ' min · ' + NOTEES.length + ' question' + (NOTEES.length > 1 ? 's' : '') + (D.options.pause === false ? ' · sans pause' : '') + '</p>' + rendre(D.presentation);
  h += '<div class="sections-liste">';
  D.sections.forEach(s => { const n = s.questions.filter(q => q.type !== 'lecon').length; h += '<div><span>' + esc(s.nom) + '</span><span class="meta">' + (n ? n + ' question' + (n > 1 ? 's' : '') : 'leçon') + ' · ' + s.budget_min + ' min</span></div>'; });
  h += '</div>';
  D.avertissements.forEach(a => { h += '<div class="note">' + rendre(a) + '</div>'; });
  if (!SERVEUR && ITEMS.some(q => q.type === 'code')) h += '<div class="note"><p><strong>Le notebook ne peut pas s\'exécuter :</strong> cette page est ouverte comme un fichier. Lance <code class="sans-math">python lancer.py</code> dans le dossier du projet, puis ouvre l\'examen depuis la page qui s\'affiche.</p></div>';
  h += '<p class="meta">' + esc(D.conventions) + '</p>';
  h += '<div class="barre"><button class="principal" id="demarrer">Commencer</button></div></div>';
  page.innerHTML = h;
